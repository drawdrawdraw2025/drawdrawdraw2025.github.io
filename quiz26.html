,"I व III फक्त / I and III only"],ans:"B",exp:"PM-JANMAN (नोव्हेंबर 2023) ही 75 PVTG समुदायांच्या सर्वांगीण विकासासाठी असून घरकुल, रस्ते, पाणी, शिक्षण, आरोग्य असे 11 उपक्रम 18 मंत्रालयांमार्फत राबवले जातात."},{sec:3,q:"विधान (A): राष्ट्रीय खाद्यतेल अभियान-ऑईल पाम (NMEO-OP) अंतर्गत ईशान्य राज्ये व अंदमान-निकोबार यांवर विशेष भर आहे. कारण (R): ऑईल पाम लागवडीसाठी भरपूर पाऊस व उष्ण हवामान आवश्यक असते.",en:"Assertion (A): NMEO-Oil Palm focuses on NE states and Andaman-Nicobar. Reason (R): Oil palm needs high rainfall and warm climate.",opts:["A व R दोन्ही योग्य, R हे A चे योग्य स्पष्टीकरण / Both correct, R explains A","A व R दोन्ही योग्य पण R हे A चे स्पष्टीकरण नाही / Both correct but R doesn't explain A","A योग्य, R अयोग्य / A correct, R wrong","A अयोग्य, R योग्य / A wrong, R correct"],ans:"A",exp:"ऑईल पाम ही उष्णकटिबंधीय पीक असून 2000 मिमी पेक्षा जास्त पाऊस लागतो, म्हणून ईशान्य व बेटांवर भर देण्यात आला आहे."},{sec:3,q:"'एक राष्ट्र, एक निवडणूक' बद्दल: I. रामनाथ कोविंद समितीने 2024 मध्ये अहवाल दिला II. संविधान दुरुस्तीसाठी दोन-तृतीयांश बहुमत आवश्यक III. पहिल्या टप्प्यात लोकसभा व विधानसभा निवडणुका एकत्र घेण्याचा प्रस्ताव",en:"About 'One Nation, One Election': I. Kovind committee submitted report in 2024 II. Constitutional amendment needs two-thirds majority III. First phase proposes simultaneous Lok Sabha and Assembly polls",opts:["I व II फक्त / I and II only","I, II व III / I, II and III","II व III फक्त / II and III only","I व III फक्त / I and III only"],ans:"B",exp:"कोविंद समितीने (मार्च 2024) एकाच वेळी निवडणुकांची शिफारस केली असून त्यासाठी कलम 82A, 83, 172 इत्यादींमध्ये दुरुस्ती व विशेष बहुमत आवश्यक आहे."},{sec:3,q:"कालक्रम लावा: a. नारी शक्ती वंदन अधिनियम (106वी दुरुस्ती) b. 73वी घटनादुरुस्ती (महिला आरक्षण पंचायत) c. 74वी घटनादुरुस्ती (महिला आरक्षण नगरपालिका) d. महिला आरक्षण विधेयक पहिल्यांदा मांडले (1996)",en:"Chronology: a. Nari Shakti Vandan Act (106th Amendment) b. 73rd Amendment (women quota panchayat) c. 74th Amendment (women quota municipality) d. Women's Reservation Bill first tabled (1996)",opts:["d, b, c, a","b, c, d, a","d, c, b, a","b, d, c, a"],ans:"A",exp:"1996 मध्ये पहिल्यांदा विधेयक मांडले गेले, 1992-93 मध्ये 73वी-74वी दुरुस्तीने स्थानिक स्वराज्यात 33% आरक्षण, आणि 2023 मध्ये 106वी दुरुस्तीने लोकसभेत 33% आरक्षण."},{sec:3,q:"जोड्या लावा: a. PM SHRI शाळा - 1. NEP 2020 आदर्श शाळा b. उद्दिष्ट शाळा संख्या - 2. 14,500 c. निधी पद्धत - 3. केंद्र पुरस्कृत d. कालावधी - 4. 2022-27",en:"Match: a. PM SHRI Schools - 1. NEP 2020 model schools b. Target schools - 2. 14,500 c. Funding - 3. Centrally sponsored d. Period - 4. 2022-27",opts:["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-1, b-3, c-2, d-4","a-4, b-2, c-3, d-1"],ans:"A",exp:"PM SHRI (2022) अंतर्गत NEP 2020 नुसार 14,500 आदर्श शाळा विकसित केल्या जात असून ही केंद्र पुरस्कृत योजना 2022-27 कालावधीसाठी आहे."},{sec:3,q:"विधान (A): भारताने 2025 मध्ये पेट्रोलमध्ये 20% इथेनॉल मिश्रणाचे (E20) उद्दिष्ट गाठले. कारण (R): इथेनॉल मिश्रणामुळे कच्च्या तेलाची आयात कमी होऊन परकीय चलन वाचते.",en:"Assertion (A): India achieved 20% ethanol blending (E20) in petrol in 2025. Reason (R): Ethanol blending reduces crude oil imports saving foreign exchange.",opts:["A व R दोन्ही योग्य, R हे A चे योग्य स्पष्टीकरण / Both correct, R explains A","A व R दोन्ही योग्य पण R स्पष्टीकरण नाही / Both correct but R doesn't explain","A योग्य, R अयोग्य / A correct, R wrong","A अयोग्य, R योग्य / A wrong, R correct"],ans:"A",exp:"2025 मध्ये E20 उद्दिष्ट 5 वर्षे आधीच गाठले गेले असून त्यामुळे आयात खर्चात हजारो कोटींची बचत व शेतकऱ्यांना ऊस/धान्यापासून उत्पन्न मिळते."},{sec:3,q:"कारण (C): राष्ट्रीय क्षयरोग निर्मूलन कार्यक्रमाचे 2025 पर्यंत TB मुक्त भारताचे उद्दिष्ट ठेवण्यात आले. परिणाम (E): निक्षय पोषण योजनेअंतर्गत TB रुग्णांना थेट लाभ हस्तांतरण दिले जाते.",en:"Cause (C): NTEP set 2025 target for TB-free India. Effect (E): Ni-kshay Poshan Yojana gives DBT to TB patients.",opts:["C व E दोन्ही योग्य, E हा C चा परिणाम / Both correct, E is effect of C","C व E दोन्ही योग्य पण संबंध नाही / Both correct, no relation","C योग्य, E अयोग्य / C correct, E wrong","C अयोग्य, E योग्य / C wrong, E correct"],ans:"A",exp:"जागतिक उद्दिष्ट 2030 असताना भारताने 2025 चे महत्त्वाकांक्षी उद्दिष्ट ठेवले असून पोषण सहाय्यासाठी DBT द्वारे प्रतिमाह सहाय्य दिले जाते."},{sec:3,q:"SVAMITVA योजनेबद्दल: I. ग्रामीण वस्त्यांतील मालमत्ता धारकांना 'घरकुल' अधिकारपत्र देते II. ड्रोन तंत्रज्ञानाने गावांचे नकाशांकन केले जाते III. पंचायती राज मंत्रालयामार्फत राबवली जाते",en:"About SVAMITVA: I. Gives property cards to rural households II. Drone mapping of villages III. Implemented by Ministry of Panchayati Raj",opts:["I व II फक्त / I and II only","I, II व III / I, II and III","II व III फक्त / II and III only","I व III फक्त / I and III only"],ans:"B",exp:"SVAMITVA (2020) अंतर्गत ड्रोन सर्वेक्षणाने ग्रामीण मालमत्तांचे अधिकारपत्र दिले जाते, ज्यामुळे कर्ज व वाद निवारण सोपे होते."},{sec:3,q:"जोड्या लावा: a. PM-AJAY - 1. अनुसूचित जाती कल्याण b. घटक - 2. आदर्श ग्राम, हॉस्टेल, अनुदान c. मंत्रालय - 3. सामाजिक न्याय d. पूर्वीची नावे - 4. PMAGY, SCA, बाबू जगजीवन राम योजना यांचे विलीनीकरण",en:"Match: a. PM-AJAY - 1. SC welfare b. Components - 2. Adarsh Gram, hostels, grants c. Ministry - 3. Social Justice d. Merged schemes - 4. PMAGY, SCA, Babu Jagjivan Ram schemes",opts:["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-1, b-3, c-2, d-4","a-3, b-2, c-1, d-4"],ans:"A",exp:"PM-AJAY (2021) ही अनुसूचित जातींसाठीची एकत्रित योजना असून आदर्श ग्राम, निवासी शाळा व जिल्हा/राज्य अनुदान हे तिचे मुख्य घटक आहेत."},{sec:3,q:"विधान (A): नमामि गंगे अभियानाच्या दुसऱ्या टप्प्यात जैवविविधता संवर्धनावर विशेष भर देण्यात आला. कारण (R): गंगा नदीत डॉल्फिन, घडियाल यांसारख्या धोक्यात असलेल्या प्रजाती आढळतात.",en:"Assertion (A): Namami Gange Phase II emphasizes biodiversity conservation. Reason (R): Ganga hosts endangered species like dolphins and gharials.",opts:["A व R दोन्ही योग्य, R हे A चे योग्य स्पष्टीकरण / Both correct, R explains A","दोन्ही योग्य पण संबंध नाही / Both correct, no relation","A योग्य, R अयोग्य / A correct, R wrong","A अयोग्य, R योग्य / A wrong, R c II फक्त / II and III only","I व III फक्त / I and III only"],ans:"B",exp:"केहरसिंग (1989) व एपुरू सुधाकर (2006) खटल्यांनुसार स्वेच्छाचारी क्षमादान न्यायालयीन पुनर्विलोकनास पात्र असून मंत्रिसल्ला बंधनकारक आहे."},{sec:6,q:"विधान (A): कलम 74 नुसार राष्ट्रपतींना सहाय्यासाठी मंत्रिमंडळ असते व त्यांचा सल्ला बंधनकारक असतो. कारण (R): 42वी दुरुस्तीने सल्ला बंधनकारक केला, 44वीने एकदा पुनर्विचाराची तरतूद दिली.",en:"Assertion (A): Art 74 provides CoM aiding President with binding advice. Reason (R): 42nd made advice binding, 44th allowed one reconsideration.",opts:["दोन्ही योग्य, R हे A चे योग्य स्पष्टीकरण / Both correct, R explains A","दोन्ही योग्य पण संबंध नाही / Both correct, no relation","A योग्य, R अयोग्य / A correct, R wrong","A अयोग्य, R योग्य / A wrong, R correct"],ans:"A",exp:"संसदीय पद्धतीनुसार वास्तविक सत्ता पंतप्रधानांच्या नेतृत्वाखालील मंत्रिमंडळाकडे असून राष्ट्रपती नामधारी प्रमुख आहेत."},{sec:6,q:"जोड्या लावा: a. कलम 78 - 1. पंतप्रधानांची कर्तव्ये b. माहिती देणे - 2. राष्ट्रपतींना c. विधेयके - 3. संमतीसाठी सादर d. प्रशासन - 4. निर्णय कळवणे",en:"Match: a. Art 78 - 1. PM's duties b. Inform - 2. President c. Bills - 3. Present for assent d. Administration - 4. Communicate decisions",opts:["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-1, b-3, c-2, d-4","a-3, b-2, c-1, d-4"],ans:"A",exp:"कलम 78 नुसार पंतप्रधानांनी मंत्रिमंडळाचे निर्णय, विधिविधाने व माहिती राष्ट्रपतींना कळवणे बंधनकारक आहे."},{sec:6,q:"तक्ता पूर्ण करा (संसद विशेषाधिकार कलम 105): a. भाषण स्वातंत्र्य - 1. ? b. प्रकाशन संरक्षण - 2. ? c. न्यायालयीन - 3. ?",en:"Complete table (Art 105 privileges): a. Speech freedom - 1. ? b. Publication protection - 2. ? c. Judicial - 3. ?",opts:["a-संसदेत / in Parliament, b-अहवाल प्रकाशनास / report publication, c-न्यायालयीन चौकशीपासून सूट नाही / no exemption","a-सर्वत्र / everywhere, b-खाजगी पत्रकास / private pamphlets, c-पूर्ण सूट / full exemption","a-संसदेत / in Parliament, b-फक्त शासकीय / only official, c-पूर्ण सूट / full exemption","a-न्यायालयात / in court, b-अहवालास / reports, c-सूट नाही / no exemption"],ans:"A",exp:"कलम 105 नुसार संसदेतील भाषणास पूर्ण स्वातंत्र्य व अधिकृत अहवाल प्रकाशनास संरक्षण असले तरी गुन्हेगारी कृत्यांना सूट नाही."},{sec:6,q:"धनविधेयकाबद्दल (कलम 110): I. फक्त लोकसभेत मांडता येते II. राष्ट्रपतींच्या पूर्वसंमतीने III. राज्यसभा 14 दिवसांत परत पाठवते",en:"About Money Bill (Art 110): I. Only in Lok Sabha II. With President's prior recommendation III. Rajya Sabha returns within 14 days",opts:["I व II फक्त / I and II only","I, II व III / I, II and III","II व III फक्त / II and III only","I व III फक्त / I and III only"],ans:"B",exp:"कलम 109-110 नुसार कर, कर्ज, संचित निधी यांसंबंधी विधेयके धनविधेयके असून लोकसभेचे प्राबल्य असते; अध्यक्ष निर्णय अंतिम."},{sec:6,q:"कारण (C): कलम 112 नुसार वार्षिक वित्तीय विवरण (अर्थसंकल्प) संसदेपुढे मांडले जाते. परिणाम (E): संचित निधीतून खर्चासाठी विनियोग विधेयक आवश्यक ठरते.",en:"Cause (C): Art 112 requires Annual Financial Statement before Parliament. Effect (E): Appropriation Bill needed for Consolidated Fund expenditure.",opts:["C व E दोन्ही योग्य, E हा C चा परिणाम / Both correct, E is effect of C","दोन्ही योग्य पण संबंध नाही / Both correct, no relation","C योग्य, E अयोग्य / C correct, E wrong","C अयोग्य, E योग्य / C wrong, E correct"],ans:"A",exp:"अर्थसंकल्प हा केवळ अंदाजपत्रक असून खर्चासाठी कलम 114 नुसार विनियोग कायदाच प्राधिकार देतो."},{sec:6,q:"विधान (A): कलम 123 नुसार राष्ट्रपतींना अध्यादेश काढण्याचा अधिकार आहे. कारण (R): संसदेची दोन्ही सभागृहे सत्रात नसताना तातडीची कारवाई आवश्यक असते तेव्हा.",en:"Assertion (A): President can promulgate ordinances under Art 123. Reason (R): When both Houses not in session and urgent action needed.",opts:["दोन्ही योग्य, R हे A चे योग्य स्पष्टीकरण / Both correct, R explains A","दोन्ही योग्य पण संबंध नाही / Both correct, no relation","A योग्य, R अयोग्य / A correct, R wrong","A अयोग्य, R योग्य / A wrong, R correct"],ans:"A",exp:"अध्यादेशाला संसदीय कायद्याचाच दर्जा असून 6 आठवड्यांत संसदेची मान्यता आवश्यक; नसल्यास तो व्यपगत होतो."},{sec:6,q:"कालक्रम लावा:
