"ऑपरेशन ब्रह्मा (मार्च 2025, म्यानमार 7.7 भूकंप, 80 NDRF जवान); दोस्त (तुर्की 2023); करुणा (मोचा 2023); मैत्री (नेपाळ 2015). भारताच्या 'फर्स्ट रिस्पॉन्डर' धोरणाची उदाहरणे."},{section:3,subtopic:"चॅम्पियन्स ट्रॉफी विजेतेपद क्रम",qtype:"कालक्रम",q_marathi:"भारताच्या चॅम्पियन्स ट्रॉफी विजेतेपदांचा योग्य कालक्रम लावा: 1. दुबईत न्यूझीलंडवर विजय 2. इंग्लंडमध्ये इंग्लंडवर विजय 3. श्रीलंकेत संयुक्त विजेतेपद",q_english:"Arrange India's Champions Trophy titles chronologically: 1. Win over NZ in Dubai 2. Win over England in England 3. Joint winners in Sri Lanka",options:[{m:"3-2-1",e:"3-2-1"},{m:"1-2-3",e:"1-2-3"},{m:"2-3-1",e:"2-3-1"},{m:"3-1-2",e:"3-1-2"}],correct_index:0,explanation_marathi:"2002 (श्रीलंका, श्रीलंकेसह संयुक्त), 2013 (इंग्लंड, धोनी), 2025 (दुबई, न्यूझीलंडवर 4 गडी राखून, रोहित शर्मा कर्णधार). 2025 चा अंतिम सामना 9 मार्च रोजी झाला."},{section:3,subtopic:"हॉकी आशिया चषक 2025 विश्वचषक पात्रता",qtype:"विधान-कारण",q_marathi:"विधान (A): भारताने 2025 ची पुरुष हॉकी आशिया चषक स्पर्धा जिंकली. कारण (R): या विजयामुळे भारत 2026 च्या हॉकी विश्वचषकासाठी पात्र ठरला.",q_english:"Assertion (A): India won the Men's Hockey Asia Cup 2025. Reason (R): This victory qualified India for the 2026 Hockey World Cup.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"राजगीर (बिहार) येथे अंतिम सामन्यात भारताने दक्षिण कोरियाला 4-1 ने हरवले; आशिया चषक विजेत्याला थेट विश्वचषक पात्रता मिळते."},{section:3,subtopic:"नीरज चोप्रा 90.23 मी दोहा 2025",qtype:"बहु-विधान",q_marathi:"नीरज चोप्रा यांच्या 2025 कामगिरीबद्दल खालील विधाने विचारात घ्या: I. मे 2025 मध्ये दोहा डायमंड लीगमध्ये त्यांनी 90.23 मी. भाला फेकून 90 मी. चा टप्पा ओलांडला. II. 90 मी. पेक्षा जास्त फेकणारे ते पहिले भारतीय ठरले. III. त्या स्पर्धेत त्यांनी प्रथम क्रमांक पटकावला.",q_english:"On Neeraj Chopra's 2025 feat: I. Threw 90.23m at Doha Diamond League May 2025. II. First Indian beyond 90m. III. Won the event.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त I",e:"Only I"}],correct_index:0,explanation_marathi:"16 मे 2025 रोजी 90.23 मी. फेकून 90 मी. क्लबमध्ये प्रवेश; पण जर्मनीच्या ज्युलियन वेबरने (91.06 मी.) प्रथम क्रमांक पटकावला, नीरज दुसऱ्या क्रमांकावर."},{section:3,subtopic:"2025 बुकर-एबेल-प्रित्झकर विजेते",qtype:"जोड्या लावा",q_marathi:"2025 च्या पुरस्कारांची जोडी लावा: 1. आंतरराष्ट्रीय बुकर 2. एबेल पुरस्कार 3. प्रित्झकर पुरस्कार | A. लिऊ जियाकुन (चीन) B. बानू मुश्ताक C. मसाकी काशिवारा (जपान)",q_english:"Match 2025 awards: 1. International Booker 2. Abel Prize 3. Pritzker Prize | A. Liu Jiakun (China) B. Banu Mushtaq C. Masaki Kashiwara (Japan)",options:[{m:"1-B, 2-C, 3-A",e:"1-B, 2-C, 3-A"},{m:"1-C, 2-A, 3-B",e:"1-C, 2-A, 3-B"},{m:"1-B, 2-A, 3-C",e:"1-B, 2-A, 3-C"},{m:"1-A, 2-B, 3-C",e:"1-A, 2-B, 3-C"}],correct_index:0,explanation_marathi:"बुकर — 'हार्ट लँप' (कन्नड, दीपा भाष्टी अनुवाद, पहिला कथा संग्रह विजेता); एबेल — काशिवारा (बीजगणितीय विश्लेषण); प्रित्झकर — लिऊ जियाकुन (वास्तुकला)."},{section:3,subtopic:"72वी मिस वर्ल्ड 2025 हैदराबाद",qtype:"बहु-विधान",q_marathi:"72 व्या मिस वर्ल्ड स्पर्धेबद्दल (2025): I. हैदराबादच्या HITEX येथे 31 मे 2025 रोजी अंतिम फेरी झाली. II. थायलंडच्या ओपल सुचाता चुआंगश्री यांनी विजेतेपद पटकावले — थायलंडची पहिली मिस वर्ल्ड. III. भारताच्या नंदिनी गुप्ता टॉप 8 मध्ये पोहोचल्या.",q_english:"On 72nd Miss World 2025: I. Final at HITEX Hyderabad May 31, 2025. II. Opal Suchata Chuangsri, first Thai winner. III. India's Nandini Gupta reached Top 8.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II",e:"Only II"}],correct_index:0,explanation_marathi:"108 स्पर्धकांतून थायलंडच्या ओपल विजयी (पहिली थाई मिस वर्ल्ड); इथियोपियाची हॅसेट डेरेज  II. J&K Reorganisation Act created two UTs. III. Ladakh got UT with legislature.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II",e:"Only II"},{m:"फक्त I",e:"Only I"}],correct_index:0,explanation_marathi:"5-6 ऑगस्ट 2019; जम्मू-काश्मीर (विधानमंडळासह) आणि लडाख (विधानमंडळाशिवाय) — लडाखला विधानमंडळ नाही, त्यामुळे III चूक."},{section:6,subtopic:"कलम 31-323A-338-213",qtype:"जोड्या लावा",q_marathi:"कलमे आणि विषय: 1. कलम 31 2. कलम 323A 3. कलम 338 4. कलम 213 | A. राष्ट्रीय अनुसूचित जाती आयोग B. राज्यपालांचा अध्यादेश C. प्रशासकीय न्यायाधिकरणे D. संपत्तीचा हक्क (रद्द)",q_english:"Articles: 1. Art 31 2. Art 323A 3. Art 338 4. Art 213 | A. NCSC B. Governor's ordinance C. Administrative tribunals D. Right to property (repealed)",options:[{m:"1-D, 2-C, 3-A, 4-B",e:"1-D, 2-C, 3-A, 4-B"},{m:"1-C, 2-D, 3-B, 4-A",e:"1-C, 2-D, 3-B, 4-A"},{m:"1-D, 2-A, 3-C, 4-B",e:"1-D, 2-A, 3-C, 4-B"},{m:"1-B, 2-C, 3-A, 4-D",e:"1-B, 2-C, 3-A, 4-D"}],correct_index:0,explanation_marathi:"कलम 31 (44 व्या दुरुस्तीने 1978 मध्ये मूलभूत हक्कांतून काढून 300A मध्ये), 323A (केंद्रीय प्रशासकीय न्यायाधिकरण), 338 (NCSC), 213 (राज्यपाल अध्यादेश)."},{section:6,subtopic:"SC-ST आरक्षण मुदतवाढ दुरुस्त्या",qtype:"कालक्रम",q_marathi:"अनुसूचित जाती/जमाती आरक्षणाच्या वैधतेचा क्रम लावा (मुदतवाढ): 1. 8 वी दुरुस्ती 2. 23 वी दुरुस्ती 3. 62 वी दुरुस्ती 4. 104 वी दुरुस्ती",q_english:"Order extensions of SC/ST reservation (Art 334): 1. 8th 2. 23rd 3. 62nd 4. 104th Amendment",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"1-3-2-4",e:"1-3-2-4"},{m:"2-1-4-3",e:"2-1-4-3"}],correct_index:0,explanation_marathi:"1960 (8 वी), 1970 (23 वी), 1990 (62 वी), 2020 (104 वी — आता 2030 पर्यंत); 104 व्याने अँग्लो-इंडियन आरक्षण संपवले."},{section:6,subtopic:"91वी दुरुस्ती मंत्री संख्या 15 टक्के",qtype:"विधान-कारण",q_marathi:"विधान (A): 91 व्या घटनादुरुस्तीने मंत्रिपरिषदेची संख्या मर्यादित केली. कारण (R): कलम 164(1A) नुसार मंत्री संख्या विधानसभेच्या 15% पेक्षा जास्त नसावी.",q_englis
