– maiden title under Rajat Patidar.","a-b-c-d","b-a-c-d","a-c-b-d","a-b-d-c","A","नाणेफेक → प्रथम डाव 190/9 → प्रतिस्पर्धी 184/7 → 6 धावांनी विजय हाच सामना-क्रम."]];var jc=[["4.1","बहु-विधान","(I) अलाउद्दीन बहमन शाहने 1347 मध्ये दिल्ली सल्तनतविरुद्ध बंड करून गुलबर्गा राजधानीसह बहमनी राज्य स्थापन केले. (II) महमूद गवानने 4 तरफांचे 8 तरफांत विभाजन केले, तरफदारांचे वेतन निश्चित केले, बिदर येथे 3000 हस्तलिखितांचे मदरसा स्थापन केले. (III) 1481 मध्ये गवानला फाशीनंतर बहमनी अधिक केंद्रीकृत व शक्तिशाली झाली.","(I) Alauddin Bahman Shah founded Bahmani kingdom in 1347 revolting against Delhi Sultanate, capital Gulbarga. (II) Mahmud Gawan divided 4 tarafs into 8, fixed salaries, founded madrasa with 3000 manuscripts at Bidar. (III) After Gawan's 1481 execution, Bahmani became more centralized.","I,II,III सर्व सत्य","फक्त I,II सत्य","फक्त II,III सत्य","फक्त III सत्य","B","I, II सत्य. III असत्य – फाशीनंतर गटबाजी वाढून विघटन, 5 दख्खन सल्तनती उदयास."],["4.2","जोड्या लावा","(a) किताब-ए-नौरस, (b) जगद्गुरू बादशहा, (c) इब्राहिम रौझा, (d) दखनी उर्दू. (1) इब्राहिम आदिल शाह II ची समाधी, (2) नऊ रस सिद्धांत, (3) धार्मिक सहिष्णुतेमुळे पदवी, (4) बीजापूर साहित्य माध्यम.","(a) Kitab-i-Nauras, (b) Jagadguru Badshah, (c) Ibrahim Rauza, (d) Dakhni Urdu. (1) Tomb of Ibrahim Adil Shah II, (2) Nine Rasas theory, (3) Title for tolerance, (4) Bijapur literary medium.","a-2,b-3,c-1,d-4","a-1,b-2,c-4,d-3","a-3,b-1,c-2,d-4","a-2,b-1,c-3,d-4","A","इब्राहिम II ने दखनीत किताब-ए-नौरस लिहिले, जगद्गुरू कहलवले, समाधी इब्राहिम रौझा, दखनीला राजाश्रय."],["4.3","कालक्रम लावा","चांद बीबी: (a) अली आदिल शाह I शी विवाह, (b) डिसें 1595 अकबराविरुद्ध अहमदनगर बचाव, (c) 1596 बरार देऊन तह, (d) 1599 स्वतःच्या सैनिकांकडून हत्या.","Chand Bibi: (a) Marriage to Ali Adil Shah I, (b) Dec 1595 defence of Ahmednagar vs Akbar, (c) 1596 treaty ceding Berar, (d) 1599 murdered by own troops.","b-c-a-d","a-b-c-d","a-c-b-d","c-b-d-a","B","आधी विवाह, मग 1595 बचाव, नंतर तह, 1599 हत्या हाच क्रम."],["4.4","विधान-कारण","(A): मुहम्मद कुली कुतुब शा I) Ajanta flourished under Harishena because Vakatakas converted to Buddhism.","I,II,III सत्य","फक्त I,II सत्य","फक्त II,III सत्य","फक्त I सत्य","B","I, II सत्य – अभिलेखसिद्ध. III असत्य – ब्राह्मण राहूनही बौद्ध लेण्यांना आश्रय; धर्मांतर नाही."],["4.8","जोड्या लावा","(a) रामचंद्र, (b) शंकरदेव, (c) हरपालदेव, (d) भिल्लम V. (1) 1294 अलाउद्दीन छापा-खंडणी, (2) 1313 काफूरकडून वध, (3) 1318 बंडानंतर वध-सत्तांत, (4) देवगिरी राजधानी पाया.","(a) Ramachandra, (b) Shankaradeva, (c) Harapaladeva, (d) Bhillama V. (1) 1294 Alauddin raid-tribute, (2) 1313 killed by Kafur, (3) 1318 revolt-end, (4) Founded Devagiri capital.","a-1,b-2,c-3,d-4","a-2,b-1,c-4,d-3","a-4,b-3,c-2,d-1","a-1,b-3,c-2,d-4","A","रामचंद्र 1294 शरणागती, शंकरदेव 1313 वध, हरपालदेव 1318 अंत, भिल्लम V संस्थापक."],["4.9","कालक्रम लावा","होयसाळ: (a) विष्णुवर्धन चोळ विजय, बेलूर चन्नकेशव 1116, (b) राजधानी बेलूरहून हलेबिडू, (c) वीर बल्लाळ II स्वतंत्रता 1187-93, (d) वीर बल्लाळ III मृत्यू 1346 अंत.","Hoysala: (a) Vishnuvardhana Chola victory, Belur 1116, (b) Capital Belur to Halebidu, (c) Veera Ballala II independence 1187-93, (d) End 1346.","c-a-b-d","a-c-b-d","a-b-c-d","b-d-a-c","C","विष्णुवर्धन → राजधानी बदल → बल्लाळ II स्वतंत्रता → 1346 अंत हाच क्रम."],["4.10","विधान-कारण","(A): रुद्रमा देवीने रुद्रदेव महाराजा नावाने 1262-1289 काकतीय राज्य केले. (R): 1289-93 मार्को पोलोने प्रशासनाची प्रशंसा केली.","(A): Rudrama Devi ruled Kakatiya 1262-1289 as Rudradeva Maharaja. (R): Marco Polo (1289-93) praised her administration.","दोन्ही सत्य, R योग्य स्पष्टीकरण","दोन्ही सत्य, R स्पष्टीकरण नाही","A सत्य, R असत्य","A असत्य, R सत्य","B","दोन्ही सत्य पण पोलोची प्रशंसा नामधारणेचे कारण नाही; पितृसत्ताक उत्तराधिकार हे कारण."],["4.11","तक्ता-आधारित","तक्ता: पानिपत 1526 बाबर-इब्राहिम लोदी; खानवा 1527 बाबर-राणा सांगा; चंदेरी 1528 बाबर-मेदिनी राय; घागरा 1529 बाबर-अफगाण-बंगाल. निष्कर्ष:","Table: Panipat 1526; Khanwa 1527; Chanderi 1528; Ghaghra 1529. Conclusion:","चारही एकाच वर्षी","तोफखाना-तुलुग्माने टप्प्याटप्प्याने विस्तार: दिल्ली → राजपूत → प
