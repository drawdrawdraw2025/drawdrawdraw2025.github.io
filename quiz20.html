<script>
const questions=[{"sec": 3, "sec_name": "चालू घडामोडी", "q": "खालील विधाने विचारात घ्या (PM Jan Dhan Yojana / PMJDY):<br>I. 28 ऑगस्ट 2014 रोजी सुरू, शून्य शिल्लक खाते (Zero balance account)<br>II. RuPay डेबिट कार्डसोबत 2 लाख रुपयांचे अपघात विमा संरक्षण<br>III. 10,000 रुपयांपर्यंत ओव्हरड्राफ्ट सुविधा<br>बरोबर असलेला पर्याय निवडा:", "opts": ["फक्त I आणि II", "फक्त II आणि III", "I, II आणि III सर्व बरोबर", "फक्त I आणि III"], "ans": 2, "exp": "उत्तर C बरोबर. तिन्ही विधाने बरोबर आहेत. PMJDY 28 ऑगस्ट 2014 रोजी सुरू झाली. सुरुवातीला विमा 1 लाख होता, नंतर 28.8.2018 नंतर उघडलेल्या खात्यांसाठी 2 लाख करण्यात आला. ओव्हरड्राफ्ट 10,000 रुपये आहे. A, B, D चूक कारण त्यांनी एक विधान वगळले आहे.", "qtype": "बहु-विधान (I,II,III)"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "जोड्या लावा:<br>a. MUDRA - शिशू &nbsp; b. MUDRA - किशोर &nbsp; c. MUDRA - तरुण &nbsp; d. MUDRA - तरुण प्लस<br>1. 50 हजार - 5 लाख &nbsp; 2. 10 - 20 लाख &nbsp; 3. 50 हजारांपर्यंत &nbsp; 4. 5 - 10 लाख", "opts": ["a-3, b-1, c-4, d-2", "a-1, b-3, c-2, d-4", "a-3, b-4, c-1, d-2", "a-4, b-1, c-3, d-2"], "ans": 0, "exp": "उत्तर A. शिशू=50 हजारांपर्यंत, किशोर=50 हजार-5 लाख, तरुण=5-10 लाख, तरुण प्लस (2024 अर्थसंकल्पात जाहीर)=10-20 लाख. B मध्ये a-b अदलाबदल चूक, C मध्ये b-c चूक, D मध्ये पूर्ण चूक.", "qtype": "जोड्या लावा"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "Assertion (A): PM Awas Yojana-Urban 2.0 मध्ये 1 कोटी घरांना मंजुरी देण्यात आली आहे.<br>Reason (R): PMAY-U 2.0 सप्टेंबर 2024 मध्ये केंद्रीय मंत्रिमंडळाने मंजूर केली आणि ती 5 वर्षांसाठी आहे.", "opts": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "ans": 0, "exp": "उत्तर A. दोन्ही बरोबर आणि R हे A चे कारण आहे. PMAY-U 2.0 ऑगस्ट 2024 मध्ये जाहीर, सप्टेंबर 2024 मध्ये मंत्रिमंडळ मंजुरी, 1 कोटी घरे, 2.30 लाख कोटी केंद्रीय मदत. B चूक कारण स्पष्टीकरण योग्य आहे, C/D तथ्य चूक.", "qtype": "Assertion-Reason"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "Jal Jeevan Mission (Har Ghar Jal) बाबत:<br>I. 15 ऑगस्ट 2019 रोजी सुरू<br>II. प्रत्येक ग्रामीण कुटुंबाला 55 लिटर प्रति व्यक्ती प्रतिदिन नळ पाणी<br>III. 2024 पर्यंत 100% उद्दिष्ट होते, नंतर 2028 पर्यंत वाढवले<br>योग्य पर्याय:", "opts": ["I आणि II बरोबर, III चूक", "I, II, III सर्व बरोबर", "फक्त I बरोबर", "II आणि III बरोबर"], "ans": 1, "exp": "उत्तर B बरोबर. तिन्ही विधाने बरोबर: JJM 15 ऑगस्ट 2019 रोजी सुरू, 55 लिटर प्रति व्यक्ती प्रतिदिन निकष, मूळ उद्दिष्ट 2024 होते जे नंतर 2028 पर्यंत वाढवण्यात आले. A चूक कारण III वगळले, C/D अपूर्ण.", "qtype": "बहु-विधान (I,II,III)"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "Swachh Bharat Mission-Gramin Phase-II (2020-21 ते 2024-25) चे मुख्य लक्ष्य काय?<br>कारण-परिणाम स्वरूपात विचार करा:", "opts": ["ODF टिकवून ODF Plus (घन-द्रव कचरा व्यवस्थापन) करणे", "फक्त नवीन शौचालये बांधणे", "शहरी झोपडपट्ट्या पुनर्वसन", "पिण्याच्या पाण्याचे खासगीकरण"], "ans": 0, "exp": "उत्तर A बरोबर. Phase-II चे लक्ष्य ODF टिकवून ODF Plus गाव करणे - म्हणजे घनकचरा, द्रवकचरा, गोबरधन. B चूक कारण Phase-I मध्ये शौचालये पूर्ण झाली, C/D संबंधित नाहीत.", "qtype": "कारण-परिणाम"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "PM Ujjwala Yojana बाबत दोन संकल्पना:<br>संकल्पना 1: 1 मे 2016 रोजी बलिया (उत्तर प्रदेश) येथून सुरू, BPL कुटुंबांना मोफत LPG जोडणी<br>संकल्पना 2: Ujjwala 2.0 मध्ये पहिल्या भरलेल्या सिलिंडरसह मोफत हॉटप्लेट", "opts": ["दोन्ही संकल्पना बरोबर", "फक्त 1 बरोबर", "फक्त 2 बरोबर", "दोन्ही चूक"], "ans": 0, "exp": "उत्तर A. दोन्ही बरोबर. PMUY 1 मे 2016 बलिया येथून, 10 कोटींहून अधिक जोडण्या. Ujjwala 2.0 (2021) मध्ये स्थलांतरितांना रेशनकार्डशिवाय, पहिला सिलिंडर व हॉटप्लेट मोफत. B/C अपूर्ण, D चूक.", "qtype": "दोन संकल्पना एकत्र"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "तक्ता आधारित: Sukanya Samriddhi Yojana (SSY)<br>खालीलपैकी कोणते बरोबर नाही?", "opts": ["मुलीचे वय 10 वर्षांपेक्षा कमी असावे", "वार्षिक ठेव 250 ते 1.5 लाख रुपये", "व्याजदर ~8.2% (2024-25) चक्रवाढ", "परिपक्वता 14 वर्षांत"], "ans": 3, "exp": "उत्तर D बरोबर (म्हणजे D हे चूक विधान आहे). SSY परिपक्वता खाते उघडल्यापासून 21 वर्षे किंवा मुलीच्या लग्नानंतर (18 वर्षांनंतर), 14 वर्षे फक्त ठेव कालावधी आहे. A, B, C सर्व बरोबर विधाने आहेत, D मध्ये 14 वर्षांत परिपक्वता हे चूक आहे.", "qtype": "तक्ता आधारित"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "Startup India (16 जानेवारी 2016) बाबत:<br>I. DPIIT मान्यता आवश्यक<br>II. 3 वर्षांसाठी आयकर सूट (80-IAC)<br>III. Self-certification for labour laws<br>योग्य पर्याय:", "opts": ["I, II, III सर्व बरोबर", "फक्त I आणि II", "फक्त II आणि III", "फक्त I"], "ans": 0, "exp": "उत्तर A. तिन्ही बरोबर. DPIIT मान्यता, 80-IAC अंतर्गत 3 वर्षे करसूट (10 वर्षांच्या ब्लॉकमधून), 9 कामगार कायद्यांसाठी self-certification. B, C, D अपूर्ण.", "qtype": "बहु-विधान (I,II,III)"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "जोड्या लावा (PM Gati Shakti - 7 इंजिने):<br>a. रेल्वे b. रस्ते c. बंदरे d. जलमार्ग<br>1. सागरमाला 2. भारतमाला 3. डेडिकेटेड फ्रेट कॉरिडॉर 4. जलवाहतूक", "opts": ["a-3, b-2, c-1, d-4", "a-2, b-3, c-4, d-1", "a-3, b-1, c-2, d-4", "a-1, b-2, c-3, d-4"], "ans": 0, "exp": "उत्तर A. रेल्वे-DFC, रस्ते-भारतमाला, बंदरे-सागरमाला, जलमार्ग-अंतर्देशीय जलवाहतूक. Gati Shakti 13 ऑक्टोबर 2021 रोजी सुरू, 7 इंजिने. B, C, D मध्ये जोड्या चुकल्या.", "qtype": "जोड्या लावा"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "Assertion (A): Bharatmala Pariyojana 2017 मध्ये मंजूर झाली.<br>Reason (R): यात 34,800 किमी राष्ट्रीय महामार्ग विकसित करण्याचे लक्ष्य आहे.", "opts": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, पण R स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "ans": 1, "exp": "उत्तर B. दोन्ही तथ्ये बरोबर आहेत पण R हे A च्या मंजुरीचे कारण नाही, तर योजनेचा तपशील आहे. त्यामुळे स्पष्टीकरण म्हणून योग्य नाही. A निवडणारे चुकतील.", "qtype": "Assertion-Reason"}, {"sec": 3, "sec_name": "चालू घडामोडी", "q": "UDAN (उडे देश का आम नागरिक) - प्रादेशिक कनेक्टिव्हिटी:<br>पहिली UDAN उड्डाण (27 एप्रिल 2017) कोणत्या मार्गावर?", "opts": ["शिमला-दिल्ली", "मुंबई-पुणे", "दिल्ली-वाराणसी", "हैदराबाद-विजयवाडा"], "ans": 0, "exp": "उत्तर A. 27 एप्रिल 2017 रोजी
