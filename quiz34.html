-4",e:"1-3-2-4"}],correct_index:0,explanation_marathi:"1967 (संसद मूलभूत हक्क बदलू शकत नाही) → 1973 (मूलभूत संरचना) → 1978 (कलम 21 विस्तार) → 2017 (खाजगीपणा)."},{section:6,subtopic:"कलम 72 क्षमा अधिकार",qtype:"विधान-कारण",q_marathi:"विधान (A): कलम 72 नुसार राष्ट्रपतींना मृत्युदंडाची शिक्षा माफ करण्याचा अधिकार आहे. कारण (R): हा अधिकार न्यायिक पुनर्विलोकनापासून पूर्णपणे मुक्त आहे.",q_english:"Assertion (A): President can pardon death sentences under Art 72. Reason (R): This power is fully immune from judicial review.",options:[{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both true, R explains A"},{m:"A चूक, R बरोबर",e:"A false, R true"},{m:"दोन्ही चूक",e:"Both false"}],correct_index:0,explanation_marathi:"A बरोबर (क्षमा, स्थगन, लघुकरण); पण R चूक — एपुरू सुधाकर (2006) नुसार दुर्भावनापूर्ण वापरावर न्यायिक पुनर्विलोकन शक्य."},{section:6,subtopic:"कलम 108 संयुक्त अधिवेशन",qtype:"साधा प्रश्न",q_marathi:"संसदेचे संयुक्त अधिवेशन कोणत्या कलमानुसार बोलावले जाते?",q_english:"Joint sitting of Parliament is convened under which Article?",options:[{m:"कलम 108",e:"Article 108"},{m:"कलम 110",e:"Article 110"},{m:"कलम 112",e:"Article 112"},{m:"कलम 118",e:"Article 118"}],correct_index:0,explanation_marathi:"राष्ट्रपती बोलावतात, लोकसभेचे अध्यक्ष अध्यक्षस्थानी; आतापर्यंत 3 वेळा (1961, 1978, 2002) — धन विधेयकासाठी नाही."},{section:6,subtopic:"कलम 74 75 मंत्रिपरिषद",qtype:"बहु-विधान",q_marathi:"केंद्रीय मंत्रिपरिषदेबद्दल: I. कलम 74 नुसार राष्ट्रपतींना सहाय्य-सल्ला देणारी मंत्रिपरिषद (पंतप्रधान प्रमुख) असेल. II. कलम 75 नुसार मंत्री राष्ट्रपतींच्या मर्जीवर पद धारण करतात. III. 91 व्या दुरुस्तीनुसार मंत्री संख्या लोकसभेच्या 15% पेक्षा जास्त नसावी.",q_english:"On Union CoM: I. Art 74 provides CoM with PM at head to aid-advise President. II. Art 75: ministers hold office during President's pleasure. III. 91st Amendment caps ministers at 15% of Lok Sabha.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; 42 व्या दुरुस्तीने सल्ला बंधनकारक, 44 व्याने पुनर्विचाराची एक संधी."},{section:6,subtopic:"कलम 72 74 78 85",qtype:"जोड्या लावा",q_marathi:"कलमे आणि विषय: 1. कलम 72 2. कलम 74 3. कलम 78 4. कलम 85 | A. संसद अधिवेशन B. पंतप्रधानांची कर्तव्ये C. मंत्रिपरिषद D. क्षमा अधिकार",q_english:"Articles: 1. Art 72 2. Art 74 3. Art 78 4. Art 85 | A. Parliament sessions B. PM's duties C. CoM D. Pardoning power",options:[{m:"1-D, 2-C, 3-B, 4-A",e:"1-D, 2-C, 3-B, 4-A"},{m:"1-C, 2-D, 3-A, 4-B",e:"1-C, 2-D, 3-A, 4-B"},{m:"1-D, 2-B, 3-C, 4-A",e:"1-D, 2-B, 3-C, 4-A"},{m:"1-A, 2-C, 3-B, 4-D",e:"1-A, 2-C, 3-B, 4-D"}],correct_index:0,explanation_marathi:"72 (क्षमा), 74 (मंत्रिपरिषद), 78 (PM-राष्ट्रपती दुवा — माहिती देण्याचे कर्तव्य), 85 (अधिवेशन, सत्रसमाप्ती, विसर्जन)."},{section:6,subtopic:"राष्ट्रपती क्रम 1950-77",qtype:"कालक्रम",q_marathi:"राष्ट्रपतींचा योग्य क्रम लावा: 1. डॉ. राजेंद्र प्रसाद 2. डॉ. राधाकृष्णन 3. झाकीर हुसेन 4. नीलम संजीव रेड्डी",q_english:"Order Presidents: 1. Dr. Rajendra Prasad 2. Dr. Radhakrishnan 3. Zakir Husain 4. Neelam Sanjiva Reddy",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"2-1-3-4",e:"2-1-3-4"},{m:"1-3-2-4",e:"1-3-2-4"}],correct_index:0,explanation_marathi:"1950-62 (प्रसाद) → 1962-67 (राधाकृष्णन) → 1967-69 (हुसेन, पदावर निधन) → 1977-82 (रेड्डी, बिनविरोध)."},{section:6,subtopic:"कलम 226 उच्च न्यायालय रिट",qtype:"विधान-कारण",q_marathi:"विधान (A): कलम 226 नुसार उच्च न्यायालयांना मूलभूत हक्कांसह इतर कायदेशीर हक्कांसाठीही रिट काढता येतात. कारण (R): कलम 226 ची व्याप्ती कलम 32 पेक्षा विस्तृत आहे.",q_english:"Assertion (A): HCs can issue writs under Art 226 for legal rights beyond fundamental rights. Reason (R): Art 226 is wider in scope than Art 32.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"कलम 32 (सर्वोच्च न्यायालय) फक्त मूलभूत हक्क; 226 'इतर प्रयोजनांसाठी'ही — चंद्रकुमार निकालाने दोन्ही मूलभूत संरचनेचा भाग."},{section:6,subtopic:"कलम 50 न्यायपालिका विभाजन",qtype:"साधा प्रश्न",q_marathi:"कार्यकारीपासून न्यायपालिका विभक्त करण्याचे निर्देश कोणत्या कलमात आहे?",q_english:"Separation of judiciary from executive is directed in which Article?",options:[{m:"कलम 50",e:"Article 50"},{m:"कलम 44",e:"Article 44"},{m:"कलम 48",e:"Article 48"},{m:"कलम 51",e:"Article 51"}],correct_index:0,explanation_marathi:"मार्गदर्शक तत्त्व (DPSP); फौजदारी प्रक्रिया संहितेतून अंमलबजावणी — न्यायदंडाधिकारी vs कार्यकारी दंडाधिकारी."},{section:6,subtopic:"कलम 110 धन विधेयक लोकसभा",qtype:"बहु-विधान",q_marathi:"धन विधेयकाबद्दल (कलम 110): I. लोकसभेचे अध्यक्ष ते धन विधेयक असल्याचे प्रमाणित करतात. II. राज्यसभेला 14 दिवसांत शिफारसींसह परत करावे लागते. III. राष्ट्रपतींना ते पुनर्विचारासाठी परत पाठवता येत नाही.",q_english:"On Money Bill (Art 110): I. Lok Sabha Speaker certifies it. II. Rajya Sabha must return within 14 days with recommendations. III. President cannot return it for reconsideration.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; आधार निकाल (2018) मध्ये प्रमाणपत्राच्या वैधतेवर प्रश्न — धन विधेयकाचा गैरवापर हा चर्चेचा विषय."},{section:6,subtopic:"कलम 124 217 226 32 न्यायालये",qtype:"जोड्या लावा",q_marathi:"कलमे आणि न्यायालयीन विषय: 1. कलम 124 2. कलम 217 3. कलम 32 4. कलम 50 | A. न्यायपालिका विभाजन B. सर्वोच्च न्यायालय स्थापना C. उच्च न्यायालय न्यायाधीश D. घटनात्मक उपचार",q_english:"Articles: 1. Art 124 2. Art 217 3. Art 32 4. Art 50 | A. Judiciary separation B. SC establishment C. HC judges D. Constitutional remedies",options:[{m:"1-B, 2-C, 3-D, 4-A",e:"1-B, 2-C, 3-D, 4-A"},{m:"1-C, 2-B, 3-A, 4-D",e:"1-C, 2-B, 3-A, 4-D"},{m:"1-B, 2-D, 3-C, 4-A",e:"1-B, 2-D, 3-C, 4-A"},{m:"1-D, 2-C, 3-B, 4-A",e:"1-D, 2-C, 3-B, 4-A"}],correct_index:0,explanation_marathi:"124 (सर्वोच्च न्यायालय), 217 (उच्च न्यायालय न्यायाधीश नियुक्ती), 32 (आंबेडकरांच्या मते 'घटनेचा आत्मा'), 50 (DPSP)."},{section:6,subtopic:"आणीबाणी क्रम 1962-75",qtype:"कालक्रम",q_marathi:"राष्ट्रीय आणीबाणीचा योग्य क्रम लावा: 1. चीन युद्ध (1962) 2. पाकिस्तान युद्ध (1971) 3. अंतर्गत (1975)",q_english:"Order National Emergencies: 1. China war (1962) 2. Pakistan war (1971) 3. Internal (1975)",options:[{m:"1-2-3",e:"1-2-3"},{m:"3-2-1",e:"3-2-1"},{m:"2-1-3",e:"2-1-3"},{m:"1-3-2",e:"1-3-2"}],correct_index:0,explanation_marathi:"1962-68, 1971-77, 1975-77; 44 व्या दुरुस्तीने (1978) 'अंतर्गत अशांतता'ऐवजी 'सशस्त्र बंड' शब्द आणला."},{section:6,subtopic:"कलम 25 धार्मिक स्वातंत्र्य",qtype:"विधान-कारण",q_marathi:"विधान (A): कलम 25 सर्व व्यक्तींना धर्माचे आचरण-प्रचार स्वातंत्र्य देते. कारण (R): हे स्वातंत्र्य सार्वजनिक सुव्यवस्था, नीतिमत्ता आणि आरोग्याच्या अधीन आहे.",q_english:"Assertion (A): Art 25 gives all persons freedom to practise-propagate religion. Reason (R): Subject to public order, morality, health.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"शिरूर मठ (1954) — 'धर्माचे अत्यावश्यक आचरण' चाचणी; सबरीमाला (2018) निकालात कलम 25 vs समता यांचा संघर्ष."},{section:6,subtopic:"कलम 112 वार्षिक वित्तीय विवरण",qtype:"साधा प्रश्न",q_marathi:"केंद्रीय अर्थसंकल्पाचा घटनात्मक उल्लेख कोणता?",q_english:"Constitutional term for Union Budget?",options:[{m:"वार्षिक वित्तीय विवरण (कलम 112)",e:"Annual Financial Statement (Art 112)"},{m:"अर्थसंकल्प (कलम 110)",e:"Budget (Art 110)"},{m:"वित्तीय योजना (कलम 115)",e:"Financial Plan (Art 115)"},{m:"आर्थिक विवरण (कलम 108)",e:"Economic Statement (Art 108)"}],correct_index:0,explanation_marathi:"'बजेट' शब्द घटनेत नाही; कलम 112 नुसार राष्ट्रपतींसमोर मांडले जाते; 2017 पासून रेल्वे बजेट विलीन."},{section:7,subtopic:"PLI योजना 13 क्षेत्रे",qtype:"बहु-विधान",q_marathi:"उत्पादन संलग्न प्रोत्साहन (PLI) योजनेबद्दल: I. 13 प्रमुख क्षेत्रांसाठी 2020 मध्ये घोषित झाली. II. उद्देश आयात अवलंबित्व कमी करून देशांतर्गत उत्पादन वाढवणे. III. मोबाईल उत्पादनात भारत आता जगात दुसऱ्या क्रमांकावर आहे.",q_english:"On PLI scheme: I. Announced 2020 for 13 key sectors. II. Aims to cut import dependence, boost domestic manufacturing. III. India now 2nd largest mobile manufacturer globally.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; आत्मनिर्भर भारताचा मुख्य स्तंभ; सेमीकंडक्टर, सौर मॉड्यूल, औषधे यांत विशेष भर."},{section:7,subtopic:"क्रांती जोड्या अर्थशास्त्र",qtype:"जोड्या लावा",q_marathi:"कृषी क्रांती आणि उत्पादने: 1. श्वेत क्रांती 2. नील क्रांती 3. सुवर्ण क्रांती 4. रजत क्रांती | A. अंडी/कुक्कुट B. दूध C. मत्स्य D. फळे/मध",q_english:"Revolutions and products: 1. White 2. Blue 3. Golden 4. Silver | A. Eggs/poultry B. Milk C. Fish D. Fruits/honey",options:[{m:"1-B, 2-C, 3-D, 4-A",e:"1-B, 2-C, 3-D, 4-A"},{m:"1-C, 2-B, 3-A, 4-D",e:"1-C, 2-B, 3-A, 4-D"},{m:"1-B, 2-D, 3-C, 4-A",e:"1-B, 2-D, 3-C, 4-A"},{m:"1-D, 2-C, 3-B, 4-A",e:"1-D, 2-C, 3-B, 4-A"}],correct_index:0,explanation_marathi:"श्वेत (वर्गीस कुरियन, ऑपरेशन फ्लड), नील (मत्स्य), सुवर्ण (फलोत्पादन-मध), रजत (अंडी) — हरित क्रांतीनंतरचे वैविध्य."},{section:7,subtopic:"आर्थिक सुधारणा क्रम 1991-2017",qtype:"कालक्रम",q_marathi:"आर्थिक टप्प्यांचा योग्य क्रम लावा: 1. LPG सुधारणा 2. FRBM कायदा 3. GST लागू 4. नोटाबंदी",q_english:"Order economic milestones: 1. LPG reforms 2. FRBM Act 3. GST launch 4. Demonetisation",options:[{m:"1-2-4-3",e:"1-2-4-3"},{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"2-1-4-3",e:"2-1-4-3"}],correct_index:0,explanation_marathi:"1991 (मनमोहन सिंग) → 2003 (FRBM) → 2016 (नोटाबंदी, 8 नोव्हें) → 2017 (GST, 1 जुलै)."},{section:7,subtopic:"MPC चलनवाढ लक्ष्य 4 टक्के",qtype:"विधान-कारण",q_marathi:"विधान (A): चलनविषयक धोरण समिती (MPC) चे चलनवाढ लक्ष्य 4% (±2%) आहे. कारण (R): RBI कायदा 1934 मध्ये 2016 च्या दुरुस्तीने हे लक्ष्य कायदेशीर बंधनकारक केले.",q_english:"Assertion (A): MPC's inflation target is 4% (±2%). Reason (R): 2016 amendment to RBI Act 1934 made it legally binding.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"उर्जित पटेल समितीच्या शिफारशीनुसार; CPI आधारित; दर 2 महिन्यांनी बैठक — आधुनिक चलन धोरणाचा पाया."},{section:7,subtopic:"SDR बास्केट चलने",qtype:"साधा प्रश्न",q_marathi:"IMF च्या SDR बास्केटमध्ये किती चलने आहेत?",q_english:"How many currencies in IMF's SDR basket?",options:[{m:"5",e:"5"},{m:"3",e:"3"},{m:"7",e:"7"},{m:"10",e:"10"}],correct_index:0,explanation_marathi:"डॉलर, युरो, युआन, येन, पाउंड (2016 पासून युआन समाविष्ट); 'कागदी सोने' म्हणून ओळखले जाते."},{section:7,subtopic:"महसूल तूट राजकोषीय तूट",qtype:"बहु-विधान",q_marathi:"तुटींच्या संकल्पना: I. राजकोषीय तूट = एकूण खर्च - कर्जाव्यतिरिक्त एकूण जमा. II. महसूल तूट = महसूली खर्च - महसूली जमा. III. प्राथमिक तूट = राजकोषीय तूट - व्याज देयके.",q_english:"Deficit concepts: I. Fiscal deficit = total expenditure - total receipts excl. borrowings. II. Revenue deficit = revenue expenditure - revenue receipts. III. Primary deficit = fiscal deficit - interest payments.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही व्याख्या बरोबर; FRBM कायद्याचे गाभा सूचक — अर्थसंकल्प विश्लेषणासाठी मूलभूत."},{section:7,subtopic:"कर जोड्या प्रत्यक्ष अप्रत्यक्ष",qtype:"जोड्या लावा",q_marathi:"कर आणि प्रकार: 1. आयकर 2. GST 3. सीमा शुल्क 4. महामंडळ कर | A. अप्रत्यक्ष B. प्रत्यक्ष C. अप्रत्यक्ष D. प्रत्यक्ष",q_english:"Taxes: 1. Income tax 2. GST 3. Customs duty 4. Corporation tax | A. Indirect B. Direct C. Indirect D. Direct",options:[{m:"1-B, 2-A, 3-C, 4-D",e:"1-B, 2-A, 3-C, 4-D"},{m:"1-A, 2-B, 3-D, 4-C",e:"1-A, 2-B, 3-D, 4-C"},{m:"1-B, 2-C, 3-A, 4-D",e:"1-B, 2-C, 3-A, 4-D"},{m:"1-D, 2-A, 3-C, 4-B",e:"1-D, 2-A, 3-C, 4-B"}],correct_index:0,explanation_marathi:"प्रत्यक्ष (भार हस्तांतरित नाही), अप्रत्यक्ष (ग्राहकावर भार); 2017 नंतर GST हा प्रमुख अप्रत्यक्ष कर."},{section:7,subtopic:"बँकिंग टप्पे क्रम",qtype:"कालक्रम",q_marathi:"बँकिंग इतिहासाचा क्रम लावा: 1. RBI स्थापना 2. SBI (इंपीरियलचे राष्ट्रीयीकरण) 3. 14 बँकांचे राष्ट्रीयीकरण 4. नरसिंहम समिती II",q_english:"Order banking history: 1. RBI founded 2. SBI (Imperial nationalised) 3. 14 banks nationalised 4. Narasimham Committee II",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"2-1-3-4",e:"2-1-3-4"},{m:"1-3-2-4",e:"1-3-2-4"}],correct_index:0,explanation_marathi:"1935 (RBI) → 1955 (SBI) → 1969 (14 बँका) → 1998 (नरसिंहम II, भक्कम बँका)."},{section:7,subtopic:"लाफर वक्र कर दर",qtype:"विधान-कारण",q_marathi:"विधान (A): लाफर वक्रानुसार कर दर वाढवल्यास कर महसूल नेहमीच वाढतो. कारण (R): उच्च कर दर आर्थिक क्रियाशीलता निरुत्साहित करू शकतात.",q_english:"Assertion (A): Per Laffer curve, raising tax rates always raises revenue. Reason (R): High rates can discourage economic activity.",options:[{m:"A चूक, R बरोबर",e:"A false, R true"},{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both true, R explains A"},{m:"दोन्ही चूक",e:"Both false"},{m:"A बरोबर, R चूक",e:"A true, R false"}],correct_index:0,explanation_marathi:"लाफर वक्र उलट-U आकाराचा — एका बिंदूनंतर दरवाढीने महसूल घटतो; R हेच तत्त्व स्पष्ट करते."},{section:7,subtopic:"राष्ट्रीय लॉजिस्टिक धोरण 2022",qtype:"साधा प्रश्न",q_marathi:"राष्ट्रीय लॉजिस्टिक धोरण (2022) चे उद्दिष्ट लॉजिस्टिक खर्च GDP च्या किती टक्क्यांपर्यंत आणणे आहे?",q_english:"National Logistics Policy (2022) aims to bring logistics cost to what % of GDP?",options:[{m:"8%",e:"8%"},{m:"14%",e:"14%"},{m:"5%",e:"5%"},{m:"20%",e:"20%"}],correct_index:0,explanation_marathi:"सध्याचा ~14% वरून जागतिक सरासरी 8% पर्यंत; PM गतिशक्तीशी पूरक — निर्यात स्पर्धात्मकतेसाठी महत्त्वाचे."},{section:7,subtopic:"स्टार्टअप इंडिया युनिकॉर्न",qtype:"बहु-विधान",q_marathi:"स्टार्टअप परिसंस्थेबद्दल: I. स्टार्टअप इंडिया 2016 मध्ये सुरू झाली. II. भारत जगातील तिसऱ्या क्रमांकाची स्टार्टअप परिसंस्था आहे. III. 100+ युनिकॉर्न (1 अब्ज डॉलर मूल्यांकन) भारतात आहेत.",q_english:"On startup ecosystem: I. Startup India launched 2016. II. India is world's 3rd largest startup ecosystem. III. 100+ unicorns in India.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; DPIIT मान्यता, कर सवलती, SIDBI निधी — तरुण भारताचे आर्थिक इंजिन."},{section:7,subtopic:"आर्थिक संज्ञा जोड्या",qtype:"जोड्या लावा",q_marathi:"संज्ञा आणि अर्थ: 1. स्टॅगफ्लेशन 2. डिफ्लेशन 3. रिसेशन 4. डिसइन्फ्लेशन | A. भाववाढ मंदावणे B. मंदी + चलनवाढ C. सलग दोन तिमाही GDP घट D. सर्वसाधारण भावपातळी घट",q_english:"Terms: 1. Stagflation 2. Deflation 3. Recession 4. Disinflation | A. Slowing inflation B. Stagnation + inflation C. Two quarters GDP fall D. General price fall",options:[{m:"1-B, 2-D, 3-C, 4-A",e:"1-B, 2-D, 3-C, 4-A"},{m:"1-D, 2-B, 3-A, 4-C",e:"1-D, 2-B, 3-A, 4-C"},{m:"1-B, 2-A, 3-C, 4-D",e:"1-B, 2-A, 3-C, 4-D"},{m:"1-C, 2-D, 3-B, 4-A",e:"1-C, 2-D, 3-B, 4-A"}],correct_index:0,explanation_marathi:"1970 चे तेल संकट (स्टॅगफ्लेशन), जपानचा 'हरवलेला दशक' (डिफ्लेशन) — धोरणकर्त्यांसाठी कठीण परिस्थिती."},{section:7,subtopic:"पंचवार्षिक योजना क्रम",qtype:"कालक्रम",q_marathi:"योजनांचा क्रम लावा: 1. पहिली पंचवार्षिक 2. हरित क्रांती सुरुवात 3. बँक राष्ट्रीयीकरण 4. योजना आयोग बरखास्त",q_english:"Order: 1. First Five-Year Plan 2. Green Revolution begins 3. Bank nationalisation 4. Planning Commission dissolved",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"2-1-3-4",e:"2-1-3-4"},{m:"1-3-2-4",e:"1-3-2-4"}],correct_index:0,explanation_marathi:"1951 (हॅरॉड-डोमर) → 1966-67 (HYV) → 1969 → 2015 (NITI आयोग) — नियोजन ते बाजार अर्थव्यवस्था."},{section:7,subtopic:"सार्वभौम सुवर्ण रोखे",qtype:"विधान-कारण",q_marathi:"विधान (A): सार्वभौम सुवर्ण रोखे (SGB) योजना 2015 मध्ये सुरू झाली. कारण (R): भौतिक सोन्याची आयात मागणी कमी करून चालू खात्यातील तूट आटोक्यात आणणे हा उद्देश होता.",q_english:"Assertion (A): SGB scheme launched 2015. Reason (R): To cut physical gold import demand and contain CAD.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"2.5% वार्षिक व्याज + सोन्याच्या भावाशी जोडले परतावा; सुवर्ण मुद्रीकरण योजनेशी पूरक."},{section:7,subtopic:"चालू खाते तूट घटक",qtype:"साधा प्रश्न",q_marathi:"चालू खात्यात (Current Account) कशाचा समावेश होत नाही?",q_english:"Which is NOT part of Current Account?",options:[{m:"थेट परकीय गुंतवणूक (FDI)",e:"Foreign Direct Investment (FDI)"},{m:"वस्तू व्यापार",e:"Merchandise trade"},{m:"सेवा व्यापार",e:"Services trade"},{m:"हस्तांतरणे (remittances)",e:"Transfers (remittances)"}],correct_index:0,explanation_marathi:"FDI हा भांडवली खात्यात (Capital Account); चालू खाते = व्यापार + सेवा + उत्पन्न + हस्तांतरणे."},{section:8,subtopic:"DNA रचना वॉटसन-क्रिक",qtype:"बहु-विधान",q_marathi:"DNA रचनेबद्दल: I. वॉटसन-क्रिक यांनी 1953 मध्ये दुहेरी कुंतल (double helix) मॉडेल मांडले. II. अ‍ॅडेनिन-थायमिन, ग्वानिन-साइटोसिन जोड्या हायड्रोजन बंधांनी जोडलेल्या असतात. III. रोसलिंड फ्रँकलिन यांच्या X-रे क्रिस्टलोग्राफीचा यात महत्त्वाचा वाटा होता.",q_english:"On DNA structure: I. Watson-Crick proposed double helix (1953). II. A-T, G-C pairs joined by hydrogen bonds. III. Rosalind Franklin's X-ray crystallography was crucial.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; 1962 चा नोबेल (वॉटसन, क्रिक, विल्किन्स) — आधुनिक आनुवंशिकीचा पाया."},{section:8,subtopic:"RNA प्रकार कार्ये",qtype:"जोड्या लावा",q_marathi:"RNA प्रकार आणि कार्ये: 1. mRNA 2. tRNA 3. rRNA 4. siRNA | A. प्रथिन संश्लेषण स्थळ B. अमिनो आम्ल वाहतूक C. जनुक शांतता (silencing) D. संदेशवहन",q_english:"RNA types: 1. mRNA 2. tRNA 3. rRNA 4. siRNA | A. Protein synthesis site B. Amino acid transport C. Gene silencing D. Messenger",options:[{m:"1-D, 2-B, 3-A, 4-C",e:"1-D, 2-B, 3-A, 4-C"},{m:"1-B, 2-D, 3-C, 4-A",e:"1-B, 2-D, 3-C, 4-A"},{m:"1-D, 2-A, 3-B, 4-C",e:"1-D, 2-A, 3-B, 4-C"},{m:"1-C, 2-B, 3-A, 4-D",e:"1-C, 2-B, 3-A, 4-D"}],correct_index:0,explanation_marathi:"केंद्रीय सिद्धांत (Central Dogma): DNA→RNA→प्रथिन; siRNA आधुनिक जनुक उपचारांचा आधार."},{section:8,subtopic:"शोध क्रम लसीकरण ते DNA",qtype:"कालक्रम",q_marathi:"शोधांचा योग्य क्रम लावा: 1. लसीकरण (जेनर) 2. उत्क्रांती सिद्धांत (डार्विन) 3. रक्तगट (लँडस्टायनर) 4. DNA रचना",q_english:"Order discoveries: 1. Vaccination (Jenner) 2. Evolution (Darwin) 3. Blood groups (Landsteiner) 4. DNA structure",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"2-1-3-4",e:"2-1-3-4"},{m:"1-3-2-4",e:"1-3-2-4"}],correct_index:0,explanation_marathi:"1796 (देवी लस) → 1859 (Origin of Species) → 1901 (ABO) → 1953 (दुहेरी कुंतल) — जीवशास्त्राची वाटचाल."},{section:8,subtopic:"डॉपलर परिणाम ध्वनी",qtype:"विधान-कारण",q_marathi:"विधान (A): रुग्णवाहिका जवळ येताना तिच्या सायरनचा आवाज तीव्र (उच्च वारंवारता) ऐकू येतो. कारण (R): स्रोत-निरीक्षक यांच्यातील सापेक्ष गतीमुळे तरंगलांबी बदलते — याला डॉपलर परिणाम म्हणतात.",q_english:"Assertion (A): Ambulance siren sounds higher-pitched when approaching. Reason (R): Relative motion changes wavelength — Doppler effect.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"1842 मध्ये ख्रिश्चन डॉपलर; रडार, वैद्यकीय अल्ट्रासाऊंड, खगोलशास्त्र (लाल विस्थापन) मध्ये वापर."},{section:8,subtopic:"आरसा सूत्र प्रकाश",qtype:"साधा प्रश्न",q_marathi:"गोलीय आरशासाठी आरसा सूत्र कोणते?",q_english:"Mirror formula for spherical mirrors?",options:[{m:"1/f = 1/v + 1/u",e:"1/f = 1/v + 1/u"},{m:"1/f = 1/v - 1/u",e:"1/f = 1/v - 1/u"},{m:"f = uv/(u+v)",e:"f = uv/(u+v)"},{m:"1/f = 1/u - 1/v",e:"1/f = 1/u - 1/v"}],correct_index:0,explanation_marathi:"कार्टेशियन चिन्ह पद्धतीनुसार; अंतर्वक्र-बाह्यवक्र दोन्हींसाठी लागू — दैनंदिन आरशांपासून दुर्बिणींपर्यंत."},{section:8,subtopic:"विद्युत मोटर जनित्र फरक",qtype:"बहु-विधान",q_marathi:"मोटर vs जनित्र: I. मोटर विद्युत ऊर्जेचे यांत्रिक ऊर्जेत रूपांतर करते. II. जनित्र यांत्रिक ऊर्जेचे विद्युत ऊर्जेत रूपांतर करते. III. दोन्ही विद्युतचुंबकीय प्रेरण तत्त्वावर कार्य करतात.",q_english:"Motor vs generator: I. Motor converts electrical to mechanical energy. II. Generator converts mechanical to electrical. III. Both work on electromagnetic induction.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:0,explanation_marathi:"I, II बरोबर; पण III चूक — मोटर फ्लेमिंगच्या डाव्या हाताच्या नियमानुसार (बल), जनित्र उजव्या हातानुसार (प्रेरण)."},{section:8,subtopic:"शास्त्रज्ञ शोध जोड्या",qtype:"जोड्या लावा",q_marathi:"शास्त्रज्ञ आणि शोध: 1. फॅराडे 2. ओहम 3. न्यूटन 4. आर्किमिडीज | A. गुरुत्वाकर्षण B. विद्युतचुंबकीय प्रेरण C. उत्प्लावन D. विद्युत प्रतिरोध नियम",q_english:"Scientists: 1. Faraday 2. Ohm 3. Newton 4. Archimedes | A. Gravitation B. EMI C. Buoyancy D. Resistance law",options:[{m:"1-B, 2-D, 3-A, 4-C",e:"1-B, 2-D, 3-A, 4-C"},{m:"1-D, 2-B, 3-C, 4-A",e:"1-D, 2-B, 3-C, 4-A"},{m:"1-B, 2-A, 3-D, 4-C",e:"1-B, 2-A, 3-D, 4-C"},{m:"1-C, 2-D, 3-A, 4-B",e:"1-C, 2-D, 3-A, 4-B"}],correct_index:0,explanation_marathi:"फॅराडे (1831, प्रेरण), ओहम (1827, V=IR), न्यूटन (1687, Principia), आर्किमिडीज (उत्प्लावन तत्त्व) — भौतिकशास्त्राचे चार स्तंभ."},{section:8,subtopic:"अणु मॉडेल क्रम",qtype:"कालक्रम",q_marathi:"अणु मॉडेलचा योग्य क्रम लावा: 1. डाल्टन 2. थॉमसन (प्लम पुडिंग) 3. रदरफर्ड 4. बोहर",q_english:"Order atomic models: 1. Dalton 2. Thomson (plum pudding) 3. Rutherford 4. Bohr",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"2-1-3-4",e:"2-1-3-4"},{m:"1-3-2-4",e:"1-3-2-4"}],correct_index:0,explanation_marathi:"1808 (घन गोळा) → 1897 (इलेक्ट्रॉन) → 1911 (केंद्रक) → 1913 (कक्षा) — क्वांटम मॉडेलकडे वाटचाल."},{section:8,subtopic:"रोहित्र फक्त AC",qtype:"विधान-कारण",q_marathi:"विधान (A): रोहित्र (transformer) फक्त प्रत्यावर्ती धारा (AC) वर कार्य करते. कारण (R): स्थिर चुंबकीय क्षेत्रात विद्युतचुंबकीय प्रेरण होत नाही.",q_english:"Assertion (A): Transformer works only on AC. Reason (R): No electromagnetic induction in steady magnetic field.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"फॅराडेच्या नियमानुसार बदलते फ्लक्स आवश्यक; म्हणूनच AC विजेचे लांब अंतरावर वहन शक्य — टेस्ला vs एडिसन वादाचा निकाल."},{section:8,subtopic:"अणुऊर्जा विखंडन संलयन",qtype:"साधा प्रश्न",q_marathi:"सूर्याची ऊर्जा कोणत्या प्रक्रियेतून मिळते?",q_english:"Sun's energy comes from which process?",options:[{m:"अणु संलयन (fusion)",e:"Nuclear fusion"},{m:"अणु विखंडन (fission)",e:"Nuclear fission"},{m:"रासायनिक ज्वलन",e:"Chemical combustion"},{m:"गुरुत्वीय आकुंचन",e:"Gravitational contraction"}],correct_index:0,explanation_marathi:"हायड्रोजन→हिलियम संलयन (प्रोटॉन-प्रोटॉन शृंखला); अणुभट्ट्या विखंडनावर, हायड्रोजन बॉम्ब अनियंत्रित संलयनावर."},{section:8,subtopic:"वनस्पती संप्रेरके",qtype:"बहु-विधान",q_marathi:"वनस्पती संप्रेरकांबद्दल: I. ऑक्सिन खोडाची लांबी वाढवते (शीर्ष प्रभाविता). II. जिबरेलिन बियाण्यांची सुप्तावस्था मोडते. III. अ‍ॅब्सिसिक आम्ल पानगळ आणि सुप्तावस्थेला चालना देते.",q_english:"On plant hormones: I. Auxin promotes stem elongation (apical dominance). II. Gibberellin breaks seed dormancy. III. Abscisic acid promotes leaf fall and dormancy.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; सायटोकायनिन (पेशी विभाजन), इथिलीन (फळे पिकवणे) ही इतर प्रमुख संप्रेरके."},{section:8,subtopic:"डोळा दोष भिंगे",qtype:"जोड्या लावा",q_marathi:"दृष्टीदोष आणि उपाय: 1. जवळदृष्टीता (myopia) 2. दूरदृष्टीता (hypermetropia) 3. वृद्धदृष्टीता (presbyopia) 4. दृष्टिवैषम्य (astigmatism) | A. बहुकेंद्री भिंग B. अंतर्वक्र भिंग C. दंडगोलीय भिंग D. बहिर्वक्र भिंग",q_english:"Vision defects: 1. Myopia 2. Hypermetropia 3. Presbyopia 4. Astigmatism | A. Multifocal lens B. Concave lens C. Cylindrical lens D. Convex lens",options:[{m:"1-B, 2-D, 3-A, 4-C",e:"1-B, 2-D, 3-A, 4-C"},{m:"1-D, 2-B, 3-C, 4-A",e:"1-D, 2-B, 3-C, 4-A"},{m:"1-B, 2-A, 3-D, 4-C",e:"1-B, 2-A, 3-D, 4-C"},{m:"1-C, 2-D, 3-A, 4-B",e:"1-C, 2-D, 3-A, 4-B"}],correct_index:0,explanation_marathi:"जवळदृष्टीता (दूरचे अस्पष्ट), दूरदृष्टीता (जवळचे अस्पष्ट), वृद्धदृष्टीता (वयानुसार समायोजन क्षमता घट), दृष्टिवैषम्य (कॉर्निया असमान वक्रता)."},{section:8,subtopic:"वायू नियम क्रम",qtype:"कालक्रम",q_marathi:"वायू नियमांचा योग्य क्रम लावा: 1. बॉयल 2. चार्ल्स 3. अ‍ॅव्होगाड्रो 4. आदर्श वायू समीकरण",q_english:"Order gas laws: 1. Boyle 2. Charles 3. Avogadro 4. Ideal gas equation",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4
