E दोन्ही सत्य; E हा C चा योग्य उपाय/परिणाम आहे", "C सत्य, E असत्य; मायोपियात बहिर्गोल भिंग वापरतात", "C असत्य (प्रतिमा मागे पडते), E सत्य", "C व E दोन्ही सत्य; पण E चा C शी संबंध नाही"], "correct_index": 0, "explanation_marathi": "मायोपिया=लांब नेत्रगोल/जास्त अभिसरण → प्रतिमा पुढे; अंतर्गोल अपसरण योग्य. पर्याय 2 भिंग उलटे सांगतो, 3 कारण हायपरमेट्रोपियाशी गोंधळतो, 4 संबंध नाकारतो, म्हणून चूक.", "evidence": "NCERT Class 10 Science Ch.10 Light – Reflection and Refraction: myopia image before retina corrected by concave lens; hypermetropia behind retina by convex."}, {"section": 8, "subtopic": "Periodic table groups", "qtype": "बहु-विधान", "q_marathi": "विधाने: (i) गट-1 धातूंची संयुजा 1 व आयनिक त्रिज्या वरून खाली वाढते. (ii) गट-17 अधातूंची इलेक्ट्रॉन आकर्षण वरून खाली कमी होते. (iii) गट-18 ची क्रियाशीलता सर्वाधिक असते. योग्य पर्याय निवडा.", "q_english": "Statements: (i) Group-1 metals have valency 1 and ionic radius increases down the group. (ii) Group-17 non-metals' electronegativity decreases down the group. (iii) Group-18 has highest reactivity. Choose correct option.", "options": ["फक्त (i) व (ii) बरोबर", "फक्त (i) व (iii) बरोबर", "(i), (ii), (iii) सर्व बरोबर", "फक्त (ii) व (iii) बरोबर"], "correct_index": 0, "explanation_marathi": "(i)(ii) बरोबर: कक्षा वाढल्याने आकार वाढतो, आकर्षण कमी होते. (iii) चूक कारण निष्क्रिय वायू अक्रियाशील, त्यामुळे इतर 3 पर्याय बाद.", "evidence": "NCERT Class 10 Ch.5 Periodic Classification: Atomic size increases down group, electronegativity decreases; noble gases (group-18) are inert."}, {"section": 8, "subtopic": "Projectile vs circular motion", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: (A) हवेचा विरोध नगण्य मानल्यास प्रक्षेप्याचा क्षैतिज वेग स्थिर राहतो. (B) समवर्तुळ गतीत वेगाची दिशा सतत बदलते, म्हणून त्वरण शून्य नसते. (C) प्रक्षेप्याच्या महत्तम उंचीवर एकूण वेग शून्य होतो. (D) अभिकेंद्री बल वेगाला लंब असल्याने त्याचे कार्य शून्य असते. योग्य पर्याय निवडा.", "q_english": "Consider: (A) Horizontal velocity of projectile stays constant ignoring air resistance. (B) In uniform circular motion velocity direction changes continuously, so acceleration is non-zero. (C) Total velocity becomes zero at max height. (D) Centripetal force is perpendicular to velocity so work is zero. Choose correct.", "options": ["A, B, C बरोबर; D चूक", "A, B, D बरोबर; C चूक", "B, C, D बरोबर; A चूक", "A, C, D बरोबर; B चूक"], "correct_index": 1, "explanation_marathi": "C चूक: महत्तम उंचीवर उभी वेग शून्य, क्षैतिज कायम → एकूण वेग शून्य नाही. A, B, D सत्य आहेत; इतर पर्याय C ला सत्य मानतात किंवा सत्य विधान वगळतात, म्हणून चूक.", "evidence": "NCERT Class 11 Physics Ch.4 Motion in a Plane: projectile horizontal velocity constant; uniform circular motion has centripetal acceleration; work by perpendicular force zero."}, {"section": 8, "subtopic": "Reactivity series metals", "qtype": "Assertion-Reason", "q_marathi": "A: लोखंडी खिळा CuSO4 द्रावणातून Cu विस्थापित करतो, पण तांब्याची पट्टी FeSO4 मधून Fe विस्थापित करत नाही. R: क्रियाशीलता मालिकेत Fe, Cu पेक्षा वर आहे. योग्य पर्याय निवडा.", "q_english": "A: Iron nail displaces Cu from CuSO4, but copper strip does not displace Fe from FeSO4. R: Fe is above Cu in reactivity series. Choose correct option.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "A व R दोन्ही बरोबर, जास्त क्रियाशील धातू कमी क्रियाशीलला विस्थापित करतो. इतर पर्याय सत्यता किंवा स्पष्टीकरण संबंध चुकवतात म्हणून बाद.", "evidence": "NCERT Class 10 Ch.3 Metals and Non-metals: Reactivity series Fe>Cu; more reactive metal displaces less reactive from salt solution."}, {"section": 8, "subtopic": "Reflex nervous system", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा: (P) गरम भांड्याला स्पर्श होताच हात मागे घेणे, (Q) सायकल चालवणे शिकलेले कौशल्य. स्तंभ (i) प्रतिक्षिप्त क्रिया आहे का? (ii) मुख्य समन्वय पाठीच्या कण्याद्वारे? योग्य पर्याय निवडा.", "q_english": "See table: (P) Withdrawing hand on touching hot vessel, (Q) Learned skill of cycling. Columns (i) Is it a reflex action? (ii) Main coordination via spinal cord? Choose correct option.", "options": ["P: होय/होय, Q: नाही/नाही", "P: होय/नाही, Q: होय/होय", "P: नाही/होय, Q: होय/नाही", "P: होय/होय, Q: होय/नाही"], "correct_index": 0, "explanation_marathi": "बरोबर: P प्रतिक्षिप्त कणा-मार्गे, Q ऐच्छिक मेंदू-मार्गे. इतर चूक: P ला मेंदू-समन्वय मानणे किंवा Q ला प्रतिक्षिप्त/कणा-मार्गी मानणे ही सामान्य गैरसमज आहेत.", "evidence": "NCERT Class 10 Science Ch-6 Control and Coordination: reflex arc via spinal cord; voluntary actions via brain."}, {"section": 8, "subtopic": "Series parallel electricity", "qtype": "कालक्रम लावा", "q_marathi": "समान बॅटरी (EMF=V) व समान रोध R चे बल्ब: (a) एकच बल्ब, (b) दोन बल्ब एकसर, (c) दोन बल्ब समांतर. बॅटरीतून घेतलेल्या एकूण शक्तीचा चढता क्रम लावा.", "q_english": "Identical bulbs (R) with same battery (EMF=V): (a) single bulb, (b) two bulbs in series, (c) two bulbs in parallel. Arrange in ascending order of total power drawn.", "options": ["b → a → c", "c → a → b", "a → b → c", "b → c → a"], "correct_index": 0, "explanation_marathi": "R_eq: b=2R, a=R, c=R/2; P=V²/R_eq → Pb < Pa < Pc. इतर क्रम R_eq उलटे मानतात किंवा समांतरला कमी शक्ती समजतात (व्होल्टेज विभाजनाचा गैरसमज), म्हणून चूक.", "evidence": "NCERT Class 10 Science Ch.11 Electricity: series Rs=R1+R2, parallel Rp; power P=V²/R."}, {"section": 8, "subtopic": "TB vs malaria", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): क्षयरोग हवेतून पसरतो, मलेरिया संक्रमित अनोफिलीस डासाच्या चाव्याने पसरतो. कारण (R): क्षयरोग Mycobacterium जीवाणूमुळे होतो, मलेरिया Plasmodium परजीवीमुळे होतो.", "q_english": "Assertion (A): TB spreads through air, malaria spreads via bite of infected Anopheles mosquito. Reason (R): TB is caused by Mycobacterium bacteria, malaria by Plasmodium parasite.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "बरोबर: दोन्ही सत्य; जीवाणू हवेतून, परजीवी डास-वाहकाने पसरतो म्हणून R हे A चे स्पष्टीकरण. इतर चूक: मलेरियाला जीवाणूजन्य/हवेतून मानणे किंवा क्षयरोगाला डासजन्य मानणे हे गैरसमज.", "evidence": "NCERT Class 9 Science Ch-12 Improvement in Food Resources / Health: TB bacterial airborne; malaria Plasmodium via Anopheles vector."}, {"section": 8, "subtopic": "Transpiration plants", "qtype": "बहु-विधान", "q_marathi": "विधाने: (1) वाष्पोत्सर्जन मुख्यतः पानांतील पर्णरंध्रांद्वारे होते. (2) वाष्पोत्सर्जन ओढीमुळे मुळांपासून पाणी वर खेचले जाते. (3) हवेत आर्द्रता वाढल्यास वाष्पोत्सर्जन दर वाढतो. योग्य पर्याय निवडा.", "q_english": "Statements: (1) Transpiration occurs mainly via leaf stomata. (2) Transpiration pull helps water rise from roots. (3) Transpiration rate increases with higher humidity. Choose correct option.", "options": ["फक्त 1 व 2 बरोबर, 3 चूक", "फक्त 2 व 3 बरोबर, 1 चूक", "फक्त 1 व 3 बरोबर, 2 चूक", "1, 2, 3 सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "बरोबर: 1,2 सत्य; आर्द्रतेत बाष्पदाब-तफावत कमी होऊन दर घटतो म्हणून 3 चूक. इतर चूक: 3 ला बरोबर मानणे, पर्णरंध्राऐवजी त्वचा मुख्य मानणे, ओढ सिद्धांत नाकारणे हे गैरसमज.", "evidence": "NCERT Class 10 Science Ch-5 Life Processes: stomatal transpiration creates suction pull; humid air reduces transpiration rate."}, {"section": 8, "subtopic": "Work energy power", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (A) समगतीतील उपग्रह – (1) बल ⊥ विस्थापन → कार्य शून्य (B) दाबलेली स्प्रिंग सोडणे – (2) स्थितिज→गतिज रूपांतरण (C) खडबडीत पृष्ठावर पेटी ओढणे – (3) घर्षणाचे ऋण कार्य, ऊर्जा हानी (D) P=Fv महत्तम – (4) F व v मधील कोन 0°", "q_english": "Match: (A) Satellite in uniform circular motion – (1) Force ⊥ displacement → zero work (B) Released compressed spring – (2) potential to kinetic conversion (C) Pulling box on rough surface – (3) negative work by friction, energy loss (D) Max P=Fv – (4) angle between F and v is 0°", "options": ["A-1, B-2, C-3, D-4", SelectorAll('.opt').forEach(o=>{o.onclick=()=>{c.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected');};});});}rf();rq();</script></body></html>
