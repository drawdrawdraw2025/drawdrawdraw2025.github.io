<header><h1>📝 तलाठी MPSC 2026 – संच D (90 प्रश्न) - 4th Quiz</h1><p>3-8 प्रत्येकी 15 • कठीणता 5/5 • उत्तर लपलेले • 100% नवीन</p></header><div class='filters' id='filters'></div><div class='container'><div id='progress'></div><div id='quiz'></div></div><script>const QUESTIONS_C = [{"section": 3, "subtopic": "BioE3 policy", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा: (i) पूर्ण रूप–Biotechnology for Economy, Environment and Employment (ii) नोडल–जैवतंत्रज्ञान विभाग (DBT) (iii) मंजुरी–ऑगस्ट 2024, केंद्रीय मंत्रिमंडळ (iv) लक्ष्य–हाय-परफॉर्मन्स बायोमॅन्युफॅक्चरिंग. तक्त्यानुसार बरोबर कोणते?", "q_english": "See table: (i) Full form–Biotechnology for Economy, Environment and Employment (ii) Nodal–Dept of Biotechnology (DBT) (iii) Approval–Aug 2024, Union Cabinet (iv) Goal–high-performance biomanufacturing. Which is correct as per table?", "options": ["i, ii, iii, iv सर्व बरोबर", "फक्त i, ii, iii बरोबर – iv मध्ये फक्त फार्मा उत्पादन", "फक्त ii, iii, iv बरोबर – i मध्ये Energy ऐवजी Education", "फक्त i, iii, iv बरोबर – ii नोडल NITI आयोग"], "correct_index": 0, "explanation_marathi": "बरोबर: पूर्ण रूप, DBT नोडल, ऑगस्ट 2024 मंजुरी, बायोमॅन्युफॅक्चरिंग लक्ष्य सर्व सत्य. चूक: 2-लक्ष्य संकुचित केले, 3-पूर्ण रूपात चूक, 4-नोडल NITI नव्हे.", "evidence": "PIB Cabinet approval 24 Aug 2024 BioE3 policy, Dept of Biotechnology"}, {"section": 3, "subtopic": "Global MPI 2025 India", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): जागतिक MPI 2025 नुसार भारताने बहुआयामी गरिबीत तीव्र घट नोंदवली तरी लोकसंख्येमुळे MPI गरीबांची निरपेक्ष संख्या मोठी आहे. कारण (R): MPI आरोग्य, शिक्षण, राहणीमान या 3 आयामांतील 10 निर्देशकांवर UNDP-OPHI कडून मोजला जातो.", "q_english": "Assertion (A): As per Global MPI 2025 India recorded sharp fall in multidimensional poverty but absolute number of MPI poor remains large due to population size. Reason (R): MPI is measured by UNDP-OPHI on 10 indicators across health, education, living standards.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A सत्य, R असत्य – MPI जागतिक बँक उत्पन्नावर आधारित आहे", "A असत्य, R सत्य – भारतात MPI गरिबी वाढली आहे"], "correct_index": 0, "explanation_marathi": "बरोबर: A व R सत्य; R पद्धती सांगते, लोकसंख्येमुळे निरपेक्ष संख्या मोठी याचे कारण देत नाही. चूक: 2-स्पष्टीकरण नाही, 3-MPI उत्पन्नावर नाही, 4-घट झाली वाढ नाही.", "evidence": "UNDP-OPHI Global MPI 2025 report; NFHS-based 10-indicator methodology"}, {"section": 3, "subtopic": "Green Hydrogen Maharashtra", "qtype": "कारण-परिणाम", "q_marathi": "कारण: महाराष्ट्राने ग्रीन हायड्रोजनसाठी अक्षय ऊर्जा व बंदर पायाभूत सुविधा दिली. योग्य परिणाम निवडा:", "q_english": "Cause: Maharashtra provided renewable energy and port infrastructure for green hydrogen. Choose correct effect:", "options": ["रायगड परिसरात ग्रीन हायड्रोजन/ग्रीन अमोनिया प्रकल्प गुंतवणूक आकर्षित होणे", "राज्यात ग्रे हायड्रोजन (कोळसा/गॅस आधारित) उत्पादन वाढणे", "PM सूर्य घरचे रूफटॉप अनुदान आपोआप वाढणे", "धोलेरा फॅबमध्ये वेफर उत्पादन वाढणे"], "correct_index": 0, "explanation_marathi": "बरोबर: अक्षय ऊर्जा+बंदरे → इलेक्ट्रोलायझर व ग्रीन अमोनिया गुंतवणूक. इतर चूक: ग्रे हायड्रोजन विरुद्ध, सोलर अनुदान व सेमीकंडक्टरचा थेट संबंध नाही.", "evidence": "National Green Hydrogen Mission; Maharashtra 2025 renewable/port-linked green hydrogen hub proposals."}, {"section": 3, "subtopic": "ISRO NISAR 2025", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "NISAR बद्दल दोन संकल्पना एकत्र करा: (i) रडार बँड-संस्था (ii) प्रक्षेपक-कक्षा. योग्य जोडी ओळखा.", "q_english": "Combine two concepts on NISAR: (i) radar band-agency (ii) launcher-orbit. Identify the correct pair.", "options": ["L-बँड–NASA + S-बँड–ISRO; GSLV-F16 – 743 किमी सूर्य-समकालिक कक्षा", "S-बँड–NASA + L-बँड–ISRO; GSLV-F16 – 743 किमी सूर्य-समकालिक कक्षा", "L-बँड–NASA + S-बँड–ISRO; PSLV-XL – भूस्थिर कक्षा", "X-बँड–ISRO + L-बँड–NASA; GSLV-F16 – 36,000 किमी भूस्थिर कक्षा"], "correct_index": 0, "explanation_marathi": "बरोबर: L-बँड NASA, S-बँड ISRO; GSLV-F16 ने 743 किमी SSO कक्षेत सोडले. 1) बँड-संस्था अदलाबदल चूक; 2) PSLV/भूस्थिर चूक; 3) X-बँड व 36000 किमी चूक.", "evidence": "ISRO/TH 30-Jul-2025: NISAR 2393 kg launched by GSLV-F16 at 17:40 IST Sriharikota into 743 km Sun-synchronous orbit; NASA L-band + ISRO S-band dual radar, 12-day global scan."}, {"section": 3, "subtopic": "India-EFTA TEPA", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: 1) स्वाक्षरी-10 मार्च 2024 2) अंमल-1 ऑक्टो 2025 3) गुंतवणूक-15 वर्षांत 100 अब्ज USD, 10 लाख नोकऱ्या 4) सदस्य-स्वित्झर्लंड, नॉर्वे, आइसलँड, लिक्टेंस्टाइन. तक्त्याशी पूर्णतः सुसंगत पर्याय ओळखा.", "q_english": "Table: 1) Signed-10 Mar 2024 2) In force-1 Oct 2025 3) Investment-USD 100 bn in 15 yrs, 1 mn jobs 4) Members-Switzerland, Norway, Iceland, Liechtenstein. Identify option fully consistent with table.", "options": ["स्वाक्षरी 2024, अंमल 2025; 15 वर्षांत 100 अब्ज USD; स्वित्झर्लंड, नॉर्वे, आइसलँड, लिक्टेंस्टाइन", "स्वाक्षरी 2024, अंमल 2025; 10 वर्षांत 100 अब्ज USD; स्वित्झर्लंड, नॉर्वे, स्वीडन, लिक्टेंस्टाइन", "स्वाक्षरी 2023, अंमल 2024; 15 वर्षांत 50 अब्ज USD; स्वित्झर्लंड, नॉर्वे, आइसलँड, लिक्टेंस्टाइन", "स्वाक्षरी 2024, अंमल 2025; 15 वर्षांत 100 अब्ज USD; स्वित्झर्लंड, नॉर्वे, आइसलँड, EU"], "correct_index": 0, "explanation_marathi": "तक्त्यानुसार तारखा, 100 अब्ज/15 वर्षे, 4 देश बरोबर. 1) स्वीडन व 10 वर्षे चूक; 2) तारखा व 50 अब्ज चूक; 3) EU सदस्य चूक.", "evidence": "PIB 01-Oct-2025 & 11-Oct-2025: TEPA signed 10-Mar-2024, in force 1-Oct-2025, USD 100 bn/15 yrs, 1 mn jobs; members Switzerland, Norway, Iceland, Liechtenstein."}, {"section": 3, "subtopic": "Maharashtra Cyber Security 2025", "qtype": "कारण-परिणाम", "q_marathi": "A: महाराष्ट्राने बँका, NBFC, सोशल मीडिया एकात्मिक करणारी सायबर यंत्रणा (MCCSC/डायनॅमिक प्लॅटफॉर्म) उभारली. R: शेकडो कोटींची फसवणूक रोखली गेली व इतर राज्ये महाराष्ट्र मॉडेल अनुसरू इच्छितात. योग्य कारण-परिणाम ओळखा.", "q_english": "A: Maharashtra built an integrated cyber system (MCCSC/dynamic platform) converging banks, NBFCs, social media. R: It saved hundreds of crores and other states want to emulate the Maharashtra model. Identify correct cause-effect.", "options": ["A कारण → R परिणाम; दोन्ही सत्य", "R कारण → A परिणाम; दोन्ही सत्य", "A व R दोन्ही सत्य, पण कारण-परिणाम संबंध नाही", "A असत्य (फक्त महिला/मुले केंद्रित), R सत्य"], "correct_index": 0, "explanation_marathi": "A कारण (एकात्मिक यंत्रणा) व R परिणाम (शेकडो कोटी बचाव) दोन्ही सत्य. पर्याय 1 उलट क्रम चूक; 2 संबंध नाकारणे चूक; 3 MCCSC 100% सरकारी, केवळ महिला-केंद्रित नव्हे.", "evidence": "Akashvani 02-Apr-2025: MCCSC outline under Companies Act 100% govt-owned; PTI 09-Feb-2025: dynamic cyber platform saved hundreds of crores, other states keen to emulate."}, {"section": 3, "subtopic": "Maharashtra Logistics Policy 2025", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): महाराष्ट्र लॉजिस्टिक्स धोरण 2025 मल्टी-मोडल पार्कद्वारे लॉजिस्टिक्स खर्च घटवण्याचे उद्दिष्ट ठेवते. कारण (R): राज्याचा उच्च लॉजिस्टिक्स खर्च व प्रादेशिक असमतोल दूर करणे आवश्यक आहे. योग्य पर्याय निवडा:", "q_english": "Assertion (A): Maharashtra Logistics Policy 2025 aims to cut logistics cost via multi-modal parks. Reason (R): High logistics cost and regional imbalance need correction. Choose correct:", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "बरोबर: A सत्य (धोरणाचे उद्दिष्ट), R सत्य व A चे कारण स्पष्ट करते. इतर पर्याय चूक: स्पष्टीकरण नाकारणे वा एक विधान चूक ठरवणे अयोग्य.", "evidence": "Maharashtra Cabinet 2025 note: reduce logistics cost, develop multi-modal logistics parks/hubs."}, {"section": 3, "subtopic": "Maratha Military Landscapes UNESCO 2025", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "मराठा मिलिटरी लँडस्केप्स (2025) बाबत दोन संकल्पना एकत्र करा: (संकल्पना-A) मालिकेतील किल्ल्यांची संख्या व स्थान, (संकल्पना-B) भारतातील युनेस्को क्रमांक व श्रेणी. योग्य एकत्रित पर्याय ओळखा.", "q_english": "Combine two concepts on Maratha Military Landscapes (2025): (Concept-A) number & location of forts in the serial property, (Concept-B) India's UNESCO serial number & category. Identify the correct combined option.", "options": ["12 किल्ले (11 महाराष्ट्र + जिंजी-तामिळनाडू), भारताचे 44वे स्थळ, सांस्कृतिक श्रेणी", "12 किल्ले (सर्व महाराष्ट्र), भारताचे 44वे स्थळ, सांस्कृतिक श्रेणी", "11 किल्ले (10 महाराष्ट्र + जिंजी-तामिळनाडू), भारताचे 43वे स्थळ, सांस्कृतिक श्रेणी", "12 किल्ले (11 महाराष्ट्र + जिंजी-तामिळनाडू), भारताचे 44वे स्थळ, मिश्र श्रेणी"], "correct_index": 0, "explanation_marathi": "बरोबर: 12 किल्ले (11 MH + जिंजी-TN), 44वे स्थळ, सांस्कृतिक श्रेणी सत्य. चूक: 2-जिंजी स्थान चुकले, 3-संख्या/क्रमांक चुकले, 4-मिश्र श्रेणी नव्हे.", "evidence": "UNESCO WHC 47th session July 2025 inscription; PIB 11 July 2025 - 44th WHS, 12-fort serial nomination"}, {"section": 3, "subtopic": "Mukhyamantri Jal Sanchay", "qtype": "बहु-विधान", "q_marathi": "विधाने: 1) हरियाणासाठी 22 मार्च 2025 रोजी पंचकुला (ताऊ देवीलाल स्टेडियम) येथून मुख्यमंत्री जल संचय योजना सुरू. 2) ती जल शक्ती अभियान: कॅच द रेन-2025 सोबत सुरू झाली. 3) सोबत जल-जंगल-जन अभियान, वॉटर अ‍ॅटलस 2025, एकात्मिक जल कृती आराखडा 2025-27 सुरू झाले. योग्य पर्याय ओळखा.", "q_english": "Statements: 1) Mukhyamantri Jal Sanchay Yojana launched for Haryana on 22 Mar 2025 from Panchkula. 2) Launched with Jal Shakti Abhiyan: Catch the Rain-2025. 3) Jal-Jangal-Jan Abhiyan, Water Atlas 2025, Integrated Water Action Plan 2025-27 also launched. Identify correct option.", "options": ["1, 2, 3 सर्व सत्य", "फक्त 1 व 2 सत्य, 3 असत्य", "फक्त 2 व 3 सत्य, 1 असत्य (दिल्लीतून सुरू)", "फक्त 1 सत्य, 2-3 असत्य (महाराष्ट्रासाठी योजना)"], "correct_index": 0, "explanation_marathi": "तिन्ही सत्य: हरियाणा, पंचकुला, 22 मार्च 2025; कॅच द रेन सोबत; जल-जंगल-जन/अ‍ॅटलस सोबत. दिल्ली/महाराष्ट्र व 3 असत्य म्हणणारे पर्याय चूक.", "evidence": "Hindustan Times/Tribune 22-Mar-2025: Mukhyamantri Jal Sanchay Yojana for Haryana launched at Tau Devi Lal Stadium Panchkula on World Water Day with JSA: Catch the Rain-2025, Jal-Jangal-Jan Abhiyan, Water Atlas 2025."}, {"section": 3, "subtopic": "Mumbai Metro Aqua Line 3", "qtype": "बहु-विधान", "q_marathi": "विधाने: 1) ॲक्वा लाइन-3 कुलाबा–सीप्झ 33.5 किमी पूर्ण भूमिगत मार्ग 2) अंमलबजावणी MMRC कडून, JICA कडून आंशिक निधी 3) मुंबईची पहिली भूमिगत मेट्रो; 27 स्थानके (26 भूमिगत). योग्य विधान/ने ओळखा.", "q_english": "Statements: 1) Aqua Line-3 Colaba-SEEPZ 33.5 km fully underground 2) Implemented by MMRC, partly funded by JICA 3) Mumbai's first underground metro; 27 stations (26 underground). Identify correct statement/s.", "options": ["1, 2 आणि 3 सर्व बरोबर", "फक्त 1 आणि 2 बरोबर", "फक्त 2 आणि 3 बरोबर – 1 मध्ये 33.5 किमी अंशतः उन्नत", "फक्त 1 आणि 3 बरोबर – 2 मध्ये अंमलबजावणी MMRDA"], "correct_index": 0, "explanation_marathi": "बरोबर: तिन्ही सत्य – लांबी/भूमिगत, MMRC+JICA, पहिली भूमिगत व 27/26 स्थानके. चूक: 2-तिसरे वगळले, 3-पहिले अंशतः उन्नत चूक, 4-MMRC ऐवजी MMRDA चूक.", "evidence": "MMRC official; PIB Oct 2024 BKC-Aarey Phase-1, JICA funding for Colaba-SEEPZ line"}, {"section": 3, "subtopic": "NITI Fiscal Health Index 2025", "qtype": "कालक्रम लावा", "q_marathi": "क्रम लावा: S-18 प्रमुख राज्यांची निवड, P-2022-23 आकडेवारीवर मूल्यांकन, R-पाच उप-निर्देशांकांवर गुणांकन (खर्च गुणवत्ता, महसूल, वित्तीय शहाणपण, कर्ज निर्देशांक, शाश्वतता), Q-24 जाने 2025 प्रकाशन (ओडिशा 67.8 अव्वल). योग्य कालक्रम कोणता?", "q_english": "Arrange: S-selection of 18 major states, P-assessment on 2022-23 data, R-scoring on five sub-indices, Q-publication on 24 Jan 2025 (Odisha 67.8 top). Correct chronology?", "options": ["S → P → R → Q", "P → S → R → Q", "S → R → P → Q", "R → S → P → Q"], "correct_index": 0, "explanation_marathi": "तार्किक क्रम: राज्य निवड→2022-23 डेटा→पाच निर्देशांकांवर गुणांकन→24 जाने 2025 प्रकाशन. इतर पर्यायांत P आधी S किंवा P आधी R चूक.", "evidence": "NITI Aayog/PIB 24-Jan-2025: FHI 2025 covers 18 major states, FY 2022-23, five sub-indices; Odisha 67.8 top followed by Chhattisgarh 55.2, Goa 53.6."}, {"section": 3, "subtopic": "PM Dhan Dhaanya Yojana", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) जिल्ह्यांची संख्या – 1) 100 ब) प्रेरणा मॉडेल – 2) ॲस्पिरेशनल डिस्ट्रिक्ट्स क) घोषणा – 3) अर्थसंकल्प 2025-26 ड) स्वरूप – 4) 36 योजनांचे अभिसरण. योग्य कोड ओळखा.", "q_english": "Match: A) No. of districts – 1) 100 B) Inspiration model – 2) Aspirational Districts C) Announced in – 3) Budget 2025-26 D) Nature – 4) Convergence of 36 schemes. Identify correct code.", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-2, क-4, ड-3", "अ-1, ब-3, क-2, ड-4"], "correct_index": 0, "explanation_marathi": "बरोबर: 100 कमी उत्पादकता जिल्हे, ॲस्पिरेशनल मॉडेल, बजेट 2025-26, 36 योजनांचे अभिसरण. चूक: 2-संख्या/मॉडेल अदलाबदल, 3-घोषणा/स्वरूप अदलाबदल, 4-मॉडेल/घोषणा अदलाबदल.", "evidence": "Union Budget 2025-26 speech; PIB 1 Feb 2025 PM Dhan-Dhaanya Krishi Yojana"}, {"section": 3, "subtopic": "PM Surya Ghar 2025", "qtype": "बहु-विधान", "q_marathi": "विधाने पाहा: 1) PM सूर्य घर मोफत वीज योजना MNRE राबवते, 1 कोटी घरांवर रूफटॉप सोलर उद्दिष्ट आहे. 2) 1 kW सिस्टिमसाठी ₹78,000 केंद्रीय अनुदान मिळते. 3) अनुदान लाभार्थ्याच्या बँक खात्यात DBT द्वारे जमा होते. योग्य पर्याय निवडा:", "q_english": "Consider: 1) PM Surya Ghar is run by MNRE targeting 1 crore rooftop solar homes. 2) Rs 78,000 central assistance for 1 kW system. 3) Subsidy credited via DBT to beneficiary bank account. Choose correct:", "options": ["1, 2 आणि 3 बरोबर", "फक्त 1 आणि 3 बरोबर", "फक्त 2 आणि 3 बरोबर", "फक्त 1 आणि 2 बरोबर"], "correct_index": 1, "explanation_marathi": "बरोबर: 1 व 3 सत्य; 2 चूक - ₹78,000 हे 3 kW साठी, 1 kW साठी ₹30,000. इतर पर्याय चूक: A मध्ये 2 सत्य मानले, C-D मध्ये 3 वगळले वा 2 सत्य मानले.", "evidence": "PIB MNRE: 1 crore target, CFA Rs 30k/60k/78k for 1/2/3 kW via DBT."}, {"section": 3, "subtopic": "RBI CBDC pilot", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: A) e₹-होलसेल पायलट, B) e₹-रिटेल पायलट, C) प्रोग्रामेबल व ऑफलाइन CBDC सुविधा, D) UPI सोबत इंटरऑपरेबिलिटी. योग्य क्रम निवडा:", "q_english": "Arrange chronologically: A) e₹-Wholesale pilot, B) e₹-Retail pilot, C) Programmable/offline CBDC features, D) Interoperability with UPI. Choose correct order:", "options": ["A-B-C-D", "B-A-C-D", "A-B-D-C", "A-C-B-D"], "correct_index": 0, "explanation_marathi": "बरोबर: A (नोव्हें 2022) → B (डिसें 2022) → C → D हा क्रम आहे. इतर पर्यायांत रिटेल आधी वा प्रोग्रामेबिलिटी पायलटपूर्वी दाखवली, म्हणून चूक.", "evidence": "RBI: e₹-W 1 Nov 2022, e₹-R 1 Dec 2022; programmability/offline and UPI interoperability 2024-25."}, {"section": 3, "subtopic": "Semiconductor Dholera fab", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: a) धोलेरा फॅब, b) मोरीगाव, c) सानंद — 1) टाटा-PSMC संयुक्त फॅब, 2) टाटा OSAT, 3) मायक्रॉन OSAT. योग्य जुळणी निवडा:", "q_english": "Match: a) Dholera fab, b) Morigaon, c) Sanand — 1) Tata-PSMC joint fab, 2) Tata OSAT, 3) Micron OSAT. Choose correct:", "options": ["a-1, b-2, c-3", "a-1, b-3, c-2", "a-2, b-1, c-3", "a-3, b-2, c-1"], "correct_index": 0, "explanation_marathi": "बरोबर: धोलेरा=टाटा-PSMC फॅब, मोरीगाव=टाटा OSAT, सानंद=मायक्रॉन OSAT. इतर पर्यायांत फॅब-OSAT व भागीदारांची अदलाबदल केली आहे, म्हणून चूक.", "evidence": "India Semiconductor Mission PIB: Dholera Tata-PSMC fab Rs 91,526 cr, 50k wafers/month; Assam Tata OSAT; Sanand Micron OSAT."}, {"section": 4, "subtopic": "Agarkar vs Tilak", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): आगरकरांनी राजकीय स्वातंत्र्यापूर्वी सामाजिक सुधारणा आवश्यक मानली. परिणाम (R): टिळकांशी मतभेदातून 1888 मध्ये त्यांनी 'सुधारक' सुरू केले. योग्य A-R संबंध निवडा.", "q_english": "Cause (A): Agarkar held social reform must precede political freedom. Effect (R): After differences with Tilak, he started 'Sudharak' in 1888. Choose correct A-R relation.", "options": ["A व R दोन्ही सत्य; R हा A चा तार्किक परिणाम आहे", "A व R दोन्ही सत्य; पण R हा A चा परिणाम नाही", "A सत्य, R असत्य; 'सुधारक' टिळकांनी 1890 मध्ये सुरू केले", "A असत्य, R सत्य; आगरकर राजकीय अग्रक्रम मानत होते"], "correct_index": 0, "explanation_marathi": "बरोबर: सुधारणा-प्रथम भूमिकेमुळेच केसरीत फूट व 1888 मध्ये सुधारक. B चूक: R थेट परिणाम आहे; C/D चूक: सुधारक आगरकरांचेच, 1888चेच; भूमिका अदलाबदल चुकीची.", "evidence": "Agarkar-Tilak debate: social vs political priority; Agarkar left Kesari and started Sudharak in 1888 (Maharashtra modern history texts)."}, {"section": 4, "subtopic": "Ahilyabai Holkar", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (A) राजधानी — (1) महेश्वर; (B) पती — (2) खंडेराव; (C) विश्वासू सेनापती — (3) तुकोजी होळकर; (D) प्रत्यक्ष कारकीर्द — (4) 1767-1795. योग्य संकेत निवडा:", "q_english": "Match: (A) Capital – (1) Maheshwar; (B) Husband – (2) Khanderao; (C) Trusted general – (3) Tukoji Holkar; (D) Effective reign – (4) 1767-1795. Choose correct code.", "options": ["A-1, B-2, C-3, D-4", "A-1, B-3, C-2, D-4", "A-2, B-2, C-3, D-4", "A-1, B-2, C-3, D-3"], "correct_index": 0, "explanation_marathi": "महेश्वर राजधानी, पती खंडेराव, तुकोजी सेनापती, कारकीर्द 1767-95 हे बरोबर. इतर पर्यायांत इंदूर/मल्हारराव गोंधळ व तारखांची अदलाबदल आहे.", "evidence": "John Malcolm – A Memoir of Central India Vol I; Holkar State Gazetteer"}, {"section": 4, "subtopic": "Ajanta Vakataka patronage", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: a) अजंठा लेणे 9,10 (हीनयान, सातवाहन), b) वाकाटक हरिषेण सत्तारोहण (सु. 475 इ.स.), c) प्रधान वराहदेवाकडून लेणे 16 समर्पण, d) सामंत उपेंद्रगुप्ताकडून लेणे 17 समर्पण. योग्य क्रम निवडा.", "q_english": "Arrange chronologically: a) Ajanta caves 9,10 (Hinayana, Satavahana), b) Vakataka Harisena accession (c.475 CE), c) dedication of Cave 16 by minister Varahadeva, d) dedication of Cave 17 by feudatory Upendragupta. Choose correct order.", "options": ["a-b-c-d", "b-a-c-d", "a-c-b-d", "a-b-d-c"], "correct_index": 0, "explanation_marathi": "योग्य a-b-c-d: हीनयान (इ.स.पू. 2रे-1ले शतक) सर्वात प्राचीन; हरिषेणानंतर त्याच्या काळात 16 नंतर 17. b आधी, c-d अदलाबदल किंवा a नंतर ठेवणारे पर्याय चूक.", "evidence": "ASI Ajanta (Spink chronology): Caves 9-10 Hinayana 2nd-1st c. BCE; Caves 16 (Varahadeva) and 17 (Upendragupta) Mahayana under Vakataka Harisena, 5th c. CE."}, {"section": 4, "subtopic": "Amoghavarsha Kavirajamarga", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): कविराजमार्ग हा कन्नड अलंकारशास्त्रावरील प्राचीनतम उपलब्ध ग्रंथ आहे. कारण (R): अमोघवर्षाने तो प्राकृत भाषेत लिहून जिनसेनाला अर्पण केला. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Kavirajamarga is the earliest extant work on Kannada poetics. Reason (R): Amoghavarsha wrote it in Prakrit and dedicated it to Jinasena. Choose correct option.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A सत्य, R असत्य", "A असत्य, R सत्य", "A आणि R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही"], "correct_index": 1, "explanation_marathi": "A सत्य: कविराजमार्ग (सु. 850 इ.स.) कन्नड काव्यशास्त्राचा आद्यग्रंथ. R असत्य: तो कन्नड भाषेत (संस्कृत प्रभाव) आहे, प्राकृतात नाही; त्यामुळे R असलेले पर्याय चूक.", "evidence": "History of Kannada Literature (R.S. Mugali): Kavirajamarga c.850 CE attributed to Rashtrakuta Amoghavarsha I, earliest extant Kannada work on poetics, composed in Kannada."}, {"section": 4, "subtopic": "Daimabad Harappan", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: a) दैमाबाद (श्रीरामपूर, अहमदनगर) हे प्रवरा नदीकाठीचे उत्तर-हडप्पा स्थळ आहे. b) येथील कांस्य-साठा (हत्ती, गेंडा, म्हैस, रथ) परिपक्व हडप्पा नागरी नियोजन सिद्ध करतो. c) येथे जोर्वेपूर्वी 'दैमाबाद संस्कृती' चा स्वतंत्र स्तर आढळतो. योग्य पर्याय निवडा.", "q_english": "Consider statements: a) Daimabad (Srirampur, Ahmednagar) is a Late Harappan site on the Pravara river. b) Its bronze hoard (elephant, rhino, buffalo, chariot) proves Mature Harappan town planning. c) A distinct 'Daimabad culture' phase precedes Jorwe here. Choose correct option.", "options": ["a आणि b बरोबर", "a आणि c बरोबर", "b आणि c बरोबर", "a, b आणि c बरोबर"], "correct_index": 1, "explanation_marathi": "a,c सत्य: दैमाबाद उत्तर-हडप्पा आहे; क्रम सावल्दा→उत्तर-हडप्पा→दैमाबाद→माळवा→जोर्वे आहे. b चूक: कांस्य साठा उत्तर-हडप्पा प्रभाव दाखवतो, परिपक्व नियोजन नाही; त्यामुळे b असलेले पर्याय चूक.", "evidence": "ASI Daimabad excavations (M.N. Deshpande/S.R. Rao): five-fold sequence Savalda-Late Harappan-Daimabad-Malwa-Jorwe; bronze hoard of elephant, rhino, buffalo, chariot dated to Late Harappan phase, Pravara valley."}, {"section": 4, "subtopic": "Hemadpanti Yadava", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): यादव मंदिरांत चुन्याऐवजी घडीव बसाल्ट दगड कोरड्या चुनाईने (dry masonry) एकमेकांत अडकवले. परिणाम (E): दख्खनच्या दगडाला अनुरूप, कमी खर्चात वेगवान बांधकाम शक्य झाले. संबंध ओळखा.", "q_english": "Cause (C): Yadava temples used dressed basalt interlocked in dry masonry without lime mortar. Effect (E): Suited to Deccan stone, enabling faster, cheaper construction. Identify relation.", "options": ["C सत्य, E सत्य, E हा C चा तार्किक परिणाम आहे", "C सत्य, E सत्य, पण E हा C चा परिणाम नाही", "C असत्य, E सत्य", "C सत्य, E असत्य"], "correct_index": 0, "explanation_marathi": "C,E सत्य व E हा C चाच परिणाम: कोरड्या बांधकामाने बसाल्टला साजेसे, जलद बांधकाम झाले. संबंध नाकारणारे वा C/E चूक ठरवणारे पर्याय चुकीचे.", "evidence": "M.S. Mate / ASI Deccan: Hemadpanti style (13th c. Yadava, minister Hemadri) – dry-masonry basalt temples e.g. Gondeshwar at Sinnar, without lime mortar."}, {"section": 4, "subtopic": "Hyderabad Mukti Sangram 1948", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: a) स्वामी रामानंद तीर्थ — 1) हैदराबाद स्टेट काँग्रेस नेतृत्व; b) कासिम रझवी — 2) रझाकार प्रमुख; c) ऑपरेशन पोलो — 3) 13-17 सप्टें. 1948 पोलीस कारवाई; d) स्टँडस्टिल करार — 4) नोव्हें. 1947 भारत-निजाम करार. योग्य जुळणी निवडा.", "q_english": "Match: a) Swami Ramanand Tirtha — 1) Hyderabad State Congress leadership; b) Kasim Razvi — 2) Razakar chief; c) Operation Polo — 3) 13-17 Sept 1948 police action; d) Standstill Agreement — 4) Nov 1947 India-Nizam pact. Choose correct match.", "options": ["a-1, b-2, c-3, d-4", "a-2, b-1, c-4, d-3", "a-1, b-3, c-2, d-4", "a-4, b-2, c-1, d-3"], "correct_index": 0, "explanation_marathi": "बरोबर: तीर्थ-स्टेट काँग्रेस, रझवी-रझाकार, पोलो-सप्टें 1948, स्टँडस्टिल-नोव्हें 1947. इतर पर्यायांत नेते-संघटना व तारखा अदलाबदल केल्या आहेत, म्हणून चूक.", "evidence": "Hyderabad State Congress led by Swami Ramanand Tirtha; Razakars led by Kasim Razvi; Standstill Agreement Nov 1947; Indian Operation Polo 13-17 Sept 1948."}, {"section": 4, "subtopic": "Mahmud Gawan Bidar madrasa", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन विधाने पहा: (A) महमूद गावानने 1472 मध्ये बिदर येथे मदरसा बांधला — मशिद, ग्रंथालय, निवासी खोल्या होत्या; (B) तो बहमनी सुलतान शम्सुद्दीन मुहम्मद तिसरा याचा वजीर होता व त्याने महसूल सुधारणा केल्या. योग्य पर्याय निवडा:", "q_english": "Consider: (A) Mahmud Gawan built a madrasa at Bidar in 1472 with mosque, library and residential cells; (B) He was wazir of Bahmani Sultan Shamsuddin Muhammad III and carried out revenue reforms. Choose correct option.", "options": ["A आणि B दोन्ही बरोबर", "फक्त A बरोबर, B चूक — तो अलाउद्दीन अहमद दुसरा याचा वजीर होता", "फक्त B बरोबर, A चूक — मदरसा गुलबर्गा येथे बांधला होता", "A आणि B दोन्ही चूक"], "correct_index": 0, "explanation_marathi": "बिदर मदरसा 1472 चा व गावान मुहम्मद तिसऱ्याचा वजीर हे बरोबर. इतर पर्यायांत सुलतान/स्थळ चुकीचे दिल्याने ते बाद होतात.", "evidence": "H.K. Sherwani – The Bahmanis of the Deccan, pp.240-245; ASI Bidar Madrasa inscriptional record"}, {"section": 4, "subtopic": "Nana Phadnavis", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: (A) पुरंदरचा तह 1776, (B) वडगावचा तह 1779, (C) सालबाईचा तह 1782, (D) बारभाई कटानंतर नानाचा फडणवीस म्हणून उदय 1773. योग्य क्रम निवडा:", "q_english": "Arrange chronologically: (A) Treaty of Purandar 1776, (B) Treaty of Wadgaon 1779, (C) Treaty of Salbai 1782, (D) Nana's rise as Phadnavis after Barbhai conspiracy 1773. Choose correct order.", "options": ["D-A-B-C", "D-B-A-C", "A-D-B-C", "D-A-C-B"], "correct_index": 0, "explanation_marathi": "क्रम: 1773 उदय → 1776 पुरंदर → 1779 वडगाव → 1782 सालबाई. तहांच्या वर्षांची अदलाबदल केलेले इतर पर्याय त्यामुळे चूक ठरतात.", "evidence": "Grant Duff – History of the Mahrattas; B.G. Sardesai – New History of Marathas Vol 2"}, {"section": 4, "subtopic": "Naneghat Naganika", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: स्तंभ-I: a) लिपी, b) भाषा, c) जारीकर्ती, d) उल्लेखित विधी; स्तंभ-II: 1) प्राकृत, 2) ब्राह्मी, 3) अश्वमेध-राजसूयादी वैदिक यज्ञ, 4) सातकर्णी-I ची पत्नी नागनिका. योग्य मेळ निवडा.", "q_english": "Match: Column-I: a) script, b) language, c) issuer, d) rite mentioned; Column-II: 1) Prakrit, 2) Brahmi, 3) Ashvamedha-Rajasuya Vedic sacrifices, 4) Naganika, wife of Satakarni-I. Choose correct match.", "options": ["a-2, b-1, c-4, d-3", "a-1, b-2, c-4, d-3", "a-2, b-1, c-3, d-4", "a-2, b-4, c-1, d-3"], "correct_index": 0, "explanation_marathi": "योग्य मेळ a-2,b-1,c-4,d-3: लेख ब्राह्मी-प्राकृतात नागनिकाने जारी केला, यज्ञांची यादी आहे. पर्याय 1 लिपी-भाषा अदलाबदल करतो; 2,3 कर्ता-विधी अदलाबदल करतात म्हणून चूक.", "evidence": "Epigraphia Indica: Naneghat inscription of Naganika (Satavahana, 1st c. BCE), Brahmi script, Prakrit language, records Ashvamedha, Rajasuya and other Vedic sacrifices."}, {"section": 4, "subtopic": "Non-cooperation 1920 Maharashtra", "qtype": "बहु-विधान", "q_marathi": "विधाने: 1) नागपूर काँग्रेस (डिसें. 1920) नंतर महाराष्ट्रातील टिळकवाद्यांनी असहकारास पाठिंबा दिला. 2) या काळात पुण्यात टिळक महाविद्यालयासारख्या राष्ट्रीय शाळा निघाल्या. 3) चौरी-चौरा (1922) नंतर चळवळ मागे घेतल्याने महाराष्ट्रात शेतकरी आंदोलन तीव्र झाले. योग्य पर्याय निवडा.", "q_english": "Statements: 1) After Nagpur Congress (Dec 1920) Tilakites in Maharashtra supported Non-cooperation. 2) National schools like Tilak College, Pune emerged. 3) After Chauri-Chaura (1922) withdrawal, peasant agitation intensified in Maharashtra. Choose correct option.", "options": ["1, 2 बरोबर; 3 चूक", "1, 3 बरोबर; 2 चूक", "2, 3 बरोबर; 1 चूक", "1, 2, 3 बरोबर"], "correct_index": 0, "explanation_marathi": "बरोबर: 1,2 सत्य; नागपूर ठरावानंतर पाठिंबा व राष्ट्रीय शिक्षण चळवळ. 3 चूक: 1922 मध्ये गांधींनी चळवळ स्थगित केली, तीव्र झाली नाही; त्यामुळे B,C,D चूक.", "evidence": "Nagpur Congress Dec 1920 adopted Non-cooperation; Tilak College Pune founded 1921 during movement; Chauri-Chaura Feb 1922 led to withdrawal by Gandhi."}, {"section": 4, "subtopic": "Ryotwari Maharashtra", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 1818 नंतर डेक्कन महाराष्ट्रात रयतवारी लागू झाली. कारण (R): एल्फिन्स्टन-प्रिंगल-विंगेट बंदोबस्तात शेतकऱ्याशी थेट वसुली करून महसूल वाढवणे अपेक्षित होते. योग्य पर्याय निवडा:", "q_english": "Assertion (A): Ryotwari was introduced in Deccan Maharashtra after 1818. Reason (R): Elphinstone-Pringle-Wingate settlements aimed at direct collection from ryots to maximise revenue. Choose correct option.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "1818 नंतर डेक्कनमध्ये रयतवारी व थेट वसुलीचा हेतू दोन्ही बरोबर, R हे A चे कारण आहे. इतर पर्याय कारण-संबंध तोडतात किंवा तथ्य नाकारतात.", "evidence": "Ravinder Kumar – Western India in the Nineteenth Century; Deccan Riots Commission Report 1875"}, {"section": 4, "subtopic": "Samyukta Maharashtra 1956-60", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: a) राज्य पुनर्रचना आयोग अहवाल (ऑक्टो. 1955); b) संयुक्त महाराष्ट्र समिती स्थापना (फेब्रु. 1956); c) द्विभाषिक मुंबई राज्य (1 नोव्हें. 1956); d) महाराष्ट्र निर्मिती (1 मे 1960). योग्य क्रम निवडा.", "q_english": "Arrange chronologically: a) States Reorganisation Commission report (Oct 1955); b) Samyukta Maharashtra Samiti founded (Feb 1956); c) Bilingual Bombay State (1 Nov 1956); d) Maharashtra formation (1 May 1960). Choose correct order.", "options": ["a-b-c-d", "b-a-c-d", "a-c-b-d", "c-a-b-d"], "correct_index": 0, "explanation_marathi": "बरोबर: अहवाल (1955) → समिती (फेब्रु 1956) → द्विभाषिक राज्य (नोव्हें 1956) → महाराष्ट्र (1960). इतर चूक: समिती अहवालाआधी नाही; द्विभाषिक राज्य समितीनंतरच आले.", "evidence": "SRC (Fazal Ali) report Oct 1955; Samyukta Maharashtra Samiti 6 Feb 1956; Bilingual Bombay State 1 Nov 1956; Maharashtra State 1 May 1960."}, {"section": 4, "subtopic": "Savarkar Abhinav Bharat 1904", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना 1: पूर्ण स्वातंत्र्यासाठी सशस्त्र क्रांती. संकल्पना 2: मॅझिनीच्या 'यंग इटली'पासून प्रेरणा. 1904 च्या 'अभिनव भारत'बाबत दोन्ही एकत्रित करून अचूक विधान निवडा.", "q_english": "Concept 1: Armed revolution for complete independence. Concept 2: Inspired by Mazzini's 'Young Italy'. Identify the accurate statement on 1904 'Abhinav Bharat' combining both.", "options": ["नाशिकात मित्र-मेळ्याचे रूपांतर; गुप्त संघटनेतून सशस्त्र उठावाचे ध्येय", "लंडनमध्ये स्थापना; घटनात्मक सुधारणांसाठी जाहीर सभांचे ध्येय", "पुण्यात स्थापना; केवळ बहिष्कार व अहिंसक सत्याग्रहाचे ध्येय", "नाशिकात स्थापना; ब्रिटिश नोकऱ्यांत भारतीय वाढीसाठी अर्ज-विनंत्यांचे ध्येय"], "correct_index": 0, "explanation_marathi": "बरोबर: 1899 च्या मित्र-मेळ्याचेच 1904 मध्ये नाशिकात अभिनव भारत; मॅझिनी-प्रेरित गुप्त सशस्त्र मार्ग. इतर चूक: लंडन/पुणे स्थान, घटनात्मक/अहिंसक/अर्ज-विनंती ध्येय हे संघटनेला लागू नाही.", "evidence": "Savarkar founded Mitra Mela (1899, Nashik), transformed into Abhinav Bharat (1904); inspired by Mazzini; aimed at armed revolt for complete independence."}, {"section": 4, "subtopic": "Treaty of Salbai 1782", "qtype": "बहु-विधान", "q_marathi": "सालबाई तहाबाबत: (1) पहिले इंग्रज-मराठा युद्ध संपले; (2) रघुनाथरावास पेशवे मानले; (3) पुढील 20 वर्षे इंग्रज-मराठा शांतता राहिली. योग्य गट निवडा:", "q_english": "On Treaty of Salbai: (1) Ended First Anglo-Maratha War; (2) Recognised Raghunathrao as Peshwa; (3) Ensured 20 years of Anglo-Maratha peace. Choose correct group.", "options": ["फक्त 1 आणि 3 बरोबर", "1, 2 आणि 3 बरोबर", "फक्त 1 आणि 2 बरोबर", "फक्त 2 आणि 3 बरोबर"], "correct_index": 0, "explanation_marathi": "सालबाईने पहिले युद्ध संपवून 1802 पर्यंत शांतता दिली; पेशवे माधवराव द्वितीय झाले. रघुनाथरावाला पेन्शन मिळाली, पेशवेपद नाही — त्यामुळे 2 असलेले पर्याय चूक.", "evidence": "Grant Duff – History of the Mahrattas Vol II, Ch. on Salbai 17 May 1782; Sardesai – New History of Marathas"}, {"section": 5, "subtopic": "Amboli ghat", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा : (अ) आंबोली घाट - (1) सिंधुदुर्गातील सह्याद्रीतील घाटमाथा (ब) हिरण्यकेशी नदी - (2) आंबोली परिसरात उगम (क) महादेवगड पॉइंट - (3) सूर्यास्त निरीक्षण स्थळ (ड) कावळेसाद पॉइंट - (4) दरी-दर्शन स्थळ. योग्य जोडीक्रम ओळखा.", "q_english": "Match: (a) Amboli Ghat - (1) Sahyadri pass in Sindhudurg (b) Hiranyakeshi River - (2) originates near Amboli (c) Mahadevgad Point - (3) sunset point (d) Kavalesad Point - (4) valley viewpoint. Identify correct sequence.", "options": ["अ-1, ब-2, क-4, ड-3", "अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-3, क-2, ड-4"], "correct_index": 1, "explanation_marathi": "बरोबर: आंबोली-सिंधुदुर्ग, हिरण्यकेशी उगम आंबोलीत, महादेवगड-सूर्यास्त, कावळेसाद-दरी हे क्रम बरोबर. चूक: इतर पर्यायांत निरीक्षण स्थळे अदलाबदल केली आहेत किंवा उगम-स्थान चुकवले आहे.", "evidence": "Amboli Ghat in Sindhudurg on Maharashtra-Goa Sahyadri; Hiranyakeshi originates near Amboli; Mahadevgad famous for sunset, Kavalesad for valley view (MTDC/District gazetteer)."}, {"section": 5, "subtopic": "Gangapur dam Nashik", "qtype": "कारण-परिणाम", "q_marathi": "गंगापूर धरण गोदावरीवर नाशिकच्या वर (पश्चिमेस) आहे. उन्हाळ्यातही नाशिकला पाणी मिळते. यातील योग्य कारण-परिणाम साखळी कोणती?", "q_english": "Gangapur Dam is on the Godavari upstream (west) of Nashik city. Nashik still gets water in summer. Which cause-effect chain is correct?", "options": ["पावसाळी प्रवाह साठवण → उन्हाळ्यात नियंत्रित विसर्ग → शहर व शेतीला स्थिर पुरवठा", "धरणामुळे भूजल पुनर्भरण वाढते → विहिरी भरतात → शहर केवळ विहिरींवर अवलंबून राहते", "धरण गोदावरीचे पाणी तापी खोऱ्यात वळवते → नाशिकला दोन नद्यांचे पाणी मिळते", "धरणामुळे बाष्पीभवन थांबते → साठा आपोआप वाढतो → उन्हाळी टंचाई संपते"], "correct_index": 0, "explanation_marathi": "बरोबर: धरण पावसाळी साठवण करून उन्हाळ्यात नियंत्रित विसर्ग देते. चूक: २) विहिरी दुय्यम; ३) तापी वळवण नाही; ४) बाष्पीभवन थांबत नाही.", "evidence": "Maharashtra WRD – Gangapur Dam on Godavari upstream of Nashik for drinking water & irrigation storage."}, {"section": 5, "subtopic": "Jayakwadi bird sanctuary", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (अ) जायकवाडी पक्षी अभयारण्य स्थान - (1) पैठण, छ. संभाजीनगर (ब) जलाशयाचे नाव - (2) नाथसागर (क) प्रमुख स्थलांतरित पक्षी - (3) फ्लेमिंगो (ड) मुख्य धोका - (4) गाळ व प्रदूषण. योग्य जुळणी निवडा:", "q_english": "Match: (A) Jayakwadi Bird Sanctuary location – (1) Paithan, Chh. Sambhajinagar (B) Reservoir name – (2) Nath Sagar (C) Key migratory bird – (3) Flamingo (D) Main threat – (4) Siltation & pollution. Choose correct matching:", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-2, क-4, ड-3", "अ-1, ब-3, क-2, ड-4"], "correct_index": 0, "explanation_marathi": "जायकवाडी पैठणजवळ असून जलाशय नाथसागर आहे, फ्लेमिंगो स्थलांतरित व गाळ/प्रदूषण धोका. स्थान-जलाशय अदलाबदल वा पक्षी/धोका अदलाबदल करणारे इतर तीन पर्याय चूक.", "evidence": "Maharashtra Forest Dept notification – Jayakwadi Bird Sanctuary, Paithan; reservoir named Nath Sagar; BNHS – flamingos and siltation/pollution as key threat"}, {"section": 5, "subtopic": "Kaas plateau", "qtype": "नकाशा आधारित", "q_marathi": "नकाशात सातारा शहराच्या पश्चिमेस सह्याद्रीत दाखवलेले कास पठार विचारात घ्या. त्याची निर्मिती व संवर्धन दर्जा याबाबत योग्य पर्याय कोणता?", "q_english": "On the map, Kas plateau is shown west of Satara city in the Sahyadri. Which option correctly describes its formation and conservation status?", "options": ["जांभा (लॅटराइट) विदारण पठार; पश्चिम घाट UNESCO वारसा भाग; पावसाळी स्थानिक फुलांसाठी प्रसिद्ध", "जांभा विदारण पठार; पश्चिम घाट UNESCO वारसा भाग; वाळवंटी वनस्पतींसाठी प्रसिद्ध", "उल्कापात बेसाल्ट विवर; राष्ट्रीय उद्यान भाग; पावसाळी फुलांसाठी प्रसिद्ध", "काळ्या मृदेचे पठार; कोकण किनारपट्टी वारसा भाग; खारफुटीसाठी प्रसिद्ध"], "correct_index": 0, "explanation_marathi": "कास हे जांभा-लॅटराइट विदारण पठार असून पश्चिम घाट UNESCO वारशाचा भाग व पावसाळी फुलांसाठी प्रसिद्ध. ज्वालामुखी विवर/वाळवंट/कोकण किनारपट्टी सांगणारे इतर तीन पर्याय चूक.", "evidence": "UNESCO Western Ghats WHS list includes Kas Plateau, Satara; Geological Survey of India – lateritic plateau with endemic monsoon flora"}, {"section": 5, "subtopic": "Khadakwasla chain Pune", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा – साखळी (उंचीकडून सखल): पानशेत (आंबी) / वरसगाव (मोसे) → खडकवासला (मुठा) → पुणे. यावरून पाण्याच्या प्रवाहाबाबत कोणता निष्कर्ष योग्य?", "q_english": "See table – chain (high to low): Panshet (Ambi) / Varasgaon (Mose) → Khadakwasla (Mutha) → Pune. What is the correct inference about water flow?", "options": ["वरची धरणे मुठा प्रणालीत सोडतात → खडकवासलात साठा → पुण्याला वितरण", "खडकवासला वर सोडते → पानशेत भरते → पुण्याला वितरण", "सर्व धरणे स्वतंत्रपणे पुण्याला थेट पाइपलाइन देतात", "वरसगावचे पाणी आंबीमार्गे समुद्राला जाते → पुण्याला फक्त खडकवासला"], "correct_index": 0, "explanation_marathi": "बरोबर: वरची धरणे मुठा प्रणालीत सोडतात, खडकवासला बॅलन्सिंग करते. चूक: प्रवाह उलटा नसतो; स्वतंत्र पाइपलाइन नाही; समुद्र वळवण नाही.", "evidence": "PMC/WRD – Khadakwasla chain: Panshet on Ambi, Varasgaon on Mose upstream, Khadakwasla on Mutha downstream for Pune supply."}, {"section": 5, "subtopic": "Kolhapur bauxite", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): कोल्हापूरमधील शाहूवाडी-चंदगड उंच पठारावर अतिवृष्टीने बेसाल्टचे जांभीकरण होऊन ॲल्युमिना-समृद्ध बॉक्साइट तयार होते. याचा योग्य परिणाम कोणता?", "q_english": "Cause (C): In Kolhapur's Shahuwadi-Chandgad high plateaus, heavy rainfall lateritizes basalt to form alumina-rich bauxite. What is the correct effect?", "options": ["ॲल्युमिना/ॲल्युमिनियमसाठी कच्चा माल मिळतो; खाणकामामुळे पठारी जैवविविधता व पाणी साठ्यावर ताण येतो", "ॲल्युमिनियमऐवजी पोलादासाठी हेमेटाइट मिळते; खाणकामाचा पर्यावरणावर परिणाम होत नाही", "ॲल्युमिनियमऐवजी सिमेंटसाठी चुनखडी मिळते; खाणकामामुळे शेती सुधारते", "ॲल्युमिनियम धातुक मिळते पण फक्त रस्ते-खडीसाठी वापरतात; जांभा पठारावर कोणताही ताण नाही"], "correct_index": 0, "explanation_marathi": "जांभीकरणातून ॲल्युमिनियम-योग्य बॉक्साइट मिळते, पण खाणकामाने पठारी जैवविविधता व जलधारणेला ताण. पोलाद/चुनखडी/फक्त खडी किंवा परिणाम नाही सांगणारे इतर तीन चूक.", "evidence": "Indian Bureau of Mines / GSI Mineral Yearbook – Kolhapur (Shahuwadi-Chandgad) bauxite from lateritization of Deccan basalt in high rainfall; high alumina for aluminium"}, {"section": 5, "subtopic": "Lonar crater", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): लोणार सरोवर हे बेसाल्ट खडकातील उल्कापाताने तयार झालेले खाऱ्या-सोडा पाण्याचे सरोवर आहे. कारण (R): सुमारे 50 हजार वर्षांपूर्वी अतिवेगवान उल्काघाताने दख्खन बेसाल्टमध्ये विवर तयार झाले व बाष्पीभवनाने क्षारता वाढली. योग्य पर्याय निवडा:", "q_english": "Assertion (A): Lonar lake is a saline-soda lake formed by meteorite impact in basalt rock. Reason (R): About 50,000 years ago a hypervelocity impact formed the crater in Deccan basalt and evaporation raised salinity. Choose correct option:", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "लोणार उल्काघाताने बेसाल्टमध्ये तयार झाले, बाष्पीभवनाने सोडा-क्षारता वाढली; दोन्ही सत्य. R हे A चे योग्य स्पष्टीकरण असल्याने पहिलाच पर्याय बरोबर, इतर तीन स्पष्टीकरण/सत्यता चुकवतात.", "evidence": "Geological Survey of India / ASI – Lonar crater, Buldhana: ~50 ka meteorite impact in Deccan basalt, saline soda lake; not volcanic origin"}, {"section": 5, "subtopic": "Mithi river flood", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता : मिठी नदी - (A) उगम : विहार-पवई परिसर (B) लांबी : सुमारे 18 किमी (C) मुख : माहिम खाडीमार्गे अरबी समुद्र (D) पूर-घटक : अतिक्रमण, गाळ साचणे, भरतीवेळी निचरा अडथळा. यावरून पूरनियंत्रणाचा योग्य निष्कर्ष कोणता?", "q_english": "Table: Mithi River - (A) Origin: Vihar-Powai area (B) Length: ~18 km (C) Mouth: via Mahim Creek to Arabian Sea (D) Flood factors: encroachment, siltation, tidal drainage obstruction. What is the correct flood-control inference?", "options": ["केवळ नदीची लांबी वाढवल्यास पूर कायमचा थांबतो", "पात्र रुंदीकरण व गाळ उपसल्यास वाहकता वाढून पुराचा धोका कमी होतो", "भरतीवेळी मिठीचे पाणी पवई तलावात वळवल्यास पूर कमी होतो", "माहिम खाडी बुजवल्यास समुद्राकडे निचरा सुधारतो"], "correct_index": 1, "explanation_marathi": "बरोबर: रुंदीकरण+गाळ उपसणे याने वाहकता वाढते व भरतीचा अडथळा कमी होतो. चूक: लांबी वाढवणे शक्य नाही; तलावात वळवणे पूर वाढवते; खाडी बुजवणे निचरा रोखते.", "evidence": "Mithi ~18 km, originates from Vihar-Powai overflow, drains via Mahim Creek to Arabian Sea; BMC/MMRDA reports cite encroachment, siltation and high-tide backflow as key flood causes (2005 deluge)."}, {"section": 5, "subtopic": "Paithan water grid", "qtype": "नकाशा आधारित", "q_marathi": "नकाशात पैठण (छ. संभाजीनगर) चे स्थान पाहता, जायकवाडी धरणावर आधारित मराठवाडा वॉटर ग्रीडबाबत योग्य विधान कोणते?", "q_english": "Observing Paithan's (Chh. Sambhajinagar) location on the map, which statement on the Jayakwadi-based Marathwada Water Grid is correct?", "options": ["पैठण-जायकवाडी गोदावरीवर आहे; ग्रीडचा उद्देश केवळ पूरनियंत्रण आहे", "पैठण-जायकवाडी गोदावरीवर आहे; ग्रीडचा उद्देश दुष्काळी भागाला पाइपद्वारे शाश्वत पाणीपुरवठा आहे", "पैठण-जायकवाडी कृष्णेवर आहे; ग्रीडचा उद्देश केवळ वीजनिर्मिती आहे", "पैठण-जायकवाडी तापीवर आहे; ग्रीडचा उद्देश केवळ कालवा सिंचन विस्तार आहे"], "correct_index": 1, "explanation_marathi": "बरोबर: पैठण गोदावरीवरील जायकवाडीवर आहे; ग्रीड पाइपद्वारे पेयजल पुरवते. चूक: पूर/वीज/तापी-कृष्णा विधाने चूक; ग्रीडचा मुख्य हेतू दुष्काळ निवारण व नळपुरवठा आहे.", "evidence": "Paithan/Jayakwadi Dam is on Godavari in Chh. Sambhajinagar; Marathwada Water Grid proposes piped drinking water from Jayakwadi to drought-prone villages (MJP/MWRRA reports)."}, {"section": 5, "subtopic": "Ratnagiri Alphonso climate", "qtype": "बहु-विधान", "q_marathi": "विधाने: १) जांभा (लॅटराइट) मातीचा निचरा हापूसला पोषक. २) मोहरावेळी (फेब्रु-मार्च) कोरडी उष्ण हवा फायदेशीर. ३) ५°C खालील कडाक्याची थंडी हापूसला आवश्यक. योग्य पर्याय कोणता?", "q_english": "Statements: 1) Laterite (Jambha) soil drainage suits Alphonso. 2) Dry warm air during flowering (Feb-Mar) is beneficial. 3) Severe cold below 5°C is essential for Alphonso. Which option is correct?", "options": ["१ व २ बरोबर, ३ चूक", "१ व ३ बरोबर, २ चूक", "२ व ३ बरोबर, १ चूक", "१, २, ३ सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "बरोबर: जांभा निचरा + कोरडी उष्ण मोहर पोषक; कोकणात कडाक्याची थंडी नसते. चूक: ३ आवश्यक नाही, उलट हानिकारक; त्यामुळे इतर पर्याय चूक.", "evidence": "ICAR/State Agri – Alphonso needs laterite well-drained soil, warm humid climate, dry weather at flowering; frost harmful."}, {"section": 5, "subtopic": "Solapur Bhuikot", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) भुईकोट – १) जमिनीवरील किल्ला ब) बेसाल्ट – २) दख्खन पठारी बांधकाम दगड क) सिद्धेश्वर तलाव – ३) किल्ल्यालगत जलस्रोत ड) वेस – ४) तटबंदी प्रवेशद्वार. योग्य संकेत कोणता?", "q_english": "Match: A) Bhuikot – 1) Land fort B) Basalt – 2) Deccan plateau building stone C) Siddheshwar lake – 3) Water source by fort D) Ves – 4) Fortified entrance. Which code is correct?", "options": ["अ-१, ब-२, क-३, ड-४", "अ-४, ब-१, क-२, ड-३", "अ-१, ब-३, क-२, ड-४", "अ-२, ब-१, क-४, ड-३"], "correct_index": 0, "explanation_marathi": "बरोबर: भुईकोट=सपाटीवरील, बेसाल्ट=दख्खन, तलाव=जलस्रोत, वेस=प्रवेशद्वार. चूक: इतर पर्यायांत दगड/प्रकार अदलाबदल केली आहे.", "evidence": "ASI/Gazetteer Solapur – Solapur Bhuikot is land fort on Deccan basalt plain near Siddheshwar lake."}, {"section": 5, "subtopic": "Tadoba corridor Chandrapur", "qtype": "नकाशा आधारित", "q_marathi": "नकाशा: ताडोबा-अंधारी (चंद्रपूर) पूर्व महाराष्ट्रात वैनगंगेच्या खोऱ्यात. उत्तरेकडे उमरेड-कऱ्हांडला, दक्षिणेकडे कव्वालकडे कॉरिडॉर दाखवला आहे. व्याघ्र संवर्धनासाठी कोणता निष्कर्ष योग्य?", "q_english": "Map: Tadoba-Andhari (Chandrapur) in eastern Maharashtra, Wainganga basin. Corridors shown north to Umred-Karhandla, south to Kawal. Which conservation inference is correct?", "options": ["अधिवास जोडणीमुळे जनुक प्रवाह व स्थलांतर टिकते → मानवी संघर्ष कमी", "कॉरिडॉरमुळे वाघ कायम एकाच राखीव वनात बंदिस्त राहतात", "कॉरिडॉर केवळ पर्यटकांच्या वाहनांसाठी असतो", "वैनगंगा खोरे कोरडे असल्याने कॉरिडॉरला पाण्याची गरज नसते"], "correct_index": 0, "explanation_marathi": "बरोबर: कॉरिडॉर जनुक प्रवाह व स्थलांतर राखतो. चूक: बंदिस्त राहणे, पर्यटन हेतू, पाण्याची गरज नसणे हे गैरसमज.", "evidence": "NTCA/WII – Tadoba-Andhari in Chandrapur, Wainganga basin; corridors to Umred-Karhandla/Kawal maintain tiger gene flow."}, {"section": 5, "subtopic": "Tapi Hatnur dam", "qtype": "बहु-विधान", "q_marathi": "हतनूर धरणाबाबत विधाने पाहा: (अ) ते तापी नदीवर जळगाव जिल्ह्यात आहे. (ब) त्याचा मुख्य उद्देश भुसावळ औष्णिक विद्युत केंद्राला पाणी व परिसरास सिंचन आहे. (क) ते तापीवरील जलविद्युतसाठी बांधलेले महाराष्ट्रातील सर्वात मोठे धरण आहे. योग्य पर्याय निवडा:", "q_english": "Consider statements on Hatnur Dam: (A) It is on the Tapi River in Jalgaon district. (B) Its main purpose is water for Bhusaval thermal power station and irrigation. (C) It is Maharashtra's largest dam on the Tapi built for hydropower. Choose the correct option:", "options": ["अ आणि ब बरोबर, क चूक", "अ आणि क बरोबर, ब चूक", "ब आणि क बरोबर, अ चूक", "अ, ब आणि क बरोबर"], "correct_index": 0, "explanation_marathi": "हतनूर जळगावात तापीवर असून भुसावळ TPS व सिंचनासाठी आहे; जलविद्युत मुख्य उद्देश नाही. त्यामुळे क चूक ठरते, फक्त अ-ब वाला पर्याय बरोबर; क समाविष्ट/अ-ब वगळणारे तीनही चूक.", "evidence": "Maharashtra Water Resources Dept – Hatnur Dam project profile (Tapi basin, Jalgaon): irrigation + Bhusaval TPS water supply; India-WRIS Tapi basin – Ukai in Gujarat is larger, Hatnur not major hydropower"}, {"section": 5, "subtopic": "Thane creek flamingo", "qtype": "बहु-विधान", "q_marathi": "विधाने : (A) ठाणे खाडी फ्लेमिंगो अभयारण्य रामसर स्थळ म्हणून अधिसूचित आहे. (B) लेसर व ग्रेटर फ्लेमिंगो हिवाळ्यात स्थलांतर करून येतात व चिखलातील शैवाल-सूक्ष्मजीव खातात. (C) ठाणे खाडी हे पूर्णतः गोड्या पाण्याचे बंदिस्त सरोवर आहे. योग्य पर्याय निवडा.", "q_english": "Statements: (A) Thane Creek Flamingo Sanctuary is notified as a Ramsar site. (B) Lesser and Greater Flamingos migrate in winter and feed on algae/micro-organisms in mudflats. (C) Thane Creek is a fully freshwater enclosed lake. Choose the correct option.", "options": ["A, B आणि C सर्व बरोबर", "फक्त A आणि B बरोबर", "फक्त B आणि C बरोबर", "फक्त A आणि C बरोबर"], "correct_index": 1, "explanation_marathi": "बरोबर: A-B सत्य; खाडी रामसर आहे, फ्लेमिंगो हिवाळी पाहुणे आहेत. चूक: C चूक कारण खाडी भरती-ओहोटीची खाऱ्या पाण्याची आहे; त्यामुळे C असलेले पर्याय चूक.", "evidence": "Thane Creek Flamingo Sanctuary declared Ramsar site (2022); winter migratory Lesser/Greater Flamingos feed on blue-green algae and benthic fauna in tidal mudflats, not a freshwater lake."}, {"section": 5, "subtopic": "Wainganga basin", "qtype": "Assertion-Reason", "q_marathi": "विधान (A) : वैनगंगा नदी मध्य प्रदेशातील सिवनीजवळ उगम पावून भंडारा-गडचिरोलीमार्गे वर्धेला मिळते. कारण (R) : वैनगंगा-वर्धा संगमातून प्राणहिता बनते जी गोदावरीची प्रमुख उपनदी आहे. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Wainganga originates near Seoni in MP and joins Wardha via Bhandara-Gadchiroli. Reason (R): Wainganga-Wardha confluence forms Pranahita, a major Godavari tributary. Choose correct option.", "options": ["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर; पण R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर; R चूक", "A चूक; R बरोबर"], "correct_index": 1, "explanation_marathi": "बरोबर: A-R दोन्ही सत्य; वैनगंगा सिवनी-भंडारा-वर्धा क्रम सत्य, प्राणहिता-गोदावरी संबंध सत्य. चूक: R हे A च्या उगम-प्रवाहाचे कारण स्पष्ट करत नाही, फक्त खोरे-संबंध सांगते.", "evidence": "Wainganga originates in Seoni (MP), flows through Bhandara-Gadchiroli, joins Wardha to form Pranahita which meets Godavari; part of Godavari basin (India-WRIS, Maharashtra gazetteer)."}, {"section": 6, "subtopic": "Anti-defection 10th Schedule", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: (A) 52 वी दुरुस्ती - दहावी अनुसूची समाविष्ट (B) किहोतो होलोहन निकाल - पक्षांतर कायदा वैध (C) 91 वी दुरुस्ती - फुटीला संरक्षण रद्द, मंत्रीमंडळ 15% मर्यादा (D) केशम मेघचंद्र निकाल - अध्यक्षांनी 3 महिन्यांत निर्णय द्यावा. योग्य क्रम निवडा.", "q_english": "Arrange chronologically: (A) 52nd Amendment - Tenth Schedule (B) Kihoto Hollohan - anti-defection upheld (C) 91st Amendment - split removed, 15% ministry cap (D) Keisham Meghachandra - Speaker to decide in 3 months. Choose correct order.", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "बरोबर: 1985-1992-2003-2020 हाच क्रम. चूक: किहोतो 91वीच्या आधी; 52वी सर्वांत आधी; 2020 सर्वांत अलीकडचा.", "evidence": "52nd Amendment Act 1985; Kihoto Hollohan v Zachillhu 1992 SCR; 91st Amendment Act 2003; Keisham Meghachandra v Speaker Manipur 2020 SCC"}, {"section": 6, "subtopic": "Art 23-24 bonded labour", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) कलम 23 ब) कलम 24 क) 1976 चा कायदा ड) 1986 चा कायदा; 1) मानवी तस्करी व वेठबिगारीस बंदी 2) कारखान्यात 14 वर्षांखालील बालकामगारास बंदी 3) वेठबिगारी निर्मूलन 4) बालकामगार प्रतिबंध. योग्य मेळ निवडा.", "q_english": "Match: a) Art 23 b) Art 24 c) 1976 Act d) 1986 Act with 1) ban on trafficking & forced labour 2) ban on child labour <14 in factories 3) bonded labour abolition 4) child labour prohibition. Choose correct match.", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-2, क-4, ड-3", "अ-1, ब-3, क-2, ड-4"], "correct_index": 0, "explanation_marathi": "कलम 23=वेठबिगारी बंदी, 24=बालकामगार बंदी; 1976=वेठबिगारी निर्मूलन, 1986=बालकामगार कायदा. अदलाबदल केलेले B,C,D चूक; म्हणून A बरोबर.", "evidence": "Constitution Arts 23, 24; Bonded Labour System (Abolition) Act, 1976; Child Labour (Prohibition & Regulation) Act, 1986"}, {"section": 6, "subtopic": "Art 263 Inter-state council", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना तपासा: (A) कलम 263 - लोकहित वाटल्यास आंतर-राज्य परिषद स्थापन करणे राष्ट्रपतींच्या विवेकावर; शिफारशी सल्लागार, बंधनकारक नाहीत. (B) विभागीय परिषदा - राज्य पुनर्रचना कायदा 1956 अंतर्गत वैधानिक संस्था, घटनात्मक नाहीत. योग्य पर्याय निवडा.", "q_english": "Examine two concepts: (A) Art 263 - President may establish Inter-State Council if public interest; recommendations advisory. (B) Zonal Councils - statutory under States Reorganisation Act 1956, not constitutional. Choose correct option.", "options": ["(A) बरोबर, (B) बरोबर; दोन्ही सल्लागार, शिफारशी बंधनकारक नाहीत", "(A) बरोबर, (B) बरोबर; परिषदेच्या शिफारशी केंद्रावर बंधनकारक", "(A) चूक - स्थापना बंधनकारक, (B) बरोबर", "(A) बरोबर, (B) चूक - विभागीय परिषदा कलम 263 खालील घटनात्मक"], "correct_index": 0, "explanation_marathi": "बरोबर: कलम 263 मध्ये 'may' विवेकाधीन; दोन्ही सल्लागारच. चूक: (1) शिफारशी बंधनकारक नाहीत, (2) स्थापना बंधनकारक नाही, (3) विभागीय परिषदा वैधानिक, 263 खालील नाहीत.", "evidence": "Art 263 text 'may establish'; Sarkaria Committee 1988 recommendation; Inter-State Council set up 1990 by Presidential Order; Zonal Councils via States Reorganisation Act 1956 Sec 15-22"}, {"section": 6, "subtopic": "Art 280 Finance Commission 16th", "qtype": "बहु-विधान", "q_marathi": "16 व्या वित्त आयोगाबाबत विधाने: 1) कलम 280 अंतर्गत 31 डिसेंबर 2023 रोजी स्थापना, अध्यक्ष अरविंद पनगढिया. 2) 2026-31 साठी कर-वाटप शिफारशी राष्ट्रपतींवर बंधनकारक. 3) पंचायती/नगरपालिकांची संसाधने वाढवण्याचे उपाय सुचवू शकतो. बरोबर गट निवडा.", "q_english": "Statements on 16th Finance Commission: 1) Set up 31 Dec 2023 under Art 280, Chairman Arvind Panagariya. 2) Tax devolution for 2026-31 binding on President. 3) May suggest measures to augment Panchayat/Municipality resources. Choose correct group.", "options": ["फक्त 1 बरोबर", "1 आणि 3 बरोबर", "1, 2 आणि 3 बरोबर", "फक्त 2 आणि 3 बरोबर"], "correct_index": 1, "explanation_marathi": "बरोबर: 1,3 सत्य; आयोग घटनात्मक, पंचायत/नगरपालिका संदर्भ कलम 280(3)(bb)(c). चूक: शिफारशी सल्लागार, बंधनकारक नाहीत; त्यामुळे 2 असलेले पर्याय चूक.", "evidence": "Art 280(1)(3); Finance Ministry notification 31 Dec 2023; 16th FC Chairman Arvind Panagariya; ToR for 2026-31, report due 31 Oct 2025"}, {"section": 6, "subtopic": "Art 29-30 cultural rights", "qtype": "कालक्रम लावा", "q_marathi": "कलम 29-30 संदर्भातील घटनांचा योग्य कालक्रम लावा: अ) सेंट स्टीफन्स वि. दिल्ली विद्यापीठ ब) T.M.A. पाई फाउंडेशन निकाल क) P.A. इनामदार निकाल ड) संविधानात कलम 29-30 समावेश. योग्य क्रम निवडा.", "q_english": "Arrange chronologically: a) St. Stephen's v. Delhi University b) T.M.A. Pai Foundation c) P.A. Inamdar d) Inclusion of Arts 29-30 in Constitution. Choose correct order.", "options": ["ड-अ-ब-क", "ड-ब-अ-क", "अ-ड-ब-क", "ड-अ-क-ब"], "correct_index": 0, "explanation_marathi": "क्रम: ड(1950)-अ(1992)-ब(2002)-क(2005). ब-अ अदलाबदल असलेले B, ड आधी अ असलेले C, ब-क अदलाबदल असलेले D चूक; A बरोबर.", "evidence": "Constitution adopted 1949/enforced 1950 Arts 29-30; St. Stephen's (1992), T.M.A. Pai (2002), P.A. Inamdar (2005)"}, {"section": 6, "subtopic": "Art 300A property", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (A) 44 वी दुरुस्ती 1978 (B) कलम 300A चे स्वरूप (C) 'कायद्याच्या प्राधिकारावाचून नव्हे' चा अर्थ. सूची: 1) मूलभूत हक्कातून मालमत्ता वगळली (19(1)(f), 31 रद्द) 2) केवळ घटनात्मक/कायदेशीर हक्क, मूलभूत नाही 3) कार्यकारी आदेशाने नव्हे, कायद्यानेच हिरावून घेता येते.", "q_english": "Match: (A) 44th Amendment 1978 (B) Nature of Art 300A (C) Meaning of 'save by authority of law'. List: 1) Property removed from Fundamental Rights (19(1)(f), 31 omitted) 2) Only constitutional/legal right 3) Deprivation only by law, not executive order.", "options": ["A-1, B-2, C-3", "A-1, B-3, C-2", "A-2, B-1, C-3", "A-3, B-2, C-1"], "correct_index": 0, "explanation_marathi": "बरोबर: A-1, B-2, C-3 हाच योग्य मेळ. चूक: B मूलभूत हक्क नाही; C चा अर्थ कार्यकारी आदेश अपुरा; A चा संबंध 19(1)(f)/31 शीच.", "evidence": "Constitution 44th Amendment Act 1978 Sec 6; Art 300A 'No person shall be deprived of his property save by authority of law'; SC in Jilubhai Nanbhai Khachar 1995"}, {"section": 6, "subtopic": "Art 312 AIS", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): कलम 312 नुसार राज्यसभा उपस्थित-मतदानाच्या 2/3 बहुमताने राष्ट्रीय हिताचा ठराव करते. परिणाम (E): संसद कायद्याने नवीन अखिल भारतीय सेवा निर्माण करू शकते. योग्य संबंध निवडा.", "q_english": "Cause (C): Under Art 312 Rajya Sabha passes resolution by 2/3 of members present and voting that it is in national interest. Effect (E): Parliament can create new All India Service by law. Choose correct relation.", "options": ["C व E दोन्ही बरोबर; C ही E ची आवश्यक अट आहे", "C व E दोन्ही बरोबर; पण C चा E शी संबंध नाही", "C चूक (लोकसभा ठराव लागतो); E बरोबर", "C बरोबर; E चूक (साध्या ठरावाने सेवा निर्माण होते)"], "correct_index": 0, "explanation_marathi": "कलम 312 मध्ये ठराव राज्यसभेचाच, 2/3 बहुमताने लागतो; त्यानंतरच संसद AIS निर्माण करते. लोकसभा म्हणणारे C, संबंध नाकारणारे B, E चूक म्हणणारे D चूक.", "evidence": "Constitution Art 312: Rajya Sabha resolution by 2/3 of members present and voting; Parliament may by law create new AIS (e.g., IAS, IPS)"}, {"section": 6, "subtopic": "Art 50 separation judiciary", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): कलम 50 नुसार राज्याने कार्यपालिकेपासून न्यायव्यवस्था विभक्त करावी. कारण (R): कलम 50 मूलभूत हक्क असल्याने उल्लंघनावर थेट सर्वोच्च न्यायालयात दाद मागता येते. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Under Art 50 the State shall separate judiciary from executive. Reason (R): Art 50 is a Fundamental Right enforceable directly in Supreme Court. Choose correct option.", "options": ["A व R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर; R चूक", "A चूक; R बरोबर"], "correct_index": 2, "explanation_marathi": "A बरोबर, R चूक: कलम 50 भाग-4 मधील DPSP आहे, न्यायप्रविष्ट नाही (कलम 37). त्यामुळे R बरोबर मानणारे A,B आणि A चूक मानणारे D चूक.", "evidence": "Constitution Art 50 (Part IV, Directive Principles); Art 37 - DPSP non-justiciable; Art 32 for Fundamental Rights"}, {"section": 6, "subtopic": "Cooperative 97th Part IXB", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: A) 97वी दुरुस्तीने भाग IXB समाविष्ट B) गुजरात उच्च न्यायालय-राजेंद्र शाह निकाल 2013 C) सहकार मंत्रालय स्थापना जुलै 2021 D) सर्वोच्च न्यायालय-राजेंद्र शाह निकाल जुलै 2021 (बहुराज्यपुरते वैध)", "q_english": "Arrange chronologically: A) 97th Amendment inserts Part IXB B) Gujarat HC Rajendra Shah 2013 C) Ministry of Cooperation July 2021 D) SC Rajendra Shah July 2021 (valid only for multi-state coops)", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "A(2011-12) नंतर B(2013) ने रद्द केले, नंतर C(6 जुलै 2021) व D(20 जुलै 2021) ने अंशतः वैध ठरवले. क्रम बदलणारे B,C,D पर्याय चूक.", "evidence": "97th CAA 2011 (w.e.f. 15-2-2012) inserted Part IXB; Rajendra Shah v UoI Gujarat HC 2013 struck down; Ministry of Cooperation 6-7-2021; UoI v Rajendra Shah (2021) SC upheld Part IXB only for multi-state co-ops."}, {"section": 6, "subtopic": "Delimitation freeze 2026", "qtype": "बहु-विधान", "q_marathi": "विधाने: 1) 42वी दुरुस्तीने 1971 वर आधारित जागावाटप 2000 पर्यंत गोठवले. 2) 84वी दुरुस्तीने गोठवण 2026 नंतरच्या पहिल्या जनगणनेपर्यंत वाढवली. 3) 2002 मध्ये संख्या न बदलता 2001 वर मतदारसंघ पुनर्रचना झाली. 4) 2026 नंतर आपोआप 2011 वर जागावाढ होईल. योग्य पर्याय:", "q_english": "Statements: 1) 42nd Amendment froze 1971-based allocation till 2000. 2) 84th Amendment extended freeze till first census after 2026. 3) In 2002 territorial readjustment on 2001 census without changing seat numbers. 4) After 2026 seats auto-increase on 2011 census. Choose correct:", "options": ["1, 2, 3 बरोबर; 4 चूक", "1, 2, 4 बरोबर; 3 चूक", "2, 3, 4 बरोबर; 1 चूक", "1, 3, 4 बरोबर; 2 चूक"], "correct_index": 0, "explanation_marathi": "1,2 सत्य (42वी/84वी दुरुस्ती); 3 सत्य (87वी/2002 आयोग). 4 चूक: वाढ आपोआप नाही, दुरुस्ती व आयोग लागतो. त्यामुळे 4 असलेले B,C,D चूक.", "evidence": "Constitution Art 82 proviso: 42nd CAA 1976 freeze till 2000; 84th CAA 2001 extended till first census after 2026; Delimitation Act 2002 readjusted constituencies on 2001 census without changing state totals."}, {"section": 6, "subtopic": "EWS 103rd Art 15-16", "qtype": "बहु-विधान", "q_marathi": "103व्या दुरुस्तीबाबत विधाने पहा: अ) कलम 15(6), 16(6) समाविष्ट. ब) EWS आरक्षण 10% पर्यंत, आर्थिक निकषावर. क) SC/ST/OBC यांनाही EWS लाभ मिळतो. ड) Janhit Abhiyan (2022) मध्ये 3:2 ने वैधता कायम. योग्य पर्याय निवडा.", "q_english": "Consider statements on 103rd Amendment: a) Added Arts 15(6), 16(6). b) EWS quota up to 10% on economic criteria. c) SC/ST/OBC can also claim EWS. d) Janhit Abhiyan (2022) upheld validity 3:2. Choose correct option.", "options": ["अ, ब, ड बरोबर; क चूक", "अ, ब, क बरोबर; ड चूक", "ब, क, ड बरोबर; अ चूक", "अ, क, ड बरोबर; ब चूक"], "correct_index": 0, "explanation_marathi": "क चूक: EWS फक्त अनारक्षित वर्गासाठी; SC/ST/OBC वगळले. त्यामुळे क असलेले B,C,D चूक ठरतात; अ,ब,ड बरोबर असल्याने A योग्य.", "evidence": "Constitution Arts 15(6), 16(6) via 103rd Amendment; Janhit Abhiyan v. Union of India (2022) 3:2 majority upheld"}, {"section": 6, "subtopic": "Lokpal 2013", "qtype": "कारण-परिणाम", "q_marathi": "A: लोकपाल कायदा 2013 अंतर्गत पंतप्रधानांविरुद्ध भ्रष्टाचार चौकशी शक्य आहे. R: कायदा पंतप्रधानांना आंतरराष्ट्रीय संबंध, सुरक्षा, सार्वजनिक सुव्यवस्था, अणुऊर्जा, अवकाश यात सूट देतो; इतर प्रकरणी पूर्ण पीठाच्या 2/3 मंजुरीने चौकशी होते. योग्य संबंध ओळखा.", "q_english": "A: Under Lokpal Act 2013 inquiry against PM for corruption is possible. R: Act exempts PM on international relations, security, public order, atomic energy, space; other cases need 2/3 full-bench approval. Identify correct cause-effect relation.", "options": ["A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य, R असत्य आहे", "A असत्य, R सत्य आहे"], "correct_index": 0, "explanation_marathi": "कलम 14 नुसार PM अपवादांसह कक्षेत, म्हणून A सत्य; R अपवाद व 2/3 अट स्पष्ट करते, म्हणून R सत्य व योग्य स्पष्टीकरण. B चूक (R स्पष्टीकरणच आहे), C/D चूक (A/R असत्य ठरवतात).", "evidence": "Lokpal and Lokayuktas Act, 2013 Sec 14(1)(a) proviso: PM under jurisdiction except international relations, security, public order, atomic energy, space; inquiry needs 2/3 approval of full Bench, in-camera."}, {"section": 6, "subtopic": "Maharashtra Sarpanch direct election", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "महाराष्ट्रात 2017 पासून सरपंच थेट निवड + आरक्षण/अविश्वास या दोन संकल्पना एकत्र विचारात घेता कोणते विधान बरोबर?", "q_english": "Considering direct Sarpanch election since 2017 in Maharashtra together with reservation/no-confidence, which statement is correct?", "options": ["सरपंचाची निवड सदस्यांतून; आरक्षण लागू नाही; साध्या बहुमताने कधीही अविश्वास", "सरपंचाची थेट निवड सर्व मतदारांकडून; SC/ST/महिला आरक्षण सरपंचपदाला लागू; 2 वर्षे अविश्वास आणता येत नाही", "सरपंच थेट निवड; आरक्षण फक्त सदस्यांना; 6 महिन्यांनंतर साध्या बहुमताने अविश्वास", "सरपंच निवड सदस्यांतून; सरपंचपद आरक्षित; 5 वर्षे कधीही 2/3 ने अविश्वास"], "correct_index": 1, "explanation_marathi": "2017 दुरुस्तीने कलम 30A नुसार थेट निवड; 243D नुसार सरपंचपदाला आरक्षण; कलम 35 नुसार 2 वर्षे अविश्वासास बंदी. इतर पर्याय निवड पद्धत/आरक्षण/बहुमताबाबत गैरसमजावर आधारित, म्हणून चूक.", "evidence": "Maharashtra Village Panchayats (Amendment) Act, 2017 Sec 30A: direct election of Sarpanch by village voters; Sec 30A(5) r/w Art 243D reservation to Sarpanch post; Sec 35: no no-confidence within 2 years."}, {"section": 6, "subtopic": "NJAC vs Collegium", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: A) पहिला न्यायाधीश खटला 1981 B) दुसरा न्यायाधीश खटला 1993 C) तिसरा न्यायाधीश खटला 1998 D) चौथा न्यायाधीश खटला 2015; 1) कॉलेजियम स्थापना 2) कार्यपालिका मत अंतिम 3) NJAC रद्द 4) CJI+4 वरिष्ठांचा कॉलेजियम विस्तार", "q_english": "Match: A) First Judges case 1981 B) Second Judges case 1993 C) Third Judges case 1998 D) Fourth Judges case 2015; 1) Collegium founded 2) Executive primacy 3) NJAC struck down 4) Expansion to CJI+4", "options": ["A-2, B-1, C-4, D-3", "A-1, B-2, C-4, D-3", "A-2, B-4, C-1, D-3", "A-2, B-1, C-3, D-4"], "correct_index": 0, "explanation_marathi": "A-1981 मध्ये कार्यपालिका वरचढ; B-1993 कॉलेजियम; C-1998 पाच सदस्य विस्तार; D-2015 NJAC रद्द. B-C वा 3-4 अदलाबदल करणारे पर्याय गैरसमज, म्हणून चूक.", "evidence": "S.P. Gupta (1981) executive primacy; Supreme Court Advocates-on-Record (1993) collegium; Re Presidential Reference (1998) CJI+4; Supreme Court Advocates-on-Record (2015) NJAC Act 2014 struck down 4:1."}, {"section": 6, "subtopic": "PAC vs Estimates", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): लोकलेखा समितीचे अध्यक्ष 1967 पासून विरोधी पक्षाचे नेमले जातात. कारण (R): अंदाज समितीचे 30 सदस्य पूर्णतः लोकसभेतून घेतले जातात. योग्य पर्याय निवडा.", "q_english": "Assertion (A): PAC Chairman is from Opposition since 1967. Reason (R): Estimates Committee has 30 members all from Lok Sabha. Choose correct option.", "options": ["A व R बरोबर; R हे A चे योग्य स्पष्टीकरण", "A व R बरोबर; R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 1, "explanation_marathi": "बरोबर: A सत्य (परंपरा), R सत्य (30 लोकसभा); पण R मुळे A स्पष्ट होत नाही. चूक: स्पष्टीकरण संबंध नाही; सदस्यसंख्या PAC 22 (15+7) गोंधळ टाळा.", "evidence": "PAC 22 members (15 LS+7 RS), convention since 1967 opposition chairman; Estimates Committee 30 members all from LS; Rules of Procedure LS Rule 308-310"}, {"section": 7, "subtopic": "4 labour codes 2025", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: A) वेतन संहिता – 1) किमान वेतन, बोनस B) औद्योगिक संबंध संहिता – 2) संप, टाळेबंदी C) सामाजिक सुरक्षा संहिता – 3) PF, ESI, ग्रॅच्युइटी D) OSHWC संहिता – 4) कामाचे तास, सुरक्षा. योग्य मेळ निवडा.", "q_english": "Match: A) Code on Wages – 1) minimum wage, bonus B) Industrial Relations Code – 2) strike, lockout C) Social Security Code – 3) PF, ESI, gratuity D) OSHWC Code – 4) working hours, safety. Choose correct match.", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-3, D-4", "A-1, B-3, C-2, D-4", "A-1, B-2, C-4, D-3"], "correct_index": 0, "explanation_marathi": "वेतन=वेतन व्याख्या, IR=संप-टाळेबंदी, सामाजिक सुरक्षा=PF-ESI, OSHWC=तास-सुरक्षा हाच योग्य मेळ. इतर पर्यायांत B-C, C-D ची अदलाबदल चुकीची.", "evidence": "Ministry of Labour: Code on Wages 2019; IR Code 2020; Social Security Code 2020; OSHWC Code 2020 – subject mapping"}, {"section": 7, "subtopic": "GST compensation cess end", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): GST भरपाई उपकर मार्च 2026 नंतर कर्जफेड पूर्ण झाल्याने संपुष्टात आला. कारण (R): हा उपकर फक्त राज्य भरपाई व back-to-back कर्जफेडीसाठी होता, नियमित GST महसुलासाठी नव्हता.", "q_english": "Assertion (A): GST compensation cess ended after March 2026 on loan repayment. Reason (R): The cess was only for state compensation and back-to-back loan repayment, not regular GST revenue.", "options": ["A व R सत्य, R हे A चे योग्य स्पष्टीकरण", "A व R सत्य, पण R हे A चे स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A व R सत्य; तात्पुरता हेतू संपल्याने cess संपला हे R स्पष्ट करते. इतर पर्याय स्पष्टीकरण नाकारतात किंवा सत्यता चुकवतात.", "evidence": "CBIC / GST Council - Compensation Cess extended till March 2026 for loan repayment"}, {"section": 7, "subtopic": "IPO vs FPO", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (A) IPO, (B) FPO यांच्या (1) असूचीबद्ध कंपनीची प्रथम विक्री व लिस्टिंग, (2) सूचीबद्ध कंपनीचा त्यानंतरचा सार्वजनिक निर्गम यांच्याशी. योग्य कोड निवडा.", "q_english": "Match: (A) IPO, (B) FPO with (1) First public offer and listing by unlisted company, (2) Subsequent public offer by listed company.", "options": ["A-1, B-2", "A-2, B-1", "A-1, B-1", "A-2, B-2"], "correct_index": 0, "explanation_marathi": "IPO ही प्रथम विक्री-लिस्टिंग (A-1), FPO ही नंतरची विक्री (B-2). A-2,B-1 हा अदलाबदलीचा गैरसमज; उर्वरित पर्यायांत एक जोडी चूक.", "evidence": "SEBI ICDR Regulations: IPO as initial listing offer, FPO as follow-on offer by listed issuer"}, {"section": 7, "subtopic": "IRDAI 2025", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: (1) IRDAI ची स्थापना IRDA Act 1999 अंतर्गत झाली. (2) 2025 मध्ये Bima Sugam-Vahak-Vistaar ही त्रिसूत्री पुढे आणली. (3) 2025 अखेर विम्यात 100% FDI लागू झाली होती. योग्य पर्याय निवडा.", "q_english": "Statements: (1) IRDAI was set up under IRDA Act 1999. (2) In 2025 Bima Sugam-Vahak-Vistaar trinity was pushed. (3) 100% FDI in insurance was already implemented by end-2025.", "options": ["फक्त 1 बरोबर", "1 आणि 2 बरोबर", "2 आणि 3 बरोबर", "1, 2 आणि 3 बरोबर"], "correct_index": 1, "explanation_marathi": "1 व 2 सत्य: IRDAI 1999 कायदा, Bima Trinity 2025 धोरण. 3 असत्य: 100% FDI हा 2025 अर्थसंकल्पीय प्रस्ताव, अंमलात नाही. त्यामुळे अन्य पर्याय बाद.", "evidence": "IRDA Act 1999; IRDAI Bima Trinity (Sugam/Vahak/Vistaar); Union Budget 2025 proposal for 100% insurance FDI"}, {"section": 7, "subtopic": "MIDC Maharashtra", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता (MIDC क्षेत्र–जिल्हा): A) चाकण–पुणे, B) शेंद्रा-बिडकीन–छ. संभाजीनगर, C) बुटिबोरी–नागपूर, D) तळोजा–ठाणे. तक्त्यानुसार चुकीची जोडी कोणती?", "q_english": "Table (MIDC area–district): A) Chakan–Pune, B) Shendra-Bidkin–Chh. Sambhajinagar, C) Butibori–Nagpur, D) Taloja–Thane. Which pair is wrong as per table?", "options": ["फक्त D चुकीची", "फक्त C चुकीची", "B व D चुकीच्या", "A व B चुकीच्या"], "correct_index": 0, "explanation_marathi": "A, B, C बरोबर; D चूक कारण तळोजा रायगडमध्ये आहे, ठाण्यात नाही. त्यामुळे 'फक्त D' योग्य; C, B-D, A-B असलेले पर्याय चूक.", "evidence": "MIDC official area directory: Chakan-Pune, Shendra-Bidkin–Chh. Sambhajinagar, Butibori-Nagpur, Taloja-Raigad"}, {"section": 7, "subtopic": "Mutual fund SIP", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: SIP ₹1000/महिना; NAV: महिना1 ₹100, महिना2 ₹125, महिना3 ₹80. एकूण युनिट्स व सरासरी खरेदी किंमतीबाबत योग्य विधान निवडा.", "q_english": "Table: SIP Rs 1000/month; NAV: M1 Rs 100, M2 Rs 125, M3 Rs 80. Choose correct statement on total units and average cost.", "options": ["30.5 युनिट्स, सरासरी ₹98.36; घसरणीत जास्त युनिट्सने सरासरी घटते", "30.5 युनिट्स, सरासरी ₹101.67; हीच NAV ची साधी सरासरी असते", "28.0 युनिट्स, सरासरी ₹107.14; वाढीत जास्त युनिट्स मिळतात", "30.5 युनिट्स, सरासरी ₹100.00; SIP परताव्याची हमी देते"], "correct_index": 0, "explanation_marathi": "युनिट्स 10+8+12.5=30.5, सरासरी 3000/30.5=₹98.36; घसरणीत जास्त युनिट्स. साधी सरासरी ₹101.67 चूक, उलट तर्क व हमीचा गैरसमज बाद.", "evidence": "AMFI SIP concept; Rupee cost averaging: units = sum(investment/NAV)"}, {"section": 7, "subtopic": "NABARD SHG linkage", "qtype": "कालक्रम लावा", "q_marathi": "योग्य कालक्रम लावा: (A) नाबार्डची स्थापना, (B) SHG-बँक लिंकेज पायलट प्रकल्पाची सुरुवात, (C) SHG कर्जाचा प्राधान्य क्षेत्रात समावेश. योग्य क्रम निवडा.", "q_english": "Arrange chronologically: (A) Establishment of NABARD, (B) Start of SHG-Bank Linkage pilot, (C) Inclusion of SHG lending in priority sector.", "options": ["A-B-C", "B-A-C", "A-C-B", "C-B-A"], "correct_index": 0, "explanation_marathi": "नाबार्ड 1982, SHG पायलट 1992, नंतर प्राधान्य क्षेत्र समावेश; म्हणून A-B-C योग्य. B-A-C, A-C-B, C-B-A मध्ये कालक्रम चुकतो, पायलटआधी प्राधान्य अशक्य.", "evidence": "NABARD Act 1981 (estd. 12 July 1982); NABARD SHG-Bank Linkage pilot 1992; RBI inclusion of SHG lending in priority sector"}, {"section": 7, "subtopic": "PCA framework", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): बँकेचा CRAR घसरला, निव्वळ NPA 6% पेक्षा जास्त झाला. परिणाम (E): RBI ने PCA अंतर्गत लाभांश, शाखाविस्तार व मोठ्या कर्जावर निर्बंध लादले. संबंध ओळखा.", "q_english": "Cause (C): Bank's CRAR fell, net NPA exceeded 6%. Effect (E): RBI imposed PCA curbs on dividend, branch expansion and large loans. Identify relation.", "options": ["C सत्य, E सत्य, E हा C चा तार्किक परिणाम", "C सत्य, E सत्य, पण E हा C चा परिणाम नाही", "C असत्य, E सत्य", "C सत्य, E असत्य"], "correct_index": 0, "explanation_marathi": "कमी CRAR+जास्त NPA=PCA ट्रिगर; परिणाम सुधारात्मक निर्बंध हाच. इतर पर्याय कार्यकारण संबंध नाकारतात वा सत्यता चुकवतात.", "evidence": "RBI circular on Prompt Corrective Action Framework, 2021"}, {"section": 7, "subtopic": "PDS NFSA 2013", "qtype": "कारण-परिणाम", "q_marathi": "A (कारण): NFSA 2013 अंतर्गत प्राधान्य कुटुंबातील प्रत्येक व्यक्तीला दरमहा 5 किलो धान्य मिळते. R (परिणाम): त्यामुळे अंत्योदय कुटुंबाला दरमहा 35 किलो धान्याची हमी मिळते. योग्य कारण-परिणाम संबंध निवडा.", "q_english": "A (Cause): Under NFSA 2013 every person in Priority households gets 5 kg foodgrain/month. R (Effect): Hence Antyodaya families are assured 35 kg/month. Choose correct cause-effect relation.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A व R दोन्ही NFSA कलम 3 नुसार सत्य आहेत, पण भिन्न श्रेणींसाठी आहेत; R हा A चा परिणाम नाही. म्हणून B योग्य; A मधील स्पष्टीकरण, C, D ही विधाने चुकीची.", "evidence": "NFSA 2013 Sec 3(1): 5 kg/person/month Priority; Sec 3(2): 35 kg/household/month AAY; PIB NFSA explainer"}, {"section": 7, "subtopic": "PLI scheme 2025", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: A) 13 क्षेत्रांसाठी PLI ला मंत्रिमंडळ मंजुरी, B) व्हाईट गुड्स PLI मार्गदर्शक तत्त्वे, C) IT हार्डवेअर PLI 2.0 ला मंजुरी, D) 2025 मध्ये PLI आढावा व निधी पुनर्रचना चर्चा. योग्य क्रम निवडा.", "q_english": "Arrange chronologically: A) Cabinet approval for PLI in 13 sectors, B) White Goods PLI guidelines, C) Approval for IT Hardware PLI 2.0, D) 2025 PLI review and fund restructuring discussion. Choose correct order.", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "A (नोव्हें. 2020) → B (2021) → C (मे 2023) → D (2025 आढावा) हाच क्रम बरोबर. C आधी B, B आधी A, D शेवटीच; त्यामुळे इतर तीन क्रम चूक.", "evidence": "PIB 11 Nov 2020: PLI 13 sectors; DPIIT 2021 White Goods guidelines; PIB May 2023: IT Hardware 2.0; DPIIT/PIB 2025 PLI review notes"}, {"section": 7, "subtopic": "PMFBY crop insurance", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): PMFBY मध्ये शेतकरी हप्ता खरीप 2%, रब्बी 1.5%, नगदी/फलोत्पादन 5% आहे. कारण (R): उर्वरित हप्ता केंद्र-राज्य शासन भरते.", "q_english": "Assertion (A): Under PMFBY farmer premium is 2% Kharif, 1.5% Rabi, 5% commercial/horticultural. Reason (R): Balance premium is paid by Centre-State.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण", "A व R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A व R दोन्ही सत्य; शासकीय अनुदानामुळेच कमी हप्ता शक्य, म्हणून R हे A चे स्पष्टीकरण. संबंध नाकारणारे वा सत्यता बदलणारे इतर पर्याय चूक.", "evidence": "PMFBY guidelines: farmer share 2%/1.5%/5%, balance as subsidy shared by Centre and States"}, {"section": 7, "subtopic": "QE vs QT", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: 1) QE उद्देश-a) दीर्घ दर घटवून पत वाढवणे 2) QT उद्देश-b) तरलता शोषून महागाई आटोक्यात आणणे 3) QE कृती-c) रोखे खरेदी, ताळेबंद विस्तार 4) QT कृती-d) परिपक्व रोख्यांची पुनर्गुंतवणूक थांबवणे. योग्य संकेत निवडा.", "q_english": "Match: 1) QE objective-a) lower long rates, boost credit 2) QT objective-b) absorb liquidity, curb inflation 3) QE action-c) buy bonds, expand balance sheet 4) QT action-d) stop reinvesting matured bonds.", "options": ["1-a, 2-b, 3-c, 4-d", "1-b, 2-a, 3-c, 4-d", "1-a, 2-b, 3-d, 4-c", "1-c, 2-d, 3-a, 4-b"], "correct_index": 0, "explanation_marathi": "QE=खरेदी+विस्तार+दर घट, QT=विपरीत आकुंचन. पर्याय 2 उद्देश अदलाबदल करतो, 3-4 कृती अदलाबदल करतात म्हणून चूक.", "evidence": "US Federal Reserve / RBI Bulletin explainers on QE and QT"}, {"section": 7, "subtopic": "RBI LAF vs MSF", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: A) LAF मध्ये बँका SLR कोट्यातील रोखे तारण ठेवून रेपो दराने कर्ज घेतात. B) MSF दर रेपो+स्प्रेड असतो व SLR व्यतिरिक्त रोख्यांवर overnight कर्ज मिळते. C) LAF 14 दिवसांपर्यंत तर MSF फक्त overnight असते. योग्य पर्याय निवडा.", "q_english": "Consider: A) Under LAF banks borrow at repo pledging SLR securities. B) MSF rate is repo+spread, overnight against non-SLR securities. C) LAF up to 14 days, MSF overnight only. Choose correct.", "options": ["फक्त A व B बरोबर", "फक्त B व C बरोबर", "A, B व C सर्व बरोबर", "फक्त A व C बरोबर"], "correct_index": 2, "explanation_marathi": "सर्व सत्य: LAF=SLR तारण+रेपो, MSF=SLR-बाह्य तारण+जास्त दर, मुदत फरक बरोबर. इतर पर्याय एक सत्य विधान वगळतात म्हणून चूक.", "evidence": "RBI FAQs - Liquidity Adjustment Facility and Marginal Standing Facility"}, {"section": 7, "subtopic": "RoDTEP scheme", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: 1) RoDTEP ने MEIS ची जागा घेतली, WTO-सुसंगत आहे. 2) RoDTEP मध्ये GST/IGST परत मिळतो. 3) RoDTEP मध्ये अन्यत्र परत न होणारे अंतर्निहित करच परत मिळतात. योग्य पर्याय निवडा.", "q_english": "Statements: 1) RoDTEP replaced MEIS and is WTO-compliant. 2) RoDTEP refunds GST/IGST. 3) RoDTEP remits only embedded duties not refunded elsewhere. Choose correct option.", "options": ["1 व 2 बरोबर", "1 व 3 बरोबर", "2 व 3 बरोबर", "1, 2 व 3 बरोबर"], "correct_index": 1, "explanation_marathi": "1 व 3 सत्य: RoDTEP MEIS-ऐवजी WTO-सुसंगत, अंतर्निहित कर परत करते. 2 असत्य: GST/IGST आधीच परत मिळतो. म्हणून '1 व 3' योग्य; इतर पर्याय 2 च्या चुकीमुळे चूक.", "evidence": "DGFT/CBIC RoDTEP notification 2021: replaces MEIS, WTO-compliant; only embedded levies remitted, GST/IGST excluded"}, {"section": 7, "subtopic": "Zero-based budgeting", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: आधार-1) सुरुवात: P-शून्यापासून, Q-मागील खर्च+वाढ; आधार-2) औचित्य: P-प्रत्येक खर्चाचे नव्याने समर्थन, Q-फक्त वाढीचे समर्थन. P व Q ओळखा.", "q_english": "Table: Basis-1) Start: P-from zero, Q-previous+increment; Basis-2) Justification: P-every expense re-justified, Q-only increment justified. Identify P and Q.", "options": ["P-पारंपारिक, Q-शून्य-आधारित", "P-शून्य-आधारित, Q-पारंपारिक", "P-परिणाम अंदाजपत्रक, Q-शून्य-आधारित", "P-शून्य-आधारित, Q-लिंग अंदाजपत्रक"], "correct_index": 1, "explanation_marathi": "P ही ZBB लक्षणे (शून्य+पूर्ण पुनर्मूल्यांकन), Q वृद्धिशील पारंपारिक. इतर पर्याय P/Q अदलाबदल करतात वा असंबंधित प्रकार जोडतात.", "evidence": "Ministry of Finance, GoI - Budget concepts: Zero-Based Budgeting"}, {"section": 8, "subtopic": "Antacids", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: A-Mg(OH)2, B-Al(OH)3, C-NaHCO3 यांचे परिणाम P-अ‍ॅसिड निष्प्रभ+जुलाब, Q-अ‍ॅसिड निष्प्रभ+बद्धकोष्ठता, R-अ‍ॅसिड निष्प्रभ+CO2/ढेकर. योग्य मेळ कोणता?", "q_english": "Match: A-Mg(OH)2, B-Al(OH)3, C-NaHCO3 with P-acid neutralisation+diarrhea, Q-acid neutralisation+constipation, R-acid neutralisation+CO2/belching. Correct match?", "options": ["A-P, B-Q, C-R", "A-Q, B-P, C-R", "A-P, B-R, C-Q", "A-R, B-Q, C-P"], "correct_index": 0, "explanation_marathi": "Mg(OH)2 जुलाबकारी, Al(OH)3 बद्धकोष्ठता करते, NaHCO3 CO2 सोडते म्हणून A-P,B-Q,C-R बरोबर. अदलाबदल करणारे इतर 3 पर्याय दुष्परिणामांबाबत गैरसमजातून चूक.", "evidence": "NCERT Class 10 Ch.2 Acids Bases Salts: Mg(OH)2/Al(OH)3/NaHCO3 as antacids; Mg causes diarrhea, Al causes constipation, NaHCO3 releases CO2."}, {"section": 8, "subtopic": "DNA vs RNA", "qtype": "कालक्रम लावा", "q_marathi": "प्रथिन संश्लेषणातील घटना कालक्रमानुसार लावा: (1) DNA पासून mRNA निर्मिती (transcription) (2) mRNA केंद्रकाबाहेर पडून रायबोझोमला जोडणे (3) tRNA द्वारे अमिनो आम्ल आणणे (4) अमिनो आम्लांची साखळी जुळून प्रथिन तयार होणे.", "q_english": "Arrange protein synthesis events in chronological order: (1) mRNA formation from DNA (transcription) (2) mRNA exits nucleus and binds ribosome (3) tRNA brings amino acids (4) amino acids link to form protein.", "options": ["1-2-3-4", "1-3-2-4", "2-1-3-4", "1-2-4-3"], "correct_index": 0, "explanation_marathi": "बरोबर: आधी transcription, मग mRNA रायबोझोमला, नंतर tRNA अमिनो आम्ल आणते. इतर चूक: 1-3-2-4 मध्ये tRNA आधी अशक्य; 2-1-3-4 मध्ये केंद्रकाबाहेर पडणे आधी अशक्य; 1-2-4-3 मध्ये साखळी tRNA शिवाय अशक्य.", "evidence": "NCERT Class 12 Biology Ch-5 Molecular Basis of Inheritance: transcription in nucleus precedes translation at ribosome via mRNA/tRNA."}, {"section": 8, "subtopic": "Diamond graphite carbon", "qtype": "कारण-परिणाम", "q_marathi": "कारण: हिऱ्यात प्रत्येक कार्बन sp3 ने 4 कार्बनशी बद्ध, ग्रॅफाइटमध्ये sp2 ने 3 कार्बनशी बद्ध व मुक्त इलेक्ट्रॉन. परिणाम: ? योग्य परिणाम निवडा.", "q_english": "Cause: In diamond each carbon is sp3 bonded to 4 carbons, in graphite sp2 bonded to 3 carbons with free electron. Effect:? Choose correct effect.", "options": ["हिरा सर्वात कठीण व विद्युत दुर्वाहक, ग्रॅफाइट मऊ व विद्युत सुवाहक", "हिरा मऊ व सुवाहक, ग्रॅफाइट कठीण व दुर्वाहक", "दोन्ही कठीण व सुवाहक, फक्त रंगात फरक", "हिरा सुवाहक पण मऊ, ग्रॅफाइट दुर्वाहक पण कठीण"], "correct_index": 0, "explanation_marathi": "sp3 त्रिमितीय जाळी कठीण, मुक्त e- नाही म्हणून दुर्वाहक; sp2 थर व मुक्त e- मुळे मऊ व सुवाहक. उलट किंवा समान गुण सांगणारे इतर 3 पर्याय संरचना-गुणधर्म गैरसमजातून चूक.", "evidence": "NCERT Class 10 Ch.4 Carbon and its Compounds: Diamond tetrahedral network hard/insulator, graphite layered with delocalised electrons soft/conductor."}, {"section": 8, "subtopic": "Doppler effect", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): जवळ येणाऱ्या रुग्णवाहिकेचा सायरन अधिक उच्च वारंवारतेचा ऐकू येतो. कारण (R): स्रोताच्या गतीमुळे ध्वनीचा वेग वाढतो, त्यामुळे तरंगलांबी घटते.", "q_english": "Assertion (A): Siren of approaching ambulance is heard at higher frequency. Reason (R): Source motion increases speed of sound, so wavelength decreases.", "options": ["A व R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 2, "explanation_marathi": "A सत्य: जवळ येताना आभासी वारंवारता वाढते. R असत्य: माध्यमात ध्वनीवेग स्थिर; तरंगलांबी स्रोताच्या हालचालीने घटते. दोन्ही सत्य मानणारे पहिले दोन व A चूक मानणारा चौथा पर्याय चूक.", "evidence": "NCERT Class 11 Physics Ch.14 Waves: Doppler effect, sound speed in medium constant, apparent frequency changes due to relative motion."}, {"section": 8, "subtopic": "Earthing domestic wiring", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: |तार|रंग|जोड| P|हिरवी|धातू आवरण→जमीन| Q|लाल|फेज→220V| R|काळी|न्यूट्रल| धातू इस्त्रीचे आवरण P ला जोडले आहे. गळतीने आवरणावर Q संपर्क झाल्यास सर्वोत्तम निष्कर्ष कोणता?", "q_english": "Table: Wire|Color|Connection: P|Green|Metal body→Earth, Q|Red|Phase→220V, R|Black|Neutral. Metal iron's body is connected to P. If leakage brings Q in contact with body, what is the best conclusion?", "options": ["P कमी प्रतिरोध मार्गाने प्रचंड प्रवाह जमिनीत नेते, फ्यूज उडतो व धक्का टळतो", "R कमी प्रतिरोध मार्गाने प्रवाह परत नेते, त्यामुळे फ्यूज उडतो व धक्का टळतो", "P मुळे व्होल्टेज शून्य होते म्हणून उपकरण जास्त वीज वाचवते", "Q चा प्रवाह R कडे वळतो, त्यामुळे आवरण सुरक्षित राहते व फ्यूज उडत नाही"], "correct_index": 0, "explanation_marathi": "P अर्थिंग कमी प्रतिरोध देते, गळती प्रवाह जमिनीत जाऊन फ्यूज उडतो. B मध्ये R न्यूट्रल आहे अर्थिंग नव्हे, C मध्ये वीज बचत गैरसमज, D मध्ये फ्यूज न उडणे चुकीचे.", "evidence": "NCERT Class 10 Science Ch.12 Electricity: Green earth wire gives low-resistance path for leakage current, fuse blows preventing shock."}, {"section": 8, "subtopic": "Food chain Maharashtra", "qtype": "जोड्या लावा", "q_marathi": "महाराष्ट्रातील ज्वारी शेतातील अन्नसाखळी जोड्या लावा: (P) उत्पादक, (Q) प्राथमिक भक्षक, (R) द्वितीयक भक्षक, (S) तृतीयक भक्षक. घटक: 1-ज्वारी, 2-टोळ, 3-बेडूक, 4-साप.", "q_english": "Match food chain in a Maharashtra jowar field: (P) Producer, (Q) Primary consumer, (R) Secondary consumer, (S) Tertiary consumer. Components: 1-Jowar, 2-Grasshopper, 3-Frog, 4-Snake.", "options": ["P-1, Q-2, R-3, S-4", "P-1, Q-2, R-4, S-3", "P-2, Q-1, R-3, S-4", "P-1, Q-3, R-2, S-4"], "correct_index": 0, "explanation_marathi": "बरोबर: ज्वारी→टोळ→बेडूक→साप अशी ऊर्जा-स्तर क्रमवारी. इतर चूक: साप-बेडूक अदलाबदल, उत्पादक-भक्षक अदलाबदल, टोळ-बेडूक अदलाबदल हे स्तरांबाबत गैरसमज.", "evidence": "NCERT Class 10 Science Ch-13 Our Environment: producer→herbivore→small carnivore→large carnivore trophic levels."}, {"section": 8, "subtopic": "Myopia hypermetropia", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): मायोपियात दूरच्या वस्तूची प्रतिमा दृष्टिपटलापुढे तयार होते. परिणाम (E): अंतर्गोल भिंग अपसरणाने प्रतिमा मागे सरकवून दृष्टिपटलावर आणते, म्हणून मायोपियात ते वापरतात.", "q_english": "Cause (C): In myopia image of distant object forms in front of retina. Effect (E): Concave lens diverges rays to shift image back onto retina, hence used for myopia.", "options": ["C व
