<header><h1>📝 तलाठी MPSC पूर्व परीक्षा 2026 – संच I इंटरॅक्टिव्ह क्विज</h1><p>विभाग 3 ते 8 • प्रत्येकी 15 प्रश्न • एकूण 90 प्रश्न • कठीणता 5/5 • उत्तर डीफॉल्ट लपलेले • 100% नवीन प्रश्न</p></header><div class='filters' id='filters'></div><div class='container'><div class='progress' id='progress'></div><div id='quiz'></div></div><script>
const QUESTIONS_I = [
{section:3,subtopic:"Axiom-4 / शुभांशु शुक्ला ISS 2025",qtype:"दोन संकल्पना एकत्र",q_marathi:"जून 2025 मध्ये भारतीय अंतराळवीर शुभांशु शुक्ला आंतरराष्ट्रीय अंतराळ स्थानकावर (ISS) पोहोचले. यासंदर्भातील विधाने विचारात घ्या — (I) ते Axiom Mission-4 चे पायलट होते आणि हे अभियान SpaceX च्या Falcon-9 रॉकेटने प्रक्षेपित झाले. (II) राकेश शर्मानंतर (1984) ISS ला भेट देणारे ते पहिले भारतीय ठरले.",q_english:"In June 2025 Indian astronaut Shubhanshu Shukla reached the ISS. Consider — (I) He was the pilot of Axiom Mission-4, launched by SpaceX's Falcon-9. (II) After Rakesh Sharma (1984), he became the first Indian to visit the ISS.",options:["फक्त I बरोबर (Only I)","फक्त II बरोबर (Only II)","I आणि II दोन्ही बरोबर (Both I and II)","I आणि II दोन्ही चूक (Neither)"],correct_index:2,explanation_marathi:"शुभांशु शुक्ला हे Ax-4 चे पायलट होते आणि 25 जून 2025 रोजी Falcon-9 ने प्रक्षेपण झाले — विधान I बरोबर. राकेश शर्मा 1984 मध्ये सोव्हिएतच्या साल्युट-7 स्थानकावर गेले होते, ISS वर नव्हे; त्यामुळे ISS ला जाणारे शुक्ला हेच पहिले भारतीय — विधान II पण बरोबर. पर्याय A चूक कारण II वगळले, B चूक कारण I वगळले, D चूक कारण दोन्ही बरोबर आहेत.",evidence:"Axiom Space / ISRO press release, June 2025"},
{section:3,subtopic:"राष्ट्रीय सहकार धोरण 2025",qtype:"बहु-विधान (I, II, III)",q_marathi:"नवीन राष्ट्रीय सहकार धोरण 2025 संदर्भात विधाने पहा — (I) 2002 च्या धोरणाची जागा घेणारे हे नवीन राष्ट्रीय सहकार धोरण 2025 मध्ये जाहीर झाले. (II) 'सहकारातून समृद्धी' हे या धोरणाचे घोषवाक्य असून ग्रामीण अर्थव्यवस्थेला चालना देणे हे उद्दिष्ट आहे. (III) या धोरणाच्या अंमलबजावणीसाठी नीती आयोग नोडल संस्था असेल.",q_english:"On the new National Cooperation Policy 2025 — (I) It replaces the 2002 policy and was announced in 2025. (II) Its motto is 'Sahkar se Samriddhi' with rural economy boost as goal. (III) NITI Aayog will be the nodal agency for implementation.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त I बरोबर"],correct_index:1,explanation_marathi:"2002 च्या धोरणानंतर 2025 मध्ये नवीन राष्ट्रीय सहकार धोरण जाहीर झाले — I बरोबर. 'सहकारातून समृद्धी' हे घोषवाक्य खरे — II बरोबर. पण नोडल संस्था नीती आयोग नव्हे, तर जुलै 2021 मध्ये स्थापन झालेले सहकार मंत्रालय आहे — III चूक. त्यामुळे A चूक (III चूक), C चूक (III चूक आणि I वगळला), D चूक (II पण बरोबर).",evidence:"Ministry of Cooperation announcements, 2025"},
{section:3,subtopic:"राष्ट्रीय क्रिटिकल खनिज अभियान 2025",qtype:"Assertion-Reason",q_marathi:"विधान (A): जानेवारी 2025 मध्ये केंद्रीय मंत्रिमंडळाने सुमारे ₹16,300 कोटी परिव्ययाच्या राष्ट्रीय क्रिटिकल खनिज अभियानाला मंजुरी दिली. कारण (R): या अभियानांतर्गत लिथियम, कोबाल्ट, निकेल यांसारख्या 24 खनिजांना क्रिटिकल खनिज म्हणून अधिसूचित करण्यात आले आहे.",q_english:"Assertion (A): In January 2025 the Union Cabinet approved the National Critical Mineral Mission with ~Rs 16,300 crore outlay. Reason (R): Under it, 24 minerals like lithium, cobalt, nickel are notified as critical minerals.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:2,explanation_marathi:"जानेवारी 2025 मध्ये ₹16,300 कोटींच्या अभियानाला मंजुरी मिळाली — A बरोबर. पण क्रिटिकल खनिजांची अधिसूचित यादी 30 खनिजांची आहे (2023), 24 नव्हे — R चूक. त्यामुळे A आणि B पर्याय (दोन्ही बरोबर मानणारे) चूक; D चूक कारण A बरोबर आहे.",evidence:"Cabinet decision Jan 2025; Ministry of Mines (30 critical minerals, 2023)"},
{section:3,subtopic:"खोल महासागर अभियान / मत्स्य-6000",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) मत्स्ययान-6000 (b) वराह (c) खोल महासागर अभियानाची नोडल संस्था (d) अभियानाचे खोली लक्ष्य : (1) 6000 मीटर खोलीपर्यंत 3 व्यक्ती नेणारी मानवी पाणबुडी (2) खोल समुद्रातील खनिज शोधासाठी NIOT ने विकसित केलेली यंत्रणा (3) पृथ्वी विज्ञान मंत्रालय (4) 2026 पर्यंत सागर चाचण्यांचे लक्ष्य",q_english:"Match — (a) Matsya-6000 (b) Varaha (c) Nodal agency of Deep Ocean Mission (d) Depth target : (1) Manned submersible for 3 persons to 6000 m (2) NIOT-developed deep-sea mineral exploration system (3) Ministry of Earth Sciences (4) Sea-trial target by 2026",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-3, c-2, d-4","a-1, b-2, c-4, d-3"],correct_index:0,explanation_marathi:"मत्स्ययान-6000 ही 3 व्यक्तींची 6000 मी मानवी पाणबुडी (a-1); वराह ही NIOT ची खोल समुद्र खनिज शोध यंत्रणा (b-2); नोडल संस्था पृथ्वी विज्ञान मंत्रालय (c-3); 2026 पर्यंत चाचण्यांचे लक्ष्य (d-4). B मध्ये a-b अदलाबदल चूक; C मध्ये b-c अदलाबदल चूक; D मध्ये c-d अदलाबदल चूक.",evidence:"MoES / NIOT, Deep Ocean Mission"},
{section:3,subtopic:"खो-खो विश्वचषक 2025",qtype:"तक्ता आधारित",q_marathi:"पहिल्या खो-खो विश्वचषकाबद्दल (जानेवारी 2025, नवी दिल्ली): पुरुष गटात भारताने नेपाळचा तर महिला गटातही भारताने नेपाळचाच पराभव करून विजेतेपद पटकावले. खालीलपैकी कोणते विधान चूक आहे?",q_english:"On the first Kho-Kho World Cup (Jan 2025, New Delhi): India beat Nepal in men's final and also in women's final. Which statement is INCORRECT?",options:["पहिला खो-खो विश्वचषक जानेवारी 2025 मध्ये नवी दिल्ली येथे झाला","पुरुष व महिला दोन्ही गटांत भारताने नेपाळचा पराभव केला","या स्पर्धेचे आयोजन भारतीय ऑलिंपिक संघटनेने केले होते","दोन्ही अंतिम सामन्यांत भारत विजेता ठरला"],correct_index:2,explanation_marathi:"आयोजन भारतीय ऑलिंपिक संघटनेने नव्हे, तर आंतरराष्ट्रीय खो-खो महासंघ व भारतीय खो-खो महासंघाने (KKFI) केले — त्यामुळे C चूक. A, B, D ही तिन्ही विधाने तथ्यांशी जुळतात, म्हणून ती योग्य पर्याय ठरू शकत नाहीत.",evidence:"Kho Kho Federation of India, Jan 2025"},
{section:3,subtopic:"राष्ट्रीय क्रीडा प्रशासन कायदा 2025",qtype:"बहु-विधान (I, II, III)",q_marathi:"ऑगस्ट 2025 मध्ये मंजूर झालेल्या राष्ट्रीय क्रीडा प्रशासन कायद्याबद्दल — (I) या कायद्यात राष्ट्रीय क्रीडा न्यायाधिकरण स्थापनेची तरतूद आहे. (II) मान्यताप्राप्त राष्ट्रीय क्रीडा महासंघ माहिती अधिकार कक्षेत येतात. (III) BCCI ला या कायद्यातून पूर्ण सूट देण्यात आली आहे.",q_english:"On the National Sports Governance Act passed in Aug 2025 — (I) It provides for a National Sports Tribunal. (II) Recognised NSFs come under RTI ambit. (III) BCCI is fully exempted from this Act.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त III बरोबर"],correct_index:1,explanation_marathi:"राष्ट्रीय क्रीडा न्यायाधिकरणाची तरतूद खरोखर आहे — I बरोबर. मान्यताप्राप्त महासंघ RTI कक्षेत येतात — II बरोबर. पण BCCI ला सूट नाही; उलट BCCI ला राष्ट्रीय क्रीडा महासंघ म्हणूनच या कायद्यात समाविष्ट केले आहे — III चूक. त्यामुळे A, C, D चूक.",evidence:"National Sports Governance Act, 2025 (Aug 2025)"},
{section:3,subtopic:"PM इंटर्नशिप योजना",qtype:"कारण-परिणाम",q_marathi:"विधान (A): 2024 मध्ये जाहीर झालेल्या PM इंटर्नशिप योजनेंतर्गत 21-24 वयोगटातील युवकांना 12 महिन्यांची इंटर्नशिप व दरमहा ₹5,000 भत्ता दिला जातो. विधान (B): पूर्णवेळ नोकरीत असलेले किंवा उच्च शिक्षण घेत असलेले युवकही या योजनेचा लाभ घेऊ शकतात.",q_english:"Statement (A): Under the PM Internship Scheme announced in 2024, youth aged 21-24 get a 12-month internship with Rs 5,000/month allowance. Statement (B): Youth in full-time jobs or pursuing higher education are also eligible.",options:["दोन्ही बरोबर; B हे A चा परिणाम","दोन्ही बरोबर; B हे A चा परिणाम नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:2,explanation_marathi:"वयोमर्यादा, 12 महिने कालावधी व ₹5,000 (केंद्र ₹4,500 + कंपनी ₹500) भत्ता — A बरोबर. पण पूर्णवेळ नोकरी/शिक्षणातील युवक या योजनेतून वगळलेले आहेत — B चूक. त्यामुळे A, B पर्याय चूक; D चूक कारण A बरोबर आहे.",evidence:"Union Budget 2024; MCA pilot Oct 2024"},
{section:3,subtopic:"जीनोम इंडिया प्रकल्प",qtype:"Assertion-Reason",q_marathi:"विधान (A): जानेवारी 2025 मध्ये जीनोम इंडिया प्रकल्पांतर्गत 10,000 भारतीयांच्या जीनोम अनुक्रमणाचा डेटा संशोधनासाठी खुला करण्यात आला. कारण (R): हा प्रकल्प जैवतंत्रज्ञान विभागाच्या (DBT) नेतृत्वाखाली राबवण्यात आला.",q_english:"Assertion (A): In January 2025 genome sequencing data of 10,000 Indians under Genome India Project was opened for research. Reason (R): The project is led by the Department of Biotechnology (DBT).",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"जानेवारी 2025 मध्ये 10,000 जीनोमचा डेटा IBDC मध्ये खुला झाला — A बरोबर. प्रकल्प DBT च्या नेतृत्वाखाली (20 संस्थांच्या सहकार्याने) राबवला — R बरोबर आणि A चे योग्य स्पष्टीकरणही आहे. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक कारण दोन्ही विधाने बरोबर.",evidence:"Department of Biotechnology, Jan 2025"},
{section:3,subtopic:"राष्ट्रीय हळद मंडळ 2025",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) स्थापना (b) मुख्यालय (c) उद्दिष्ट (d) नोडल मंत्रालय : (1) जानेवारी 2025 (2) निजामाबाद, तेलंगणा (3) हळदीची निर्यात व मूल्यवर्धन वाढवणे (2030 पर्यंत $1 अब्ज निर्यात लक्ष्य) (4) वाणिज्य व उद्योग मंत्रालय",q_english:"Match — (a) Establishment (b) HQ (c) Objective (d) Nodal ministry : (1) January 2025 (2) Nizamabad, Telangana (3) Boost turmeric export & value addition ($1 bn export target by 2030) (4) Ministry of Commerce & Industry",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-1, b-2, c-4, d-3","a-4, b-2, c-3, d-1"],correct_index:0,explanation_marathi:"मंडळाची स्थापना जानेवारी 2025 (a-1), मुख्यालय निजामाबाद (b-2), उद्दिष्ट निर्यात-मूल्यवर्धन (c-3), नोडल वाणिज्य मंत्रालय (d-4). B मध्ये a-b व c-d अदलाबदल; C मध्ये c-d अदलाबदल; D मध्ये a-d अदलाबदल — त्यामुळे चूक.",evidence:"Ministry of Commerce & Industry, Jan 2025"},
{section:3,subtopic:"मिशन मौसम 2024",qtype:"बहु-विधान (I, II, III)",q_marathi:"मिशन मौसम बद्दल — (I) सप्टेंबर 2024 मध्ये ₹2,000 कोटी परिव्ययासह याला मंजुरी मिळाली. (II) पृथ्वी विज्ञान मंत्रालय नोडल असून IMD, IITM व NCMRWF सहभागी आहेत. (III) हवामान निरीक्षण, प्रारूपण (modeling) व आपत्ती व्यवस्थापन क्षमता वाढवणे हे उद्दिष्ट आहे.",q_english:"On Mission Mausam — (I) Approved in Sept 2024 with Rs 2,000 crore outlay. (II) MoES is nodal with IMD, IITM, NCMRWF participating. (III) Goal is better weather observation, modelling and disaster management.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त I आणि III बरोबर","फक्त II बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने तथ्यांशी जुळतात: मंजुरी सप्टेंबर 2024, ₹2,000 कोटी (2024-26); नोडल पृथ्वी विज्ञान मंत्रालय; उद्दिष्ट निरीक्षण-प्रारूपण-आपत्ती व्यवस्थापन. त्यामुळे B, C, D अपूर्ण/चुकीचे.",evidence:"Cabinet decision, Sept 2024 (MoES)"},
{section:3,subtopic:"PM E-DRIVE vs FAME-II",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) FAME-II (2019-2024) नंतर ऑक्टोबर 2024 मध्ये ₹10,900 कोटींची PM E-DRIVE योजना (2 वर्षांसाठी) सुरू झाली. (II) PM E-DRIVE मध्ये ई-बस व ई-रुग्णवाहिकांचाही समावेश आहे, तर FAME-II चा भर प्रामुख्याने दुचाकी व तिचाकींवर होता.",q_english:"Consider — (I) After FAME-II (2019-2024), PM E-DRIVE (Rs 10,900 cr, 2 years) launched in Oct 2024. (II) PM E-DRIVE also covers e-buses and e-ambulances, while FAME-II focused mainly on 2/3-wheelers.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"PM E-DRIVE ऑक्टोबर 2024 मध्ये ₹10,900 कोटींसह 2 वर्षांसाठी — I बरोबर. त्यात ई-बस (14,028), ई-रुग्णवाहिका व चार्जिंग पायाभूत सुविधा आहेत; FAME-II चा भर दुचाकी/तिचाकींवर होता — II बरोबर. A, B अपूर्ण; D पूर्ण चूक.",evidence:"Ministry of Heavy Industries, Oct 2024"},
{section:3,subtopic:"SCO शिखर परिषदा क्रम",qtype:"कालक्रम लावा",q_marathi:"SCO शिखर परिषदांचा योग्य कालक्रम लावा — (a) समरकंद (b) नवी दिल्ली (आभासी) (c) अस्ताना (d) तियानजिन",q_english:"Arrange SCO summits chronologically — (a) Samarkand (b) New Delhi (virtual) (c) Astana (d) Tianjin",options:["a-b-c-d","b-a-d-c","a-c-b-d","d-c-b-a"],correct_index:0,explanation_marathi:"योग्य क्रम: समरकंद (2022) → नवी दिल्ली आभासी (2023) → अस्ताना (2024) → तियानजिन (2025). B मध्ये b-a चूक; C मध्ये b-c अदलाबदल; D हा उलटा क्रम आहे.",evidence:"SCO Secretariat summit records"},
{section:3,subtopic:"भारत-न्यूझीलंड FTA वाटाघाटी",qtype:"कारण-परिणाम",q_marathi:"विधान (A): मार्च 2025 मध्ये भारत-न्यूझीलंड मुक्त व्यापार कराराच्या वाटाघाटी सुमारे 10 वर्षांच्या खंडानंतर पुन्हा सुरू झाल्या. विधान (B): यापूर्वी 2019 मध्ये दोन्ही देशांनी RCEP मधून एकत्र माघार घेतली होती.",q_english:"Statement (A): In March 2025 India-New Zealand FTA talks resumed after ~10 years. Statement (B): Earlier in 2019 both countries jointly withdrew from RCEP.",options:["दोन्ही बरोबर; B हे A चे कारण","दोन्ही बरोबर; B हे A चे कारण नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:2,explanation_marathi:"वाटाघाटी मार्च 2025 मध्ये खरोखर पुन्हा सुरू झाल्या — A बरोबर. पण RCEP मधून 2019 मध्ये फक्त भारत बाहेर पडला; न्यूझीलंड RCEP चा सदस्य आहे — B चूक. त्यामुळे A, B पर्याय चूक; D चूक कारण A बरोबर.",evidence:"Ministry of Commerce & Industry, March 2025"},
{section:3,subtopic:"ABDM / ABHA",qtype:"तक्ता आधारित",q_marathi:"आयुष्मान भारत डिजिटल मिशन (ABDM) बद्दल खालीलपैकी कोणते विधान चूक आहे? (ABHA = 14 अंकी आरोग्य ओळख क्रमांक; नोडल = राष्ट्रीय आरोग्य प्राधिकरण)",q_english:"Which statement on ABDM is INCORRECT? (ABHA = 14-digit health ID; nodal = NHA)",options:["ABHA हा 14 अंकी आरोग्य ओळख क्रमांक आहे","ABDM ची नोडल संस्था राष्ट्रीय आरोग्य प्राधिकरण (NHA) आहे","आरोग्य नोंदींची देवाणघेवाण संमती व्यवस्थापकाद्वारे (consent manager) होते","ABHA क्रमांकासाठी आधार सक्तीचा आहे"],correct_index:3,explanation_marathi:"ABHA साठी आधार सक्तीचा नाही; आधारऐवजी वाहन परवाना इत्यादी ओळखपत्रे चालतात व आधार सीडिंग ऐच्छिक आहे — त्यामुळे D चूक. A, B, C तिन्ही बरोबर विधाने आहेत.",evidence:"National Health Authority (ABDM guidelines)"},
{section:3,subtopic:"राफेल-M करार 2025",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) करार (b) मूल्य (c) उद्देश (d) पुरवठादार : (1) एप्रिल 2025; 26 राफेल-M विमाने (2) सुमारे ₹63,000 कोटी (3) INS विक्रांतसाठी नौदलाची वाहक-आधारित लढाऊ विमाने (4) फ्रान्सची दसॉल्ट एव्हिएशन",q_english:"Match — (a) Deal (b) Value (c) Purpose (d) Supplier : (1) April 2025; 26 Rafale-M jets (2) ~Rs 63,000 crore (3) Carrier-based fighters for INS Vikrant (4) France's Dassault Aviation",options:["a-1, b-2, c-3, d-4","a-1, b-3, c-2, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3"],correct_index:0,explanation_marathi:"करार एप्रिल 2025 मध्ये 26 विमानांसाठी (a-1); मूल्य सुमारे ₹63,000 कोटी (b-2); उद्देश INS विक्रांतसाठी नौदल लढाऊ विमाने (c-3); पुरवठादार दसॉल्ट (d-4). B मध्ये b-c, C मध्ये a-b, D मध्ये c-d अदलाबदल — चूक.",evidence:"Ministry of Defence, April 2025"},
{section:4,subtopic:"कालीबंगा vs लोथल हडप्पा स्थळे",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) कालीबंगा (b) लोथल (c) धोलाविरा (d) राखीगढी : (1) नांगरलेल्या शेताचे अवशेष — राजस्थान (2) गोदीवाडा (dockyard) — गुजरात (3) जलव्यवस्थापन व स्टेडियम — कच्छ (4) सर्वात मोठे हडप्पा स्थळ — हरियाणा",q_english:"Match — (a) Kalibangan (b) Lothal (c) Dholavira (d) Rakhigarhi : (1) Ploughed field remains — Rajasthan (2) Dockyard — Gujarat (3) Water management & stadium — Kutch (4) Largest Harappan site — Haryana",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-1, b-3, c-2, d-4","a-4, b-2, c-3, d-1"],correct_index:0,explanation_marathi:"कालीबंगा येथे नांगरलेले शेत (a-1); लोथल येथे गोदीवाडा (b-2); धोलाविरा येथे जलव्यवस्थापन (c-3); राखीगढी सर्वात मोठे स्थळ (d-4). B मध्ये a-b व c-d अदलाबदल; C मध्ये b-c अदलाबदल; D मध्ये a-d अदलाबदल — त्यामुळे चूक.",evidence:"Archaeological Survey of India"},
{section:4,subtopic:"दाशराज्ञ युद्ध",qtype:"Assertion-Reason",q_marathi:"विधान (A): ऋग्वेदातील दाशराज्ञ युद्ध परुष्णी (रावी) नदीच्या काठी झाले. कारण (R): या युद्धात सुदास या भरत राजाने विश्वामित्रांच्या नेतृत्वाखालील दहा राजांच्या संघाचा पराभव केला.",q_english:"Assertion (A): The Rigvedic Battle of Ten Kings was fought on the banks of the Parushni (Ravi). Reason (R): King Sudas of the Bharatas defeated the ten-king confederacy led by Vishvamitra.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"दाशराज्ञ युद्ध परुष्णी (रावी) काठी झाले — A बरोबर. सुदासने दहा राजांच्या संघाचा पराभव केला — R बरोबर आणि A मधील युद्धाचे स्वरूप स्पष्ट करते. C, D चूक कारण दोन्ही विधाने बरोबर; B चूक कारण R हेच योग्य स्पष्टीकरण आहे.",evidence:"Rigveda, Mandala 7"},
{section:4,subtopic:"मगध वंशक्रम",qtype:"कालक्रम लावा",q_marathi:"मगधवरील वंशांचा योग्य कालक्रम लावा — (a) हर्यक (बिंबिसार-अजातशत्रू) (b) शिशुनाग (c) नंद (d) मौर्य",q_english:"Arrange Magadha dynasties chronologically — (a) Haryanka (Bimbisara-Ajatshatru) (b) Shishunaga (c) Nanda (d) Maurya",options:["a-b-c-d","a-c-b-d","b-a-d-c","d-c-b-a"],correct_index:0,explanation_marathi:"योग्य क्रम: हर्यक (इ.स.पू. 6वे शतक) → शिशुनाग → नंद (महापद्मनंद) → मौर्य (चंद्रगुप्त, इ.स.पू. 321). B मध्ये b-c अदलाबदल; C मध्ये सुरुवातच चूक; D हा उलटा क्रम.",evidence:"Standard ancient Indian history (NCERT)"},
{section:4,subtopic:"चंद्रगुप्त-श्रवणबेळगोळ",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) जैन परंपरेनुसार चंद्रगुप्त मौर्याने आयुष्याच्या अखेरीस कर्नाटकातील श्रवणबेळगोळ येथे संल्लेखना (सल्लेखना) घेतली. (II) त्याच्यासोबत जैन मुनी भद्रबाहू दक्षिणेत आले होते आणि चंद्रगुप्त त्यांचा शिष्य होता.",q_english:"Consider — (I) Per Jain tradition Chandragupta Maurya took sallekhana at Shravanabelagola (Karnataka) at life's end. (II) Jain monk Bhadrabahu had come south with him and Chandragupta was his disciple.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"जैन ग्रंथांनुसार (परिशिष्टपर्वन) चंद्रगुप्ताने भद्रबाहूंसोबत दक्षिणेत जाऊन श्रवणबेळगोळ येथे संल्लेखना घेतली — दोन्ही विधाने परंपरेशी सुसंगत. A, B अपूर्ण; D चूक कारण दोन्ही विधाने जैन परंपरेत मान्य आहेत.",evidence:"Jain texts (Parishishtaparvan); Shravanabelagola inscriptions"},
{section:4,subtopic:"कनिष्क चतुर्थ बौद्ध संगीती",qtype:"बहु-विधान (I, II, III)",q_marathi:"चतुर्थ बौद्ध संगीतीबद्दल — (I) कनिष्काच्या काळात काश्मीरमधील कुंडलवन येथे ही संगीती झाली. (II) अध्यक्ष वसुमित्र होते व यात 'महाविभाषा' ग्रंथाची रचना झाली. (III) या संगीतीत पाली भाषेत त्रिपिटक निश्चित करण्यात आले.",q_english:"On the Fourth Buddhist Council — (I) Held at Kundalvana (Kashmir) in Kanishka's time. (II) Vasumitra presided; 'Mahavibhasha' was composed. (III) The Tripitaka was finalised in Pali here.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त III बरोबर"],correct_index:1,explanation_marathi:"कुंडलवन येथे संगीती — I बरोबर. अध्यक्ष वसुमित्र, महाविभाषा रचना — II बरोबर. पण या संगीतीचे काम संस्कृत भाषेत झाले, पालीत नव्हे — III चूक. त्यामुळे A, C, D चूक.",evidence:"Buddhist tradition; NCERT ancient history"},
{section:4,subtopic:"महादजी शिंदे 1771 दिल्ली",qtype:"कारण-परिणाम",q_marathi:"विधान (A): 1771 मध्ये महादजी शिंद्यांनी मुघल बादशाह शाह आलम II ला अलाहाबादहून आणून दिल्लीच्या तख्तावर पुन्हा बसवले. विधान (B): यामुळे मराठ्यांना मुघल दरबारात 'वकील-ए-मुतलक' हे सर्वोच्च पद मिळाले व उत्तर भारतात मराठा वर्चस्व प्रस्थापित झाले.",q_english:"Statement (A): In 1771 Mahadji Shinde restored Mughal emperor Shah Alam II to Delhi's throne. Statement (B): This won the Marathas the post of 'Vakil-i-Mutlak' and supremacy in North India.",options:["दोन्ही बरोबर; B हे A चा परिणाम","दोन्ही बरोबर; B हे A चा परिणाम नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:0,explanation_marathi:"1771 मध्ये शाह आलम II ची दिल्लीत पुनर्स्थापना महादजींनी केली — A बरोबर. परिणामी 1784 च्या सुमारास महादजी 'वकील-ए-मुतलक' झाले व मराठा वर्चस्व प्रस्थापित झाले — B हा A चाच परिणाम. B पर्याय चूक कारण B परिणामच आहे; C, D चूक कारण दोन्ही विधाने बरोबर.",evidence:"Maratha history (Grant Duff; Sarkar)"},
{section:4,subtopic:"माधवराव पेशवे पुनरुत्थान",qtype:"Assertion-Reason",q_marathi:"विधान (A): पानिपतच्या (1761) पराभवानंतर माधवराव पेशव्यांनी 1761-72 या काळात मराठा सत्तेचे पुनरुत्थान घडवून आणले. कारण (R): त्यांनी निजामाचा व हैदर अलीचा पराभव करून उत्तर-दक्षिणेत मराठा चौथाई-सरदेशमुखी पुन्हा लागू केली.",q_english:"Assertion (A): After Panipat (1761), Madhavrao Peshwa revived Maratha power during 1761-72. Reason (R): He defeated the Nizam and Hyder Ali and reimposed chauth-sardeshmukhi.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"माधवरावांच्या काळात (1761-72) राक्षसभुवन (1763, निजाम पराभव) व हैदरवरील मोहिमा झाल्या — A आणि R दोन्ही बरोबर, आणि R हेच पुनरुत्थानाचे स्पष्टीकरण आहे. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक.",evidence:"Maratha history (Sardesai)"},
{section:4,subtopic:"सूरत तह 1775",qtype:"बहु-विधान (I, II, III)",q_marathi:"सूरतच्या तहाबद्दल (1775) — (I) रघुनाथरावाने (राघोबा) पेशवेपदासाठी इंग्रजांची मदत मागून हा तह केला. (II) या तहानुसार इंग्रजांना साष्टी व वसईची ठाणी मिळणार होती. (III) या तहानंतर पहिले इंग्रज-मराठा युद्ध (1775-82) सुरू झाले.",q_english:"On the Treaty of Surat (1775) — (I) Raghunath Rao sought British help for Peshwaship. (II) The British were to get Salsette and Bassein. (III) The First Anglo-Maratha War (1775-82) followed.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त I बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने बरोबर: राघोबाने 1775 मध्ये सूरतचा तह केला; साष्टी-वसईचे आश्वासन; परिणामी 1775-82 चे पहिले युद्ध व पुढे वडगाव (1779), सालबाई तह (1782). B, C अपूर्ण; D अपूर्ण.",evidence:"Anglo-Maratha history; Treaty of Surat 1775"},
{section:4,subtopic:"म्हैसूरची चार युद्धे",qtype:"कालक्रम लावा",q_marathi:"इंग्रज-म्हैसूर युद्धांचा योग्य कालक्रम लावा — (a) पहिले युद्ध (1767-69) (b) दुसरे युद्ध (1780-84) (c) तिसरे युद्ध (1790-92) (d) चवथे युद्ध (1799)",q_english:"Arrange the Anglo-Mysore wars chronologically — (a) First (1767-69) (b) Second (1780-84) (c) Third (1790-92) (d) Fourth (1799)",options:["a-b-c-d","b-a-c-d","a-c-b-d","d-c-b-a"],correct_index:0,explanation_marathi:"योग्य क्रम: पहिले (1767-69, मद्रास तह) → दुसरे (1780-84, मंगलोर तह) → तिसरे (1790-92, श्रीरंगपट्टणम तह) → चवथे (1799, टिपूचा मृत्यू). B मध्ये a-b अदलाबदल; C मध्ये b-c अदलाबदल; D उलटा क्रम.",evidence:"NCERT modern history"},
{section:4,subtopic:"वेल्लोर बंड 1806",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) तामिळनाडूतील वेल्लोर येथील 1806 चे शिपाई बंड हे 1857 पूर्वीचे पहिले मोठे सैनिक बंड मानले जाते. (II) नवीन पगडी/डोक्यावरील टोपीचे नियम व कपाळावरील धार्मिक चिन्हांवरील बंदी हे या बंडाचे तात्काळ कारण होते.",q_english:"Consider — (I) The 1806 Vellore sepoy mutiny (Tamil Nadu) is regarded as the first major military revolt before 1857. (II) New turban/headgear rules and ban on religious marks on forehead were its immediate cause.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"10 जुलै 1806 चे वेल्लोर बंड 1857 पूर्वीचे महत्त्वाचे सैनिक बंड — I बरोबर. चामड्याची टोपी व धार्मिक चिन्हबंदी हे तात्काळ कारण — II बरोबर. A, B अपूर्ण; D चूक.",evidence:"NCERT modern history"},
{section:4,subtopic:"रौलेट सत्याग्रह 1919",qtype:"बहु-विधान (I, II, III)",q_marathi:"रौलेट कायद्याबद्दल — (I) मार्च 1919 मध्ये इम्पीरियल लेजिस्लेटिव्ह कौन्सिलने हा कायदा मंजूर केला. (II) या कायद्याला 'काळा कायदा' म्हटले जाते. (III) या कायद्याविरोधात गांधीजींनी 1919 मध्ये प्रथमच 'सत्याग्रह' हा शब्द वापरला.",q_english:"On the Rowlatt Act — (I) Passed by the Imperial Legislative Council in March 1919. (II) Called the 'Black Act'. (III) Gandhi first used the word 'satyagraha' against this Act in 1919.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त III बरोबर"],correct_index:1,explanation_marathi:"कायदा मार्च 1919 मध्ये मंजूर — I बरोबर. 'काळा कायदा' म्हणून कुप्रसिद्ध — II बरोबर. पण 'सत्याग्रह' शब्द गांधीजींनी 1906 मध्येच दक्षिण आफ्रिकेत वापरला होता — III चूक. त्यामुळे A, C, D चूक.",evidence:"NCERT modern history"},
{section:4,subtopic:"स्वराज्य पक्ष 1923",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) स्थापना (b) संस्थापक (c) धोरण (d) 1925 मधील यश : (1) जानेवारी 1923 (अलाहाबाद) (2) मोतीलाल नेहरू व चित्तरंजन दास (3) कौन्सिल प्रवेश व आतून अडथळा (obstruction) (4) विठ्ठलभाई पटेल केंद्रीय कायदेमंडळाचे अध्यक्ष",q_english:"Match — (a) Formation (b) Founders (c) Policy (d) 1925 success : (1) Jan 1923 (Allahabad) (2) Motilal Nehru & C.R. Das (3) Council entry & obstruction from within (4) Vithalbhai Patel as Central Assembly President",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"स्थापना जानेवारी 1923 (a-1); संस्थापक मोतीलाल-चित्तरंजन (b-2); धोरण कौन्सिल प्रवेश व अडथळा (c-3); 1925 मध्ये विठ्ठलभाई पटेल अध्यक्ष (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"NCERT modern history"},
{section:4,subtopic:"नेहरू अहवाल vs जिनांची 14 कलमे",qtype:"Assertion-Reason",q_marathi:"विधान (A): 1928 च्या नेहरू अहवालाने भारतासाठी 'डोमिनियन स्टेटस'ची मागणी केली होती. कारण (R): 1929 मध्ये जिनांनी मांडलेल्या 14 कलमांत मुस्लिमांसाठी स्वतंत्र मतदारसंघ व केंद्रात एकतृतीयांश प्रतिनिधित्व मागितले होते.",q_english:"Assertion (A): The 1928 Nehru Report demanded 'Dominion Status' for India. Reason (R): Jinnah's 1929 Fourteen Points demanded separate electorates and one-third central representation for Muslims.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:1,explanation_marathi:"नेहरू अहवालात डोमिनियन स्टेटस — A बरोबर. जिनांची 14 कलमे (मार्च 1929) — R बरोबर. पण R हे A चे स्पष्टीकरण नाही; उलट R ही A ला दिलेली प्रतिक्रिया/पर्यायी मागणी आहे. त्यामुळे A चूक; C, D चूक.",evidence:"NCERT modern history"},
{section:4,subtopic:"लाहोर अधिवेशन 1929",qtype:"कारण-परिणाम",q_marathi:"विधान (A): डिसेंबर 1929 मध्ये लाहोर अधिवेशनात (अध्यक्ष जवाहरलाल नेहरू) काँग्रेसने 'पूर्ण स्वराज्य'चा ठराव मंजूर केला. विधान (B): या ठरावानंतर 26 जानेवारी 1930 रोजी देशभर पहिला स्वातंत्र्यदिन साजरा करण्यात आला.",q_english:"Statement (A): In Dec 1929 the Lahore session (Jawaharlal Nehru presiding) passed the 'Purna Swaraj' resolution. Statement (B): Following it, the first Independence Day was observed on 26 Jan 1930.",options:["दोन्ही बरोबर; B हे A चा परिणाम","दोन्ही बरोबर; B हे A चा परिणाम नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:0,explanation_marathi:"लाहोर 1929 मध्ये पूर्ण स्वराज्य ठराव — A बरोबर. त्यानुसार 26 जानेवारी 1930 रोजी स्वातंत्र्यदिन — B हा A चाच थेट परिणाम. B पर्याय चूक कारण B परिणामच आहे; C, D चूक.",evidence:"NCERT modern history"},
{section:4,subtopic:"नौदल उठाव 1946",qtype:"तक्ता आधारित",q_marathi:"1946 च्या नौदल उठावाबद्दल (जहाज: HMIS तलवार; ठिकाण: मुंबई; तारीख: 18 फेब्रुवारी 1946; प्रमुख: बी. सी. दत्त) खालीलपैकी कोणते विधान चूक आहे?",q_english:"Which statement on the 1946 Naval Mutiny (HMIS Talwar, Bombay, 18 Feb 1946, B.C. Dutt) is INCORRECT?",options:["उठावाला सुरुवात HMIS तलवार जहाजावरील खलाशांनी केली","निकृष्ट अन्न व वांशिक भेदभाव ही उठावाची कारणे होती","या उठावाला सरदार पटेलांनी उघड पाठिंबा दिला होता","रॉयल इंडियन एअर फोर्सच्या काही जवानांनीही संपात सहभाग घेतला"],correct_index:2,explanation_marathi:"काँग्रेस नेतृत्वाने (पटेलांसह) उठावाला उघड पाठिंबा दिला नाही; उलट शांततेचे आवाहन केले — त्यामुळे C चूक. A, B, D तथ्यांशी जुळतात (तलवारपासून सुरुवात; अन्न-भेदभाव कारणे; हवाई दलाचा सहभाग).",evidence:"NCERT modern history; RIN Mutiny records"},
{section:5,subtopic:"दारणा-मुळा-भंडारदरा धरणे",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) दारणा धरण (b) मुळा धरण (c) भंडारदरा (विल्सन) धरण (d) गंगापूर धरण : (1) दारणा नदी — नाशिक (2) मुळा नदी — अहमदनगर (राहुरी) (3) प्रवरा नदी — अहमदनगर (4) गोदावरी नदी — नाशिक",q_english:"Match — (a) Darna dam (b) Mula dam (c) Bhandardara (Wilson) dam (d) Gangapur dam : (1) Darna river — Nashik (2) Mula river — Ahmednagar (Rahuri) (3) Pravara river — Ahmednagar (4) Godavari river — Nashik",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-4, b-2, c-3, d-1"],correct_index:0,explanation_marathi:"दारणा धरण दारणा नदीवर नाशिकमध्ये (a-1); मुळा धरण मुळा नदीवर राहुरी-अहमदनगरमध्ये (b-2); भंडारदरा प्रवरा नदीवर (c-3); गंगापूर गोदावरीवर नाशिकमध्ये (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये a-d अदलाबदल — चूक.",evidence:"Maharashtra WRD dam records"},
{section:5,subtopic:"कोल्हापूर जिल्ह्यातील धरणे",qtype:"तक्ता आधारित",q_marathi:"खालीलपैकी कोणती धरण-नदी जोडी चूक आहे? (राधानगरी–भोगावती; तिल्लारी–तिल्लारी; वारणा–वारणा; दूधगंगा–दूधगंगा)",q_english:"Which dam-river pair is INCORRECT? (Radhanagari–Bhogawati; Tillari–Tillari; Warna–Warna; Dudhganga–Dudhganga)",options:["राधानगरी – भोगावती","तिल्लारी – तिल्लारी","वारणा – कृष्णा","दूधगंगा – दूधगंगा"],correct_index:2,explanation_marathi:"वारणा धरण वारणा नदीवरच आहे, कृष्णेवर नव्हे — त्यामुळे C चूक. राधानगरी भोगावतीवर, तिल्लारी तिल्लारी नदीवर, दूधगंगा दूधगंगा नदीवर — A, B, D बरोबर जोड्या आहेत.",evidence:"Maharashtra WRD"},
{section:5,subtopic:"भाटघर-वीर धरणे",qtype:"Assertion-Reason",q_marathi:"विधान (A): भाटघर धरण येलवंडी नदीवर तर वीर धरण नीरा नदीवर असून दोन्ही पुणे जिल्ह्याच्या सीमाभागात आहेत. कारण (R): येलवंडी ही नीरा नदीची उपनदी आहे.",q_english:"Assertion (A): Bhatghar dam is on the Yelwandi and Veer dam on the Nira, both near Pune district borders. Reason (R): The Yelwandi is a tributary of the Nira.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"भाटघर (भोर) येलवंडीवर व वीर (शिरवळ) नीरावर — A बरोबर. येलवंडी ही नीरेची उपनदी असल्याने दोन्ही एकाच खोऱ्यात येतात — R बरोबर व A चे योग्य स्पष्टीकरण. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक.",evidence:"Maharashtra WRD"},
{section:5,subtopic:"मराठवाड्यातील धरणे",qtype:"नकाशा आधारित",q_marathi:"जोड्या लावा — (a) माजलगाव धरण (b) सिद्धेश्वर धरण (c) मानार धरण (d) विष्णुपुरी धरण : (1) सिंधफणा — बीड (2) पूर्णा — हिंगोली (3) मानार — नांदेड (4) गोदावरी — नांदेड",q_english:"Match — (a) Majalgaon (b) Siddheshwar (c) Manar (d) Vishnupuri : (1) Sindphana — Beed (2) Purna — Hingoli (3) Manar — Nanded (4) Godavari — Nanded",options:["a-1, b-2, c-3, d-4","a-1, b-3, c-2, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3"],correct_index:0,explanation_marathi:"माजलगाव सिंधफणेवर बीडमध्ये (a-1); सिद्धेश्वर पूर्णेवर हिंगोलीत (b-2); मानार मानार नदीवर नांदेडमध्ये (c-3); विष्णुपुरी गोदावरीवर नांदेडमध्ये (d-4). B मध्ये b-c, C मध्ये a-b, D मध्ये c-d अदलाबदल — चूक.",evidence:"Maharashtra WRD"},
{section:5,subtopic:"कोकणातील नद्या व खाड्या",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) कुंडलिका (b) सावित्री (c) शास्त्री (d) अंबा : (1) रेवदंडा खाडी — रायगड (2) बाणकोट खाडी — रायगड (3) जयगड खाडी — रत्नागिरी (4) धरमतर खाडी — रायगड",q_english:"Match — (a) Kundalika (b) Savitri (c) Shastri (d) Amba : (1) Revdanda creek — Raigad (2) Bankot creek — Raigad (3) Jaigad creek — Ratnagiri (4) Dharamtar creek — Raigad",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-1, b-3, c-2, d-4","a-4, b-2, c-3, d-1"],correct_index:0,explanation_marathi:"कुंडलिका रेवदंडा खाडीत (a-1); सावित्री बाणकोट खाडीत (b-2); शास्त्री जयगड खाडीत (c-3); अंबा धरमतर खाडीत (d-4). B मध्ये a-b व c-d, C मध्ये b-c, D मध्ये a-d अदलाबदल — चूक.",evidence:"Maharashtra coastal geography records"},
{section:5,subtopic:"भीमा नदीच्या उपनद्या",qtype:"बहु-विधान (I, II, III)",q_marathi:"भीमा खोऱ्याबद्दल — (I) घोड व कुकडी या भीमेच्या डाव्या काठच्या उपनद्या (प्रणाली) आहेत. (II) माण नदी ही भीमेची उजव्या काठची उपनदी असून सांगोला परिसरातून वाहते. (III) नीरा ही भीमेची सर्वात मोठी उपनदी आहे.",q_english:"On the Bhima basin — (I) Ghod and Kukadi are left-bank tributaries. (II) The Man is a right-bank tributary flowing past Sangola. (III) The Nira is the Bhima's largest tributary.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त I बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने बरोबर: डाव्या काठी घोड-कुकडी-इंद्रायणी-मुळा-मुठा-पवना; उजव्या काठी नीरा-माण; माण सांगोल्यातून; नीरा सर्वात मोठी उपनदी. त्यामुळे B, C, D अपूर्ण.",evidence:"Bhima basin studies (WRD/CWC)"},
{section:5,subtopic:"सिंधफणा vs दुधना",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) सिंधफणा व दुधना या दोन्ही गोदावरीच्या थेट उपनद्या असून मराठवाड्यात वाहतात. (II) सिंधफणा ही गोदावरीची तर दुधना ही पूर्णा नदीची उपनदी आहे.",q_english:"Consider — (I) Both Sindphana and Dudhna are direct tributaries of the Godavari in Marathwada. (II) The Sindphana joins the Godavari while the Dudhna joins the Purna.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:1,explanation_marathi:"दुधना ही थेट गोदावरीची नाही तर पूर्णेची (पूर्णा→गोदावरी) उपनदी आहे — त्यामुळे I चूक, II बरोबर. A चूक कारण I चूक; C, D चूक कारण II बरोबर आहे.",evidence:"Godavari basin drainage records"},
{section:5,subtopic:"महाराष्ट्रातील खाड्या",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) रेवदंडा खाडी (b) दाभोळ खाडी (c) वाघोटण (विजयदुर्ग) खाडी (d) कर्ली खाडी : (1) कुंडलिका — रायगड (2) वशिष्ठी — रत्नागिरी (3) वाघोटण नदी — सिंधुदुर्ग (4) कर्ली नदी — सिंधुदुर्ग",q_english:"Match — (a) Revdanda (b) Dabhol (c) Waghotan/Vijaydurg (d) Karli : (1) Kundalika — Raigad (2) Vashisti — Ratnagiri (3) Waghotan river — Sindhudurg (4) Karli river — Sindhudurg",options:["a-1, b-2, c-3, d-4","a-1, b-3, c-2, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3"],correct_index:0,explanation_marathi:"रेवदंडा-कुंडलिका (a-1); दाभोळ-वशिष्ठी (b-2); वाघोटण-वाघोटण नदी (c-3); कर्ली-कर्ली नदी (d-4). B मध्ये b-c, C मध्ये a-b, D मध्ये c-d अदलाबदल — चूक.",evidence:"Maharashtra coastal records"},
{section:5,subtopic:"मुंबईची सात बेटे",qtype:"बहु-विधान (I, II, III)",q_marathi:"मुंबईच्या इतिहासाबद्दल — (I) 1534 मध्ये गुजरातचा बहादूरशहा याच्याकडून पोर्तुगीजांना मुंबईची सात बेटे मिळाली. (II) 1661 मध्ये पोर्तुगालची राजकन्या कॅथरीन ब्रगांझाच्या हुंड्यात ही बेटे इंग्लंडला गेली. (III) 1668 मध्ये इंग्लंडने ही बेटे ईस्ट इंडिया कंपनीला वार्षिक £10 भाड्याने दिली.",q_english:"On Bombay's history — (I) The Portuguese got Bombay's seven islands from Bahadur Shah of Gujarat in 1534. (II) In 1661 they passed to England in Catherine of Braganza's dowry. (III) In 1668 England leased them to the East India Company for £10/year.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त III बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने ऐतिहासिक तथ्यांशी जुळतात: वसई तह 1534; कॅथरीन-चार्ल्स II विवाह हुंडा 1661; कंपनीला भाडेपट्टा 1668 (£10 वार्षिक). त्यामुळे B, C, D अपूर्ण.",evidence:"Bombay history records (1534/1661/1668)"},
{section:5,subtopic:"साल्हेर vs कळसूबाई",qtype:"Assertion-Reason",q_marathi:"विधान (A): कळसूबाई (1646 मी) हे महाराष्ट्रातील सर्वोच्च शिखर असून साल्हेर (1567 मी) दुसऱ्या क्रमांकावर आहे. कारण (R): ही दोन्ही शिखरे सह्याद्रीच्या मुख्य रांगेतील बेसाल्ट (दख्खन ट्रॅप) खडकांची शिखरे आहेत.",q_english:"Assertion (A): Kalsubai (1646 m) is Maharashtra's highest peak, Salher (1567 m) second. Reason (R): Both are basalt (Deccan Trap) peaks of the main Sahyadri range.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:1,explanation_marathi:"उंचीचा क्रम बरोबर — A बरोबर. दोन्ही बेसाल्ट शिखरे — R बरोबर. पण R हे उंचीच्या क्रमाचे स्पष्टीकरण नाही (उंची ही स्वतंत्र मोजमाप आहे), त्यामुळे B योग्य. A चूक कारण R स्पष्टीकरण नाही; C, D चूक.",evidence:"Survey of India peak data"},
{section:5,subtopic:"सह्याद्रीतील घाट",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) कुंभार्ली घाट (b) वरंधा घाट (c) आंबेनळी घाट (d) माळशेज घाट : (1) कराड–चिपळूण (2) भोर–महाड (3) महाबळेश्वर–पोलादपूर (4) कल्याण–अहमदनगर",q_english:"Match — (a) Kumbharli (b) Varandha (c) Ambenali (d) Malshej : (1) Karad–Chiplun (2) Bhor–Mahad (3) Mahabaleshwar–Poladpur (4) Kalyan–Ahmednagar",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"कुंभार्ली कराड-चिपळूण (a-1); वरंधा भोर-महाड (b-2); आंबेनळी महाबळेश्वर-पोलादपूर (c-3); माळशेज कल्याण-अहमदनगर (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"Sahyadri pass records (PWD/MSRDC)"},
{section:5,subtopic:"महाराष्ट्रातील अभयारण्ये",qtype:"तक्ता आधारित",q_marathi:"खालीलपैकी कोणती अभयारण्य-जिल्हा जोडी चूक आहे? (कोयना–सातारा; सागरेश्वर–सांगली; मयूरेश्वर–पुणे; कर्नाळा–रायगड)",q_english:"Which sanctuary-district pair is INCORRECT? (Koyna–Satara; Sagareshwar–Sangli; Mayureshwar–Pune; Karnala–Raigad)",options:["कोयना – सातारा","सागरेश्वर – सांगली","मयूरेश्वर – सातारा","कर्नाळा – रायगड"],correct_index:2,explanation_marathi:"मयूरेश्वर (सुपे) अभयारण्य पुणे जिल्ह्यातील बारामतीजवळ आहे, साताऱ्यात नव्हे — त्यामुळे C चूक. कोयना सातारा, सागरेश्वर सांगली, कर्नाळा रायगड — A, B, D बरोबर.",evidence:"Maharashtra Forest Department"},
{section:5,subtopic:"नान्नज माळढोक अभयारण्य",qtype:"कारण-परिणाम",q_marathi:"विधान (A): सोलापूरजवळील नान्नज येथील माळढोक अभयारण्य हे ग्रेट इंडियन बस्टर्ड या पक्ष्यासाठी प्रसिद्ध आहे. विधान (B): येथील विस्तीर्ण गवताळ प्रदेश व झुडपी जंगल हा या पक्ष्याच्या अधिवासासाठी पोषक आहे.",q_english:"Statement (A): The Nanaj Bustard Sanctuary near Solapur is famous for the Great Indian Bustard. Statement (B): Its vast grasslands and scrub suit this bird's habitat.",options:["दोन्ही बरोबर; B हे A चे कारण","दोन्ही बरोबर; B हे A चे कारण नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:0,explanation_marathi:"नान्नज हे बस्टर्डसाठीचे प्रसिद्ध अभयारण्य — A बरोबर. गवताळ-झुडपी अधिवास हेच त्यामागील कारण — B हे A चे योग्य कारण. B पर्याय चूक कारण B कारणच आहे; C, D चूक.",evidence:"Maharashtra Forest Dept; BNHS"},
{section:5,subtopic:"महाराष्ट्र GI टॅग उत्पादने",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) डहाणू-घोलवड चिकू (b) पुरंदर अंजीर (c) महाबळेश्वर स्ट्रॉबेरी (d) कोल्हापूर गूळ : (1) पालघर (2) पुणे (3) सातारा (4) कोल्हापूर",q_english:"Match — (a) Dahanu-Gholvad chikoo (b) Purandar fig (c) Mahabaleshwar strawberry (d) Kolhapur jaggery : (1) Palghar (2) Pune (3) Satara (4) Kolhapur",options:["a-1, b-2, c-3, d-4","a-1, b-3, c-2, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3"],correct_index:0,explanation_marathi:"डहाणू-घोलवड चिकू पालघर (a-1); पुरंदर अंजीर पुणे (b-2); महाबळेश्वर स्ट्रॉबेरी सातारा (c-3); कोल्हापूर गूळ कोल्हापूर (d-4). B मध्ये b-c, C मध्ये a-b, D मध्ये c-d अदलाबदल — चूक.",evidence:"GI Registry, India"},
{section:5,subtopic:"शक्तिपीठ महामार्ग",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) प्रस्तावित शक्तिपीठ महामार्ग (नागपूर–गोवा) हा समृद्धी महामार्गानंतरचा महाराष्ट्रातील दुसरा मोठा द्रुतगती मार्ग प्रकल्प आहे. (II) हा महामार्ग वर्धा, यवतमाळ, नांदेड, लातूर, धाराशिव, सोलापूर, सांगली, कोल्हापूर व सिंधुदुर्ग या जिल्ह्यांतून जाणार आहे.",q_english:"Consider — (I) The proposed Shaktipeeth Expressway (Nagpur–Goa) is Maharashtra's second major expressway after Samruddhi. (II) It will pass through Wardha, Yavatmal, Nanded, Latur, Dharashiv, Solapur, Sangli, Kolhapur and Sindhudurg.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"MSRDC च्या प्रस्तावानुसार 802 किमीचा नागपूर-गोवा शक्तिपीठ महामार्ग व वरील 9 जिल्ह्यांचा मार्ग — दोन्ही विधाने बरोबर. A, B अपूर्ण; D चूक.",evidence:"MSRDC Shaktipeeth Expressway proposal"},
{section:6,subtopic:"कलम 108 संयुक्त बैठक",qtype:"Assertion-Reason",q_marathi:"विधान (A): आतापर्यंत संसदेची संयुक्त बैठक फक्त तीन वेळा — 1961, 1978 व 2002 मध्ये — बोलावण्यात आली आहे. कारण (R): कलम 108 नुसार धनविधेयकावर मतभेद झाल्यास संयुक्त बैठक बोलावता येते.",q_english:"Assertion (A): Parliament's joint sitting has been summoned only thrice — 1961, 1978, 2002. Reason (R): Under Art 108 a joint sitting can be called on disagreement over a Money Bill.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:2,explanation_marathi:"तीन संयुक्त बैठका (हुंडा प्रतिबंध 1961, बँकिंग सेवा आयोग 1978, पोटा 2002) — A बरोबर. पण कलम 108 फक्त सामान्य विधेयकांसाठी; धनविधेयकावर संयुक्त बैठक होत नाही (कलम 109 नुसार लोकसभेचेच वर्चस्व) — R चूक. त्यामुळे A, B, D चूक.",evidence:"Constitution of India, Art 108-109"},
{section:6,subtopic:"कलम 111, 200, 201, 213",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) कलम 111 (b) कलम 200 (c) कलम 201 (d) कलम 213 : (1) संसदेच्या विधेयकावर राष्ट्रपतींची अनुमती (2) राज्य विधेयकावर राज्यपालांची अनुमती/राखीव ठेवणे (3) राखीव विधेयकावर राष्ट्रपतींचा निर्णय (4) राज्यपालांचा अध्यादेश",q_english:"Match — (a) Art 111 (b) Art 200 (c) Art 201 (d) Art 213 : (1) President's assent to Parliament Bills (2) Governor's assent/reservation of State Bills (3) President's decision on reserved Bills (4) Governor's ordinance",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"111-राष्ट्रपती अनुमती (a-1); 200-राज्यपाल अनुमती/राखीव (b-2); 201-राखीव विधेयकावर राष्ट्रपती (c-3); 213-राज्यपाल अध्यादेश (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"Constitution of India"},
{section:6,subtopic:"कलम 112-114 अर्थसंकल्प प्रक्रिया",qtype:"कालक्रम लावा",q_marathi:"अर्थसंकल्पीय प्रक्रियेचा योग्य क्रम लावा — (a) वार्षिक वित्तीय विवरण सादर करणे (112) (b) अनुदान मागण्यांवर चर्चा व मतदान (113) (c) विनियोजन विधेयक (114) (d) वित्त विधेयक (117)",q_english:"Arrange the budget process — (a) Presentation of Annual Financial Statement (112) (b) Discussion & voting on demands for grants (113) (c) Appropriation Bill (114) (d) Finance Bill (117)",options:["a-b-c-d","a-c-b-d","b-a-d-c","d-c-b-a"],correct_index:0,explanation_marathi:"योग्य क्रम: विवरण सादर (112) → अनुदान मागण्या चर्चा-मतदान (113) → विनियोजन विधेयक (114) → वित्त विधेयक (117). B मध्ये b-c, C मध्ये a-b, D उलटा क्रम — चूक.",evidence:"Constitution of India, Art 112-117"},
{section:6,subtopic:"कलम 123 vs 213 अध्यादेश",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) राष्ट्रपतींचा (123) व राज्यपालांचा (213) अध्यादेश जास्तीत जास्त 6 महिने + 6 आठवडे टिकतो. (II) राष्ट्रपतींच्या अध्यादेशासाठी केंद्रीय मंत्रिमंडळाची तर राज्यपालांच्या अध्यादेशासाठी राज्य मंत्रिमंडळाची शिफारस आवश्यक असते.",q_english:"Consider — (I) Ordinances under Art 123 (President) and Art 213 (Governor) last max 6 months + 6 weeks. (II) The President acts on Union Cabinet advice; the Governor on State Cabinet advice.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"अध्यादेशाचा कमाल कालावधी 6 महिने + 6 आठवडे (पुनःसभा) — I बरोबर. दोन्ही नामधारी प्रमुख मंत्रिमंडळाच्या सल्ल्यानेच वागतात (डी. सी. वाधवा खटला) — II बरोबर. A, B अपूर्ण; D चूक.",evidence:"Constitution Art 123, 213; D.C. Wadhwa vs State of Bihar"},
{section:6,subtopic:"कलम 249 vs 250",qtype:"Assertion-Reason",q_marathi:"विधान (A): कलम 249 नुसार राज्यसभेने 2/3 बहुमताने ठराव केल्यास संसद राज्यसूचीतील विषयावर कायदा करू शकते. कारण (R): कलम 250 नुसार राष्ट्रीय आणीबाणीच्या काळात संसदेला राज्यसूचीतील सर्व विषयांवर कायदा करण्याचा अधिकार आपोआप मिळतो.",q_english:"Assertion (A): Under Art 249, Parliament can legislate on State List subjects if Rajya Sabha resolves by 2/3 majority. Reason (R): Under Art 250, during National Emergency Parliament automatically gets power over all State subjects.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:1,explanation_marathi:"249 (राज्यसभेचा ठराव, 1 वर्ष) व 250 (आणीबाणी) — दोन्ही बरोबर. पण R हे A चे स्पष्टीकरण नाही; ही दोन स्वतंत्र घटनात्मक तरतुदी आहेत. त्यामुळे A चूक; C, D चूक.",evidence:"Constitution of India, Art 249-250"},
{section:6,subtopic:"कलम 262 आंतरराज्य पाणी वाद",qtype:"बहु-विधान (I, II, III)",q_marathi:"कलम 262 बद्दल — (I) या कलमानुसार संसद आंतरराज्य नदीपाणी वादांच्या निवाड्यासाठी कायदा करू शकते. (II) या अधिकारांतर्गत 1956 चा आंतरराज्य नदीपाणी वाद कायदा करण्यात आला. (III) या कायद्यांतर्गत स्थापन झालेल्या न्यायाधिकरणाच्या निवाड्याविरुद्ध सर्वोच्च न्यायालयात नियमित अपील करता येते.",q_english:"On Art 262 — (I) Parliament may legislate for adjudication of inter-state river water disputes. (II) The Inter-State River Water Disputes Act, 1956 was made under it. (III) Regular appeal lies to the Supreme Court against tribunal awards.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त III बरोबर"],correct_index:1,explanation_marathi:"262 नुसार संसदेला अधिकार — I बरोबर. 1956 चा कायदा त्याअंतर्गत — II बरोबर. पण न्यायाधिकरणाचा निवाडा अंतिम असतो; नियमित अपीलाची तरतूद नाही — III चूक. त्यामुळे A, C, D चूक.",evidence:"Constitution Art 262; ISWD Act, 1956"},
{section:6,subtopic:"कलम 266 vs 267 निधी",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) संचित निधी (266) (b) आकस्मिक निधी (267) (c) कलम 266(3) (d) राज्य आकस्मिक निधी : (1) सर्व शासकीय जमा; खर्चासाठी संसदेची मंजुरी आवश्यक (2) राष्ट्रपतींच्या हाती; अनपेक्षित खर्चासाठी आगाऊ रक्कम (3) विनियोजन कायद्याशिवाय संचित निधीतून खर्च नाही (4) राज्यपालांच्या हाती",q_english:"Match — (a) Consolidated Fund (266) (b) Contingency Fund (267) (c) Art 266(3) (d) State Contingency Fund : (1) All govt receipts; Parliament sanction needed (2) At President's disposal; advance for unforeseen spending (3) No spending without Appropriation Act (4) At Governor's disposal",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"संचित निधी-सर्व जमा (a-1); आकस्मिक निधी-राष्ट्रपती (b-2); 266(3)-विनियोजन कायद्याची अट (c-3); राज्य आकस्मिक निधी-राज्यपाल (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"Constitution of India, Art 266-267"},
{section:6,subtopic:"कलम 270-275 कर वाटप",qtype:"तक्ता आधारित",q_marathi:"केंद्र-राज्य वित्तीय संबंधांबद्दल (270-275) खालीलपैकी कोणते विधान चूक आहे?",q_english:"Which statement on Centre-State finance (Art 270-275) is INCORRECT?",options:["कलम 270 नुसार निव्वळ कर उत्पन्न केंद्र व राज्यांत वाटले जाते","कलम 271 नुसार अधिभाराचे (surcharge) उत्पन्न पूर्णपणे केंद्राकडे राहते","कलम 275 नुसार सहाय्य अनुदानासाठी वित्त आयोगाची शिफारस आवश्यक असते","कलम 274 नुसार राज्यांच्या हिताच्या कर विधेयकांना राष्ट्रपतींची पूर्वपरवानगी आवश्यक नसते"],correct_index:3,explanation_marathi:"कलम 274 नुसार राज्यांच्या हितसंबंधी कर विधेयकांना राष्ट्रपतींची पूर्वपरवानगी आवश्यक असतेच — त्यामुळे D चूक. A, B, C तिन्ही बरोबर विधाने आहेत.",evidence:"Constitution of India, Art 270-275"},
{section:6,subtopic:"कलम 301 व्यापार स्वातंत्र्य",qtype:"कारण-परिणाम",q_marathi:"विधान (A): कलम 301 भारताच्या संपूर्ण प्रदेशात व्यापार, वाणिज्य व व्यवहार यांच्या स्वातंत्र्याची हमी देते. विधान (B): कलम 302-307 नुसार सार्वजनिक हितासाठी या स्वातंत्र्यावर संसद व राज्य विधिमंडळे वाजवी निर्बंध घालू शकतात.",q_english:"Statement (A): Art 301 guarantees freedom of trade, commerce and intercourse throughout India. Statement (B): Under Art 302-307, Parliament and State legislatures may impose reasonable restrictions in public interest.",options:["दोन्ही बरोबर; B हे A वरील मर्यादा स्पष्ट करते","दोन्ही बरोबर; B चा A शी संबंध नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:0,explanation_marathi:"301 मधील स्वातंत्र्य — A बरोबर. 302 (संसद), 303-304 (भेदभावबंदी/वाजवी निर्बंध) मधील मर्यादा — B बरोबर व A वरील घटनात्मक मर्यादा स्पष्ट करते. B पर्याय चूक कारण संबंध आहे; C, D चूक.",evidence:"Constitution of India, Art 301-307"},
{section:6,subtopic:"कलम 310-311 सेवा संरक्षण",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) कलम 310 नुसार केंद्रीय व राज्य सेवा राष्ट्रपती/राज्यपालांच्या 'आनंदापर्यंत' (during pleasure) धारण केल्या जातात. (II) कलम 311 नुसार बडतर्फी, पदावनती किंवा पदच्युतीपूर्वी संबंधिताला चौकशीची वाजवी संधी देणे बंधनकारक आहे.",q_english:"Consider — (I) Under Art 310, Union/State services are held during the pleasure of the President/Governor. (II) Under Art 311, reasonable opportunity of inquiry is mandatory before dismissal/removal/reduction.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"310 मधील 'pleasure doctrine' — I बरोबर. 311 मधील संरक्षण (चौकशीची संधी; 42वी दुरुस्तीने टप्पे कमी) — II बरोबर. A, B अपूर्ण; D चूक.",evidence:"Constitution of India, Art 310-311"},
{section:6,subtopic:"कलम 326 प्रौढ मताधिकार",qtype:"बहु-विधान (I, II, III)",q_marathi:"कलम 326 बद्दल — (I) लोकसभा व राज्य विधानसभा निवडणुकांत प्रौढ मताधिकाराची तरतूद आहे. (II) 61वी घटनादुरुस्ती (1989) ने मतदानाचे वय 21 वरून 18 वर्षे केले. (III) कलम 326 मधील 'प्रौढ' म्हणजे 18 वर्षे पूर्ण केलेली व्यक्ती.",q_english:"On Art 326 — (I) Provides adult suffrage for Lok Sabha/Assembly elections. (II) The 61st Amendment (1989) cut voting age from 21 to 18. (III) 'Adult' here means one who completed 18 years.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त I बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने बरोबर: 326 मध्ये प्रौढ मताधिकार; 61वी दुरुस्ती 1989 (28 मार्च 1989 रोजी लागू); प्रौढ = 18 वर्षे पूर्ण. B, C, D अपूर्ण.",evidence:"Constitution of India; 61st Amendment Act, 1988"},
{section:6,subtopic:"कलम 330-334 राखीव जागा",qtype:"कालक्रम लावा",q_marathi:"SC/ST राखीव जागांच्या मुदतवाढीचा योग्य क्रम लावा — (a) मूळ तरतूद: 10 वर्षे (1950-60) (b) 8वी दुरुस्ती 1960: 1970 पर्यंत (c) 95वी दुरुस्ती 2010: 2020 पर्यंत (d) 104वी दुरुस्ती 2020: 2030 पर्यंत",q_english:"Arrange extensions of SC/ST seat reservation — (a) Original: 10 years (1950-60) (b) 8th Amendment 1960: till 1970 (c) 95th Amendment 2010: till 2020 (d) 104th Amendment 2020: till 2030",options:["a-b-c-d","a-c-b-d","b-a-d-c","d-c-b-a"],correct_index:0,explanation_marathi:"योग्य क्रम a-b-c-d. (लक्षात ठेवा: 104वी दुरुस्तीने फक्त SC/ST मुदत 2030 पर्यंत वाढवली; अँग्लो-इंडियन नामनिर्देशन रद्द केले.) B मध्ये b-c, C मध्ये सुरुवात, D उलटा क्रम — चूक.",evidence:"Constitution Art 334; Amendments 8th/95th/104th"},
{section:6,subtopic:"कलम 338B OBC आयोग",qtype:"Assertion-Reason",q_marathi:"विधान (A): 102वी घटनादुरुस्ती (2018) ने कलम 338B अंतर्गत राष्ट्रीय मागासवर्ग आयोगाला (NCBC) घटनात्मक दर्जा दिला. कारण (R): या दुरुस्तीपूर्वी हा आयोग 1993 च्या संसदीय कायद्यांतर्गत केवळ वैधानिक संस्था होता.",q_english:"Assertion (A): The 102nd Amendment (2018) gave constitutional status to the NCBC under Art 338B. Reason (R): Before it, the Commission was only a statutory body under the 1993 Act.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"102वी दुरुस्ती 2018 ने 338B समाविष्ट करून NCBC ला घटनात्मक दर्जा — A बरोबर. 1993 च्या कायद्यांतर्गत तो वैधानिक होता — R बरोबर व A ची पार्श्वभूमी स्पष्ट करते. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक.",evidence:"102nd Constitutional Amendment Act, 2018"},
{section:6,subtopic:"सातवी अनुसूची सूची",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) केंद्र सूची (b) राज्य सूची (c) समवर्ती सूची (d) उर्वरित अधिकार : (1) संरक्षण, अणुऊर्जा, रेल्वे (2) पोलीस, सार्वजनिक आरोग्य, कृषी (3) शिक्षण, वन, दिवाणी प्रक्रिया (4) कलम 248 नुसार केंद्राकडे",q_english:"Match — (a) Union List (b) State List (c) Concurrent List (d) Residuary powers : (1) Defence, atomic energy, railways (2) Police, public health, agriculture (3) Education, forests, civil procedure (4) With Centre under Art 248",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"केंद्र सूची-संरक्षण/अणुऊर्जा (a-1); राज्य सूची-पोलीस/आरोग्य/कृषी (b-2); समवर्ती-शिक्षण/वन (c-3); उर्वरित-248 नुसार केंद्र (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"Constitution of India, Seventh Schedule"},
{section:6,subtopic:"कलम 155-156 राज्यपाल",qtype:"बहु-विधान (I, II, III)",q_marathi:"राज्यपालांबद्दल — (I) कलम 155 नुसार राज्यपालांची नियुक्ती राष्ट्रपती करतात. (II) कलम 156 नुसार राज्यपाल 5 वर्षे पदावर राहतात, पण राष्ट्रपतींच्या आनंदापर्यंतच. (III) एकाच व्यक्तीची एकाच वेळी दोन राज्यांच्या राज्यपालपदी नियुक्ती करता येत नाही.",q_english:"On Governors — (I) Under Art 155 the President appoints Governors. (II) Under Art 156 they hold office for 5 years during the President's pleasure. (III) One person cannot be Governor of two states simultaneously.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त III बरोबर"],correct_index:1,explanation_marathi:"155-राष्ट्रपती नियुक्ती — I बरोबर. 156-5 वर्षे/आनंदापर्यंत — II बरोबर. पण 7वी दुरुस्ती (1956) पासून एक व्यक्ती दोन/अधिक राज्यांची राज्यपाल होऊ शकते — III चूक. त्यामुळे A, C, D चूक.",evidence:"Constitution of India, Art 155-156; 7th Amendment 1956"},
{section:7,subtopic:"UPS vs NPS vs APY",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) UPS (b) NPS (c) APY (d) PFRDA : (1) 2024; 25 वर्षे सेवेनंतर मूळ वेतनाच्या 50% हमी पेन्शन (2) 2004; अंशदान-आधारित (सरकारी कर्मचाऱ्यांसाठी बंधनकारक) (3) 2015; असंघटित क्षेत्रासाठी ₹1,000-5,000 हमी पेन्शन (4) पेन्शन नियामक (2003 स्थापना; 2014 कायदा)",q_english:"Match — (a) UPS (b) NPS (c) APY (d) PFRDA : (1) 2024; 50% of basic pay as assured pension after 25 yrs service (2) 2004; contribution-based (mandatory for govt staff) (3) 2015; Rs 1,000-5,000 assured pension for unorganised sector (4) Pension regulator (est. 2003; 2014 Act)",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"UPS-2024 हमी पेन्शन (a-1); NPS-2004 अंशदान आधारित (b-2); APY-2015 असंघटित क्षेत्र (c-3); PFRDA-नियामक (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"PFRDA; Cabinet decision Aug 2024 (UPS)"},
{section:7,subtopic:"PM SVANidhi योजना",qtype:"Assertion-Reason",q_marathi:"विधान (A): PM SVANidhi योजनेंतर्गत पथविक्रेत्यांना ₹10,000 पर्यंतचे खेळते भांडवल कर्ज 7% व्याज अनुदानासह दिले जाते. कारण (R): ही योजना केंद्रीय गृहनिर्माण व शहरी कार्य मंत्रालयामार्फत राबवली जाते.",q_english:"Assertion (A): Under PM SVANidhi, street vendors get working-capital loans up to Rs 10,000 with 7% interest subsidy. Reason (R): It is implemented by the Ministry of Housing and Urban Affairs.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:1,explanation_marathi:"₹10,000 कर्ज व 7% अनुदान — A बरोबर. नोडल मंत्रालय MoHUA — R बरोबर. पण R हे A मधील कर्ज-रचनेचे स्पष्टीकरण नाही, तर अंमलबजावणीची माहिती आहे — त्यामुळे B योग्य. A चूक कारण R स्पष्टीकरण नाही; C, D चूक.",evidence:"MoHUA; PM SVANidhi guidelines 2020"},
{section:7,subtopic:"प्राधान्य क्षेत्र कर्ज (PSL)",qtype:"बहु-विधान (I, II, III)",q_marathi:"PSL बद्दल — (I) प्राधान्य क्षेत्र कर्जाचे लक्ष्य निव्वळ बँक पतच्या (ANBC) 40% आहे. (II) यात शेतीसाठी 18% व सूक्ष्म उद्योगांसाठी 7.5% उपलक्ष्य आहे. (III) 20 पेक्षा अधिक शाखा असलेल्या परकीय बँकांनाही हेच 40% लक्ष्य लागू आहे.",q_english:"On Priority Sector Lending — (I) Target is 40% of ANBC. (II) Sub-targets: 18% agriculture, 7.5% micro enterprises. (III) Foreign banks with 20+ branches also face the 40% target.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त I बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने RBI च्या PSL मार्गदर्शक तत्त्वांशी जुळतात: 40% एकूण; 18% शेती व 7.5% सूक्ष्म उपलक्ष्य; 20+ शाखांच्या परकीय बँकांना 40% (कमी शाखांना 40% पण निर्यात समावेशासह). त्यामुळे B, C, D अपूर्ण.",evidence:"RBI Master Directions on PSL"},
{section:7,subtopic:"TReDS प्रणाली",qtype:"कारण-परिणाम",q_marathi:"विधान (A): TReDS (Trade Receivables Discounting System) मुळे MSME ना त्यांच्या विक्रीवरील थकबाकी (receivables) लवकर वटवून खेळते भांडवल मिळते. विधान (B): या प्रणालीत RXIL, M1xchange व Invoice Mart (A.TReDS) हे RBI-अधिकृत तीन प्लॅटफॉर्म कार्यरत आहेत.",q_english:"Statement (A): TReDS lets MSMEs discount receivables for quick working capital. Statement (B): RXIL, M1xchange and Invoice Mart are the three RBI-authorised platforms.",options:["दोन्ही बरोबर; B हे A चे स्पष्टीकरण","दोन्ही बरोबर; B हे A चे स्पष्टीकरण नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:0,explanation_marathi:"TReDS मुळे थकबाकीचे सवलतीत रोखीकरण — A बरोबर. तीन अधिकृत प्लॅटफॉर्म — B बरोबर आणि A मधील यंत्रणा कशी राबते हे स्पष्ट करते. B पर्याय चूक कारण B स्पष्टीकरणच आहे; C, D चूक.",evidence:"RBI (TReDS guidelines)"},
{section:7,subtopic:"GeM पोर्टल",qtype:"Assertion-Reason",q_marathi:"विधान (A): Government e-Marketplace (GeM) हे सार्वजनिक खरेदीसाठीचे राष्ट्रीय पोर्टल असून 2016 मध्ये सुरू झाले. कारण (R): या पोर्टलमार्फत MSE कडून किमान 25% खरेदीचे धोरणात्मक लक्ष्य साध्य केले जाते.",q_english:"Assertion (A): GeM, the national public-procurement portal, launched in 2016. Reason (R): It helps achieve the 25% procurement target from MSEs.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"GeM 2016 मध्ये सुरू — A बरोबर. सार्वजनिक खरेदी धोरणानुसार (2012) MSE कडून 25% खरेदीचे लक्ष्य GeM मार्फत साध्य होते — R बरोबर व A च्या उद्दिष्टाचे स्पष्टीकरण. B चूक कारण R स्पष्टीकरण आहे; C, D चूक.",evidence:"GeM portal; Public Procurement Policy for MSEs 2012"},
{section:7,subtopic:"अँजल कर रद्द 2024",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) 2024 च्या अर्थसंकल्पात प्राप्तिकर कायद्याच्या कलम 56(2)(viib) मधील अँजल कर सर्व गुंतवणूकदारांसाठी (निवासी+अनिवासी) रद्द करण्यात आला. (II) अँजल कर हा स्टार्टअप्सना समभागांवर अधिमूल्याने (premium) मिळालेल्या गुंतवणुकीवर लागणारा कर होता.",q_english:"Consider — (I) Budget 2024 abolished angel tax (Sec 56(2)(viib)) for all investors. (II) Angel tax was levied on share-premium investment received by startups.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"2024 च्या अर्थसंकल्पात अँजल कर पूर्ण रद्द — I बरोबर. हा कर अधिमूल्यावरील गुंतवणुकीवर लागत होता — II बरोबर. A, B अपूर्ण; D चूक.",evidence:"Union Budget 2024-25"},
{section:7,subtopic:"नवीन प्राप्तिकर कायदा 2025",qtype:"बहु-विधान (I, II, III)",q_marathi:"नवीन प्राप्तिकर कायद्याबद्दल (2025) — (I) 1961 च्या कायद्याची जागा घेणारा नवीन कायदा 2025 मध्ये मंजूर झाला. (II) यात 'मागील वर्ष/आकलन वर्ष' ऐवजी 'कर वर्ष' (tax year) ही संकल्पना आणली आहे. (III) नवीन कायदा 1 एप्रिल 2026 पासून लागू होणार आहे.",q_english:"On the new Income-Tax Act (2025) — (I) It replaces the 1961 Act and was passed in 2025. (II) It introduces 'tax year' replacing 'previous/assessment year'. (III) It applies from 1 April 2026.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त I बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने जाहीर तरतुदींशी जुळतात: नवीन कायदा 2025 मध्ये मंजूर; 'tax year' संकल्पना; 1 एप्रिल 2026 पासून अंमल. त्यामुळे B, C, D अपूर्ण.",evidence:"CBDT; Income-tax Act, 2025"},
{section:7,subtopic:"GSTAT",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) GSTAT (b) राष्ट्रीय खंडपीठ (c) राज्य खंडपीठे (d) अध्यक्ष पात्रता : (1) GST अपील न्यायाधिकरण; 2023 च्या कायद्याने स्थापना (2) नवी दिल्ली (3) राज्यांनुसार (महाराष्ट्र: मुंबई) (4) सर्वोच्च न्यायालयाचे न्यायाधीश किंवा उच्च न्यायालयाचे मुख्य न्यायाधीश",q_english:"Match — (a) GSTAT (b) National bench (c) State benches (d) President eligibility : (1) GST Appellate Tribunal; set up by 2023 law (2) New Delhi (3) State-wise (Maharashtra: Mumbai) (4) SC judge or HC Chief Justice",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"GSTAT-2023 कायदा (a-1); राष्ट्रीय खंडपीठ नवी दिल्ली (b-2); राज्य खंडपीठे (c-3); अध्यक्ष पात्रता SC न्यायाधीश/HC मुख्य न्यायाधीश (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"CGST (Amendment) Act, 2023"},
{section:7,subtopic:"सॉव्हरिन ग्रीन बॉण्ड",qtype:"तक्ता आधारित",q_marathi:"सॉव्हरिन ग्रीन बॉण्डबद्दल खालीलपैकी कोणते विधान चूक आहे? (पहिले जारी: जानेवारी 2023; निधी वापर: हरित पायाभूत सुविधा)",q_english:"Which statement on Sovereign Green Bonds is INCORRECT? (First issuance: Jan 2023; use: green infrastructure)",options:["पहिले सॉव्हरिन ग्रीन बॉण्ड जानेवारी 2023 मध्ये जारी झाले","यातून मिळणारा निधी हरित पायाभूत सुविधांसाठी वापरला जातो","हे बॉण्ड फक्त परदेशी गुंतवणूकदारांसाठी खुले आहेत","2024-25 मध्येही ग्रीन बॉण्ड जारी करण्यात आले"],correct_index:2,explanation_marathi:"ग्रीन बॉण्ड देशांतर्गत लिलावाद्वारे जारी होतात; परदेशींपुरते मर्यादित नाहीत — त्यामुळे C चूक. A, B, D बरोबर विधाने आहेत.",evidence:"RBI / Ministry of Finance (SGrB framework)"},
{section:7,subtopic:"NABFID 2021",qtype:"Assertion-Reason",q_marathi:"विधान (A): 2021 मध्ये स्थापन झालेली NABFID ही पायाभूत सुविधा वित्तपुरवठ्यासाठीची विकास वित्तीय संस्था (DFI) आहे. कारण (R): तिला ₹20,000 कोटी अधिकृत भांडवलासह 2021 च्या संसदीय कायद्याने वैधानिक दर्जा देण्यात आला.",q_english:"Assertion (A): NABFID, set up in 2021, is a DFI for infrastructure financing. Reason (R): It got statutory status via a 2021 Parliamentary Act with Rs 20,000 cr authorised capital.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"NABFID ही पायाभूत सुविधा DFI — A बरोबर. 2021 चा कायदा व ₹20,000 कोटी भांडवल — R बरोबर व A चे योग्य स्पष्टीकरण. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक.",evidence:"NABFID Act, 2021"},
{section:7,subtopic:"अकाउंट अ‍ॅग्रीगेटर vs CKYC",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) अकाउंट अ‍ॅग्रीगेटर (AA) ही RBI-नियमित NBFC असून ग्राहकाच्या स्पष्ट संमतीने त्याची वित्तीय माहिती वित्तीय संस्थांमध्ये शेअर करते. (II) CKYC (केंद्रीय KYC नोंदणी) ही CERSAI मार्फत चालवली जाणारी केंद्रीकृत KYC साठवणूक व्यवस्था आहे.",q_english:"Consider — (I) An Account Aggregator is an RBI-regulated NBFC sharing financial data with customer consent. (II) CKYC is a centralised KYC registry operated via CERSAI.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"AA ही RBI ची NBFC-AA परवान्यातील व्यवस्था (सहमती-आधारित) — I बरोबर. CKYC ही CERSAI कडील केंद्रीकृत नोंदणी — II बरोबर. या दोन भिन्न पण पूरक व्यवस्था आहेत. A, B अपूर्ण; D चूक.",evidence:"RBI (AA framework); CERSAI (CKYCR)"},
{section:7,subtopic:"जल जीवन मिशन",qtype:"बहु-विधान (I, II, III)",q_marathi:"जल जीवन मिशनबद्दल — (I) 2019 मध्ये सुरू झालेल्या या अभियानाचे उद्दिष्ट प्रत्येक ग्रामीण कुटुंबाला नळजोडणी हे होते. (II) प्रति व्यक्ती प्रति दिन 55 लिटर पाणी हे सेवा निकष आहे. (III) या अभियानाची नोडल संस्था जलशक्ती मंत्रालय आहे.",q_english:"On Jal Jeevan Mission — (I) Launched 2019 to give tap connections to every rural household. (II) Service norm is 55 litres per capita per day. (III) Nodal agency is the Ministry of Jal Shakti.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त I बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने बरोबर: 2019 सुरुवात ('हर घर जल'); 55 lpcd निकष; नोडल जलशक्ती मंत्रालय (पेयजल व स्वच्छता विभाग). B, C, D अपूर्ण.",evidence:"Ministry of Jal Shakti (JJM guidelines)"},
{section:7,subtopic:"SVAMITVA योजना",qtype:"कारण-परिणाम",q_marathi:"विधान (A): SVAMITVA योजनेंतर्गत ड्रोन सर्वेक्षणाद्वारे ग्रामीण घरांच्या मालमत्ता पत्रिका (property cards) दिल्या जातात. विधान (B): यामुळे ग्रामीण मालमत्तांचे आर्थिक मूल्यांकन होऊन त्यावर कर्ज उपलब्धता वाढते.",q_english:"Statement (A): Under SVAMITVA, drone surveys issue property cards for rural houses. Statement (B): This enables valuation of rural property and better credit access.",options:["दोन्ही बरोबर; B हे A चा परिणाम","दोन्ही बरोबर; B हे A चा परिणाम नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:0,explanation_marathi:"ड्रोन सर्वेक्षण व मालमत्ता पत्रिका — A बरोबर. परिणामी मालमत्ता तारण ठेवून कर्ज — B हा A चाच परिणाम. B पर्याय चूक कारण B परिणामच आहे; C, D चूक.",evidence:"Ministry of Panchayati Raj (SVAMITVA)"},
{section:7,subtopic:"PM-KUSUM घटक",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) घटक-A (b) घटक-B (c) घटक-C (d) नोडल मंत्रालय : (1) 10,000 MW विकेंद्रित सौर (2 MW पर्यंत प्रकल्प) (2) 20 लाख स्वतंत्र सौर कृषी पंप (3) 15 लाख ग्रीड-जोडणी पंपांचे सौरऊर्जाकरण (4) नवीन व नवीकरणीय ऊर्जा मंत्रालय (MNRE)",q_english:"Match — (a) Component-A (b) Component-B (c) Component-C (d) Nodal ministry : (1) 10,000 MW decentralised solar (up to 2 MW plants) (2) 20 lakh standalone solar pumps (3) Solarisation of 15 lakh grid-connected pumps (4) MNRE",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"घटक-A 10,000 MW (a-1); घटक-B 20 लाख पंप (b-2); घटक-C 15 लाख सौरऊर्जाकरण (c-3); नोडल MNRE (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"MNRE (PM-KUSUM guidelines)"},
{section:7,subtopic:"केन-बेतवा जोड प्रकल्प",qtype:"Assertion-Reason",q_marathi:"विधान (A): केन-बेतवा जोड प्रकल्प हा राष्ट्रीय दृष्टीक्षेपातील (ILR) पहिला नदीजोड प्रकल्प असून 2021 मध्ये त्याला मंजुरी मिळाली. कारण (R): या प्रकल्पांतर्गत मध्य प्रदेशात दौधन धरण बांधले जाणार असून बुंदेलखंडला पाणी मिळणार आहे.",q_english:"Assertion (A): The Ken-Betwa link, first ILR project, was approved in 2021. Reason (R): It includes the Daudhan dam in MP, benefiting Bundelkhand.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"पहिला ILR प्रकल्प, डिसेंबर 2021 मध्ये मंजूर — A बरोबर. दौधन धरण व बुंदेलखंड लाभ (UP-MP) — R बरोबर व A मधील प्रकल्पाचे स्वरूप स्पष्ट करते. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक.",evidence:"NWDA; Cabinet approval Dec 2021"},
{section:8,subtopic:"सरल लोलक SHM",qtype:"बहु-विधान (I, II, III)",q_marathi:"सरल लोलकाबद्दल — (I) आवर्तकाल T = 2π√(l/g) असून तो लोलकाच्या वस्तुमानावर अवलंबून नसतो. (II) दोरीची लांबी 4 पट केल्यास आवर्तकाल दुप्पट होतो. (III) हाच लोलक चंद्रावर नेल्यास (g कमी) आवर्तकाल वाढतो.",q_english:"On a simple pendulum — (I) T = 2π√(l/g), independent of bob mass. (II) Quadrupling length doubles the period. (III) On the Moon (lower g) the period increases.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त I बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने सूत्राशी सुसंगत: वस्तुमानाचा संबंध नाही (I); √l मुळे 4 पट लांबी = 2 पट काल (II); g कमी झाल्यास √(1/g) वाढतो (III). B, C, D अपूर्ण.",evidence:"NCERT Physics Class 11 (Oscillations)"},
{section:8,subtopic:"प्रकाशवैद्युत परिणाम",qtype:"Assertion-Reason",q_marathi:"विधान (A): आइन्स्टाइनने 1905 मध्ये प्रकाशवैद्युत परिणामाचे स्पष्टीकरण प्रकाशाच्या क्वांटम (फोटॉन) सिद्धांताने दिले. कारण (R): या कार्यासाठी त्यांना 1921 चे भौतिकशास्त्रातील नोबेल पारितोषिक मिळाले.",q_english:"Assertion (A): In 1905 Einstein explained the photoelectric effect via light quanta (photons). Reason (R): For this work he received the 1921 Nobel Prize in Physics.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"1905 चा 'चमत्कारिक वर्ष' पेपर — A बरोबर. 1921 चे नोबेल याच कार्यासाठी — R बरोबर व A च्या महत्त्वाचे स्पष्टीकरण. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक.",evidence:"Nobel Prize (Physics 1921); NCERT"},
{section:8,subtopic:"मोल संकल्पना",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) 1 मोल पाणी (b) अ‍ॅव्होगाड्रो संख्या (c) STP ला 1 मोल वायू (d) 1 मोल NaCl : (1) 18 ग्रॅम (2) 6.022 × 10²³ (3) 22.4 लिटर (4) 58.5 ग्रॅम",q_english:"Match — (a) 1 mole water (b) Avogadro number (c) 1 mole gas at STP (d) 1 mole NaCl : (1) 18 g (2) 6.022 × 10²³ (3) 22.4 L (4) 58.5 g",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"पाणी 18 ग्रॅम (a-1); अ‍ॅव्होगाड्रो 6.022×10²³ (b-2); STP ला 22.4 लिटर (c-3); NaCl 58.5 ग्रॅम (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"NCERT Chemistry Class 11"},
{section:8,subtopic:"मोलरता vs मोललता",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) मोलरता (M) तापमानानुसार बदलते, कारण ती द्रावणाच्या आकारमानावर (volume) अवलंबून असते. (II) मोललता (m) तापमानानुसार बदलत नाही, कारण ती द्रावकाच्या वस्तुमानावर (mass) अवलंबून असते.",q_english:"Consider — (I) Molarity (M) varies with temperature as it depends on solution volume. (II) Molality (m) is temperature-independent as it depends on solvent mass.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"आकारमान तापमानाने बदलते म्हणून मोलरता बदलते — I बरोबर. वस्तुमान स्थिर राहते म्हणून मोललता स्थिर — II बरोबर. A, B अपूर्ण; D चूक.",evidence:"NCERT Chemistry Class 11 (Solutions)"},
{section:8,subtopic:"टिंडल परिणाम",qtype:"कारण-परिणाम",q_marathi:"विधान (A): कलिल (colloid) द्रावणातून प्रकाशझोत टाकल्यास त्याचा मार्ग दिसतो — याला टिंडल परिणाम म्हणतात. विधान (B): कलिल कण प्रकाशाचे प्रकीर्णन (scattering) करतात, तर खऱ्या द्रावणाचे कण खूप लहान असल्याने प्रकीर्णन होत नाही.",q_english:"Statement (A): A light beam's path is visible in a colloid — the Tyndall effect. Statement (B): Colloidal particles scatter light; true-solution particles are too small to scatter.",options:["दोन्ही बरोबर; B हे A चे कारण","दोन्ही बरोबर; B हे A चे कारण नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:0,explanation_marathi:"टिंडल परिणामाची व्याख्या — A बरोबर. प्रकीर्णन हेच त्यामागील कारण — B हे A चे योग्य कारण. B पर्याय चूक कारण B कारणच आहे; C, D चूक.",evidence:"NCERT Chemistry Class 9"},
{section:8,subtopic:"साबण vs अपमार्जक",qtype:"Assertion-Reason",q_marathi:"विधान (A): कठीण पाण्यात साबणापेक्षा अपमार्जक (detergent) अधिक प्रभावी असते. कारण (R): साबण पाण्यातील Ca²⁺/Mg²⁺ आयनांशी अभिक्रिया करून न विरघळणारा मल (scum) तयार करते, तर अपमार्जकाची सल्फोनेट क्षारे पाण्यात विरघळतात.",q_english:"Assertion (A): Detergents work better than soap in hard water. Reason (R): Soap forms insoluble scum with Ca²⁺/Mg²⁺, while detergent sulphonates stay soluble.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"कठीण पाण्यात अपमार्जक श्रेष्ठ — A बरोबर. साबणाचा मल vs सल्फोनेटची विद्राव्यता — R बरोबर व A चे योग्य रासायनिक स्पष्टीकरण. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक.",evidence:"NCERT Chemistry Class 10"},
{section:8,subtopic:"NPK खते व युरिया",qtype:"बहु-विधान (I, II, III)",q_marathi:"खतांबद्दल — (I) NPK मधील नत्र (N) पानांच्या वाढीसाठी, स्फुरद (P) मुळे-फळांसाठी व पालाश (K) रोगप्रतिकार व गुणवत्तेसाठी आवश्यक आहे. (II) नीम-लेपित युरियामुळे नत्राचा ऱ्हास कमी होऊन कार्यक्षमता वाढते. (III) युरियामध्ये सुमारे 46% नत्र असते.",q_english:"On fertilisers — (I) In NPK, N aids leaf growth, P roots/fruits, K disease resistance/quality. (II) Neem-coated urea cuts nitrogen loss, raising efficiency. (III) Urea has ~46% nitrogen.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त III बरोबर"],correct_index:0,explanation_marathi:"तिन्ही विधाने कृषी-रसायन तथ्यांशी जुळतात: NPK ची भूमिका; नीम-लेपित युरिया (2015 पासून बंधनकारक); युरियात 46% नत्र. B, C, D अपूर्ण.",evidence:"NCERT; Ministry of Chemicals & Fertilizers"},
{section:8,subtopic:"बहुमर: प्रकार व वल्कनीकरण",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — (a) थर्मोप्लास्टिक (b) थर्मोसेटिंग (c) वल्कनीकरण (d) नायलॉन-66 : (1) गरम केल्यावर मऊ; पुनर्चक्रीकरण शक्य (PVC) (2) एकदा साचेबद्ध झाल्यावर पुन्हा मऊ नाही (बेकेलाइट) (3) गंधकाने रबर टणक करणे (गुडइयर, 1839) (4) पहिला पूर्ण कृत्रिम तंतू (1935, कॅरोथर्स)",q_english:"Match — (a) Thermoplastic (b) Thermosetting (c) Vulcanisation (d) Nylon-66 : (1) Softens on heating; recyclable (PVC) (2) Cannot be remoulded (Bakelite) (3) Hardening rubber with sulphur (Goodyear, 1839) (4) First fully synthetic fibre (1935, Carothers)",options:["a-1, b-2, c-3, d-4","a-2, b-1, c-3, d-4","a-1, b-2, c-4, d-3","a-1, b-3, c-2, d-4"],correct_index:0,explanation_marathi:"थर्मोप्लास्टिक-PVC (a-1); थर्मोसेटिंग-बेकेलाइट (b-2); वल्कनीकरण-गुडइयर (c-3); नायलॉन-66-कॅरोथर्स (d-4). B मध्ये a-b, C मध्ये c-d, D मध्ये b-c अदलाबदल — चूक.",evidence:"NCERT Chemistry Class 8/12"},
{section:8,subtopic:"रक्ताचा pH व बफर",qtype:"कारण-परिणाम",q_marathi:"विधान (A): मानवी रक्ताचा pH 7.4 ± 0.05 या अत्यंत अरुंद पट्ट्यात राखला जातो. विधान (B): रक्तातील बायकार्बोनेट बफर प्रणाली (H₂CO₃/HCO₃⁻) अतिरिक्त आम्ल किंवा आम्लारी निष्प्रभ (neutralise) करते.",q_english:"Statement (A): Human blood pH is held within 7.4 ± 0.05. Statement (B): The bicarbonate buffer (H₂CO₃/HCO₃⁻) neutralises excess acid/base.",options:["दोन्ही बरोबर; B हे A चे कारण","दोन्ही बरोबर; B हे A चे कारण नाही","A बरोबर, B चूक","A चूक, B बरोबर"],correct_index:0,explanation_marathi:"रक्त pH 7.4 — A बरोबर. बायकार्बोनेट बफर हेच स्थिरीकरणाचे यंत्रणे — B हे A चे योग्य कारण. B पर्याय चूक कारण B कारणच आहे; C, D चूक.",evidence:"NCERT Biology Class 11"},
{section:8,subtopic:"UIP लस वेळापत्रक",qtype:"तक्ता आधारित",q_marathi:"सार्वत्रिक लसीकरण कार्यक्रम (UIP) वेळापत्रकाबद्दल खालीलपैकी कोणते विधान चूक आहे? (BCG–जन्म; OPV–जन्म; DPT–6,10,14 आठवडे; गोवर/MR–9-12 महिने)",q_english:"Which statement on the UIP schedule is INCORRECT? (BCG–birth; OPV–birth; DPT–6,10,14 weeks; Measles/MR–9-12 months)",options:["BCG लस जन्मतः क्षयरोग प्रतिबंधासाठी दिली जाते","DPT ही तिहेरी लस 6, 10 व 14 आठवड्यांत दिली जाते","गोवरची पहिली मात्रा 9-12 महिन्यांत दिली जाते","OPV ही इंजेक्शनद्वारे दिली जाणारी निष्क्रिय (killed) लस आहे"],correct_index:3,explanation_marathi:"OPV तोंडावाटे दिली जाणारी जिवंत क्षीण (live attenuated) लस आहे; इंजेक्शनद्वारे दिली जाणारी निष्क्रिय लस IPV आहे — त्यामुळे D चूक. A, B, C UIP वेळापत्रकाशी जुळतात.",evidence:"MoHFW (UIP schedule)"},
{section:8,subtopic:"Bt कापूस vs DMH-11 मोहरी",qtype:"दोन संकल्पना एकत्र",q_marathi:"विधाने पहा — (I) Bt कापूस (2002) हा भारतात व्यावसायिक लागवडीस मंजुरी मिळालेले पहिले जनुकीय सुधारित (GM) पीक आहे. (II) DMH-11 मोहरीला GEAC ने 2022 मध्ये पर्यावरणीय मोचनासाठी (environmental release) मंजुरी दिली, पण सर्वोच्च न्यायालयाच्या खंडित निर्णयामुळे त्याची स्थिती प्रलंबित आहे.",q_english:"Consider — (I) Bt cotton (2002) was India's first GM crop approved for commercial cultivation. (II) GEAC cleared DMH-11 mustard for environmental release in 2022, but its status is pending after the SC's split verdict.",options:["फक्त I बरोबर","फक्त II बरोबर","I आणि II दोन्ही बरोबर","I आणि II दोन्ही चूक"],correct_index:2,explanation_marathi:"Bt कापूस 2002 मध्ये GEAC मंजूर — I बरोबर. DMH-11 ला ऑक्टोबर 2022 मध्ये GEAC मंजुरी; जुलै 2024 मध्ये सर्वोच्च न्यायालयाचा खंडित निर्णय — II बरोबर. A, B अपूर्ण; D चूक.",evidence:"GEAC; Supreme Court (July 2024)"},
{section:8,subtopic:"CRISPR-Cas9",qtype:"बहु-विधान (I, II, III)",q_marathi:"CRISPR-Cas9 बद्दल — (I) या तंत्रज्ञानासाठी एमॅन्युएल चार्पेंटियर व जेनिफर डौडना यांना 2020 चे रसायनशास्त्रातील नोबेल मिळाले. (II) Cas9 हे मार्गदर्शक RNA च्या साहाय्याने DNA च्या ठराविक जागी कापणारे एंझाइम आहे. (III) या तंत्राने मानवी भ्रूणातील जनुकांत बदल (germline editing) करणे सर्व देशांत कायदेशीर आहे.",q_english:"On CRISPR-Cas9 — (I) Charpentier & Doudna won the 2020 Chemistry Nobel for it. (II) Cas9 cuts DNA at targeted sites guided by RNA. (III) Human germline editing with it is legal in all countries.",options:["I, II आणि III सर्व बरोबर","फक्त I आणि II बरोबर","फक्त II आणि III बरोबर","फक्त III बरोबर"],correct_index:1,explanation_marathi:"2020 चे नोबेल — I बरोबर. Cas9 ची कार्यपद्धती — II बरोबर. पण भ्रूणातील जनुकबदल बहुतेक देशांत प्रतिबंधित/नियंत्रित आहे, सर्वत्र कायदेशीर नाही — III चूक. त्यामुळे A, C, D चूक.",evidence:"Nobel Prize Chemistry 2020; NCERT"},
{section:8,subtopic:"दुहेरी फलन",qtype:"Assertion-Reason",q_marathi:"विधान (A): आवृतबीजी (angiosperm) वनस्पतींमध्ये दुहेरी फलन होते — एक नरयुग्मक अंडपेशीशी तर दुसरे दुय्यम केंद्रकाशी संयोग पावते. कारण (R): यातून द्विगुणित (2n) भ्रूण व त्रिगुणित (3n) भ्रूणपोष (endosperm) तयार होतो.",q_english:"Assertion (A): Angiosperms show double fertilisation — one male gamete fuses with the egg, another with secondary nucleus. Reason (R): This yields a diploid embryo and triploid endosperm.",options:["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण","A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही","A बरोबर, R चूक","A चूक, R बरोबर"],correct_index:0,explanation_marathi:"दुहेरी फलनाची व्याख्या — A बरोबर. सिनगॅमी (2n) व तिहेरी संयोग (3n भ्रूणपोष) — R बरोबर व A चे योग्य स्पष्टीकरण. B चूक कारण R स्पष्टीकरणच आहे; C, D चूक.",evidence:"NCERT Biology Class 12"},

function renderQuiz(){

  quizEl.appendChild(card);
  const btn=card.querySelector('.show-ans');const box=card.querySelector('.ansbox');
  btn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा';};
  card.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected');};});
 });
}
renderFilters();renderQuiz();
