s": ["A-2, B-1, C-3, D-4", "A-1, B-2, C-3, D-4", "A-2, B-3, C-1, D-4", "A-4, B-1, C-2, D-3"], "correct_index": 0, "explanation_marathi": "बेकेलाईट स्विचेस, टेफ्लॉन नॉन-स्टिक, नायलॉन दोर, पॉलिथिन पिशव्या.", "evidence": "Polymers"}, {"section": 8, "subtopic": "Work Energy Transformations", "qtype": "bahu-vidhan", "q_marathi": "खालील विधाने विचारात घ्या: (A) जलविद्युत प्रकल्पात स्थितिज ऊर्जेचे विद्युत ऊर्जेत रूपांतर होते. (B) प्रकाशसंश्लेषण वगळता सौर सेलमध्ये सौर ऊर्जेचे थेट विद्युत ऊर्जेत रूपांतर होते. (C) मायक्रोफोनमध्ये ध्वनी ऊर्जेचे विद्युत ऊर्जेत रूपांतर होते तर लाऊडस्पीकरमध्ये याच्या विरुद्ध होते. कोणती विधाने बरोबर आहेत?", "q_english": "Consider: (A) In hydroelectric plant potential energy converts to electrical energy. (B) Apart from photosynthesis, in solar cell solar energy directly converts to electrical energy. (C) Microphone converts sound to electrical energy while loudspeaker does reverse. Which are correct?", "options": ["फक्त A", "फक्त A आणि B", "A, B आणि C", "फक्त C"], "correct_index": 2, "explanation_marathi": "तिन्ही रूपांतरणे बरोबर.", "evidence": "Energy conversion"}, {"section": 8, "subtopic": "Nervous System Reflex Action", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): गरम वस्तूला हात लागल्यास हात त्वरित मागे खेचला जातो. कारण (R): प्रतिक्षिप्त क्रिया मेरुरज्जूकडून नियंत्रित होते आणि मेंदूकडे संदेश जाण्यापूर्वीच प्रतिसाद मिळतो.", "q_english": "Assertion (A): Hand is withdrawn immediately on touching a hot object. Reason (R): Reflex action is controlled by spinal cord and response occurs before signal reaches brain.", "options": ["A बरोबर, R चूक", "A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A चूक, R बरोबर", "दोन्ही चूक"], "correct_index": 1, "explanation_marathi": "दोन्ही बरोबर R हे A चे स्पष्टीकरण, प्रतिक्षिप्त चाप.", "evidence": "Reflex action"}, {"section": 8, "subtopic": "Buoyancy Archimedes Principle", "qtype": "bahu-vidhan", "q_marathi": "खालील विधाने विचारात घ्या: (A) तरंगणाऱ्या वस्तूवर कार्य करणारे उत्प्लावन बल विस्थापित द्रवाच्या वजनाएवढे असते. (B) जहाज लोखंडाचे असूनही तरंगते कारण त्याची सरासरी घनता पाण्यापेक्षा कमी राखली जाते. (C) हायड्रोमीटर आर्किमिडीजच्या तत्त्वावर कार्य करते. कोणती विधाने बरोबर आहेत?", "q_english": "Consider: (A) Buoyant force on floating body equals weight of displaced liquid. (B) Ship floats despite being iron because its average density is kept less than water. (C) Hydrometer works on Archimedes principle. Which are correct?", "options": ["फक्त A", "फक्त A आणि B", "फक्त B आणि C", "A, B आणि C"], "correct_index": 3, "explanation_marathi": "तिन्ही बरोबर: उत्प्लावन बल, जहाज, हायड्रोमीटर.", "evidence": "Archimedes principle"}, {"section": 8, "subtopic": "Food Preservation Techniques", "qtype": "jodya lava", "q_marathi": "जोड्या लावा: (A) पाश्चरायझेशन (B) निर्जलीकरण (C) क्षारण (Salting) (D) मोरंबा/जॅम; (1) मीठ घालून ओलावा कमी करणे (2) सौम्य तापवून सूक्ष्मजीव नष्ट करणे (3) साखरेच्या पाकात साठवणे (4) पाणी काढून टाकून साठवण. योग्य संकेतांक निवडा.", "q_english": "Match: (A) Pasteurization (B) Dehydration (C) Salting (D) Murabba/Jam; (1) Reducing moisture by salt (2) Killing microbes by mild heating (3) Storing in sugar syrup (4) Storage by removing water. Choose correct code.", "options": ["A-2, B-4, C-1, D-3", "A-1, B-2, C-3, D-4", "A-4, B-3, C-2, D-1", "A-3, B-1, C-4, D-2"], "correct_index": 0, "explanation_marathi": "पाश्चरायझेशन सौम्य ताप, निर्जलीकरण पाणी काढणे, क्षारण मीठ, मोरंबा साखर.", "evidence": "Food preservation"}, {"section": 8, "subtopic": "Iron Deficiency Anaemia", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): लोहाच्या कमतरतेमुळे ॲनिमिया होतो आणि श्वसनात धाप लागते. कारण (R): हिमोग्लोबिन निर्मितीसाठी लोह आवश्यक असते आणि हिमोग्लोबिन ऑक्सिजन वाहतूक करते.", "q_english": "Assertion (A): Iron deficiency causes anaemia with breathlessness. Reason (R): Iron is essential for haemoglobin formation and haemoglobin transports oxygen.", "options": ["A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A चूक, R बरोबर"], "correct_index": 2, "explanation_marathi": "दोन्ही बरोबर R हे A चे स्पष्टीकरण, लोहाअभावी हिमोग्लोबिन कमी ऑक्सिजन घट.", "evidence": "Anaemia"}]
</script>

<script>
const QUESTIONS_P = JSON.parse(document.getElementById('quiz-data').textContent);
let currentFilter='all';
const sectionNames={3:"3. चालू घडामोडी",4:"4. इतिहास",5:"5. भूगोल",6:"6. राज्यशास्त्र",7:"7. अर्थशास्त्र",8:"8. सामान्य विज्ञान"};
const filtersEl=document.getElementById('filters'),quizEl=document.getElementById('quiz'),progressEl=document.getElementById('progress');
function renderFilters(){
filtersEl.innerHTML='';
const a=document.createElement('button');a.className='filter-btn'+(currentFilter==='all'?' active':'');a.textContent='सर्व (90)';a.onclick=()=>{currentFilter='all';renderFilters();renderQuiz()};filtersEl.appendChild(a);
[3,4,5,6,7,8].forEach(s=>{const b=document.createElement('button');b.className='filter-btn'+(currentFilter===s?' active':'');b.textContent=sectionNames[s]+' (15)';b.onclick=()=>{currentFilter=s;renderFilters();renderQuiz()};filtersEl.appendChild(b)});
}
function renderQuiz(){
const qs=QUESTIONS_P.filter(q=>currentFilter==='all'||q.section===currentFilter);
progressEl.textContent='संच H • दाखवलेले प्रश्न: '+qs.length+' / 90';
quizEl.innerHTML='';
qs.forEach((q,idx)=>{
const card=document.createElement('div');card.className='qcard';
const letters=['A','B','C','D'];
let oh='';
try{
oh=q.options.map((op,i)=>'<div class="opt"><span class="opt-letter">'+letters[i]+'.</span><span>'+String(op).split('\\n').join('<br>')+'</span></div>').join('');
}catch(e){oh='<div>पर्याय लोड करण्यात अडचण</div>'}
const qm=String(q.q_marathi||'').split('\\n').join('<br>');
const qe=String(q.q_english||'').split('\\n').join('<br>');
const expl=String(q.explanation_marathi||'').split('\\n').join('<br>');
const evi=String(q.evidence||'').split('\\n').join('<br>');
const sub=String(q.subtopic||'');
const qt=String(q.qtype||'');
const correctOpt=(q.options && q.options[q.correct_index])?String(q.options[q.correct_index]):'';
card.innerHTML='<div class="qmeta"><span class="badge">'+(sectionNames[q.section]||('Sec '+q.section))+'</span><span class="badge type">'+qt+'</span><span class="badge diff">कठीणता 5/5</span><span class="badge" style="background:#f3e5f5;color:#6a1b9a">'+sub+'</span></div><div class="qtext"><b>प्रश्न '+(idx+1)+'.</b> '+qm+'<span class="en">'+qe+'</span></div><div>'+oh+'</div><button class="show-ans">उत्तर पहा</button><div class="ansbox"><div class="correct">✅ योग्य उत्तर: '+letters[q.correct_index]+' – '+correctOpt+'</div><div class="expl"><b>स्पष्टीकरण:</b> '+expl+'</div><div class="evi">पुरावा: '+evi+'</div></div>';
quizEl.appendChild(card);
const btn=card.querySelector('.show-ans'),box=card.querySelector('.ansbox');
btn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा'};
card.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected')}});
});
}
(function(){
const st=document.createElement('style');
st.textContent='.ansbox{display:none;margin-top:12px;padding:12px;border-radius:8px;background:#e8f5e9;border:1px solid #c8e6c9}.ansbox.visible{display:block}.correct{font-weight:700;color:#2e7d32;margin-bottom:8px}.expl{font-size:14px;margin-bottom:6px}.evi{font-size:12.5px;color:#555;font-style:italic}';
document.head.appendChild(st);
})();
renderFilters();renderQuiz();
</script>
</body>
</html>
