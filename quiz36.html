atch lakes and states: 1. Vembanad 2. Dal 3. Loktak 4. Pangong Tso | A. J&K B. Kerala C. Ladakh D. Manipur",options:[{m:"1-B, 2-A, 3-D, 4-C",e:"1-B, 2-A, 3-D, 4-C"},{m:"1-A, 2-B, 3-C, 4-D",e:"1-A, 2-B, 3-C, 4-D"},{m:"1-B, 2-D, 3-A, 4-C",e:"1-B, 2-D, 3-A, 4-C"},{m:"1-D, 2-A, 3-B, 4-C",e:"1-D, 2-A, 3-B, 4-C"}],correct_index:0,explanation_marathi:"वेंबनाड (केरळ, सर्वात लांब), दाल (श्रीनगर), लोकतक (तरंगते केवल लामजाओ उद्यान), पँगाँग (लडाख, खाऱ्या पाण्याचे)."},{section:5,subtopic:"पश्चिम किनारी बंदरे उत्तर-दक्षिण",qtype:"कालक्रम",q_marathi:"पश्चिम किनारी बंदरांचा उत्तर-दक्षिण क्रम लावा: 1. कांडला 2. मुंबई 3. कोची 4. मुंद्रा",q_english:"North-south order of west coast ports: 1. Kandla 2. Mumbai 3. Kochi 4. Mundra",options:[{m:"1-4-2-3",e:"1-4-2-3"},{m:"1-2-4-3",e:"1-2-4-3"},{m:"4-1-2-3",e:"4-1-2-3"},{m:"3-2-4-1",e:"3-2-4-1"}],correct_index:0,explanation_marathi:"कांडला (कच्छ आखात) → मुंद्रा (कच्छ आखात, दक्षिणेस) → मुंबई → कोची; नकाशा-आधारित प्रश्न."},{section:5,subtopic:"मुंबई नैसर्गिक बंदर",qtype:"साधा प्रश्न",q_marathi:"मुंबई बंदर कोणत्या प्रकारचे बंदर आहे?",q_english:"What type of harbour is Mumbai port?",options:[{m:"नैसर्गिक बंदर",e:"Natural harbour"},{m:"कृत्रिम बंदर",e:"Artificial harbour"},{m:"नदी बंदर",e:"Riverine port"},{m:"खाडी बंदर",e:"Creek port"}],correct_index:0,explanation_marathi:"मुंबई हे नैसर्गिक खोल पाण्याचे बंदर; भारतातील सर्वात मोठे प्रमुख बंदर (मालवाहतूक मूल्याने); JNPT (न्हावा शेवा) जवळच."},{section:5,subtopic:"महाबळेश्वर 5 नद्या उगम",qtype:"विधान-कारण",q_marathi:"विधान (A): महाबळेश्वर येथून पाच नद्या उगम पावतात. कारण (R): ते सह्याद्रीतील उंच पठार असून जास्त पर्जन्याचे क्षेत्र आहे.",q_english:"Assertion (A): Five rivers originate at Mahabaleshwar. Reason (R): It is a high Sahyadri plateau with heavy rainfall.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"कृष्णा, कोयना, वेण्णा, सावित्री, गायत्री; पंचगंगा मंदिर; जास्त पर्जन्यामुळे (6000 मिमी+) बारमाही झरे."},{section:6,subtopic:"कलम 45 बालसंगोपन",qtype:"बहु-विधान",q_marathi:"कलम 45 बद्दल: I. 6 वर्षांखालील बालकांची संगोपन व शिक्षणाची तरतूद सांगते. II. हे मार्गदर्शक तत्त्व आहे. III. 86 व्या दुरुस्तीने (2002) यात बदल झाला.",q_english:"On Article 45: I. Provides for early childhood care below 6 years. II. It is a Directive Principle. III. Amended by 86th Amendment (2002).",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; 86 व्या दुरुस्तीने 6-14 वयोगट कलम 21A मध्ये गेला, 0-6 वयोगट कलम 45 मध्ये राहिला."},{section:6,subtopic:"कलम 49 स्मारक संरक्षण",qtype:"साधा प्रश्न",q_marathi:"राष्ट्रीय महत्त्वाच्या स्मारकांच्या संरक्षणाची तरतूद कोणत्या कलमात आहे?",q_english:"Which article provides for protection of monuments of national importance?",options:[{m:"कलम 49",e:"Article 49"},{m:"कलम 48",e:"Article 48"},{m:"कलम 50",e:"Article 50"},{m:"कलम 47",e:"Article 47"}],correct_index:0,explanation_marathi:"कलम 49 — मार्गदर्शक तत्त्व; ASI (भारतीय पुरातत्त्व सर्वेक्षण) याच आधारे स्मारके जतन करते."},{section:6,subtopic:"कलम 51 आंतरराष्ट्रीय शांतता",qtype:"जोड्या लावा",q_marathi:"कलम 51 मधील तत्त्वांची जोडी लावा: 1. आंतरराष्ट्रीय शांतता 2. राष्ट्रांमधील न्याय्य संबंध 3. आंतरराष्ट्रीय कायदा पालन 4. लवादाने वाद मिटवणे | A. 51(a) B. 51(b) C. 51(c) D. 51(d)",q_english:"Match Article 51 principles: 1. International peace 2. Just relations between nations 3. Respect for international law 4. Settlement by arbitration",options:[{m:"1-A, 2-B, 3-C, 4-D",e:"1-A, 2-B, 3-C, 4-D"},{m:"1-B, 2-A, 3-D, 4-C",e:"1-B, 2-A, 3-D, 4-C"},{m:"1-A, 2-C, 3-B, 4-D",e:"1-A, 2-C, 3-B, 4-D"},{m:"1-D, 2-C, 3-B, 4-A",e:"1-D, 2-C, 3-B, 4-A"}],correct_index:0,explanation_marathi:"कलम 51 — परराष्ट्र धोरणाचे मार्गदर्शक तत्त्व; पंचशील (1954) याच भावनेतून."},{section:6,subtopic:"कलम 56 राष्ट्रपती कार्यकाळ",qtype:"बहु-विधान",q_marathi:"कलम 56 बद्दल: I. राष्ट्रपतींचा कार्यकाळ 5 वर्षे असतो. II. कार्यकाळ संपल्यानंतरही उत्तराधिकारी येईपर्यंत पदावर राहतात. III. राजीनामा उपराष्ट्रपतींकडे देतात.",q_english:"On Article 56: I. President's term is 5 years. II. Continues till successor takes over. III. Resignation addressed to Vice-President.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; कलम 56(1)(a)(b)(c); पदभार स्वीकारल्यापासून 5 वर्षे मोजली जातात."},{section:6,subtopic:"कलम 62 रिक्त पद निवडणूक",qtype:"साधा प्रश्न",q_marathi:"राष्ट्रपतीपद रिक्त झाल्यास निवडणूक किती कालावधीत घ्यावी लागते?",q_english:"Within what period must election be held if President's office falls vacant?",options:[{m:"6 महिने",e:"6 months"},{m:"3 महिने",e:"3 months"},{m:"1 वर्ष",e:"1 year"},{m:"1 महिना",e:"1 month"}],correct_index:0,explanation_marathi:"कलम 62(2) — 6 महिन्यांत निवडणूक; तोपर्यंत उपराष्ट्रपती कार्यभार सांभाळतात (कलम 65)."},{section:6,subtopic:"कलम 75 मंत्रिपरिषद",qtype:"बहु-विधान",q_marathi:"कलम 75 बद्दल: I. पंतप्रधानांची नियुक्ती राष्ट्रपती करतात. II. मंत्री लोकसभेला सामूहिकरित्या जबाबदार असतात. III. मंत्री 6 महिन्यांत संसद सदस्य होणे आवश्यक आहे.",q_english:"On Article 75: I. PM appointed by President. II. Ministers collectively responsible to Lok Sabha. III. Minister must become MP within 6 months.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; 75(3) सामूहिक जबाबदारी — संसदीय शासनाचा गाभा; 75(5) 6 महिन्यांची अट."},{section:6,subtopic:"कलम 83 संसद कालावधी",qtype:"साधा प्रश्न",q_marathi:"कलम 83 नुसार लोकसभेचा सामान्य कालावधी किती?",q_english:"Under Article 83, what is the normal duration of Lok Sabha?",options:[{m:"5 वर्षे",e:"5 years"},{m:"6 वर्षे",e:"6 years"},{m:"4 वर्षे",e:"4 years"},{m:"3 वर्षे",e:"3 years"}],correct_index:0,explanation_marathi:"कलम 83(2) — 5 वर्षे; आणीबाणीत 1 वर्षाने वाढवता येते (एकावेळी); राज्यसभेचे 1/3 सदस्य दर 2 वर्षांनी निवृत्त."},{section:6,subtopic:"संसद अधिवेशन प्रक्रिया क्रम",qtype:"कालक्रम",q_marathi:"अर्थसंकल्पीय प्रक्रियेचा योग्य क्रम लावा: 1. अर्थसंकल्प सादर 2. सर्वसाधारण चर्चा 3. अनुदान मागण्या 4. विनियोजन विधेयक",q_english:"Order budget process: 1. Budget presentation 2. General discussion 3. Demands for grants 4. Appropriation Bill",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"2-1-3-4",e:"2-1-3-4"},{m:"1-3-2-4",e:"1-3-2-4"},{m:"4-3-2-1",e:"4-3-2-1"}],correct_index:0,explanation_marathi:"कलम 112-114; 1 फेब्रुवारी रोजी सादर (2017 पासून); कट प्रस्ताव अनुदान मागण्यांवरच."},{section:6,subtopic:"कलम 101 दुहेरी सदस्यत्व",qtype:"विधान-कारण",q_marathi:"विधान (A): कलम 101 नुसार एकाच वेळी संसदेच्या दोन्ही सभागृहांचे सदस्य होता येत नाही. कारण (R): दुहेरी सदस्यत्व आढळल्यास 10 दिवसांत एका सभागृहाचा राजीनामा द्यावा लागतो.",q_english:"Assertion (A): Art 101 bars simultaneous membership of both Houses. Reason (R): Dual membership requires resigning one House within 10 days.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both true, R explains A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"दोन्ही बरोबर; पण R हे A चे स्पष्टीकरण नाही — A हा नियम, R हा अपवादाची कार्यवाही; लोकप्रतिनिधित्व कायदा 1951 कलम 68-70 तपशील देतो."},{section:6,subtopic:"कलम 105 संसदीय विशेषाधिकार",qtype:"साधा प्रश्न",q_marathi:"संसदेच्या विशेषाधिकारांची तरतूद कोणत्या कलमात आहे?",q_english:"Which article deals with parliamentary privileges?",options:[{m:"कलम 105",e:"Article 105"},{m:"कलम 194",e:"Article 194"},{m:"कलम 122",e:"Article 122"},{m:"कलम 361",e:"Article 361"}],correct_index:0,explanation_marathi:"कलम 105 — भाषण स्वातंत्र्य, प्रकाशन संरक्षण; कलम 194 राज्य विधिमंडळासाठी; कलम 361 राष्ट्रपती/राज्यपाल संरक्षण."},{section:6,subtopic:"कलम 113 प्रभारित खर्च",qtype:"बहु-विधान",q_marathi:"कलम 113 बद्दल (प्रभारित खर्च): I. भारताच्या संचित निधीवर प्रभारित खर्चावर मतदान होत नाही. II. राष्ट्रपतींचे वेतन प्रभारित खर्च आहे. III. चर्चा मात्र होऊ शकते.",q_english:"On Article 113 (charged expenditure): I. No voting on charged expenditure. II. President's salary is charged. III. Discussion is allowed.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; CAG, न्यायाधीशांचे वेतनही प्रभारित; मतदान नाही पण चर्चा होऊ शकते."},{section:6,subtopic:"कलम 131 सर्वोच्च न्यायालय मूळ अधिकार",qtype:"साधा प्रश्न",q_marathi:"कलम 131 कशाशी संबंधित आहे?",q_english:"Article 131 deals with?",options:[{m:"सर्वोच्च न्यायालयाचे मूळ अधिकारक्षेत्र",e:"Original jurisdiction of Supreme Court"},{m:"अपील अधिकारक्षेत्र",e:"Appellate jurisdiction"},{m:"सल्लागार अधिकारक्षेत्र",e:"Advisory jurisdiction"},{m:"पुनर्विलोकन",e:"Review"}],correct_index:0,explanation_marathi:"कलम 131 — केंद्र-राज्य किंवा राज्य-राज्य वाद; विशेष मूळ अधिकारक्षेत्र; फक्त कायदेशीर हक्कांचा वाद."},{section:6,subtopic:"कलम 137-150-155",qtype:"जोड्या लावा",q_marathi:"जोडी लावा: 1. कलम 137 2. कलम 150 3. कलम 155 | A. राज्यपाल नियुक्ती B. पुनर्विलोकन C. लेख्यांचे स्वरूप (CAG सल्ला)",q_english:"Match: 1. Art 137 2. Art 150 3. Art 155 | A. Governor appointment B. Review C. Form of accounts (CAG advice)",options:[{m:"1-B, 2-C, 3-A",e:"1-B, 2-C, 3-A"},{m:"1-A, 2-B, 3-C",e:"1-A, 2-B, 3-C"},{m:"1-B, 2-A, 3-C",e:"1-B, 2-A, 3-C"},{m:"1-C, 2-B, 3-A",e:"1-C, 2-B, 3-A"}],correct_index:0,explanation_marathi:"137 (स्वतःच्या निर्णयाचे पुनर्विलोकन), 150 (राष्ट्रपती CAG च्या सल्ल्याने लेख्यांचे स्वरूप ठरवतात), 155 (राज्यपालांची राष्ट्रपतींकडून नियुक्ती)."},{section:6,subtopic:"कलम 261 सार्वजनिक कागदपत्रे",qtype:"विधान-कारण",q_marathi:"विधान (A): कलम 261 नुसार भारतभर सार्वजनिक कागदपत्रांना मान्यता द्यावी लागते. कारण (R): यामुळे संघराज्यात कायदेशीर एकसूत्रता राहते.",q_english:"Assertion (A): Art 261 requires full faith to public acts/records throughout India. Reason (R): It ensures legal uniformity in the federation.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"कलम 261 — 'पूर्ण विश्वास आणि मान्यता'; अमेरिकेच्या घटनेतून प्रेरणा; एका राज्याचा न्यायनिर्णय दुसऱ्या राज्यात लागू."},{section:6,subtopic:"कलम 267 आकस्मिक निधी",qtype:"साधा प्रश्न",q_marathi:"आकस्मिक निधीची (Contingency Fund) तरतूद कोणत्या कलमात आहे?",q_english:"Which article provides for the Contingency Fund?",options:[{m:"कलम 267",e:"Article 267"},{m:"कलम 266",e:"Article 266"},{m:"कलम 268",e:"Article 268"},{m:"कलम 265",e:"Article 265"}],correct_index:0,explanation_marathi:"कलम 267 — राष्ट्रपतींच्या ताब्यात; अनपेक्षित खर्चासाठी आगाऊ रक्कम; नंतर संसदेची मान्यता घ्यावी लागते."},{section:7,subtopic:"पहिली पंचवार्षिक योजना हॅरॉड-डोमर",qtype:"बहु-विधान",q_marathi:"पहिल्या पंचवार्षिक योजनेबद्दल (1951-56): I. हॅरॉड-डोमर मॉडेलवर आधारित होती. II. शेती व सिंचनावर भर होता. III. भाक्रा-नांगल प्रकल्प याच काळात सुरू झाला.",q_english:"On First Five Year Plan (1951-56): I. Based on Harrod-Domar model. II. Focused on agriculture and irrigation. III. Bhakra-Nangal started in this period.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; 3.6% वृद्धिदर (लक्ष्य 2.1%); समुदाय विकास कार्यक्रम (1952) याच योजनेत."},{section:7,subtopic:"दुसरी योजना महालनोबिस",qtype:"साधा प्रश्
