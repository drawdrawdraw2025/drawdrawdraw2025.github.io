type:"कालक्रम",q_marathi:"घटनांचा क्रम लावा: 1. जालियनवाला बाग 2. खिलाफत आंदोलन सुरू 3. स्वराज पक्ष स्थापना 4. रौलेट कायदा",q_english:"Order: 1. Jallianwala Bagh 2. Khilafat start 3. Swaraj Party 4. Rowlatt Act",options:[{m:"4-1-2-3",e:"4-1-2-3"},{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-2-1-3",e:"4-2-1-3"},{m:"1-4-2-3",e:"1-4-2-3"}],correct_index:0,explanation_marathi:"रौलेट (मार्च 1919) → जालियनवाला (13 एप्रिल 1919) → खिलाफत (1919-20) → स्वराज पक्ष (जाने 1923, मोतीलाल-चित्तरंजन)."},{section:4,subtopic:"चले जाव 1942 गवालिया टँक",qtype:"विधान-कारण",q_marathi:"विधान (A): 8 ऑगस्ट 1942 रोजी गांधीजींनी 'चले जाव' चा नारा दिला. कारण (R): क्रिप्स मिशनच्या अपयशानंतर तात्काळ स्वातंत्र्याची मागणी होती.",q_english:"Assertion (A): 'Quit India' call on Aug 8, 1942. Reason (R): After Cripps Mission failure, immediate independence demanded.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"मुंबईच्या गवालिया टँक मैदानात; 'करेंगे या मरेंगे'; समांतर सरकारे (सातारा, तामलुक, बलिया)."},{section:5,subtopic:"सिंधू पंचनद प्रणाली",qtype:"बहु-विधान",q_marathi:"सिंधू नदीप्रणालीबद्दल: I. झेलम, चिनाब, रावी, बियास, सतलज या पाच उपनद्या आहेत. II. सिंधूचा उगम तिबेटमधील बोखर चूजवळ होतो. III. सिंधू पाणी करार (1960) नुसार भारताला पूर्वेकडील नद्यांचे पाणी मिळते.",q_english:"On Indus system: I. Five tributaries Jhelum-Chenab-Ravi-Beas-Sutlej. II. Origin near Bokhar Chu, Tibet. III. 1960 treaty gives India eastern rivers.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त III",e:"Only III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; 'पंचनद' = पंजाब; करारात पश्चिम नद्या (सिंधू, झेलम, चिनाब) पाकिस्तानला, पूर्व नद्या भारताला."},{section:5,subtopic:"गंगा उपनद्या डावी-उजवी",qtype:"जोड्या लावा",q_marathi:"गंगेच्या उपनद्या: 1. यमुना 2. शोण 3. गंडक 4. कोसी | A. उजव्या तीराची B. डाव्या तीराची | योग्य गटवारी निवडा:",q_english:"Ganga tributaries: 1. Yamuna 2. Son 3. Gandak 4. Kosi | A. Right bank B. Left bank",options:[{m:"1-A, 2-A, 3-B, 4-B",e:"1-A, 2-A, 3-B, 4-B"},{m:"1-B, 2-B, 3-A, 4-A",e:"1-B, 2-B, 3-A, 4-A"},{m:"1-A, 2-B, 3-A, 4-B",e:"1-A, 2-B, 3-A, 4-B"},{m:"1-B, 2-A, 3-B, 4-A",e:"1-B, 2-A, 3-B, 4-A"}],correct_index:0,explanation_marathi:"उजवीकडून: यमुना, शोण; डावीकडून: रामगंगा, गोमती, घाघरा, गंडक, कोसी ('बिहारचे दुःख')."},{section:5,subtopic:"नदी लांबी क्रम गंगा-गोदावरी-कृष्णा-नर्मदा",qtype:"कालक्रम",q_marathi:"नद्यांच्या लांबीनुसार चढता क्रम लावा (भारतातील प्रवाह): 1. गंगा 2. गोदावरी 3. कृष्णा 4. नर्मदा",q_english:"Increasing order of length (flow in India): 1. Ganga 2. Godavari 3. Krishna 4. Narmada",options:[{m:"4-3-2-1",e:"4-3-2-1"},{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-2-3-1",e:"4-2-3-1"},{m:"3-4-1-2",e:"3-4-1-2"}],correct_index:0,explanation_marathi:"नर्मदा (~1312 किमी), कृष्णा (~1400), गोदावरी (~1465), गंगा (~2525) — द्वीपकल्पीय नद्यांत गोदावरी सर्वात लांब."},{section:5,subtopic:"लूनी अंतर्गत जलवाहिनी",qtype:"विधान-कारण",q_marathi:"विधान (A): लूनी नदी कच्छच्या रणात विलीन होते, समुद्राला मिळत नाही. कारण (R): ती अंतर्गत जलवाहिनी (inland drainage) चे उदाहरण आहे.",q_english:"Assertion (A): Luni disappears in Rann of Kachchh, doesn't reach sea. Reason (R): Example of inland drainage.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"अरावलीत उगम (अजमेर), 'लवणवती' (खारे पाणी); राजस्थानातील अंतर्गत जलवाहिनीचे उत्कृष्ट उदाहरण."},{section:5,subtopic:"वुलर तलाव सर्वात मोठा गोड्या पाण्याचा",qtype:"साधा प्रश्न",q_marathi:"भारतातील सर्वात मोठा गोड्या पाण्याचा नैसर्गिक तलाव कोणता?",q_english:"India's largest freshwater natural lake?",options:[{m:"वुलर",e:"Wular"},{m:"डल",e:"Dal"},{m:"चिल्का",e:"Chilka"},{m:"सांभर",e:"Sambhar"}],correct_index:0,explanation_marathi:"जम्मू-काश्मीरमधील वुलर (झेलम नदीवर); चिल्का = खाऱ्या पाण्याचे सरोवर, सांभर = खाऱ्या पाण्याचा तलाव."},{section:5,subtopic:"हिमनद्या गंगोत्री-यमुनोत्री-झेमू",qtype:"बहु-विधान",q_marathi:"हिमनद्यांबद्दल: I. गंगोत्री हिमनदीतून भागीरथी (गंगा) उगम पावते. II. यमुनोत्रीतून यमुना उगम पावते. III. झेमू हिमनदी सिक्कीममधील कांचनजंगाच्या पायथ्याशी आहे.",q_english:"On glaciers: I. Gangotri feeds Bhagirathi (Ganga). II. Yamunotri feeds Yamuna. III. Zemu at Kanchenjunga base, Sikkim.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त III",e:"Only III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; गंगोत्री (गोमुख), झेमू (पूर्व हिमालयातील सर्वात मोठी)."},{section:5,subtopic:"पर्वतरांगा शिखरे",qtype:"जोड्या लावा",q_marathi:"पर्वतरांगा आणि वैशिष्ट्ये: 1. अरावली 2. विंध्य 3. सातपुडा | A. गुरु शिखर B. धूपगड C. अमरकंटक",q_english:"Ranges: 1. Aravalli 2. Vindhya 3. Satpura | A. Guru Shikhar B. Dhupgarh C. Amarkantak",options:[{m:"1-A, 2-C, 3-B",e:"1-A, 2-C, 3-B"},{m:"1-C, 2-A, 3-B",e:"1-C, 2-A, 3-B"},{m:"1-A, 2-B, 3-C",e:"1-A, 2-B, 3-C"},{m:"1-B, 2-C, 3-A",e:"1-B, 2-C, 3-A"}],correct_index:0,explanation_marathi:"अरावली (गुरु शिखर 1722 मी., सर्वात जुनी), विंध्य (अमरकंटक — नर्मदा उगम), सातपुडा (धूपगड 1350 मी.)."},{section:5,subtopic:"तलाव उत्तर-दक्षिण क्रम",qtype:"कालक्रम",q_marathi:"तलावांचा उत्तर-दक्षिण क्रम लावा: 1. वुलर 2. सांभर 3. चिल्का 4. वेंबनाड",q_english:"North-south order of lakes: 1. Wular 2. Sambhar 3. Chilka 4. Vembanad",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"1-3-2-4",e:"1-3-2-4"},{m:"2-1-4-3",e:"2-1-4-3"}],correct_index:0,explanation_marathi:"वुलर (J&K) → सांभर (राजस्थान) → चिल्का (ओडिशा) → वेंबनाड (केरळ) — नकाशा प्रश्न."},{section:5,subtopic:"कोरोमंडल किनारा हिवाळी पर्जन्य",qtype:"विधान-कारण",q_marathi:"विधान (A): कोरोमंडल किनाऱ्यावर (तामिळनाडू) हिवाळ्यात पाऊस पडतो. कारण (R): ईशान्य मोसमी वारे बंगालच्या उपसागरावरून बाष्प घेऊन येतात.",q_english:"Assertion (A): Coromandel coast gets winter rainfall. Reason (R): NE monsoon picks moisture from Bay of Bengal.",options:[{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both A and R true, R explains A"},{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"ऑक्टो-डिसेंबरमध्ये तामिळनाडूला 50%+ पाऊस; उर्वरित भारतात हिवाळा कोरडा."},{section:5,subtopic:"बॉक्साइट ओडिशा पंचपतमाळी",qtype:"साधा प्रश्न",q_marathi:"भारतातील सर्वात जास्त बॉक्साइट साठा कोणत्या राज्यात आहे?",q_english:"Which state has India's largest bauxite reserves?",options:[{m:"ओडिशा",e:"Odisha"},{m:"झारखंड",e:"Jharkhand"},{m:"छत्तीसगड",e:"Chhattisgarh"},{m:"महाराष्ट्र",e:"Maharashtra"}],correct_index:0,explanation_marathi:"ओडिशा (पंचपतमाळी, कोरापुट); अ‍ॅल्युमिनियमसाठी बॉक्साइट; नाल्को (अंगुल) प्रमुख उत्पादक."},{section:5,subtopic:"अणुऊर्जा केंद्रे तारापूर-कैगा-कुडनकुलम",qtype:"बहु-विधान",q_marathi:"अणुऊर्जा केंद्रांबद्दल: I. तारापूर (महाराष्ट्र) हे भारतातील पहिले अणुऊर्जा केंद्र आहे. II. कैगा (कर्नाटक) आणि काकरापार (गुजरात) कार्यरत आहेत. III. कुडनकुलम (तामिळनाडू) रशियन सहकार्यातून बांधले.",q_english:"On nuclear plants: I. Tarapur (MH) is India's first. II. Kaiga (KA) and Kakrapar (GJ) operational. III. Kudankulam (TN) with Russian collaboration.",options:[{m:"फक्त I आणि III",e:"Only I and III"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त I",e:"Only I"},{m:"फक्त II",e:"Only II"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; तारापूर (1969, अमेरिकन सहकार्य); NPCIL संचालित; एकूण क्षमता ~8 GW."},{section:5,subtopic:"हंगाम पिके खरीप-रब्बी-जायद",qtype:"जोड्या लावा",q_marathi:"हंगाम आणि पिके: 1. खरीप 2. रब्बी 3. जायद | A. गहू, हरभरा B. भात, कापूस C. भाजीपाला, टरबूज",q_english:"Seasons and crops: 1. Kharif 2. Rabi 3. Zaid | A. Wheat, gram B. Paddy, cotton C. Vegetables, watermelon",options:[{m:"1-B, 2-A, 3-C",e:"1-B, 2-A, 3-C"},{m:"1-A, 2-B, 3-C",e:"1-A, 2-B, 3-C"},{m:"1-C, 2-A, 3-B",e:"1-C, 2-A, 3-B"},{m:"1-B, 2-C, 3-A",e:"1-B, 2-C, 3-A"}],correct_index:0,explanation_marathi:"खरीप (जून-ऑक्टो, पावसाळी), रब्बी (ऑक्टो-मार्च, हिवाळी), जायद (मार्च-जून, उन्हाळी)."},{section:5,subtopic:"रामसर स्थळे घोषणा क्रम",qtype:"कालक्रम",q_marathi:"रामसर स्थळ घोषणांचा क्रम लावा: 1. चिल्का 2. केओलादेव 3. सांभर 4. वुलर",q_english:"Order Ramsar designations: 1. Chilka 2. Keoladeo 3. Sambhar 4. Wular",options:[{m:"1-2-3-4",e:"1-2-3-4"},{m:"4-3-2-1",e:"4-3-2-1"},{m:"2-1-4-3",e:"2-1-4-3"},{m:"1-3-2-4",e:"1-3-2-4"}],correct_index:0,explanation_marathi:"चिल्का व केओलादेव (1981, पहिली दोन), सांभर (1990), वुलर (1990); भारतात 90+ रामसर स्थळे (2025)."},{section:5,subtopic:"सुंदरबन व्याघ्र राखीव",qtype:"विधान-कारण",q_marathi:"विधान (A): सुंदरबन हे जगातील सर्वात मोठे त्रिभुज प्रदेशावरील व्याघ्र राखीव आहे. कारण (R): येथील वाघ (रॉयल बेंगाल) खाऱ्या पाण्यात पोहण्यात पटाईत आहेत.",q_english:"Assertion (A): Sundarbans is world's largest delta tiger reserve. Reason (R): Royal Bengal tigers here are adept at swimming in saline water.",options:[{m:"A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही",e:"Both true, R does not explain A"},{m:"A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे",e:"Both true, R explains A"},{m:"A बरोबर, R चूक",e:"A true, R false"},{m:"A चूक, R बरोबर",e:"A false, R true"}],correct_index:0,explanation_marathi:"दोन्ही तथ्ये बरोबर; पण 'सर्वात मोठे त्रिभुज' असण्याचे कारण पोहण्याची क्षमता नाही — गंगा-ब्रह्मपुत्रा त्रिभुजाचे क्षेत्रफळ हे कारण."},{section:5,subtopic:"सुवर्ण चतुर्भुज लांबी",qtype:"साधा प्रश्न",q_marathi:"सुवर्ण चतुर्भुज (Golden Quadrilateral) महामार्ग प्रकल्पाची एकूण लांबी किती?",q_english:"Total length of Golden Quadrilateral highway project?",options:[{m:"5,846 किमी",e:"5,846 km"},{m:"7,500 किमी",e:"7,500 km"},{m:"3,300 किमी",e:"3,300
