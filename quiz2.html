<header><h1>📝 तलाठी MPSC 2026 – संच C (90 नवीन प्रश्न)</h1><p>विभाग 3-8 • प्रत्येकी 15 • कठीणता 5/5 • उत्तर डीफॉल्ट लपलेले • 100% नवीन</p></header><div class='filters' id='filters'></div><div class='container'><div class='progress' id='progress'></div><div id='quiz'></div></div><script>const QUESTIONS_C = [{"section": 3, "subtopic": "Delhi-Mumbai Expressway 2025 status", "qtype": "कालक्रम लावा", "q_marathi": "खालील घटनांचा योग्य कालक्रम लावा: A) भारतमाला फेज-1 मध्ये दिल्ली-मुंबई एक्सप्रेसवे मंजुरी B) सोहना येथून बांधकाम पॅकेजेस सुरू C) दिल्ली-दौसा-लालसोट (246 किमी) लोकार्पण D) NHAI चा 2025 प्रगती अहवाल (~82%).", "q_english": "Arrange chronologically: A) Delhi-Mumbai Expressway approval under Bharatmala Phase-1 B) Construction packages start from Sohna C) Delhi-Dausa-Lalsot (246 km) inauguration D) NHAI 2025 progress report (~82%).", "options": ["A-D-B-C", "A-B-D-C", "D-A-B-C", "A-D-C-B"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A-D-B-C आहे कारण 2017 मंजुरीनंतर 2020-21 मध्ये बांधकाम, मग 2023 मध्ये पहिला टप्पा लोकार्पण व 2025 मध्ये प्रगती अहवाल आला. इतर पर्याय बांधकाम-लोकार्पण क्रम चुकवतात किंवा 2025 अहवाल आधी दाखवतात.", "evidence": "MoRTH/NHAI PIB: Bharatmala Phase-I approved Oct 2017; PM inaugurated Delhi-Dausa-Lalsot 246 km on 12 Feb 2023; NHAI 2025 review ~82% physical progress, full completion rescheduled to 2026; 1386 km, 8-lane expandable to 12."}, {"section": 3, "subtopic": "India AI Mission 2024-25", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (भारत AI मिशन 2024): A. इंडियाAI कॉम्प्युट B. इंडियाAI फ्युचरस्किल्स C. सेफ अँड ट्रस्टेड AI D. डेटासेट्स प्लॅटफॉर्म; 1. सवलतीच्या दरात GPU संगणन सुविधा 2. AI मनुष्यबळ विकास व फेलोशिप 3. जबाबदार AI नियमन आराखडा 4. नॉन-पर्सनल डेटा संकलन व्यासपीठ", "q_english": "Match the pairs (India AI Mission 2024): A. IndiaAI Compute B. IndiaAI FutureSkills C. Safe & Trusted AI D. Datasets Platform; 1. Subsidised GPU compute access 2. AI workforce development & fellowships 3. Responsible AI governance framework 4. Non-personal data collection platform", "options": ["A-1, B-2, C-3, D-4", "A-1, B-3, C-2, D-4", "A-4, B-2, C-3, D-1", "A-1, B-2, C-4, D-3"], "correct_index": 0, "explanation_marathi": "बरोबर उत्तर A-1, B-2, C-3, D-4 आहे; कॉम्प्युट-GPU, फ्युचरस्किल्स-मनुष्यबळ, सेफ AI-नियमन, डेटासेट्स-डेटा व्यासपीठ हे 7 स्तंभांपैकी आहेत. इतर पर्यायांत B-C व C-D ची अदलाबदल करून संभ्रम निर्माण केला आहे.", "evidence": "PIB 07-Mar-2024: Cabinet approves IndiaAI Mission outlay Rs 10,371.92 cr for 5 years, 7 pillars; nodal MeitY via IndiaAI IBD under Digital India Corporation; 18,693 GPUs empanelled (MeitY update 2025)."}, {"section": 3, "subtopic": "India Semiconductor Mission Dholera", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: अ) इंडिया सेमीकंडक्टर मिशन सुरू ब) टाटा-PSMC धोलेरा फॅबला केंद्रीय मान्यता क) धोलेरा फॅब बांधकाम सुरू ड) सेमीकॉन इंडिया 2025 (नवी दिल्ली) योग्य क्रम निवडा:", "q_english": "Arrange chronologically: A) India Semiconductor Mission launch B) Union approval to Tata-PSMC Dholera fab C) Dholera fab construction begins D) Semicon India 2025 (New Delhi). Choose correct order:", "options": ["अ → ब → क → ड", "अ → क → ब → ड", "ब → अ → क → ड", "अ → ब → ड → क"], "correct_index": 0, "explanation_marathi": "ISM डिसेंबर 2021 मध्ये सुरू, फेब्रु 2024 मध्ये धोलेरा फॅबला मान्यता, त्यानंतर मार्च 2024 बांधकाम, सप्टें 2025 परिषद हा क्रम लागतो. मान्यतेआधी बांधकाम दाखवणारे पर्याय तर्कविसंगत ठरतात.", "evidence": "PIB: ISM launched Dec 2021 (Rs 76000 cr); Cabinet approved Tata-PSMC Dholera fab on 29 Feb 2024; construction began Mar 2024; Semicon India 2025 held Sep 2025 New Delhi"}, {"section": 3, "subtopic": "Khelo India Youth Games 2025 Bihar", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना 1: 7वी खेलो इंडिया युथ गेम्स 2025 चे यजमान बिहार (पाटणा, राजगीर, गया). संकल्पना 2: या आवृत्तीचा शुभंकर 'गजसिंह'. दोन्ही एकत्र विचार करता योग्य निष्कर्ष कोणता?", "q_english": "Concept 1: 7th Khelo India Youth Games 2025 hosted by Bihar (Patna, Rajgir, Gaya). Concept 2: Mascot of this edition is 'Gajasimha'. Considering both together, which conclusion is correct?", "options": ["7वी आवृत्ती बिहारमध्ये झाली व तिचा शुभंकर गजसिंह होता", "6वी आवृत्ती बिहारमध्ये झाली व शुभंकर गजसिंह होता", "7वी आवृत्ती तामिळनाडूत झाली व शुभंकर गजसिंह होता", "7वी आवृत्ती बिहारमध्ये झाली व शुभंकर जीतू होता"], "correct_index": 0, "explanation_marathi": "2025 ही 7वी आवृत्ती (6वी तामिळनाडू 2023) बिहारमध्ये 4-15 मे 2025 रोजी झाली, शुभंकर गजसिंह होता. इतर पर्यायांत आवृत्ती/यजमान/शुभंकर बदलून संभ्रम निर्माण केला आहे.", "evidence": "PIB/Ministry of Youth Affairs May-2025: 7th Khelo India Youth Games 2025 hosted by Bihar across Patna, Rajgir, Gaya, Bhagalpur, Begusarai from 4-15 May 2025; mascot 'Gajasimha'; 6th edition was Tamil Nadu 2023."}, {"section": 3, "subtopic": "Maharashtra Startup Week 2025", "qtype": "कारण-परिणाम", "q_marathi": "A) महाराष्ट्र स्टार्टअप वीक 2025 मध्ये MSInS मार्फत शासकीय विभागांची समस्या-निवेदने प्रसिद्ध करून स्टार्टअप्सकडून उपाय मागवले जातात. B) निवडक स्टार्टअप्सना संबंधित विभागाकडून ₹15 लाखांपर्यंतचा पायलट कार्यादेश मिळू शकतो. कारण-परिणाम संबंध ओळखा.", "q_english": "A) In Maharashtra Startup Week 2025, MSInS invites startup solutions against problem statements from government departments. B) Selected startups may get pilot work orders up to Rs 15 lakh from the concerned department. Identify cause-effect relation.", "options": ["A व B दोन्ही सत्य, B हे A चा तार्किक परिणाम आहे", "A व B दोन्ही सत्य, पण B हा A चा परिणाम नाही", "A सत्य, B असत्य (कार्यादेश MIDC देते)", "A असत्य (आयोजन NITI आयोग करते), B सत्य"], "correct_index": 0, "explanation_marathi": "A व B दोन्ही सत्य आहेत; समस्या-निवेदन → निवड → पायलट कार्यादेश ही साखळी Startup Week ची मूळ रचना आहे. इतर पर्याय यंत्रणा (MSInS vs NITI/MIDC) किंवा रक्कम-तर्क चुकवतात.", "evidence": "Maharashtra State Innovation Society (MSInS), Dept of Skill, Employment, Entrepreneurship & Innovation: Maharashtra Startup Week 2025 — departments publish problem statements; selected startups eligible for pilot work order up to Rs 15 lakh."}, {"section": 3, "subtopic": "Mumbai Coastal Road 2025", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "मुंबई किनारी रस्ता प्रकल्पाबाबत विधाने पहा: I. दक्षिण टप्पा (प्रिन्सेस स्ट्रीट ते वरळी सी-लिंक) सुमारे 10.58 किमी लांबीचा आहे. II. या प्रकल्पाची अंमलबजावणी MSRDC करते. III. मलबार हिलखाली सुमारे 2.07 किमी लांबीचे जुळे बोगदे आहेत. योग्य पर्याय निवडा:", "q_english": "Consider statements on Mumbai Coastal Road: I. Southern phase (Princess Street to Worli Sea-Link) is about 10.58 km. II. Implementing agency is MSRDC. III. Twin tunnels of about 2.07 km under Malabar Hill. Choose correct option:", "options": ["फक्त I आणि II बरोबर", "फक्त I आणि III बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III सर्व बरोबर"], "correct_index": 1, "explanation_marathi": "I व III बरोबर आहेत; दक्षिण टप्पा 10.58 किमी असून मलबार हिल जुळे बोगदे 2.07 किमी आहेत. II चूक आहे कारण अंमलबजावणी BMC करते, MSRDC नव्हे; त्यामुळे II असलेले पर्याय बाद होतात.", "evidence": "PIB/BMC Mumbai Coastal Road updates 2024-25: south phase 10.58 km, twin tunnels 2.07 km under Malabar Hill, executing agency BMC; arch bridge link to BWSL opened Jan 2025"}, {"section": 3, "subtopic": "Mumbai Metro Line 3 Aqua", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता (मुंबई मेट्रो लाइन-3 अ‍ॅक्वा): (a) मार्ग – कुलाबा ते सीप्झ (b) लांबी – 33.5 किमी (c) स्वरूप – पूर्णतः भूमिगत (27 स्थानके) (d) अंमलबजावणी – MMRDA. तक्त्यातील चुकीचे विधान ओळखा.", "q_english": "Table (Mumbai Metro Line-3 Aqua): (a) Corridor – Colaba to SEEPZ (b) Length – 33.5 km (c) Nature – Fully underground (27 stations) (d) Implementing agency – MMRDA. Identify the incorrect statement in the table.", "options": ["फक्त d चुकीचे (अंमलबजावणी MMRC, निधी JICA)", "फक्त c चुकीचे (काही भाग उन्नत आहे)", "a आणि b चुकीचे (मार्ग व लांबी चूक)", "फक्त b चुकीचे (लांबी 42 किमी आहे)"], "correct_index": 0, "explanation_marathi": "लाइन-3 ची अंमलबजावणी MMRC करते (MMRDA नव्हे), JICA निधीसह; ही 33.5 किमी पूर्ण भूमिगत मार्गिका आहे. इतर पर्याय लांबी/स्वरूपाबाबत संभ्रम निर्माण करतात, जे तक्त्यात बरोबर दिले आहे.", "evidence": "MMRC official & PIB Oct-2024/May-2025: Line-3 Colaba-Bandra-SEEPZ 33.5 km fully underground, 27 stations (26 underground +1 at-grade); Phase-1 Aarey-BKC Oct 2024, Phase-2 BKC-Acharya Atre Chowk May 2025; implemented by MMRC with JICA funding."}, {"section": 3, "subtopic": "Namo Drone Didi 2025", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने (नमो ड्रोन दीदी 2025): I. 15,000 महिला बचत गटांना ड्रोन देण्याचे उद्दिष्ट II. कृषी मंत्रालय + DAY-NRLM यांची अंमलबजावणी, आघाडी खत कंपन्यांचे सहकार्य III. लाभार्थी महिलांना 15 दिवसांचे ड्रोन पायलट प्रशिक्षण. योग्य पर्याय निवडा.", "q_english": "Statements (Namo Drone Didi 2025): I. Target to provide drones to 15,000 women SHGs II. Implementation by Ministry of Agriculture with DAY-NRLM, support of lead fertilizer companies III. 15-day drone pilot training for beneficiary women. Choose the correct option.", "options": ["I, II आणि III बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I बरोबर"], "correct_index": 0, "explanation_marathi": "तिन्ही विधाने बरोबर; तरतूद 1261 कोटी (2024-26), नोडल कृषी मंत्रालय (महिला-बालविकास नव्हे) हे लक्षात घ्यावे. 1500/15000 संख्या व मंत्रालयाबद्दलच्या संभ्रमामुळे इतर पर्याय चूक ठरतात.", "evidence": "PIB 29-Nov-2023 & MoA 2025 update: Namo Drone Didi for 15,000 women SHGs, Rs 1261 cr (2024-25 to 2025-26), implemented by Ministry of Agriculture with DAY-NRLM and lead fertilizer companies; 15-day drone pilot training for Nano-fertilizer/pesticide spraying."}, {"section": 3, "subtopic": "National Green Hydrogen Mission 2025", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): राष्ट्रीय हरित हायड्रोजन मिशनचे 2030 पर्यंत 5 MMT वार्षिक हरित हायड्रोजन उत्पादनाचे लक्ष्य आहे. कारण (R): या मिशनचे नोडल मंत्रालय अवजड उद्योग मंत्रालय आहे. योग्य पर्याय निवडा:", "q_english": "Assertion (A): National Green Hydrogen Mission targets 5 MMT annual green hydrogen production by 2030. Reason (R): The nodal ministry of this Mission is Ministry of Heavy Industries. Choose correct option:", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 2, "explanation_marathi": "A बरोबर आहे; 2030 पर्यंत 5 MMT लक्ष्य निश्चित आहे. R चूक आहे कारण नोडल मंत्रालय MNRE आहे, अवजड उद्योग नव्हे; त्यामुळे दोन्ही बरोबर असलेले पर्याय बाद होतात.", "evidence": "PIB 4 Jan 2023: National Green Hydrogen Mission outlay Rs 19744 cr till 2029-30, target 5 MMT by 2030, nodal Ministry of New and Renewable Energy (MNRE)"}, {"section": 3, "subtopic": "National Quantum Mission", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने: I) एप्रिल 2023 मध्ये ₹6003.65 कोटी, 2023-31 साठी मंजुरी. II) नोडल DST, चार स्तंभ (कॉम्प्युटिंग, कम्युनिकेशन, सेन्सिंग, मटेरियल्स). III) 50-1000 क्युबिट संगणक व उपग्रह QKD उद्दिष्ट. योग्य पर्याय निवडा.", "q_english": "Statements: I) Approved April 2023 with Rs 6003.65 cr for 2023-31. II) Nodal DST, four verticals (computing, communication, sensing, materials). III) Targets 50-1000 qubit computers and satellite QKD. Choose correct option.", "options": ["I, II आणि III सर्व बरोबर", "फक्त I व II बरोबर", "फक्त II व III बरोबर", "फक्त I व III बरोबर"], "correct_index": 0, "explanation_marathi": "I, II, III सर्व बरोबर आहेत कारण आकडेवारी, DST नोडल व चार स्तंभ आणि क्युबिट/QKD लक्ष्य अधिकृत NQM आराखड्याशी जुळतात. इतर पर्याय MeitY नोडल किंवा तरतूद चुकवतात.", "evidence": "PIB 19 Apr 2023: Union Cabinet approved National Quantum Mission, Rs 6003.65 cr (2023-24 to 2030-31), nodal DST; four verticals with Thematic Hubs; targets: 50-1000 physical qubit computers, inter-city QKD, satellite-based QKD."}, {"section": 3, "subtopic": "PM MITRA textile park Amravati", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) अमरावती PM MITRA स्थान  ब) एकूण PM MITRA पार्क्स  क) नोडल मंत्रालय  ड) योजनेची संकल्पना 1) नांदगाव पेठ MIDC  2) 7  3) वस्त्रोद्योग मंत्रालय  4) 5F (Farm to Foreign) योग्य संकेत निवडा:", "q_english": "Match: A) Amravati PM MITRA location B) Total PM MITRA parks C) Nodal Ministry D) Scheme concept; 1) Nandgaon Peth MIDC 2) 7 3) Ministry of Textiles 4) 5F. Choose correct code:", "options": ["अ-1, ब-2, क-3, ड-4", "अ-1, ब-3, क-2, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-2, क-4, ड-3"], "correct_index": 0, "explanation_marathi": "अमरावती पार्क नांदगाव पेठ MIDC येथे, एकूण 7 पार्क्स, नोडल वस्त्रोद्योग मंत्रालय, संकल्पना 5F हे बरोबर आहे. इतर पर्यायांत संख्या/मंत्रालय/संकल्पना अदलाबदल केल्याने ते चूक ठरतात.", "evidence": "PIB Ministry of Textiles: 7 PM MITRA parks notified; Maharashtra-Amravati at Nandgaon Peth MIDC (~1000 acre); 5F concept; total outlay Rs 4445 cr"}, {"section": 3, "subtopic": "PM Surya Ghar Muft Bijli", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): PM सूर्य घर योजनेत 3 kW वरील रूफटॉप सोलरसाठी ₹78,000 पर्यंत अनुदान थेट बँक खात्यात दिले जाते. परिणाम (E): लाभार्थी कुटुंबांना दरमहा 300 युनिटपर्यंत वीज खर्चात बचत शक्य होते. योग्य पर्याय निवडा:", "q_english": "Cause (C): Under PM Surya Ghar, subsidy up to Rs 78,000 for 3 kW+ rooftop solar is credited directly to bank account. Effect (E): Beneficiary families can save on electricity up to 300 units per month. Choose correct option:", "options": ["C आणि E दोन्ही बरोबर, C हे E चे योग्य कारण आहे", "C आणि E दोन्ही बरोबर, C हे E चे योग्य कारण नाही", "C बरोबर, E चूक", "C चूक, E बरोबर"], "correct_index": 0, "explanation_marathi": "C बरोबर (3 kW साठी ₹78,000 अनुदान) व E बरोबर (300 युनिट बचत). अनुदानामुळे भांडवली खर्च कमी होऊन रूफटॉप उभारणी शक्य होते, म्हणून C हे E चे कारण आहे; इतर पर्याय संबंध वा तथ्य चुकवतात.", "evidence": "PIB 29 Feb 2024: PM Surya Ghar Muft Bijli Yojana outlay Rs 75021 cr, 1 cr households target, subsidy Rs 78000 for 3 kW, 300 units free per month, nodal MNRE"}, {"section": 3, "subtopic": "PM Vishwakarma vs PMEGP", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: PM-विश्वकर्मा (2023, MSME, 18 पारंपरिक व्यवसाय, ₹1ल+₹2ल विना-तारण @5%, टूलकिट ₹15000) vs PMEGP (2008-09, KVIC/MSME, ₹50ल उत्पादन/₹20ल सेवा, 15-35% अनुदान). योग्य विधान ओळखा.", "q_english": "Table: PM-Vishwakarma (2023, MSME, 18 traditional trades, Rs 1L+2L collateral-free @5%, toolkit Rs 15000) vs PMEGP (2008-09, KVIC/MSME, Rs 50L manufacturing/20L service, 15-35% subsidy). Identify correct statement.", "options": ["विश्वकर्मा केवळ 18 पारंपरिक कारागिरांसाठी, PMEGP सर्व नवीन उद्योजकांसाठी", "विश्वकर्मा ही PMEGP ची उपयोजना आहे", "दोन्हीत 15-35% आगाऊ अनुदान रचना समान आहे", "PMEGP 2023 मध्ये तर विश्वकर्मा 2008 मध्ये सुरू झाली"], "correct_index": 0, "explanation_marathi": "विश्वकर्मा केवळ 18 पारंपरिक कारागिरांसाठी तर PMEGP सर्व नवीन उद्योजकांसाठी हे बरोबर आहे. इतर पर्याय योजना एकमेकांच्या उपयोजना ठरवतात, अनुदान-व्याज रचना किंवा प्रारंभ वर्षे अदलाबदल करतात.", "evidence": "PIB/MSME: PM Vishwakarma launched 17 Sep 2023, 18 traditional trades, collateral-free loans Rs 1L (Tranche-1) + Rs 2L (Tranche-2) @5%, toolkit incentive Rs 15000; PMEGP launched 2008-09 via KVIC, max project Rs 50L manufacturing/20L service, margin-money subsidy 15-35%."}, {"section": 3, "subtopic": "UNESCO World Heritage 2025 India", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: a) मराठा मिलिटरी लँडस्केप्स b) जिंजी किल्ला c) 47वे WHC सत्र d) वारसा प्रकार — 1) 12 किल्ल्यांचा समूह 2) तमिळनाडूतील एकमेव घटक 3) पॅरिस 2025 4) सांस्कृतिक", "q_english": "Match: a) Maratha Military Landscapes b) Gingee Fort c) 47th WHC session d) Heritage type — 1) Group of 12 forts 2) Only component in Tamil Nadu 3) Paris 2025 4) Cultural", "options": ["a-1, b-2, c-3, d-4", "a-2, b-1, c-3, d-4", "a-1, b-2, c-4, d-3", "a-1, b-3, c-2, d-4"], "correct_index": 0, "explanation_marathi": "a-1, b-2, c-3, d-4 योग्य आहे कारण 2025 मध्ये 12 किल्ल्यांचा समूह (11 महाराष्ट्र+जिंजी) सांस्कृतिक श्रेणीत 47व्या सत्रात inscribе झाला. इतर पर्याय किल्ले-संख्या किंवा सत्र-शहर अदलाबदल करतात.", "evidence": "UNESCO 47th World Heritage Committee, Paris, July 2025: 'Maratha Military Landscapes of India' inscribed as India's 44th WHS; 12 forts (Salher, Shivneri, Lohagad, Khanderi, Raigad, Rajgad, Pratapgad, Suvarnadurg, Panhala, Vijaydurg, Sindhudurg + Gingee in TN); Category: Cultural."}, {"section": 3, "subtopic": "Viksit Bharat 2047 roadmap", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): विकसित भारत @2047 हे 1947 च्या स्वातंत्र्याच्या 100 व्या वर्षासाठीचे राष्ट्रीय व्हिजन आहे. कारण (R): याचे समन्वयन नीती आयोग करते व 'व्हॉइस ऑफ युथ' मोहिमेतून जनसहभाग घेतला गेला.", "q_english": "Assertion (A): Viksit Bharat @2047 is the national vision for the 100th year of independence in 1947. Reason (R): It is coordinated by NITI Aayog and public participation was secured through the 'Voice of Youth' campaign.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण नाही", "A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "A बरोबर (2047 = स्वातंत्र्याची 100 वर्षे), R बरोबर (नीती आयोग समन्वय, डिसेंबर 2023 व्हॉइस ऑफ युथ). पण R हे A च्या 'का' चे स्पष्टीकरण नाही, तर प्रक्रियेचे वर्णन आहे; त्यामुळे 'योग्य स्पष्टीकरण' असलेला पर्याय चूक.", "evidence": "PIB 11-Dec-2023 & NITI Aayog: Viksit Bharat @2047 vision for 100th year of independence (2047); NITI Aayog coordinating, 'Voice of Youth' campaign launched by PM to crowdsource ideas for the roadmap."}, {"section": 4, "subtopic": "Ambedkar Round Table 1930-32", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने तपासा: (I) आंबेडकर तिन्ही गोलमेज परिषदांना (1930, 1931, 1932) अस्पृश्यांचे प्रतिनिधी म्हणून उपस्थित होते. (II) त्यांच्या स्वतंत्र मतदारसंघाच्या मागणीला 16 ऑगस्ट 1932 च्या जातीय निवाड्याने मान्यता मिळाली. (III) पुना कराराने (सप्टेंबर 1932) स्वतंत्र मतदारसंघाऐवजी संयुक्त मतदारसंघात राखीव जागा स्वीकारल्या.", "q_english": "Examine: (I) Ambedkar attended all three Round Table Conferences (1930, 1931, 1932) as representative of the Depressed Classes. (II) His demand for separate electorates was accepted by the Communal Award of 16 Aug 1932. (III) The Poona Pact (Sept 1932) accepted reserved seats in joint electorates instead of separate electorates.", "options": ["केवळ I आणि II बरोबर", "I, II आणि III बरोबर", "केवळ II आणि III बरोबर", "केवळ I आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "आंबेडकर तिन्ही परिषदांत होते, जातीय निवाड्याने स्वतंत्र मतदारसंघ दिला, पुना कराराने तो रद्द करून राखीव जागा आणल्या. त्यामुळे तिन्ही विधाने सत्य; एक-दोनच विधाने घेणारे पर्याय अर्धसत्यावर आधारित आहेत.", "evidence": "B.R. Ambedkar, Writings and Speeches Vol.2; Communal Award 16 Aug 1932 (Ramsay MacDonald); Poona Pact 24 Sept 1932 text"}, {"section": 4, "subtopic": "Bajirao Peshwa campaigns", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (i) पालखेड-1728 (ii) बुंदेलखंड-1729 (iii) दिल्ली छापा-1737 (iv) भोपाळ-1738 यांच्या (a) मुंगी-शेगाव तहाने निजामाचा गनिमी काव्याने पराभव (b) बंगशविरुद्ध छत्रसालला मदत; मस्तानी विवाह पार्श्वभूमी (c) बादशहाला वाचवायला निजाम दक्षिणेतून दिल्लीला परतण्यास भाग पाडले (d) दुराहा सराय तह; माळवा मराठ्यांना — यांतील योग्य मेळ कोणता?", "q_english": "Match the pairs: (i) Palkhed-1728 (ii) Bundelkhand-1729 (iii) Delhi raid-1737 (iv) Bhopal-1738 with (a) Nizam defeated by guerrilla tactics; Treaty of Mungi-Shegaon (b) aid to Chhatrasal against Bangash (c) forced Nizam to rush back to Delhi (d) Treaty of Doraha Sarai; Malwa to Marathas — which combination is correct?", "options": ["i-a, ii-b, iii-c, iv-d", "i-a, ii-c, iii-b, iv-d", "i-d, ii-b, iii-c, iv-a", "i-a, ii-b, iii-d, iv-c"], "correct_index": 0, "explanation_marathi": "पालखेडमध्ये बाजीरावाने पुरवठा तोडून निजामाला शरण आणले (मुंगी-शेगाव), बुंदेलखंडात छत्रसालची सुटका केली, दिल्ली छाप्याने निजामाला उत्तरेकडे खेचले व भोपाळच्या वेढ्यानंतर दुराहा सरायने माळवा मिळवला. इतर पर्याय मोहिमांचा क्रम व तहांच्या जोड्या अदलाबदल करून संभ्रम निर्माण करतात.", "evidence": "Sardesai, New History of the Marathas Vol.II, pp.201-230; Grant Duff, History of the Mahrattas Vol.I Ch.17 — Palkhed/Mungi-Shegaon and Bhopal/Doraha Sarai treaties"}, {"section": 4, "subtopic": "British Ryotwari Maharashtra", "qtype": "कालक्रम लावा", "q_marathi": "दख्खनमधील रयतवारी उत्क्रांतीचा योग्य कालक्रम लावा: (A) एल्फिन्स्टनचा रयतवारी पुरस्कार अहवाल (B) प्रिंगल सर्वेक्षणाची अयशस्वी पद्धत (C) विंगेट-गोल्डस्मिड-डेव्हिडसन संयुक्त अहवाल व 30 वर्षीय धारा (D) दख्खन दंग्यांनंतर शेतकरी मदत कायदा", "q_english": "Arrange the evolution of Ryotwari in the Deccan in correct chronological order: (A) Elphinstone's Ryotwari report (B) Pringle survey failure (C) Wingate-Goldsmid-Davidson Joint Report and 30-year settlement (D) Deccan Agriculturists' Relief Act after Deccan Riots", "options": ["A-B-C-D", "B-A-C-D", "A-C-B-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "1819-20 एल्फिन्स्टनने रयतवारी स्वीकारली, 1824-28 प्रिंगलचा एकतर्फी सर्वे फसला, 1847 च्या संयुक्त अहवालाने शास्त्रीय सर्वेक्षण व 30 वर्षीय जमाबंदी आली, 1875 च्या दंग्यांनंतर 1879 चा कायदा. इतर क्रम सर्वेक्षण पद्धतींचा कार्यकारणसंबंध उलटवतात.", "evidence": "R. Kumar, Western India in the Nineteenth Century Ch.3; Joint Report 1847 (Bombay Survey System); Deccan Riots Commission Report 1878"}, {"section": 4, "subtopic": "Gandhi Dandi March 1930", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): गांधीजींनी सविनय कायदेभंगासाठी मिठाच्या कायद्याचे उल्लंघन निवडल्यामुळे ते आंदोलन जनआंदोलन बनले. कारण (R): मिठावरील कराचा बोजा प्रत्येक भारतीयावर पडत होता आणि लाहोर अधिवेशनातील (1929) पूर्ण स्वराज्य ठरावानंतरच्या 11 मागण्यांत मीठ कर रद्द करण्याची मागणी होती.", "q_english": "Assertion (A): Gandhiji's choice of violating the salt law made the Civil Disobedience Movement a mass movement. Reason (R): The salt tax burdened every Indian, and abolition of the salt tax was among the 11 demands raised after the Lahore Congress (1929) Purna Swaraj resolution.", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य आहे", "A असत्य, R सत्य आहे"], "correct_index": 0, "explanation_marathi": "मीठ ही दैनंदिन गरज असल्याने करभंगाने शेतकरी-शहरी सर्व स्तर एकवटले, म्हणून R हेच A चे खरे स्पष्टीकरण आहे. इतर पर्याय लाहोर ठरावाचा क्रम चुकवतात किंवा गांधी-आयर्विन कराराशी (1931) गल्लत करतात.", "evidence": "12 मार्च 1930 साबरमती–दांडी यात्रा (385 किमी/240 मैल, 78 अनुयायी); 6 एप्रिल 1930 रोजी दांडी येथे मिठा कायदा भंग; लाहोर अधिवेशन डिसेंबर 1929 पूर्ण स्वराज्य ठराव — NCERT आधुनिक भारत."}, {"section": 4, "subtopic": "Mahatma Phule Satyashodhak 1873", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) सत्यशोधक समाज स्थापना (b) 'गुलामगिरी' ग्रंथ (c) 'शेतकऱ्याचा आसूड' (d) 'सार्वजनिक सत्यधर्म' — वर्षांशी जुळवा.", "q_english": "Match the pairs: (a) Satyashodhak Samaj foundation (b) 'Gulamgiri' book (c) 'Shetkaryacha Asud' (d) 'Sarvajanik Satyadharma' — match with the years.", "options": ["a-1873, b-1873, c-1881, d-1889", "a-1875, b-1873, c-1881, d-1891", "a-1873, b-1872, c-1883, d-1889", "a-1874, b-1873, c-1881, d-1889"], "correct_index": 0, "explanation_marathi": "सत्यशोधक समाज 24 सप्टेंबर 1873, 'गुलामगिरी' 1873, 'शेतकऱ्याचा आसूड' 1881, 'सार्वजनिक सत्यधर्म' 1889 (मरणोत्तर) हेच बरोबर. इतर पर्यायांत 1872/1874/1875/1883/1891 ही जवळची पण चुकीची वर्षे घुसवली आहेत.", "evidence": "सत्यशोधक समाज स्थापना 24 सप्टेंबर 1873 पुणे; 'गुलामगिरी' जून 1873; 'शेतकऱ्याचा आसूड' 1881; 'सार्वजनिक सत्यधर्म' 1889 मरणोत्तर प्रकाशित — फुले चरित्र/राज्य पाठ्यपुस्तक."}, {"section": 4, "subtopic": "Rani Lakshmibai Jhansi 1858", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने विचारात घ्या: (I) गंगाधररावांच्या मृत्यूनंतर (1853) डलहौसीने दत्तक वारसा अमान्य करून झाशी खालसा केले. (II) 18 जून 1858 रोजी ग्वाल्हेरजवळ ह्यू रोजच्या फौजेशी लढताना राणी लक्ष्मीबाईंना वीरगती प्राप्त झाली. (III) झाशीनंतर राणींनी कानपूर येथे नानासाहेबांसोबत समांतर सरकार स्थापन केले.", "q_english": "Consider the statements: (I) After Gangadhar Rao's death (1853), Dalhousie annexed Jhansi rejecting the adopted heir under the Doctrine of Lapse. (II) Rani Lakshmibai died fighting Hugh Rose's forces near Gwalior on 18 June 1858. (III) After Jhansi's fall, she set up a parallel government at Kanpur with Nanasaheb.", "options": ["I, II आणि III सर्व सत्य", "फक्त I आणि II सत्य", "फक्त II आणि III सत्य", "फक्त I सत्य"], "correct_index": 1, "explanation_marathi": "खालसा धोरण (1853) व 18 जून 1858 ग्वाल्हेर ही तथ्ये बरोबर; पण (III) चुकीचे — झाशीनंतर राणी तात्या टोपेंसह ग्वाल्हेरकडे गेल्या, कानपूरचे नेतृत्व नानासाहेबांचे होते. म्हणून फक्त I व II सत्य.", "evidence": "Doctrine of Lapse अंतर्गत झाशी खालसा 1853 (गंगाधरराव मृत्यू 21 नोव्हेंबर 1853); झाशी पतन एप्रिल 1858; ग्वाल्हेरजवळ वीरगती 18 जून 1858 विरुद्ध ह्यू रोज — NCERT/महाराष्ट्र राज्य पाठ्यपुस्तक."}, {"section": 4, "subtopic": "Sambhaji Maharaj 1689", "qtype": "जोड्या लावा", "q_marathi": "योग्य जोड्या लावा: (a) बुधभूषणम् (b) वढू-तुलापूर (c) कवी कलश (d) नायिकाभेद. पर्याय: (i) शृंगारविषयक संस्कृत ग्रंथ (ii) संस्कृत राजनीतिग्रंथ (iii) छत्रपतींचे सल्लागार व सहबलीदान (iv) 11 मार्च 1689 चे बलिदानस्थळ.", "q_english": "Match correctly: (a) Budhbhushanam (b) Vadhu-Tulapur (c) Kavi Kalash (d) Nayikabheda with (i) Sanskrit erotic treatise (ii) Sanskrit polity text (iii) advisor and co-martyr (iv) martyrdom site 11 March 1689.", "options": ["a-ii, b-iv, c-iii, d-i", "a-i, b-iv, c-ii, d-iii", "a-ii, b-iii, c-iv, d-i", "a-iii, b-iv, c-ii, d-i"], "correct_index": 0, "explanation_marathi": "बुधभूषणम् हा राजनीतिपर ग्रंथ, नायिकाभेद हा शृंगारग्रंथ; वढू-तुलापूर हे औरंगजेबाने शिक्षा दिलेले वधस्थळ; कवी कलश हे सल्लागार म्हणून संभाजीसोबत मारले गेले. इतर पर्याय ग्रंथ-विषय अदलाबदल करतात.", "evidence": "Sambhaji's Budhbhushanam (Sanskrit manuscripts); Grant Duff - History of the Mahrathas Vol I; Maharashtra Gazetteer - Pune; Jadunath Sarkar - Aurangzeb"}, {"section": 4, "subtopic": "Samyukta Maharashtra movement 1960", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): राज्यपुनर्रचना आयोगाने (1953-55) मुंबईसह संयुक्त महाराष्ट्र नाकारून 1956 मध्ये द्विभाषिक मुंबई राज्य ठेवले. परिणाम (E): तीव्र आंदोलनानंतर 1 मे 1960 रोजी मुंबईसह महाराष्ट्र राज्य स्थापन झाले; यशवंतराव चव्हाण पहिले मुख्यमंत्री.", "q_english": "Cause (C): The SRC rejected Mumbai-inclusive Samyukta Maharashtra, retaining bilingual Bombay State (1956). Effect (E): After intense agitation, Maharashtra with Mumbai was formed on 1 May 1960; Y. B. Chavan became first CM.", "options": ["C व E दोन्ही सत्य, E हा C चा तार्किक परिणाम आहे", "C व E दोन्ही सत्य, पण E हा C चा परिणाम नाही", "C सत्य, E असत्य", "C असत्य, E सत्य"], "correct_index": 0, "explanation_marathi": "दोन्ही सत्य व कार्यकारण संबंध स्पष्ट: द्विभाषिक निर्णयाविरुद्ध संयुक्त महाराष्ट्र समितीचे आंदोलन (107 हुतात्मे) हेच 1960 च्या निर्मितीचे प्रत्यक्ष कारण. संबंध नाकारणारा पर्याय B चूक.", "evidence": "States Reorganisation Commission Report (1955); Y. D. Phadke - Politics and Language in Maharashtra; Maharashtra Legislature - Samyukta Maharashtra Smarak records; Government of Maharashtra Resolution 1 May 1960"}, {"section": 4, "subtopic": "Sant Dnyaneshwar Bhavarthadipika", "qtype": "कालक्रम लावा", "q_marathi": "ज्ञानेश्वरांच्या जीवनातील घटनांचा योग्य कालक्रम लावा: (A) आपेगाव येथे जन्म (B) भावार्थदीपिका (ज्ञानेश्वरी) रचना (C) अमृतानुभव रचना (D) आळंदी येथे संजीवन समाधी.", "q_english": "Arrange chronologically: (A) Birth at Apegaon (B) Composition of Bhavarthadipika (Dnyaneshwari) (C) Composition of Amrutanubhava (D) Sanjivan Samadhi at Alandi.", "options": ["A-B-C-D", "A-C-B-D", "B-A-D-C", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "जन्म 1275 → भावार्थदीपिका 1290 (वय 15, सुमारे 9000 ओव्या, गीतेवर मराठी टीका) → अमृतानुभव त्यानंतर → 1296 मध्ये समाधी. ज्ञानेश्वरीपूर्वी अमृतानुभव ठेवणारे पर्याय चूक.", "evidence": "Bhavarthadipika colophon (1290 CE / Shaka 1212); Bhandarkar Oriental Research Institute critical edition; Maharashtra Sahitya Parishad - Dnyaneshwar charitra"}, {"section": 4, "subtopic": "Shahu Maharaj 1902 reservation", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: (a) शाहू महाराजांचा राज्यारोहण (1894) (b) वेदोक्त प्रकरण (1900) (c) शासकीय नोकऱ्यांत मागासवर्गीयांसाठी 50% आरक्षण आदेश (26 जुलै 1902) (d) मोफत व सक्तीचे प्राथमिक शिक्षण (1917).", "q_english": "Arrange chronologically: (a) Accession of Shahu Maharaj (1894) (b) Vedokta controversy (1900) (c) 50% reservation order for backward classes in state jobs (26 July 1902) (d) Free and compulsory primary education (1917).", "options": ["a → b → c → d", "a → c → b → d", "b → a → c → d", "a → b → d → c"], "correct_index": 0, "explanation_marathi": "1894 राज्यारोहण → 1900 वेदोक्त संघर्ष → 26 जुलै 1902 आरक्षण आदेश → 1917 सक्तीचे शिक्षण हाच योग्य क्रम. इतर पर्याय वेदोक्त व आरक्षणाचा क्रम उलटवून किंवा 1917 नंतर 1902 ठेवून दिशाभूल करतात.", "evidence": "राज्यारोहण 1894; वेदोक्त प्रकरण 1900; 26 जुलै 1902 रोजी कोल्हापूर संस्थानात 50% राखीव जागा आदेश; 21 सप्टेंबर 1917 मोफत सक्तीचे प्राथमिक शिक्षण — शाहू चरित्र/महाराष्ट्र इतिहास."}, {"section": 4, "subtopic": "Shivaji coronation Raigad 1674", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "शिवाजी महाराजांच्या राज्याभिषेकाबाबत खालील विधाने विचारात घ्या: (I) 6 जून 1674 रोजी रायगडावर गागाभट्टांच्या हस्ते वैदिक पद्धतीने राज्याभिषेक झाला. (II) 'छत्रपती', 'शककर्ता', 'हैंदवधर्मोद्धारक' ही बिरुदे धारण करून राज्याभिषेक शक सुरू केला. (III) सप्टेंबर 1674 मध्ये निश्चलपुरी गोसावींच्या हस्ते दुसरा (तांत्रिक) राज्याभिषेक झाला. योग्य पर्याय निवडा:", "q_english": "Consider statements on Shivaji Maharaj's coronation: (I) On 6 June 1674, Vedic coronation at Raigad by Gagabhatta. (II) Titles 'Chhatrapati', 'Shakakarta' adopted; Rajyabhisheka Shaka era started. (III) Second (Tantric) coronation in Sept 1674 by Nishchalpuri Gosavi. Choose correct option:", "options": ["फक्त I आणि II बरोबर", "I, II आणि III बरोबर", "फक्त I आणि III बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "तीन्ही विधाने सत्य: 6 जून 1674 वैदिक राज्याभिषेक, बिरुदे व शक-गणना सुरू, आणि शाक्त पद्धतीचा दुसरा राज्याभिषेक (लोकमान्यतेनुसार विघ्ननिवारणासाठी). फक्त दोन विधाने निवडणारे पर्याय अपूर्ण आहेत.", "evidence": "Sabhasad Bakhar; Jadunath Sarkar - Shivaji and His Times; Maharashtra State Gazetteer - Raigad; Bharat Itihas Sanshodhak Mandal records on Rajyabhisheka Shaka"}, {"section": 4, "subtopic": "Subhash Chandra Bose Azad Hind", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना विचारात घ्या: (X) 1939 मध्ये काँग्रेस अध्यक्षपदाचा राजीनामा दिल्यानंतर सुभाषचंद्र बोस यांनी फॉरवर्ड ब्लॉकची स्थापना केली. (Y) 21 ऑक्टोबर 1943 रोजी सिंगापूर येथे आझाद हिंद सरकार स्थापन करून बोस यांनी 'दिल्ली चलो' घोषणा दिली. योग्य पर्याय निवडा.", "q_english": "Consider two concepts: (X) After resigning as Congress president in 1939, Subhas Chandra Bose founded the Forward Bloc. (Y) On 21 October 1943 at Singapore, Bose proclaimed the Azad Hind Government with the slogan 'Dilli Chalo'. Choose the correct option.", "options": ["X आणि Y दोन्ही सत्य; दोन्ही बोस यांच्या जहाल राष्ट्रवादाचे क्रमिक टप्पे आहेत", "X सत्य, Y असत्य — आझाद हिंद सरकार टोकियो येथे स्थापन झाले", "X असत्य — फॉरवर्ड ब्लॉक 1940 मध्ये स्थापन झाला; Y सत्य", "X आणि Y दोन्ही सत्य, परंतु परस्परांशी असंबंधित घटना आहेत"], "correct_index": 0, "explanation_marathi": "त्रिपुरीनंतर (1939) 3 मे 1939 रोजी फॉरवर्ड ब्लॉक आणि सिंगापूरमध्ये 21 ऑक्टोबर 1943 रोजी आझाद हिंद सरकार — दोन्ही सत्य व एकाच संघर्षमार्गाचे टप्पे. टोकियो/1940 ही दिशाभूल करणारी वर्षे-स्थळे चुकीची आहेत.", "evidence": "फॉरवर्ड ब्लॉक स्थापना 3 मे 1939; रासबिहारी बोस यांच्याकडून जुलै 1943 मध्ये INA नेतृत्व स्वीकार; आझाद हिंद सरकार 21 ऑक्टोबर 1943 सिंगापूर — Bipan Chandra, आधुनिक भारत."}, {"section": 4, "subtopic": "Tilak Home Rule League 1916", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): टिळकांची एप्रिल 1916 मधील होमरूल लीग महाराष्ट्र, कर्नाटक, मध्यप्रांत-वऱ्हाडपुरती मर्यादित राहिली. कारण (R): ॲनी बेझंटच्या सप्टेंबर 1916 मधील लीगशी झालेल्या समझोत्यानुसार कार्यक्षेत्र विभागून घेण्यात आले होते.", "q_english": "Assertion (A): Tilak's Home Rule League of April 1916 remained confined to Maharashtra, Karnataka, Central Provinces and Berar. Reason (R): An understanding with Annie Besant's League of September 1916 divided their spheres of work.", "options": ["A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "टिळकांनी आधी लीग स्थापून मर्यादित क्षेत्र राखले; बेझंटशी संघर्ष टाळण्यासाठी परस्पर समझोताने उर्वरित भारत तिच्याकडे दिला, म्हणून R हा A चा थेट खुलासा आहे. इतर पर्याय कार्यक्षेत्र विभागणीचा करार नाकारून वा स्पष्टीकरण संबंध तोडून संभ्रम करतात.", "evidence": "S. Wolpert, Tilak and Gokhale pp.210-225; N.C. Kelkar, Life of Tilak; Besant papers on Home Rule Leagues 1916 agreement"}, {"section": 4, "subtopic": "Varkari tradition Pandharpur", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): वारी परंपरेचा केंद्रबिंदू पंढरपूरचा विठ्ठल व आषाढी-कार्तिकी एकादशी आहे. कारण (R): नामदेवांनी ज्ञानेश्वरोत्तर काळात भागवत धर्माचा प्रसार केला व कीर्तन-वारीला संघटित भक्तिसंप्रदायाचे रूप दिले.", "q_english": "Assertion (A): The Wari tradition centres on Pandharpur's Vitthal and Ashadhi-Kartiki Ekadashi. Reason (R): Namdev spread the Bhagavata dharma after Dnyaneshwar and gave kirtan-wari an organised sectarian form.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A व R दोन्ही सत्य; नामदेवांचे कीर्तन-प्रचार व संतपरंपरा संघटन हेच पंढरपूर-केंद्रित वारीचे संस्थात्मक स्पष्टीकरण आहे. केवळ योगायोग मानणारा पर्याय B चूक.", "evidence": "Namdev Abhanga Gatha; S. G. Tulpule - Classical Marathi Literature; Maharashtra Gazetteer - Solapur (Pandharpur); Charlotte Vaudeville - Myths, Saints and Legends"}, {"section": 4, "subtopic": "Veer Savarkar Cellular Jail", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र करा: (X) सावरकरांना 1911 मध्ये दोन जन्मठेपांची (एकूण 50 वर्षे) शिक्षा होऊन अंदमानच्या सेल्युलर जेलमध्ये धाडले. (Y) तुरुंगात त्यांनी कैद्यांत साक्षरता-शुद्धी चळवळ चालवली व 'माझी जन्मठेप' नंतर लिहिले. यांवरील योग्य विश्लेषण कोणते?", "q_english": "Combine two concepts: (X) Savarkar was given two life sentences (50 years total) in 1911 and sent to Cellular Jail, Andaman. (Y) In jail he ran literacy-reform work among prisoners and wrote 'Majhi Janmathep' later. Which analysis is correct?", "options": ["X आणि Y दोन्ही सत्य; दीर्घ शिक्षेमुळेच कैदी-संघटन व नंतरचे आत्मचरित्रपर लेखन शक्य झाले; 1911 व 1913 चे अर्ज कायद्यातील सुटकेच्या तरतुदीचा वापर होते", "X असत्य (एकच जन्मठेप होती), Y सत्य; दया अर्जांमुळे शिक्षा पूर्ण रद्द झाली", "X सत्य, Y असत्य; 'माझी जन्मठेप' हा ग्रंथ अंदमानातच पूर्ण करून प्रकाशित केला", "X आणि Y दोन्ही सत्य, पण त्यांचा परस्परसंबंध नाही; कैद्यांतील कार्य बॅरिस्टर अर्जांमुळे थांबले"], "correct_index": 0, "explanation_marathi": "X मधील 50 वर्षांच्या शिक्षेमुळेच Y मधील दीर्घ कैदी-संघटन व नंतरचे आत्मचरित्रपर लेखन शक्य झाले; 1911 व 1913 चे अर्ज कायद्यातील सुटकेच्या तरतुदीचा वापर होते. इतर पर्याय शिक्षेचे स्वरूप, ग्रंथलेखनाचा काळ वा अर्जांचा अर्थ विपर्यास करतात.", "evidence": "V.D. Savarkar, Majhi Janmathep; Bombay High Court judgment 1911 (two life sentences); Cellular Jail records 1911-1921, transfer to Ratnagiri 1924"}, {"section": 5, "subtopic": "Ajanta-Ellora basalt geology", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): अजिंठा-वेरूळ लेणी सुमारे 6.6 कोटी वर्षांपूर्वीच्या दख्खन ट्रॅप बेसाल्ट प्रवाहात खोदली आहेत. कारण (R): जाड, संहत बेसाल्ट थर ठिसूळ स्कोरिया/टफापेक्षा स्थिर असल्याने लेणींसाठी निवडला गेला.", "q_english": "Assertion (A): Ajanta-Ellora caves are excavated in Deccan Trap basalt flows of ~66 mya. Reason (R): Thick, compact basalt layers were preferred for caves as they are more stable than friable scoria/tuff.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य (दख्खन बेसाल्ट) व R सत्य (संहत थर स्थिर) आणि R ने निवडीचे कारण स्पष्ट होते. इतर पर्याय R च्या स्पष्टीकरणात्मक संबंधाला किंवा तथ्याला चुकवतात.", "evidence": "GSI Memoir on Deccan Trap; NCERT Physical Geography Class XI - Deccan basalt ~66 mya"}, {"section": 5, "subtopic": "Bhimashankar wildlife sanctuary", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): भीमाशंकर अभयारण्य (पुणे जिल्हा) सह्याद्रीच्या पश्चिम उतारावरील सदाहरित अरण्यात असून महाराष्ट्राचा राज्यप्राणी शेकरू येथे आढळतो. परिणाम (E): भीमा नदीचा उगम व पश्चिम घाट जैवविविधता हॉटस्पॉटचे संरक्षण येथे साधते.", "q_english": "Cause (C): Bhimashankar Wildlife Sanctuary (Pune district) lies in evergreen forests on the western slope of the Sahyadri and is home to the Shekru (Indian giant squirrel), the state animal of Maharashtra. Effect (E): The origin of the Bhima river and protection of the Western Ghats biodiversity hotspot are secured here.", "options": ["C व E दोन्ही सत्य; C मुळे E घडते", "C व E दोन्ही सत्य; परस्पर संबंध नाही", "C सत्य, E असत्य", "C असत्य, E सत्य"], "correct_index": 0, "explanation_marathi": "भीमाशंकर (1984, ~131 चौ.किमी, आंबेगाव-खेड) शेकरू अधिवास व भीमा उगमस्थान आहे; पश्चिम घाट हॉटस्पॉट संरक्षण हेच कारण-परिणाम नाते. 'शेकरू मेळघाटातील प्राणी' ही नेहमीची चूक.", "evidence": "Maharashtra Forest Department: Bhimashankar WLS (est. 1984, ~131 sq km, Pune district, Ambegaon-Khed) in Western Ghats; key habitat of Indian giant squirrel (Shekru, state animal of Maharashtra); origin of Bhima river; part of Western Ghats biodiversity hotspot."}, {"section": 5, "subtopic": "Deccan trap lava layers", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने: I) दख्खन ट्रॅपमध्ये अनेक बेसाल्ट प्रवाह एकावर एक थररूपात साचले आहेत. II) प्रवाहांमध्ये आंतर-ट्रॅपीय गाळाचे थर उद्रेकांतील खंड दर्शवतात. III) सर्व थर एकाच अखंड उद्रेकातून तयार झाले.", "q_english": "Statements: I) Deccan Trap comprises multiple basalt flows stacked layer upon layer. II) Intertrappean sedimentary beds between flows indicate eruptive pauses. III) All layers formed in a single continuous eruption.", "options": ["I व II सत्य, III असत्य", "I व III सत्य, II असत्य", "II व III सत्य, I असत्य", "I, II, III सर्व सत्य"], "correct_index": 0, "explanation_marathi": "I, II सत्य (स्तरित प्रवाह + आंतर-ट्रॅपीय खंड); III असत्य कारण उद्रेके टप्प्याटप्प्याने झाली. त्यामुळे फक्त पहिला पर्याय बरोबर, बाकी III ला सत्य मानून चुकतात.", "evidence": "GSI Deccan Volcanic Province bulletin; NCERT Geology - intertrappean beds"}, {"section": 5, "subtopic": "Godavari pollution Nashik", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा – (अ) नांदिनी नदी (ब) रामकुंड–तपोवन पट्टा (क) जैविक ऑक्सिजन मागणी (BOD) (ड) महाराष्ट्र प्रदूषण नियंत्रण मंडळ (MPCB). (1) नाशिकच्या औद्योगिक–नागरी सांडपाण्याने प्रदूषित गोदावरी उपनदी (2) नागरी सांडपाणी व धार्मिक निर्माल्याचा भार (3) नदी प्रदूषण मोजण्याचा निर्देशांक (4) सांडपाणी मानके लागू करणारी यंत्रणा.", "q_english": "Match – (A) Nandini river (B) Ramkund–Tapovan stretch (C) Biochemical Oxygen Demand (BOD) (D) MPCB. (1) Godavari tributary polluted by Nashik's industrial–domestic sewage (2) load of domestic sewage and religious offerings (3) index measuring river pollution (4) agency enforcing effluent standards.", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-4, ड-3", "अ-1, ब-3, क-2, ड-4", "अ-4, ब-2, क-1, ड-3"], "correct_index": 0, "explanation_marathi": "बरोबर: नांदिनी–MIDC/सांडपाणी, रामकुंड–निर्माल्य/सांडपाणी, BOD–प्रदूषण निर्देशांक, MPCB–मानके अंमलबजावणी. इतर चूक: नदी–स्रोत व संज्ञा–व्याख्या जोड्या अदलाबदल केलेल्या आहेत.", "evidence": "MPCB Godavari/Nandini water quality monitoring reports (Nashik); CPCB – BOD as river pollution indicator; MPCB consent and effluent standards framework"}, {"section": 5, "subtopic": "Konkan Alphonso belt", "qtype": "नकाशा आधारित", "q_marathi": "महाराष्ट्राच्या नकाशात कोकणातील हापूस (अल्फोन्सो) आंब्याचा GI मानांकित पट्टा उत्तरेकडून दक्षिणेकडे कोणत्या जिल्हाक्रमाने दाखवला जातो? (जांभी मृदा, उष्ण-दमट हवामान)", "q_english": "On the Maharashtra map, in which north-to-south district sequence is the GI-tagged Konkan Alphonso (Hapus) mango belt shown? (Laterite soil, warm-humid climate)", "options": ["पालघर–ठाणे–रायगड–रत्नागिरी–सिंधुदुर्ग", "ठाणे–पालघर–रायगड–सिंधुदुर्ग–रत्नागिरी", "रायगड–पालघर–ठाणे–रत्नागिरी–सिंधुदुर्ग", "पालघर–रायगड–ठाणे–सिंधुदुर्ग–रत्नागिरी"], "correct_index": 0, "explanation_marathi": "हापूसला 2018 मध्ये GI मानांकन मिळाले: रत्नागिरी, सिंधुदुर्ग, रायगड, पालघर, ठाणे. उत्तर-दक्षिण क्रम पालघर–ठाणे–रायगड–रत्नागिरी–सिंधुदुर्ग हाच बरोबर; इतर पर्यायांत जिल्हाक्रम अदलाबदल केला आहे.", "evidence": "Geographical Indications Registry, Chennai (2018): 'Alphonso' GI tag granted for Ratnagiri, Sindhudurg, Raigad, Palghar and Thane districts of Konkan; Devgad (Sindhudurg) and Ratnagiri Hapus are the core belt on lateritic soils."}, {"section": 5, "subtopic": "Krishna basin Maharashtra", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना X: कृष्णेचा उगम महाबळेश्वर (सातारा); महाराष्ट्रात सातारा–सांगली–कोल्हापूर व भीमा उपखोऱ्यात (सोलापूर–अहिल्यानगर–पुणे) विस्तार. संकल्पना Y: कोयना–वारणा–पंचगंगा या उजव्या तीरेच्या उपनद्या; भीमा ही डाव्या तीरेची प्रमुख उपनदी. दोन्ही एकत्रितपणे सुसंगत विधान कोणते?", "q_english": "Concept X: Krishna rises at Mahabaleshwar (Satara); in Maharashtra it spans Satara–Sangli–Kolhapur and the Bhima sub-basin (Solapur–Ahilyanagar–Pune). Concept Y: Koyna–Warna–Panchganga are right-bank tributaries; Bhima is the major left-bank tributary. Which statement is consistent with both?", "options": ["कृष्णा उगम महाबळेश्वर; कोयना कराड येथे व पंचगंगा नरसोबाची वाडीजवळ कृष्णेला मिळते; भीमा डाव्या तीरेची, उजनी धरण भीमेवर", "कृष्णा उगम त्र्यंबकेश्वर; कोयना डाव्या तीरेवर व भीमा उजव्या तीरेवर; कोयना धरण भीमेवर आहे", "कृष्णा उगम महाबळेश्वर; भीमा उजव्या तीरेवर कराड येथे मिळते; पंचगंगा डाव्या तीरेवर", "कृष्णा उगम भिमाशंकर; वारणा डाव्या तीरेवर; उजनी धरण कृष्णेवर आहे"], "correct_index": 0, "explanation_marathi": "बरोबर: उगम–संगम–तीर (उजवा/डावा)–धरण या चारही कड्या जुळतात. इतर चूक: त्र्यंबकेश्वर/भिमाशंकर हे गोदावरी/भीमेचे उगम; तीर व धरण–नदी जोड्या अदलाबदल केलेल्या आहेत.", "evidence": "Maharashtra Irrigation Dept – Krishna basin tributary map; India-WRIS Krishna basin report; Koyna and Ujjani dam project records"}, {"section": 5, "subtopic": "Lonar crater Buldhana", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "लोणार विवरासंदर्भात पुढील विधाने विचारात घ्या: I. हे सुमारे 50,000 वर्षांपूर्वी उल्कापातामुळे दख्खन ट्रॅपच्या बेसाल्ट खडकात निर्माण झालेले विवर आहे. II. लोणार सरोवराचे पाणी गोडे असून त्यातून पैनगंगा नदीचा उगम होतो. III. 2020 मध्ये लोणार सरोवराला रामसर पाणथळ स्थळाचा दर्जा मिळाला. योग्य पर्याय निवडा.", "q_english": "Consider the statements about Lonar crater: I. It is a crater formed ~50,000 years ago by meteorite impact in Deccan Trap basalt rock. II. Lonar lake has sweet water and is the origin of the Painganga river. III. Lonar lake got Ramsar wetland status in 2020. Choose the correct option.", "options": ["I, II आणि III बरोबर", "फक्त I आणि III बरोबर", "फक्त II आणि III बरोबर", "फक्त I बरोबर"], "correct_index": 1, "explanation_marathi": "विधान II चूक: लोणार सरोवर खाऱ्या-अल्कधर्मी (pH~10) पाण्याचे असून त्यास निर्गम मार्ग नाही; पैनगंगा उगम येथे नाही. I बरोबर (उल्कापात, बेसाल्ट) व III बरोबर (रामसर 2020). ज्वालामुखी विवर मानणे ही नेहमीची चूक.", "evidence": "Geological Survey of India: Lonar is a hyper-velocity meteorite impact crater in Deccan basalt (~1.8 km dia); Ramsar Sites Information Service: Lonar Lake designated Ramsar site Nov 2020; lake water saline-alkaline with no outlet."}, {"section": 5, "subtopic": "Mahabaleshwar rainfall 6000mm", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) महाबळेश्वर (b) आंबेनळी घाट (c) वाई (d) गगनबावडा — (1) प्रतिरोध (ओरोग्राफिक) पर्जन्य केंद्र (~6000 मिमी) (2) सह्याद्रीतील अतिवृष्टीचा घाटमार्ग (3) पर्जन्यछायेचा प्रदेश (4) कोल्हापूर जिल्ह्यातील अतिवृष्टी केंद्र.", "q_english": "Match the pairs: (a) Mahabaleshwar (b) Ambenali Ghat (c) Wai (d) Gaganbawda — (1) Orographic rainfall centre (~6000 mm) (2) High-rainfall ghat route in Sahyadri (3) Rain-shadow region (4) High-rainfall centre in Kolhapur district.", "options": ["a-1, b-2, c-3, d-4", "a-1, b-3, c-2, d-4", "a-2, b-1, c-3, d-4", "a-1, b-2, c-4, d-3"], "correct_index": 0, "explanation_marathi": "महाबळेश्वर वाऱ्यांसमोर (windward) असल्याने अरबी समुद्री मान्सूनपासून ~6000 मिमी प्रतिरोध पर्जन्य; वाई पूर्वेकडील पर्जन्यछायेत. आंबेनळी घाट अतिवृष्टी मार्ग, गगनबावडा कोल्हापूरचे अतिवृष्टी केंद्र. (b)-(c) अदलाबदल ही फसवणूक.", "evidence": "IMD climatological normals: Mahabaleshwar (Satara) avg annual rainfall ~6000 mm, orographic rainfall on windward side of Western Ghats from Arabian Sea branch of SW monsoon; Wai lies in leeward rain-shadow zone."}, {"section": 5, "subtopic": "Marathwada drought 2024-25", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): 2023 पाठोपाठ 2024 च्या नैऋत्य मान्सूनमध्येही मराठवाड्यात (बीड, धाराशिव, जालना, छ. संभाजीनगर) सरासरीपेक्षा 15–25% तूट व भूजल पातळीत 2–3 मीटर घट नोंदवली गेली. परिणाम (R): 2024-25 रब्बी पेरणी क्षेत्र घटले व उन्हाळ्यात टँकरने पाणीपुरवठा होणाऱ्या गावांत वाढ झाली. योग्य पर्याय निवडा.", "q_english": "Cause (A): After 2023, the 2024 southwest monsoon also ended 15–25% below normal in Marathwada (Beed, Dharashiv, Jalna, Chh. Sambhajinagar) with a 2–3 m fall in groundwater levels. Effect (R): Rabi sown area fell in 2024-25 and tanker-fed villages rose in summer. Choose the correct option.", "options": ["A व R दोन्ही सत्य; R हे A चा तार्किक परिणाम आहे", "A व R दोन्ही सत्य; परंतु R हा A चा परिणाम नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "बरोबर: सलग तूट → मृदा आर्द्रता, जलाशय व भूजल घट → रब्बी घट व टँकर वाढ; हा दोन-टप्पी कार्यकारणभाव जुळतो. इतर चूक: दोन्ही विधाने वस्तुस्थितीनुसार सत्य असल्याने एक असत्य मानणारे किंवा संबंध नाकारणारे पर्याय बाद.", "evidence": "IMD South-West Monsoon reports 2023, 2024 (Marathwada subdivision deficit); GSDA Maharashtra groundwater report 2024-25; Maharashtra Water Supply Dept tanker statistics, summer 2025"}, {"section": 5, "subtopic": "Mumbai coastal erosion", "qtype": "नकाशा आधारित", "q_marathi": "किनारी नकाशा पाहा: वर्सोवा–जुहू–माहीम पट्ट्यात भराव व वाळू-उत्खननानंतर किनारा समुद्राकडे नव्हे तर जमिनीकडे सरकत आहे. या ठिकाणची प्रमुख प्रक्रिया कोणती?", "q_english": "Observe coastal map: At Versova-Juhu-Mahim stretch, after reclamation and sand mining the shoreline is retreating landward. What is the dominant process here?", "options": ["ईशान्य मान्सून वाऱ्याने वाळूचे अंतर्देशीय स्थलांतर", "भरती-लाटा व किनारी बांधकाम/भरावामुळे बिघडलेल्या समतोलातून सागरी धूप", "तापी-नर्मदेच्या गाळ साचण्यातून त्रिभुज वाढ", "हिमयुगीन समुद्रपातळी घटून झालेली धूप"], "correct_index": 1, "explanation_marathi": "लाटा+भरती व मानवी भरावाने गाळ-समतोल बिघडून landward धूप होते, हे मुंबई किनाऱ्याचे वैशिष्ट्य आहे. इतर पर्याय वारा/त्रिभुज/हिमयुगीन कारणे येथे लागू नाहीत.", "evidence": "CWC Shoreline Change Assessment; NCERT Indian Physical Geography - coastal erosion"}, {"section": 5, "subtopic": "Mumbai local climate heat island", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): मुंबईत काँक्रीटीकरण, हरितक्षेत्र घट व वाहन-औद्योगिक उष्णता वाढली आहे. परिणाम (E): शहराचे रात्रीचे तापमान आसपासच्या माथेरान-अलिबागपेक्षा 2-4°C जास्त नोंदवले जाते.", "q_english": "Cause (C): Mumbai has high concretization, reduced green cover and vehicular-industrial heat. Effect (E): Night temperatures in the city are 2-4°C higher than surrounding Matheran-Alibaug.", "options": ["C सत्य, E सत्य आणि E हा C चा परिणाम आहे", "C सत्य, E सत्य परंतु E हा C चा परिणाम नाही", "C सत्य, E असत्य", "C असत्य, E सत्य"], "correct_index": 0, "explanation_marathi": "उष्णता बेट (heat island) सिद्धांताने C मधून E निष्पन्न होतो; निरीक्षणे याला पुष्टी देतात. इतर पर्याय कार्यकारण संबंध नाकारून किंवा तथ्य चुकवून भरकटवतात.", "evidence": "IMD Urban Climate reports; NCERT Human Geography - urban heat island"}, {"section": 5, "subtopic": "Narmada origin Amarkantak", "qtype": "कालक्रम लावा", "q_marathi": "नर्मदेच्या उगमापासून मुखापर्यंतचा योग्य पश्चिमवाह क्रम लावा: I) अमरकंटक (उगम, म.प्र.), II) जबलपूर-धुआंधार धबधबा, III) सरदार सरोवर धरण, IV) खंबायत आखात (मुख).", "q_english": "Arrange Narmada's course from origin to mouth westward: I) Amarkantak (origin, MP), II) Dhuandhar Falls near Jabalpur, III) Sardar Sarovar Dam, IV) Gulf of Khambhat (mouth).", "options": ["I → II → III → IV", "I → III → II → IV", "II → I → III → IV", "I → II → IV → III"], "correct_index": 0, "explanation_marathi": "नर्मदा अमरकंटकातून निघून भ्रंश दरीतून पश्चिमेकडे वाहते; धुआंधार वरच्या टप्प्यात, सरदार सरोवर खालच्या टप्प्यात, मुख खंबायत आखातात. अन्य क्रम प्रवाहदिशा चुकवतात.", "evidence": "Survey of India; NCERT Class IX Contemporary India - Narmada west-flowing rift valley"}, {"section": 5, "subtopic": "Sahyadri passes Thal-Bhor", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने पहा – (I) थळ घाट (कसारा घाट) नाशिक–ठाणे सीमेवर; मुंबई–भुसावळ रेल्वे व NH-160 याच घाटातून, इगतपुरी हे माथ्यावरील जंक्शन. (II) भोर घाट (खंडाळा) रायगड–पुणे सीमेवर; मुंबई–पुणे रेल्वे (कर्जत–लोणावळा) व NH-48 याच घाटातून. (III) थळ घाट भोर घाटाच्या दक्षिणेस आहे व दोन्ही घाट नदी-अपघर्षणाने तयार झाले. योग्य पर्याय?", "q_english": "Statements – (I) Thal Ghat (Kasara) on Nashik–Thane border; Mumbai–Bhusawal railway and NH-160 pass through it, Igatpuri the summit junction. (II) Bhor Ghat (Khandala) on Raigad–Pune border; Mumbai–Pune railway (Karjat–Lonavala) and NH-48 pass through it. (III) Thal Ghat lies south of Bhor Ghat and both ghats were formed by river erosion. Correct option?", "options": ["I, II, III सर्व बरोबर", "केवळ I व II बरोबर; III चूक", "केवळ II व III बरोबर; I चूक", "केवळ I व III बरोबर; II चूक"], "correct_index": 1, "explanation_marathi": "बरोबर: I–II मधील घाट–रेल्वे–महामार्ग जोड्या अचूक आहेत. III चूक: थळ घाट भोरच्या उत्तरेस आहे व हे दख्खन ट्रॅप कड्यावरील संरचनात्मक खिंडी आहेत, नदी-अपघर्षणाने नाही.", "evidence": "Survey of India topographical sheets; Central Railway – Igatpuri and Karjat-Lonavala ghat sections; NHAI NH-160/NH-48 alignments; GSI Deccan Trap geomorphology notes"}, {"section": 5, "subtopic": "Tadoba Andhari tiger reserve", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): ताडोबा-अंधारी व्याघ्र प्रकल्प चंद्रपूर जिल्ह्यात असून ताडोबा हे महाराष्ट्रातील सर्वांत जुने राष्ट्रीय उद्यान आहे. कारण (R): ताडोबा (1955) व अंधारी (1986) यांचे 1993 मध्ये एकत्रीकरण झाले; येथे दक्षिण उष्णकटिबंधीय शुष्क पानझडी (सागवान) वने आहेत.", "q_english": "Assertion (A): The Tadoba-Andhari Tiger Reserve is in Chandrapur district, and Tadoba is the oldest national park in Maharashtra. Reason (R): Tadoba (1955) and Andhari (1986) were merged in 1993; it has southern tropical dry deciduous (teak) forests.", "options": ["A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "ताडोबा राष्ट्रीय उद्यान (1955) महाराष्ट्रातील सर्वांत जुने; TATR 1993, चंद्रपूर, ~1727 चौ.किमी, सागवानप्रधान शुष्क पानझडी वने. R मधील कालक्रम व वनप्रकार A मधील 'सर्वांत जुने' दाव्याचे समर्थन करतात.", "evidence": "NTCA / Maharashtra Forest Dept: Tadoba National Park established 1955 (oldest in Maharashtra); Andhari WLS 1986; merged as Tadoba-Andhari Tiger Reserve 1993 in Chandrapur (~1727 sq km); vegetation southern tropical dry deciduous, teak-dominated."}, {"section": 5, "subtopic": "Vidarbha cotton belt", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा – (अ) यवतमाळ–अमरावती–अकोला : रेगूर मृदा, 75–100 सेमी पर्जन्य, पूर्णतः पावसावर आधारित कापूस (ब) नागपूर–वर्धा : रेगूर मृदा, कापूस–सोयाबीन–संत्रा मिश्र (क) गडचिरोली–चंद्रपूर : जांभी/तांबडी मृदा, 125+ सेमी पर्जन्य, भात–सागवान. विदर्भ कापूस पट्ट्याबाबत अचूक निष्कर्ष कोणता?", "q_english": "Consider the table – (A) Yavatmal–Amravati–Akola: regur soil, 75–100 cm rainfall, rainfed cotton (B) Nagpur–Wardha: regur soil, cotton–soybean–orange mix (C) Gadchiroli–Chandrapur: lateritic/red soil, 125+ cm rainfall, paddy–teak. Which inference on Vidarbha's cotton belt is accurate?", "options": ["अ, ब, क तिन्ही समान मुख्य कापूस पट्टा आहेत", "केवळ अ हाच मुख्य कापूस पट्टा; ब संक्रमित पट्टा, क भात–वन पट्टा", "केवळ क हाच मुख्य कापूस पट्टा; अ मध्ये ऊस प्रधान आहे", "अ मध्ये जांभी मृदा व भात प्रधान; क मध्ये रेगूर मृदा व कापूस प्रधान"], "correct_index": 1, "explanation_marathi": "बरोबर: पश्चिम विदर्भातील रेगूर + अल्प पर्जन्य हाच खरा कापूस पट्टा; पूर्वेकडे पर्जन्य वाढल्याने भात–वन पट्टा येतो. इतर चूक: क मध्ये 125+ सेमी पर्जन्यात कापूस प्रधान नाही; मृदा–पीक जोड्या अदलाबदल केलेल्या आहेत.", "evidence": "Maharashtra Economic Survey 2024-25 (Vidarbha crop pattern); Soil Survey of India – regur/laterite distribution; IMD district normal rainfall 1971-2020"}, {"section": 6, "subtopic": "Attorney General 76", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "महान्यायवादी (कलम 76) बाबत विधाने पहा: I. नियुक्ती राष्ट्रपती करतात, मर्जीत असेपर्यंत पद; सर्वोच्च न्यायालयाच्या न्यायाधीशाची पात्रता आवश्यक. II. दोन्ही सभागृहांत बोलण्याचा/कामकाजात भाग घेण्याचा (मतदानाविना) हक्क. III. मानधन संविधानाने निश्चित; खाजगी वकिलीस पूर्ण बंदी.", "q_english": "Regarding Attorney General (Art 76): I. Appointed by President, holds office during pleasure; qualified to be SC judge. II. Right to speak/participate in both Houses without vote. III. Salary fixed by Constitution; complete ban on private practice.", "options": ["I आणि II बरोबर, III चूक", "II आणि III बरोबर, I चूक", "I आणि III बरोबर, II चूक", "I, II, III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I व II कलम 76(1)(2) व 88 नुसार बरोबर आहेत. III चूक: मानधन राष्ट्रपती ठरवतात (76(4)) आणि खाजगी वकिलीवर सशर्त मर्यादा आहे, पूर्ण बंदी नाही.", "evidence": "भारतीय संविधान कलम 76(1), 76(4), कलम 88"}, {"section": 6, "subtopic": "CAG 148-151", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): कलम 148 नुसार CAG चे वेतन-सेवाशर्ती संसद ठरवते, पण नियुक्तीनंतर प्रतिकूल बदल करता येत नाही आणि हटवणे सर्वोच्च न्यायाधीशाप्रमाणे होते. परिणाम (R): CAG केंद्र व राज्यांच्या लेख्यांचे कार्यपालिकेच्या दबावाविना निष्पक्ष परीक्षण करतो.", "q_english": "Cause (A): Under Art 148, CAG's salary/conditions are fixed by Parliament but cannot be varied adversely after appointment and removal is like an SC judge. Effect (R): CAG audits Union/State accounts impartially without executive pressure.", "options": ["A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य, R असत्य.", "A असत्य, R सत्य."], "correct_index": 0, "explanation_marathi": "कलम 148(1) मधील पदसुरक्षा व वेतन-संरक्षणामुळेच स्वातंत्र्य मिळते, त्याचा थेट परिणाम निष्पक्ष लेखापरीक्षणात होतो. म्हणून R हे A चे योग्य स्पष्टीकरण आहे; इतर पर्याय कारण-परिणाम संबंध तोडतात.", "evidence": "भारतीय संविधान कलम 148(1), 148(3) परंतुक, 149-151"}, {"section": 6, "subtopic": "Directive Principles 36-51", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) कलम 44, (b) कलम 48A, (c) कलम 43B, (d) कलम 45 (86व्या दुरुस्तीनंतर) (i) समान नागरी संहिता, (ii) पर्यावरण संरक्षण, (iii) सहकारी संस्थांचे संवर्धन, (iv) बाल्यावस्थेतील संगोपन व शिक्षण योग्य जोडी निवडा:", "q_english": "Match: (a) Art 44 (b) Art 48A (c) Art 43B (d) Art 45 (after 86th Amendment) with (i) Uniform Civil Code (ii) Environment protection (iii) Promotion of cooperatives (iv) Early childhood care and education", "options": ["a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iii, d-iv", "a-i, b-ii, c-iv, d-iii", "a-iii, b-ii, c-i, d-iv"], "correct_index": 1, "explanation_marathi": "बरोबर: 44-UCC, 48A-पर्यावरण (42वी), 43B-सहकारी (97वी), 45-सुधारित बालसंगोपन (86वी) हे बरोबर आहे. इतर चूक: a-b किंवा c-d ची अदलाबदल केल्याने जोडी फसते; कलम व दुरुस्ती एकत्र लक्षात ठेवावी.", "evidence": "संविधान कलम 44, 48A, 43B, 45; 42वी, 86वी, 97वी घटना दुरुस्त्या; M. Laxmikanth - Directive Principles"}, {"section": 6, "subtopic": "Election Commission 324", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा: (a) नियुक्ती समिती – पंतप्रधान, विरोधी पक्षनेता, सरन्यायाधीश (b) कार्यकाळ – 6 वर्षे किंवा 65 वर्षे, जे आधी येईल (c) CEC पदच्युती – सर्वोच्च न्यायालयाच्या न्यायाधीशाप्रमाणे (d) कलम 324 अधिकार – निवडणुकांचे अधीक्षण, निर्देशन व नियंत्रण. तक्त्याबाबत योग्य निष्कर्ष कोणता?", "q_english": "See table: (a) Appointment committee – PM, Leader of Opposition, CJI (b) Tenure – 6 years or 65 years whichever earlier (c) CEC removal – like SC judge (d) Article 324 power – superintendence, direction and control of elections. What is correct conclusion?", "options": ["फक्त (a) चूक, (b)(c)(d) बरोबर", "सर्व जोड्या बरोबर", "फक्त (b) चूक, बाकी बरोबर", "फक्त (d) चूक, बाकी बरोबर"], "correct_index": 0, "explanation_marathi": "2023 कायद्यानुसार समितीत सरन्यायाधीश नाहीत; पंतप्रधान, विरोधी पक्षनेता व केंद्रीय मंत्री असतात, त्यामुळे (a) चूक. (b)(c)(d) बरोबर. (a) बरोबर धरणारे किंवा (b)/(c) चूक ठरवणारे पर्याय चूक.", "evidence": "Chief Election Commissioner and Other Election Commissioners (Appointment, Conditions of Service and Term of Office) Act, 2023 Sec.7 (selection committee); Art.324(2), 324(5) proviso (tenure and removal)"}, {"section": 6, "subtopic": "Fundamental Duties 51A", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या: (I) कलम 51A(a) नुसार संविधानाचे पालन करणे, राष्ट्रध्वज व राष्ट्रगीताचा आदर करणे हे मूलभूत कर्तव्य आहे. (II) कलम 51A(g) नुसार नैसर्गिक पर्यावरणाचे संरक्षण व प्राणिमात्रांवर दया करणे हे कर्तव्य 42व्या दुरुस्तीने (1976) समाविष्ट झाले. (III) कलम 51A(k) नुसार 6-14 वयोगटातील पाल्याला शिक्षणाची संधी देणे हे पालकांचे कर्तव्य 44व्या दुरुस्तीने जोडले गेले. योग्य पर्याय निवडा:", "q_english": "Consider: (I) Art 51A(a) - abide by Constitution, respect Flag and Anthem. (II) Art 51A(g) - protect environment, compassion for living creatures added by 42nd Amendment (1976). (III) Art 51A(k) - parent's duty to provide education to child aged 6-14 added by 44th Amendment. Choose correct:", "options": ["फक्त I आणि II बरोबर", "फक्त I आणि III बरोबर", "I, II आणि III सर्व बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "बरोबर: I, II सत्य आहेत; 51A(k) हे 86व्या दुरुस्तीने (2002) जोडले, 44व्याने नव्हे, त्यामुळे III चूक. इतर पर्याय चूक: III ला बरोबर मानणारे पर्याय दुरुस्ती-क्रमांकाच्या सूक्ष्म फरकामुळे बाद होतात.", "evidence": "भारताचे संविधान कलम 51A(a),(g),(k); 42वी घटना दुरुस्ती 1976, 86वी घटना दुरुस्ती 2002; M. Laxmikanth Indian Polity - Fundamental Duties"}, {"section": 6, "subtopic": "Fundamental Rights 12-35", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "कलम 25-28 (धर्मस्वातंत्र्य) आणि कलम 29-30 (सांस्कृतिक-शैक्षणिक हक्क) यांच्या एकत्रित आकलनावर आधारित योग्य विधान ओळखा.", "q_english": "Identify the correct statement combining Articles 25-28 (freedom of religion) and Articles 29-30 (cultural-educational rights).", "options": ["कलम 25(1) मधील सद्सद्विवेक स्वातंत्र्य लोकसुव्यवस्था, नीतिमत्ता व आरोग्याच्या अधीन आहे आणि कलम 29(1) कोणत्याही नागरिक गटाला भाषा, लिपी, संस्कृती जपण्याचा हक्क देतो.", "कलम 26 सर्व व्यक्तींना धार्मिक संप्रदाय स्थापण्याचा हक्क देतो आणि कलम 30 सर्व नागरिकांना शिक्षणसंस्था स्थापण्याचा हक्क देतो.", "कलम 25(1) निर्बंधरहित आहे आणि कलम 29(1) केवळ अल्पसंख्याकांना संस्कृती जपण्याचा हक्क देतो.", "कलम 27 धार्मिक कर सक्तीला परवानगी देते आणि कलम 30(1) बहुसंख्याकांना शिक्षणसंस्था स्थापण्याचा हक्क देतो."], "correct_index": 0, "explanation_marathi": "पहिला पर्याय बरोबर: 25(1) वर वाजवी निर्बंध आहेत व 29(1) सर्व गटांना लागू होतो. इतर चूक: 26 फक्त धार्मिक संप्रदायाला, 30 फक्त अल्पसंख्याकांना; 27 धार्मिक करास मनाई करतो.", "evidence": "भारतीय संविधान कलम 25(1), 26, 27, 29(1), 30(1)"}, {"section": 6, "subtopic": "Governor 153-162 powers", "qtype": "कालक्रम लावा", "q_marathi": "त्रिशंकू विधानसभा परिस्थितीत राज्यपालांच्या कृतींचा योग्य क्रम लावा: (A) सर्वात मोठ्या पक्ष/आघाडीच्या नेत्याला सरकार स्थापनेसाठी निमंत्रण (B) नियुक्त मुख्यमंत्र्यांचा शपथविधी (C) विधानसभेत बहुमत सिद्ध करण्याची मुदत देणे (D) बहुमत सिद्ध न झाल्यास कलम 356 चा अहवाल पाठवणे", "q_english": "Arrange Governor's actions in hung assembly in correct sequence: (A) Invite leader of largest party/alliance to form govt (B) Swearing-in of appointed CM (C) Give time to prove majority in Assembly (D) Send report under Art 356 if majority not proved", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "बरोबर: निमंत्रण → शपथ → बहुमत सिद्धीची संधी → अपयशानंतर 356 अहवाल हाच विवेकाधिकाराचा तार्किक क्रम. इतर चूक: शपथेआधी बहुमत चाचणी, नियुक्तीआधी शपथ किंवा चाचणीआधी 356 अहवाल हा घटनात्मक क्रमाला छेद देतो.", "evidence": "संविधान कलम 155, 159, 164, 356; सरकारिया आयोग; S.R. Bommai निर्णय 1994 - बहुमत चाचणी सभागृहातच"}, {"section": 6, "subtopic": "High Court 214-231", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): कलम 226 अंतर्गत उच्च न्यायालयाचा रिट अधिकार कलम 32 अंतर्गत सर्वोच्च न्यायालयापेक्षा व्यापक आहे. कारण (R): कलम 226 मूलभूत हक्कांबरोबर 'इतर प्रयोजनांसाठी'ही वापरता येते, तर कलम 32 फक्त मूलभूत हक्कांसाठी आहे. योग्य पर्याय निवडा.", "q_english": "Assertion (A): High Court's writ power under Article 226 is wider than Supreme Court's under Article 32. Reason (R): Article 226 can be invoked for fundamental rights and 'for any other purpose', while Article 32 is only for fundamental rights. Choose correct option.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A व R दोन्ही सत्य; R मधील 'इतर प्रयोजनांसाठी' हाच 226 च्या व्यापकतेचा आधार असल्याने R हे A चे अचूक स्पष्टीकरण आहे. स्पष्टीकरण नाकारणारे किंवा A/R चूक ठरवणारे पर्याय चुकीचे.", "evidence": "Constitution Articles 226 ('for any other purpose') vs 32; Supreme Court in Bandhua Mukti Morcha and Daryao v. State of U.P. on scope of 226"}, {"section": 6, "subtopic": "Inter-State Council 263", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) शिफारस करणारा आयोग, (b) स्थापना, (c) अध्यक्ष, (d) घटनात्मक आधार — (i) सरकारिया आयोग, (ii) 28 मे 1990 राष्ट्रपती आदेश, (iii) पंतप्रधान, (iv) कलम 263.", "q_english": "Match: (a) recommending commission, (b) establishment, (c) chairperson, (d) constitutional basis — (i) Sarkaria Commission, (ii) Presidential Order 28 May 1990, (iii) Prime Minister, (iv) Article 263.", "options": ["a-i, b-ii, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-iv, b-ii, c-iii, d-i", "a-i, b-ii, c-iv, d-iii"], "correct_index": 0, "explanation_marathi": "योग्य जोडी a-i, b-ii, c-iii, d-iv आहे; सरकारिया शिफारशीवरून 1990 मध्ये कलम 263 अन्वये परिषद स्थापन, अध्यक्ष पंतप्रधान. इतर पर्याय अध्यक्ष/आधार/वर्ष अदलाबदल करून फसवतात.", "evidence": "भारतीय संविधान कलम 263; सरकारिया आयोग अहवाल 1988; राष्ट्रपती आदेश 28.05.1990"}, {"section": 6, "subtopic": "Panchayati Raj 73rd amendment", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना विचारात घ्या: संकल्पना X (कलम 243E): पंचायतीचा कार्यकाळ प्रथम अधिवेशनापासून 5 वर्षे; मुदतपूर्व विसर्जन झाल्यास 6 महिन्यांत निवडणूक बंधनकारक, उर्वरित कालावधी 6 महिन्यांपेक्षा कमी असल्यास निवडणूक आवश्यक नाही. संकल्पना Y (कलम 243D): सर्व स्तरांवर SC/ST ना लोकसंख्याप्रमाणात व महिलांना अध्यक्षपदांसह किमान 1/3 आरक्षण अनिवार्य. योग्य पर्याय निवडा:", "q_english": "Two concepts: X (Art 243E): Panchayat term 5 years from first meeting; if dissolved early, election within 6 months mandatory, not required if remainder <6 months. Y (Art 243D): Reservation for SC/ST proportional to population and minimum 1/3 for women including chairpersons. Choose correct:", "options": ["X आणि Y दोन्ही बरोबर", "X बरोबर, Y चूक (महिला आरक्षण फक्त SC/ST महिलांसाठी)", "X चूक (निवडणूक 3 महिन्यांत), Y बरोबर", "X आणि Y दोन्ही चूक"], "correct_index": 0, "explanation_marathi": "बरोबर: X मधील 5 वर्षे व 6 महिन्यांची अट आणि Y मधील SC/ST प्रमाण + महिला 1/3 आरक्षण दोन्ही 73व्या दुरुस्तीप्रमाणे सत्य. इतर चूक: Y संकुचित करणे, 3 महिन्यांची खोटी मुदत किंवा दोन्ही नाकारणे तथ्यांशी विसंगत.", "evidence": "संविधान कलम 243D, 243E, 11वे परिशिष्ट (29 विषय); 73वी घटना दुरुस्ती 1992 (लागू 1993); M. Laxmikanth - Panchayati Raj"}, {"section": 6, "subtopic": "Parliamentary Committees PAC", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 1967 पासून लोकलेखा समितीचे (PAC) अध्यक्षपद विरोधी पक्षाच्या सदस्याकडे देण्याची परंपरा आहे. कारण (R): PAC ही CAG च्या अहवालांची छाननी करून कार्यपालिकेवर वित्तीय नियंत्रण ठेवते; सत्ताधारी अध्यक्ष असल्यास निष्पक्ष छाननी बाधित होईल.", "q_english": "Assertion (A): Since 1967, PAC chairmanship is conventionally given to an Opposition member. Reason (R): PAC scrutinises CAG reports for financial control over the executive; a ruling-party chair could impair impartial scrutiny.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "बरोबर: A सत्य (1967 पासूनची परंपरा), R सत्य व A चे तार्किक कारण स्पष्ट करते (वित्तीय उत्तरदायित्वासाठी विरोधी नियंत्रण). इतर चूक: B मध्ये स्पष्टीकरण नाकारले, C/D मध्ये एक विधान चूक ठरवले जे तथ्यांशी विसंगत आहे.", "evidence": "लोकसभा नियमावली; PAC रचना 22 (15 लोकसभा + 7 राज्यसभा), कार्यकाळ 1 वर्ष; 1967 परंपरा; CAG कलम 148-151; Laxmikanth - Parliamentary Committees"}, {"section": 6, "subtopic": "Preamble 42nd amendment", "qtype": "कालक्रम लावा", "q_marathi": "खालील घटनांचा योग्य कालक्रम लावा: (a) संविधान सभेने उद्देशिका स्वीकारली, (b) 42 व्या दुरुस्तीने 'समाजवादी, धर्मनिरपेक्ष, अखंडता' शब्द समाविष्ट, (c) नेहरूंनी उद्दिष्टांचा ठराव मांडला, (d) बोम्मई निकालात धर्मनिरपेक्षता मूलभूत संरचना ठरली.", "q_english": "Arrange chronologically: (a) Adoption of Preamble by Constituent Assembly, (b) 42nd Amendment adding 'Socialist, Secular, Integrity', (c) Nehru's Objectives Resolution, (d) Bommai verdict holding secularism as basic structure.", "options": ["c-a-b-d", "c-a-d-b", "a-c-b-d", "c-b-a-d"], "correct_index": 0, "explanation_marathi": "बरोबर क्रम c(13 डिसें 1946)-a(26 नोव्हें 1949)-b(1976, अमल 3 जाने 1977)-d(1994) आहे. इतर पर्याय b/d किंवा a/c चा क्रम चुकवतात; 42वी दुरुस्ती बोम्मईपूर्वी व ठराव उद्देशिकेपूर्वी आहे.", "evidence": "संविधान उद्देशिका; 42वी घटना दुरुस्ती 1976 कलम 2; S.R. Bommai vs Union of India 1994"}, {"section": 6, "subtopic": "President 52-62 election", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (A) कलम 54 (B) कलम 55 (C) कलम 60 (D) कलम 62 — (i) राष्ट्रपतींना सरन्यायाधीश शपथ देतात (ii) रिक्त पदाची पोटनिवडणूक 6 महिन्यांत (iii) निर्वाचकगणात फक्त निर्वाचित खासदार-आमदार (iv) एकल संक्रमणीय मताने प्रमाणशीर प्रतिनिधित्व", "q_english": "Match Articles with provisions: (A) Article 54 (B) Article 55 (C) Article 60 (D) Article 62 — (i) CJI administers oath to President (ii) by-election within 6 months of vacancy (iii) electoral college of only elected MPs-MLAs (iv) proportional representation by single transferable vote", "options": ["A-iii, B-iv, C-i, D-ii", "A-iii, B-iv, C-ii, D-i", "A-iv, B-iii, C-i, D-ii", "A-iii, B-i, C-iv, D-ii"], "correct_index": 0, "explanation_marathi": "कलम 54 मध्ये फक्त निर्वाचित सदस्य, 55 मध्ये STV पद्धत, 60 मध्ये CJI शपथ, 62 मध्ये 6 महिन्यांत पोटनिवडणूक. इतर पर्यायांत शपथ/रिक्तता किंवा 54/55 ची अदलाबदल केल्याने ते चूक ठरतात.", "evidence": "Constitution of India: Articles 54 (electoral college - elected members only), 55 (manner of election - PR by STV), 60 (oath by CJI), 62 (vacancy election within 6 months)"}, {"section": 6, "subtopic": "Supreme Court PIL", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने पहा: (I) S.P. गुप्ता वि. भारत संघ (1981) मध्ये न्या. P.N. भगवती यांनी जनहित याचिकेचा पाया घातला. (II) हुसेनारा खातून वि. बिहार (1979) मधील पत्रावरील सुनावणी PIL ची पूर्वपीठिका मानली जाते. (III) जनहित याचिका फक्त सर्वोच्च न्यायालयात कलम 32 अन्वये दाखल होते, उच्च न्यायालयात कलम 226 अन्वये नाही.", "q_english": "Consider: (I) Justice P.N. Bhagwati laid foundation of PIL in S.P. Gupta v. Union of India (1981). (II) Hearing on letter in Hussainara Khatoon v. Bihar (1979) is regarded as precursor of PIL. (III) PIL lies only in Supreme Court under Article 32, not in High Courts under Article 226.", "options": ["I, II बरोबर; III चूक", "I, III बरोबर; II चूक", "II, III बरोबर; I चूक", "I, II, III बरोबर"], "correct_index": 0, "explanation_marathi": "S.P. गुप्ता (1981) व हुसेनारा खातून (1979) ही PIL ची मान्य प्रस्थानस्थाने आहेत, त्यामुळे I, II सत्य. III असत्य, कारण PIL कलम 32 व कलम 226 दोन्हींतर्गत दाखल होते. त्यामुळे I-II बरोबर असलेलाच पर्याय योग्य.", "evidence": "S.P. Gupta v. Union of India (1981) AIR 1982 SC 149; Hussainara Khatoon v. State of Bihar (1979) AIR 1979 SC 1369; Constitution Articles 32 and 226"}, {"section": 6, "subtopic": "Vice President 63-71", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): कलम 66 नुसार उपराष्ट्रपती निवडणुकीत संसदेच्या दोन्ही सभागृहांचे सर्व सदस्य (निर्देशितांसह) मतदान करतात; राज्य विधानसभा सहभागी नसतात. परिणाम (E): उपराष्ट्रपती राज्यसभेचे पदसिद्ध सभापती असून राष्ट्रपतीपद रिक्त झाल्यास कार्यवाहक राष्ट्रपती होतात. C-E संबंध ओळखा.", "q_english": "Cause (C): Under Article 66, all members of both Houses of Parliament (including nominated) vote in Vice-Presidential election; State Assemblies do not participate. Effect (E): Vice-President is ex-officio Chairman of Rajya Sabha and acts as President during vacancy. Identify C-E relation.", "options": ["C व E दोन्ही सत्य, E हा C चा तार्किक परिणाम आहे", "C व E दोन्ही सत्य, पण E हा C चा परिणाम नाही", "C सत्य, E असत्य", "C असत्य, E सत्य"], "correct_index": 1, "explanation_marathi": "कलम 66 मधील निर्वाचकगण (निर्देशितांसह, राज्ये वगळून) सत्य; कलम 64/65 मधील सभापती व कार्यवाहक भूमिका सत्य. पण (E) हा (C) चा परिणाम नाही; दोन्ही स्वतंत्र तरतुदी आहेत, म्हणून इतर पर्याय चूक.", "evidence": "Constitution Articles 64 (ex-officio Chairman), 65 (acting as President), 66(1) (electoral college - members of both Houses including nominated, no State Legislatures)"}, {"section": 7, "subtopic": "Agriculture MSP crops", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): केंद्र सरकार रब्बी हंगामाच्या पेरणीपूर्वी गहू व हरभरा यांच्या किमान आधारभूत किमती (MSP) जाहीर करते. परिणाम (R): MSP जाहीर केल्याने शेतकऱ्यांना बाजारभाव घसरला तरी निश्चित दराची हमी मिळते. वरील कारण-परिणाम संबंधाबाबत योग्य पर्याय निवडा.", "q_english": "Cause (A): The central government announces Minimum Support Prices (MSP) for wheat and gram before the rabi sowing season. Effect (R): Announcing MSP guarantees farmers an assured price even if market prices fall. Choose the correct cause-effect relation.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य कारण आहे", "A आणि R दोन्ही बरोबर, परंतु R हे A चे योग्य कारण नाही", "A बरोबर पण R चूक", "A चूक पण R बरोबर"], "correct_index": 0, "explanation_marathi": "MSP हे CACP शिफारशीनुसार ठरलेले मजल दर (floor price) असून पेरणीपूर्वीच जाहीर होते, त्यामुळे R हेच A चे उद्दिष्ट-कारण आहे. इतर पर्याय चुकीचे कारण दोन्ही विधाने तथ्यतः बरोबर आहेत.", "evidence": "CACP-शिफारशीनुसार केंद्र सरकार पेरणीपूर्वी 22 अधिसूचित पिके (+ ऊसासाठी FRP) यांचे MSP जाहीर करते; MSP हे मजल दर म्हणून निश्चित दराची हमी देते."}, {"section": 7, "subtopic": "Bank Nationalisation 1969 1980", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना 1 (1969): 14 बँकांचे राष्ट्रीयीकरण; संकल्पना 2 (1980): 6 बँकांचे राष्ट्रीयीकरण. दोन्ही टप्प्यांबाबत योग्य संयुक्त विधान ओळखा.", "q_english": "Concept 1 (1969): Nationalisation of 14 banks; Concept 2 (1980): Nationalisation of 6 banks. Identify the correct combined statement about both phases.", "options": ["1969: ठेवी ≥50 कोटी, 14 बँका; 1980: ठेवी ≥200 कोटी, 6 बँका — दोन्हींचा उद्देश सामाजिक बँकिंग व प्राधान्य क्षेत्र पतविस्तार", "1969: ठेवी ≥200 कोटी, 14 बँका; 1980: ठेवी ≥50 कोटी, 6 बँका — दोन्हींचा उद्देश सामाजिक बँकिंग व प्राधान्य क्षेत्र पतविस्तार", "1969: ठेवी ≥50 कोटी, 6 बँका; 1980: ठेवी ≥200 कोटी, 14 बँका — दोन्हींचा उद्देश फक्त नफा वाढवणे", "1969: ठेवी ≥100 कोटी, 14 बँका; 1980: ठेवी ≥100 कोटी, 6 बँका — दोन्हींचा उद्देश चलनवाढ नियंत्रण"], "correct_index": 0, "explanation_marathi": "1969: 19 जुलै रोजी ठेवी 50 कोटींपेक्षा जास्त असलेल्या 14 बँका; 1980: 15 एप्रिल रोजी 200 कोटींपेक्षा जास्त ठेवींच्या 6 बँका. उद्देश सामाजिक बँकिंग होता. इतर पर्यायांत संख्या/मर्यादा अदलाबदल किंवा उद्देश चूक आहे.", "evidence": "RBI History: 19 July 1969 – 14 banks with deposits ≥Rs 50 crore; 15 April 1980 – 6 banks with deposits ≥Rs 200 crore nationalised for social banking/priority sector."}, {"section": 7, "subtopic": "Budget types", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): शून्य-आधारित अर्थसंकल्पात (Zero-Based Budgeting) प्रत्येक योजनेसाठी मागील खर्च विचारात न घेता नव्याने औचित्य सिद्ध करावे लागते. कारण (R): कामगिरी अर्थसंकल्प (Performance Budgeting) हा खर्चाच्या भौतिक उद्दिष्ट-साध्यतेवर भर देतो, त्यामुळे ZBB ची गरज उरत नाही. योग्य पर्याय निवडा:", "q_english": "Assertion (A): Under Zero-Based Budgeting, every scheme must justify itself afresh without considering past expenditure. Reason (R): Performance Budgeting focuses on physical target achievement of expenditure, so the need for ZBB does not remain. Choose the correct option:", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर पण R चूक", "A चूक पण R बरोबर"], "correct_index": 2, "explanation_marathi": "ZBB ची व्याख्या बरोबर — सर्व खर्च नव्याने औचित्यसिद्ध. पण R चूक: कामगिरी अर्थसंकल्प व ZBB वेगळ्या संकल्पना असून एक दुसऱ्याची गरज संपवत नाही; भारतात 1986-87 पासून ZBB प्रायोगिक वापर झाला. म्हणून A बरोबर R चूक.", "evidence": "शून्य-आधारित अर्थसंकल्प (पीटर पायर, 1970; भारतात 1986-87 मध्ये मर्यादित प्रयोग): प्रत्येक कार्यक्रमाचा खर्च शून्यापासून औचित्यसिद्ध; कामगिरी अर्थसंकल्प (1968 पासून भारतात) उद्दिष्ट-साध्यता मोजतो — दोन्ही पूरक, पर्यायी नाहीत."}, {"section": 7, "subtopic": "Fiscal deficit FRBM", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): FRBM आराखड्यानुसार केंद्राचे वित्तीय तूट लक्ष्य GDP च्या 3% आहे. कारण (R): एन.के. सिंग समितीने (2017) केंद्र+राज्य मिळून 60% कर्ज-GDP प्रमाण व 0.5% पर्यंत एस्केप क्लॉज शिफारस केली होती.", "q_english": "Assertion (A): Under FRBM framework Centre's fiscal deficit target is 3% of GDP. Reason (R): N.K. Singh Committee (2017) recommended 60% combined debt-GDP ratio and escape clause up to 0.5%.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A आणि R दोन्ही सत्य आहेत, पण R मधील कर्ज-प्रमाण व एस्केप क्लॉज हे 3% तूट लक्ष्याचे थेट स्पष्टीकरण नाही. म्हणून 'योग्य स्पष्टीकरण आहे' व एक सत्य-एक असत्य असलेले पर्याय चुकतात.", "evidence": "FRBM Act 2003 as amended; N.K. Singh Committee Report 2017 - 3% fiscal deficit, 60% debt (40+20), 0.5% escape clause"}, {"section": 7, "subtopic": "Five Year Plans 1951-2017", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने पहा: (I) दुसरी योजना (1956-61) पी.सी. महालनोबीस मॉडेलवर आधारित होती, अवजड उद्योगांवर भर होता. (II) 1966-69 'योजना सुट्टी' काळात तीन वार्षिक योजना राबवल्या गेल्या. (III) पाचवी योजना (1974-79) 'गरिबी हटाव'शी जोडली गेली व जनता सरकारने 1978 मध्ये मुदतपूर्व संपवली. योग्य पर्याय निवडा:", "q_english": "Consider: (I) Second Plan (1956-61) was based on P.C. Mahalanobis model with focus on heavy industries. (II) During Plan Holiday 1966-69 three Annual Plans were implemented. (III) Fifth Plan (1974-79) linked to 'Garibi Hatao' was terminated prematurely in 1978 by Janata Government. Choose correct:", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III सर्व बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "तीन्ही विधाने सत्य आहेत: दुसरी योजना महालनोबीस मॉडेल, 1966-69 योजना सुट्टी, पाचवी योजना 1978 मध्ये गुंडाळली गेली. त्यामुळे 'फक्त दोन' विधाने बरोबर सांगणारे पर्याय चुकतात.", "evidence": "Planning Commission 2nd Plan document (Mahalanobis model); Plan Holiday 1966-69 three Annual Plans; 5th Plan 1974-79 Garibi Hatao terminated 1978 - India Year Book, Economic Survey"}, {"section": 7, "subtopic": "GST 101st amendment", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (101वी दुरुस्ती, 2016): (A) कलम 246A - (1) केंद्र-राज्यांना GST लावण्याचा समवर्ती अधिकार; (B) कलम 269A - (2) आंतरराज्य GST (IGST) आकारणी व वाटप; (C) कलम 279A - (3) GST परिषदेची स्थापना; (D) कलम 268A - (4) 101वीने वगळले (सेवा कर). योग्य क्रम निवडा:", "q_english": "Match (101st Amendment, 2016): (A) Art 246A - (1) concurrent power to Union-States to levy GST; (B) Art 269A - (2) levy and apportionment of IGST; (C) Art 279A - (3) GST Council; (D) Art 268A - (4) omitted by 101st (service tax). Choose correct order:", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-3, D-4", "A-1, B-3, C-2, D-4", "A-1, B-2, C-4, D-3"], "correct_index": 0, "explanation_marathi": "योग्य जोड्या A-1, B-2, C-3, D-4 आहेत; 246A समवर्ती अधिकार, 269A IGST, 279A परिषद, 268A रद्द. इतर पर्यायांत 269A/279A ची अदलाबदल केली आहे म्हणून ते चूक.", "evidence": "Constitution 101st Amendment Act 2016 - Articles 246A, 269A, 279A inserted; Article 268A omitted"}, {"section": 7, "subtopic": "Industrial Policy 1991 LPG", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "नवीन औद्योगिक धोरण 1991 (LPG) बाबत विधाने: I. MRTP कायदा रद्द करून स्पर्धा कायदा 2002 आणला गेला. II. सार्वजनिक क्षेत्रासाठी राखीव उद्योग 17 वरून 8 करण्यात आले. III. सर्व उद्योगांसाठी परवाना पद्धती पूर्णपणे रद्द करण्यात आली. योग्य पर्याय निवडा:", "q_english": "Statements on the New Industrial Policy 1991 (LPG): I. The MRTP Act was abolished and replaced by the Competition Act 2002. II. Industries reserved for the public sector were reduced from 17 to 8. III. Licensing was abolished for all industries. Choose the correct option:", "options": ["फक्त I आणि II बरोबर", "फक्त I बरोबर", "I, II आणि III बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "MRTP रद्द व राखीव उद्योग 17→8 ही तथ्ये बरोबर, पण परवाना पद्धत पूर्णपणे रद्द झाली नाही (सुरुवातीला 18 मग 6 संवेदनशील उद्योगांत कायम). म्हणून III चूक, फक्त I व II बरोबर असलेला पर्याय योग्य.", "evidence": "औद्योगिक धोरण 1991: डिलायसेंसिंग, MRTP रद्द → स्पर्धा कायदा 2002, सार्वजनिक क्षेत्र राखीव 17 वरून 8 (नंतर 3, सध्या अणुऊर्जा-रेल्वे-द संरक्षणक्षेत्र), 6 संवेदनशील उद्योगांत परवाना अनिवार्य."}, {"section": 7, "subtopic": "Inflation CPI vs WPI", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) CPI-IW, ब) WPI, क) CPI-संयुक्त, ड) CPI-AL; 1) 2011-12 – आर्थिक सल्लागार कार्यालय/DPIIT, 2) 2012 – NSO, 3) 2016 – कामगार ब्युरो, 4) 1986-87 – कामगार ब्युरो. योग्य क्रम निवडा.", "q_english": "Match the pairs: a) CPI-IW, b) WPI, c) CPI-Combined, d) CPI-AL with 1) 2011-12 – Office of Economic Adviser/DPIIT, 2) 2012 – NSO, 3) 2016 – Labour Bureau, 4) 1986-87 – Labour Bureau. Choose correct code.", "options": ["अ-3, ब-1, क-2, ड-4", "अ-3, ब-2, क-1, ड-4", "अ-4, ब-1, क-2, ड-3", "अ-3, ब-1, क-4, ड-2"], "correct_index": 0, "explanation_marathi": "योग्य: अ-3 (CPI-IW 2016 कामगार ब्युरो), ब-1 (WPI 2011-12 DPIIT), क-2 (CPI-C 2012 NSO), ड-4 (CPI-AL 1986-87). इतर पर्याय आधार वर्ष/प्रकाशकाची अदलाबदल करतात, म्हणून चुकीचे.", "evidence": "Labour Bureau: CPI-IW base 2016; OEA-DPIIT: WPI base 2011-12; MOSPI-NSO: CPI (Rural/Urban/Combined) base 2012; Labour Bureau: CPI-AL/RL base 1986-87."}, {"section": 7, "subtopic": "Monetary Policy Repo Reverse", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): एप्रिल 2022 पासून SDF (Standing Deposit Facility) हा LAF कॉरिडॉरचा प्रभावी फ्लोअर बनला. परिणाम (E): अतिरिक्त तरलता शोषण्यासाठी रिव्हर्स रेपो दराची प्रासंगिकता घटली.", "q_english": "Cause (C): Since April 2022 SDF became the effective floor of LAF corridor. Effect (E): Relevance of reverse repo rate for absorbing surplus liquidity declined.", "options": ["C आणि E दोन्ही सत्य, E हा C चा योग्य परिणाम आहे", "C आणि E दोन्ही सत्य, E हा C चा योग्य परिणाम नाही", "C सत्य, E असत्य", "C असत्य, E सत्य"], "correct_index": 0, "explanation_marathi": "C आणि E दोन्ही सत्य; SDF फ्लोअर बनल्याने रिव्हर्स रेपोचे महत्त्व घटले, त्यामुळे E हा C चा तार्किक परिणाम आहे. परिणाम नाही वा एक असत्य सांगणारे पर्याय चुकतात.", "evidence": "RBI Monetary Policy Report April 2022 - introduction of SDF as floor of LAF corridor replacing reverse repo"}, {"section": 7, "subtopic": "NITI Aayog vs Planning Commission", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: (a) नियोजन आयोग - पंचवार्षिक योजना आखत असे, राज्यांना निधी वाटपाचा अधिकार होता. (b) NITI आयोग - 15-वर्षीय व्हिजन, 7-वर्षीय रणनीती, 3-वर्षीय कृती अजेंडा; निधी वाटपाचा अधिकार नाही. (c) नियोजन आयोग - सदस्य-सचिव पद होते; NITI आयोग - मुख्य कार्यकारी अधिकारी (CEO) पद आहे. कोणते बरोबर?", "q_english": "Table: (a) Planning Commission - formulated Five Year Plans, had fund allocation power to states. (b) NITI Aayog - 15-year Vision, 7-year Strategy, 3-year Action Agenda; no fund allocation power. (c) Planning Commission
