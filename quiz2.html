had Member-Secretary; NITI Aayog has CEO. Which are correct?", "options": ["a आणि b फक्त बरोबर", "b आणि c फक्त बरोबर", "a, b आणि c सर्व बरोबर", "a आणि c फक्त बरोबर"], "correct_index": 2, "explanation_marathi": "तीन्ही बरोबर: नियोजन आयोगाला निधी वाटप अधिकार होता, NITI ला नाही; NITI व्हिजन/रणनीती/अजेंडा चौकटीत काम करते; CEO हे NITI चे वैशिष्ट्य आहे. एक-दोन विधाने वगळणारे पर्याय अपूर्ण ठरतात.", "evidence": "NITI Aayog official site (niti.gov.in) - Differences with Planning Commission; Cabinet Resolution 1 Jan 2015"}, {"section": 7, "subtopic": "Poverty Tendulkar vs Rangarajan", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा (अहवाल वर्षानुसार): अ) अलघ समिती, ब) लकडावाला समिती, क) तेंडुलकर समिती, ड) रंगराजन समिती.", "q_english": "Arrange chronologically (by report year): a) Alagh Committee, b) Lakdawala Committee, c) Tendulkar Committee, d) Rangarajan Committee.", "options": ["अ, ब, क, ड", "अ, क, ब, ड", "ब, अ, क, ड", "अ, ब, ड, क"], "correct_index": 0, "explanation_marathi": "योग्य क्रम: अलघ (1979) → लकडावाला (1993) → तेंडुलकर (2009) → रंगराजन (2014). इतर पर्यायांत ब-क किंवा क-ड ची अदलाबदल आहे, त्यामुळे कालक्रम चुकतो.", "evidence": "Planning Commission: Alagh Committee 1979, Lakdawala Committee 1993, Tendulkar Committee Report 2009, Rangarajan Committee Report 2014."}, {"section": 7, "subtopic": "RBI functions", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) चलन निर्गमन (b) सरकारचा बँकर/प्रतिनिधी (c) बँकांचा बँक व शेवटचा कर्जदाता (d) परकीय चलन साठ्याचे व्यवस्थापन — पर्याय: (i) FEMA 1999 अंतर्गत (ii) सार्वजनिक कर्ज व्यवस्थापन (iii) ₹1 नाणे वगळता नोटा (iv) बँक दर धोरण. योग्य जोडी-गट निवडा:", "q_english": "Match the pairs: (a) Currency issue (b) Banker/agent to government (c) Bankers' bank and lender of last resort (d) Forex reserve management — Options: (i) under FEMA 1999 (ii) public debt management (iii) notes except ₹1 coin (iv) bank rate policy. Choose the correct set:", "options": ["a-iii, b-ii, c-iv, d-i", "a-i, b-iii, c-ii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-iv, b-ii, c-i, d-iii"], "correct_index": 0, "explanation_marathi": "₹1 नाण्याशिवाय चलन निर्गमन RBI; सार्वजनिक कर्ज व सरकारचे बँकिंग; बँक दराद्वारे शेवटचा कर्जदाता; FEMA अंतर्गत परकीय चलन व्यवस्थापन — हाच योग्य गट. इतर गटांत कार्ये चुकीच्या जोड्यांशी जोडली आहेत.", "evidence": "RBI कायदा 1934: ₹1 नाणी वगळता (केंद्रीय अर्थ मंत्रालय जारी करते) चलन निर्गमन; कलम 20-21 सरकारचा बँकर/प्रतिनिधी व सार्वजनिक कर्ज; बँक दराने पुनर्वित्त (lender of last resort); FEMA 1999 नुसार परकीय चलन साठ्याचे व्यवस्थापन."}, {"section": 7, "subtopic": "SEBI 1988 1992", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने: I) SEBI ची स्थापना 12 एप्रिल 1988 रोजी केंद्र सरकारच्या ठरावाने झाली, तेव्हा ती वैधानिक नव्हती. II) SEBI अधिनियम, 1992 द्वारे तिला 1992 मध्ये वैधानिक दर्जा मिळाला. III) तिचे पहिले अध्यक्ष एस. ए. दवे होते. योग्य पर्याय निवडा.", "q_english": "Statements: I) SEBI was set up on 12 April 1988 by Government resolution, then non-statutory. II) It got statutory status through SEBI Act, 1992 in 1992. III) Its first Chairman was S. A. Dave. Choose correct option.", "options": ["I, II आणि III सर्व बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I सत्य (1988 ठराव, बिगर-वैधानिक), II सत्य (1992 कायदा), III सत्य (दवे 1988-90 पहिले अध्यक्ष). त्यामुळे सर्व बरोबर; एक-दोन विधाने वगळणारे पर्याय अपूर्ण आहेत.", "evidence": "SEBI History: Established 12 April 1988 by executive resolution; statutory status via SEBI Act, 1992 (assented 4 April 1992); first Chairman S.A. Dave (1988-1990)."}, {"section": 7, "subtopic": "Service sector IT", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा: (a) STPI योजना — 1991, (b) IT-BPM महसुलाचे ~55% वाटा — सेवा निर्यात, (c) SEZ कायदा 2005 — सेवा क्षेत्रातील निर्यात चालना. तक्त्यातील जोड्या तपासून योग्य पर्याय निवडा:", "q_english": "Study the table: (a) STPI scheme — 1991, (b) ~55% share of IT-BPM revenue — services exports, (c) SEZ Act 2005 — boosting services exports. Examine the pairs and choose the correct option:", "options": ["a आणि b बरोबर, c चूक", "a, b आणि c सर्व बरोबर", "b आणि c बरोबर, a चूक", "फक्त c बरोबर"], "correct_index": 1, "explanation_marathi": "STPI 1991 मध्ये IT निर्यातीसाठी, IT-BPM महसुलाचा मोठा वाटा निर्यातीतून, आणि SEZ कायदा 2005 ने सेवा निर्यातीला चालना दिली — तिन्ही जोड्या बरोबर. त्यामुळे 'सर्व बरोबर' पर्याय योग्य, बाकीचे अंशतः असल्याने चूक.", "evidence": "Software Technology Parks of India (STPI) 1991 मध्ये IT/ITES निर्यातीसाठी स्थापन; IT-BPM महसुलाचा ~55% हून अधिक वाटा निर्यातीचा; SEZ कायदा 2005 सेवा निर्यातीस प्रोत्साहन देतो."}, {"section": 7, "subtopic": "Unemployment NSSO PLFS", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): PLFS ने 2017-18 पासून NSSO च्या पंचवार्षिक रोजगार-बेरोजगारी सर्वेक्षणाची जागा घेतली. कारण (R): PLFS शहरी भागासाठी त्रैमासिक व ग्रामीण+शहरीसाठी वार्षिक अंदाज देते, तर जुने EUS फक्त 5 वर्षांतून एकदाच होत असे.", "q_english": "Assertion (A): PLFS replaced NSSO's quinquennial Employment-Unemployment Survey from 2017-18. Reason (R): PLFS gives quarterly estimates for urban areas and annual estimates for rural+urban combined, whereas old EUS was only once in 5 years.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य (NSO ने PLFS एप्रिल 2017 पासून सुरू केला), R सत्य (त्रैमासिक शहरी + वार्षिक एकत्रित हीच नवीन पद्धत EUS पेक्षा वेगळी). R मुळे A का आला हे स्पष्ट होते. इतर पर्याय सत्यता वा स्पष्टीकरण संबंध चुकवतात.", "evidence": "MOSPI: Periodic Labour Force Survey launched April 2017, first annual report 2017-18; quarterly urban + annual rural/urban estimates, replacing NSSO quinquennial EUS."}, {"section": 8, "subtopic": "Acids bases pH", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): छातीतील जळजळ (अम्लपित्त) वर मॅग्नेशियम हायड्रॉक्साइड [Mg(OH)2] आराम देते. कारण (R): Mg(OH)2 हा दुर्बल आम्ल असल्याने जठरातील अतिरिक्त HCl चे उदासीनीकरण करून pH वाढवतो.", "q_english": "Assertion (A): Magnesium hydroxide [Mg(OH)2] relieves acidity/heartburn. Reason (R): Mg(OH)2, being a weak acid, neutralises excess HCl in the stomach and raises pH.", "options": ["A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य; परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 2, "explanation_marathi": "बरोबर: A सत्य — Mg(OH)2 (मिल्क ऑफ मॅग्नेशिया) प्रतिअम्ल म्हणून HCl चे उदासीनीकरण करते; R असत्य — Mg(OH)2 आम्ल नसून दुर्बल आम्लारी (base) आहे. चूक: R मधील 'दुर्बल आम्ल' हा शब्दप्रयोग चुकीचा असल्याने R युक्त स्पष्टीकरणे असलेले पर्याय बाद होतात.", "evidence": "NCERT Class 10 Science Ch.2 Acids, Bases and Salts – Antacids as mild bases neutralising excess stomach HCl; NCERT Class 7 Science Ch.5 Acids, Bases and Salts"}, {"section": 8, "subtopic": "Air atmosphere layers", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने : I-क्षोभांबरात उंचीबरोबर तापमान घटते व हवामान घडामोडी घडतात. II-समतापांबरात ओझोन UV शोषून तापमान उंचीबरोबर वाढवतो. III-आयनांबर स्वतंत्र थर नसून मध्यांबर+तापांबरातील विद्युतभारित भाग आहे. योग्य पर्याय निवडा.", "q_english": "Statements: I-Troposphere temperature decreases with height and weather phenomena occur. II-Stratosphere ozone absorbs UV raising temperature with height. III-Ionosphere is not an independent layer but ionized part of mesosphere+thermosphere. Choose correct option.", "options": ["फक्त I व II बरोबर", "फक्त II व III बरोबर", "I, II व III सर्व बरोबर", "फक्त I व III बरोबर"], "correct_index": 2, "explanation_marathi": "बरोबर: तिन्ही सत्य – क्षोभांबरात 6.5°C/km घट, समतापांबरात ओझोन उष्णता, आयनांबर D-E-F थर म्हणून स्थित. चूक: A, B, D मध्ये एक सत्य विधान वगळले आहे, त्यामुळे पर्याय अपूर्ण ठरतो.", "evidence": "NCERT Class VII Geography Ch.4 Air / Class XI Physical Geography – structure of atmosphere, stratospheric ozone heating, ionosphere as electrified region"}, {"section": 8, "subtopic": "Cell mitochondria", "qtype": "कारण-परिणाम", "q_marathi": "कारण: सायनाइडमुळे मायटोकॉन्ड्रियाच्या आतील पटलावरील सायटोक्रोम-c ऑक्सिडेज (कॉम्प्लेक्स-IV) अवरुद्ध होते. याचा पेशीश्वसनावर कोणता थेट परिणाम होईल?", "q_english": "Cause: Cyanide blocks cytochrome-c oxidase (Complex-IV) on the mitochondrial inner membrane. What is the direct effect on cellular respiration?", "options": ["O2 इलेक्ट्रॉन स्वीकारू न शकल्याने प्रोटॉन प्रवणता कोलमडून ATP सिंथेजद्वारे ATP निर्मिती थांबेल", "पेशीद्रव्यातील ग्लायकॉलिसिसमध्ये ग्लुकोजचे पायरुव्हेटमध्ये रूपांतर पूर्णपणे थांबेल", "मॅट्रिक्समधील क्रेब्स चक्रासाठी लागणारा CO2 पुरवठा खंडित होईल", "केंद्रकातील DNA प्रतिकृतीसाठी लागणारा रायबोज शर्करा पुरवठा थांबेल"], "correct_index": 0, "explanation_marathi": "बरोबर: कॉम्प्लेक्स-IV बंद झाल्यास इलेक्ट्रॉन O2 कडे जाऊ शकत नाही, आंतरपटल प्रोटॉन प्रवणता तयार होत नाही, त्यामुळे ATP सिंथेज थांबते. चूक: ग्लायकॉलिसिस पेशीद्रव्यात (विनाऑक्सिजन) चालते; क्रेब्स चक्र CO2 तयार करते, वापरत नाही; DNA प्रतिकृतीशी थेट संबंध नाही.", "evidence": "NCERT Class 11 Biology Ch.17 Breathing and Exchange / Ch.15 Plant Growth – Electron Transport System and oxidative phosphorylation; Complex-IV as terminal oxidase"}, {"section": 8, "subtopic": "Chemical bonding ionic covalent", "qtype": "कालक्रम लावा", "q_marathi": "फायान्स नियमानुसार आयनिक गुणधर्म वाढत्या क्रमाने (कमी ते जास्त) लावा : (a) NaCl (b) MgCl₂ (c) AlCl₃ (d) SiCl₄", "q_english": "Arrange in increasing order of ionic character as per Fajan's rules: (a) NaCl (b) MgCl2 (c) AlCl3 (d) SiCl4", "options": ["(d) < (c) < (b) < (a)", "(a) < (b) < (c) < (d)", "(c) < (d) < (a) < (b)", "(b) < (a) < (d) < (c)"], "correct_index": 0, "explanation_marathi": "बरोबर: धनायन प्रभार Si⁴⁺>Al³⁺>Mg²⁺>Na⁺ वाढता ध्रुवण शक्ती वाढते, सहसंयुज गुण वाढून आयनिक गुण घटतो. चूक: B पूर्ण उलटा क्रम आहे, C-D मध्ये Mg/Na व Al/Si यांची अदलाबदल केली आहे.", "evidence": "NCERT Class XI Chemical Bonding – Fajan's rules: higher cation charge → higher polarizing power → covalent character SiCl4 > AlCl3 > MgCl2 > NaCl"}, {"section": 8, "subtopic": "Electricity Ohm law", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): तांब्याच्या तारेचे तापमान वाढल्यास रोध वाढतो, त्यामुळे समान विद्युतदाबात प्रवाह कमी होतो. कारण (R): ओहम नियम (V=IR) केवळ स्थिर तापमानाच्या ओहमिक वाहकांना लागू होतो; डायोडसारख्या अन-ओहमिक घटकांत V-I सरळरेषीय नसतो. योग्य पर्याय निवडा:", "q_english": "Assertion (A): If temperature of a copper wire rises, its resistance increases, so current decreases at same voltage. Reason (R): Ohm's law (V=IR) holds only for ohmic conductors at constant temperature; for non-ohmic devices like diodes V-I is non-linear. Choose correct option:", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य (तापमान↑→रोध↑→I↓); R सत्य व ओहम नियमाच्या मर्यादा स्पष्ट करून A चे कारण देते. B मध्ये स्पष्टीकरण नाकारले म्हणून चूक; C/D एक विधान चूक ठरवतात.", "evidence": "NCERT Class 10 Ch.11 Electricity: V=IR, resistance increases with temperature in metals; ohmic vs non-ohmic conductors V-I graphs."}, {"section": 8, "subtopic": "Energy kinetic potential", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) जमिनीवर आदळण्यापूर्वीचा पडणारा चेंडू — 1) कमाल स्थितीज ऊर्जा ब) न सोडलेला ताणलेला धनुष्य — 2) कमाल गतिज ऊर्जा क) लंबकाचे उच्चतम टोक — 3) लवचिक स्थितीज साठवण ड) लाकडात अडकलेली गोळी — 4) गतिजचे उष्मा-ध्वनीत रूपांतर योग्य जुळणी निवडा:", "q_english": "Match the pairs: A) Falling ball just before hitting ground B) Stretched bow not released C) Bob at highest point of pendulum D) Bullet embedded in wood — with 1) Max potential energy 2) Max kinetic energy 3) Elastic potential storage 4) Kinetic converted to heat-sound. Choose correct matching:", "options": ["A-2, B-3, C-1, D-4", "A-2, B-1, C-3, D-4", "A-1, B-3, C-2, D-4", "A-2, B-3, C-4, D-1"], "correct_index": 0, "explanation_marathi": "पडणाऱ्या चेंडूत स्थितीज→गतिज (A-2); धनुष्यात लवचिक स्थितीज (B-3); लंबक टोकास स्थितीज कमाल (C-1); गोळी अडकताना गतिज→उष्मा/ध्वनी (D-4). इतर पर्यायांत एक-दोन जोड्या अदलाबदल केल्या आहेत.", "evidence": "NCERT Class 9 Ch.10 Work and Energy: KE=1/2mv², PE=mgh, elastic PE in stretched bow; energy transformation and dissipation on impact."}, {"section": 8, "subtopic": "Human heart circulation", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "मानवी हृदयाच्या दुहेरी अभिसरणाबाबत विधाने पहा: I. फुफ्फुसीय शिरा फुफ्फुसांकडून ऑक्सिजनित रक्त डाव्या कर्णिकेत आणते. II. उजव्या जवनिकेतून अशुद्ध रक्त फुफ्फुसीय धमनीने फुफ्फुसांकडे जाते. III. महाधमनीतून रक्त शरीराकडे जाताना प्रथम द्विदल (मिट्रल) झडप ओलांडते. योग्य पर्याय निवडा.", "q_english": "On human double circulation: I. Pulmonary vein brings oxygenated blood from lungs to left atrium. II. Right ventricle pumps deoxygenated blood via pulmonary artery to lungs. III. Blood entering aorta first crosses the mitral valve. Choose the correct option.", "options": ["I व II बरोबर, III चूक", "II व III बरोबर, I चूक", "I व III बरोबर, II चूक", "I, II व III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "बरोबर: फुफ्फुसीय शिरा (अपवाद: शिरा असूनही शुद्ध रक्त) व फुफ्फुसीय धमनी (अपवाद: धमनी असूनही अशुद्ध रक्त) यांचे कार्य I-II मध्ये अचूक आहे. चूक: मिट्रल झडप डावी कर्णिका-जवनिका यांमध्ये असते; महाधमनीच्या तोंडाशी अर्धचंद्राकृती झडप असते, म्हणून III चूक.", "evidence": "NCERT Class 11 Biology Ch.18 Body Fluids and Circulation – Double circulation, pulmonary vessels and heart valves"}, {"section": 8, "subtopic": "Magnetism electromagnet", "qtype": "कालक्रम लावा", "q_marathi": "विद्युतचुंबकत्वातील शोधांचा कालक्रम लावा: A) ओर्स्टेड – प्रवाहाभोवती चुंबकीय क्षेत्र B) अँपिअर – समांतर प्रवाहांतील बलनियम C) फॅराडे – विद्युतचुंबकीय प्रवर्तन D) मॅक्सवेल – विद्युतचुंबकीय तरंग समीकरणे योग्य क्रम निवडा:", "q_english": "Arrange the discoveries in electromagnetism chronologically: A) Oersted – magnetic field around current B) Ampere – force law between parallel currents C) Faraday – electromagnetic induction D) Maxwell – electromagnetic wave equations. Choose correct order:", "options": ["A → B → C → D", "B → A → C → D", "A → C → B → D", "A → B → D → C"], "correct_index": 0, "explanation_marathi": "ऐतिहासिक क्रम: ओर्स्टेड (1820) → अँपिअर (1820-21) → फॅराडे (1831) → मॅक्सवेल (1865). इतर पर्यायांत दोन टप्प्यांचा क्रम चुकवला आहे.", "evidence": "NCERT Class 10 Ch.12 Magnetic Effects of Electric Current: Oersted 1820, Ampere's law, Faraday's induction 1831; Maxwell's equations unifying electromagnetism 1865."}, {"section": 8, "subtopic": "Metals nonmetals", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): जस्त कॉपर सल्फेट द्रावणातून तांबे विस्थापित करते, पण चांदी जस्त सल्फेटमधून जस्त विस्थापित करू शकत नाही. कारण (R): क्रियाशीलता मालिकेत Zn>Cu>Ag असून अधिक क्रियाशील धातू कमी क्रियाशील धातू आयनाचे क्षपण करते.", "q_english": "Assertion (A): Zinc displaces copper from copper sulphate solution, but silver cannot displace zinc from zinc sulphate. Reason (R): In reactivity series Zn>Cu>Ag, more reactive metal reduces less reactive metal ion.", "options": ["A व R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण आहे", "A व R दोन्ही सत्य, पण R हे A चे स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "बरोबर: Zn वरील स्थानामुळे Cu²⁺ चे क्षपण शक्य, Ag खालील असल्याने Zn²⁺ चे क्षपण अशक्य; हेच विस्थापनाचे तत्त्व आहे. चूक: B मध्ये कार्यकारण संबंध नाकारता येत नाही, C-D मध्ये एक विधान चूक ठरवले आहे.", "evidence": "NCERT Class X Science Ch.3 Metals and Non-metals – reactivity series and displacement reactions: Zn + CuSO4 → ZnSO4 + Cu"}, {"section": 8, "subtopic": "Newton laws motion", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने पाहा: (I) जडत्व वस्तुमानाच्या समप्रमाणात असते; अवकाशातील वजनहीन अवस्थेतही जडत्व कायम राहते. (II) क्रिया-प्रतिक्रिया बले एकाच वस्तूवर कार्य करत असल्याने एकमेकांना निष्प्रभ करतात. (III) संवेग-अक्षय्यता हा न्यूटनच्या तिसऱ्या नियमाचा निष्कर्ष आहे; रॉकेट प्रणोदन हे त्याचे प्रात्यक्षिक आहे. योग्य पर्याय निवडा:", "q_english": "Consider statements: (I) Inertia is proportional to mass and persists even in weightlessness. (II) Action-reaction forces act on the same body and cancel each other. (III) Conservation of momentum follows from Newton's third law; rocket propulsion demonstrates it. Choose the correct option:", "options": ["I व II बरोबर, III चूक", "I व III बरोबर, II चूक", "II व III बरोबर, I चूक", "I, II व III सर्व बरोबर"], "correct_index": 1, "explanation_marathi": "II चूक: क्रिया-प्रतिक्रिया भिन्न वस्तूंवर कार्य करतात, त्यामुळे संतुलन होत नाही; I व III सत्य आहेत. म्हणून B बरोबर; इतर पर्याय चुकीच्या जोड्या देतात.", "evidence": "NCERT Class 9 Science Ch.8 Force and Laws of Motion: inertia ∝ mass, action-reaction act on different bodies; momentum conservation derived from third law, rocket propulsion example."}, {"section": 8, "subtopic": "Periodic table groups", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता : मूलद्रव्य (गट) – संयुजा e⁻ – ऑक्साइड स्वरूप : P-Na(1)-1-तीव्र आम्लारी, Q-Mg(2)-2-आम्लारी, R-Al(13)-3-उभयधर्मी, S-P(15)-5-आम्लधर्मी. या तक्त्याच्या आधारे गटधर्माबाबत कोणते विधान अचूक आहे?", "q_english": "Table: Element (Group) – valence e⁻ – oxide nature: P-Na(1)-1-strongly basic, Q-Mg(2)-2-basic, R-Al(13)-3-amphoteric, S-P(15)-5-acidic. Which statement about group properties is correct based on this table?", "options": ["P चा ऑक्साइड आम्लधर्मी असून S चा ऑक्साइड आम्लारी असतो", "R उभयधर्मी ऑक्साइड बनवतो व S सहसंयुज क्लोराइड बनवतो", "Q पेक्षा P ची विद्युतऋणता जास्त व अणुआकार लहान असतो", "गट 1 ते 15 कडे जाताना अणुआकार वाढतो व आयनन ऊर्जा घटते"], "correct_index": 1, "explanation_marathi": "बरोबर: Al₂O₃ उभयधर्मी असतो व PCl₃ सहसंयुज असतो; डावीकडून उजवीकडे धातूधर्म घटून अधातूधर्म वाढतो. चूक: A मध्ये ऑक्साइड स्वरूप उलटे, C मध्ये Na ची विद्युतऋणता कमी व आकार मोठा, D मध्ये आकार घटतो व आयनन ऊर्जा वाढते.", "evidence": "NCERT Class XI Chemistry Ch.3 Classification of Elements – valence = group number, oxide nature: Na2O basic, Al2O3 amphoteric, P2O5 acidic"}, {"section": 8, "subtopic": "Photosynthesis chlorophyll", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "हरितद्रव्य-a चे अभिक्रिया केंद्र (P680/P700) आणि पाण्याचे प्रकाशीय अपघटन (फोटोलिसिस/हिल अभिक्रिया) या दोन्ही संकल्पना एकत्रितपणे विचारात घेता कोणते विधान अचूक आहे?", "q_english": "Combining the chlorophyll-a reaction centre (P680/P700) and photolysis of water (Hill reaction), which statement is correct?", "options": ["P680 गमावलेले इलेक्ट्रॉन पाण्याच्या अपघटनातून भरून काढते, O2 मुक्त होतो; हरितद्रव्य-b व कॅरोटिनॉइड केवळ शोषण वर्णपट रुंदावतात", "P700 गमावलेले इलेक्ट्रॉन CO2 स्थिरीकरणातून भरून काढते, ग्लुकोज थेट मुक्त होतो; हरितद्रव्य-b हेच अभिक्रिया केंद्र असते", "P680 गमावलेले इलेक्ट्रॉन NADPH ऑक्सिडेशनमधून भरून काढते, ATP मुक्त होते; कॅरोटिनॉइड पाण्याचे विभाजन करते", "P700 गमावलेले इलेक्ट्रॉन हरितद्रव्य-b च्या अपघटनातून भरून काढते, CO2 मुक्त होतो; पाणी केवळ माध्यम असते"], "correct_index": 0, "explanation_marathi": "बरोबर: प्रकाशामुळे P680 इलेक्ट्रॉन गमावते, 2H2O → 4H+ + 4e- + O2 मधून इलेक्ट्रॉन भरपाई होते; सहाय्यक वर्णके ऊर्जा अभिक्रिया केंद्राकडे हस्तांतरित करतात. चूक: इतर पर्यायांत इलेक्ट्रॉन स्रोत, मुक्त वायू व वर्णकांचे कार्य परस्पर बदलले आहे.", "evidence": "NCERT Class 11 Biology Ch.13 Photosynthesis in Higher Plants – Reaction centre, Hill reaction and photolysis of water"}, {"section": 8, "subtopic": "Vitamins deficiency", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (अ) थायमिन (B1) (ब) नियासिन (B3) (क) एस्कॉर्बिक आम्ल (C) (ड) फायलोक्विनोन (K) — (i) स्कर्व्ही/हिरड्यांतून रक्तस्राव (ii) पेलाग्रा (iii) रक्त गोठण्यास विलंब (iv) बेरीबेरी", "q_english": "Match: (a) Thiamine (B1) (b) Niacin (B3) (c) Ascorbic acid (C) (d) Phylloquinone (K) — (i) Scurvy/bleeding gums (ii) Pellagra (iii) Delayed blood clotting (iv) Beriberi", "options": ["अ-iv, ब-ii, क-i, ड-iii", "अ-iv, ब-i, क-ii, ड-iii", "अ-ii, ब-iv, क-iii, ड-i", "अ-i, ब-ii, क-iii, ड-iv"], "correct_index": 0, "explanation_marathi": "बरोबर: B1→बेरीबेरी (मज्जा-स्नायू), B3→पेलाग्रा (3D), C→स्कर्व्ही (कॉलेजन/हिरड्या), K→प्रोथ्रॉम्बिनअभावी गोठण विलंब. चूक: इतर पर्यायांत C/K व B1/B3 यांच्या न्यूनता-विकारांच्या जोड्या अदलाबदल केल्या आहेत.", "evidence": "NCERT Class 11 Biology Ch.16 Digestion and Absorption – Table on vitamins, deficiency diseases and symptoms"}, {"section": 8, "subtopic": "Water H2O properties", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना I: H-बंधामुळे पाण्याचा स्फुटनांक (100°C) व पृष्ठताण उच्च असतो. संकल्पना II: 4°C ला पाण्याची घनता महत्तम, 0°C चे बर्फ कमी घनतेचे. दोन्ही एकत्रितपणे कोणता निष्कर्ष देतात?", "q_english": "Concept I: H-bonding gives water high boiling point (100°C) and surface tension. Concept II: Water has maximum density at 4°C; ice at 0°C is less dense. What combined conclusion follows?", "options": ["हिवाळ्यात तलाव पूर्ण गोठतो व तळाचे जीव मरतात", "बर्फ पाण्यावर तरंगते, तळाचे 4°C पाणी जलचरांना वाचवते", "पाणी सार्वत्रिक विद्रावक असल्याने बर्फ बुडते", "H-बंधामुळे बर्फाची घनता पाण्यापेक्षा जास्त होते"], "correct_index": 1, "explanation_marathi": "बरोबर: चतुष्फलकीय H-बंध जालामुळे बर्फ कमी घन होऊन तरंगतो; जड 4°C पाणी तळाशी राहून उष्णता राखते. चूक: A-C मध्ये गोठण/बुडणे उलटे दिले, D मध्ये बर्फ-पाणी घनता संबंध चूक आहे.", "evidence": "NCERT Class XI Chemistry Hydrogen – H-bonding, anomalous behaviour of water, maximum density at 4°C, ice floats"}, {"section": 8, "subtopic": "Wave sound light", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता (λ=v/f): P: ध्वनी, हवा, f=340 Hz, v=340 m/s Q: प्रकाश, निर्वात, f=6×10¹⁴ Hz, v=3×10⁸ m/s R: पराश्रव्य, पाणी, f=1 MHz, v=1480 m/s तरंगलांबीनुसार योग्य निष्कर्ष कोणता?", "q_english": "Table (λ=v/f): P: sound in air, f=340 Hz, v=340 m/s; Q: light in vacuum, f=6×10^14 Hz, v=3×10^8 m/s; R: ultrasound in water, f=1 MHz, v=1480 m/s. Which conclusion about wavelength is correct?", "options": ["λP > λR > λQ", "λR > λP > λQ", "λP > λQ > λR", "λQ > λR > λP"], "correct_index": 0, "explanation_marathi": "λP=1 m, λR=1.48 mm, λQ=500 nm; म्हणून P>R>Q. इतर पर्यायांत v/f उलटवून किंवा एकक चुकवून क्रम बदलला आहे.", "evidence": "NCERT Class 9 Ch.11 Sound: wave equation v=fλ; speed of sound 340 m/s in air, 1480 m/s in water; speed of light 3×10^8 m/s."}];let currentFilter='all';const sectionNames={3:"3. चालू घडामोडी",4:"4. इतिहास",5:"5. भूगोल",6:"6. राज्यशास्त्र",7:"7. अर्थशास्त्र",8:"8. सामान्य विज्ञान"};const filtersEl=document.getElementById('filters'),quizEl=document.getElementById('quiz'),progressEl=document.getElementById('progress');function renderFilters(){filtersEl.innerHTML='';const a=document.createElement('button');a.className='filter-btn'+(currentFilter==='all'?' active':'');a.textContent='सर्व (90)';a.onclick=()=>{currentFilter='all';renderFilters();renderQuiz()};filtersEl.appendChild(a);[3,4,5,6,7,8].forEach(s=>{const b=document.createElement('button');b.className='filter-btn'+(currentFilter===s?' active':'');b.textContent=sectionNames[s]+' (15)';b.onclick=()=>{currentFilter=s;renderFilters();renderQuiz()};filtersEl.appendChild(b)})}function renderQuiz(){const qs=QUESTIONS_C.filter(q=>currentFilter==='all'||q.section===currentFilter);progressEl.textContent='दाखवलेले प्रश्न: '+qs.length;quizEl.innerHTML='';qs.forEach((q,idx)=>{const card=document.createElement('div');card.className='qcard';const letters=['A','B','C','D'];let oh=q.options.map((op,i)=>'<div class="opt"><span class="opt-letter">'+letters[i]+'.</span><span>'+op.replace(/\n/g,'<br>')+'</span></div>').join('');card.innerHTML='<div class="qmeta"><span class="badge">'+sectionNames[q.section]+'</span><span class="badge type">'+(q.qtype||'')+'</span><span class="badge diff">कठीणता 5/5</span><span class="badge" style="background:#f3e5f5;color:#6a1b9a">'+(q.subtopic||'')+'</span></div><div class="qtext"><b>प्रश्न '+(idx+1)+'.</b> '+q.q_marathi.replace(/\n/g,'<br>')+'<span class="en">'+q.q_english.replace(/\n/g,'<br>')+'</span></div><div>'+oh+'</div><button class="show-ans">उत्तर पहा</button><div class="ansbox"><div class="correct">✅ योग्य उत्तर: '+letters[q.correct_index]+' – '+q.options[q.correct_index]+'</div><div class="expl"><b>स्पष्टीकरण:</b> '+q.explanation_marathi.replace(/\n/g,'<br>')+'</div><div class="evi">पुरावा: '+(q.evidence||'')+'</div></div>';quizEl.appendChild(card);const btn=card.querySelector('.show-ans'),box=card.querySelector('.ansbox');btn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा'};card.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected')}})})}renderFilters();renderQuiz();</script></body></html>
