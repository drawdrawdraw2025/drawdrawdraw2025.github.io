nasty rulers",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) गोपाल (b) धर्मपाल (c) देवपाल (d) महिपाल I — (i) विक्रमशिला विद्यापीठाची स्थापना (ii) पाल घराण्याचा संस्थापक (iii) ओदंतपुरी विहाराचा विस्तार (iv) बंगालमधील पाल सत्तेचे पुनरुत्थान",q_english:"Match: (a) Gopala (b) Dharmapala (c) Devapala (d) Mahipala I — (i) Founded Vikramashila University (ii) Founder of Pala dynasty (iii) Expanded Odantapuri Vihara (iv) Revived Pala power in Bengal",options:["a-ii, b-i, c-iii, d-iv","a-ii, b-iii, c-i, d-iv","a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-ii, d-iv"],correct_index:0,explanation_marathi:"गोपाल (750) संस्थापक, धर्मपाल याने विक्रमशिला स्थापन केले, देवपाल याने ओदंतपुरीचा विस्तार केला आणि महिपाल I याने पाल सत्तेचे पुनरुत्थान केले."},{section:3,subtopic:"South Indian dynasties chronology",qtype:"कालक्रम",q_marathi:"खालील सत्तांचा कालक्रमानुसार योग्य क्रम लावा: (a) चोल साम्राज्याचा उत्कर्ष (b) विजयनगर साम्राज्याची स्थापना (c) पल्लव काळातील महाबलीपुरम शिल्पकला (d) राष्ट्रकूट सत्ता",q_english:"Arrange chronologically: (a) Peak of Chola Empire (b) Founding of Vijayanagara Empire (c) Pallava Mahabalipuram sculpture (d) Rashtrakuta power",options:["c-d-a-b","d-c-a-b","c-a-d-b","a-c-d-b"],correct_index:0,explanation_marathi:"पल्लव (6-9वे शतक), राष्ट्रकूट (8-10वे), चोल उत्कर्ष (9-13वे), विजयनगर (1336). त्यामुळे c-d-a-b हा बरोबर क्रम आहे."},{section:3,subtopic:"Second Battle of Tarain 1192",qtype:"विधान-कारण",q_marathi:"विधान (A): तराईनच्या दुसऱ्या लढाईत (1192) पृथ्वीराज चौहान यांचा पराभव झाला. कारण (R): मुहम्मद घोरी याने यावेळी प्रचंड घोडदळाच्या वेगवान हल्ल्याची रणनीती वापरली.",q_english:"Assertion (A): Prithviraj Chauhan was defeated in the Second Battle of Tarain (1192). Reason (R): Muhammad Ghori used a swift cavalry-heavy attack strategy this time.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. 1191 च्या पराभवानंतर घोरी 1,20,000 घोडदळासह परतला आणि पृथ्वीराजच्या हत्तीदलाचा पराभव केला."},{section:3,subtopic:"Qutb-ud-din Aibak",qtype:"बहु-विधान",q_marathi:"कुतुबुद्दीन ऐबकबाबत: (I) उदारतेमुळे त्याला 'लाख बक्ष' म्हटले जाई. (II) त्याने अजमेर येथे 'अढाई दिन का झोपडा' बांधला. (III) 1210 मध्ये लाहोर येथे चौगान (पोलो) खेळताना मृत्यू झाला.",q_english:"About Qutb-ud-din Aibak: (I) Called 'Lakh Baksh' for generosity. (II) Built 'Adhai din ka Jhonpra' at Ajmer. (III) Died in 1210 at Lahore playing chaugan (polo).",options:["I आणि II फक्त / I and II only","II आणि III फक्त / II and III only","I, II आणि III / I, II and III","I आणि III फक्त / I and III only"],correct_index:2,explanation_marathi:"तिन्ही विधाने बरोबर आहेत. ऐबक हा गुलाम घराण्याचा संस्थापक; उदारता, अजमेरची मशिद आणि पोलो खेळताना घोड्यावरून पडून मृत्यू या तीनही गोष्टी प्रसिद्ध आहेत."},{section:3,subtopic:"Firoz Shah Tughlaq works",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — फिरोजशाह तुघलक: (a) दिवान-ए-खैरात (b) फतेहाबाद (c) जौनपूर शहराची स्थापना (d) पाश्चात्य यमुना कालवा — (i) दान/कल्याण विभाग (ii) हरियाणातील शहर (iii) शर्की सत्तेचे पुढील केंद्र (iv) सिंचनासाठी कालवा",q_english:"Match — Firoz Shah Tughlaq: (a) Diwan-i-Khairat (b) Fatehabad (c) Founded Jaunpur city (d) Western Yamuna Canal — (i) Charity department (ii) City in Haryana (iii) Later Sharqi power center (iv) Canal for irrigation",options:["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-i, b-iii, c-ii, d-iv","a-iv, b-ii, c-iii, d-i"],correct_index:0,explanation_marathi:"दिवान-ए-खैरात हा गरीब मुस्लिमांसाठी कल्याण विभाग, फतेहाबाद हरियाणात, जौनपूर त्याने वसवले (पुढे शर्कींची राजधानी) आणि पाश्चात्य यमुना कालवा सिंचनासाठी खोदला."},{section:3,subtopic:"Lodi dynasty chronology",qtype:"कालक्रम",q_marathi:"लोदी घराण्यातील सुलतानांचा कालक्रम लावा: (a) बहलोल लोदी (b) सिकंदर लोदी (c) इब्राहिम लोदी",q_english:"Arrange Lodi sultans chronologically: (a) Bahlol Lodi (b) Sikandar Lodi (c) Ibrahim Lodi",options:["a-b-c","b-a-c","c-b-a","a-c-b"],correct_index:0,explanation_marathi:"बहलोल लोदी (1451-1489) संस्थापक, सिकंदर लोदी (1489-1517, आग्रा 1504 मध्ये स्थापन) आणि इब्राहिम लोदी (1517-1526, पानिपतच्या पहिल्या लढाईत मृत्यू). क्रम a-b-c."},{section:3,subtopic:"Chishti Sufi order",qtype:"विधान-कारण",q_marathi:"विधान (A): चिश्ती सिलसिला हा भारतातील सर्वात लोकप्रिय सूफी पंथ ठरला. कारण (R): मुईनुद्दीन चिश्ती, निझामुद्दीन औलिया यांसारख्या संतांनी सर्व धर्मीयांना आकर्षित केले आणि सत्तेपासून अंतर ठेवले.",q_english:"Assertion (A): The Chishti order became the most popular Sufi silsila in India. Reason (R): Saints like Moinuddin Chishti and Nizamuddin Auliya attracted all communities and kept distance from power.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. चिश्ती संतांची सर्वसमावेशकता आणि सत्तेपासूनचे अंतर हेच त्यांच्या लोकप्रियतेचे कारण होते."},{section:3,subtopic:"Kabir Nirguna bhakti",qtype:"बहु-विधान",q_marathi:"कबीर यांच्याबाबत: (I) ते निर्गुण भक्ती परंपरेचे संत होते. (II) त्यांचे दोहे 'बीजक' मध्ये संग्रहित आहेत. (III) त्यांनी हिंदू-मुस्लिम दोन्ही कर्मकांडांवर टीका केली.",q_english:"About Kabir: (I) He was a Nirguna bhakti saint. (II) His dohas are compiled in 'Bijak'. (III) He criticized ritualism of both Hindus and Muslims.",options:["I आणि II फक्त / I and II only","I आणि III फक्त / I and III only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only"],correct_index:2,explanation_marathi:"तिन्ही बरोबर. कबीर निर्गुण परंपरेचे, बीजक हा त्यांच्या वचनांचा संग्रह आणि दोन्ही धर्मांच्या बाह्याचारांवर त्यांनी प्रखर टीका केली."},{section:3,subtopic:"Mughal painting schools",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) अकबर काळ (b) जहांगीर काळ (c) शाहजहान काळ — (i) निसर्गचित्रणाचा सुवर्णकाळ (ii) हम्झानामा, तुतीनामा (iii) चित्रकलेचा ऱ्हास, स्थापत्यकलेकडे कल",q_english:"Match: (a) Akbar period (b) Jahangir period (c) Shah Jahan period — (i) Golden age of naturalism (ii) Hamzanama, Tutinama (iii) Decline of painting, shift to architecture",options:["a-ii, b-i, c-iii","a-i, b-ii, c-iii","a-ii, b-iii, c-i","a-iii, b-i, c-ii"],correct_index:0,explanation_marathi:"अकबर काळात हम्झानामा सारखे मोठे प्रकल्प, जहांगीर काळात निसर्गचित्रण (उस्ताद मन्सूर) शिखरावर आणि शाहजहान काळात स्थापत्यकलेकडे (ताजमहाल) कल वाढला."},{section:3,subtopic:"Socio-religious reform chronology",qtype:"कालक्रम",q_marathi:"खालील सुधारणा चळवळींचा कालक्रम लावा: (a) आर्य समाजाची स्थापना (b) थियोसॉफिकल सोसायटीची स्थापना (c) रामकृष्ण मिशनची स्थापना (d) MAO कॉलेज (अलिगढ) ची स्थापना",q_english:"Arrange chronologically: (a) Founding of Arya Samaj (b) Founding of Theosophical Society (c) Founding of Ramakrishna Mission (d) Founding of MAO College (Aligarh)",options:["a-b-d-c","b-a-d-c","a-d-b-c","d-a-b-c"],correct_index:0,explanation_marathi:"आर्य समाज (1875, मुंबई), थियोसॉफिकल सोसायटी (1875, न्यूयॉर्क), MAO कॉलेज (1875, अलिगढ) आणि रामकृष्ण मिशन (1897, बेलूर). क्रम a-b-d-c."},{section:3,subtopic:"Arya Samaj Dayanand",qtype:"विधान-कारण",q_marathi:"विधान (A): दयानंद सरस्वती यांनी 'वेदांकडे परत चला' हा नारा दिला. कारण (R): त्यांच्या मते वेद हेच खरे ज्ञानस्रोत असून नंतरच्या पुराण-ग्रंथांतील कर्मकांड त्याज्य आहे.",q_english:"Assertion (A): Dayanand Saraswati gave the slogan 'Go back to the Vedas'. Reason (R): He held the Vedas as the true source of knowledge and rejected later Puranic ritualism.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. दयानंदांनी मूर्तिपूजा, जातिभेद यांना विरोध करून वेदप्रामाण्य मांडले आणि शुद्धी चळवळ चालवली."},{section:3,subtopic:"Theosophical Society",qtype:"बहु-विधान",q_marathi:"थियोसॉफिकल सोसायटीबाबत: (I) 1875 मध्ये न्यूयॉर्क येथे ब्लाव्हात्स्की व ऑल्कॉट यांनी स्थापना केली. (II) 1882 मध्ये मुख्यालय अड्यार (मद्रास) येथे हलवले. (III) अ‍ॅनी बेझंट यांनी होमरूल चळवळीत भाग घेतला.",q_english:"About Theosophical Society: (I) Founded 1875 in New York by Blavatsky and Olcott. (II) Headquarters shifted to Adyar (Madras) in 1882. (III) Annie Besant participated in the Home Rule Movement.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. 1875 न्यूयॉर्क स्थापना, 1882 अड्यार मुख्यालय आणि अ‍ॅनी बेझंट यांनी 1916 मध्ये मद्रास येथून होमरूल लीग चालवली."},{section:3,subtopic:"Aligarh Movement",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — अलिगढ चळवळ: (a) सर सय्यद अहमद खान (b) MAO कॉलेज (c) तहजीब-उल-अखलाक (d) सायंटिफिक सोसायटी — (i) 1875, अलिगढ (ii) उर्दू पत्रिका (iii) 1864, गाझीपूर (iv) मुस्लिम समाजसुधारक",q_english:"Match — Aligarh Movement: (a) Sir Syed Ahmed Khan (b) MAO College (c) Tahzib-ul-Akhlaq (d) Scientific Society — (i) 1875, Aligarh (ii) Urdu journal (iii) 1864, Ghazipur (iv) Muslim social reformer",options:["a-iv, b-i, c-ii, d-iii","a-iv, b-iii, c-ii, d-i","a-i, b-iv, c-ii, d-iii","a-iv, b-i, c-iii, d-ii"],correct_index:0,explanation_marathi:"सर सय्यद हे सुधारक, MAO कॉलेज 1875 अलिगढ (पुढे AMU), तहजीब-उल-अखलाक ही उर्दू पत्रिका आणि सायंटिफिक सोसायटी 1864 गाझीपूर येथे स्थापन झाली."},{section:3,subtopic:"Home Rule and Lucknow Pact 1916",qtype:"बहु-विधान",q_marathi:"1916 बद्दल: (I) टिळकांनी पुणे येथून होमरूल लीग सुरू केली. (II) अ‍ॅनी बेझंट यांनी मद्रास येथून होमरूल लीग सुरू केली. (III) लखनौ कराराने काँग्रेस-लीग ऐक्य घडवून आणले.",q_english:"About 1916: (I) Tilak started Home Rule League from Pune. (II) Annie Besant started Home Rule League from Madras. (III) The Lucknow Pact brought Congress-League unity.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. एप्रिल 1916 टिळक (पुणे), सप्टेंबर 1916 बेझंट (मद्रास) आणि डिसेंबर 1916 लखनौ करार (जिन्ना-टिळक पुढाकार) यामुळे हिंदू-मुस्लिम ऐक्याचे वातावरण निर्माण झाले."},{section:4,subtopic:"One Nation One Subscription ONOS",qtype:"बहु-विधान",q_marathi:"वन नेशन वन सबस्क्रिप्शन (ONOS) बाबत: (I) केंद्रीय मंत्रिमंडळाने 25 नोव्हेंबर 2024 रोजी मंजुरी दिली. (II) 2025-2027 साठी 6,000 कोटी रुपयांची तरतूद आहे. (III) INFLIBNET मार्फत अंमलबजावणी होऊन सुमारे 6,300 संस्थांना 13,000 नियतकालिके उपलब्ध होतील.",q_english:"About ONOS: (I) Union Cabinet approved it on 25 Nov 2024. (II) Rs 6,000 crore allocated for 2025-2027. (III) Implemented via INFLIBNET giving ~6,300 institutions access to 13,000 journals.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. ONOS 1 जानेवारी 2025 पासून लागू, NEP 2020 शी सुसंगत असून सुमारे 1.8 कोटी विद्यार्थ्यांना आंतरराष्ट्रीय संशोधन नियतकालिके मोफत उपलब्ध होतील."},{section:4,subtopic:"ANRF Act 2023",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — अनुसंधान नॅशनल रिसर्च फाउंडेशन: (a) ANRF कायदा (b) अंमलबजावणी तारीख (c) SERB (d) उद्देश — (i) 5 फेब्रुवारी 2024 (ii) 2023 चा 25 वा कायदा (iii) संशोधन-नवाचार संस्कृती (iv) ANRF मध्ये विलीन",q_english:"Match — ANRF: (a) ANRF Act (b) Enforcement date (c) SERB (d) Objective — (i) 5 February 2024 (ii) 25th Act of 2023 (iii) Research-innovation culture (iv) Merged into ANRF",options:["a-ii, b-i, c-iv, d-iii","a-i, b-ii, c-iv, d-iii","a-ii, b-i, c-iii, d-iv","a-iv, b-i, c-ii, d-iii"],correct_index:0,explanation_marathi:"ANRF कायदा 2023 (25/2023) 5 फेब्रुवारी 2024 पासून लागू, 2008 मधील SERB त्यात विलीन आणि विद्यापीठे-संशोधन संस्थांमध्ये संशोधन संस्कृती वाढवणे हा उद्देश."},{section:4,subtopic:"Education initiatives chronology",qtype:"कालक्रम",q_marathi:"शिक्षण उपक्रमांचा कालक्रम लावा: (a) DIKSHA प्लॅटफॉर्म (b) राष्ट्रीय शैक्षणिक धोरण 2020 (c) राष्ट्रीय अभ्यासक्रम आराखडा NCF 2023 (d) ONOS अंमलबजावणी",q_english:"Arrange education initiatives chronologically: (a) DIKSHA platform (b) NEP 2020 (c) NCF 2023 (d) ONOS rollout",options:["a-b-c-d","b-a-c-d","a-c-b-d","d-c-b-a"],correct_index:0,explanation_marathi:"DIKSHA (2017), NEP 2020 (जुलै 2020), NCF शालेय शिक्षण 2023 आणि ONOS 1 जानेवारी 2025. क्रम a-b-c-d."},{section:4,subtopic:"World's largest grain storage plan",qtype:"विधान-कारण",q_marathi:"विधान (A): केंद्र सरकारने सहकार क्षेत्रात जगातील सर्वात मोठी धान्य साठवण योजना जाहीर केली. कारण (R): प्रत्येक PACS मध्ये गोदाम बांधून अन्नधान्याचा अपव्यय कमी करणे आणि शेतकऱ्यांना वाजवी भाव मिळवून देणे हा उद्देश आहे.",q_english:"Assertion (A): The Centre announced the world's largest grain storage plan in the cooperative sector. Reason (R): Building godowns in every PACS aims to cut foodgrain wastage and ensure fair prices to farmers.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. 2023 मध्ये जाहीर झालेल्या या योजनेत PACS स्तरावर विकेंद्रित साठवणूक, NABARD-NCDC अर्थसहाय्य यांचा समावेश आहे."},{section:4,subtopic:"Three new national cooperatives",qtype:"बहु-विधान",q_marathi:"तीन नवीन राष्ट्रीय सहकारी संस्थांबाबत: (I) BBSSL — भारतीय बीज सहकारी समिती. (II) BONS — जैविक उत्पादनांसाठी राष्ट्रीय सहकारी. (III) BBOS — निर्यातीसाठी राष्ट्रीय सहकारी.",q_english:"About three new national cooperatives: (I) BBSSL — Bharatiya Beej Sahkari Samiti. (II) BONS — National cooperative for organics. (III) BBOS — National cooperative for exports.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. 2023 मध्ये स्थापन झालेल्या या संस्था अनुक्रमे बियाणे (BBSSL), जैविक उत्पादने (NCOL/BONS) आणि निर्यात (NCEL/BBOS) यांसाठी काम करतात."},{section:4,subtopic:"Sahitya Akademi Sangeet Natak awards",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) साहित्य अकादमी पुरस्कार (b) संगीत नाटक अकादमी पुरस्कार (c) ज्ञानपीठ (d) साहित्य अकादमी स्थापना — (i) 1954 (ii) सर्वोच्च साहित्य सन्मान (iii) 24 भाषांतील साहित्य (iv) नृत्य-संगीत-नाटक",q_english:"Match: (a) Sahitya Akademi Award (b) Sangeet Natak Akademi Award (c) Jnanpith (d) Sahitya Akademi founded — (i) 1954 (ii) Highest literary honour (iii) Literature in 24 languages (iv) Dance-music-drama",options:["a-iii, b-iv, c-ii, d-i","a-iv, b-iii, c-ii, d-i","a-iii, b-ii, c-iv, d-i","a-i, b-iv, c-ii, d-iii"],correct_index:0,explanation_marathi:"साहित्य अकादमी (1954) 24 भाषांत पुरस्कार देते, संगीत नाटक अकादमी (1952) नृत्य-संगीत-नाटकासाठी आणि ज्ञानपीठ हा सर्वोच्च साहित्य सन्मान आहे."},{section:4,subtopic:"Quad summit chronology",qtype:"कालक्रम",q_marathi:"क्वाड शिखर परिषदांचा क्रम लावा: (a) पहिली प्रत्यक्ष शिखर परिषद, वॉशिंग्टन (b) टोकियो शिखर परिषद (c) विल्मिंग्टन शिखर परिषद (d) पहिली आभासी शिखर परिषद",q_english:"Arrange Quad summits: (a) First in-person summit, Washington (b) Tokyo summit (c) Wilmington summit (d) First virtual summit",options:["d-a-b-c","a-d-b-c","d-b-a-c","a-b-d-c"],correct_index:0,explanation_marathi:"पहिली आभासी (मार्च 2021), वॉशिंग्टन (सप्टेंबर 2021), टोकियो (मे 2022) आणि विल्मिंग्टन (सप्टेंबर 2024, बायडेन यांचे गाव). क्रम d-a-b-c."},{section:4,subtopic:"Mission Indradhanush",qtype:"विधान-कारण",q_marathi:"विधान (A): मिशन इंद्रधनुष अंतर्गत 2 वर्षांखालील बालके आणि गरोदर महिलांचे पूर्ण लसीकरण हे लक्ष्य आहे. कारण (R): नियमित लसीकरणातून सुटलेली बालके व महिलांपर्यंत पोहोचणे हा उद्देश आहे.",q_english:"Assertion (A): Mission Indradhanush targets full immunization of children under 2 and pregnant women. Reason (R): It aims to reach children and women missed in routine immunization.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. 2014 मध्ये सुरू झालेले हे अभियान IMI (Intensified) टप्प्यांतून कमी लसीकरण असलेल्या जिल्ह्यांवर भर देते."},{section:4,subtopic:"Beti Bachao Beti Padhao",qtype:"बहु-विधान",q_marathi:"बेटी बचाओ बेटी पढाओ बाबत: (I) 2015 मध्ये पानिपत (हरियाणा) येथून सुरुवात. (II) बाल लिंगगुणोत्तर सुधारणे हे मुख्य उद्दिष्ट. (III) महिला व बाल विकास मंत्रालयाची ही योजना आहे.",q_english:"About Beti Bachao Beti Padhao: (I) Launched 2015 from Panipat (Haryana). (II) Improving child sex ratio is the main goal. (III) It is a WCD Ministry scheme.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. 22 जानेवारी 2015 रोजी सुरुवात, CSR (बाल लिंगगुणोत्तर), मुलींचे शिक्षण व सक्षमीकरण हे त्रिसूत्री उद्दिष्ट आणि WCD मंत्रालयाची अंमलबजावणी."},{section:4,subtopic:"National Health Mission",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) NRHM (b) NUHM (c) राष्ट्रीय आरोग्य अभियान (d) आयुष्मान भारत — (i) 2005, ग्रामीण (ii) 2013, शहरी (iii) 2013, NRHM+NUHM विलीनीकरण (iv) 2018, PM-JAY",q_english:"Match: (a) NRHM (b) NUHM (c) National Health Mission (d) Ayushman Bharat — (i) 2005, rural (ii) 2013, urban (iii) 2013, NRHM+NUHM merger (iv) 2018, PM-JAY",options:["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv","a-iii, b-ii, c-i, d-iv"],correct_index:0,explanation_marathi:"NRHM 2005 (ग्रामीण), NUHM 2013 (शहरी), दोन्हींचे 2013 मध्ये राष्ट्रीय आरोग्य अभियानात विलीनीकरण आणि आयुष्मान भारत PM-JAY 2018 मध्ये सुरू."},{section:4,subtopic:"Residential schools chronology",qtype:"कालक्रम",q_marathi:"निवासी शाळा योजनांचा क्रम लावा: (a) केंद्रीय विद्यालय (b) नवोदय विद्यालय (c) एकलव्य मॉडेल निवासी शाळा (d) PM SHRI शाळा",q_english:"Arrange chronologically: (a) Kendriya Vidyalaya (b) Navodaya Vidyalaya (c) Eklavya Model Residential School (d) PM SHRI Schools",options:["a-b-c-d","b-a-c-d","a-c-b-d","c-a-b-d"],correct_index:0,explanation_marathi:"केवी (1963), नवोदय (1986, NEP), EMRS (1997-98, आदिवासी मंत्रालय) आणि PM SHRI (2022). क्रम a-b-c-d."},{section:4,subtopic:"NCF 2023",qtype:"विधान-कारण",q_marathi:"विधान (A): राष्ट्रीय अभ्यासक्रम आराखडा (NCF) 2023 हा NEP 2020 च्या अंमलबजावणीचा भाग आहे. कारण (R): NCF मध्ये 5+3+3+4 रचनेनुसार पायाभूत ते माध्यमिक टप्प्यांसाठी अभ्यासक्रम मार्गदर्शक तत्त्वे दिली आहेत.",q_english:"Assertion (A): NCF 2023 is part of NEP 2020 implementation. Reason (R): NCF gives curricular guidelines for foundational to secondary stages under the 5+3+3+4 design.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. NCF-SE 2023 मध्ये पायाभूत (बालवाटिका), तयारी, मध्यम व माध्यमिक टप्प्यांची रचना NEP 2020 नुसार आहे."},{section:4,subtopic:"DIKSHA platform",qtype:"बहु-विधान",q_marathi:"DIKSHA प्लॅटफॉर्मबाबत: (I) शालेय शिक्षणासाठी राष्ट्रीय डिजिटल पायाभूत सुविधा. (II) 35+ भाषांमध्ये e-सामग्री उपलब्ध. (III) NCERT मार्फत समन्वय.",q_english:"About DIKSHA platform: (I) National digital infrastructure for school education. (II) e-content in 35+ languages. (III) Coordinated by NCERT.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. DIKSHA (2017) हे 'एक राष्ट्र, एक डिजिटल प्लॅटफॉर्म' असून शिक्षक-विद्यार्थ्यांसाठी e-पाठ्यपुस्तके, व्हिडिओ व मूल्यमापन साधने पुरवते."},{section:4,subtopic:"Viksit Bharat 2047 targets",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — विकसित भारत 2047: (a) अर्थव्यवस्था लक्ष्य (b) दरडोई उत्पन्न (c) निर्यात लक्ष्य (d) ऊर्जा — (i) 30 ट्रिलियन डॉलर (ii) 18,000 डॉलर (iii) 500 GW अपारंपरिक (iv) 3 ट्रिलियन डॉलर व्यापारी निर्यात",q_english:"Match — Viksit Bharat 2047: (a) Economy target (b) Per capita income (c) Export target (d) Energy — (i) 30 trillion dollars (ii) 18,000 dollars (iii) 500 GW non-fossil (iv) 3 trillion dollar merchandise exports",options:["a-i, b-ii, c-iv, d-iii","a-ii, b-i, c-iv, d-iii","a-i, b-iv, c-ii, d-iii","a-iii, b-ii, c-iv, d-i"],correct_index:0,explanation_marathi:"2047 पर्यंत 30 ट्रिलियन डॉलर अर्थव्यवस्था, 18,000 डॉलर दरडोई उत्पन्न, व्यापारी निर्यातीत मोठी वाढ आणि 2030 पर्यंत 500 GW अपारंपरिक ऊर्जा क्षमता ही प्रमुख लक्ष्ये आहेत."},{section:4,subtopic:"Quad Wilmington 2024",qtype:"बहु-विधान",q_marathi:"विल्मिंग्टन क्वाड शिखर (2024) बाबत: (I) बायडेन यांच्या गावी झाली. (II) क्वाड कॅन्सर मूनशॉट उपक्रम जाहीर. (III) भारत-प्रशांत क्षेत्रात सागरी सहकार्यावर भर.",q_english:"About Wilmington Quad Summit (2024): (I) Held in Biden's hometown. (II) Quad Cancer Moonshot announced. (III) Focus on maritime cooperation in Indo-Pacific.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. सप्टेंबर 2024 मध्ये डेलावेअरच्या विल्मिंग्टन येथे झालेल्या शिखरात कर्करोग संशोधन सहकार्य (मूनशॉट) आणि MAITRI सागरी उपक्रम जाहीर झाले."},{section:5,subtopic:"Zanskar range",qtype:"बहु-विधान",q_marathi:"झंस्कार पर्वतरांगेबाबत: (I) ती लडाख पर्वतरांगेच्या दक्षिणेस आहे. (II) झंस्कार नदी सिंधूची उपनदी आहे. (III) चादर ट्रेक झंस्कार नदीवर होतो.",q_english:"About Zanskar range: (I) It lies south of the Ladakh range. (II) Zanskar river is a tributary of the Indus. (III) The Chadar trek is on the Zanskar river.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. उत्तरेकडून दक्षिणेकडे क्रम: काराकोरम-लडाख-झंस्कार-पीर पंजाल-धौलाधर-शिवालिक. झंस्कार सिंधूला मिळते आणि हिवाळ्यात गोठलेल्या नदीवर चादर ट्रेक होतो."},{section:5,subtopic:"Pir Panjal features",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) पीर पंजाल (b) बनिहाल खिंड (c) रोहतांग खिंड (d) बारालाचा ला — (i) जम्मू-श्रीनगर मार्ग (ii) लडाख पर्वतरांग (iii) कुल्लू-लाहौल (iv) लेह-मनाली",q_english:"Match: (a) Pir Panjal (b) Banihal Pass (c) Rohtang Pass (d) Baralacha La — (i) Jammu-Srinagar route (ii) Ladakh range (iii) Kullu-Lahaul (iv) Leh-Manali",options:["a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-iv, d-ii","a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv"],correct_index:2,explanation_marathi:"पीर पंजाल ही लघु हिमालयातील प्रमुख रांग, बनिहाल खिंड जम्मू-श्रीनगरला जोडते, रोहतांग कुल्लू-लाहौल आणि बारालाचा ला लेह-मनाली मार्गावर आहे."},{section:5,subtopic:"Himalayan ranges north-south",qtype:"कालक्रम",q_marathi:"हिमालयीन पर्वतरांगा उत्तरेकडून दक्षिणेकडे लावा: (a) शिवालिक (b) झंस्कार (c) काराकोरम (d) पीर पंजाल",q_english:"Arrange Himalayan ranges north to south: (a) Shiwalik (b) Zanskar (c) Karakoram (d) Pir Panjal",options:["c-b-d-a","b-c-d-a","c-d-b-a","d-c-b-a"],correct_index:0,explanation_marathi:"उत्तरेकडून दक्षिणेकडे: काराकोरम (बृहत हिमालयाच्या उत्तरेस), झंस्कार, पीर पंजाल (लघु हिमालय) आणि शिवालिक (बाह्य हिमालय). क्रम c-b-d-a."},{section:5,subtopic:"Karakoram K2",qtype:"विधान-कारण",q_marathi:"विधान (A): K2 (गॉडविन ऑस्टिन) हे भारतातील सर्वोच्च शिखर मानले जाते. कारण (R): K2 काराकोरम पर्वतरांगेत असून त्याची उंची 8,611 मीटर आहे.",q_english:"Assertion (A): K2 (Godwin Austen) is considered India's highest peak. Reason (R): K2 lies in the Karakoram range with height 8,611 m.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"भारतीय दाव्यानुसार (PoK सह) K2 हे सर्वोच्च शिखर; काराकोरम ही बृहत हिमालयाच्या उत्तरेकडील रांग असून K2 जगातील दुसरे सर्वोच्च शिखर आहे."},{section:5,subtopic:"Patkai Naga Mizo hills",qtype:"बहु-विधान",q_marathi:"पूर्वांचल टेकड्यांबाबत: (I) पटकाई टेकड्या अरुणाचल प्रदेशात आहेत. (II) नागा टेकड्या नागालँडमध्ये आहेत. (III) मिझो टेकड्या पूर्वी लुशाई टेकड्या म्हणून ओळखल्या जात.",q_english:"About Purvanchal hills: (I) Patkai hills are in Arunachal Pradesh. (II) Naga hills are in Nagaland. (III) Mizo hills were earlier known as Lushai hills.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. पूर्वांचल ही हिमालयाची पूर्वेकडील शाखा असून पटकाई (अरुणाचल), नागा (नागालँड), मणिपूर टेकड्या, मिझो/लुशाई (मिझोराम) यांचा समावेश होतो."},{section:5,subtopic:"Garo Khasi Jaintia",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) गारो टेकड्या (b) खासी टेकड्या (c) जैंतिया टेकड्या — (i) नॉकरेक (ii) चेरापुंजी-मावसिनराम (iii) मेघालय पठाराचा पूर्व भाग",q_english:"Match: (a) Garo hills (b) Khasi hills (c) Jaintia hills — (i) Nokrek (ii) Cherrapunji-Mawsynram (iii) Eastern part of Meghalaya plateau",options:["a-i, b-ii, c-iii","a-ii, b-i, c-iii","a-i, b-iii, c-ii","a-iii, b-ii, c-i"],correct_index:0,explanation_marathi:"गारो (पश्चिम, नॉकरेक शिखर), खासी (मध्य, चेरापुंजी-मावसिनराम अतिवृष्टी) आणि जैंतिया (पूर्व) या मेघालय पठाराच्या तीन टेकड्या पश्चिमेकडून पूर्वेकडे आहेत."},{section:5,subtopic:"Southern hills Cardamom Anaimalai",qtype:"कालक्रम",q_marathi:"दक्षिणेकडील टेकड्या उत्तरेकडून दक्षिणेकडे लावा: (a) पालनी टेकड्या (b) अनाईमलाई टेकड्या (c) वेलदोडा (कार्डमम) टेकड्या (d) निलगिरी",q_english:"Arrange southern hills north to south: (a) Palani hills (b) Anaimalai hills (c) Cardamom hills (d) Nilgiri",options:["d-b-a-c","b-d-a-c","d-a-b-c","a-d-b-c"],correct_index:0,explanation_marathi:"उत्तरेकडून दक्षिणेकडे: निलगिरी, अनाईमलाई (अनाईमुडी 2,695 मी, दक्षिण भारतातील सर्वोच्च), पालनी (कोडाईकॅनाल) आणि कार्डमम टेकड्या (केरळ). क्रम d-b-a-c."},{section:5,subtopic:"Chota Nagpur minerals",qtype:"विधान-कारण",q_marathi:"विधान (A): छोटा नागपूर पठाराला 'भारताचा रूर' म्हटले जाते. कारण (R): येथे कोळसा, लोह, बॉक्साइट, अभ्रक यांसारखी खनिजे विपुल प्रमाणात आढळतात.",q_english:"Assertion (A): Chota Nagpur plateau is called the 'Ruhr of India'. Reason (R): It has abundant coal, iron, bauxite, mica and other minerals.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. जर्मनीच्या रूर खोऱ्याप्रमाणे येथे खनिज-आधारित उद्योग (जमशेदपूर, बोकारो, राउरकेला) विकसित झाले आहेत."},{section:5,subtopic:"Malwa plateau",qtype:"बहु-विधान",q_marathi:"माळवा पठाराबाबत: (I) ते विंध्य पर्वतरांगेच्या उत्तरेस आहे. (II) चंबळ, बेतवा या नद्या येथून उगम पावतात. (III) येथे काळी (रेगूर) मृदा आढळते.",q_english:"About Malwa plateau: (I) It lies north of the Vindhya range. (II) Chambal and Betwa originate here. (III) Black (regur) soil is found here.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. माळवा (मध्य प्रदेश) हे दख्खन ट्रॅपच्या लाव्हा निर्मित पठार असून चंबळ-बेतवा येथून वाहतात आणि कापसासाठी प्रसिद्ध काळी मृदा येथे आहे."},{section:5,subtopic:"Bundelkhand Baghelkhand",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) बुंदेलखंड (b) बघेलखंड (c) दंडकारण्य (d) तेलंगणा पठार — (i) छत्तीसगड-ओडिशा (ii) उत्तर प्रदेश-मध्य प्रदेश (iii) मध्य प्रदेश पूर्व (iv) आंध्र-कर्नाटक",q_english:"Match: (a) Bundelkhand (b) Baghelkhand (c) Dandakaranya (d) Telangana plateau — (i) Chhattisgarh-Odisha (ii) UP-MP (iii) Eastern MP (iv) Andhra-Karnataka",options:["a-ii, b-iii, c-i, d-iv","a-iii, b-ii, c-i, d-iv","a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv"],correct_index:0,explanation_marathi:"बुंदेलखंड (यूपी-दक्षिण+एमपी-उत्तर), बघेलखंड (पूर्व मध्य प्रदेश), दंडकारण्य (छत्तीसगड-ओडिशा-आंध्र) आणि तेलंगणा पठार (दख्खनचा पूर्व भाग)."},{section:5,subtopic:"Indian plateaus",qtype:"कालक्रम",q_marathi:"खालीलपैकी लाव्हा निर्मित पठार कोणते ते ओळखा: (a) दख्खन पठार (b) छोटा नागपूर (c) माळवा (d) मेघालय",q_english:"Identify lava-formed plateaus: (a) Deccan (b) Chota Nagpur (c) Malwa (d) Meghalaya",options:["a आणि c फक्त / a and c only","a, b आणि c / a, b and c","b आणि d फक्त / b and d only","सर्व / All"],correct_index:0,explanation_marathi:"दख्खन आणि माळवा ही दख्खन ट्रॅपच्या ज्वालामुखी लाव्हापासून (क्रिटेशियस) निर्माण झाली आहेत. छोटा नागपूर हे गोंडवाना खडकांचे तर मेघालय हे प्राचीन खडकांचे पठार आहे."},{section:5,subtopic:"Meghalaya plateau rainfall",qtype:"विधान-कारण",q_marathi:"विधान (A): मावसिनराम हे जगातील सर्वाधिक पावसाचे ठिकाण आहे. कारण (R): खासी टेकड्या बंगालच्या उपसागराकडून येणाऱ्या आर्द्र वाऱ्यांना अडवून पर्वतीय अतिवृष्टी घडवतात.",q_english:"Assertion (A): Mawsynram is the wettest place on Earth. Reason (R): The Khasi hills block moist winds from the Bay of Bengal causing orographic downpour.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. खासी टेकड्यांच्या दक्षिण उतारावर (चेरापुंजी-मावसिनराम) नैऋत्य मान्सूनमुळे 11,000 मिमी+ पाऊस पडतो."},{section:5,subtopic:"Dhaula Dhar range",qtype:"बहु-विधान",q_marathi:"धौलाधर पर्वतरांगेबाबत: (I) ती हिमाचल प्रदेशातील लघु हिमालयाचा भाग आहे. (II) धरमशाळा या रांगेच्या पायथ्याशी आहे. (III) हनुमान टिब्बा हे या रांगेतील सर्वोच्च शिखर आहे.",q_english:"About Dhaula Dhar range: (I) It is part of the Lesser Himalaya in Himachal Pradesh. (II) Dharamshala lies at its foothills. (III) Hanuman Tibba is its highest peak.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. धौलाधर (पांढरी धार) ही पीर पंजालची शाखा असून धरमशाळा-मॅक्लॉडगंज तिच्या पायथ्याशी आणि हनुमान टिब्बा (5,982 मी) सर्वोच्च शिखर आहे."},{section:5,subtopic:"Hill stations and ranges",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) मसुरी (b) नैनिताल (c) रानीखेत (d) अल्मोडा — (i) कुमाऊँ हिमालय (ii) गढवाल हिमालय (iii) कुमाऊँ (iv) गढवाल",q_english:"Match: (a) Mussoorie (b) Nainital (c) Ranikhet (d) Almora — (i) Kumaon Himalaya (ii) Garhwal Himalaya (iii) Kumaon (iv) Garhwal",options:["a-ii, b-i, c-i, d-i","a-i, b-ii, c-ii, d-ii","a-ii, b-i, c-iii, d-iii","a-iv, b-iii, c-iii, d-iii"],correct_index:0,explanation_marathi:"मसुरी (गढवाल हिमालय, डेहराडून) आणि नैनिताल-रानीखेत-अल्मोडा (कुमाऊँ हिमालय) ही उत्तराखंडमधील प्रसिद्ध थंड हवेची ठिकाणे आहेत."},{section:5,subtopic:"Shiwalik features",qtype:"बहु-विधान",q_marathi:"शिवालिक टेकड्यांबाबत: (I) त्या हिमालयाची सर्वात दक्षिणेकडील व नवीनतम रांग आहे. (II) डेहराडून, कोटलीदून यांसारखी दून खोरे येथे आहेत. (III) येथील खडकांत जीवाश्म विपुल आढळतात.",q_english:"About Shiwalik hills: (I) They are the southernmost and youngest Himalayan range. (II) Dun valleys like Dehradun and Kotlidun lie here. (III) Their rocks are rich in fossils.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. शिवालिक (बाह्य हिमालय) प्लायोसीन काळातील असून हिमालय-गंगा यांच्यातील दून खोरे आणि शिवालिक जीवाश्म प्राण्यांसाठी (शिवाथेरियम) प्रसिद्ध आहे."},{section:6,subtopic:"DPSP labour welfare Art 43 43A 47",qtype:"बहु-विधान",q_marathi:"मार्गदर्शक तत्त्वांबाबत: (I) कलम 43 — कामगारांना निर्वाह वेतन. (II) कलम 43A — व्यवस्थापनात कामगारांचा सहभाग. (III) कलम 47 — सार्वजनिक आरोग्य व मद्यनिषेध.",q_english:"About Directive Principles: (I) Art 43 — living wage for workers. (II) Art 43A — worker participation in management. (III) Art 47 — public health and prohibition.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. कलम 43 (निर्वाह वेतन), 43A (42वी दुरुस्ती, 1976 — व्यवस्थापनात सहभाग) आणि 47 (पोषण, आरोग्य, मद्यनिषेध) ही कामगार-कल्याणाची तत्त्वे आहेत."},{section:6,subtopic:"Executive power Art 73 77",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) कलम 73 (b) कलम 77 (c) कलम 162 (d) कलम 166 — (i) राज्य शासनाचे कामकाज (ii) संघ कार्यकारिणीची व्याप्ती (iii) शासकीय कामकाजाचे संचालन (iv) राज्य कार्यकारिणीची व्याप्ती",q_english:"Match: (a) Art 73 (b) Art 77 (c) Art 162 (d) Art 166 — (i) Conduct of state government business (ii) Extent of Union executive power (iii) Conduct of government business (iv) Extent of state executive power",options:["a-ii, b-iii, c-iv, d-i","a-iii, b-ii, c-i, d-iv","a-ii, b-i, c-iv, d-iii","a-iv, b-iii, c-ii, d-i"],correct_index:0,explanation_marathi:"कलम 73 (संघ कार्यकारिणी व्याप्ती), 77 (भारत सरकारचे कामकाज), 162 (राज्य कार्यकारिणी व्याप्ती) आणि 166 (राज्य शासनाचे कामकाज) अशी सुसंगत रचना आहे."},{section:6,subtopic:"Parliament articles 81 82 84 86 88",qtype:"कालक्रम",q_marathi:"संसदेसंबंधी कलमांचा क्रम लावा (कलम क्रमांकानुसार): (a) राष्ट्रपतींचे अभिभाषणाचा अधिकार (b) लोकसभेची रचना (c) सदस्यांची पात्रता (d) मंत्र्यांचे सभागृहातील अधिकार",q_english:"Arrange Parliament articles numerically: (a) President's right to address (b) Composition of Lok Sabha (c) Qualifications of members (d) Rights of ministers in Houses",options:["b-c-a-d","c-b-a-d","b-a-c-d","a-b-c-d"],correct_index:0,explanation_marathi:"कलम 81 (लोकसभा रचना — 530+20), 84 (पात्रता), 86 (राष्ट्रपतींचे अभिभाषण/संदेश) आणि 88 (मंत्री व महान्यायवादी यांचे अधिकार). क्रम b-c-a-d."},{section:6,subtopic:"Delimitation freeze Art 82",qtype:"विधान-कारण",q_marathi:"विधान (A): 84वी घटनादुरुस्ती (2001) ने मतदारसंघ पुनर्रचनेवर 2026 पर्यंत स्थगिती दिली. कारण (R): लोकसंख्या नियंत्रणासाठी प्रयत्न करणाऱ्या राज्यांना जागावाटपात तोटा होऊ नये हा उद्देश होता.",q_english:"Assertion (A): The 84th Amendment (2001) froze constituency delimitation till 2026. Reason (R): States controlling population should not lose seats in allocation.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. 1976 (42वी) मध्ये 2001 पर्यंत आणि 2001 (84वी) मध्ये 2026 पर्यंत स्थगिती वाढवली; जनगणना 1971 च्या आधारेच जागावाटप."},{section:6,subtopic:"MP qualifications Art 84 86 88",qtype:"बहु-विधान",q_marathi:"संसद सदस्यांबाबत: (I) कलम 84 — नागरिकत्व, वय (लोकसभा 25, राज्यसभा 30). (II) कलम 86 — राष्ट्रपतींना सभागृहांना संबोधित करण्याचा अधिकार. (III) कलम 88 — मंत्री नसलेले महान्यायवादी सभागृहात बोलू शकतात पण मतदान करू शकत नाहीत.",q_english:"About MPs: (I) Art 84 — citizenship, age (LS 25, RS 30). (II) Art 86 — President's right to address Houses. (III) Art 88 — AG (not a minister) may speak but not vote.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. कलम 84 पात्रता, 86 राष्ट्रपतींचे विशेषाधिकार आणि 88 नुसार प्रत्येक मंत्री व भारताचे महान्यायवादी सभागृहात सहभागी होऊ शकतात (मतदान फक्त सदस्यांना)."},{section:6,subtopic:"Rajya Sabha officers 89-92",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) कलम 89 (b) कलम 90 (c) कलम 91 (d) कलम 92 — (i) सभापती पद रिक्त असताना (ii) सभापती/उपसभापती (iii) हटवण्याच्या ठरावावेळी अध्यक्षता नाही (iv) उपसभापती पद रिक्त",q_english:"Match: (a) Art 89 (b) Art 90 (c) Art 91 (d) Art 92 — (i) When Chairman's office vacant (ii) Chairman/Deputy Chairman (iii) No presiding during removal resolution (iv) When Deputy Chairman's office vacant",options:["a-ii, b-iv, c-i, d-iii","a-iv, b-ii, c-i, d-iii","a-ii, b-i, c-iv, d-iii","a-i, b-iv, c-ii, d-iii"],correct_index:0,explanation_marathi:"कलम 89 (उपराष्ट्रपती=सभापती, उपसभापती), 90 (उपसभापती पद रिक्त/राजीनामा/हटवणूक), 91 (रिक्ततेवेळी कर्तव्ये) आणि 92 (हटवणूक ठरावावेळी सभापती/उपसभापती अध्यक्षस्थानी नाही)."},{section:6,subtopic:"Speaker provisions 93-96",qtype:"कालक्रम",q_marathi:"लोकसभा अध्यक्षांबाबत कलम क्रम लावा: (a) अध्यक्ष/उपाध्यक्ष पदे (b) पद रिक्त/राजीनामा/हटवणूक (c) कर्तव्ये (रिक्तता) (d) अध्यक्षांना हटवण्याच्या ठरावावेळी मतदान",q_english:"Arrange Speaker articles numerically: (a) Offices of Speaker/Deputy Speaker (b) Vacation/resignation/removal (c) Duties when vacant (d) Voting during Speaker's removal",options:["a-b-c-d","b-a-c-d","a-c-b-d","d-c-b-a"],correct_index:0,explanation_marathi:"कलम 93 (पदे), 94 (रिक्त/राजीनामा/हटवणूक — 14 दिवस पूर्वसूचना), 95 (उपाध्यक्ष किंवा ठरलेली व्यक्ती कर्तव्ये) आणि 96 (हटवणूक ठरावावेळी अध्यक्षता नाही पण प्रथम मत)."},{section:6,subtopic:"Art 97 98 salaries secretariat",qtype:"विधान-कारण",q_marathi:"विधान (A): कलम 97 नुसार लोकसभा अध्यक्ष/उपाध्यक्ष व राज्यसभा सभापती/उपसभापती यांचे वेतन संसद ठरवते. कारण (R): कलम 98 नुसार संसदेचे स्वतंत्र सचिवालय असून त्याची रचना संसद कायद्याने ठरवते.",q_english:"Assertion (A): Under Art 97, Parliament fixes salaries of LS Speaker/Dy Speaker and RS Chairman/Dy Chairman. Reason (R): Under Art 98, Parliament has a separate secretariat structured by parliamentary law.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:1,explanation_marathi:"दोन्ही विधाने स्वतंत्रपणे बरोबर आहेत पण R हे A चे स्पष्टीकरण नाही. कलम 97 (वेतन-भत्ते, संचित निधीवर भारित) आणि कलम 98 (स्वतंत्र सचिवालय) ही वेगवेगळी तरतुदे आहेत."},{section:6,subtopic:"Oath Art 99",qtype:"बहु-विधान",q_marathi:"कलम 99 (शपथ) बाबत: (I) प्रत्येक सदस्याला स्थान ग्रहण करण्यापूर्वी शपथ घ्यावी लागते. (II) शपथेचा नमुना तिसऱ्या अनुसूचित आहे. (III) शपथ न घेता मतदान केल्यास दर दिवशी 500 रुपये दंड.",q_english:"About Art 99 (oath): (I) Every member must take oath before occupying seat. (II) The oath format is in the Third Schedule. (III) Voting without oath attracts Rs 500/day penalty.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. कलम 99 नुसार राष्ट्रपती किंवा त्यांनी नेमलेल्या व्यक्तीसमोर तिसऱ्या अनुसूचितील नमुन्यानुसार शपथ; कलम 104 नुसार अनधिकृत मतदान/बसण्यास दंड."},{section:6,subtopic:"Articles match provisions",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) कलम 81 (b) कलम 82 (c) कलम 84 (d) कलम 86 — (i) पात्रता (ii) लोकसभा रचना (iii) राष्ट्रपतींचा संदेश अधिकार (iv) पुनर्रचना/परिसीमन",q_english:"Match: (a) Art 81 (b) Art 82 (c) Art 84 (d) Art 86 — (i) Qualifications (ii) LS composition (iii) President's messaging right (iv) Readjustment/delimitation",options:["a-ii, b-iv, c-i, d-iii","a-iv, b-ii, c-i, d-iii","a-ii, b-i, c-iv, d-iii","a-i, b-iv, c-ii, d-iii"],correct_index:0,explanation_marathi:"81 (लोकसभा — राज्यांतून 530 + केंद्रशासित 20), 82 (प्रत्येक जनगणनेनंतर पुनर्रचना), 84 (पात्रता) आणि 86 (राष्ट्रपती सभागृहांना संबोधित/संदेश पाठवू शकतात)."},{section:6,subtopic:"DPSP articles 43 43A 47 chronology",qtype:"कालक्रम",q_marathi:"मार्गदर्शक तत्त्वे समावेश क्रम लावा: (a) कलम 43 (b) कलम 43A (c) कलम 47 (d) कलम 48A",q_english:"Arrange DPSP inclusion chronologically: (a) Art 43 (b) Art 43A (c) Art 47 (d) Art 48A",options:["a-c-b-d","c-a-b-d","a-b-c-d","b-a-d-c"],correct_index:0,explanation_marathi:"मूळ संविधानात 43 (निर्वाह वेतन) व 47 (आरोग्य) होती; 43A (1976, 42वी दुरुस्ती) आणि 48A (1976, 42वी — पर्यावरण) नंतर समाविष्ट. क्रम a-c-b-d."},{section:6,subtopic:"Art 43A worker participation",qtype:"विधान-कारण",q_marathi:"विधान (A): कलम 43A नुसार उद्योगांच्या व्यवस्थापनात कामगारांच्या सहभागासाठी राज्य प्रयत्न करेल. कारण (R): हे तत्त्व 42वी घटनादुरुस्ती (1976) ने समाविष्ट केले.",q_english:"Assertion (A): Under Art 43A, the State shall secure worker participation in management of industries. Reason (R): This principle was inserted by the 42nd Amendment (1976).",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:1,explanation_marathi:"दोन्ही बरोबर आहेत पण R हे A चे स्पष्टीकरण नाही — R ही केवळ ऐतिहासिक माहिती आहे. A मधील तत्त्वाचा आशय R स्पष्ट करत नाही."},{section:6,subtopic:"Union vs State executive 73 162",qtype:"बहु-विधान",q_marathi:"कार्यकारिणी व्याप्तीबाबत: (I) कलम 73 — संघ कार्यकारिणी संसदेच्या कायदेविषयांपुरती. (II) कलम 162 — राज्य कार्यकारिणी विधिमंडळाच्या कायदेविषयांपुरती. (III) समवर्ती सूचीवर दोघांचीही व्याप्ती, पण संघ कायद्याला प्राधान्य.",q_english:"About executive extent: (I) Art 73 — Union executive covers Parliament's legislative subjects. (II) Art 162 — State executive covers legislature's subjects. (III) Both cover Concurrent List, but Union law prevails.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. कलम 73 व 162 यांची समांतर रचना असून समवर्ती सूचीवर संघ कार्यकारिणी मर्यादित (संघ कायद्याच्या अधीन) आणि कलम 254 नुसार विसंगतीत संघ कायदा प्रभावी."},{section:6,subtopic:"Parliament sessions 85 86 87 88",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) कलम 85 (b) कलम 86 (c) कलम 87 (d) कलम 88 — (i) विशेष अभिभाषण (ii) अधिवेशन/सत्रसमाप्ती/विसर्जन (iii) मंत्री-महान्यायवादी अधिकार (iv) अभिभाषण/संदेश अधिकार",q_english:"Match: (a) Art 85 (b) Art 86 (c) Art 87 (d) Art 88 — (i) Special address (ii) Sessions/prorogation/dissolution (iii) Minister-AG rights (iv) Address/message rights",options:["a-ii, b-iv, c-i, d-iii","a-iv, b-ii, c-i, d-iii","a-ii, b-i, c-iv, d-iii","a-i, b-iv, c-ii, d-iii"],correct_index:0,explanation_marathi:"85 (राष्ट्रपती अधिवेशन बोलावतात, सत्रसमाप्ती; लोकसभा विसर्जन), 86 (अभिभाषण/संदेश), 87 (निवडणुकीनंतर पहिल्या अधिवेशनात व वार्षिक विशेष अभिभाषण) आणि 88 (मंत्री/महान्यायवादी सहभाग)."},{section:6,subtopic:"Presiding officers overview 89-98",qtype:"बहु-विधान",q_marathi:"पीठासीन अधिकाऱ्यांबाबत: (I) राज्यसभा सभापती हेच उपराष्ट्रपती असतात (कलम 89). (II) लोकसभा अध्यक्षांना 14 दिवसांच्या सूचनेने हटवता येते (कलम 94). (III) संसदेचे सचिवालय कार्यकारिणीपासून स्वतंत्र असते (कलम 98).",q_english:"About presiding officers: (I) RS Chairman is the Vice-President (Art 89). (II) LS Speaker removable with 14 days' notice (Art 94). (III) Parliament's secretariat is independent of executive (Art 98).",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. उपराष्ट्रपती पदसिद्ध सभापती, अध्यक्ष हटवणूक ठरावासाठी 14 दिवस पूर्वसूचना (फक्त लोकसभेच्या बहुमताने) आणि स्वतंत्र सचिवालय ही संसदीय स्वायत्ततेची हमी आहे."},{section:7,subtopic:"Coloured revolutions Black Brown Red Round",qtype:"बहु-विधान",q_marathi:"रंग क्रांतींबाबत: (I) काळी क्रांती — पेट्रोलियम उत्पादन. (II) तपकिरी क्रांती — चामडे/कोको उत्पादन. (III) लाल क्रांती — मांस/टोमॅटो उत्पादन. (IV) गोल क्रांती — बटाटा उत्पादन.",q_english:"About coloured revolutions: (I) Black — petroleum production. (II) Brown — leather/cocoa. (III) Red — meat/tomato. (IV) Round — potato.",options:["I, II आणि III फक्त / I, II and III only","I, II, III आणि IV / I, II, III and IV","II, III आणि IV फक्त / II, III and IV only","I आणि IV फक्त / I and IV only"],correct_index:1,explanation_marathi:"चारही बरोबर. काळी (पेट्रोलियम), तपकिरी (चामडे-कोको), लाल (मांस-टोमॅटो), गोल (बटाटा) — या कृषी संलग्न क्रांती 1980-90 च्या दशकात लोकप्रिय झाल्या."},{section:7,subtopic:"Evergreen Rainbow Protein revolutions",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) सदाहरित क्रांती (b) इंद्रधनुष्य क्रांती (c) प्रथिने क्रांती — (i) सर्व पिकांचे एकात्मिक उत्पादन (ii) स्वामीनाथन — शाश्वत शेती (iii) डाळी-तेलबिया उच्च उत्पादन",q_english:"Match: (a) Evergreen Revolution (b) Rainbow Revolution (c) Protein Revolution — (i) Integrated production of all crops (ii) Swaminathan — sustainable farming (iii) Higher pulses-oilseeds output",options:["a-ii, b-i, c-iii","a-i, b-ii, c-iii","a-ii, b-iii, c-i","a-iii, b-i, c-ii"],correct_index:0,explanation_marathi:"सदाहरित (स्वामीनाथन — पर्यावरणपूरक शाश्वतता), इंद्रधनुष्य (2000 — सर्व क्षेत्रे) आणि प्रथिने क्रांती (डाळी-तेलबिया, तंत्रज्ञान अभियान) अशी विभागणी आहे."},{section:7,subtopic:"Trade policy chronology",qtype:"कालक्रम",q_marathi:"व्यापार धोरणांचा क्रम लावा: (a) SEZ कायदा 2005 (b) परकीय व्यापार धोरण 2015-20 (c) RoDTEP योजना (d) परकीय व्यापार धोरण 2023",q_english:"Arrange trade policies: (a) SEZ Act 2005 (b) FTP 2015-20 (c) RoDTEP scheme (d) FTP 2023",options:["a-b-c-d","b-a-c-d","a-c-b-d","c-a-b-d"],correct_index:0,explanation_marathi:"SEZ कायदा (2005), FTP 2015-20, RoDTEP (जानेवारी 2021 — MEIS जागी, WTO सुसंगत) आणि FTP 2023 (अमर्याद कालावधी, गतिशील धोरण). क्रम a-b-c-d."},{section:7,subtopic:"SEZ Act 2005",qtype:"विधान-कारण",q_marathi:"विधान (A): SEZ कायदा 2005 ने निर्यातीला चालना देण्यासाठी करसवलती दिल्या. कारण (R): WTO नियमांनुसार थेट निर्यात अनुदाने टप्प्याटप्प्याने कमी करणे आवश्यक होते.",q_english:"Assertion (A): The SEZ Act 2005 gave tax incentives to boost exports. Reason (R): WTO rules required phasing out direct export subsidies.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:1,explanation_marathi:"दोन्ही बरोबर पण R हे A चे थेट स्पष्टीकरण नाही. SEZ मागील तत्त्व पायाभूत सुविधा-आधारित निर्यात प्रोत्साहन हे होते; WTO सुसंगतता ही नंतरची (RoDTEP सारखी) पावले होती."},{section:7,subtopic:"EOU scheme",qtype:"बहु-विधान",q_marathi:"EOU (निर्याताभिमुख एकक) योजनेबाबत: (I) 100% निर्यातीचे बंधन असते. (II) देशांतर्गत विक्रीसाठी DTA परवानगी मर्यादित आहे. (III) वाणिज्य मंत्रालयामार्फत अंमलबजावणी.",q_english:"About EOU scheme: (I) 100% export obligation. (II) Limited DTA sale permission. (III) Implemented by Commerce Ministry.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. EOU ही SEZ व्यतिरिक्त एकल-एकक निर्यात योजना असून शुल्कमुक्त आयात, DTA मध्ये सवलतीच्या दरात मर्यादित विक्री यांचा समावेश आहे."},{section:7,subtopic:"Export incentives RoDTEP RoSCTL",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) RoDTEP (b) RoSCTL (c) व्याज समानीकरण (d) TMA — (i) वस्त्र-निर्मित कपडे (ii) कर-शुल्क परतावा (iii) वाहतूक-विपणन सहाय्य (iv) निर्यात कर्जावरील सवलत",q_english:"Match: (a) RoDTEP (b) RoSCTL (c) Interest Equalisation (d) TMA — (i) Garments-made-ups (ii) Duty-tax remission (iii) Transport-marketing aid (iv) Export credit rebate",options:["a-ii, b-i, c-iv, d-iii","a-i, b-ii, c-iv, d-iii","a-ii, b-iv, c-i, d-iii","a-iv, b-i, c-ii, d-iii"],correct_index:0,explanation_marathi:"RoDTEP (सर्व उत्पादने — WTO सुसंगत), RoSCTL (वस्त्र), व्याज समानीकरण (निर्यात कर्ज 3-5%) आणि TMA (कृषी निर्यात वाहतूक सहाय्य) अशी रचना आहे."},{section:7,subtopic:"RBI currency presses chronology",qtype:"कालक्रम",q_marathi:"चलन छपाई व्यवस्थेचा क्रम लावा: (a) नाशिक प्रेस (b) देवास प्रेस (c) BRBNMPL म्हैसूर (d) सालबोनी प्रेस",q_english:"Arrange currency press chronology: (a) Nashik Press (b) Dewas Press (c) BRBNMPL Mysuru (d) Salboni Press",options:["a-b-c-d","b-a-d-c","a-b-d-c","d-c-b-a"],correct_index:0,explanation_marathi:"नाशिक (1928, नोटा), देवास (1974, नोटा+शाई), BRBNMPL म्हैसूर (1995, RBI उपकंपनी) आणि सालबोनी (पश्चिम बंगाल, BRBNMPL दुसरा प्रकल्प). क्रम a-b-c-d."},{section:7,subtopic:"District as Export Hub",qtype:"विधान-कारण",q_marathi:"विधान (A): 'जिल्हा निर्यात केंद्र' उपक्रमात प्रत्येक जिल्ह्यातील ODOP उत्पादनांना निर्यातीसाठी प्रोत्साहन दिले जाते. कारण (R): विकेंद्रित निर्यातीमुळे प्रादेशिक असमतोल कमी होऊन रोजगार वाढतो.",q_english:"Assertion (A): The 'District as Export Hub' initiative promotes ODOP products of each district for exports. Reason (R): Decentralised exports reduce regional imbalance and raise employment.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. FTP 2023 मधील या उपक्रमात जिल्हा निर्यात कृती आराखडे, DGFT समन्वय यांचा समावेश आहे."},{section:7,subtopic:"FTP 2023 features",qtype:"बहु-विधान",q_marathi:"परकीय व्यापार धोरण 2023 बाबत: (I) पाच वर्षांच्या मर्यादेऐवजी गतिशील/अमर्याद धोरण. (II) ई-कॉमर्स निर्यात केंद्रांची तरतूद. (III) टाऊन्स ऑफ एक्स्पोर्ट एक्सलन्सची मर्यादा 4 वरून वाढवली.",q_english:"About FTP 2023: (I) Dynamic/open-ended instead of 5-year limit. (II) Provision for e-commerce export hubs. (III) Towns of Export Excellence limit expanded.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. FTP 2023 हे 'अंतिम तारखेविना' धोरण असून डाक निर्यात केंद्रे, ई-कॉमर्स हब आणि जिल्हा-स्तरीय निर्यातीवर भर देते."},{section:7,subtopic:"NIRVIK ECGC",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) NIRVIK (b) ECGC (c) कर्ज जोखीम (d) प्रीमियम — (i) निर्यात पत हमी महामंडळ (ii) 90% पर्यंत विमा संरक्षण (iii) निर्यातदारांसाठी योजना (iv) कमी दर",q_english:"Match: (a) NIRVIK (b) ECGC (c) Credit risk (d) Premium — (i) Export credit guarantee corp (ii) Up to 90% cover (iii) Scheme for exporters (iv) Lower rates",options:["a-iii, b-i, c-ii, d-iv","a-i, b-iii, c-ii, d-iv","a-iii, b-ii, c-i, d-iv","a-ii, b-i, c-iv, d-iii"],correct_index:0,explanation_marathi:"NIRVIK (निर्यात कर्ज विमा योजना) — ECGC मार्फत 90% पर्यंत संरक्षण, कमी प्रीमियम, यामुळे बँकांचे निर्यात कर्ज वाढते."},{section:7,subtopic:"Revolution chronology Green White Blue",qtype:"कालक्रम",q_marathi:"क्रांतींचा क्रम लावा: (a) हरित क्रांती (b) श्वेत क्रांती (c) निळी क्रांती (d) इंद्रधनुष्य क्रांती",q_english:"Arrange revolutions: (a) Green (b) White (c) Blue (d) Rainbow",options:["a-b-c-d","b-a-c-d","a-c-b-d","c-a-b-d"],correct_index:0,explanation_marathi:"हरित (1966-67, गहू-तांदूळ), श्वेत (1970, दूध-ऑपरेशन फ्लड), निळी (मत्स्य) आणि इंद्रधनुष्य (2000, सर्वसमावेशक). क्रम a-b-c-d."},{section:7,subtopic:"RoDTEP WTO compliant",qtype:"विधान-कारण",q_marathi:"विधान (A): RoDTEP ही WTO सुसंगत निर्यात प्रोत्साहन योजना आहे. कारण (R): ती थेट अनुदानाऐवजी निर्यात उत्पादनांवरील अप्रत्यक्ष कर-शुल्कांचा परतावा देते.",q_english:"Assertion (A): RoDTEP is a WTO-compliant export incentive. Reason (R): It refunds embedded indirect taxes/duties instead of direct subsidies.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. MEIS (थेट अनुदान, WTO आक्षेप) जागी जानेवारी 2021 पासून RoDTEP — करांचा परतावा हा WTO नियमांत मान्य आहे."},{section:7,subtopic:"BRBNMPL",qtype:"बहु-विधान",q_marathi:"BRBNMPL बाबत: (I) RBI ची पूर्ण मालकीची उपकंपनी. (II) म्हैसूर व सालबोनी येथे नोटा छपाई प्रकल्प. (III) 1995 मध्ये स्थापना.",q_english:"About BRBNMPL: (I) Wholly-owned RBI subsidiary. (II) Banknote printing at Mysuru and Salboni. (III) Established 1995.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. भारतीय रिझर्व्ह बँक नोट मुद्रण प्रा. लि. (बंगळूर नोंदणीकृत) म्हैसूर (कर्नाटक) व सालबोनी (प. बंगाल) येथे आधुनिक नोटा छापते."},{section:7,subtopic:"Currency presses Nashik Dewas",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) नाशिक (b) देवास (c) म्हैसूर (d) सालबोनी — (i) BRBNMPL (ii) SPMCIL-नोटा (iii) SPMCIL-शाई+नोटा (iv) BRBNMPL",q_english:"Match: (a) Nashik (b) Dewas (c) Mysuru (d) Salboni — (i) BRBNMPL (ii) SPMCIL-notes (iii) SPMCIL-ink+notes (iv) BRBNMPL",options:["a-ii, b-iii, c-i, d-iv","a-iii, b-ii, c-i, d-iv","a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv"],correct_index:0,explanation_marathi:"नाशिक व देवास (SPMCIL — देवासमध्ये शाई कारखानाही), म्हैसूर व सालबोनी (BRBNMPL/RBI). नाणी — मुंबई, कोलकाता, हैदराबाद, नोएडा टाकसाळींत."},{section:7,subtopic:"Interest Equalisation Scheme",qtype:"बहु-विधान",q_marathi:"व्याज समानीकरण योजनेबाबत: (I) निर्यातदारांना कर्जावर व्याज सवलत. (II) MSME निर्यातदारांना 3-5% सवलत. (III) वाणिज्य मंत्रालयाची योजना.",q_english:"About Interest Equalisation Scheme: (I) Interest rebate on export credit. (II) 3-5% rebate for MSME exporters. (III) Commerce Ministry scheme.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. 2015 पासूनची ही योजना रुपया निर्यात कर्जावरील व्याज कमी करून MSME व कामगारप्रधान क्षेत्रांच्या स्पर्धात्मकतेसाठी आहे."},{section:8,subtopic:"Pineal gland melatonin",qtype:"बहु-विधान",q_marathi:"पिनियल ग्रंथीबाबत: (I) ती मेंदूत स्थित अंतःस्रावी ग्रंथी आहे. (II) मेलाटोनिन स्रवून झोप-जागृती चक्र नियंत्रित करते. (III) प्रकाशाच्या संवेदनशीलतेनुसार स्राव बदलतो.",q_english:"About pineal gland: (I) An endocrine gland in the brain. (II) Secretes melatonin regulating sleep-wake cycle. (III) Secretion varies with light sensitivity.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. पिनियल (डेकार्टेची 'आत्म्याची बैठक') अंधारात मेलाटोनिन वाढवते — म्हणूनच रात्री झोप येते आणि प्रवासातील जेटलॅगवर मेलाटोनिन वापरतात."},{section:8,subtopic:"Thymus Parathyroid Pancreas hormones",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) थायमस (b) पॅराथायरॉइड (c) स्वादुपिंड बीटा पेशी — (i) PTH-कॅल्शियम (ii) थायमोसिन (iii) इन्सुलिन",q_english:"Match: (a) Thymus (b) Parathyroid (c) Pancreatic beta cells — (i) PTH-calcium (ii) Thymosin (iii) Insulin",options:["a-ii, b-i, c-iii","a-i, b-ii, c-iii","a-ii, b-iii, c-i","a-iii, b-i, c-ii"],correct_index:0,explanation_marathi:"थायमस (थायमोसिन — T-पेशी परिपक्वता), पॅराथायरॉइड (PTH — रक्तातील कॅल्शियम वाढवते) आणि बीटा पेशी (इन्सुलिन — रक्तशर्करा कमी करते)."},{section:8,subtopic:"Digestive enzymes order",qtype:"कालक्रम",q_marathi:"अन्ननलिकेतील पचनक्रियेनुसार एन्झाइम्सचा क्रम लावा: (a) ट्रिप्सिन (b) लाळेतील अमायलेज (c) लायपेज (d) पेप्सिन",q_english:"Arrange digestive enzymes in food-passage order: (a) Trypsin (b) Salivary amylase (c) Lipase (d) Pepsin",options:["b-d-a-c","d-b-a-c","b-a-d-c","a-b-d-c"],correct_index:0,explanation_marathi:"तोंड (अमायलेज — पिष्टमय), जठर (पेप्सिन — प्रथिने, आम्ल माध्यम), स्वादुपिंड रस (ट्रिप्सिन) व आतडे (लायपेज — स्निग्ध). क्रम b-d-a-c."},{section:8,subtopic:"Lymphatic system",qtype:"विधान-कारण",q_marathi:"विधान (A): लसीका प्रणाली ही रक्ताभिसरणाची पूरक प्रणाली आहे. कारण (R): ती ऊतक द्रव परत रक्तात आणते आणि रोगप्रतिकारक पेशींचे वहन करते.",q_english:"Assertion (A): The lymphatic system complements blood circulation. Reason (R): It returns tissue fluid to blood and transports immune cells.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. लसीका ग्रंथींमध्ये (मान, काख) B/T पेशी रोगजंतूंशी लढतात — म्हणून संसर्गात ग्रंथी सुजतात."},{section:8,subtopic:"Spleen",qtype:"बहु-विधान",q_marathi:"प्लीहा (spleen) बाबत: (I) तिला 'RBC चे स्मशान' म्हणतात. (II) गर्भावस्थेत रक्तपेशी निर्मिती करते. (III) रोगप्रतिकारशक्तीत भूमिका असते.",q_english:"About spleen: (I) Called 'graveyard of RBCs'. (II) Produces blood cells in foetal stage. (III) Has a role in immunity.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. प्लीहा जुन्या RBC नष्ट करते (120 दिवस आयुष्य), गर्भात रक्तनिर्मिती आणि पांढऱ्या गरात (white pulp) लसीका पेशींद्वारे रोगप्रतिकार."},{section:8,subtopic:"Ear parts outer middle inner",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा — कानाचे भाग: (a) बाह्य कर्ण (b) मध्य कर्ण (c) अंतःकर्ण — (i) कर्णपटल-घन-मुद्गर-रकेक (ii) कर्णपाळी-नलिका (iii) कर्णावर्त-तोल",q_english:"Match — ear parts: (a) Outer ear (b) Middle ear (c) Inner ear — (i) Eardrum-malleus-incus-stapes (ii) Pinna-canal (iii) Cochlea-balance",options:["a-ii, b-i, c-iii","a-i, b-ii, c-iii","a-ii, b-iii, c-i","a-iii, b-i, c-ii"],correct_index:0,explanation_marathi:"बाह्य (पाळी+नलिका — ध्वनी संकलन), मध्य (पटल+तीन हाडे — कंपन वाढवणे) आणि अंतः (कर्णावर्त — ऐकणे, अर्धवर्तुळाकार नलिका — तोल) अशी रचना आहे."},{section:8,subtopic:"Tissue types",qtype:"कालक्रम",q_marathi:"खालील ऊतकांची उदाहरणे योग्य गटात लावा — योग्य क्रम ओळखा: (a) अस्थि (b) रक्त (c) त्वचेचा बाह्यस्तर (d) स्नायू — अभ्यासी, संयोजी, स्नायू, चेता या क्रमाने",q_english:"Classify tissues in order — epithelial, connective, muscular, nervous: (a) Bone (b) Blood (c) Skin outer layer (d) Muscle",options:["c-a-d-b","c-b-d-a","a-c-d-b","c-a-b-d"],correct_index:0,explanation_marathi:"अभ्यासी (c — त्वचा), संयोजी (a — अस्थि; रक्तही संयोजीच), स्नायू (d) असा क्रम. रक्त हे द्रवरूप संयोजी ऊतक आहे हे लक्षात ठेवा."},{section:8,subtopic:"Minerals iron calcium iodine zinc",qtype:"विधान-कारण",q_marathi:"विधान (A): आयोडीनच्या कमतरतेमुळे गॉयटर होतो. कारण (R): आयोडीन हा थायरॉक्सिन संप्रेरकाचा घटक असून त्याच्या अभावी थायरॉइड ग्रंथी सुजते.",q_english:"Assertion (A): Iodine deficiency causes goitre. Reason (R): Iodine is a component of thyroxine; its lack swells the thyroid gland.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. त्याचप्रमाणे लोह (अ‍ॅनिमिया), कॅल्शियम (अस्थि) व झिंक (रोगप्रतिकार) यांची कमतरता विशिष्ट विकार घडवते."},{section:8,subtopic:"Pollination types",qtype:"बहु-विधान",q_marathi:"परागणाबाबत: (I) स्वपरागणात एकाच फुलातील परागकण स्त्रीकेसरावर पडतात. (II) परपरागणासाठी वारा, कीटक, पक्षी, पाणी माध्यमे असतात. (III) परपरागणामुळे आनुवंशिक विविधता वाढते.",q_english:"About pollination: (I) In self-pollination, pollen falls on stigma of the same flower. (II) Agents of cross-pollination: wind, insects, birds, water. (III) Cross-pollination increases genetic diversity.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. वायुपरागण (अ‍ॅनिमोफिली), कीटकपरागण (एंटोमोफिली), पक्षी (ऑर्निथोफिली) आणि जलपरागण (हायड्रोफिली) हे प्रकार; परपरागण उत्क्रांतीसाठी महत्त्वाचे."},{section:8,subtopic:"Seed germination epigeal hypogeal",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) भूम्युपरिक अंकुरण (b) भूम्यधरिक अंकुरण — (i) मका, वाटाणा (ii) भुईमूग, एरंड (iii) बीजपत्रे जमिनीवर येतात (iv) बीजपत्रे जमिनीखाली राहतात",q_english:"Match: (a) Epigeal germination (b) Hypogeal germination — (i) Maize, pea (ii) Groundnut, castor (iii) Cotyledons come above soil (iv) Cotyledons stay below soil",options:["a-iii, b-iv (उदा. a-ii, b-i)","a-iv, b-iii","a-i, b-ii","a-ii, b-iv"],correct_index:0,explanation_marathi:"भूम्युपरिक (भुईमूग, एरंड — बीजपत्रे वर येतात) आणि भूम्यधरिक (मका, वाटाणा — बीजपत्रे खालीच राहतात) असे दोन प्रकार आहेत."},{section:8,subtopic:"Genetic concepts DNA codons operon",qtype:"कालक्रम",q_marathi:"आण्विक जीवशास्त्रातील संकल्पनांचा शोधक्रम लावा: (a) DNA दुहेरी कुंतल (b) आनुवंशिक संकेत (c) लॅक ऑपेरॉन (d) सेंट्रल डोग्मा",q_english:"Arrange molecular biology discoveries: (a) DNA double helix (b) Genetic code (c) Lac operon (d) Central dogma",options:["a-d-b-c","d-a-b-c","a-b-d-c","b-a-d-c"],correct_index:0,explanation_marathi:"वॉटसन-क्रिक (1953), सेंट्रल डोग्मा (क्रिक, 1958), आनुवंशिक संकेत उकल (निरेनबर्ग, 1960s) आणि लॅक ऑपेरॉन (जेकब-मोनॉड, 1961). क्रम a-d-b-c."},{section:8,subtopic:"Lac operon",qtype:"विधान-कारण",q_marathi:"विधान (A): लॅक ऑपेरॉन हे प्रोकॅरियोटिक जनुक नियमनाचे उत्कृष्ट उदाहरण आहे. कारण (R): लॅक्टोजच्या उपस्थितीत रिप्रेसर निष्क्रिय होऊन संरचनात्मक जनुके (lacZ, lacY, lacA) व्यक्त होतात.",q_english:"Assertion (A): The lac operon is a classic example of prokaryotic gene regulation. Reason (R): In presence of lactose, the repressor is inactivated and structural genes (lacZ, lacY, lacA) are expressed.",options:["A आणि R दोन्ही बरोबर, R हे A चे बरोबर स्पष्टीकरण / Both true, R explains A","A आणि R दोन्ही बरोबर पण R हे A चे स्पष्टीकरण नाही / Both true, R does not explain A","A बरोबर, R चूक / A true, R false","A चूक, R बरोबर / A false, R true"],correct_index:0,explanation_marathi:"दोन्ही बरोबर असून R हे A चे स्पष्टीकरण आहे. जेकब व मोनॉड (1961, नोबेल 1965) यांनी E. coli मधील ही प्रेरणीय (inducible) प्रणाली स्पष्ट केली."},{section:8,subtopic:"Genetic code codons",qtype:"बहु-विधान",q_marathi:"आनुवंशिक संकेताबाबत: (I) AUG हा प्रारंभ कोडॉन (मेथिओनिन). (II) UAA, UAG, UGA हे समापन कोडॉन. (III) संकेत अपभ्रष्ट (degenerate) असतो — एक अमिनो आम्ल अनेक कोडॉन.",q_english:"About genetic code: (I) AUG is the start codon (methionine). (II) UAA, UAG, UGA are stop codons. (III) The code is degenerate — one amino acid, many codons.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. 64 कोडॉनपैकी 61 अर्थपूर्ण, 3 समापन; अपभ्रष्टता, असंदिग्धता व सार्वत्रिकता हे संकेताचे गुणधर्म आहेत."},{section:8,subtopic:"Glass types",qtype:"जोड्या लावा",q_marathi:"जोड्या लावा: (a) सोडा-लाइम काच (b) बोरोसिलिकेट काच (c) फ्लिंट काच — (i) प्रयोगशाळा (पायरेक्स) (ii) खिडक्या-बाटल्या (iii) प्रकाशीय उपकरणे",q_english:"Match: (a) Soda-lime glass (b) Borosilicate glass (c) Flint glass — (i) Laboratory (Pyrex) (ii) Windows-bottles (iii) Optical instruments",options:["a-ii, b-i, c-iii","a-i, b-ii, c-iii","a-ii, b-iii, c-i","a-iii, b-i, c-ii"],correct_index:0,explanation_marathi:"सोडा-लाइम (स्वस्त, दैनंदिन), बोरोसिलिकेट (उष्णता-रासायनिक प्रतिरोधक — पायरेक्स) आणि फ्लिंट/शिशाची काच (उच्च अपवर्तनांक — लेन्स, प्रिझम) असे प्रकार आहेत."},{section:8,subtopic:"Endocrine glands overview",qtype:"बहु-विधान",q_marathi:"अंतःस्रावी ग्रंथींबाबत: (I) पिट्युटरी ही 'मास्टर ग्रंथी'. (II) हायपोथालेमस हा मेंदू-अंतःस्रावी दुवा. (III) थायमस बालपणानंतर आकुंचन पावते.",q_english:"About endocrine glands: (I) Pituitary is the 'master gland'. (II) Hypothalamus links brain and endocrine system. (III) Thymus shrinks after childhood.",options:["I आणि II फक्त / I and II only","I, II आणि III / I, II and III","II आणि III फक्त / II and III only","I आणि III फक्त / I and III only"],correct_index:1,explanation_marathi:"तिन्ही बरोबर. हायपोथालेमस-पिट्युटरी अक्ष सर्व ग्रंथींवर नियंत्रण ठेवतो आणि थायमस तारुण्यानंतर चरबीत रूपांतरित होतो (थायमोसिन घटते)."}],hr=["A","B","C","D"];function U0(e){return ci.find((t)=>t.id===e)}function di(){let[e,t]=vr.useState({}),[n,r]=vr.useState({}),{attempted:l,correct:u}=vr.useMemo(()
