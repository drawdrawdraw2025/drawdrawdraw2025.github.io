<header><h1>📝 तलाठी MPSC 2026 – संच C (90 प्रश्न) - 5th Quiz (New)</h1><p>विभाग 3 ते 8 • प्रत्येकी 15 • कठीणता 5/5 • उत्तर डीफॉल्ट लपलेले • 100% नवीन</p></header><div class='filters' id='filters'></div><div class='container'><div class='progress' id='progress'></div><div id='quiz'></div></div><script>const QUESTIONS_C = [{"section": 3, "subtopic": "BRICS 2025 विस्तार", "qtype": "कारण-परिणाम", "q_marathi": "कारण (R): जानेवारी 2025 मध्ये इंडोनेशिया BRICS चा पूर्ण सदस्य झाला. परिणाम (A): जुलै 2025 च्या रिओ शिखर परिषदेत BRICS मध्ये प्रथमच आग्नेय आशियाई प्रतिनिधित्व समाविष्ट होऊन पेमेंट्स व ऊर्जा सुरक्षेवरील ग्लोबल साउथ अजेंडा बळकट झाला. योग्य कार्यकारण संबंध निवडा.", "q_english": "Reason (R): Indonesia became a full BRICS member in January 2025. Effect (A): At the July 2025 Rio summit, BRICS included Southeast Asian representation for the first time, strengthening the Global South agenda on payments and energy security. Choose the correct causal relation.", "options": ["R व A दोन्ही सत्य; A हा R चा तार्किक परिणाम आहे", "R व A दोन्ही सत्य; पण A हा R चा परिणाम नाही", "R सत्य, A असत्य; आग्नेय आशियाई प्रतिनिधित्व झाले नाही", "R असत्य (इंडोनेशिया 2024 मध्येच सदस्य झाला), A सत्य"], "correct_index": 0, "explanation_marathi": "इंडोनेशिया जानेवारी 2025 मध्ये पूर्ण सदस्य झाले (ब्राझील अध्यक्षता घोषणेनुसार) व तो पहिला ASEAN सदस्य आहे; त्यामुळे रिओ 2025 मध्ये ग्लोबल साउथचा आवाज वाढणे हा थेट परिणाम आहे. इतर पर्याय तारीख चुकवतात किंवा प्रतिनिधित्व नाकारतात.", "evidence": "Brazil BRICS 2025 presidency press release Jan 2025 on Indonesia full membership; BRICS Rio de Janeiro Declaration July 2025; MRE/MEA notes."}, {"section": 3, "subtopic": "Digital India BHASHINI", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा : A-BHASHINI नोडल मंत्रालय, B-लक्ष्य भाषा, C-तंत्रज्ञान, D-छत्र कार्यक्रम. पर्याय : 1-MeitY, 2-22 अनुसूचित भाषा, 3-AI/NLP भाषांतर, 4-Digital India.", "q_english": "Match: A-BHASHINI nodal ministry, B-target languages, C-technology, D-umbrella programme. Options: 1-MeitY, 2-22 scheduled languages, 3-AI/NLP translation, 4-Digital India.", "options": ["A-1, B-2, C-3, D-4", "A-4, B-2, C-3, D-1", "A-1, B-3, C-2, D-4", "A-2, B-1, C-3, D-4"], "correct_index": 0, "explanation_marathi": "बरोबर : A-1 (MeitY), B-2 (22 भाषा), C-3 (AI/NLP), D-4 (Digital India). इतर पर्याय मंत्रालय/कार्यक्रम वा भाषा/तंत्रज्ञान अदलाबदल करतात म्हणून चूक.", "evidence": "MeitY - BHASHINI: National Language Translation Mission under Digital India, 22 scheduled languages, AI/NLP"}, {"section": 3, "subtopic": "G7 2026 भारत सहभाग", "qtype": "कालक्रम लावा", "q_marathi": "भारताच्या G7 सहभागाशी संबंधित घटनांचा योग्य कालक्रम लावा: (a) हिरोशिमा G7 (2023) मध्ये ग्लोबल साउथ प्रतिनिधित्व, (b) अपुलिया G7 (2024, 50वी) मध्ये भारताचा आउटरीच सहभाग, (c) कानानास्किस G7 (2025, 51वी) मध्ये सहभाग, (d) अमेरिका अध्यक्षतेखालील G7 (2026, 52वी) च्या AI-ऊर्जा अजेंड्याची घोषणा.", "q_english": "Arrange in chronological order India's G7 engagement events: (a) Hiroshima G7 (2023) Global South outreach, (b) Apulia G7 (2024, 50th) India's outreach participation, (c) Kananaskis G7 (2025, 51st) participation, (d) announcement of AI-energy agenda for US-presided G7 (2026, 52nd).", "options": ["a-b-c-d", "a-c-b-d", "b-a-c-d", "a-b-d-c"], "correct_index": 0, "explanation_marathi": "योग्य क्रम a-b-c-d आहे; G7 क्रम 2023 हिरोशिमा → 2024 अपुलिया (50वी) → 2025 कानानास्किस (51वी) → 2026 अमेरिका (52वी) असा आहे. इतर पर्यायांत b-c अदलाबदलाने 2024-25 उलटतो किंवा d मध्ये टाकल्याने 2026 ची घोषणा आधी दाखवली जाते, जे चूक आहे.", "evidence": "G7 official summit archives (2023 Hiroshima, 2024 Apulia 50th, 2025 Kananaskis 51st); US State Dept G7 2026 presidency announcement; MEA press releases on India's outreach participation."}, {"section": 3, "subtopic": "ISRO NISAR 2025 प्रक्षेपण", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 30 जुलै 2025 रोजी GSLV-F16 ने श्रीहरिकोटा येथून NISAR प्रक्षेपित केला; हा NASA व ISRO यांचा पहिला संयुक्त पृथ्वी निरीक्षण उपग्रह आहे. कारण (R): NISAR मध्ये NASA चा L-बँड व ISRO चा S-बँड असे दुहेरी-वारंवारता SAR रडार NASA च्या 12-मीटर जाळीदार अँटेनासह बसवले आहे. योग्य पर्याय निवडा:", "q_english": "Assertion (A): On 30 July 2025, GSLV-F16 launched NISAR from Sriharikota; it is the first joint NASA–ISRO Earth observation satellite. Reason (R): NISAR carries a dual-frequency SAR — NASA's L-band and ISRO's S-band — with NASA's 12-metre mesh reflector antenna. Choose the correct option:", "options": ["(a) A व R दोन्ही सत्य, आणि R हे A चे योग्य स्पष्टीकरण आहे", "(b) A व R दोन्ही सत्य, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "(c) A सत्य, R असत्य", "(d) A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A सत्य: 2392 kg चा NISAR 743 km सूर्य-समकालिक कक्षेत, पहिली संयुक्त NASA-ISRO मोहीम. R सत्य: L+S बँड SAR, 12m अँटेना. परंतु R तांत्रिक रचना स्पष्ट करते, 'पहिली संयुक्त मोहीम' या ऐतिहासिक दाव्याचे कारण नाही. म्हणून (a) चूक; (c)/(d) तथ्यदृष्ट्या चूक.", "evidence": "ISRO (isro.gov.in): GSLV-F16 to inject 2392 kg NISAR into 743 km sun-synchronous orbit; first satellite with dual-frequency SAR (NASA L-band + ISRO S-band) using NASA's 12m unfurlable mesh antenna on ISRO's modified I3K bus; launched 30 July 2025 from SDSC Sriharikota (The Hindu, Akashvani)."}, {"section": 3, "subtopic": "PM किसान 20वा हप्ता 2026", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "अ : PM-KISAN 20वा हप्ता 2 ऑगस्ट 2025 रोजी वाराणसीतून DBT द्वारे 9.7 कोटी शेतकऱ्यांना ₹2,000 प्रमाणे ₹20,500 कोटी वितरित. ब : हप्त्यासाठी e-KYC बंधनकारक असून ती फक्त CSC केंद्रातील बायोमेट्रिकद्वारेच करता येते. योग्य पर्याय निवडा.", "q_english": "A: 20th PM-KISAN instalment on 2 Aug 2025 from Varanasi - Rs 20,500 cr to 9.7 cr farmers @Rs 2,000 via DBT. B: e-KYC is mandatory and can be done only via biometric at CSC. Choose correct option.", "options": ["अ बरोबर, ब बरोबर", "अ बरोबर, ब चूक (OTP, फेस-ऑथ ॲपद्वारेदेखील शक्य)", "अ चूक (₹21,000 कोटी), ब बरोबर", "अ चूक (8.5 कोटी लाभार्थी), ब चूक"], "correct_index": 1, "explanation_marathi": "अ बरोबर : 20वा हप्ता वाराणसी, ₹20,500 कोटी, 9.7 कोटी, ₹2,000. ब चूक : e-KYC OTP, बायोमेट्रिक व फेस-ऑथ ॲपनेही होते. त्यामुळे पर्याय 2 बरोबर; इतर पर्याय रक्कम/लाभार्थी/पद्धत चुकवतात.", "evidence": "PIB 02-Aug-2025 - PM releases 20th PM-KISAN instalment at Varanasi; pmkisan.gov.in e-KYC: OTP/biometric/face-auth modes"}, {"section": 3, "subtopic": "RBI 2026 पतधोरण आढावा", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "RBI च्या फेब्रुवारी 2026 पतधोरण आढाव्यातील विधाने तपासा: (I) MPC ने एकमताने रेपो दर 5.25% वर कायम ठेवला व भूमिका 'तटस्थ'च राहिली. (II) FY26 GDP अंदाज 7.3% वरून 7.4% पर्यंत वाढवला; CPI महागाई अंदाज 2.6% वरून 2.0% पर्यंत घटवला. (III) SDF दर 5.00% व MSF दर 5.50% राहिला. योग्य पर्याय निवडा:", "q_english": "Examine these statements on RBI's February 2026 monetary policy review: (I) The MPC unanimously kept the repo rate at 5.25% and the stance 'neutral'. (II) The FY26 GDP forecast was raised from 7.3% to 7.4%, while the CPI inflation forecast was cut from 2.6% to 2.0%. (III) The SDF rate stayed at 5.00% and the MSF rate at 5.50%. Choose the correct option:", "options": ["(a) I, II आणि III — सर्व विधाने सत्य", "(b) केवळ I व II सत्य", "(c) केवळ I व III सत्य", "(d) केवळ II व III सत्य"], "correct_index": 2, "explanation_marathi": "I व III सत्य: 6 फेब्रुवारी 2026 रोजी एकमताने रेपो 5.25% कायम, भूमिका तटस्थ; SDF 5.00%, MSF 5.50%. II असत्य: महागाई अंदाज 2% वरून 2.1% पर्यंत वाढवला, घटवला नाही (GDP 7.4% बरोबर). म्हणून (a), (b), (d) चुकतात.", "evidence": "RBI MPC 6 Feb 2026: repo unchanged at 5.25% unanimously, stance 'neutral' (Moneycontrol, Livemint); FY26 GDP forecast raised to 7.4% from 7.3%, CPI inflation revised UP to 2.1% from 2% (Indian Express); SDF 5.00%, MSF/Bank Rate 5.50% (News18)."}, {"section": 3, "subtopic": "UNESCO भारत वारसा 2025", "qtype": "बहु-विधान", "q_marathi": "विधाने : I-मराठा मिलिटरी लँडस्केप्स 2025 मध्ये भारताचे 44वे जागतिक वारसा स्थळ. II-12 किल्ले : 11 महाराष्ट्र + 1 तामिळनाडू (जिंजी). III-2024 मध्ये अहोम मोइदम 43वे स्थळ होते. योग्य पर्याय निवडा.", "q_english": "Statements: I-Maratha Military Landscapes inscribed 2025 as India's 44th WHS. II-12 forts: 11 Maharashtra + 1 Tamil Nadu (Gingee). III-Ahom Moidams was 43rd in 2024. Choose correct.", "options": ["I, II बरोबर; III चूक", "II, III बरोबर; I चूक", "I, II, III सर्व बरोबर", "I, III बरोबर; II चूक (सर्व 12 महाराष्ट्रात)"], "correct_index": 2, "explanation_marathi": "तिन्ही बरोबर : 44वे स्थळ 2025, जिंजी तामिळनाडूत, अहोम 43वे 2024. पर्याय 1,2,4 एक विधान चूक ठरवतात; जिंजी महाराष्ट्राबाहेर हे कळीचे.", "evidence": "UNESCO 47th Session July 2025 - Maratha Military Landscapes as 44th WHS; PIB: 12 forts incl. Gingee (TN)"}, {"section": 3, "subtopic": "खेलो इंडिया 2025", "qtype": "Assertion-Reason", "q_marathi": "विधान (A) : 7व्या खेलो इंडिया युवा क्रीडा 2025 बिहारमध्ये झाल्या, महाराष्ट्र पदकतालिकेत प्रथम. कारण (R) : खेलो इंडिया 2018 मध्ये सुरू, युवा स्पर्धा दरवर्षी वेगळ्या राज्यात होतात.", "q_english": "Assertion (A): 7th Khelo India Youth Games 2025 held in Bihar, Maharashtra topped tally. Reason (R): Khelo India launched 2018, youth games held in different states yearly.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A सत्य (बिहार, महाराष्ट्र प्रथम), R सत्य (2018 पासून). पण R मुळे बिहार निवड वा महाराष्ट्राचे प्रथम येणे स्पष्ट होत नाही, म्हणून स्पष्टीकरण नाही; इतर पर्याय सत्यता चुकवतात.", "evidence": "PIB May 2025 - 7th Khelo India Youth Games Bihar; medal tally Maharashtra 1st; SAI: Khelo India launched 2018"}, {"section": 3, "subtopic": "जागतिक बँक भारत GDP अंदाज 2026", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): जागतिक बँकेने जून 2025 च्या 'Global Economic Prospects' अहवालात FY26 साठी भारताचा GDP वाढीचा अंदाज 6.7% वरून 6.3% पर्यंत घटवला; व्यापार भागीदारांतील कमकुवत क्रियाशीलता व वाढत्या व्यापार अडथळ्यांमुळे निर्यात मंदावली. परिणाम (E): तरीही भारत जगातील सर्वात वेगाने वाढणारी प्रमुख अर्थव्यवस्था राहील, असा अंदाज व्यक्त केला. योग्य संबंध निवडा:", "q_english": "Cause (C): In its June 2025 Global Economic Prospects report, the World Bank cut India's FY26 GDP growth forecast from 6.7% to 6.3%, citing slower exports from weak partner activity and rising trade barriers. Effect (E): India was still projected to remain the world's fastest-growing major economy. Choose the correct relationship:", "options": ["(a) C व E दोन्ही सत्य, आणि E हा C चा तार्किक परिणाम आहे", "(b) C व E दोन्ही सत्य, परंतु E हा C चा तार्किक परिणाम नाही", "(c) C सत्य, E असत्य", "(d) C असत्य, E सत्य"], "correct_index": 1, "explanation_marathi": "C सत्य: जून 2025 GEP मध्ये 6.3% (एप्रिलची कपात कायम), कारणे बरोबर. E सत्य: सर्वात वेगवान प्रमुख अर्थव्यवस्था. परंतु E हा C चा परिणाम नाही — दोन्ही स्वतंत्र निरीक्षणे; E देशांतर्गत मागणीच्या बळावर टिकते. म्हणून (a) चूक; (c)/(d) तथ्यदृष्ट्या चूक.", "evidence": "World Bank Global Economic Prospects June 2025 (Washington, 10 Jun 2025): India FY26 growth retained at 6.3% (cut 40 bps in April from 6.7% January forecast); reason: weaker export performance of key trading partners and rising global trade barriers (Indian Express, Business Today, Mint)."}, {"section": 3, "subtopic": "भारत लोकसंख्या 2026 अंदाज", "qtype": "नकाशा आधारित", "q_marathi": "2026 अंदाजित लोकसंख्या नकाशात गडद छटा (>1000/चौ.कि.मी. घनता) पूर्व गंगा मैदानात व हलकी छटा (<1% वार्षिक वृद्धिदर) दक्षिणेत दिसते. या अवकाशीय नमुन्याशी सुसंगत गट कोणता?", "q_english": "In the projected 2026 population map, dark shades (>1000/sq.km density) concentrate in the eastern Gangetic plain while light shades (<1% annual growth) appear in the south. Which group matches this spatial pattern?", "options": ["अति-घनता: बिहार, पश्चिम बंगाल, उ.प्रदेश; कमी-वृद्धी: केरळ, तमिळनाडू", "अति-घनता: राजस्थान, म.प्रदेश, गुजरात; कमी-वृद्धी: बिहार, उ.प्रदेश", "अति-घनता: केरळ, तमिळनाडू, कर्नाटक; कमी-वृद्धी: बिहार, झारखंड", "अति-घनता: बिहार, पश्चिम बंगाल; कमी-वृद्धी: राजस्थान, म.प्रदेश"], "correct_index": 0, "explanation_marathi": "UN WPP व जनगणना प्रक्षेपणांनुसार बिहार/बंगाल/UP मध्ये घनता सर्वाधिक (>1000) व केरळ/तामिळनाडूत TFR प्रतिस्थापनेखाली असल्याने वृद्धिदर <1% आहे. इतर पर्याय घनता-वृद्धिदर अदलाबदल करून नमुना उलटवतात.", "evidence": "UN World Population Prospects 2024 (India 2026 ~1.45 bn); Census Technical Group population projections; SRS 2020-22 TFR data (Kerala, Tamil Nadu below replacement)."}, {"section": 3, "subtopic": "भारत-ऑस्ट्रेलिया CECA 2026", "qtype": "कालक्रम लावा", "q_marathi": "भारत-ऑस्ट्रेलिया आर्थिक सहकार्यातील घटनांचा योग्य कालक्रम लावा: (1) Ind-Aus ECTA वर स्वाक्षऱ्या (2) ECTA करार अंमलात येणे (3) ECTA अंतर्गत सर्व भारतीय निर्यातींना ऑस्ट्रेलियात शून्य-शुल्क प्रवेश (4) ECTA स्वाक्षरीची चौथी वर्षपूर्ती. योग्य क्रम निवडा:", "q_english": "Arrange these India–Australia economic cooperation events in correct chronological order: (1) Signing of Ind-Aus ECTA (2) ECTA coming into force (3) Zero-duty access in Australia for all Indian exports under ECTA (4) Fourth anniversary of ECTA signing. Choose the correct sequence:", "options": ["(a) 1–2–3–4", "(b) 1–2–4–3", "(c) 2–1–3–4", "(d) 1–3–2–4"], "correct_index": 0, "explanation_marathi": "ECTA स्वाक्षरी 2 एप्रिल 2022 (1), अंमलबजावणी 29 डिसेंबर 2022 (2), 1 जानेवारी 2026 पासून शून्य-शुल्क (3), चौथी वर्षपूर्ती 2 एप्रिल 2026 (4). (b)त (3)-(4) क्रम उल्टा, (c)त स्वाक्षरीपूर्वी अंमलबजावणी अशक्य, (d)त करारापूर्वीच लाभ मिळणे अशक्य.", "evidence": "PIB 2 Apr 2026: Ind-Aus ECTA signed 2 Apr 2022, in force 29 Dec 2022, four years completed; Blitz India Media: from 1 Jan 2026 all Indian exports eligible for zero-duty access under ECTA."}, {"section": 3, "subtopic": "महाराष्ट्र महिला धोरण 2025", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता : A-पहिले महिला धोरण 1994 (देशात पहिले राज्य) | B-महिला धोरण 2025 हे 4थे धोरण | C-नोडल विभाग महिला व बाल विकास | D-लक्ष्य SDG-5 नुसार 2030 पर्यंत सक्षमीकरण. योग्य संच निवडा.", "q_english": "Table: A-First women policy 1994 (first state) | B-Women Policy 2025 is 4th policy | C-Nodal dept WCD | D-Goal empowerment by 2030 per SDG-5. Choose correct set.", "options": ["A, B बरोबर; C, D चूक", "A, B, C बरोबर; D चूक (लक्ष्य 2035)", "A, B, C, D सर्व बरोबर", "B, C, D बरोबर; A चूक (पहिले 2001)"], "correct_index": 2, "explanation_marathi": "सर्व बरोबर : 1994 पहिले धोरण, 2025 हे 4थे, नोडल WCD, 2030 लक्ष्य. पर्याय 1,2,4 मध्ये C/D/A चूक ठरवल्याने ते बाद; 2035 व 2001 ही वर्षे चुकीची.", "evidence": "Maharashtra Cabinet 2025 GR - 4th Women Policy; State WCD note: first policy 1994, first state in India"}, {"section": 3, "subtopic": "महाराष्ट्र मुख्यमंत्री युवा कार्य प्रशिक्षण", "qtype": "जोड्या लावा", "q_marathi": "मुख्यमंत्री युवा कार्य प्रशिक्षण योजनेच्या घटकांच्या योग्य जोड्या लावा: (a) 12वी उत्तीर्ण (b) ITI/पदविका (c) पदवीधर/पदव्युत्तर (d) पात्र वयोगट — (i) ₹8,000/महिना (ii) ₹6,000/महिना (iii) 18–35 वर्षे (iv) ₹10,000/महिना. योग्य पर्याय निवडा:", "q_english": "Match correctly the components of the Mukhyamantri Yuva Karya Prashikshan Yojana: (a) Class 12 passed (b) ITI/Diploma (c) Graduate/Post-graduate (d) Eligible age group — (i) ₹8,000/month (ii) ₹6,000/month (iii) 18–35 years (iv) ₹10,000/month. Choose the correct option:", "options": ["(a) a-ii, b-i, c-iv, d-iii", "(b) a-i, b-iii, c-ii, d-iv", "(c) a-ii, b-iii, c-i, d-iv", "(d) a-iv, b-ii, c-i, d-iii"], "correct_index": 0, "explanation_marathi": "योग्य जोड्या: 12वी–₹6,000 (a-ii), ITI/पदविका–₹8,000 (b-i), पदवीधर–₹10,000 (c-iv), वयोगट 18–35 (d-iii). (b)त 12वीला चुकून ₹8,000, (c)त पदवीधराला ₹8,000, तर (d)त तिन्ही मानधने उलटे आहेत.", "evidence": "cmypky.mahaswayam.gov.in: monthly stipend ₹6,000/₹8,000/₹10,000 based on qualification via DBT; Economic Times: ₹6,000 for class 12, ₹8,000 for ITI/diploma; Devdiscourse: age 18–35, six months training, launched 2024-25."}, {"section": 3, "subtopic": "महाराष्ट्र रोजगार हमी 2025", "qtype": "बहु-विधान", "q_marathi": "महाराष्ट्र रोजगार हमी 2025 बाबत विधाने पहा: (I) 2025-26 मध्ये दुष्काळी भागात MGNREGA समन्वयातून 150 दिवस रोजगार तरतूद कायम राहिली. (II) राज्याने अकुशल मजुरी दर केंद्राच्या अधिसूचित दराशी संरेखित करून DBT ने 15 दिवसांत मजुरीचे उद्दिष्ट ठेवले. (III) 2025 सुधारणेनुसार शेततळे, सलग समतल चर (CCT) व वृक्षलागवड वैयक्तिक लाभार्थी कामांतून वगळली. योग्य पर्याय निवडा.", "q_english": "Consider statements on Maharashtra Employment Guarantee 2025: (I) In 2025-26, 150-day employment provision continued in drought areas via MGNREGA convergence. (II) State aligned unskilled wage rate with Centre's notified rate targeting DBT payment within 15 days. (III) Per 2025 reform, farm ponds, CCTs and plantations were excluded from individual-beneficiary works. Choose correct option.", "options": ["I व II बरोबर, III चूक", "I व III बरोबर, II चूक", "II व III बरोबर, I चूक", "I, II व III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I व II बरोबर आहेत; दुष्काळी 150 दिवस व DBT 15 दिवसांची तरतूद MGNREGA मार्गदर्शकांनुसार कायम आहे. III चूक कारण शेततळे, CCT, वृक्षलागवड ही कामे प्राधान्याने समाविष्ट आहेत, वगळलेली नाहीत; त्यामुळे फक्त पहिला पर्याय टिकतो.", "evidence": "Maharashtra EGS / MGNREGA 2025-26 implementation guidelines; MoRD MGNREGA wage notification 2025-26; Maharashtra permissible works list (farm pond, CCT, plantation)."}, {"section": 3, "subtopic": "राष्ट्रीय हरित हायड्रोजन अभियान", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "राष्ट्रीय हरित हायड्रोजन अभियान (NGHM) व SIGHT कार्यक्रम यांच्या एकत्रित आकलनावर योग्य विधान निवडा:", "q_english": "Choose the correct statement combining National Green Hydrogen Mission (NGHM) and SIGHT programme:", "options": ["NGHM उद्दिष्ट 2030 पर्यंत 5 MMT वार्षिक हरित हायड्रोजन उत्पादन; SIGHT टप्पा-I (इलेक्ट्रोलायझर) व टप्पा-II (हरित हायड्रोजन उत्पादन) प्रोत्साहन देते", "NGHM उद्दिष्ट 2030 पर्यंत 10 MMT उत्पादन; SIGHT केवळ सौर मॉड्यूलसाठी आहे", "NGHM उद्दिष्ट 2035 पर्यंत 5 MMT उत्पादन; SIGHT केवळ हरित अमोनिया आयातीसाठी आहे", "NGHM उद्दिष्ट 2030 पर्यंत 5 MMT उत्पादन; मात्र SIGHT मध्ये इलेक्ट्रोलायझरला प्रोत्साहन नाही"], "correct_index": 0, "explanation_marathi": "NGHM चे 2030 पर्यंत 5 MMT उद्दिष्ट MNRE नुसार निश्चित आहे व SIGHT मध्ये इलेक्ट्रोलायझर निर्मिती (I) + हायड्रोजन उत्पादन (II) दोन्हींना प्रोत्साहन आहे. इतर पर्याय उद्दिष्ट/वर्ष किंवा SIGHT व्याप्ती चुकवतात.", "evidence": "MNRE National Green Hydrogen Mission document (5 MMT by 2030); SIGHT Guidelines Component I & II; PIB releases 2024-25."}, {"section": 4, "subtopic": "आंबेडकर बहिष्कृत हितकारिणी 1924", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): बहिष्कृत हितकारिणी सभेची स्थापना 20 जुलै 1924 रोजी मुंबईत झाली. कारण (R): तिचा प्रारंभिक उद्देश बहिष्कृत वर्गात शिक्षण, वसतिगृहे व सांस्कृतिक उन्नतीतून स्वाभिमान जागृत करणे हा होता, राजकीय सत्याग्रह नव्हता. योग्य पर्याय निवडा.", "q_english": "Assertion (A): The Bahishkrit Hitakarini Sabha was founded on 20 July 1924 in Bombay. Reason (R): Its initial aim was self-respect through education, hostels and cultural uplift of the depressed classes, not political satyagraha. Choose the correct option.", "options": ["A आणि R दोन्ही सत्य आहेत, आणि R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य आहे, परंतु R असत्य आहे.", "A असत्य आहे, परंतु R सत्य आहे."], "correct_index": 1, "explanation_marathi": "(B) बरोबर: A (20 जुलै 1924, मुंबई) व R (शिक्षण-वसतिगृह उद्देश, सत्याग्रह नव्हता) दोन्ही सत्य, पण R हे स्थापनेच्या तारखेचे स्पष्टीकरण नाही. (A) स्पष्टीकरण मानणे चुकीचे, (C)/(D) एक विधान चूक ठरवतात जे तथ्यांविरुद्ध आहे.", "evidence": "Founding meeting 20 July 1924, Damodar Hall, Bombay under Ambedkar; Sabha's declared objects: hostels, libraries, education and cultural advancement of depressed classes; Mahad Satyagraha (1927) came later under its auspices."}, {"section": 4, "subtopic": "कान्हेरी लेणी", "qtype": "बहु-विधान", "q_marathi": "कान्हेरी लेण्यांबाबत खालील विधाने विचारात घ्या: अ) बोरिवलीजवळील कान्हेरीत हीनयान ते महायान संक्रमण दिसते. ब) येथील चैत्यगृहातील देणगी लेखांत सातवाहन काळातील श्रेष्ठी-भिक्खूंचा उल्लेख आहे. क) कान्हेरी लेणी प्रामुख्याने राष्ट्रकूट काळात कोरली गेली. योग्य पर्याय निवडा:", "q_english": "Consider statements on Kanheri caves: a) Kanheri near Borivali shows Hinayana to Mahayana transition. b) Donative inscriptions in chaityagriha mention Satavahana-era merchants-monks. c) Kanheri caves were mainly excavated in Rashtrakuta period. Choose correct option:", "options": ["अ आणि ब बरोबर, क चूक", "अ आणि क बरोबर, ब चूक", "ब आणि क बरोबर, अ चूक", "अ, ब, क सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "कान्हेरीचा काळ इ.स.पू. 1ले शतक ते इ.स. 10वे शतक; हीनयान-महायान दोन्ही टप्पे व सातवाहन देणगी लेख आढळतात. क चूक कारण मुख्य कोरीवकाम सातवाहन-कलचुरी काळातील आहे, राष्ट्रकूट नव्हे.", "evidence": "ASI Western Caves Report; Bombay Gazetteer - Kanheri inscriptions list donors of Satavahana period"}, {"section": 4, "subtopic": "गांधी चंपारण 1917 महाराष्ट्र संबंध", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता जुळवा - चंपारण (1917) घटक : (A) लखनौ 1916 मध्ये राजकुमार शुक्ल यांचे गांधींना निमंत्रण, (B) तिनकठिया पद्धतीविरुद्ध सत्याग्रह, (C) चौकशी अहवाल व चंपारण कृषी कायदा 1918; महाराष्ट्र संबंध : (1) केसरीने दिलेला पाठिंबा व राष्ट्रीय एकात्मता, (2) मुळशी सत्याग्रहासाठी (1921-24) आदर्श, (3) लखनौतील टिळक गटाच्या सक्रियतेने उपलब्ध झालेले व्यासपीठ. योग्य मेळ कोणता?", "q_english": "Match the table — Champaran (1917) components: (A) Rajkumar Shukla's invitation to Gandhi at Lucknow 1916, (B) satyagraha against tinkathia, (C) inquiry report and Champaran Agrarian Act 1918; Maharashtra link: (1) Kesari's support and national integration, (2) model for Mulshi Satyagraha (1921-24), (3) platform provided by Tilak group's activism at Lucknow. Which match is correct?", "options": ["A-3, B-2, C-1", "A-3, B-1, C-2", "A-1, B-2, C-3", "A-2, B-3, C-1"], "correct_index": 0, "explanation_marathi": "योग्य मेळ A-3, B-2, C-1 आहे: लखनौ व्यासपीठ-शुक्ल निमंत्रण, तिनकठिया-मुळशी आदर्श, अहवाल-केसरी पाठिंबा. (B)/(C)/(D) मध्ये 1-2-3 ची अदलाबदल करून चुकीच्या जोड्या दिल्या आहेत.", "evidence": "Shukla met Gandhi at Lucknow Congress Dec 1916 where Tilak's Home Rulers were active; Champaran tinkathia satyagraha became template for Maharashtra's Mulshi Satyagraha 1921-24 under Senapati Bapat; Kesari/Mahratta press supported Champaran inquiry leading to Champaran Agrarian Act 1918."}, {"section": 4, "subtopic": "टिळक होमरूल 1916", "qtype": "बहु-विधान", "q_marathi": "टिळकांच्या होमरूल चळवळीबाबत (1916) खालील विधाने तपासा: (I) 28 एप्रिल 1916 रोजी स्थापन झालेल्या टिळकांच्या लीगचे कार्यक्षेत्र महाराष्ट्र, कर्नाटक, मध्यप्रांत व वऱ्हाडपुरते होते. (II) सप्टेंबर 1916 मधील बेझंट यांची लीग अखिल भारतीय होती; दोन्हींनी लखनौ करारासाठी (डिसेंबर 1916) पूरक वातावरण तयार केले. (III) टिळकांच्या लीगचे ध्येय साम्राज्यांतर्गत स्वराज्य होते, पूर्ण स्वातंत्र्य नव्हे.", "q_english": "Examine statements on Tilak's Home Rule movement (1916): (I) Tilak's League founded 28 April 1916 worked only in Maharashtra, Karnataka, Central Provinces and Berar. (II) Besant's September 1916 League was all-India; both aided the December 1916 Lucknow Pact climate. (III) Tilak's League demanded self-government within the Empire, not complete independence.", "options": ["फक्त I बरोबर", "फक्त I आणि II बरोबर", "I, II आणि III बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "तीन्ही विधाने सत्य: (I) तारीख-क्षेत्र अचूक, (II) बेझंट लीगचा क्रम व लखनौ पूरकता अचूक, (III) साम्राज्यांतर्गत स्वराज्य हे ध्येय अचूक. त्यामुळे (C) बरोबर; (A)/(B)/(D) अपूर्ण संच देऊन एक-दोन विधाने वगळतात.", "evidence": "Tilak's Home Rule League founded 28 April 1916 (Belgaum conference, HQ Poona) for Maharashtra-Karnataka-CP-Berar; Besant's League September 1916 all-India; both campaigned for 'Home Rule/Swarajya within Empire' and built momentum for Congress-Muslim League Lucknow Pact, Dec 1916."}, {"section": 4, "subtopic": "ताराबाई करवीर सत्ता", "qtype": "कारण-परिणाम", "q_marathi": "कारण : इ.स. 1700 मध्ये राजाराम महाराजांच्या निधनानंतर ताराबाईंनी अल्पवयीन शिवाजी (द्वितीय) यांच्या नावाने सत्ता हाती घेतली; 1714 मध्ये त्यांनी राजसबाईपुत्र संभाजी (द्वितीय) यास गादीवर बसवले. या कारणाचा थेट राजकीय परिणाम कोणता?", "q_english": "Cause: After Rajaram Maharaj's death in 1700, Tarabai assumed power in the name of minor Shivaji (II); in 1714 she installed Rajasbai's son Sambhaji (II) on the throne. What was the direct political consequence of this cause?", "options": ["करवीर (कोल्हापूर) स्वतंत्र गादीची स्थापना व मराठी सत्तेचे सातारा-कोल्हापूर विभाजन", "खेडच्या लढाईत (1707) शाहूंचा पराभव व ताराबाईंचे साताऱ्यावर निर्विवाद वर्चस्व", "1707 च्या तहाने दक्षिणेची मुघल सुभेदारी ताराबाईंना प्राप्त होणे", "बाळाजी विश्वनाथ यांची पेशवेपदी नियुक्ती व साताऱ्यातून थेट कारभार"], "correct_index": 0, "explanation_marathi": "1714 मध्ये संभाजी (द्वितीय) यांची कोल्हापूर (करवीर) गादीवर स्थापना झाली व स्वराज्याचे सातारा-कोल्हापूर असे विभाजन झाले. खेड (1707) मध्ये शाहूंचा विजय झाला होता, मुघलांनी सुभेदारी दिली नाही व पेशवाई (1713) शाहूकाळातील आहे — त्यामुळे इतर पर्याय बाद.", "evidence": "Evidence: राजाराम निधन 1700 (सिंहगड); ताराबाई संरक्षक-शासन 1700–1707; 1714 कोल्हापूर (करवीर) गादी — संभाजी द्वितीय; खेडची लढाई 1707 — शाहू विजय."}, {"section": 4, "subtopic": "नाणेघाट सातवाहन", "qtype": "कालक्रम लावा", "q_marathi": "नाणेघाट-सातवाहन संदर्भातील घटनांचा योग्य कालक्रम लावा: अ) सिमुकाकडून सातवाहन सत्तास्थापना ब) नागनिकाचा नाणेघाट गुहालेख क) गौतमी बलश्रीची नाशिक प्रशस्ती ड) वाशिष्ठीपुत्र पुलुमावीचा काळ", "q_english": "Arrange chronologically: a) Simuka founds Satavahana power b) Naganika's Nanaghat cave inscription c) Gautami Balashri's Nasik prashasti d) Vasishthiputra Pulumavi's period", "options": ["अ-ब-क-ड", "ब-अ-ड-क", "अ-क-ब-ड", "ब-क-अ-ड"], "correct_index": 0, "explanation_marathi": "सिमुक (इ.स.पू. 1ले शतक) → सातकर्णी I ची पत्नी नागनिका यांचा नाणेघाट लेख → गौतमीपुत्र सातकर्णीविषयी नाशिक प्रशस्ती (इ.स. 2रे शतक) → त्याचा पुत्र पुलुमावी. म्हणून अ-ब-क-ड हाच क्रम बरोबर.", "evidence": "Epigraphia Indica Vol.10 Nanaghat inscription; Nasik Cave Inscription No.3 of Gautami Balashri"}, {"section": 4, "subtopic": "पैठण प्रतिष्ठान", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) प्रतिष्ठान ब) गाथासप्तशती क) पेरीप्लस ड) टॉलेमी 1) गोदावरीवरील सातवाहन राजधानी 2) हालाची प्राकृत कृती 3) पैठण-तगर व्यापार उल्लेख 4) पैठणचा बैठणा म्हणून उल्लेख", "q_english": "Match: a) Pratishthana b) Gathasaptashati c) Periplus d) Ptolemy 1) Satavahana capital on Godavari 2) Hala's Prakrit work 3) Paithan-Tagara trade mention 4) Paithan as Baithana", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-4, ड-3", "अ-1, ब-3, क-2, ड-4", "अ-4, ब-2, क-1, ड-3"], "correct_index": 0, "explanation_marathi": "प्रतिष्ठान म्हणजे पैठण ही सातवाहन राजधानी; गाथासप्तशती हालाची; पेरीप्लसमध्ये पैठण-तगर मार्ग; टॉलेमीकडे बैठणा उल्लेख. इतर पर्यायांत जोड्या अदलाबदल करून संभ्रम निर्माण केला आहे.", "evidence": "Periplus Ch.51; Ptolemy Geographike VII; MASI Paithan excavation reports"}, {"section": 4, "subtopic": "बाजीराव दिल्ली मोहीम 1737", "qtype": "बहु-विधान", "q_marathi": "बाजीरावाच्या दिल्ली मोहिमेसंदर्भातील विधाने पहा : I) 28 मार्च 1737 रोजी तालकोटरा (दिल्ली) येथे मीरबक्षी खान-ए-दौरान याच्या मुघल फौजेचा मराठ्यांनी पराभव केला. II) या मोहिमेत बादशहा मुहम्मदशहा स्वतः रणांगणात उतरला व त्याचा पराभव झाला. III) या मोहिमेनंतर बादशहाने निजाम-उल-मुल्कास पाचारण केले; 1738 मध्ये भोपाळजवळ निजामाचा पराभव होऊन दुराई सरायचा तह झाला.", "q_english": "Consider the statements on Bajirao's Delhi campaign: I) On 28 March 1737 the Marathas defeated Mir Bakhshi Khan-i-Dauran's Mughal army at Talkatora (Delhi). II) Emperor Muhammad Shah personally took the battlefield in this campaign and was defeated. III) After this campaign the emperor summoned Nizam-ul-Mulk; in 1738 the Nizam was defeated near Bhopal and the Treaty of Durai Sarai followed.", "options": ["फक्त I बरोबर", "I व III बरोबर", "II व III बरोबर", "I, II व III बरोबर"], "correct_index": 1, "explanation_marathi": "28 मार्च 1737 रोजी तालकोटरा येथे खान-ए-दौरानचा पराभव (I सत्य) व त्यानंतर भोपाळ (1738)-दुराई सराय तह (III सत्य); परंतु मुहम्मदशहा स्वतः लढला नाही, तो लाल किल्ल्यात राहिला (II असत्य). त्यामुळे II समाविष्ट असलेले पर्याय बाद होतात.", "evidence": "Evidence: दिल्ली मोहीम — 28 मार्च 1737 तालकोटरा विजय (खान-ए-दौरान पराभूत/मृत); मुहम्मदशहा किल्ल्यातच; भोपाळ 1738 व दुराई सरायचा तह."}, {"section": 4, "subtopic": "भोकरदण तगर", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): भोकरदण हेच प्राचीन तगर होय हे निर्विवादपणे सिद्ध झाले आहे. कारण (R): भोकरदण उत्खननात रोमन मृद्भांडी, सातवाहन नाणी व व्यापारस्तर मिळाले आहेत. योग्य पर्याय निवडा:", "q_english": "Assertion (A): Bhokardan is undoubtedly proved as ancient Tagara. Reason (R): Excavations at Bhokardan yielded Roman pottery, Satavahana coins and trade layers. Choose correct:", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण", "A व R दोन्ही सत्य, R हे A चे स्पष्टीकरण नाही", "A असत्य, R सत्य", "A सत्य, R असत्य"], "correct_index": 2, "explanation_marathi": "R सत्य आहे कारण रोमन संपर्काचे पुरावे मिळाले आहेत. पण A असत्य आहे कारण तगरची ओळख तेर विरुद्ध भोकरदण अशी वादग्रस्त आहे; निर्विवाद सिद्ध झालेली नाही.", "evidence": "Indian Archaeology-A Review, Bhokardan excavations 1973-74; Deccan College Ter-Bhokardan identification debate"}, {"section": 4, "subtopic": "महात्मा फुले गुलामगिरी 1873", "qtype": "कारण-परिणाम", "q_marathi": "गुलामगिरी (1873) संदर्भात योग्य कारण-परिणाम जोडी ओळखा: फुलेंनी ग्रंथ अमेरिकेतील गुलामगिरीविरोधी लढ्याला अर्पण करण्यामागील तर्क आणि त्यातून काढलेला निष्कर्ष यांचा अचूक मेळ कोणता?", "q_english": "Identify the correct cause-effect pair for Gulamgiri (1873): the logic behind Phule dedicating the book to the American anti-slavery struggle and the conclusion he drew from it.", "options": ["कारण: अमेरिकन यादवी युद्धाने निग्रो गुलामगिरी नष्ट केली; परिणाम: फुलेंनी शूद्रांची गुलामगिरी अमेरिकन गुलामगिरीहून सौम्य मानून तिचे समर्थन केले.", "कारण: अमेरिकेतील उदार लोकांनी स्वार्थत्यागाने निग्रो मुक्तीसाठी लढा दिला; परिणाम: फुलेंनी ब्राह्मणी व्यवस्थेतील शूद्रातिशूद्रांची गुलामगिरी अधिक कपटी व दीर्घकालीन मानून तिच्या मुक्तीसाठी हाच आदर्श ठेवला.", "कारण: अमेरिकन सरकारने भारतीय जातिव्यवस्थेवर टीका केली; परिणाम: फुलेंनी गुलामगिरी इंग्रजीत लिहून अमेरिकन संसदेला सादर केली.", "कारण: अमेरिकेतील निग्रो नेत्यांनी फुलेंना आर्थिक मदत केली; परिणाम: फुलेंनी ग्रंथ त्यांना अर्पण करून सत्यशोधक समाजाची स्थापना केली."], "correct_index": 1, "explanation_marathi": "बरोबर उत्तर (B) मध्ये अर्पणाचा खरा हेतू (अमेरिकनांच्या स्वार्थत्यागाबद्दल आदर) व निष्कर्ष (ब्राह्मणी गुलामगिरी अधिक कपटी) अचूक आहे. (A) मध्ये निष्कर्ष उलटा, (C) मध्ये इंग्रजीत संसदेला सादर हे असत्य, (D) मध्ये आर्थिक मदत व सत्यशोधक स्थापना यांचा चुकीचा संबंध जोडला आहे.", "evidence": "Gulamgiri Preface dated 1 June 1873: dedication 'to the good people of the United States' for self-sacrificing devotion to Negro emancipation; text contrasts open American slavery with cunning Brahmanical enslavement of Shudra-Atishudra via scriptures."}, {"section": 4, "subtopic": "राजाराम जिंजी स्वराज्य", "qtype": "कालक्रम लावा", "q_marathi": "राजाराम महाराजांच्या जिंजी कालखंडातील घटनांचा योग्य कालक्रम लावा : अ) मुघलांनी रायगड जिंकल्यानंतर राजारामांचा महाराष्ट्रातून निसटता प्रवास (1689), ब) राजाराम महाराजांचा जिंजी किल्ल्यात प्रवेश (नोव्हें. 1689), क) झुल्फिकारखानाकडून जिंजीला वेढा प्रारंभ (1690), ड) जिंजी सोडून राजारामांचे महाराष्ट्रात प्रत्यागमन (1698).", "q_english": "Arrange in correct chronological order the events of Rajaram Maharaj's Gingee period: a) Rajaram's escape from Maharashtra after the Mughals captured Raigad (1689), b) Rajaram's entry into Gingee fort (Nov. 1689), c) Beginning of Gingee's siege by Zulfikarkhan (1690), d) Rajaram's return to Maharashtra leaving Gingee (1698).", "options": ["अ-ब-क-ड", "अ-क-ब-ड", "ब-अ-क-ड", "अ-ब-ड-क"], "correct_index": 0, "explanation_marathi": "1689 मध्ये रायगड पडल्यावर राजाराम नोव्हें. 1689 मध्ये जिंजीस पोहोचले; 1690 मध्ये झुल्फिकारखानाने वेढा घातला; 1698 मध्ये ते महाराष्ट्रात परतले. वेढा हा प्रवेशानंतरच व प्रत्यागमन हे वेढ्यानंतरच शक्य असल्याने इतर क्रमचुकीचे पर्याय बाद होतात.", "evidence": "Evidence: रायगड पतन 1689 → जिंजी प्रवेश नोव्हें. 1689 → झुल्फिकारखानाचा वेढा 1690 → राजारामांचे प्रत्यागमन 1698."}, {"section": 4, "subtopic": "शाहू आरक्षण 1902 अंमलबजावणी", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र करा - (I) 26 जुलै 1902 चा शाहूंचा आदेश : संस्थान सेवेत 50% जागा मागासवर्गीयांसाठी राखीव; (II) अंमलबजावणी : प्रत्येक नियुक्तीचा जातनिहाय अहवाल व जाहिरातीत राखीव पदांचा उल्लेख बंधनकारक. या दोन्हीतून कोणता अचूक निष्कर्ष निघतो?", "q_english": "Combine two concepts — (I) Shahu's 26 July 1902 order reserving 50% of princely state jobs for backward classes; (II) implementation requiring caste-wise appointment reports and mention of reserved posts in advertisements. Which conclusion follows?", "options": ["आदेश केवळ शिक्षणसंस्थांतील प्रवेशासाठी होता आणि जातनिहाय अहवाल फक्त ब्राह्मण कर्मचाऱ्यांसाठी मागवला होता.", "आदेश संस्थान नोकऱ्यांत 50% आरक्षण देतो आणि जातनिहाय नोंद-अहवाल पद्धतीने त्याची अंमलबजावणी सुनिश्चित केली, ही आधुनिक रोस्टर पद्धतीची पूर्वपीठिका ठरली.", "आदेश 1902 मध्ये केवळ अस्पृश्यांसाठी 33% आरक्षण देतो आणि अंमलबजावणी ब्रिटिश जिल्हाधिकाऱ्यांवर सोपवली होती.", "आदेश हा केवळ शिफारस स्वरूपाचा होता, अंमलबजावणीची कोणतीही यंत्रणा नव्हती, त्यामुळे तो प्रत्यक्षात लागू झाला नाही."], "correct_index": 1, "explanation_marathi": "बरोबर (B) दोन्ही संकल्पना जोडते: 50% नोकरी आरक्षण + जातनिहाय अहवाल ही रोस्टरची पूर्वपीठिका. (A) शिक्षण प्रवेशपुरता म्हणणे चुकीचे, (C) 33% व फक्त अस्पृश्य हे असत्य, (D) शिफारस मात्र म्हणणे आदेशवजा अंमलबजावणीविरुद्ध आहे.", "evidence": "Kolhapur State Order 26 July 1902: 50% of state service posts reserved for 'backward classes' (excluding Brahmins, Prabhus, etc.); implementing circulars required caste entry in applications and periodic compliance reports from departments."}, {"section": 4, "subtopic": "शिवाजी राज्याभिषेक 1674 विधी", "qtype": "जोड्या लावा", "q_marathi": "छत्रपती शिवाजी महाराजांच्या 1674 च्या राज्याभिषेक विधींसंदर्भात जोड्या लावा — स्तंभ 'अ' : अ) गागाभट्ट, ब) निश्चलपुरी गोसावी, क) 6 जून 1674, ड) 'छत्रपती' पदवी. स्तंभ 'ब' : 1) तांत्रिक पद्धतीचा दुसरा राज्याभिषेक (सप्टें. 1674), 2) वाराणसीचे पंडित व मुख्य पुरोहित, 3) रायगडवरील पहिला वैदिक राज्याभिषेक दिन, 4) 'क्षत्रिय कुलावतंस सिंहासनाधीश्वर' बिरुदासह धारण.", "q_english": "Match the pairs regarding Chhatrapati Shivaji Maharaj's 1674 coronation rituals — Column A: a) Gagabhatta, b) Nishchalapuri Gosavi, c) 6 June 1674, d) title 'Chhatrapati'. Column B: 1) Second coronation by Tantric rites (Sept. 1674), 2) Varanasi scholar and chief priest, 3) Day of first Vedic coronation at Raigad, 4) Assumption with the epithet 'Kshatriya Kulavatansa Sinhasanadhishwar'.", "options": ["अ-2, ब-1, क-3, ड-4", "अ-1, ब-2, क-3, ड-4", "अ-2, ब-3, क-1, ड-4", "अ-4, ब-1, क-3, ड-2"], "correct_index": 0, "explanation_marathi": "गागाभट्ट (विश्वेश्वर भट्ट) यांनी 6 जून 1674 रोजी रायगडावर वैदिक विधीने पहिला राज्याभिषेक केला व 'क्षत्रिय कुलावतंस सिंहासनाधीश्वर छत्रपती' पदवी दिली; सप्टें. 1674 मध्ये निश्चलपुरी गोसावींच्या हस्ते तांत्रिक विधीने दुसरा राज्याभिषेक झाला. इतर पर्यायांत ही कालक्रमिक व कार्यात्मक अदलाबदल चुकीची आहे.", "evidence": "Evidence: पहिला राज्याभिषेक 6 जून 1674, रायगड (गागाभट्ट, वैदिक विधी); दुसरा राज्याभिषेक सप्टेंबर 1674 (निश्चलपुरी गोसावी, तांत्रिक विधी); बिरुद 'क्षत्रिय कुलावतंस सिंहासनाधीश्वर छत्रपती'."}, {"section": 4, "subtopic": "संभाजी बुधभूषण ग्रंथ", "qtype": "Assertion-Reason", "q_marathi": "विधान (A) : 'बुधभूषणम्' हा छत्रपती संभाजी महाराजांनी संस्कृत भाषेत रचलेला राजनीती व राजधर्म (दंडनीती) विषयक ग्रंथ आहे. कारण (R) : या ग्रंथाची रचना 'अमरकोशा'च्या धर्तीवर कोशरूपात असून त्यात नायिकाभेदाचे अलंकारशास्त्रीय विवेचन आहे.", "q_english": "Assertion (A): 'Budhbhushanm' is a Sanskrit treatise on politics and rajadharma (dandaniti) composed by Chhatrapati Sambhaji Maharaj. Reason (R): The work is composed in lexicon form on the model of 'Amarkosha' and contains the rhetorical exposition of Nayikabheda.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 2, "explanation_marathi": "बुधभूषणम् ही संभाजी महाराजांची संस्कृत राजनीतीपर रचना (राजधर्म-दंडनीती विवेचन) असल्याने A सत्य; परंतु कोशरचना व नायिकाभेद-विवेचन हे 'नायिकाभेद' या स्वतंत्र अलंकारग्रंथाचे वैशिष्ट्य असल्याने R असत्य. त्यामुळे 'दोन्ही सत्य' व 'A असत्य' असलेले पर्याय बाद होतात.", "evidence": "Evidence: बुधभूषणम् — संभाजी महाराजकृत संस्कृत राजनीतिग्रंथ (राजधर्म/दंडनीती); नायिकाभेद — त्यांचाच स्वतंत्र अलंकारशास्त्रीय ग्रंथ."}, {"section": 4, "subtopic": "सोपारा अशोक", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "सोपारा (प्राचीन शूर्पारक) व अशोक या दोन संकल्पना एकत्र विचारात घ्या. दोन्हींचा अचूक संबंध जोडणारे विधान कोणते?", "q_english": "Considering Sopara (ancient Shurparaka) and Ashoka together, which statement correctly links both concepts?", "options": ["सोपाऱ्यात अशोकाच्या 8-9व्या प्रस्तरलेखांचे तुकडे मिळाले; ते पश्चिम किनारपट्टीवरील धम्मप्रसार व व्यापारी बंदराचे केंद्र दर्शवते", "सोपाऱ्यात अशोकाचा पूर्ण स्तंभलेख मिळाला; कलिंगानंतर सोपारा राजधानी झाल्याचे त्यातून सिद्ध होते", "सोपाऱ्यात फक्त सातवाहन स्तूप मिळाला; अशोकाचा कोणताही लेख तेथे आढळलेला नाही", "सोपाऱ्यातील अशोक लेख ग्रीक लिपीतील असून तो उत्तरापथ व्यापाराशी संबंधित आहे"], "correct_index": 0, "explanation_marathi": "सोपाऱ्यात भगवानलाल इंद्रजींना 8-9व्या प्रस्तरलेखांचे तुकडे व स्तूप मिळाला; हेच धम्मप्रसार+बंदर हे दोन्ही दुवे जोडते. स्तंभलेख, राजधानी व ग्रीक लिपीचे दावे असत्य आहेत.", "evidence": "ASI Report by Bhagwanlal Indraji 1882; Epigraphia Indica - Sopara fragments of Major Rock Edicts VIII-IX"}, {"section": 5, "subtopic": "कृष्णा खोरे उपनद्या", "qtype": "कालक्रम लावा", "q_marathi": "कृष्णा नदीच्या उगमापासून (महाबळेश्वर) दक्षिणेकडे जाताना उपनद्यांच्या संगमांचा योग्य क्रम लावा: अ. भीमा ब. घाटप्रभा क. कोयना ड. पंचगंगा", "q_english": "Arrange tributary confluences from Krishna origin (Mahabaleshwar) southwards: A. Bhima B. Ghataprabha C. Koyna D. Panchaganga", "options": ["क → ड → ब → अ", "क → ब → ड → अ", "ड → क → ब → अ", "क → ड → अ → ब"], "correct_index": 0, "explanation_marathi": "योग्य क्रम: कोयना (कराड) → पंचगंगा (नरसोबावाडी) → घाटप्रभा (कर्नाटक) → भीमा (रायचूर). इतर पर्यायांत घाटप्रभा-पंचगंगा किंवा भीमा-घाटप्रभा क्रम अदलाबदल केल्याने प्रवाहविरुद्ध ठरतात.", "evidence": "CWC / Krishna basin report: Upstream-downstream order Koyna at Karad, Panchaganga at Narsobawadi, Ghataprabha in Karnataka, Bhima near Raichur before Tungabhadra."}, {"section": 5, "subtopic": "कोकण किनारपट्टी रचना", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): कोकण किनारपट्टीवर नद्यांच्या मुखाशी रिया प्रकारच्या खाड्या तयार झाल्या आहेत व किनाऱ्यालगत खाजण (क्षारयुक्त) जमिनी आढळतात. कारण (R): तृतीयक काळानंतर सागरपातळी वाढल्याने पश्चिमवाहिनी नद्यांची खालची खोरे जलमग्न झाली व भरतीचे खारे पाणी अंतर्भागात शिरते.", "q_english": "Assertion (A): On the Konkan coast, ria-type creeks formed at river mouths and khajan (saline) lands occur along the shore. Reason (R): After the Tertiary, sea-level rise submerged the lower valleys of west-flowing rivers and tidal saline water penetrates inland.", "options": ["A व R दोन्ही सत्य असून R हे A चे अचूक स्पष्टीकरण आहे", "A व R दोन्ही सत्य असून R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य पण R असत्य आहे", "A असत्य पण R सत्य आहे"], "correct_index": 0, "explanation_marathi": "जलमग्न दऱ्या → रिया खाड्या, व भरतीचे खारे पाणी शिरून खाजण जमिनी तयार होतात; म्हणून R हेच A चे थेट स्पष्टीकरण.\nइतर पर्याय चुकीचे: A असत्य नाही (रिया खाड्या व खाजण जमिनी खरोखर आढळतात); R असत्य नाही (सागरपातळी वाढ/जलमग्नता हा प्रस्थापित सिद्धान्त आहे).", "evidence": "Maharashtra State Board Class 9/11 Geography – Konkan coast: submerged/ria coastline and khar/khajan lands; GSI coastal geomorphology notes on west-coast submergence."}, {"section": 5, "subtopic": "खानदेश तापी खोर", "qtype": "जोड्या लावा", "q_marathi": "तापीच्या खानदेशातील उपनद्या व वैशिष्ट्यांच्या जोड्या लावा — अ) गिरणा, ब) पांझरा, क) बोरी, ड) अनेर; i) तापीची सर्वांत लांब उपनदी, जळगावजवळ संगम; ii) धुळे शहराजवळून वाहते; iii) सातपुड्यात उगम, जळगाव जिल्ह्यात संगम; iv) शिरपूरजवळ तापीला मिळते.", "q_english": "Match the Tapi tributaries in Khandesh with their features — A) Girna, B) Panzara, C) Bori, D) Aner; i) longest tributary of the Tapi, joins near Jalgaon; ii) flows near Dhule city; iii) rises in the Satpudas, joins in Jalgaon district; iv) joins the Tapi near Shirpur.", "options": ["अ-i, ब-ii, क-iii, ड-iv", "अ-i, ब-iii, क-ii, ड-iv", "अ-ii, ब-i, क-iii, ड-iv", "अ-i, ब-ii, क-iv, ड-iii"], "correct_index": 0, "explanation_marathi": "गिरणा सर्वांत लांब व जळगावजवळ संगम; पांझरा धुळ्याजवळून; बोरी सातपुडा-जळगाव; अनेर शिरपूरजवळ — अ-i, ब-ii, क-iii, ड-iv हेच बरोबर.\nइतर पर्यायांत पांझरा-बोरी व बोरी-अनेर यांची वैशिष्ट्ये अदलाबदल केली आहेत, म्हणून ते बाद होतात.", "evidence": "Maharashtra State Board Class 9 Geography – Tapi tributaries (Girna, Panzara, Bori, Aner); Khandesh district gazetteers – confluence locations (Jalgaon, Dhule, Shirpur)."}, {"section": 5, "subtopic": "गोदावरी खोरे महाराष्ट्र", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (गोदावरी खोरे-महाराष्ट्र): अ. खोऱ्याचे महाराष्ट्रातील क्षेत्रफळ ब. महाराष्ट्राच्या एकूण क्षेत्रातील वाटा क. महाराष्ट्रातील नदीची लांबी ड. प्रमुख उपखोरे गट. पर्याय: 1.सुमारे 668 किमी 2.सुमारे 154,000 चौ.किमी 3.सुमारे 49-50% 4.पूर्णा-प्राणहिता-मांजरा", "q_english": "Match (Godavari basin-Maharashtra): A. Basin area in Maharashtra B. Share in Maharashtra's total area C. River length in Maharashtra D. Major sub-basin group. Options: 1.~668 km 2.~154,000 sq km 3.~49-50% 4.Purna-Pranhita-Manjra", "options": ["अ-2, ब-3, क-1, ड-4", "अ-2, ब-4, क-1, ड-3", "अ-3, ब-2, क-1, ड-4", "अ-2, ब-3, क-4, ड-1"], "correct_index": 0, "explanation_marathi": "अ-2, ब-3, क-1, ड-4 हाच योग्य मेळ आहे. 154,000 चौ.किमी व 49-50% वाटा परस्परपूरक आहेत; 668 किमी लांबी वेगळी बाब. इतर पर्यायांत क्षेत्रफळ-टक्केवारी व लांबी-उपखोरे अदलाबदल केल्याने चूक ठरतात.", "evidence": "Central Water Commission / Maharashtra Water Resources: Godavari basin ~312,812 sq km; Maharashtra share ~154,330 sq km (~49%); Maharashtra length ~668 km; sub-basins Purna, Pranhita, Manjra."}, {"section": 5, "subtopic": "तापी खोरे वैशिष्ट्ये", "qtype": "नकाशा आधारित", "q_marathi": "नकाशानुसार तापी नदी मध्य प्रदेशातील मुलताई (बैतूल) येथून उगम पावून महाराष्ट्रात प्रवेश करते. तिच्या प्रवाह दिशेनुसार (पूर्वेकडून पश्चिमेकडे) जिल्ह्यांचा योग्य क्रम व खोरे वैशिष्ट्य कोणते?", "q_english": "As per map, Tapi originates at Multai (Betul, MP) and enters Maharashtra. Which district sequence along flow (east to west) and basin feature is correct?", "options": ["जळगाव → धुळे → नंदुरबार; पूर्णा डाव्या तीरावर, महाराष्ट्रात लांबी ~208 किमी", "धुळे → जळगाव → नंदुरबार; पूर्णा उजव्या तीरावर, महाराष्ट्रात लांबी ~208 किमी", "जळगाव → नंदुरबार → धुळे; पूर्णा डाव्या तीरावर, महाराष्ट्रात लांबी ~512 किमी", "नंदुरबार → धुळे → जळगाव; गिरणा उजव्या तीरावर एकमेव प्रमुख उपनदी, लांबी ~208 किमी"], "correct_index": 0, "explanation_marathi": "योग्य क्रम जळगाव→धुळे→नंदुरबार (पूर्व→पश्चिम) व पूर्णा डाव्या तीरावर; महाराष्ट्रात लांबी ~208 किमी. इतर पर्यायांत क्रम उलटा/अदलाबदल आहे, पूर्णाचा तीर चूक व 512 किमी लांबी गोदावरीशी गोंधळ निर्माण करते.", "evidence": "Gazetteer / CWC: Tapi origin Multai, Betul; total 724 km, Maharashtra ~208 km; enters Jalgaon, flows via Dhule, Nandurbar to Gulf of Khambhat; Purna left-bank major tributary."}, {"section": 5, "subtopic": "दुष्काळ पट्टा सांगली", "qtype": "नकाशा आधारित", "q_marathi": "महाराष्ट्राच्या नकाशात सांगली जिल्ह्याचा पूर्व भाग (जत, कवठेमहांकाळ, आटपाडी तालुके) छायांकित दाखवला आहे. या पट्ट्याचे योग्य भौगोलिक स्पष्टीकरण कोणते?", "q_english": "On a Maharashtra map the eastern part of Sangli district (Jat, Kavathe-Mahankal, Atpadi talukas) is shaded. Which geographical explanation correctly describes this belt?", "options": ["सह्याद्रीच्या पर्जन्यछायेतील 500 मिमीपेक्षा कमी पर्जन्याचा दुष्काळी पट्टा; जास्त बाष्पीभवन, ज्वारी-बाजरी व दुष्काळी पशुधन अर्थव्यवस्था", "सह्याद्रीच्या वाताभिमुख उतारावरील अतिवृष्टीचा पट्टा; भात-नाचणी प्रधान शेती", "कृष्णा-कोयना संगमाचा पूरप्रवण सुपीक गाळाचा पट्टा; ऊस-हळद प्रधान शेती", "तापी-पूर्णा खचदरीतील काळ्या कसदार मृदेचा कोरडवाहू कापूस पट्टा"], "correct_index": 0, "explanation_marathi": "योग्य: पूर्व सांगली सह्याद्रीच्या पर्जन्यछायेत असल्याने दुष्काळी पट्ट्यात मोडते. इतर चूक: अतिवृष्टी/भात हा पश्चिम सांगली-शिराळा; पूर-गाळ/ऊस हा कृष्णा काठचा पश्चिम पट्टा; तापी-पूर्णा हा विदर्भ-खानदेश, सांगली नव्हे.", "evidence": "Maharashtra State Gazetteer - Sangli; IMD rainfall normals; Maharashtra Drought Manual - scarcity zone"}, {"section": 5, "subtopic": "नर्मदा खोरे सीमा", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): महाराष्ट्रात नर्मदा खोऱ्याचा विस्तार फक्त नंदुरबार जिल्ह्याच्या उत्तर भागापुरता मर्यादित आहे. कारण (R): नर्मदा खोरे उत्तरेस विंध्य व दक्षिणेस सातपुडा यांदरम्यानच्या भ्रंश दरीत विकसित झाले असून महाराष्ट्रात सातपुड्याच्या उत्तर उताराचाच भाग त्यात मोडतो.", "q_english": "Assertion (A): In Maharashtra, Narmada basin is limited only to northern Nandurbar district. Reason (R): Narmada basin developed in rift valley between Vindhya (north) and Satpura (south); in Maharashtra only the northern slope of Satpura falls in it.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "A व R दोन्ही बरोबर; भ्रंश दरी विंध्य-सातपुडा दरम्यानच असल्याने महाराष्ट्रातील नर्मदा पाणलोट उत्तर नंदुरबारपुरता मर्यादित राहतो, म्हणून R हेच A चे स्पष्टीकरण. इतर पर्याय स्पष्टीकरण-संबंध नाकारल्याने चूक.", "evidence": "CWC / Maharashtra Gazetteer: Narmada basin in Maharashtra ~1,930 sq km in Nandurbar only; rift valley between Vindhya and Satpura; Tapi-Narmada rift system."}, {"section": 5, "subtopic": "भिमा नदी उगम ते संगम", "qtype": "बहु-विधान", "q_marathi": "भीमा नदीबाबत खालील विधाने विचारात घ्या: I. उगम पुणे जिल्ह्यातील भीमाशंकरजवळ सह्याद्रीत सुमारे 945 मी उंचीवर होतो. II. एकूण लांबी सुमारे 861 किमी असून महाराष्ट्रात सुमारे 451 किमी वाहून कर्नाटकातील रायचूरजवळ कृष्णेस मिळते. III. सीना ही उजव्या तीरावरील तर घोड ही डाव्या तीरावरील उपनदी आहे. योग्य पर्याय निवडा.", "q_english": "Consider statements on Bhima river: I. Origin near Bhimashankar in Pune district, Sahyadri at ~945 m. II. Total length ~861 km, ~451 km in Maharashtra, joins Krishna near Raichur, Karnataka. III. Sina is right-bank and Ghod is left-bank tributary. Choose correct option.", "options": ["I आणि II फक्त बरोबर", "II आणि III फक्त बरोबर", "I आणि III फक्त बरोबर", "I, II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I व II बरोबर: उगम-उंची, लांबी-विभाजन व रायचूर संगम तथ्यांशी जुळतात. III चूक: सीना डाव्या तीरावर, उजव्या तीरावर नाही; त्यामुळे II+III व I+III व सर्व बरोबर असलेले पर्याय बाद होतात.", "evidence": "Water Resources Dept Maharashtra / Gazetteer: Bhima origin Bhimashankar ~945m, length 861 km (Maharashtra ~451 km), joins Krishna at Raichur; left-bank: Ghod, Sina, Indrayani; right-bank: Nira, Man."}, {"section": 5, "subtopic": "मराठवाडा पठार", "qtype": "बहु-विधान", "q_marathi": "मराठवाडा पठाराबाबत विधाने पहा — (I) हे गोदावरीच्या मध्य खोऱ्याचा भाग असून दक्षिणेस बालाघाट डोंगररांग त्याची सीमा आहे. (II) पैठण येथील जायकवाडी धरण गोदावरीवर, पठाराच्या पश्चिम भागात आहे. (III) संपूर्ण पठार केवळ दख्खन बेसाल्टचेच असून नांदेड-किनवट भागात आद्य तळखडकाचे (granite-gneiss) अवशेष अजिबात नाहीत.", "q_english": "Statements on the Marathwada plateau — (I) It is part of the middle Godavari basin with the Balaghat range forming its southern limit. (II) Jayakwadi dam at Paithan is on the Godavari in the western part of the plateau. (III) The entire plateau is only Deccan basalt with no Archaean granite-gneiss basement exposures near Nanded-Kinwat.", "options": ["फक्त I व II बरोबर", "फक्त I व III बरोबर", "I, II व III तिन्ही बरोबर", "फक्त II व III बरोबर"], "correct_index": 0, "explanation_marathi": "I सत्य (मध्य गोदावरी खोरे; बालाघाट दक्षिण सीमा); II सत्य (जायकवाडी-पैठण, छ. संभाजीनगर). III असत्य — किनवट-नांदेड भागात आर्कियन ग्रॅनाइट-नाइस तळखडकाचे अवशेष आढळतात.\nम्हणून III समाविष्ट असलेले पर्याय (2, 3, 4) बाद होतात; फक्त I व II बरोबर असलेला पर्याय 1 उरतो.", "evidence": "Maharashtra State Board Class 11 Geography – Marathwada plateau and Godavari basin; GSI Deccan Trap–basement contact near Kinwat/Nanded; Jayakwadi (Paithan) project records."}, {"section": 5, "subtopic": "महाराष्ट्र खनिजे बॉक्साइट", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): महाराष्ट्रातील बॉक्साइटचे प्रमुख साठे कोल्हापूर, रत्नागिरी व सिंधुदुर्ग जिल्ह्यांतील लॅटेराइट आच्छादित सह्याद्री पठारी शिखरांवर केंद्रित आहेत. कारण (R): उष्ण-आर्द्र हवामानातील तीव्र लॅटेरायझेशन प्रक्रियेत बेसाल्टमधील सिलिका निक्षालित होऊन ॲल्युमिनियम व लोह ऑक्साइड शेष राहतात.", "q_english": "Assertion (A): Maharashtra's major bauxite deposits are concentrated on laterite-capped plateau tops of the Sahyadri in Kolhapur, Ratnagiri and Sindhudurg districts. Reason (R): Under hot-humid climate, intense laterization leaches silica from basalt leaving residual aluminium and iron oxides.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य: दख्खन ट्रॅपवरील लॅटेराइट आच्छादनातच बॉक्साइट (उदा. उदगिरी-कोल्हापूर, मंडणगड-रत्नागिरी). R सत्य व A ची जनुकीय प्रक्रिया स्पष्ट करते. इतर पर्याय चूक: R असत्य नाही; R हा केवळ सहसंबंध नसून निर्मितीचे कारण आहे.", "evidence": "GSI Indian Minerals Yearbook - Bauxite; Maharashtra Directorate of Geology and Mining - district mineral profiles"}, {"section": 5, "subtopic": "महाराष्ट्र मृदा प्रकार", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): गोदावरी-कृष्णा लाभक्षेत्रात कालव्यांद्वारे सतत प्रवाही सिंचनाने भूजलपातळी उंचावून केशाकर्षणाने क्षार पृष्ठभागावर जमा होतात. परिणाम (E): पश्चिम महाराष्ट्र व मराठवाड्याच्या काही भागांत क्षारपड (चोपण/सलाईन) मृदा तयार होऊन सुपीकता व उत्पादन घटते.", "q_english": "Cause (C): Continuous canal flow irrigation in Godavari-Krishna command areas raises the water table and capillary action deposits salts at the surface. Effect (E): Saline/alkaline (kharpad/chopan) soils develop in parts of western Maharashtra and Marathwada, reducing fertility and yield.", "options": ["C व E दोन्ही सत्य, E हा C चा योग्य परिणाम आहे", "C व E दोन्ही सत्य, परंतु E हा C चा योग्य परिणाम नाही", "C सत्य, E असत्य", "C असत्य, E सत्य"], "correct_index": 0, "explanation_marathi": "अतिजलसिंचन → जलसाठा → केशाकर्षण → क्षारसंचय ही 3-टप्पी शृंखला C चा E शी कार्यकारण संबंध सिद्ध करते. इतर पर्याय चूक: E असत्य नाही (कमांड क्षेत्र सलाईनिटी अहवाल); C-E असंबद्ध नाहीत.", "evidence": "NBSS&LUP - Soils of Maharashtra; Maharashtra Water Resources Dept. - waterlogging and salinity in command areas"}, {"section": 5, "subtopic": "महाराष्ट्र वने प्रकार", "qtype": "कालक्रम लावा", "q_marathi": "पश्चिमेकडून पूर्वेकडे (कोकण किनारा → दख्खन पठार आतील भाग) पर्जन्यमान घटत जाण्याच्या क्रमाने वन प्रकारांचा योग्य क्रम लावा: (a) किनारी कांदळवन (b) उष्णकटिबंधीय आर्द्र पानझडी (c) उष्णकटिबंधीय शुष्क पानझडी (d) उष्णकटिबंधीय काटेरी झुडपी", "q_english": "Arrange Maharashtra forest types from west to east in decreasing rainfall order: (a) coastal mangrove (b) tropical moist deciduous (c) tropical dry deciduous (d) tropical thorn scrub", "options": ["a-b-c-d", "b-a-c-d", "a-c-b-d", "a-b-d-c"], "correct_index": 0, "explanation_marathi": "योग्य पश्चिम-पूर्व छेद: किनारा-कांदळवन → सह्याद्री आर्द्र पानझडी → पठार शुष्क पानझडी → दुष्काळी पट्टा काटेरी. b-a किनारा चुकवतो; a-c-b आर्द्र-शुष्क क्रम उलटवतो; a-b-d-c शेवटचे दोन टप्पे अदलाबदल करतो.", "evidence": "Champion & Seth forest classification; Maharashtra Forest Department - forest type distribution; ISFR"}, {"section": 5, "subtopic": "मान्सून परतीचा प्रवास", "qtype": "बहु-विधान", "q_marathi": "परतीच्या मान्सूनबाबत विधाने पहा: (I) नैऋत्य मान्सूनची माघार सप्टेंबरच्या सुरुवातीला वायव्य राजस्थानातून सुरू होऊन ऑक्टोबरच्या मध्यापर्यंत महाराष्ट्रातून पूर्ण होते. (II) परतीच्या काळात वारे ईशान्येकडून वाहू लागतात; बंगालच्या उपसागरावरून आर्द्रता घेऊन तमिळनाडू किनारपट्टीवर ईशान्य मान्सूनचा पाऊस पडतो. (III) परतीचा मान्सून महाराष्ट्रात जून-जुलैइतकाच मुसळधार पाऊस देतो व खरीप पिकांचा मुख्य जलस्रोत ठरतो.", "q_english": "Consider statements on the retreating monsoon: (I) SW monsoon withdrawal starts over NW Rajasthan in early September and completes over Maharashtra by mid-October. (II) Winds reverse to northeasterly, picking up Bay of Bengal moisture causing NE monsoon rain over the Tamil Nadu coast. (III) The retreating monsoon gives as heavy rain in Maharashtra as June-July and is the main kharif water source.", "options": ["I व II फक्त सत्य", "II व III फक्त सत्य", "I व III फक्त सत्य", "I, II व III सर्व सत्य"], "correct_index": 0, "explanation_marathi": "I व II सत्य: माघारीचा क्रम व वाऱ्यांची दिशा-बदल IMD नोंदींशी जुळतात. III असत्य: परतीत महाराष्ट्रात केवळ अवकाळी/मावळती सरी पडतात; खरीपचा मुख्य स्रोत जून-सप्टेंबर नैऋत्य मान्सूनच. त्यामुळे B, C, D पर्याय बाद.", "evidence": "IMD - monsoon onset/withdrawal dates; IMD - northeast monsoon reports"}, {"section": 5, "subtopic": "विदर्भ पठार", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "विदर्भ पठाराच्या संदर्भात खालीलपैकी कोणते द्विसंकल्पना संयोजन पूर्णतः बरोबर व परस्परसंबंधित आहे?", "q_english": "In the context of the Vidarbha plateau, which two-concept combination is fully correct and mutually related?", "options": ["वैनगंगा–वर्धा द्रोणी गोंडवाना गाळाच्या खडकांवर विकसित झाली आहे + चंद्रपूर–वणी कोळसा साठे याच गोंडवाना क्रमाशी निगडित आहेत", "वैनगंगा–वर्धा द्रोणी दख्खन बेसाल्टवर विकसित झाली आहे + चंद्रपूर–वणी कोळसा साठे धारवाड क्रमाशी निगडित आहेत", "वैनगंगा–वर्धा द्रोणी विंध्य गाळाच्या खडकांवर विकसित झाली आहे + चंद्रपूर–वणी कोळसा साठे दख्खन ट्रॅपशी निगडित आहेत", "वैनगंगा–वर्धा द्रोणी कडप्पा क्रमाच्या खडकांवर विकसित झाली आहे + चंद्रपूर–वणी कोळसा साठे गोंडवाना क्रमाशी निगडित आहेत"], "correct_index": 0, "explanation_marathi": "वैनगंगा-वर्धा द्रोणी गोंडवाना गाळावर विकसित असून याच क्रमातील बाराकर-मोटूर स्तरांत चंद्रपूर-वणी कोळसा आहे — दोन्ही सत्य व कार्यकारणाने जोडलेली.\nइतर पर्याय चुकीचे: कोळसा धारवाड/ट्रॅपशी संबंधित नाही; द्रोणी बेसाल्ट, विंध्य वा कडप्पा क्रमावर विकसित नाही.", "evidence": "GSI Gondwana Supergroup – Wardha–Godavari valley coalfields (Chandrapur–Wani, Barakar–Motur seams); Maharashtra State Board Geography – Vidarbha plateau geology."}, {"section": 5, "subtopic": "सह्याद्री घाटमाथा हवामान", "qtype": "तक्ता आधारित", "q_marathi": "तक्त्यात सह्याद्री घाटमाथ्यावरील चार ठिकाणांची उंची व सरासरी वार्षिक पर्जन्य दिला आहे — अ) महाबळेश्वर : 1438 मी, 6200 मिमी; ब) आंबोली : 690 मी, 7450 मिमी; क) माथेरान : 803 मी, 5160 मिमी; ड) पंचगणी : 1330 मी, 6100 मिमी. हवामानशास्त्रीयदृष्ट्या विसंगत नोंद कोणती?", "q_english": "The table gives altitude and mean annual rainfall for four Sahyadri ghatmatha stations — A) Mahabaleshwar: 1438 m, 6200 mm; B) Amboli: 690 m, 7450 mm; C) Matheran: 803 m, 5160 mm; D) Panchgani: 1330 m, 6100 mm. Which entry is climatologically inconsistent?", "options": ["फक्त 'ड' ची पर्जन्यनोंद चुकीची आहे — पंचगणी प्रतिवात बाजूस असल्याने तेथे ~1500 मिमीच पाऊस पडतो", "फक्त 'ब' ची पर्जन्यनोंद चुकीची आहे — आंबोलीत 7450 मिमी पाऊस अशक्य आहे", "'अ' व 'क' च्या नोंदी परस्परविरुद्ध आहेत — उंची-पर्जन्य संबंध जुळत नाही", "चारही नोंदी हवामानशास्त्रानुसार पूर्णतः सुसंगत आहेत"], "correct_index": 0, "explanation_marathi": "पंचगणी महाबळेश्वरपासून जवळ असूनही प्रतिवात (leeward) बाजूस व पठारी सखलतेमुळे तेथे ~1200–1500 मिमीच पाऊस पडतो, 6100 मिमी नव्हे — म्हणून 'ड' विसंगत.\nइतर पर्याय चुकीचे: आंबोली हे पश्चिम घाटातील अतिवृष्टी केंद्र (7000+ मिमी) असल्याने 'ब' बरोबर; महाबळेश्वर-माथेरान वाऱ्याच्या सम्मुख बाजूस असल्याने 'अ', 'क' सुसंगत.", "evidence": "IMD Pune district rainfall normals: Mahabaleshwar ~6226 mm, Panchgani ~1300–1500 mm (Satara); Maharashtra State Board Class 11 Geography – Sahyadri orographic rainfall and rain-shadow effect."}, {"section": 6, "subtopic": "अनुसूचित क्षेत्रे 244", "qtype": "कारण-परिणाम", "q_marathi": "(A): राष्ट्रपती संबंधित राज्यपालांशी विचारविनिमय करून अनुसूचित क्षेत्र घोषित करू शकतात किंवा त्यात बदल करू शकतात. (R): पाचव्या अनुसूचीअंतर्गत अनुसूचित क्षेत्रांच्या प्रशासनाबाबत राज्यपालांचा अहवाल राष्ट्रपतींना सादर करावा लागतो.", "q_english": "(A): The President may declare or alter Scheduled Areas after consultation with the Governor. (R): Under the Fifth Schedule, the Governor's report on administration of Scheduled Areas is submitted to the President.", "options": ["A बरोबर, R बरोबर आणि R हे A चे योग्य स्पष्टीकरण आहे", "A बरोबर, R बरोबर पण R हे A चे योग्य स्पष्टीकरण नाही", "A चूक, R बरोबर", "A बरोबर, R चूक"], "correct_index": 1, "explanation_marathi": "A आणि R दोन्ही पाचव्या अनुसूचीबाबत बरोबर आहेत, पण R (अहवालाची तरतूद) हे A (क्षेत्र घोषित/बदलाचा अधिकार) चे कारण नाही. त्यामुळे योग्य स्पष्टीकरण नसलेलाच पर्याय बरोबर.", "evidence": "भारतीय संविधान अनु. 244(1); पाचवी अनुसूची परिच्छेद 5, 6"}, {"section": 6, "subtopic": "आयोग निवडणूक 324", "qtype": "बहु-विधान", "q_marathi": "अनु. 324 बाबत विधाने पहा: 1) आयोगात मुख्य निवडणूक आयुक्त व राष्ट्रपती ठरवतील इतके इतर आयुक्त असतात. 2) मुख्य आयुक्तांना हटवण्याची प्रक्रिया सर्वोच्च न्यायालयाच्या न्यायाधीशांप्रमाणे आहे. 3) इतर आयुक्तांना मुख्य आयुक्तांच्या शिफारशीशिवाय हटवता येत नाही.", "q_english": "On Art. 324: 1) Commission consists of CEC and such other ECs as President fixes. 2) CEC removal process is like that of SC judge. 3) Other ECs cannot be removed without CEC recommendation.", "options": ["फक्त 1 व 2 बरोबर", "फक्त 2 व 3 बरोबर", "1, 2 व 3 तिन्ही बरोबर", "फक्त 1 व 3 बरोबर"], "correct_index": 2, "explanation_marathi": "तिन्ही विधाने अनु. 324(2) व 324(5) नुसार बरोबर आहेत – रचना, CEC ला न्यायाधीशांप्रमाणे संरक्षण, इतर आयुक्तांना CEC शिफारशीशिवाय न हटवणे. त्यामुळे फक्त दोन विधाने घेणारे पर्याय चूक.", "evidence": "भारतीय संविधान अनु. 324(2), 324(5)"}, {"section": 6, "subtopic": "उच्च न्यायालय 214-231", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता तपासा:\nअ) कलम 214 - राज्यासाठी उच्च न्यायालय\nब) कलम 217 - नियुक्ती: राष्ट्रपती, CJI व संबंधित राज्यपालांशी विचारविनिमय\nक) कलम 222 - बदली: CJI शी विचारविनिमयाशिवाय राष्ट्रपती स्वविवेकाने\nड) कलम 217(1) - निवृत्ती वय 62 वर्षे\nयोग्य पर्याय निवडा:", "q_english": "Check table: A) Art 214 - High Court for State B) Art 217 - appointment by President after consultation with CJI & Governor C) Art 222 - transfer by President at discretion without CJI D) Art 217(1) - retirement at 62. Choose correct:", "options": ["अ, ब, ड बरोबर; क चूक", "अ, ब, क बरोबर; ड चूक", "ब, क, ड बरोबर; अ चूक", "अ, क, ड बरोबर; ब चूक"], "correct_index": 0, "explanation_marathi": "अ,ब,ड बरोबर; क चूक कारण कलम 222 बदलीसाठी CJI शी विचारविनिमय बंधनकारक (तिसरा न्यायाधीश खटला). क बरोबर मानणारे B,C,D बाद.", "evidence": "Constitution Arts 214, 217, 222; Supreme Court Advocates-on-Record (1993) & Third Judges case (1998) on CJI consultation"}, {"section": 6, "subtopic": "उपराष्ट्रपती 63-71", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): कलम 67(b) नुसार उपराष्ट्रपतींना पदावरून हटवण्यासाठी राज्यसभेत प्रभावी बहुमताने ठराव व लोकसभेची सहमती लागते; 14 दिवसांची पूर्वसूचना बंधनकारक आहे.\nपरिणाम (E): कलम 65 नुसार राष्ट्रपतीपद रिक्त असताना उपराष्ट्रपती कार्यवाहक राष्ट्रपती होतात व तेवढ्या काळात राज्यसभेच्या सभापतिपदी काम करत नाहीत.\nयोग्य पर्याय निवडा:", "q_english": "Cause (C): Under Art 67(b) removal of VP needs Rajya Sabha resolution by effective majority agreed by Lok Sabha with 14 days notice. Effect (E): Under Art 65 VP acts as President when vacancy occurs and does not act as Rajya Sabha Chairman meanwhile. Choose correct:", "options": ["C व E दोन्ही सत्य, E हे C चा योग्य परिणाम आहे", "C व E दोन्ही सत्य, पण E हे C चा परिणाम नाही", "C सत्य, E असत्य", "C असत्य, E सत्य"], "correct_index": 1, "explanation_marathi": "C व E दोन्ही सत्य आहेत, पण E हा C चा परिणाम नाही; C हटवणूक प्रक्रिया, E रिक्तपदातील कार्यकारी व्यवस्था सांगते. परिणाम मानणारा A चूक; C/E असत्य मानणारे C,D चूक.", "evidence": "Constitution Arts 64, 65, 67(b); effective majority + 14 days notice; VP does not perform Chairman duties while acting as President"}, {"section": 6, "subtopic": "कलम 14 समानता", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "कलम 14 संदर्भात विधाने पहा: I. 'कायद्यासमोर समानता' ही ब्रिटिश उगमाची नकारात्मक संकल्पना, तर 'कायद्याचे समान संरक्षण' ही अमेरिकन उगमाची सकारात्मक संकल्पना आहे. II. कलम 14 केवळ भारतीय नागरिकांना उपलब्ध आहे. III. ई.पी. रोयप्पा खटल्यात मनमानीपणा हा समानतेचा शत्रू असल्याचे सर्वोच्च न्यायालयाने म्हटले. योग्य पर्याय निवडा.", "q_english": "Consider on Article 14: I. 'Equality before law' is British negative concept, 'equal protection of laws' is American positive concept. II. Article 14 is available only to citizens. III. In E.P. Royappa case SC held arbitrariness is antithesis to equality. Choose correct.", "options": ["I आणि II बरोबर, III चूक", "I आणि III बरोबर, II चूक", "II आणि III बरोबर, I चूक", "I, II, III सर्व बरोबर"], "correct_index": 1, "explanation_marathi": "I व III बरोबर: पहिली Dicey कडून, दुसरी अमेरिकन 14व्या दुरुस्तीतून; रोयप्पा (1974) मध्ये मनमानी=असमानता. II चूक: कलम 14 'व्यक्ती'ला आहे, त्यामुळे II असलेले पर्याय चुकतात.", "evidence": "भारतीय संविधान कलम 14; E.P. Royappa vs State of Tamil Nadu (1974)"}, {"section": 6, "subtopic": "कलम 15 भेदभाव निषेध", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (कलम 15): A.15(1) B.15(3) C.15(4) D.15(5) : 1. महिला-बालकांसाठी विशेष तरतूद 2. धर्म-वंश-जात-लिंग-जन्मस्थानवर भेदभावास मनाई 3. खाजगी संस्थांत (अल्पसंख्याक वगळून) प्रवेशात आरक्षण 4. सामाजिक-शैक्षणिक मागासांसाठी विशेष तरतूद", "q_english": "Match (Art 15): A.15(1) B.15(3) C.15(4) D.15(5) : 1.Special provision for women-children 2.Prohibition of discrimination on religion-race-caste-sex-place of birth 3.Reservation in private institutions (except minorities) 4.Special provision for SEBCs", "options": ["A-2, B-1, C-4, D-3", "A-2, B-4, C-1, D-3", "A-1, B-2, C-4, D-3", "A-2, B-1, C-3, D-4"], "correct_index": 0, "explanation_marathi": "A-2 मूळ निषेध, B-1 सकारात्मक विशेष तरतूद, C-4 पहिली दुरुस्ती (1951), D-3 93वी दुरुस्ती (2005) हेच बरोबर. B-C किंवा C-D अदलाबदल केलेले पर्याय त्यामुळे चुकतात.", "evidence": "भारतीय संविधान कलम 15(1)(3)(4)(5); 1ली व 93वी घटना दुरुस्ती"}, {"section": 6, "subtopic": "कलम 16 संधी समानता", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): कलम 16(2) नुसार धर्म, वंश, जात, लिंग, वंशपरंपरा, जन्मस्थान, निवास या आधारांवर शासकीय सेवेत भेदभाव निषिद्ध आहे. कारण (R): कलम 16(3) संसदेला शासकीय नोकरीसाठी निवासाची अट विहित करण्याचा अधिकार देते. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Under Art 16(2) discrimination in public employment on religion, race, caste, sex, descent, place of birth, residence is prohibited. Reason (R): Art 16(3) empowers Parliament to prescribe residence requirement. Choose correct.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A व R दोन्ही सत्य, पण R हा A चा अपवाद आहे, स्पष्टीकरण नव्हे; 16(3) मुळे संसद निवासाची अट घालू शकते. त्यामुळे स्पष्टीकरण म्हणणारा व एक-सत्य पर्याय चुकतात.", "evidence": "भारतीय संविधान कलम 16(2), 16(3)"}, {"section": 6, "subtopic": "कलम 17 अस्पृश्यता अंत", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: a. संविधानात कलम 17 चा समावेश b. अस्पृश्यता (गुन्हे) कायदा c. नागरी हक्क संरक्षण कायदा (नामांतर) d. SC/ST अत्याचार प्रतिबंध कायदा योग्य क्रम निवडा.", "q_english": "Arrange chronologically: a.Inclusion of Art 17 in Constitution b.Untouchability (Offences) Act c.Protection of Civil Rights Act (renaming) d.SC/ST Prevention of Atrocities Act. Choose correct order.", "options": ["a-b-d-c", "a-b-c-d", "b-a-c-d", "a-c-b-d"], "correct_index": 1, "explanation_marathi": "a(1949)→b(1955)→c(1976 नामांतर)→d(1989) हाच क्रम बरोबर; d आधी घेणारे किंवा b आधी a घेणारे पर्याय चुकतात.", "evidence": "संविधान कलम 17; Untouchability (Offences) Act 1955; PCR Act 1976; SC/ST PoA Act 1989"}, {"section": 6, "subtopic": "कलम 18 पदव्या अंत", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र पहा: X. कलम 18(1) राज्याला लष्करी-शैक्षणिक वगळता पदव्या देण्यास मनाई करते. Y. बालाजी राघवन (1996) निकालानुसार भारतरत्न-पद्म पुरस्कार 'पदव्या' नाहीत. यावरून कोणता निष्कर्ष बरोबर?", "q_english": "Consider together: X. Art 18(1) bars State from conferring titles except military-academic. Y. Per Balaji Raghavan (1996) Bharat Ratna-Padma awards are not 'titles'. Which inference is correct?", "options": ["X व Y दोन्ही चूक; पुरस्कार पदव्या असल्याने असंवैधानिक", "X सत्य, Y चूक; पुरस्कार आडनावापुढे वापरता येतात", "X व Y दोन्ही सत्य; पुरस्कार पदवी नसल्याने वैध, पण नावापुढे/मागे पदवी म्हणून वापरता येत नाही", "X चूक, Y सत्य; राज्य कोणतीही पदवी देऊ शकते"], "correct_index": 2, "explanation_marathi": "X व Y दोन्ही सत्य; 1996 मध्ये SC ने पुरस्कार वैध ठरवले पण पदवी म्हणून वापरास मनाई केली. असंवैधानिक म्हणणारे व नावापुढे वापरता येतो म्हणणारे पर्याय चुकतात.", "evidence": "भारतीय संविधान कलम 18; Balaji Raghavan vs Union of India (1996)"}, {"section": 6, "subtopic": "नगरपालिका 74वी", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र पहा: (I) 3 लाखांपेक्षा जास्त लोकसंख्येच्या महानगरपालिका क्षेत्रात वॉर्ड समित्या स्थापन करणे बंधनकारक (अनु. 243S), (II) नगरपालिका अकाली विसर्जित झाल्यास 6 महिन्यांत निवडणूक घेऊन नव्या मंडळाचा कार्यकाळ उर्वरित कालावधीसाठी असतो (अनु. 243U). योग्य पर्याय निवडा.", "q_english": "Consider together: (I) Wards Committees mandatory in Municipal Corporation area above 3 lakh population (Art. 243S), (II) If municipality dissolved early, election within 6 months and new body continues for remainder period (Art. 243U). Choose correct option.", "options": ["I बरोबर, II बरोबर आणि दोन्ही 74वी दुरुस्तीतील आहेत", "I बरोबर, II चूक – नव्या मंडळाला पूर्ण 5 वर्षे मिळतात", "I चूक – मर्यादा 5 लाख आहे, II बरोबर", "I बरोबर, II बरोबर पण II ही 73वी दुरुस्तीतील तरतूद आहे"], "correct_index": 0, "explanation_marathi": "243S नुसार 3 लाखांवरील महानगरपालिकेत वॉर्ड समित्या बंधनकारक आणि 243U नुसार 6 महिन्यांत निवडणूक व उर्वरित कालावधीसाठी मंडळ; दोन्ही 74वीतील आहेत. इतर पर्याय लोकसंख्या मर्यादा, कार्यकाळ किंवा दुरुस्ती चुकवतात.", "evidence": "भारतीय संविधान अनु. 243S, 243U; 74वी घटना दुरुस्ती अधिनियम 1992 (01.06.1993 लागू)"}, {"section": 6, "subtopic": "पंचायत 73वी", "qtype": "कालक्रम लावा", "q_marathi": "खालील घटनांचा योग्य कालक्रम लावा: A) बलवंतराय मेहता समितीचा अहवाल B) अशोक मेहता समितीची नियुक्ती C) 64 वी घटना दुरुस्ती विधेयक राज्यसभेत पराभूत D) 73 वी घटना दुरुस्ती अंमलात येणे", "q_english": "Arrange in chronological order: A) Balwantrai Mehta Committee Report B) Appointment of Ashok Mehta Committee C) 64th Amendment Bill defeated in Rajya Sabha D) 73rd Amendment coming into force", "options": ["A-B-C-D", "A-C-B-D", "A-B-D-C", "B-A-C-D"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A(1957)-B(1977)-C(1989)-D(24 एप्रिल 1993) आहे. इतर पर्यायांत C चा 1989 चा पराभव B नंतर येत नाही किंवा D शेवटी न ठेवता मध्ये आणला आहे, म्हणून ते चूक.", "evidence": "संविधान 73वी दुरुस्ती अधिनियम 1992 (24.04.1993 लागू); बलवंतराय मेहता समिती 1957, अशोक मेहता समिती 1977, 64वी दुरुस्ती विधेयक 1989"}, {"section": 6, "subtopic": "भाषा 344-351", "qtype": "नकाशा आधारित", "q_marathi": "भारताच्या नकाशात 'X' ने दर्शविलेले राज्य (मिझोराम) विचारात घ्या. भाषा (अनु. 344-351) बाबत योग्य पर्याय निवडा:", "q_english": "In the India map, consider the state marked 'X' (Mizoram). On language provisions (Arts. 344-351), choose the correct option:", "options": ["अनु. 345 नुसार राज्य 8व्या अनुसूचीतील भाषांपैकीच राजभाषा स्वीकारू शकते", "अनु. 347 नुसार लोकसंख्येच्या घटकाच्या मागणीवरून राष्ट्रपती भाषेला मान्यता देऊ शकतात", "अनु. 350A नुसार भाषिक अल्पसंख्याकांना मातृभाषेतून शिक्षण देणे राज्यावर बंधनकारक नाही", "8व्या अनुसूचीतील समावेशाने ती भाषा आपोआप राज्याची राजभाषा होते"], "correct_index": 1, "explanation_marathi": "अनु. 347 नुसार भाषिक गटाच्या मागणीवर राष्ट्रपती भाषेला मान्यता देऊ शकतात हेच बरोबर. अनु. 345 ला 8व्या अनुसूचीचे बंधन नाही, 350A बंधनकारक आहे, अनुसूचीतील समावेशाने राजभाषा आपोआप होत नाही.", "evidence": "भारतीय संविधान अनु. 345, 347, 350A; 8वी अनुसूची"}, {"section": 6, "subtopic": "मुख्यमंत्री 163-167", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): कलम 164(2) नुसार मंत्रिपरिषद विधानसभेला सामूहिकपणे जबाबदार असल्याने बहुमत गमावलेला मुख्यमंत्री राजीनामा देतो हा घटनात्मक संकेत आहे.\nकारण (R): कलम 163(1) नुसार राज्यपालांना सहाय्य-सल्ला देणारी मंत्रिपरिषद मुख्यमंत्रींच्या नेतृत्वाखाली असते; विवेकाधिकार वगळता राज्यपाल सल्ल्यानुसार वागतात.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): Under Art 164(2) Council collectively responsible to Assembly, so CM losing majority resigns is constitutional convention. Reason (R): Under Art 163(1) Council headed by CM aids-advises Governor, who acts per advice except discretion. Choose correct:", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A व R दोन्ही सत्य, पण R (163(1) सल्ला-संरचना) हे A (164(2) सामूहिक जबाबदारी) चे स्पष्टीकरण नाही. स्पष्टीकरण मानणारा A चूक; असत्य मानणारे C,D चूक.", "evidence": "Constitution Arts 163(1), 164(1)-(2); S.R. Bommai (1994) on floor test for majority"}, {"section": 6, "subtopic": "राज्यपाल 153-162", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा:\nI. कलम 155 नुसार राज्यपालांची नियुक्ती राष्ट्रपती करतात.\nII. कलम 156 नुसार कार्यकाळ 5 वर्षे, पण राष्ट्रपतींच्या मर्जीपर्यंत पद धारण; उत्तराधिकारी येईपर्यंत चालू राहू शकतात.\nIII. कलम 157 नुसार पात्रता: भारताचा नागरिक व 35 वर्षे पूर्ण.\nIV. राष्ट्रपतींप्रमाणे राज्यपालांना हटवण्यासाठी महाभियोग प्रक्रिया संविधानात आहे.\nयोग्य पर्याय निवडा:", "q_english": "Consider: I. Art 155 Governor appointed by President. II. Art 156 term 5 years but during pleasure; may continue till successor. III. Art 157 citizen + 35 years. IV. Impeachment like President exists for Governor. Choose correct:", "options": ["I, II, III बरोबर; IV चूक", "I, II, IV बरोबर; III चूक", "II, III, IV बरोबर; I चूक", "I, III, IV बरोबर; II चूक"], "correct_index": 0, "explanation_marathi": "I,II,III बरोबर; IV चूक कारण राज्यपालांना महाभियोग नाही, फक्त राष्ट्रपतींची मर्जी (B.P. Singhal 2010 मर्यादा). IV सत्य मानणारे B,C,D बाद होतात.", "evidence": "Constitution Arts 155, 156, 157; B.P. Singhal v. Union of India (2010) on pleasure doctrine"}, {"section": 6, "subtopic": "राष्ट्रपती 52-62", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nअ) निरपेक्ष नकाराधिकार ब) निलंबनकारी नकाराधिकार क) पॉकेट नकाराधिकार ड) कलम 111\n1) संमती रोखणे, परत न पाठवणे 2) धनविधेयक वगळता पुनर्विचारासाठी परत पाठवणे; पुनर्मंजुरीनंतर संमती बंधनकारक 3) 1986चे पोस्टल विधेयक - ज्ञानी झैल सिंग 4) संमती/रोखणे/परत पाठवणे या कृतींचा आधार\nयोग्य संकेत निवडा:", "q_english": "Match: A) Absolute veto B) Suspensive veto C) Pocket veto D) Art 111 with 1) Withhold assent without return 2) Return for reconsideration except money bill; assent compulsory after re-passage 3) 1986 Postal Bill - Zail Singh 4) Basis for assent/withhold/return. Choose correct code:", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-3, क-2, ड-4", "अ-1, ब-2, क-4, ड-3"], "correct_index": 0, "explanation_marathi": "अ-1, ब-2, क-3, ड-4 हाच बरोबर मेळ आहे; कलम 111 तिन्ही कृतींचा आधार देते. ब-1/क-2 अदलाबदल असलेले B,C आणि क-4, ड-3 अदलाबदल असलेले D चूक ठरतात.", "evidence": "Constitution Art 111; Absolute/Suspensive/Pocket veto doctrine; Zail Singh pocket veto on Indian Post Office (Amendment) Bill 1986"}, {"section": 7, "subtopic": "GDP मोजणी 2011-12", "qtype": "बहु-विधान", "q_marathi": "खालील विधाने विचारात घ्या:\nI. 2011-12 आधारवर्षाची नवीन GDP मालिका CSO ने 30 जाने. 2015 रोजी प्रसिद्ध केली; ती UN SNA-2008 शी सुसंगत आहे.\nII. या मालिकेत GDP बाजारभावाने व GVA मूलभूत किमतींवर मोजतात; खाजगी कॉर्पोरेट क्षेत्रासाठी MCA-21 डेटाबेस वापरतात.\nIII. या मालिकेत 2004-05 हेच आधारवर्ष कायम ठेवले आहे.\nकोणते बरोबर?", "q_english": "Consider statements: I. New GDP series with base 2011-12 was released by CSO on 30 Jan 2015, consistent with UN SNA-2008. II. In it GDP is at market prices and GVA at basic prices; MCA-21 database used for private corporate sector. III. Base year 2004-05 was retained. Which are correct?", "options": ["फक्त I आणि II बरोबर / Only I and II correct", "फक्त II आणि III बरोबर / Only II and III correct", "फक्त I आणि III बरोबर / Only I and III correct", "I, II आणि III सर्व बरोबर / All I, II and III correct"], "correct_index": 0, "explanation_marathi": "I व II सत्य आहेत: नवीन मालिका 2015 मध्ये SNA-2008 नुसार, GVA मूलभूत किमतीवर व MCA-21 वापर सत्य आहे.\nIII असत्य: आधारवर्ष 2004-05 वरून 2011-12 करण्यात आले; त्यामुळे III असलेले पर्याय बाद होतात.", "evidence": "CSO press release 30 Jan 2015: new GDP series base 2011-12; UN SNA-2008 compliant; GDP at market prices, GVA at basic prices; MCA-21 for private corporate sector"}, {"section": 7, "subtopic": "GST 101वी", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा : (अ) कलम 246A (ब) कलम 269A (क) कलम 279A (ड) सुधारित कलम 270 ; (1) GST परिषदेची रचना (2) केंद्र-राज्यांना GST कायद्याचा समवर्ती अधिकार (3) आंतरराज्य पुरवठ्यावर IGST व वाटप (4) विभाज्य GST महसुलाचे वाटप", "q_english": "Match the pairs: (A) Article 246A (B) Article 269A (C) Article 279A (D) Amended Article 270 with (1) GST Council (2) Concurrent power to Centre-States for GST laws (3) IGST on inter-state supply and apportionment (4) Distribution of divisible GST revenue", "options": ["अ-2, ब-3, क-1, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-3, ब-2, क-1, ड-4", "अ-2, ब-3, क-4, ड-1"], "correct_index": 0, "explanation_marathi": "246A समवर्ती अधिकार, 269A IGST वाटप, 279A GST परिषद, 270 महसूल वाटप देते; म्हणून अ-2, ब-3, क-1, ड-4 हेच बरोबर. इतर पर्यायांत 269A/279A/270 ची अदलाबदल करून गोंधळ निर्माण केला आहे.", "evidence": "101st Constitution Amendment Act, 2016: Art.246A, Art.269A, Art.279A; Art.270 amended - India Code, CBIC"}, {"section": 7, "subtopic": "MGNREGA 2005", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: (1) MGNREGA 25 ऑगस्ट 2005 रोजी अधिनियमित, 2 फेब्रु. 2006 पासून 200 जिल्ह्यांत लागू. (2) काम मागितल्यापासून 15 दिवसांत काम न दिल्यास बेरोजगार भत्ता देय. (3) मजुरी 15 दिवसांत न दिल्यास विलंब भरपाई देय. (4) एकूण खर्च केंद्र:राज्य 90:10 वाटप होते. योग्य पर्याय निवडा.", "q_english": "Statements: (1) MGNREGA enacted 25 Aug 2005, launched 2 Feb 2006 in 200 districts. (2) Unemployment allowance if work not given within 15 days of demand. (3) Delay compensation if wages not paid within 15 days. (4) Total cost sharing Centre:State is 90:10. Choose correct option.", "options": ["फक्त 1, 2, 3 बरोबर", "फक्त 2, 3, 4 बरोबर", "फक्त 1, 2, 4 बरोबर", "सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "1-3 सत्य आहेत; 4 चूक कारण अकुशल मजुरी 100% केंद्र, सामग्री खर्च 75% केंद्र व 25% राज्य उचलते, 90:10 नाही. त्यामुळे 4 असलेले पर्याय बाद होतात.", "evidence": "MGNREGA Act 2005, Ministry of Rural Development: wage 100% Centre, material 75:25"}, {"section": 7, "subtopic": "MSME व्याख्या 2020", "qtype": "बहु-विधान", "q_marathi": "विधाने: (1) सूक्ष्म: गुंतवणूक ≤₹1 कोटी, उलाढाल ≤₹5 कोटी (2) लघु: गुंतवणूक ≤₹10 कोटी, उलाढाल ≤₹50 कोटी (3) मध्यम: गुंतवणूक ≤₹50 कोटी, उलाढाल ≤₹250 कोटी (4) 2020 पासून गुंतवणूक+उलाढाल संमिश्र निकष लागू. योग्य गट निवडा.", "q_english": "Statements: (1) Micro: investment ≤Rs 1 cr, turnover ≤Rs 5 cr (2) Small: investment ≤Rs 10 cr, turnover ≤Rs 50 cr (3) Medium: investment ≤Rs 50 cr, turnover ≤Rs 250 cr (4) Composite investment+turnover criteria since 2020.", "options": ["1, 2, 3, 4 सर्व सत्य", "फक्त 1, 2, 4 सत्य (3 मध्ये उलाढाल ≤₹100 कोटी)", "फक्त 2, 3 सत्य", "फक्त 1, 4 सत्य"], "correct_index": 0, "explanation_marathi": "चारही विधाने 1.6.2020 अधिसूचनेनुसार बरोबर आहेत. पर्याय 2 मधील मध्यम उलाढाल 100 कोटी ही चुकीची मर्यादा आहे; त्यामुळे इतर पर्याय बाद होतात.", "evidence": "MSME Ministry Notification S.O. 2119(E) 26.06.2020; Atmanirbhar package 13.05.2020 - composite criteria"}, {"section": 7, "subtopic": "NABARD 1982", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना 1: NABARD ची स्थापना 12 जुलै 1982 रोजी शिवरामन समितीच्या शिफारशीनुसार NABARD कायदा 1981 अंतर्गत झाली. संकल्पना 2: NABARD ही ग्रामीण पतपुरवठ्याची शिखर संस्था असून तिने RBI कडील कृषी पत विभाग व ग्रामीण नियोजन पत कक्षाची कार्ये आत्मसात केली.", "q_english": "Concept 1: NABARD was set up on 12 July 1982 on Sivaraman Committee recommendation under NABARD Act 1981. Concept 2: NABARD is the apex rural credit institution and took over ACD and RPCC functions from RBI.", "options": ["दोन्ही संकल्पना सत्य व परस्परपूरक आहेत", "फक्त 1 सत्य, 2 असत्य", "1 असत्य (स्थापना 1981), 2 सत्य", "दोन्ही सत्य पण परस्परविरोधी"], "correct_index": 0, "explanation_marathi": "दिनांक, समिती, कायदा बरोबर; तसेच ACD/RPCC ची कार्ये NABARD कडे वर्ग झाली हेही सत्य. म्हणून दोन्ही सत्य व पूरक. इतर पर्याय वर्ष किंवा कार्य चूक ठरवतात.", "evidence": "NABARD Act 1981, established 12 July 1982; Sivaraman Committee 1979; NABARD - took over ACD/RPCC from RBI"}, {"section": 7, "subtopic": "RBI कार्ये", "qtype": "कालक्रम लावा", "q_marathi": "RBI संदर्भातील घटनांचा योग्य कालक्रम लावा: (अ) RBI स्थापना (RBI कायदा 1934) (ब) RBI चे राष्ट्रीयीकरण (क) FEMA अंतर्गत परकीय चलन नियमन कार्य (ड) MPC द्वारे महागाई लक्ष्यांकन सुरू", "q_english": "Arrange chronologically: (A) RBI establishment (RBI Act 1934) (B) Nationalisation of RBI (C) Forex regulation under FEMA (D) Inflation targeting via MPC", "options": ["अ-ब-क-ड", "अ-क-ब-ड", "ब-अ-क-ड", "अ-ब-ड-क"], "correct_index": 0, "explanation_marathi": "क्रम: 1935 स्थापना, 1949 राष्ट्रीयीकरण, 1999 FEMA (FERA जागी), 2016 MPC. म्हणून अ-ब-क-ड बरोबर. इतर पर्यायांत FEMA/MPC चा क्रम बदलून संभ्रम निर्माण केला आहे.", "evidence": "RBI Act 1934 (est. 1 Apr 1935); RBI Transfer to Public Ownership Act 1948 (w.e.f. 1 Jan 1949); FEMA 1999; RBI Act amended 2016 for MPC"}, {"section": 7, "subtopic": "WPI vs CPI", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा:\nअ) आधारवर्ष – WPI: 2011-12, CPI (संयुक्त): 2012\nब) प्रसिद्धकर्ता – WPI: DPIIT/आर्थिक सल्लागार कार्यालय, CPI: MoSPI/NSO\nक) व्याप्ती – WPI: वस्तू + सेवा, CPI: फक्त वस्तू\nकोणत्या जोड्या बरोबर आहेत?", "q_english": "See table: A) Base year – WPI: 2011-12, CPI (Combined): 2012 B) Published by – WPI: DPIIT/Office of Economic Adviser, CPI: MoSPI/NSO C) Coverage – WPI: goods + services, CPI: only goods. Which pairs are correct?", "options": ["फक्त अ आणि ब बरोबर / Only A and B correct", "फक्त ब आणि क बरोबर / Only B and C correct", "फक्त अ आणि क बरोबर / Only A and C correct", "अ, ब आणि क सर्व बरोबर / All A, B and C correct"], "correct_index": 0, "explanation_marathi": "अ व ब सत्य: आधारवर्षे व प्रसिद्धकर्ता बरोबर आहेत.\nक असत्य: WPI मध्ये फक्त वस्तू (सेवा नाही), CPI मध्ये वस्तू+सेवा असतात; क असलेले पर्याय त्यामुळे चूक.", "evidence": "DPIIT: WPI base 2011-12, covers goods only, by Office of Economic Adviser; MoSPI: CPI base 2012, covers goods and services"}, {"section": 7, "subtopic": "अन्न सुरक्षा 2013", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता-आधारित: NFSA 2013 नुसार (1) प्राधान्य कुटुंब- 5 किलो/व्यक्ती/महिना (2) अंत्योदय- 35 किलो/कुटुंब/महिना (3) मातृत्व लाभ- ₹5000 (4) व्याप्ती- ग्रामीण 75%, शहरी 50%. चुकीचे विधान ओळखा.", "q_english": "Table-based: Under NFSA 2013 (1) Priority households- 5 kg/person/month (2) Antyodaya- 35 kg/household/month (3) Maternity benefit- ₹5000 (4) Coverage- rural 75%, urban 50%. Identify incorrect statement.", "options": ["फक्त 3 चूक", "फक्त 4 चूक", "2 आणि 3 चूक", "1 आणि 4 चूक"], "correct_index": 0, "explanation_marathi": "NFSA कलम 4 नुसार मातृत्व लाभ ₹6000 आहे, ₹5000 नाही (₹5000 PMMVY चे आहे). 1,2,4 NFSA तरतुदींशी सुसंगत आहेत, म्हणून इतर पर्याय चूक.", "evidence": "National Food Security Act 2013, Section 4: maternity benefit ₹6000; Section 3: 5kg/35kg, 75% rural 50% urban"}, {"section": 7, "subtopic": "आयकर स्लॅब 2025", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): अर्थसंकल्प 2025-26 नुसार नवीन करप्रणालीत कलम 87A सूटमुळे ₹12 लाखांपर्यंत उत्पन्नावर शून्य कर देय आहे. कारण (R): नवीन प्रणालीत ₹12-16 लाख स्लॅबवर 15% दर आहे आणि पगारी व्यक्तींना ₹75,000 प्रमाणित वजावट मिळून प्रभावी मर्यादा ₹12.75 लाख होते.", "q_english": "Assertion (A): Under Budget 2025-26, new regime levy is zero up to Rs 12 lakh due to Section 87A rebate. Reason (R): In new regime Rs 12-16 lakh slab attracts 15% and salaried get Rs 75,000 standard deduction, taking effective limit to Rs 12.75 lakh.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A सत्य (87A सूट) व R सत्य (15% स्लॅब + 75 हजार वजावट) आहे; पण A चे कारण सूट-मर्यादा वाढ आहे, स्लॅब दर नव्हे. म्हणून दोन्ही सत्य पण स्पष्टीकरण नाही; इतर पर्याय एक विधान चूक ठरवतात.", "evidence": "Budget 2025-26
