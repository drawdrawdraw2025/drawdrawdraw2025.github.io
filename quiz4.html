, CBDT: New regime 0-4 nil, 4-8 5%, 8-12 10%, 12-16 15%, 16-20 20%, 20-24 25%, >24 30%; Sec 87A rebate up to Rs 12L, salaried threshold Rs 12.75L with Rs 75k SD"}, {"section": 7, "subtopic": "दारीद्र्य तेंडुलकर", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): तेंडुलकर समितीने (2009) कॅलरी-आधारित दारिद्र्यरेषा त्यागून आरोग्य, शिक्षणावरील खाजगी खर्चासह उपभोग-खर्चावर आधारित दारिद्र्य मोजले. परिणाम (R): 2011-12 साठी ग्रामीण ₹816/महिना (₹27.2/दिवस) व शहरी ₹1000/महिना (₹33.3/दिवस) रेषा निश्चित झाली, जी लकडावाला पद्धतीपेक्षा जास्त दारिद्र्य दर्शवते. संबंध ओळखा.", "q_english": "Cause (A): Tendulkar Committee (2009) replaced calorie-based poverty line with consumption-expenditure including private health, education spending. Effect (R): For 2011-12 it fixed rural ₹816/month (₹27.2/day) and urban ₹1000/month (₹33.3/day), showing higher poverty than Lakdawala method. Identify relation.", "options": ["A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "तेंडुलकरने Mixed Recall Period व विस्तारित बास्केट वापरली, त्यामुळे 2004-05 दारिद्र्य 37.2% (लकडावाला 27.5% पेक्षा जास्त) आले. इतर पर्याय कारण-परिणाम संबंध चुकवतात.", "evidence": "Tendulkar Committee Report 2009, Planning Commission; Poverty line 2011-12: Rural ₹816, Urban ₹1000"}, {"section": 7, "subtopic": "बँक राष्ट्रीयीकरण 1969", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): 19 जुलै 1969 रोजी ₹50 कोटींहून अधिक ठेवी असलेल्या 14 प्रमुख व्यापारी बँकांचे राष्ट्रीयीकरण झाले.\nकारण (R): ग्रामीण शाखाविस्तार, शेती-लघुउद्योगांना कर्ज व आर्थिक सत्तेचे केंद्रीकरण रोखणे हा त्यामागील मुख्य उद्देश होता.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): On 19 July 1969, 14 major commercial banks with deposits over Rs 50 crore were nationalised. Reason (R): Its main objective was rural branch expansion, credit to agriculture-small industry and preventing concentration of economic power. Choose correct option:", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे / Both true, R correctly explains A", "A आणि R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही / Both true, R does not explain A", "A सत्य, R असत्य / A true, R false", "A असत्य, R सत्य / A false, R true"], "correct_index": 0, "explanation_marathi": "A सत्य: 14 बँका, ₹50 कोटी निकष, तारीख बरोबर; R सत्य व हाच उद्देश होता.\n₹200 कोटी हा 1980 च्या 6 बँकांचा निकष असल्याने D चूक; R नाकारणारे B, C पर्यायही चूक.", "evidence": "RBI history: Banking Companies (Acquisition) Ordinance 19 July 1969 – 14 banks with deposits >Rs 50 crore nationalised; objectives: social control, rural expansion, priority-sector credit, curb concentration"}, {"section": 7, "subtopic": "मुद्रा योजना", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (मुद्रा योजना): (अ) शिशु (ब) किशोर (क) तरुण (ड) तरुण प्लस. (1) ₹50,001 ते ₹5 लाख (2) ₹50,000 पर्यंत (3) ₹10 लाख ते ₹20 लाख (4) ₹5,00,001 ते ₹10 लाख. योग्य संकेत निवडा.", "q_english": "Match pairs (MUDRA): (a) Shishu (b) Kishore (c) Tarun (d) Tarun Plus. (1) ₹50,001 to ₹5 lakh (2) Up to ₹50,000 (3) ₹10 lakh to ₹20 lakh (4) ₹5,00,001 to ₹10 lakh. Choose correct code.", "options": ["अ-2, ब-1, क-4, ड-3", "अ-2, ब-4, क-1, ड-3", "अ-1, ब-2, क-4, ड-3", "अ-2, ब-1, क-3, ड-4"], "correct_index": 0, "explanation_marathi": "शिशु ≤₹50 हजार, किशोर ₹50 हजार-5 लाख, तरुण ₹5-10 लाख, तरुण प्लस (2024) ₹10-20 लाख हेच अधिकृत वर्गीकरण आहे. इतर पर्याय मर्यादा अदलाबदल करून फसवतात.", "evidence": "PMMY Guidelines, Ministry of Finance; launched 8 Apr 2015; Tarun Plus added in Budget 2024-25"}, {"section": 7, "subtopic": "राजकोषीय तूट FRBM", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nअ) राजकोषीय तूट  ब) महसूली तूट  क) प्राथमिक तूट  ड) FRBM, 2003 चे मूळ लक्ष्य\n1) राजकोषीय तूट − व्याज देयके  2) एकूण खर्च − (महसूली जमा + कर्जेतर भांडवली जमा)  3) महसूली खर्च − महसूली जमा  4) राजकोषीय तूट GDP च्या 3% पर्यंत आणणे\nयोग्य संकेत निवडा:", "q_english": "Match: A) Fiscal deficit B) Revenue deficit C) Primary deficit D) FRBM, 2003 original target with 1) Fiscal deficit − interest payments 2) Total expenditure − (revenue receipts + non-debt capital receipts) 3) Revenue expenditure − revenue receipts 4) Bring fiscal deficit to 3% of GDP. Choose correct code:", "options": ["अ-2, ब-3, क-1, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-3, ब-2, क-1, ड-4", "अ-2, ब-3, क-4, ड-1"], "correct_index": 0, "explanation_marathi": "अ-2, ब-3, क-1, ड-4 हेच परिभाषेनुसार व FRBM मूळ 3% लक्ष्यानुसार बरोबर आहे.\nइतर पर्यायांत व्याज-वजावट व महसूली/राजकोषीय व्याख्यांची अदलाबदल केली आहे, म्हणून ते चूक.", "evidence": "Budget documents: fiscal deficit = total expenditure − (revenue + non-debt capital receipts); revenue deficit = revenue expenditure − revenue receipts; primary deficit = fiscal deficit − interest payments; FRBM Act 2003 targeted 3% fiscal deficit/GDP"}, {"section": 7, "subtopic": "स्टार्टअप इंडिया", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): स्टार्टअप इंडिया (2016) अंतर्गत DPIIT-मान्य स्टार्टअपला पहिल्या 10 वर्षांत सलग 3 वर्षे कलम 80-IAC नुसार आयकर सूट मिळते. कारण (R): ₹10,000 कोटींचा Fund of Funds SIDBI मार्फत स्टार्टअप्समध्ये गुंतवणूक करतो. पर्याय निवडा.", "q_english": "Assertion (A): Under Startup India (2016), DPIIT-recognised startups get 3-year consecutive income-tax holiday within first 10 years u/s 80-IAC. Reason (R): ₹10,000 crore Fund of Funds operated via SIDBI invests in startups. Choose option.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A (80-IAC करसूट) व R (FFS ₹10,000 कोटी, SIDBI) दोन्ही सत्य पण भिन्न तरतुदी आहेत; FFS करसुटीचे कारण नाही. त्यामुळे स्पष्टीकरण वाला पर्याय व एक-सत्य पर्याय चूक.", "evidence": "Startup India Action Plan 16 Jan 2016, DPIIT; Income Tax Act 80-IAC; Fund of Funds ₹10,000 crore via SIDBI"}, {"section": 7, "subtopic": "हरित क्रांती टप्पे", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): हरित क्रांतीचा पहिला टप्पा (1966-72) HYV गहू-तांदूळ, खते-सिंचनासह पंजाब-हरियाणा-प. उत्तर प्रदेशपुरता मर्यादित राहिला.\nपरिणाम (E): त्यामुळे गहू विरुद्ध भरडधान्य/डाळी व प्रदेशांमध्ये (वायव्य विरुद्ध पूर्व-मध्य भारत) असमानता वाढली.\nयोग्य पर्याय निवडा:", "q_english": "Cause (C): First phase of Green Revolution (1966-72) with HYV wheat-rice, fertilisers-irrigation remained limited to Punjab-Haryana-W. UP. Effect (E): Hence inter-crop (wheat vs coarse cereals/pulses) and inter-regional (northwest vs eastern-central India) disparities widened. Choose correct option:", "options": ["C व E दोन्ही सत्य, C हे E चे योग्य स्पष्टीकरण आहे / Both true, C correctly explains E", "C व E दोन्ही सत्य, पण C हे E चे योग्य स्पष्टीकरण नाही / Both true, C does not explain E", "C सत्य, E असत्य / C true, E false", "C असत्य, E सत्य / C false, E true"], "correct_index": 0, "explanation_marathi": "C सत्य: पहिला टप्पा वायव्य भारतात केंद्रित होता; E सत्य व त्याचाच परिणाम म्हणून पीक व प्रादेशिक दरी वाढली.\nत्यामुळे स्पष्टीकरण नाकारणारा वा एक विधान चूक ठरवणारा पर्याय बाद होतो.", "evidence": "Economic Survey / NCERT: Green Revolution Phase I (1966-72) concentrated in Punjab-Haryana-W.UP with HYV wheat; led to inter-crop and inter-regional disparities"}, {"section": 8, "subtopic": "अंतःस्रावी ग्रंथी", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (A) अधिवृक्क मध्यांश, (B) पश्च पियुषिका, (C) स्वादुपिंड बीटा पेशी, (D) पॅराथायरॉइड — (1) ॲड्रेनॅलिन, (2) व्हॅसोप्रेसिन (ADH), (3) इन्सुलिन, (4) पॅराथॉर्मोन.", "q_english": "Match: (A) Adrenal medulla, (B) Posterior pituitary, (C) Pancreatic beta cells, (D) Parathyroid — (1) Adrenaline, (2) Vasopressin (ADH), (3) Insulin, (4) Parathormone.", "options": ["A-1, B-2, C-3, D-4", "A-1, B-3, C-2, D-4", "A-2, B-1, C-3, D-4", "A-1, B-2, C-4, D-3"], "correct_index": 0, "explanation_marathi": "A-1 ॲड्रेनॅलिन (लढा/पळा), B-2 ADH (पाणी पुनर्शोषण), C-3 इन्सुलिन, D-4 पॅराथॉर्मोन (रक्त Ca वाढ) हेच योग्य. इतर पर्याय ADH/इन्सुलिन/ग्लुकॅगॉन अदलाबदल करून फसवतात.", "evidence": "NCERT Class 11 Biology Ch.19 Chemical Coordination and Integration – adrenal medulla, posterior pituitary ADH, insulin, parathormone functions"}, {"section": 8, "subtopic": "अंतराळ तंत्रज्ञान", "qtype": "बहु-विधान", "q_marathi": "विधाने: (P) आदित्य-L1 सूर्य-पृथ्वी L1 बिंदूच्या प्रभामंडल कक्षेतील भारताची पहिली सौर वेधशाळा आहे. (Q) चांद्रयान-3 विक्रम लँडर दक्षिण ध्रुवाजवळ उतरले, प्रज्ञानने सल्फर शोधले. (R) गगनयानसाठी LVM3 चा मानवीय-रेटेड प्रकार वापरतात. (S) SSLV चा चौथा टप्पा क्रायोजेनिक आहे. योग्य गट निवडा.", "q_english": "Statements: (P) Aditya-L1 is India's first solar observatory in halo orbit around Sun-Earth L1. (Q) Chandrayaan-3's Vikram landed near south pole; Pragyan confirmed sulphur. (R) Gaganyaan uses human-rated LVM3. (S) SSLV's fourth stage is cryogenic. Choose the correct group.", "options": ["फक्त P, Q, R बरोबर", "P, Q, R, S सर्व बरोबर", "फक्त Q, R, S बरोबर", "फक्त P, R, S बरोबर"], "correct_index": 0, "explanation_marathi": "P, Q, R सत्य आहेत; SSLV मध्ये 3 घन टप्पे + द्रव इंधनाचा Velocity Trimming Module असतो, क्रायोजेनिक नाही, त्यामुळे S असत्य. S समाविष्ट असलेले सर्व पर्याय चूक.", "evidence": "ISRO official pages: Aditya-L1 (halo orbit), Chandrayaan-3 (Vikram/Pragyan), Gaganyaan (HLVM3), SSLV (3 solid stages + VTM liquid stage, no cryo)."}, {"section": 8, "subtopic": "आधुनिक भौतिकी अणू", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: 1) इलेक्ट्रॉन-थॉमसन-1897 2) प्रोटॉन-रदरफोर्ड-1920 (नामकरण) 3) न्यूट्रॉन-चॅडविक-1932 4) अणुकेंद्रकाचा शोध-बोहर-1911. चुकीची जोडी कोणती?", "q_english": "Table: 1) Electron-Thomson-1897 2) Proton-Rutherford-1920 (naming) 3) Neutron-Chadwick-1932 4) Discovery of nucleus-Bohr-1911. Which pair is incorrect?", "options": ["फक्त 1 चूक", "फक्त 4 चूक", "2 व 3 चूक", "1 व 4 चूक"], "correct_index": 1, "explanation_marathi": "4 चूक: अणुकेंद्रक रदरफोर्डने 1911 मध्ये (α-विचलन प्रयोग) शोधले; बोहरने 1913 मध्ये प्रतिकृती दिली. 1,2,3 बरोबर असल्याने इतर पर्याय बाद.", "evidence": "NCERT Class 9 Science Ch.4 Structure of the Atom; NCERT Class 12 Physics Ch.12 Atoms"}, {"section": 8, "subtopic": "आम्ल आम्लारी", "qtype": "तक्ता आधारित", "q_marathi": "तक्त्यात आम्ल व त्याची संयुग्म आम्लारी दिली आहे: (P) HCl → Cl⁻, (Q) NH₄⁺ → NH₃, (R) H₂CO₃ → HCO₃⁻, (S) H₂O (आम्लारी म्हणून) → OH⁻. ब्रॉन्स्टेड-लॉरीनुसार H⁺ गमावून संयुग्म आम्लारी बनते या नियमानुसार चुकीची जोडी ओळखा.", "q_english": "Table shows acid and its conjugate base: (P) HCl → Cl⁻, (Q) NH₄⁺ → NH₃, (R) H₂CO₃ → HCO₃⁻, (S) H₂O (as base) → OH⁻. As per Brønsted-Lowry (acid loses H⁺ to form conjugate base), identify the incorrect pair.", "options": ["फक्त S", "फक्त R", "P आणि Q", "R आणि S"], "correct_index": 0, "explanation_marathi": "H₂O आम्लारी म्हणून H⁺ स्वीकारून H₃O⁺ (संयुग्म आम्ल) बनवते; OH⁻ ही H₂O आम्ल असतानाची संयुग्म आम्लारी आहे, त्यामुळे S चूक. P, Q, R मध्ये H⁺ काढून योग्य संयुग्म आम्लारी दिली आहे, म्हणून इतर पर्याय चूक.", "evidence": "NCERT Class 11 Chemistry Chapter 7 – Brønsted-Lowry concept: conjugate acid-base pair differs by one H⁺."}, {"section": 8, "subtopic": "कार्य ऊर्जा शक्ती", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) mgh (m=1kg,h=10m,g=10) ब) ½mv² (m=2kg,v=5m/s) क) F·s (F=5N,s=4m,θ=0°) ड) W/t (W=100J,t=5s) — 1) 25J 2) 20J 3) 20W 4) 100J", "q_english": "Match: a) mgh (m=1kg,h=10m,g=10) b) ½mv² (m=2kg,v=5m/s) c) F·s (F=5N,s=4m,θ=0°) d) W/t (W=100J,t=5s) — 1) 25J 2) 20J 3) 20W 4) 100J", "options": ["अ-4, ब-1, क-2, ड-3", "अ-4, ब-2, क-1, ड-3", "अ-1, ब-4, क-2, ड-3", "अ-4, ब-1, क-3, ड-2"], "correct_index": 0, "explanation_marathi": "अ=100J, ब=25J, क=20J, ड=20W म्हणून अ-4,ब-1,क-2,ड-3 बरोबर. इतर पर्यायांत मूल्ये/एकके (J vs W) अदलाबदल केल्याने चूक.", "evidence": "NCERT Class 9 Science Ch.10 Work and Energy; NCERT Class 11 Physics Ch.5 Work, Energy and Power"}, {"section": 8, "subtopic": "गती न्यूटन नियम", "qtype": "बहु-विधान", "q_marathi": "विधाने विचारात घ्या: अ) स्थिर बस अचानक निघाल्यास प्रवासी मागे झुकतात – जडत्व. ब) रॉकेटची गती संवेग-अक्षय्यतेवर आधारित; क्रिया-प्रतिक्रिया भिन्न वस्तूंवर. क) 2 kg वर 10 N बल 5 s → संवेग बदल 50 kg·m/s. ड) घर्षणविरहित पृष्ठभागावर चालणे हे दुसऱ्या नियमाचे उदाहरण. योग्य पर्याय निवडा.", "q_english": "Consider: a) Passengers lurch back when a stationary bus starts suddenly – inertia. b) Rocket motion rests on momentum conservation; action-reaction act on different bodies. c) 10 N on 2 kg for 5 s → momentum change 50 kg·m/s. d) Walking on a frictionless surface exemplifies the second law. Choose correct.", "options": ["अ, ब, क बरोबर; ड चूक", "अ, ब, ड बरोबर; क चूक", "ब, क, ड बरोबर; अ चूक", "अ, ब, क, ड सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "अ,ब,क बरोबर: Δp=FΔt=50 हे दुसऱ्या नियमाचे गणित; रॉकेट तिसऱ्या नियमाचे. ड चूक: चालणे क्रिया-प्रतिक्रियेवर (तिसरा नियम) आधारित, दुसऱ्यावर नाही. त्यामुळे इतर पर्याय बाद.", "evidence": "NCERT Class 9 Science Ch.9 Force and Laws of Motion; H.C. Verma Vol.1 Ch.5 Newton's Laws"}, {"section": 8, "subtopic": "चुंबकत्व", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: अ) ओर्स्टेड-विद्युत प्रवाहाचा चुंबकीय परिणाम (1820) ब) फॅराडे-विद्युतचुंबकीय प्रवर्तन (1831) क) हेन्री-स्वप्रेरकत्व (1832) ड) मॅक्सवेल-विद्युतचुंबकीय सिद्धांत (1873).", "q_english": "Arrange chronologically: a) Oersted-magnetic effect of current (1820) b) Faraday-electromagnetic induction (1831) c) Henry-self-induction (1832) d) Maxwell-electromagnetic theory (1873).", "options": ["अ-ब-क-ड", "अ-क-ब-ड", "ब-अ-क-ड", "अ-ब-ड-क"], "correct_index": 0, "explanation_marathi": "योग्य क्रम 1820<1831<1832<1873 म्हणजे अ-ब-क-ड. फॅराडे-हेन्रीतील 1 वर्षाचा फरक इतर पर्यायांत उलटवला आहे, म्हणून ते चूक.", "evidence": "NCERT Class 12 Physics Ch.4 Moving Charges and Magnetism, Ch.5 Magnetism; Maxwell Treatise 1873"}, {"section": 8, "subtopic": "धातू अधातू", "qtype": "कालक्रम लावा", "q_marathi": "धातूंच्या मानवी वापर/विलगीकरणाचा योग्य कालक्रम लावा: (P) तांबे (मुक्त अवस्था/सोपे वितळवणे), (Q) लोखंड (वितळवणे), (R) जस्त (बाष्पशील ऑक्साइडचे ऊर्ध्वपातन), (S) ॲल्युमिनियम (विद्युत अपघटन). अभिक्रियाशीलता श्रेणीचा विचार करा.", "q_english": "Arrange the human use/isolation of metals chronologically: (P) Copper (native/easy smelting), (Q) Iron (smelting), (R) Zinc (distillation of volatile oxide), (S) Aluminium (electrolysis). Consider the reactivity series.", "options": ["P → Q → R → S", "P → Q → S → R", "Q → P → R → S", "P → R → Q → S"], "correct_index": 0, "explanation_marathi": "कमी अभिक्रियाशील Cu आधी, नंतर Fe, नंतर Zn (भारत 12वे शतक/1746), शेवटी Al (1886 हॉल-हेरॉल्ट विद्युत अपघटन). त्यामुळे P-Q-R-S बरोबर; Al हा Zn आधी येऊ शकत नाही, म्हणून इतर क्रम चूक.", "evidence": "NCERT Class 10 Science Chapter 3 Metals and Non-metals – reactivity series and history of metallurgy; Hall-Heroult process 1886."}, {"section": 8, "subtopic": "पचन तंत्र", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "पित्ताशय काढलेल्या रुग्णात स्निग्ध आहारानंतर अपचन व फेसाळ शौच दिसते. पित्तरस व स्वादुपिंड रस या दोन संकल्पना एकत्र करून योग्य स्पष्टीकरण कोणते?", "q_english": "After cholecystectomy, a patient has indigestion and frothy stool after fatty food. Combining bile and pancreatic juice, which explanation is correct?", "options": ["पित्तअभाव → चरबीचे इमल्सीकरण नाही → लायपेजला पृष्ठभाग कमी → अपूर्ण चरबी पचन", "पित्तअभाव → HCl निष्प्रभ नाही → पेप्सिन सक्रिय राहते → चरबी पचन बिघडते", "पित्तअभाव → ट्रिप्सिनोजन सक्रिय नाही → प्रथिन पचन बिघडून चरबी साचते", "पित्तअभाव → अमायलेज कमी → कर्बोदक आंबवून फेसाळ शौच होते"], "correct_index": 0, "explanation_marathi": "पित्तात एंझाइम नसते; ते चरबीचे इमल्सीकरण करून लायपेजसाठी पृष्ठभाग वाढवते. पित्तअभावी अपूर्ण चरबी पचन होते. इतर पर्याय HCl/ट्रिप्सिन/अमायलेजचा चुकीचा संबंध जोडतात.", "evidence": "NCERT Class 10 Science Ch.6 – bile emulsification, pancreatic lipase; Class 11 Biology Ch.16 Digestion and Absorption – bile salts, steatorrhea"}, {"section": 8, "subtopic": "पर्यावरण प्रदूषण", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना 1 – जैव-सांद्रीकरण: DDT अन्नसाखळीत वरच्या पातळीवर वाढते. संकल्पना 2 – सुपोषण: नायट्रेट/फॉस्फेटमुळे शैवाल वाढून BOD वाढते. दोन्ही एकाच तलावात घडल्यास उच्च पोषण पातळीवरील माशांवर एकत्रित परिणाम काय?", "q_english": "Concept 1 – Biomagnification: DDT increases at higher trophic levels. Concept 2 – Eutrophication: nitrates/phosphates cause algal growth raising BOD. If both occur in the same lake, what is the combined effect on top-level fish?", "options": ["माशांत DDT सांद्रता सर्वाधिक + BOD वाढून विरघळलेला O₂ घटून मृत्यू", "माशांत DDT सांद्रता घट + BOD घटून O₂ वाढून वाढ", "माशांत DDT स्थिर + BOD वाढून O₂ वाढ", "शैवाल घट + DDT वाढ पण O₂ वर परिणाम नाही"], "correct_index": 0, "explanation_marathi": "जैव-सांद्रीकरणाने शीर्ष भक्षकात DDT सर्वाधिक जमा होते; सुपोषणाने शैवाल कुजून BOD वाढते व DO घटते, त्यामुळे मासे मरतात. इतर पर्याय DDT ची दिशा किंवा BOD-DO व्यस्त संबंध चुकवतात.", "evidence": "NCERT Class 12 Biology Chapter 16 Environmental Issues – biomagnification of DDT, eutrophication, BOD and dissolved oxygen."}, {"section": 8, "subtopic": "प्रतिकारशक्ती लस", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): जिवंत क्षीण लस (live-attenuated) निष्क्रिय लसीपेक्षा दीर्घकाळ टिकणारी पेशी-मध्यस्थ प्रतिकारशक्ती देते. कारण (R): जिवंत क्षीण लस यजमान पेशीत मर्यादित प्रतिकृती करून अंतर्जात प्रतिजन MHC-I वर सादर करते, त्यामुळे CD8+ T पेशी सक्रिय होतात.", "q_english": "Assertion (A): Live-attenuated vaccines give longer-lasting cell-mediated immunity than inactivated vaccines. Reason (R): Live-attenuated vaccine replicates limitedly in host cells, presenting endogenous antigen on MHC-I, activating CD8+ T cells.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "A व R दोन्ही बरोबर; अंतर्जात प्रतिजन MHC-I → CD8+ सक्रियता हेच जिवंत लसीच्या दीर्घ पेशी-प्रतिकारशक्तीचे कारण. त्यामुळे R हे A चे योग्य स्पष्टीकरण आहे; इतर पर्याय स्पष्टीकरण नाकारतात.", "evidence": "NCERT Class 12 Biology Ch.8 Human Health and Disease – active/passive immunity, vaccine types; ICMR/NCDC – live-attenuated vaccines induce MHC-I CD8+ response"}, {"section": 8, "subtopic": "मज्जासंस्था", "qtype": "बहु-विधान", "q_marathi": "मज्जासंस्थेबाबत विधाने: (I) मायलिन आवरण श्वान पेशींपासून बनते व रॅन्व्हियर गाठींवर सॉल्टेटरी वहनाने वेग वाढवते. (II) प्रतिक्षिप्त क्रियेत मेंदू निर्णयानंतरच स्नायू आकुंचन होतो. (III) ॲसिटिलकोलीन Ca2+-आधारित एक्सोसायटोसिसने मुक्त होते; कोलिनेस्टरेज त्याचे विघटन करते.", "q_english": "Statements on nervous system: (I) Myelin from Schwann cells speeds conduction by saltatory conduction at Ranvier nodes. (II) In reflex action muscle contracts only after brain decision. (III) Acetylcholine is released by Ca2+-dependent exocytosis; cholinesterase degrades it.", "options": ["फक्त I, II बरोबर", "फक्त I, III बरोबर", "फक्त II, III बरोबर", "I, II, III सर्व बरोबर"], "correct_index": 1, "explanation_marathi": "I व III बरोबर: सॉल्टेटरी वहन व Ca2+-आधारित ॲसिटिलकोलीन मुक्तता योग्य. II चूक: प्रतिक्षिप्त क्रिया पाठीच्या कण्यातील आंतरन्यूरॉनने मेंदूच्या आदेशाआधीच होते. त्यामुळे फक्त B पर्याय योग्य.", "evidence": "NCERT Class 11 Biology Ch.18 Neural Control – myelin, saltatory conduction, reflex arc via interneuron; Class 11 Ch.19 Chemical Coordination – synaptic transmission"}, {"section": 8, "subtopic": "रक्त घटक", "qtype": "कारण-परिणाम", "q_marathi": "अस्थिमज्जा विकारात मेगाकॅरिओसाइट्स नष्ट झाल्यास किरकोळ खरचटण्यातूनही दीर्घ रक्तस्राव व त्वचेवर परप्युरा दिसतो. यामागील कारण-परिणाम शृंखला कोणती?", "q_english": "In bone-marrow failure megakaryocytes are destroyed, causing prolonged bleeding from minor scratches and purpura. Which cause-effect chain explains this?", "options": ["मेगाकॅरिओसाइट↓ → प्लेटलेट↓ → प्लेटलेट प्लग निर्मिती अयशस्वी → प्राथमिक रक्तस्तंभन बिघडते", "मेगाकॅरिओसाइट↓ → RBC↓ → हिमोग्लोबिन↓ → ऑक्सिजन वहन घटून रक्तस्राव होतो", "मेगाकॅरिओसाइट↓ → न्यूट्रोफिल↓ → संसर्ग वाढून रक्तवाहिन्या फुटतात", "मेगाकॅरिओसाइट↓ → फायब्रिनोजन↓ → प्रोथ्रॉम्बिन कमी होऊन गोठण बिघडते"], "correct_index": 0, "explanation_marathi": "मेगाकॅरिओसाइटपासून प्लेटलेट तयार होतात; प्लेटलेट↓ झाल्यास प्लेटलेट प्लग व प्राथमिक रक्तस्तंभन बिघडते म्हणून रक्तस्राव. इतर पर्याय RBC/श्वेतपेशी/यकृतातील फायब्रिनोजनशी गल्लत करतात.", "evidence": "NCERT Class 10 Science Ch.6 Life Processes – Blood components; Class 12 Biology Ch.18 Body Fluids and Circulation – platelets from megakaryocytes, primary haemostasis"}, {"section": 8, "subtopic": "विद्युत ओहम नियम", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): स्थिर तापमानाला ओहमचा V∝I नियम सर्व धातू वाहकांसाठी नेहमी सत्य असतो. कारण (R): तापमान वाढल्यास धातूत इलेक्ट्रॉन-आयन टक्कर वाढून रोध वाढतो व V-I अरेषीय होऊ शकते.", "q_english": "Assertion (A): At constant temperature Ohm's V∝I holds always for all metallic conductors. Reason (R): Rise in temperature increases electron-ion collisions, raising resistance and possibly making V-I non-linear.", "options": ["A,R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण", "A,R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 3, "explanation_marathi": "A चूक: V∝I फक्त ओमीय वाहकांसाठी स्थिर T ला; अर्धवाहक/वायूनलिका अरेषीय. R बरोबर: T↑→टक्कर↑→रोध↑. म्हणून पर्याय 4; इतर A ला बरोबर मानतात.", "evidence": "NCERT Class 12 Physics Ch.3 Current Electricity; S.L. Arora Vol.1 Ohm’s law limitations"}, {"section": 8, "subtopic": "सेंद्रिय रसायन", "qtype": "कारण-परिणाम", "q_marathi": "(C) फिनॉल इथेनॉलपेक्षा प्रबल आम्ल आहे. (E) फिनॉक्साइड आयन बेंझीन वलयासोबत अनुनादाने स्थायित्व पावतो, तर इथॉक्साइड आयनात हा अनुनाद नसतो. C व E यांचा योग्य संबंध निवडा.", "q_english": "(C) Phenol is a stronger acid than ethanol. (E) Phenoxide ion is stabilized by resonance with the benzene ring, while ethoxide ion has no such resonance. Choose the correct relation between C and E.", "options": ["C व E दोन्ही सत्य, E हे C चे योग्य स्पष्टीकरण आहे", "C व E दोन्ही सत्य, पण E हे C चे योग्य स्पष्टीकरण नाही", "C सत्य, E असत्य", "C असत्य, E सत्य"], "correct_index": 0, "explanation_marathi": "फिनॉलचा pKa ~10, इथेनॉलचा ~16; फिनॉक्साइडच्या ऋण प्रभाराचे वलयात विस्थानीकरण आम्लता वाढवते, म्हणून C व E सत्य व E हेच कारण आहे. इतर पर्याय कारण-परिणाम संबंध नाकारतात म्हणून चूक.", "evidence": "NCERT Class 12 Chemistry Chapter 11 Alcohols, Phenols and Ethers – resonance stabilisation of phenoxide ion."}];let currentFilter='all';const sectionNames={3:"3. चालू घडामोडी",4:"4. इतिहास",5:"5. भूगोल",6:"6. राज्यशास्त्र",7:"7. अर्थशास्त्र",8:"8. सामान्य विज्ञान"};const filtersEl=document.getElementById('filters'),quizEl=document.getElementById('quiz'),progressEl=document.getElementById('progress');function renderFilters(){filtersEl.innerHTML='';const a=document.createElement('button');a.className='filter-btn'+(currentFilter==='all'?' active':'');a.textContent='सर्व (90)';a.onclick=()=>{currentFilter='all';renderFilters();renderQuiz()};filtersEl.appendChild(a);[3,4,5,6,7,8].forEach(s=>{const b=document.createElement('button');b.className='filter-btn'+(currentFilter===s?' active':'');b.textContent=sectionNames[s]+' (15)';b.onclick=()=>{currentFilter=s;renderFilters();renderQuiz()};filtersEl.appendChild(b)})}function renderQuiz(){const qs=QUESTIONS_C.filter(q=>currentFilter==='all'||q.section===currentFilter);progressEl.textContent='संच C • दाखवलेले: '+qs.length;quizEl.innerHTML='';qs.forEach((q,idx)=>{const card=document.createElement('div');card.className='qcard';const letters=['A','B','C','D'];let oh=q.options.map((op,i)=>'<div class="opt"><span class="opt-letter">'+letters[i]+'.</span><span>'+op.replace(/\n/g,'<br>')+'</span></div>').join('');card.innerHTML='<div class="qmeta"><span class="badge">'+sectionNames[q.section]+'</span><span class="badge type">'+(q.qtype||'')+'</span><span class="badge diff">कठीणता 5/5</span><span class="badge" style="background:#f3e5f5;color:#6a1b9a">'+(q.subtopic||'')+'</span></div><div class="qtext"><b>प्रश्न '+(idx+1)+'.</b> '+q.q_marathi.replace(/\n/g,'<br>')+'<span class="en">'+q.q_english.replace(/\n/g,'<br>')+'</span></div><div class="opts">'+oh+'</div><button class="show-ans">उत्तर पहा</button><div class="ansbox"><div class="correct">✅ योग्य उत्तर: '+letters[q.correct_index]+' – '+q.options[q.correct_index]+'</div><div class="expl"><b>स्पष्टीकरण:</b> '+q.explanation_marathi.replace(/\n/g,'<br>')+'</div><div class="evi">पुरावा: '+(q.evidence||'')+'</div></div>';quizEl.appendChild(card);const btn=card.querySelector('.show-ans'),box=card.querySelector('.ansbox');btn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा'};card.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected')}})})}renderFilters();renderQuiz();</script></body></html>
