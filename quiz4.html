let F='all', attempted=new Set(), correct=0;
const fe=document.getElementById('filters'), qe=document.getElementById('quiz'), pText=document.getElementById('pText'), pScore=document.getElementById('pScore'), fg=document.getElementById('fg'), ringTxt=document.getElementById('ringTxt');
function rf(){fe.innerHTML='';let a=document.createElement('button');a.className='filter-btn'+(F==='all'?' active':'');a.textContent='सर्व (90)';a.onclick=()=>{F='all';rf();rq();};fe.appendChild(a);[3,4,5,6,7,8].forEach(s=>{let b=document.createElement('button');b.className='filter-btn'+(F===s?' active':'');b.textContent=SN[s];b.onclick=()=>{F=s;rf();rq();};fe.appendChild(b);});}
function updateProgress(){let total=90;let att=attempted.size;let pct=Math.round(att/total*100);pText.textContent=att+' / '+total+' सोडवले';pScore.textContent=correct+' बरोबर';let circ=2*Math.PI*22;let off=circ - (pct/100)*circ;fg.style.strokeDashoffset=off;ringTxt.textContent=pct+'%';}
function speak(text, lang){if(!('speechSynthesis' in window)){alert('Voice not supported');return;} speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang||'mr-IN';u.rate=0.9;speechSynthesis.speak(u);}
function rq(){let qs=QUESTIONS_E.filter(q=>F==='all'||q.section===F);qe.innerHTML='';qs.forEach((q,i)=>{let idx=QUESTIONS_E.indexOf(q);let c=document.createElement('div');c.className='qcard';let L=['A','B','C','D'];let oh=q.options.map((o,j)=>'<div class=\"opt\" data-j=\"'+j+'\"><b>'+L[j]+'.</b> '+o+'</div>').join('');c.innerHTML='<div class=\"qmeta\"><span class=\"badge\">'+SN[q.section]+'</span><span class=\"badge trap\">'+q.qtype+' Trap</span><span class=\"badge\">'+q.subtopic+'</span></div><div class=\"qtext\"><span class=\"mr\">'+(i+1)+'. '+q.q_marathi+'</span><div class=\"stmt\">'+q.q_marathi.match(/विधाने:.*/)?q.q_marathi:''+'</div><span class=\"en\">'+q.q_english+'</span></div><div style=\"margin-top:10px\">'+oh+'</div><div class=\"row\"><button class=\"show-ans\">उत्तर पहा</button><button class=\"voice-btn\">🔊 वाचा</button></div><div class=\"ansbox\"><b>✅ '+L[q.correct_index]+' – '+q.options[q.correct_index]+'</b><div style=\"margin-top:6px\"><b>स्पष्टीकरण (MR):</b> '+q.explanation_marathi+'</div><div style=\"font-size:12px;color:#444;margin-top:4px\"><b>Evidence:</b> '+q.evidence+'</div></div>';qe.appendChild(c);
let opts=c.querySelectorAll('.opt'); opts.forEach(o=>{o.onclick=()=>{if(attempted.has(idx))return; opts.forEach(x=>x.classList.remove('selected')); o.classList.add('selected'); let j=parseInt(o.dataset.j); attempted.add(idx); if(j===q.correct_index){o.classList.add('correct'); correct++;} else {o.classList.add('wrong'); opts[q.correct_index].classList.add('correct');} updateProgress();};});
let btn=c.querySelector('.show-ans'), box=c.querySelector('.ansbox'); btn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा';};
let vbtn=c.querySelector('.voice-btn'); vbtn.onclick=()=>{speak(q.q_marathi+' . पर्याय: '+q.options.join(' . '), 'mr-IN');};
});}
document.getElementById('shareBtn').onclick=async()=>{let txt='मी संच E (2024-26 Trap) सोडवला: '+attempted.size+'/90, बरोबर '+correct+'! https://drawdrawdraw2025.github.io/quiz4.html'; if(navigator.share){try{await navigator.share({title:'MPSC Quiz Set E',text:txt,url:location.href});}catch(e){}} else {await navigator.clipboard.writeText(txt); alert('Result copied: '+txt);} };
rf();rq();updateProgress();
</script></body></html>
