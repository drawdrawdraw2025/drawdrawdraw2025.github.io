_marathi:"अप्रत्यक्ष कर (भार हस्तांतरणीय); प्रत्यक्ष (आयकर, करदाताच भरतो); GST (2017, 101 वी दुरुस्ती)."},{section:7,subtopic:"GDP-GNP-NNP",qtype:"साधा प्रश्न",q_marathi:"GNP = GDP + काय?",q_english:"GNP = GDP + what?",options:[{m:"घसारा",e:"Depreciation"},{m:"परदेशातून निव्वळ घटक उत्पन्न",e:"Net factor income from abroad"},{m:"अप्रत्यक्ष कर",e:"Indirect taxes"},{m:"अनुदान",e:"Subsidies"}],correct_index:1,explanation_marathi:"GNP = GDP + NFIA; NNP = GNP - घसारा; राष्ट्रीय उत्पन्न = NNP (घटक खर्चावर)."},{section:7,subtopic:"IMF-जागतिक बँक-WTO",qtype:"बहु-विधान",q_marathi:"आंतरराष्ट्रीय संस्थांबद्दल: I. IMF चे मुख्यालय वॉशिंग्टनमध्ये आहे. II. जागतिक बँकेची स्थापना 1944 मध्ये ब्रेटन वुड्समध्ये झाली. III. WTO ची स्थापना 1995 मध्ये GATT च्या जागी झाली.",q_english:"On international institutions: I. IMF HQ in Washington. II. World Bank founded 1944 at Bretton Woods. III. WTO founded 1995 replacing GATT.",options:[{m:"फक्त I आणि II",e:"Only I and II"},{m:"I, II आणि III",e:"I, II and III"},{m:"फक्त II आणि III",e:"Only II and III"},{m:"फक्त I",e:"Only I"}],correct_index:1,explanation_marathi:"तिन्ही बरोबर; IMF (देय शिल्लक), जागतिक बँक (विकास कर्ज), WTO (व्यापार नियम); भारत तिन्हींचा सदस्य."},{section:7,subtopic:"अर्थव्यवस्था क्षेत्रे",qtype:"जोड्या लावा",q_marathi:"क्षेत्रे आणि उदाहरणे: 1. प्राथमिक 2. द्वितीयक 3. तृतीयक 4. चतुर्थक | A. IT सेवा B. शेती C. उत्पादन D. संशोधन",q_english:"Sectors and examples: 1. Primary 2. Secondary 3. Tertiary 4. Quaternary | A. IT services B. Agriculture C. Manufacturing D. Research",options:[{m:"1-B, 2-C, 3-A, 4-D",e:"1-B, 2-C, 3-A, 4-D"},{m:"1-A, 2-B, 3-D, 4-C",e:"1-A, 2-B, 3-D, 4-C"},{m:"1-B, 2-D, 3-A, 4-C",e:"1-B, 2-D, 3-A, 4-C"},{m:"1-D, 2-C, 3-B, 4-A",e:"1-D, 2-C, 3-B, 4-A"}],correct_index:0,explanation_marathi:"प्राथमिक (निसर्ग), द्वितीयक (उद्योग), तृतीयक (सेवा), चतुर्थक (ज्ञान); भारतात तृतीयकाचे योगदान सर्वाधिक (~55%)."},{section:7,subtopic:"अर्थसंकल्प सादरीकरण क्रम",qtype:"कालक्रम",q_marathi:"अर्थसंकल्प प्रक्रियेचा क्रम लावा: 1. आर्थिक
