<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Home</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fbfaf8;color:#0f0f12;padding:20px}
.bg-mesh{position:fixed;inset:0;z-index:-2;background:radial-gradient(at 20% 20%,#a78bfa 0%,transparent 50%),radial-gradient(at 80% 20%,#f472b6 0%,transparent 50%),radial-gradient(at 40% 80%,#4ecdc4 0%,transparent 50%),#fbfaf8}
.bg-blur{position:fixed;inset:0;z-index:-1;backdrop-filter:blur(40px);background:rgba(251,250,248,0.6)}
.floating-home{position:fixed;top:16px;left:16px;z-index:9999;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.72);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:1px solid rgba(255,255,255,0.6);border-radius:50%;font-size:24px;text-decoration:none;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
h1{font-size:clamp(32px,6vw,56px);line-height:1.05;letter-spacing:-.03em;font-weight:900;text-align:center;margin-bottom:12px}
h1 span{background:linear-gradient(135deg,#6c5ce7,#ff6b6b,#ffe66d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:17px;opacity:.6;text-align:center;max-width:480px;margin-bottom:36px;line-height:1.5}
.quiz-window{display:block;width:100%;max-width:520px;text-decoration:none;color:#fff;background:linear-gradient(135deg,rgba(108,92,231,.92),rgba(255,107,107,.88));border-radius:28px;padding:28px;border:1px solid rgba(255,255,255,.5);box-shadow:0 20px 60px rgba(0,0,0,.15);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.quiz-window:hover{transform:translateY(-6px) scale(1.02)}
.q-icon{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
.quiz-window h3{font-size:24px;font-weight:800;margin-bottom:6px}
.quiz-window p{font-size:15px;opacity:.9;line-height:1.4}
</style></head><body>
<div class="bg-mesh"></div><div class="bg-blur"></div>
<a href="index.html" class="floating-home" title="Go to Quiz">🏠</a>

<h1>Welcome to <span>drawdrawdraw2025</span></h1>
<p class="sub">MPSC Talathi 2026 — Interactive Quiz Hub</p>

<a href="index.html" class="quiz-window">
<div class="q-icon">📝</div>
<h3>तलाठी MPSC Quiz</h3>
<p>90 Questions • Set A & B • Marathi + English • Click to Start</p>
</a>

</body></html>
