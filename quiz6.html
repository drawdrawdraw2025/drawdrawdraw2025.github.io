<header><h1>📝 तलाठी MPSC पूर्व परीक्षा 2026 – संच G इंटरॅक्टिव्ह क्विज (7th New)</h1><p>विभाग 3 ते 8 • प्रत्येकी 15 प्रश्न • एकूण 90 प्रश्न • कठीणता 5/5 • उत्तर डीफॉल्ट लपलेले • 100% नवीन</p></header><div class='filters' id='filters'></div><div class='container'><div class='progress' id='progress'></div><div id='quiz'></div></div><script>const QUESTIONS = [{"section": 3, "subtopic": "Agniveer 2025 सुधारणा", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने : (I) अग्निवीर कार्यकाळ 4 वर्षे, त्यापैकी 25% पर्यंत नियमित संवर्गात सामावून घेतले जाते. (II) 2024-25 मध्ये तिन्ही दलांनी प्रमाण वाढवण्याचा प्रस्ताव मांडला – लष्कर/हवाई दल ~50%, नौदल ~75% पर्यंत. (III) ~₹11.71 लाख सेवा निधी पॅकेज (करमुक्त) व CAPF/संरक्षण PSU मध्ये 10% आरक्षण लागू आहे. योग्य पर्याय निवडा.", "q_english": "Statements: (I) Agniveer tenure 4 years, up to 25% retained in regular cadre. (II) In 2024-25 three services proposed hike – Army/IAF ~50%, Navy ~75%. (III) ~Rs.11.71 lakh Seva Nidhi (tax-free) and 10% reservation in CAPF/Defence PSUs. Choose correct option.", "options": ["I, II आणि III बरोबर", "फक्त I आणि II बरोबर", "फक्त I आणि III बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "तिन्ही विधाने बरोबर आहेत – 4 वर्षे/25% ही मूळ तरतूद, 50%/75% हा 2024-25 मधील प्रस्ताव (अंमलात आलेला निर्णय नव्हे) आणि सेवा निधी+आरक्षण लागू आहे. एक विधान वगळणारे पर्याय 2, 3, 4 त्यामुळे चूक; 50% आधीच लागू झाले हा सामान्य गैरसमज आहे.", "evidence": "MoD Agnipath Scheme 2022; Indian Express/The Week 2024 on retention proposal (Army/IAF 50%, Navy 75%); PIB on Seva Nidhi package"}, {"section": 3, "subtopic": "EC SIR 2025 बिहार", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता – बिहार SIR 2025 : गणना 24 जून–25 जुलै 2025; मसुदा यादी 1 ऑगस्ट 2025; दावे/आक्षेप 1 ऑगस्ट–1 सप्टेंबर 2025; अंतिम यादी 30 सप्टेंबर 2025. तक्त्याच्या आधारे योग्य विधान निवडा.", "q_english": "Table – Bihar SIR 2025: Enumeration 24 Jun–25 Jul 2025; Draft roll 1 Aug 2025; Claims/Objections 1 Aug–1 Sep 2025; Final roll 30 Sep 2025. Choose the correct statement based on the table.", "options": ["घटनात्मक आधार कलम 324 आहे; बिहारमधील मागील सखोल पुनरिक्षण 2003 मध्ये झाले होते", "घटनात्मक आधार कलम 326 आहे; बिहारमधील मागील सखोल पुनरिक्षण 2003 मध्ये झाले होते", "घटनात्मक आधार कलम 324 आहे; बिहारमधील मागील सखोल पुनरिक्षण 2005 मध्ये झाले होते", "घटनात्मक आधार कलम 324 आहे; गणना टप्पा 1 जून–25 जून 2025 होता"], "correct_index": 0, "explanation_marathi": "पर्याय 1 बरोबर आहे कारण ECI ला कलम 324 अन्वये मतदार यादी पर्यवेक्षणाचा अधिकार आहे व बिहारमध्ये 2003 नंतर 22 वर्षांनी SIR झाले. पर्याय 2 चूक कारण 326 हा मतदानाचा हक्क आहे; पर्याय 3 चूक कारण 2005 नव्हे 2003; पर्याय 4 चूक कारण तक्त्यातील गणना तारखा वेगळ्या आहेत.", "evidence": "ECI Press Note ECI/PN/297/2025, 24.08.2025; PIB 02.08.2025 (Enumeration 24.06–25.07.2025, draft 01.08.2025)"}, {"section": 3, "subtopic": "G20 2026 अमेरिका तयारी", "qtype": "जोड्या लावा", "q_marathi": "G20 शिखर वर्ष व यजमानस्थानाच्या जोड्या लावा: (a) 2023, (b) 2024, (c) 2025, (d) 2026 आणि (i) नवी दिल्ली, (ii) रिओ दी जानेरो, (iii) जोहान्सबर्ग, (iv) मियामी (2026 साठी नियोजित).", "q_english": "Match G20 summit year with host location: (a) 2023, (b) 2024, (c) 2025, (d) 2026 and (i) New Delhi, (ii) Rio de Janeiro, (iii) Johannesburg, (iv) Miami (planned for 2026).", "options": ["a-i, b-ii, c-iii, d-iv", "a-i, b-ii, c-iii, d-वॉशिंग्टन डी.सी.", "a-i, b-iii, c-ii, d-iv", "a-i, b-ii, c-iv, d-iii"], "correct_index": 0, "explanation_marathi": "योग्य जोडी a-i, b-ii, c-iii, d-iv आहे; 2026 चे शिखर मियामी (डोरल) येथे नियोजित आहे, वॉशिंग्टन नव्हे. पर्याय 2 मध्ये राजधानीबद्दल संभ्रम आहे, पर्याय 3 व 4 मध्ये 2024/2025 व 2025/2026 ची अदलाबदल केली आहे.", "evidence": "G20 official summit archive 2023-2025; White House announcement 2025 on 2026 Miami summit"}, {"section": 3, "subtopic": "Global Hunger Index 2025", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना (A) : GHI चे 4 निर्देशक – अल्पपोषण, बाल-खुंटणे (stunting), बाल-क्षीणता (wasting), 5 वर्षांखालील बालमृत्यू. संकल्पना (B) : GHI 2025 मध्ये भारत 123 देशांत 102 वा (स्कोअर 25.8, 'गंभीर' श्रेणी). योग्य संयोजन निवडा.", "q_english": "Concept (A): GHI's 4 indicators – undernourishment, child stunting, child wasting, under-5 mortality. Concept (B): In GHI 2025 India ranked 102nd of 123 (score 25.8, 'serious'). Choose correct combination.", "options": ["(A) बरोबर आणि (B) बरोबर", "(A) बरोबर पण (B) चूक – भारत 'मध्यम' श्रेणीत आहे", "(A) चूक – पाचवा निर्देशक 'प्रौढ लठ्ठपणा' समाविष्ट आहे आणि (B) बरोबर", "(A) बरोबर आणि (B) चूक – भारत 50 व्या स्थानी आहे"], "correct_index": 0, "explanation_marathi": "A आणि B दोन्ही बरोबर आहेत – GHI चे 4च निर्देशक आहेत, 2025 मध्ये भारत 102/123, स्कोअर 25.8 serious आहे. पर्याय 2 चूक कारण श्रेणी serious आहे; पर्याय 3 चूक कारण प्रौढ लठ्ठपणा GHI घटक नाही; पर्याय 4 चूक कारण 50 वा क्रम GHI चा नाही.", "evidence": "Global Hunger Index 2025 Report (Concern Worldwide & Welthungerhilfe), 10.10.2025 – India 102/123, score 25.8, serious"}, {"section": 3, "subtopic": "ISRO Chandrayaan-4 2027 तयारी", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "चांद्रयान-4 (2027 लक्ष्य) संदर्भात खालील विधानांचा विचार करा:\nI. सप्टेंबर 2024 मध्ये केंद्रीय मंत्रिमंडळाने चांद्रयान-4 ला मान्यता दिली; 2027 मध्ये प्रक्षेपणाचे लक्ष्य आहे.\nII. हे चंद्रावरून नमुने पृथ्वीवर परत आणणारे (Sample Return) मिशन असेल; दोन LVM-3 रॉकेटद्वारे पाच मॉड्यूल्स प्रक्षेपित करून अंतराळात डॉकिंग/अनडॉकिंग केले जाईल.\nIII. हे ISRO-JAXA चे संयुक्त LUPEX मिशन असून जपानी H3 रॉकेटने प्रक्षेपित होईल.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements regarding Chandrayaan-4 (target 2027):\nI. The Union Cabinet approved Chandrayaan-4 in September 2024; launch is targeted for 2027.\nII. It will be a lunar Sample Return mission; five modules will be launched by two LVM-3 rockets with space docking/undocking.\nIII. It is the ISRO-JAXA joint LUPEX mission to be launched by Japanese H3 rocket.\nChoose the correct option:", "options": ["फक्त I बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III सर्व बरोबर"], "correct_index": 1, "explanation_marathi": "I व II बरोबर आहेत - 18 सप्टेंबर 2024 रोजी कॅबिनेट मान्यता, सॅम्पल-रिटर्न उद्दिष्ट आणि SPADEX-आधारित दुहेरी LVM-3 डॉकिंग आराखडा ISRO ने जाहीर केला आहे. III चूक आहे कारण LUPEX हे चांद्रयान-5 (ISRO-JAXA, H3 रॉकेट) आहे, चांद्रयान-4 पूर्ण स्वदेशी आहे. त्यामुळे 'फक्त I', 'II+III' आणि 'सर्व बरोबर' हे पर्याय बाद होतात.", "evidence": "Union Cabinet approval 18 Sept 2024; ISRO status presentation 2024-25; SPADEX docking experiment Jan 2025"}, {"section": 3, "subtopic": "ISRO NISAR 2025 प्रक्षेपण", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): NISAR उपग्रहाचे 30 जुलै 2025 रोजी श्रीहरिकोटा येथून GSLV-F16 द्वारे प्रक्षेपण करण्यात आले. कारण (R): NISAR हा NASA च्या L-बँड व ISRO च्या S-बँडसह जगातील पहिला ड्युअल-बँड SAR उपग्रह असून सुमारे 2,800 किग्रॅ वजनामुळे GSLV आवश्यक होता.", "q_english": "Assertion (A): NISAR satellite was launched on 30 July 2025 from Sriharikota by GSLV-F16. Reason (R): NISAR is the world's first dual-band SAR satellite with NASA's L-band and ISRO's S-band, weighing ~2,800 kg, hence requiring GSLV.", "options": ["A आणि R दोन्ही सत्य आहेत, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे, R असत्य आहे", "A असत्य आहे, R सत्य आहे"], "correct_index": 0, "explanation_marathi": "A आणि R दोन्ही सत्य आहेत; जड वजनामुळे PSLV नव्हे तर GSLV-F16 वापरला गेला आणि L-बँड NASA / S-बँड ISRO ही विभागणी बरोबर आहे, म्हणून R हे A चे योग्य स्पष्टीकरण आहे. पर्याय 1 स्पष्टीकरण नाकारतो, पर्याय 2 मध्ये बँड-वाटप उलटे मानणे ही सामान्य चूक आहे, पर्याय 3 मध्ये PSLV संभ्रम आहे.", "evidence": "ISRO/NASA NISAR factsheet 2025; PIB 30 July 2025"}, {"section": 3, "subtopic": "India AI Impact Summit 2026", "qtype": "नकाशा आधारित", "q_marathi": "जागतिक नकाशात दर्शवलेल्या AI शिखर स्थळांबाबत (1-ब्लेचली पार्क, UK; 2-पॅरिस; 3-नवी दिल्ली, भारत मंडपम) योग्य क्रम ओळखा:", "q_english": "With reference to the world map showing AI summit venues (1-Bletchley Park, UK; 2-Paris; 3-New Delhi, Bharat Mandapam), identify the correct sequence:", "options": ["1-2023 AI Safety Summit, 2-2025 AI Action Summit, 3-2026 (19-20 Feb) AI Impact Summit", "1-2023 AI Safety Summit, 2-2026 AI Impact Summit, 3-2025 AI Action Summit", "1-2025 AI Action Summit, 2-2023 AI Safety Summit, 3-2026 AI Impact Summit", "1-2023 AI Safety Summit, 2-2025 AI Action Summit, 3-2025 AI Safety Summit"], "correct_index": 0, "explanation_marathi": "योग्य क्रम ब्लेचली 2023, पॅरिस 2025, नवी दिल्ली 19-20 फेब्रुवारी 2026 हा आहे. पर्याय 2 व 3 मध्ये पॅरिस-दिल्लीची अदलाबदल आहे, पर्याय 4 मध्ये दिल्लीतील 2026 ऐवजी 2025 ची पुनरावृत्ती ही सामान्य चूक आहे.", "evidence": "UK DSIT Bletchley 2023 report; France Elysee AI Action Summit 2025; MeitY announcement 2025 for AI Impact Summit 19-20 Feb 2026"}, {"section": 3, "subtopic": "Maharashtra EV चार्जिंग 2025", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "महाराष्ट्र EV चार्जिंग पायाभूत सुविधा 2025 बाबत विचार करा: (I) EV धोरण 2025 नुसार प्रमुख महामार्गांवर दर 25 किमीवर सार्वजनिक चार्जिंग स्टेशनचे लक्ष्य आहे. (II) नवीन निवासी/व्यावसायिक इमारतींमध्ये निर्धारित पार्किंगपैकी 20% जागा EV चार्जिंगसाठी सज्ज ठेवणे अनिवार्य आहे. (III) चार्जिंग पायाभूत सुविधांसाठी Viability Gap Funding केवळ शासकीय उपक्रमांनाच देय आहे.", "q_english": "Consider Maharashtra EV charging infrastructure 2025: (I) EV Policy 2025 targets public charging station every 25 km on major highways. (II) 20% of prescribed parking in new residential/commercial buildings must be EV-charging ready. (III) Viability Gap Funding for charging infra is available only to government entities.", "options": ["फक्त I आणि II बरोबर", "फक्त I आणि III बरोबर", "I, II आणि III सर्व बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I व II धोरणातील तरतुदींनुसार सत्य आहेत; III असत्य आहे कारण VGF PPP तत्त्वावर खाजगी विकासकांनाही उपलब्ध आहे. पर्याय 2, 3 व 4 हे III सत्य मानतात ही सामान्य गैरसमजूत आहे, तर पर्याय 4 I वगळतो.", "evidence": "Maharashtra EV Policy 2025 GR; Maharashtra Industries Dept 2025; MEDA report 2025"}, {"section": 3, "subtopic": "Mission LiFE 2025", "qtype": "Assertion-Reason", "q_marathi": "विधान (A) : मिशन LiFE हे COP26 मध्ये भारताने मांडलेले जनआंदोलन असून त्याचे नोडल मंत्रालय पर्यावरण, वन व हवामान बदल मंत्रालय (MoEFCC) आहे. कारण (R) : मिशन LiFE चा एकमेव उद्देश एकल-वापर प्लास्टिक बंदी करणे हा आहे.", "q_english": "Assertion (A): Mission LiFE is a people's movement proposed by India at COP26 with MoEFCC as nodal ministry. Reason (R): The sole objective of Mission LiFE is single-use plastic ban.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 2, "explanation_marathi": "A बरोबर आहे – LiFE संकल्पना COP26 (ग्लासगो 2021), लाँच ऑक्टो. 2022, नोडल MoEFCC, डिसें. 2025 पर्यंत 6 कोटी+ सहभाग. R चूक आहे कारण LiFE चे 7 थीम्सवरील शाश्वत जीवनशैली हे व्यापक उद्दिष्ट आहे, केवळ प्लास्टिक बंदी नव्हे. त्यामुळे पर्याय 1, 2, 4 चूक.", "evidence": "PIB 22.05.2025 (Ideas4LiFE); MoEFCC – nodal ministry; Business Standard on Mission LiFE (launched Oct 2022, 2022-2028)"}, {"section": 3, "subtopic": "Mumbai Metro 3 पूर्ण 2025", "qtype": "कालक्रम लावा", "q_marathi": "मुंबई मेट्रो-3 (ॲक्वा लाईन, 33.5 किमी भूमिगत) संदर्भातील घटनांचा योग्य कालक्रम लावा: (A) JICA कर्ज करार (2013), (B) आरे ते BKC टप्पा-1 उद्घाटन (ऑक्टोबर 2024), (C) BKC ते आचार्य अत्रे चौक टप्पा-2A उद्घाटन (मे 2025), (D) आचार्य अत्रे चौक ते कफ परेड अंतिम टप्प्यासह पूर्ण मार्गिका कार्यान्वित (ऑगस्ट 2025).", "q_english": "Arrange in chronological order events of Mumbai Metro-3 (Aqua Line, 33.5 km underground): (A) JICA loan agreement (2013), (B) Aarey to BKC Phase-1 inauguration (Oct 2024), (C) BKC to Acharya Atre Chowk Phase-2A inauguration (May 2025), (D) Full corridor operational up to Cuffe Parade (Aug 2025).", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A-B-C-D आहे; JICA करार 2013 मध्ये सर्वात आधी झाला, नंतर टप्प्याटप्प्याने आरे-BKC (2024), BKC-अत्रे चौक (2025) व शेवटी कफ परेड (2025) सुरू झाली. पर्याय 2 मध्ये B आधी ठेवून बांधकामापूर्वी उद्घाटन दाखवले आहे, पर्याय 1 व 3 मध्ये टप्पा-1/टप्पा-2 व अंतिम टप्प्याचा क्रम उलटवला आहे.", "evidence": "MMRCL press releases 2024-25; PIB 10 May 2025 & 11 Aug 2025"}, {"section": 3, "subtopic": "PM Surya Ghar 2025 प्रगती", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा : (a) योजनेचे लक्ष्य, (b) 3 kW साठी केंद्रीय अर्थसहाय्य, (c) मोफत वीज लाभ, (d) नोडल मंत्रालय — (1) मार्च 2027 पर्यंत 1 कोटी घरे, (2) ₹78,000, (3) दरमहा 300 युनिट, (4) नवीन व नवीकरणीय ऊर्जा मंत्रालय (MNRE)", "q_english": "Match w.r.t. PM Surya Ghar: Muft Bijli Yojana: (a) Scheme target, (b) Central subsidy for 3 kW, (c) Free electricity benefit, (d) Nodal Ministry — (1) 1 crore households by March 2027, (2) Rs.78,000, (3) 300 units per month, (4) Ministry of New and Renewable Energy (MNRE)", "options": ["a-1, b-2, c-3, d-4", "a-1, b-2, c-4, d-3", "a-2, b-1, c-3, d-4", "a-1, b-4, c-3, d-2"], "correct_index": 0, "explanation_marathi": "a-1, b-2, c-3, d-4 बरोबर आहे कारण लक्ष्य मार्च 2027 पर्यंत 1 कोटी, 3 kW साठी ₹78,000 (1kW-₹30,000, 2kW-₹60,000), दरमहा 300 युनिट मोफत आणि नोडल MNRE आहे. पर्याय 2 मध्ये c/d अदलाबदल, पर्याय 3 मध्ये लक्ष्य/अनुदान अदलाबदल, पर्याय 4 मध्ये अनुदान/मंत्रालय अदलाबदल ही सामान्य गैरसमजांवर आधारित चूक आहे.", "evidence": "PIB 11.03.2025 (10.09 लाख installations as on 10.03.2025); MNRE Guidelines – target 1 crore by March 2027, subsidy slabs"}, {"section": 3, "subtopic": "RBI UPI 2025 आंतरराष्ट्रीय विस्तार", "qtype": "जोड्या लावा", "q_marathi": "UPI आंतरराष्ट्रीय विस्तार (2025 पर्यंतची स्थिती) संदर्भात जोड्या लावा:\nअ) फ्रान्स  ब) सिंगापूर  क) श्रीलंका व मॉरिशस  ड) UAE\n1) UPI-PayNow सीमापार जलद पेमेंट लिंकेज  2) आयफेल टॉवर येथून UPI स्वीकृती सुरू  3) NeoPay/Mashreq नेटवर्कद्वारे व्यापारी आस्थापनांत UPI स्वीकृती  4) UPI व RuPay कार्ड संयुक्त लाँच (मार्च 2024)", "q_english": "Match the following regarding UPI international expansion (status till 2025):\na) France b) Singapore c) Sri Lanka & Mauritius d) UAE\n1) UPI-PayNow cross-border fast payment linkage 2) UPI acceptance launched from Eiffel Tower 3) Merchant acceptance via NeoPay/Mashreq network 4) Joint launch of UPI and RuPay cards (March 2024)", "options": ["अ-2, ब-1, क-4, ड-3", "अ-3, ब-1, क-4, ड-2", "अ-2, ब-4, क-1, ड-3", "अ-1, ब-2, क-3, ड-4"], "correct_index": 0, "explanation_marathi": "अ-2 (फ्रान्स-आयफेल टॉवर, फेब्रु. 2024), ब-1 (सिंगापूर-PayNow, फेब्रु. 2023), क-4 (श्रीलंका-मॉरिशस, मार्च 2024), ड-3 (UAE-NeoPay) हे NPCI International नुसार बरोबर आहे. फ्रान्स-UAE अदलाबदल, सिंगापूर-श्रीलंका अदलाबदल आणि अनुक्रमिक लावणी हे सामान्य गैरसमज असल्याने इतर तिन्ही पर्याय चूक ठरतात.", "evidence": "NPCI International report 2024-25; RBI Annual Report 2024-25; UPI-PayNow linkage Feb 2023; launch in Sri Lanka & Mauritius 26 Feb 2024"}, {"section": 3, "subtopic": "UNESCO 2025 भारत वारसा", "qtype": "कारण-परिणाम", "q_marathi": "खालील विधाने विचारात घ्या:\nकारण (1): 'मराठा मिलिटरी लँडस्केप्स ऑफ इंडिया' मध्ये साल्हेर, शिवनेरी, लोहगड, खांदेरी, रायगड, राजगड, प्रतापगड, सुवर्णदुर्ग, पन्हाळा, विजयदुर्ग, सिंधुदुर्ग (महाराष्ट्र) व जिंजी (तामिळनाडू) या 12 किल्ल्यांतील गिरी-दुर्ग, सागरी-दुर्ग व भू-दुर्ग स्थापत्याचे वैविध्य दिसते.\nपरिणाम (2): जुलै 2025 मध्ये पॅरिस येथील 47 व्या सत्रात UNESCO ने त्याला 'सांस्कृतिक' श्रेणीत भारताचे 44 वे जागतिक वारसा स्थळ म्हणून मान्यता दिली.", "q_english": "Consider the following:\nCause (1): 'Maratha Military Landscapes of India' shows typological variety of hill, coastal and land forts across 12 forts - Salher, Shivneri, Lohgad, Khanderi, Raigad, Rajgad, Pratapgad, Suvarnadurg, Panhala, Vijaydurg, Sindhudurg (Maharashtra) and Gingee (Tamil Nadu).\nEffect (2): In July 2025 at its 47th session in Paris, UNESCO inscribed it as India's 44th World Heritage Site under 'Cultural' category.", "options": ["(1) आणि (2) दोन्ही बरोबर आहेत आणि (1) हे (2) चे योग्य कारण आहे", "(1) आणि (2) दोन्ही बरोबर आहेत परंतु (1) हे (2) चे योग्य कारण नाही", "(1) बरोबर आहे परंतु (2) चूक आहे", "(1) चूक आहे परंतु (2) बरोबर आहे"], "correct_index": 0, "explanation_marathi": "(1) मधील 12 किल्ल्यांचे स्थापत्य-वैविध्य हेच निकष (iv)(vi) अंतर्गत Outstanding Universal Value ठरल्याने (2) मधील 2025 सांस्कृतिक मान्यता व 44 वा दर्जा मिळाला, त्यामुळे कारण-परिणाम संबंध योग्य आहे. 'कारण नाही' म्हणणारा तसेच 43 वा दर्जा/नैसर्गिक श्रेणी मानणारे गैरसमज व एक विधान चूक ठरवणारे पर्याय बाद होतात.", "evidence": "UNESCO WHC 47th session decision, Paris July 2025; PIB release 12 July 2025; ASI nomination dossier 2024-25"}, {"section": 3, "subtopic": "भारत-जपान बुलेट ट्रेन 2025", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): मुंबई-अहमदाबाद हायस्पीड रेल (बुलेट ट्रेन) प्रकल्प 508 किमी लांबीचा असून त्यात जपानी शिंकान्सेन तंत्रज्ञान वापरले जात आहे.\nकारण (R): या प्रकल्पाच्या सुमारे 81% खर्चाचा निधी JICA कडून 0.1% व्याजदर व 50 वर्षे परतफेड कालावधीच्या कर्जाद्वारे उपलब्ध होतो.", "q_english": "Assertion (A): The Mumbai-Ahmedabad High Speed Rail (Bullet Train) project is 508 km long and uses Japanese Shinkansen technology.\nReason (R): About 81% of the project cost is funded by JICA loan at 0.1% interest with 50-year repayment period.", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य आहेत परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे परंतु R असत्य आहे", "A असत्य आहे परंतु R सत्य आहे"], "correct_index": 1, "explanation_marathi": "A (508 किमी, 12 स्थानके, शिंकान्सेन) व R (JICA 81%, 0.1%, 50 वर्षे) दोन्ही तथ्यतः सत्य आहेत, पण R हा निधीचा तपशील आहे; तंत्रज्ञान निवडीचे कारण शिंकान्सेनची 320 किमी/तास क्षमता व भारत-जपान MoU आहे. त्यामुळे 'R हे योग्य स्पष्टीकरण' असलेला पर्याय तसेच एक विधान चूक ठरवणारे पर्याय बाद होतात.", "evidence": "NHSRCL project status report 2025; JICA ODA loan agreement 2017; Indo-Japan MoU 2013"}, {"section": 3, "subtopic": "महाराष्ट्र युवा कार्य प्रशिक्षण 2025", "qtype": "कालक्रम लावा", "q_marathi": "महाराष्ट्र 'मुख्यमंत्री युवा कार्य प्रशिक्षण योजना' (विद्यावेतन: 12वी-₹6,000, ITI/पदविका-₹8,000, पदवीधर-₹10,000; 6 महिने) संदर्भातील घटनांचा योग्य कालक्रम लावा:\nA) राज्य अर्थसंकल्प 2024-25 मध्ये योजनेची घोषणा\nB) कौशल्य, रोजगार, उद्योजकता विभागाचा शासन निर्णय (GR) निर्गमित\nC) महास्वयम् रोजगार पोर्टलवर उमेदवार व आस्थापना नोंदणी सुरू\nD) 2025 मध्ये सुधारित मार्गदर्शक सूचना/मुदतवाढ जारी", "q_english": "Arrange the following events of Maharashtra 'Mukhyamantri Yuva Karya Prashikshan Yojana' (stipend: 12th-Rs 6,000, ITI/Diploma-Rs 8,000, Graduate-Rs 10,000; 6 months) in chronological order:\nA) Announcement in State Budget 2024-25\nB) Government Resolution (GR) by Skill, Employment & Entrepreneurship Dept\nC) Candidate & establishment registration on Mahaswayam employment portal\nD) Revised guidelines/extension issued in 2025", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A (जून 2024 अर्थसंकल्पीय घोषणा) → B (9 जुलै 2024 GR) → C (ऑगस्ट 2024 पोर्टल नोंदणी) → D (2025 सुधारणा) आहे. GR आधी पोर्टल, घोषणे आधी GR किंवा D आधी C लावणे हे प्रशासकीय प्रक्रियेच्या गैरसमजावर आधारित असल्याने इतर पर्याय बाद होतात.", "evidence": "Maharashtra Budget 2024-25 (28 June 2024); Skill Development Dept GR 9 July 2024; mahaswayam.gov.in portal data; Dept review note 2025"}, {"section": 4, "subtopic": "एलिफंटा त्रिमूर्ती", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र करा — संकल्पना 1: एलिफंटा त्रिमूर्तीचा अर्थ; संकल्पना 2: लेण्यांचा काळ व आश्रयदाते. योग्य एकत्रित पर्याय निवडा.", "q_english": "Combine two concepts — Concept 1: meaning of Elephanta Trimurti; Concept 2: period and patrons of the caves. Choose the correct combined option.", "options": ["त्रिमूर्ती = ब्रह्मा-विष्णू-महेश; 7 व्या शतकातील राष्ट्रकूट निर्मिती", "त्रिमूर्ती = शिवाची तीन रूपे (अघोर-वामदेव-तत्पुरुष/सदाशिव); 6 व्या शतकातील कलचुरी (कृष्णराज) काळातील शैव लेणी", "त्रिमूर्ती = शिव-पार्वती-स्कंद; 5 व्या शतकातील वाकाटक निर्मिती", "त्रिमूर्ती = ब्रह्मा-विष्णू-महेश; 6 व्या शतकातील चालुक्य-बदामी निर्मिती"], "correct_index": 1, "explanation_marathi": "एलिफंटाची महेशमूर्ती ही ब्रह्मा-विष्णू-महेश नव्हे तर शिवाचीच तीन रूपे (निर्मिती-संरक्षण-संहार) दर्शवते आणि लेणी 6 व्या शतकातील कलचुरींची शैव निर्मिती आहेत. त्यामुळे A/D मधील 'ब्रह्मा-विष्णू-महेश' समज आणि राष्ट्रकूट/बदामी काळ हे गैरसमज ठरतात; C मधील पार्वती-स्कंद व वाकाटक काळही चूक.", "evidence": "UNESCO World Heritage List – Elephanta Caves inscription (1987); ASI – Elephanta Caves guidebook"}, {"section": 4, "subtopic": "कान्हेरी बौद्ध लेणी", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): कान्हेरी लेणी सोपारा-कल्याण प्राचीन व्यापारी मार्गावर असल्याने तेथे व्यापारी, यवन आदी देणगीदारांचे दानलेख आढळतात. विधान (R): कान्हेरी टेकडीवर पावसाचे पाणी साठवण्यासाठी दगडात कोरलेल्या 'पोड्ही' (जलकुंडांची) व्यवस्था होती.", "q_english": "Statement (A): Kanheri caves lie on the ancient Sopara-Kalyan trade route, hence donative inscriptions of merchants and Yavanas are found there. Statement (R): Kanheri hill had rock-cut cisterns (podhis) for storing rainwater.", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य परंतु R असत्य आहे", "A असत्य परंतु R सत्य आहे"], "correct_index": 1, "explanation_marathi": "A आणि R दोन्ही सत्य आहेत; व्यापारी मार्गामुळे दानलेख हे खरे, जलकुंडी व्यवस्था हेही खरे. पण R हे A चे कारण नाही — जलव्यवस्था ही डोंगरावरील पाणीटंचाईवरील उपाय होती, दानाचे कारण नव्हे. म्हणून A पर्यायातील 'स्पष्टीकरण' चूक, C/D मधील सत्य-असत्य दावे चूक.", "evidence": "ASI Mumbai Circle – Kanheri Caves documentation (2023); Annual Report on Indian Epigraphy – donative inscriptions of merchants/Yavanas"}, {"section": 4, "subtopic": "झाशी राणी 1857", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): लॉर्ड डलहौसीने दत्तक विधान (Doctrine of Lapse) लागू करून गंगाधररावांच्या मृत्यूनंतर (1853) दत्तक पुत्र दामोदररावाचा वारसा नामंजूर केला व 1854 मध्ये झाशी ब्रिटिश साम्राज्यात विलीन केले. परिणाम (E): झाशी राणी लक्ष्मीबाईंनी 1857 च्या उठावात सहभाग घेऊन 18 जून 1858 रोजी ग्वाल्हेर येथे ह्यू रोजच्या सैन्याशी लढताना वीरमरण पत्करले.", "q_english": "Cause (C): Lord Dalhousie applied the Doctrine of Lapse, rejected adopted son Damodar Rao's succession after Gangadhar Rao's death (1853) and annexed Jhansi in 1854. Effect (E): Rani Lakshmibai joined the 1857 revolt and died fighting Hugh Rose's forces at Gwalior on 18 June 1858.", "options": ["C सत्य, E सत्य, E हा C चा तार्किक परिणाम आहे / C true, E true, E is the logical consequence of C", "C सत्य, E सत्य, परंतु E हा C चा तार्किक परिणाम नाही / C true, E true, but E is NOT the logical consequence of C", "C सत्य, E असत्य / C true, E false", "C असत्य, E सत्य / C false, E true"], "correct_index": 0, "explanation_marathi": "C व E दोन्ही सत्य असून खालसा-जन्य असंतोषातूनच राणी उठावात ओढली गेली, म्हणून E हा C चा तार्किक परिणाम आहे. पर्याय २ चूक कारण तात्या टोपे युती दुय्यम, मूळ तक्रार खालसाच; पर्याय ३ चूक कारण मृत्यू ग्वाल्हेर, 18 जून 1858 व प्रतिस्पर्धी ह्यू रोज हेच सत्य (झाशी नव्हे, कॉलिन कॅम्पबेल नव्हे); पर्याय ४ चूक कारण 1854 खालसा ऐतिहासिक तथ्य आहे.", "evidence": "Doctrine of Lapse 1848-1856; Jhansi annexed 1854; Hugh Rose's Gwalior dispatch, 18 June 1858"}, {"section": 4, "subtopic": "डलहौसी दत्तक वारसा धोरण", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "डलहौसीच्या दत्तक वारसा नामंजूर धोरणाबाबत (Doctrine of Lapse) कोणते दोन निष्कर्ष एकत्रितपणे योग्य आहेत?", "q_english": "Regarding Dalhousie's Doctrine of Lapse, which two conclusions together are correct?", "options": ["(i) सातारा (1848) हे धोरणाखाली खालसा झालेले पहिले राज्य; (ii) झाशी (1854) व नागपूर (1854) यांचे खालसे याच धोरणानुसार झाले", "(i) सातारा (1848) हे पहिले खालसा राज्य; (ii) हैदराबाद (1853) हे दत्तक वारसा धोरणाने खालसा झाले", "(i) करौली (1852) खालसा झाले; (ii) झाशी (1853) मध्ये खालसा झाली", "(i) पंजाब (1849) दत्तक वारसा धोरणाने खालसा झाला; (ii) अवध (1856) दत्तक वारसा धोरणाने खालसा झाले"], "correct_index": 0, "explanation_marathi": "पर्याय 1 मधील दोन्ही निष्कर्ष बरोबर: सातारा 1848 पहिले, झाशी-नागपूर 1854. पर्याय 2 मधील हैदराबाद, पर्याय 4 मधील पंजाब (विजयाने) व अवध (कुशासनाच्या कारणाने) या धोरणाखालील नाहीत; पर्याय 3 मध्ये करौलीचा प्रस्ताव संचालक मंडळाने फेटाळला व झाशीचे वर्ष चूक आहे.", "evidence": "Dalhousie Minute 30 Aug 1848; Parliamentary Papers on Annexations 1848-56; Percival Spear – India: A Modern History"}, {"section": 4, "subtopic": "थोरले बाजीराव मोहीम", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): थोरले बाजीरावाने 1728 मध्ये पालखेड येथे निजाम-उल-मुल्क आसफजाह I चा पराभव करून मुंगी-शेगावचा तह लादला. कारण (R): बाजीरावाने पालखेड मोहिमेत वेगवान घोडदळाच्या हालचालींनी निजामाची रसद व पाणीपुरवठा तोडून छापामार कोंडी केली.", "q_english": "Assertion (A): Thorle Bajirao defeated Nizam-ul-Mulk Asafjah I at Palkhed in 1728 and imposed the Treaty of Mungi-Shegaon. Reason (R): At Palkhed, Bajirao cut off the Nizam's supplies and water by rapid cavalry manoeuvres and guerrilla encirclement.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A व R दोन्ही सत्य असून R हे A ची कार्यकारण युक्ती स्पष्ट करते; म्हणून पर्याय 2 बाद. पालखेड (1728) चा भोपाळ मोहीमेशी (1737) गोंधळ करणारे पर्याय 3-4 चूक ठरतात.", "evidence": "Grant Duff – History of the Mahrattas (1826); मुंगी-शेगाव तहपत्र 6 मार्च 1728; Peshwa Daftar correspondence"}, {"section": 4, "subtopic": "दौलताबाद किल्ला", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने पहा: (I) देवगिरी ही यादव (रामचंद्रदेव) राजधानी होती; अल्लाउद्दीन खिलजीने 1296 मध्ये स्वारी करून खंडणी वसूल केली. (II) मुहम्मद बिन तुघलकने 1327 मध्ये राजधानी दिल्लीहून देवगिरी/दौलताबादला हलवली. (III) किल्ल्यातील 'चांद मिनार' बहामनी सुलतान अलाउद्दीन अहमदशाहने बांधली; 'अंधेरी' हा शत्रूला चकवणारा अंधारी भुलभुलैय्या मार्ग आहे.", "q_english": "Statements: (I) Devgiri was Yadava (Ramachandradeva) capital; Alauddin Khalji raided it in 1296 and exacted tribute. (II) Muhammad bin Tughlaq shifted capital from Delhi to Devgiri/Daulatabad in 1327. (III) Chand Minar was built by Bahmani Sultan Ala-ud-din Ahmad Shah; 'Andheri' is the dark maze passage confusing enemies.", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर", "I, II आणि III सर्व बरोबर"], "correct_index": 3, "explanation_marathi": "तिन्ही विधाने सत्य आहेत — यादव राजधानी व 1296 खिलजी स्वारी, 1327 तुघलक राजधानी बदल आणि चांद मिनार (बहामनी) + अंधेरी वर्णन ऐतिहासिकदृष्ट्या बरोबर. त्यामुळे फक्त दोन विधाने घेणारे A, B, C पर्याय अपूर्ण ठरतात.", "evidence": "ASI – Daulatabad Fort monument report (2022); Tarikh-i-Firozshahi – account of 1327 transfer"}, {"section": 4, "subtopic": "प्रतापगड 1659", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: (i) तारीख — 10 नोव्हेंबर 1659, (ii) ठिकाण — प्रतापगड पायथा (जावळी), (iii) खानाचा वकील — कृष्णाजी भास्कर, (iv) वधाचे शस्त्र — वाघनखे व बिचवा. तक्त्याशी पूर्णतः सुसंगत पर्याय निवडा.", "q_english": "Table: (i) date — 10 Nov 1659, (ii) place — Pratapgad foothills (Javali), (iii) Khan's envoy — Krishnaji Bhaskar, (iv) weapon — wagh-nakh and bichwa. Choose the fully consistent option.", "options": ["भेट 10 नोव्हेंबर 1659 — प्रतापगड पायथा — वकील कृष्णाजी भास्कर — वध वाघनखे व बिचव्याने", "भेट 10 नोव्हेंबर 1659 — प्रतापगड पायथा — वकील गोपीनाथ पंत — वध कट्यारीने", "भेट 20 डिसेंबर 1659 — रायगड — वकील कृष्णाजी भास्कर — वध वाघनखांनी", "भेट 10 नोव्हेंबर 1659 — पन्हाळगड — वकील कृष्णाजी भास्कर — वध भाल्याने"], "correct_index": 0, "explanation_marathi": "A तक्त्याशी पूर्ण सुसंगत आहे — तारीख, ठिकाण, वकील व शस्त्रे बरोबर. B मध्ये वकिलाचे नाव व शस्त्र चूक, C मध्ये तारीख-ठिकाण चूक, D मध्ये ठिकाण (पन्हाळगड) व शस्त्र चूक — ही सर्व सामान्य गैरसमजांवर आधारित पर्याय आहेत.", "evidence": "Jedhe Shakavali – 1659 entry (10 Nov 1659); Sabhasad Bakhar – Afzal Khan episode"}, {"section": 4, "subtopic": "मौर्य चाणक्य अर्थशास्त्र", "qtype": "कालक्रम लावा", "q_marathi": "खालील घटनांचा योग्य कालक्रम लावा: (a) कौटिल्याच्या अर्थशास्त्रातील सप्तांग राज्य सिद्धांताची मांडणी (b) मेगास्थिनिसचे 'इंडिका' लेखन (c) अशोकाचे प्रमुख धम्मलेख (d) विशाखदत्ताचे 'मुद्राराक्षस' नाटक", "q_english": "Arrange in correct chronological order: (a) Kautilya's formulation of Saptanga theory in Arthashastra (b) Megasthenes' writing of 'Indica' (c) Ashoka's Major Rock Edicts (d) Vishakhadatta's play 'Mudrarakshasa'", "options": ["a-b-c-d", "b-a-c-d", "a-c-b-d", "a-b-d-c"], "correct_index": 0, "explanation_marathi": "योग्य क्रम a-b-c-d आहे: अर्थशास्त्र (इ.स.पू. 321-296) चंद्रगुप्त काळात, इंडिका (इ.स.पू. 302-288) सेल्यूकस तहानंतर, धम्मलेख (इ.स.पू. 268-232) अशोक काळात, मुद्राराक्षस गुप्त काळात (इ.स. 4थे-5वे शतक). पर्याय २/३ मेगास्थिनिस-चाणक्य क्रम उलटवतात (सामान्य गफलत), पर्याय ४ मुद्राराक्षसाला मौर्य समकालीन मानतो जे चूक आहे.", "evidence": "Arthashastra c. 321-296 BCE; Megasthenes Indica c. 302-288 BCE; Ashokan Major Rock Edicts c. 268-232 BCE; Mudrarakshasa, Vishakhadatta, Gupta period c. 4th-5th century CE"}, {"section": 4, "subtopic": "रायगड राजधानी", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) रायगडचे पूर्वीचे नाव, (b) प्रथम राज्याभिषेक तिथी, (c) रायगड बांधकाम प्रमुख, (d) राज्याभिषेक पुरोहित — (i) रायरी, (ii) 6 जून 1674, (iii) हिरोजी इंदलकर, (iv) गागाभट्ट.", "q_english": "Match: (a) earlier name of Raigad, (b) date of first coronation, (c) construction chief of Raigad, (d) coronation priest — (i) Rairi, (ii) 6 June 1674, (iii) Hiroji Indalkar, (iv) Gagabhatta.", "options": ["a-i, b-ii, c-iii, d-iv", "a-i, b-ii, c-iv, d-iii", "a-iv, b-iii, c-i, d-ii", "a-ii, b-i, c-iii, d-iv"], "correct_index": 0, "explanation_marathi": "योग्य जोड्या: रायरी–पूर्वीचे नाव, 6 जून 1674–राज्याभिषेक, हिरोजी इंदलकर–बांधकाम प्रमुख, गागाभट्ट–पुरोहित. B मध्ये c/d अदलाबदल केली आहे, C/D मध्ये तिथी-नावाची चूक जोडणी आहे, म्हणून ते चूक.", "evidence": "Sabhasad Bakhar; Maharashtra State Gazetteer – Raigad District (1978)"}, {"section": 4, "subtopic": "वाकाटक अजिंठा आश्रय", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (अजिंठा – वाकाटक काळातील आश्रय): अ) गुंफा क्र. 16 (विहार) ब) गुंफा क्र. 17 (विहार) क) गुंफा क्र. 19 (चैत्यगृह) ड) गुंफा क्र. 1 (विहार); 1) वराहदेव – हरिषेणाचा मंत्री 2) उपेंद्रगुप्त – स्थानिक सामंत राजा 3) हरिषेणाच्या काळातील वाकाटक सरदार 4) हरिषेण – वाकाटक सम्राट", "q_english": "Match the pairs (Ajanta – Vakataka patronage): A) Cave 16 (Vihara) B) Cave 17 (Vihara) C) Cave 19 (Chaityagriha) D) Cave 1 (Vihara); 1) Varahadeva – minister of Harishena 2) Upendragupta – local feudatory king 3) Vakataka noble of Harishena's period 4) Harishena – Vakataka emperor", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-2, क-4, ड-3", "अ-4, ब-3, क-2, ड-1"], "correct_index": 0, "explanation_marathi": "गुंफा 16 चा दाता वराहदेव आणि गुंफा 17 चा दाता उपेंद्रगुप्त हे अभिलेखांनी निश्चित आहे; गुंफा 1 हरिषेणाशी जोडली जाते. पर्याय 2 मध्ये अ-ब ची अदलाबदल चुकीची आहे, पर्याय 3-4 मध्ये चैत्य-विहार आश्रयदात्यांचा गोंधळ आहे.", "evidence": "ASI – Ajanta Cave Inscriptions (Spink chronology); Epigraphia Indica Vol.XXV; Maharashtra State Gazetteer 2021"}, {"section": 4, "subtopic": "शनिवारवाडा बांधकाम", "qtype": "कालक्रम लावा", "q_marathi": "योग्य कालक्रम लावा: A) शनिवारवाड्याची पायाभरणी (10 जानेवारी 1730, शनिवार) B) थोरले बाजीरावाचे रावेरखेडी येथे निधन (1740) C) नारायणराव पेशव्याची शनिवारवाड्यात हत्या (1773) D) शनिवारवाड्याला लागलेली महाआग (1828)", "q_english": "Arrange in chronological order: A) Foundation of Shaniwarwada (10 Jan 1730, Saturday) B) Death of Thorle Bajirao at Raverkhedi (1740) C) Murder of Narayanrao Peshwa inside Shaniwarwada (1773) D) Great fire of Shaniwarwada (1828)", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "पायाभरणी 1730 → बाजीराव निधन 1740 → नारायणराव हत्या 1773 → महाआग 1828 हाच योग्य क्रम आहे. पर्याय 2-3 मध्ये 1740 पूर्वी/नंतरचा गोंधळ आहे, पर्याय 4 मध्ये 1773 व 1828 ची अदलाबदल चुकीची आहे.", "evidence": "पुणे गॅझेटियर; पेशवे दप्तर – Selections from Peshwa Daftar Vol.13; ASI Pune Circle Report 1925"}, {"section": 4, "subtopic": "शिवराज्याभिषेक 1674", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 6 जून 1674 (ज्येष्ठ शुद्ध त्रयोदशी) रोजी रायगडावर गागाभट्टांच्या पौरोहित्याखाली शिवाजी महाराजांचा वैदिक पद्धतीने राज्याभिषेक झाला. कारण (R): राज्याभिषेकामुळे शिवाजी महाराजांना सार्वभौम क्षत्रिय राजा म्हणून शास्त्रसंमत मान्यता मिळाली, ज्यामुळे मुघल-आदिलशाही सार्वभौमत्व नाकारून स्वतंत्र हिंदवी स्वराज्याची कायदेशीर स्थापना झाली.", "q_english": "Assertion (A): On 6 June 1674 (Jyeshtha Shuddha Trayodashi), Shivaji Maharaj's coronation was performed at Raigad by Gagabhatta as per Vedic rites. Reason (R): The coronation gave Shivaji scriptural legitimacy as a sovereign Kshatriya king, legally establishing an independent Hindavi Swarajya free from Mughal-Adilshahi suzerainty.", "options": ["A आणि R दोन्ही सत्य असून, R हे A चे योग्य स्पष्टीकरण आहे / Both A and R true and R is the correct explanation of A", "A आणि R दोन्ही सत्य, परंतु R हे A चे योग्य स्पष्टीकरण नाही / Both true but R is NOT the correct explanation of A", "A सत्य, R असत्य / A true, R false", "A असत्य, R सत्य / A false, R true"], "correct_index": 0, "explanation_marathi": "A व R दोन्ही सत्य असून R हेच A चे स्पष्टीकरण आहे, कारण शूद्र-क्षत्रिय वादातून शास्त्राधार व सार्वभौमत्वासाठीच वैदिक राज्याभिषेक आवश्यक होता. पर्याय २ चूक कारण R केवळ महत्त्व नसून हेतू स्पष्ट करतो; पर्याय ३-४ चूक कारण तारीख, गागाभट्ट व सार्वभौम मान्यता दोन्ही ऐतिहासिक सत्य आहेत (सप्टेंबर 1674 चा तांत्रिक विधी वेगळा).", "evidence": "Sabhasad Bakhar; Shivabharat; Gagabhatta Bhatta coronation record, 6 June 1674, Raigad"}, {"section": 4, "subtopic": "सविनय कायदेभंग 1930", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "सविनय कायदेभंग चळवळ (1930) बाबत विधाने पहा: (I) 12 मार्च 1930 रोजी साबरमतीहून दांडी यात्रा सुरू झाली व 6 एप्रिल 1930 रोजी दांडी येथे मिठाचा कायदा मोडण्यात आला. (II) तामिळनाडूत सी. राजगोपालाचारी यांनी त्रिचिनापल्ली-वेदारण्यम मीठ सत्याग्रह यात्रा काढली, तर वायव्य सरहद्द प्रांतात खान अब्दुल गफार खान यांच्या खुदाई खिदमतगारांनी (लाल कुर्ती) सहभाग घेतला. (III) 5 मार्च 1931 च्या गांधी-आयर्विन करारान्वये ब्रिटिशांनी 'पूर्ण स्वराज्या'ची मागणी मान्य केली, म्हणून चळवळ मागे घेण्यात आली.", "q_english": "Consider statements on Civil Disobedience Movement (1930): (I) Dandi March started from Sabarmati on 12 March 1930 and salt law was broken at Dandi on 6 April 1930. (II) In Tamil Nadu C. Rajagopalachari led Tiruchirappalli-Vedaranyam salt march, while in NWFP Khan Abdul Ghaffar Khan's Khudai Khidmatgars (Red Shirts) participated. (III) Under the Gandhi-Irwin Pact of 5 March 1931 the British accepted the demand of 'Purna Swaraj', hence the movement was withdrawn.", "options": ["फक्त I आणि II सत्य / Only I and II true", "फक्त I आणि III सत्य / Only I and III true", "फक्त II आणि III सत्य / Only II and III true", "I, II आणि III सर्व सत्य / All I, II and III true"], "correct_index": 0, "explanation_marathi": "I व II सत्य आहेत; III असत्य कारण गांधी-आयर्विन करारात फक्त मीठ सवलत, कैद्यांची मुक्तता व दुसऱ्या गोलमेज परिषदेतील सहभाग मान्य झाला, 'पूर्ण स्वराज्य' (लाहोर 1929) मान्य झाले नाही. त्यामुळे III समाविष्ट असलेले पर्याय २, ३, ४ बाद होतात.", "evidence": "Gandhi-Irwin Pact, 5 March 1931; Collected Works of Mahatma Gandhi Vol. 42-44; Second Round Table Conference 1931"}, {"section": 4, "subtopic": "सातवाहन गौतमीपुत्र सातकर्णी", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "गौतमीपुत्र सातकर्णीबाबत खालील विधाने विचारात घ्या: I. नाशिक गुंफा क्र. 3 मधील प्रशस्ती त्याची माता गौतमी बलश्री हिने त्याच्या मृत्यूनंतर कोरली असून त्यात त्याला 'शक-यवन-पल्हव-निसूदन' म्हटले आहे. II. त्याने क्षत्रप नहपानाचा पराभव करून त्याची चांदीची नाणी स्वतःच्या राजचिन्हांनी पुनर्मुद्रित (counter-struck) केली. III. त्याने केलेल्या अग्निष्टोम व वाजपेय यज्ञांचा उल्लेख नाणेघाट अभिलेखात आढळतो.", "q_english": "Consider statements on Gautamiputra Satakarni: I. The Nashik Cave No.3 prasasti, engraved by his mother Gautami Balashri after his death, calls him 'Saka-Yavana-Pahlava-nisudana'. II. He defeated Kshatrapa Nahapana and counter-struck Nahapana's silver coins with his own royal emblems. III. The Nanaghat inscription records his performance of Agnishtoma and Vajapeya sacrifices.", "options": ["I, II आणि III सर्व बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "I व II बरोबर आहेत: नाशिक प्रशस्ती गौतमी बलश्रीची आहे आणि जोगलथेंबी साठ्यात नहपानाची पुनर्मुद्रित नाणी आढळली. III चूक आहे कारण नाणेघाट अभिलेख सातकर्णी I ची पत्नी नागनिका हिचा आहे, गौतमीपुत्राचा नाही. त्यामुळे III समाविष्ट असलेले पर्याय 1, 3, 4 बाद होतात.", "evidence": "Epigraphia Indica Vol.VIII – नाशिक प्रशस्ती (सुमारे इ.स. 110-130); जोगलथेंबी नाणेसाठा अहवाल; ASI Annual Report 1909-10"}, {"section": 4, "subtopic": "सिंधू लोथल बंदर", "qtype": "जोड्या लावा", "q_marathi": "स्तंभ 'अ' (लोथल अवशेष) व स्तंभ 'ब' (कार्य/महत्त्व) यांच्या योग्य जोड्या लावा: 'अ'-(a) आयताकार गोदी-बेसिन (b) कार्नेलियन मणी कारखाना (c) दुहेरी शवाधान (d) वखार (गोदाम) इमारत; 'ब'-(i) भरतीच्या पाण्यावर चालणारी जहाजबांधणी/माल चढ-उतार व्यवस्था (ii) मेसोपोटेमियाला निर्यातीसाठी स्थानिक लघुउद्योगाचा पुरावा (iii) सिंधू दफन प्रथेतील युग्म/कौटुंबिक दफनाचा पुरावा (iv) शिक्के, मापे व वजनांसह प्रशासकीय-व्यापारी नियंत्रण केंद्र", "q_english": "Match Column 'A' (Lothal remains) with Column 'B' (function/significance): 'A'-(a) Rectangular dock-basin (b) Carnelian bead factory (c) Double burial (d) Warehouse structure; 'B'-(i) Tidal-water based ship-berthing/cargo handling system (ii) Evidence of local craft industry for export to Mesopotamia (iii) Evidence of paired/familial burial practice (iv) Administrative-trade control centre with seals, measures and weights", "options": ["a-i, b-ii, c-iii, d-iv", "a-i, b-ii, c-iv, d-iii", "a-iv, b-ii, c-iii, d-i", "a-i, b-iii, c-ii, d-iv"], "correct_index": 0, "explanation_marathi": "बरोबर उत्तर a-i, b-ii, c-iii, d-iv आहे कारण गोदी भरतीने भरणारी बंदर-रचना, मणी कारखाना निर्यात उद्योग, दुहेरी दफन दफनप्रथेचा तर वखार शिक्के-मापांसह प्रशासकीय केंद्र दर्शवतो. पर्याय २ चूक कारण शिक्के दफनात नव्हे वखारीत मिळाले; पर्याय ३ चूक कारण गोदीला मोहेंजोदडोच्या धान्यकोठाराशी गल्लत करते; पर्याय ४ चूक कारण मणी कारखान्याचा दफनाशी संबंध नाही.", "evidence": "S.R. Rao, Lothal excavations, ASI Ancient India Bulletin, 1954-63; dock identified 1957, Bhogava river, Gujarat"}, {"section": 5, "subtopic": "अजिंठा डोंगररांग", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): अजिंठा डोंगररांग तापी-पूर्णा खोरे व गोदावरी खोरे यांत जलविभाजक ठरते. विधान (R): अजिंठा रांग सह्याद्रीपासून पूर्वेकडे पसरलेली बेसाल्टची उंच रांग असून तिच्या उत्तरेकडील पाणी पूर्णा-तापीकडे व दक्षिणेकडील पाणी गोदावरीकडे वाहते.", "q_english": "Statement (A): Ajanta range acts as watershed between Tapi-Purna basin and Godavari basin. Reason (R): Ajanta range is an eastward basaltic extension of Sahyadri; its northern drainage goes to Purna-Tapi and southern to Godavari.", "options": ["A व R दोन्ही सत्य, R हे A चे अचूक कारण आहे", "A व R दोन्ही सत्य, R हे A चे अचूक कारण नाही", "A सत्य, R असत्य – अजिंठा रांग ग्रॅनाइटची व सातपुड्याचा भाग आहे", "A असत्य, R सत्य – अजिंठा रांग नर्मदा–तापी खोऱ्यांतील जलविभाजक आहे"], "correct_index": 0, "explanation_marathi": "अजिंठा रांग (छ. संभाजीनगर–जळगाव) बेसाल्टची असून खरोखरच दोन खोऱ्यांत पाणी विभागते, म्हणून R हे A चे कार्यकारण स्पष्ट करते. पर्याय 2 कारण नाकारतो, पर्याय 3 मध्ये खडक/पर्वत चूक (लेणी बेसाल्टमध्येच), पर्याय 4 मध्ये खोरे-जोडी चूक.", "evidence": "GSI – Deccan Volcanic Province Bulletin (2022); Maharashtra State Gazetteer: Chh. Sambhajinagar (2023)"}, {"section": 5, "subtopic": "उल्हास नदी ठाणे", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): उल्हास नदीचा उगम रायगड जिल्ह्यात कर्जतजवळ सह्याद्रीत होऊन ती ठाणे जिल्ह्यातून वाहत वसई खाडीद्वारे अरबी समुद्राला मिळते. कारण (R): बारवी, भातसा, काळू या उपनद्यांवरील धरणांमधून ठाणे-मुंबई महानगर प्रदेशाला पाणीपुरवठा होतो.", "q_english": "Assertion (A): Ulhas river originates near Karjat in Raigad district in Sahyadri, flows through Thane district and joins Arabian Sea via Vasai Creek. Reason (R): Dams on its tributaries Barvi, Bhatsa, Kalu supply water to Thane-Mumbai metropolitan region.", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य परंतु R असत्य आहे", "A असत्य परंतु R सत्य आहे"], "correct_index": 1, "explanation_marathi": "A (उगम-मुखमार्ग) व R (पाणीपुरवठा) दोन्ही सत्य आहेत, पण R हे A च्या पश्चिमवाहिनी प्रवाहाचे स्पष्टीकरण देत नाही. म्हणून पर्याय 1 बरोबर; पर्याय 1 मधील स्पष्टीकरणाचा दावा, पर्याय 3 व 4 मधील सत्य-असत्य विधाने चूक आहेत.", "evidence": "Maharashtra State Gazetteer – Thane District; India-WRIS Report 2022 – Ulhas basin, Vasai Creek mouth"}, {"section": 5, "subtopic": "कळसूबाई शिखर", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा: (I) कळसूबाई – 1646 मी – अहिल्यानगर (अकोले) – महाराष्ट्रातील सर्वोच्च शिखर (II) साल्हेर – 1567 मी – नाशिक – दुसऱ्या क्रमांकाचे शिखर (III) कळसूबाई रांग – सह्याद्रीची उपरांग (हरिश्चंद्रगड–कळसूबाई) – दख्खन ट्रॅप बेसाल्ट. योग्य पर्याय निवडा.", "q_english": "Consider the table: (I) Kalsubai – 1646 m – Ahilyanagar (Akole) – highest peak of Maharashtra (II) Salher – 1567 m – Nashik – second highest peak (III) Kalsubai range – sub-range of Sahyadri (Harishchandragad–Kalsubai) – Deccan Trap basalt. Choose the correct option.", "options": ["I, II व III सर्व बरोबर", "I व II बरोबर, III चूक – कळसूबाई रांग सातपुड्याची उपरांग आहे", "I व III बरोबर, II चूक – साल्हेर 1587 मी उंच असून सर्वोच्च शिखर आहे", "II व III बरोबर, I चूक – कळसूबाई 1642 मी उंच असून नाशिक जिल्ह्यात आहे"], "correct_index": 0, "explanation_marathi": "कळसूबाई 1646 मी (अकोले, अहिल्यानगर) महाराष्ट्रातील सर्वोच्च, साल्हेर 1567 मी (नाशिक) दुसरे, व कळसूबाई रांग सह्याद्रीचाच बेसाल्ट भाग आहे. पर्याय 2 मध्ये रांग चुकून सातपुडा म्हटली, पर्याय 3 मध्ये साल्हेरची उंची/क्रम चूक, पर्याय 4 मध्ये उंची-जिल्हा (त्र्यंबकेश्वरशी गल्लत) चूक.", "evidence": "Survey of India – Highest Peaks of Maharashtra list (2024); Maharashtra State Gazetteer: Ahilyanagar District (2023)"}, {"section": 5, "subtopic": "कृष्णा महाबळेश्वर उगम", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (1) कोयना नदी, (2) वेण्णा नदी, (3) धोम धरण, (4) अलमट्टी धरण; (a) कृष्णेवर सातारा येथील धरण, (b) सांगम माहुली (सातारा) येथे कृष्णेला मिळते, (c) कराड येथे कृष्णेला मिळते, (d) कर्नाटकातील कृष्णेवरील धरण.", "q_english": "Match: (1) Koyna river, (2) Venna river, (3) Dhom dam, (4) Almatti dam; (a) dam on Krishna at Satara, (b) joins Krishna at Sangam Mahuli (Satara), (c) joins Krishna at Karad, (d) dam on Krishna in Karnataka.", "options": ["1-b, 2-c, 3-a, 4-d", "1-c, 2-b, 3-d, 4-a", "1-c, 2-b, 3-a, 4-d", "1-c, 2-a, 3-b, 4-d"], "correct_index": 2, "explanation_marathi": "कोयना महाबळेश्वरातून उगम पावून कराडला (1-c) तर वेण्णा सांगम माहुलीला (2-b) कृष्णेला मिळते; धोम हे कृष्णेवर सातारा येथील धरण (3-a) व अलमट्टी कर्नाटकातील (विजयपूर) धरण (4-d) आहे. पर्याय 0 मध्ये कोयना-वेण्णा संगम अदलाबदल केला आहे, 1 मध्ये धरणे अदलाबदल केली आहेत, 3 मध्ये वेण्णा-धोम चुकवले आहे.", "evidence": "Central Water Commission Krishna Basin Report 2021; Maharashtra Irrigation Dept 2023"}, {"section": 5, "subtopic": "गोदावरी नाशिक-राजमुंद्री", "qtype": "कालक्रम लावा", "q_marathi": "गोदावरीच्या महाराष्ट्र ते आंध्र प्रदेश प्रवाहातील ठिकाणांचा उगमाकडून मुखाकडे योग्य कालक्रम लावा: 1) त्र्यंबकेश्वर (नाशिक), 2) जायकवाडी धरण (पैठण), 3) प्राणहिता संगम (काळेश्वरम), 4) राजमुंद्री (धवलेश्वर बॅरेज).", "q_english": "Arrange downstream Godavari locations from origin to mouth: 1) Trimbakeshwar (Nashik), 2) Jayakwadi dam (Paithan), 3) Pranahita confluence (Kaleshwaram), 4) Rajahmundry (Dhawaleshwaram barrage).", "options": ["1-3-2-4", "2-1-3-4", "1-2-4-3", "1-2-3-4"], "correct_index": 3, "explanation_marathi": "योग्य प्रवाहक्रम 1-2-3-4 आहे: त्र्यंबकेश्वर उगम → पैठण-जायकवाडी (मराठवाडा) → काळेश्वरम येथे प्राणहिता संगम (तेलंगणा) → राजमुंद्रीजवळ मुख. 0 मध्ये प्राणहिता जायकवाडीपूर्वी दाखवली आहे, 1 मध्ये उगम नंतर दाखवला आहे, 2 मध्ये राजमुंद्री संगमापूर्वी दाखवली आहे.", "evidence": "Godavari Basin Report, Central Water Commission 2022; Andhra Pradesh Irrigation Dept 2023"}, {"section": 5, "subtopic": "तापी उगम-खंभात", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "तापी नदीबाबत खालील विधाने विचारात घ्या: I) तिचा उगम मध्य प्रदेशातील बैतुल जिल्ह्यातील मुलताई येथे सातपुडा रांगेत होतो व ती पश्चिम वाहिनी म्हणून खंभातच्या आखाताला मिळते. II) महाराष्ट्रात तिला डावीकडून पूर्णा-गिरणा आणि उजवीकडून अनेर-गोमाई उपनद्या मिळतात. III) उकाई धरण तापीवर महाराष्ट्रात असून हाथणूर धरण गुजरातमध्ये आहे. योग्य पर्याय निवडा.", "q_english": "Consider statements on Tapi river: I) It originates at Multai in Betul district, MP in Satpura range and joins the Gulf of Khambhat as a west-flowing river. II) In Maharashtra its left-bank tributaries are Purna-Girna and right-bank are Aner-Gomai. III) Ukai dam is on Tapi in Maharashtra and Hathnur dam is in Gujarat. Choose correct option.", "options": ["फक्त I आणि II बरोबर", "फक्त I आणि III बरोबर", "I, II आणि III बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I बरोबर आहे (मुलताई उगम, खंभात आखात मुख) आणि II बरोबर आहे (डावी-उजवी उपनद्यांचा क्रम). III चूक आहे कारण उकाई धरण गुजरातच्या तापी जिल्ह्यात आहे तर हाथणूर धरण महाराष्ट्रातील जळगावमध्ये आहे - विधानात उलट दिले आहे. त्यामुळे III असलेले B, C, D पर्याय बाद होतात.", "evidence": "India-WRIS, Ministry of Jal Shakti Report 2022; Maharashtra Water Resources Department Handbook 2023"}, {"section": 5, "subtopic": "तारकर्ली सिंधुदुर्ग", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने पहा: I) तारकर्ली समुद्रकिनारा सिंधुदुर्ग जिल्ह्याच्या मालवण तालुक्यात कर्ली नदीच्या मुखाशी आहे. II) येथील स्कुबा डायव्हिंग क्षेत्र मालवण सागरी अभयारण्याचा (1997) भाग आहे. III) तारकर्लीचा विकास HRIDAY योजनेअंतर्गत वारसा शहर म्हणून करण्यात आला.", "q_english": "Consider statements: I) Tarkarli beach is in Malvan taluka of Sindhudurg district at the mouth of Karli river. II) Its scuba-diving zone is part of Malvan Marine Sanctuary (1997). III) Tarkarli was developed as a heritage city under HRIDAY scheme.", "options": ["I, II आणि III सर्व बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "I (कर्ली मुख, मालवण) व II (1997 अभयारण्य, स्कुबा) सत्य आहेत. III असत्य – तारकर्लीचा विकास स्वदेश दर्शन किनारी सर्किटअंतर्गत झाला, HRIDAY वारसा शहरांसाठी आहे. त्यामुळे I+II+III, II+III, I+III असलेले पर्याय चूक.", "evidence": "MTDC Report 2022; Ministry of Tourism – Swadesh Darshan Coastal Circuit 2021; Malvan Marine Sanctuary Notification 1997"}, {"section": 5, "subtopic": "तारापूर अणु पालघर", "qtype": "नकाशा आधारित", "q_marathi": "महाराष्ट्राच्या किनारी नकाशाच्या आधारे तारापूर अणुविद्युत केंद्राबाबत योग्य विधान ओळखा:", "q_english": "Based on the coastal map of Maharashtra, identify the correct statement about Tarapur Atomic Power Station:", "options": ["पालघर जिल्ह्यात बोईसरजवळ किनारी वसलेले; 1969 मध्ये कार्यान्वित भारताचे पहिले अणुकेंद्र (युनिट 1 व 2 – BWR, अमेरिकन सहकार्य)", "ठाणे जिल्ह्यात डहाणूजवळ वसलेले; 1969 मध्ये कार्यान्वित भारताचे पहिले अणुकेंद्र (युनिट 1 व 2 – PHWR, कॅनेडियन सहकार्य)", "पालघर जिल्ह्यात बोईसरजवळ वसलेले; 1972 मध्ये कार्यान्वित महाराष्ट्रातील पहिले अणुकेंद्र (PHWR, स्वदेशी तंत्रज्ञान)", "रायगड जिल्ह्यात अलिबागजवळ वसलेले; 1969 मध्ये कार्यान्वित पश्चिम भारतातील पहिले अणुकेंद्र (BWR, अमेरिकन सहकार्य)"], "correct_index": 0, "explanation_marathi": "तारापूर पालघरमध्ये (2014 पूर्वी ठाणे समज चुकीचा), बोईसरजवळ असून 1969 चे पहिले केंद्र BWR प्रकारचे आहे. पर्याय 2 मध्ये जिल्हा व रिअ‍ॅक्टर प्रकार (PHWR) चूक; पर्याय 3 मध्ये वर्ष (1972) व तंत्रज्ञान चूक; पर्याय 4 मध्ये जिल्हा पूर्ण चूक आहे.", "evidence": "NPCIL Annual Report 2023-24; Department of Atomic Energy – TAPS 1&2 commissioned 1969, BWR with US collaboration"}, {"section": 5, "subtopic": "धारावी पुनर्विकास", "qtype": "जोड्या लावा", "q_marathi": "स्तंभ-I (घटक) आणि स्तंभ-II (तपशील) यांच्या योग्य जोड्या लावा : अ) विशेष हेतू वाहन (SPV), ब) राज्य सरकारची भागीदार संस्था, क) अधिसूचित पुनर्विकास क्षेत्र, ड) सर्वेक्षण व पात्रता निश्चिती प्राधिकरण — 1) नवभारत मेगा डेव्हलपर्स प्रा. लि. (80% अदानी), 2) झोपडपट्टी पुनर्वसन प्राधिकरण (SRA) मार्फत 20% भागीदारी, 3) सुमारे 620 एकर, 4) धारावी पुनर्विकास प्रकल्प (DRP) प्राधिकरण", "q_english": "Match Column-I (component) with Column-II (detail) for Dharavi Redevelopment: a) SPV, b) State govt partner, c) Notified redevelopment area, d) Survey & eligibility authority — 1) Navbharat Mega Developers Pvt. Ltd. (80% Adani), 2) SRA with 20% stake, 3) ~620 acres, 4) Dharavi Redevelopment Project (DRP) Authority", "options": ["अ-1, ब-2, क-3, ड-4", "अ-1, ब-2, क-4, ड-3", "अ-1, ब-4, क-3, ड-2", "अ-2, ब-1, क-3, ड-4"], "correct_index": 0, "explanation_marathi": "बरोबर उत्तर अ-1, ब-2, क-3, ड-4 आहे. पर्याय 2 मध्ये क्षेत्र (620 एकर) व DRP प्राधिकरण अदलाबदल केले आहे; पर्याय 3 मध्ये SRA (भागीदार) व DRP (सर्वेक्षण प्राधिकरण) यांचा गोंधळ केला आहे; पर्याय 4 मध्ये SPV व SRA अदलाबदल केली आहे.", "evidence": "Maharashtra Govt GR – Dharavi Redevelopment Project 2023; DRP Notification 2023 – 620 acres, NMDPL SPV (80:20)"}, {"section": 5, "subtopic": "नर्मदा महाराष्ट्र सीमा", "qtype": "नकाशा आधारित", "q_marathi": "नकाशात नर्मदा नदीचा पश्चिमवाहिनी प्रवाह दाखवला आहे: (a) उगम, (b) महाराष्ट्र स्पर्श बिंदू, (c) सरदार सरोवर धरण, (d) मुख. प्रवाहक्रम व महाराष्ट्रातील लांबीचा योग्य पर्याय ओळखा.", "q_english": "Map shows west-flowing Narmada: (a) origin, (b) Maharashtra touch point, (c) Sardar Sarovar dam, (d) mouth. Identify correct downstream order and length in Maharashtra.", "options": ["मुलताई → धुळे → सरदार सरोवर → कच्छ आखात; महाराष्ट्रात ~208 किमी", "अमरकंटक → नंदुरबार → सरदार सरोवर → खंभात आखात; महाराष्ट्रात ~54 किमी", "अमरकंटक → जळगाव → उकाई धरण → खंभात आखात; महाराष्ट्रात ~112 किमी", "अमरकंटक → नाशिक → सरदार सरोवर → खंभात आखात; महाराष्ट्रात ~54 किमी"], "correct_index": 1, "explanation_marathi": "योग्य क्रम अमरकंटक (म.प्र.) → नंदुरबार (महाराष्ट्राला फक्त ~54 किमी स्पर्श) → सरदार सरोवर (गुजरात) → खंभात आखात आहे. पर्याय 0 मध्ये तापीचा मुलताई उगम व धुळे-208 किमी मिसळले आहे, पर्याय 2 मध्ये तापीचे जळगाव-उकाई मिसळले आहे, पर्याय 3 मध्ये नाशिक (गोदावरी उगम) चुकीने दिला आहे.", "evidence": "Narmada Control Authority Report 2023; Survey of India River Map 2022"}, {"section": 5, "subtopic": "बालाघाट पठार", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "बालाघाट पठाराबाबत: (I) बीड–लातूर–धाराशिव पट्ट्यातील दख्खन ट्रॅप बेसाल्ट पठार, उंची 600–900 मी (II) मांजरा व तेरणा नद्या बालाघाट रांगेतून उगम पावतात (III) हे सातपुड्याचा पूर्व-विस्तार असून जांभी मृदा आढळते.", "q_english": "On Balaghat plateau: (I) Deccan Trap basalt plateau in Beed–Latur–Dharashiv belt, 600–900 m (II) Manjra and Terna rivers originate in Balaghat range (III) It is an eastern extension of Satpura with laterite soil.", "options": ["I व II बरोबर, III चूक", "I व III बरोबर, II चूक", "II व III बरोबर, I चूक", "I, II व III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I व II बरोबर – बालाघाट मराठवाड्यातील बेसाल्ट पठार व मांजरा-तेरणा उगमस्थान. III चूक – ते सातपुडा नव्हे तर महाराष्ट्र पठाराचाच भाग; तेथे काळी/मध्यम काळी मृदा असते, जांभी (लॅटेराइट) ही कोकण-सह्याद्रीची गैरसमजुतीने जोडली जाते.", "evidence": "Water Resources Dept., Maharashtra – Godavari Basin Report (2023); Maharashtra State Board Geography Std-XI (2024)"}, {"section": 5, "subtopic": "भीमा उजनी-पंढरपूर", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): उजनी धरणानंतर भीमा नदी पंढरपूरजवळ चंद्रभागा म्हणून ओळखली जाते. कारण (R): भीमाशंकर (पुणे) येथे उगम पावणारी भीमा आग्नेय दिशेने वाहताना नीरा, मुळा-मुठा यांना घेऊन उजनीत अडवली जाते; पुढे मंद उतारामुळे पंढरपूरजवळ वळणदार प्रवाहामुळे तिला चंद्रकोरीसारखा आकार येतो.", "q_english": "Assertion (A): After Ujjani dam, Bhima river is known as Chandrabhaga near Pandharpur. Reason (R): Originating at Bhimashankar (Pune), Bhima flows southeast, is impounded at Ujjani after receiving Nira, Mula-Mutha; further low gradient creates meandering crescent shape near Pandharpur.", "options": ["A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, परंतु R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य (उजनी-सोलापूर, पंढरपूर भीमातीर/चंद्रभागा) आणि R सत्य (भीमाशंकर उगम, आग्नेय प्रवाह, उजनी साठवण). R मध्ये मंद उतार-मिएंडरमुळे चंद्रभागा नाव पडल्याचे स्पष्ट होते, म्हणून R हेच A चे योग्य स्पष्टीकरण आहे. त्यामुळे इतर तीन पर्याय बाद होतात.", "evidence": "Maharashtra Water Resources Dept, Ujjani Dam Project Report 2022; Gazetteer of Solapur 2021"}, {"section": 5, "subtopic": "वसई खाडी", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना 1 (रचना) + संकल्पना 2 (महत्त्व) एकत्र: वसई खाडीबाबत योग्य एकत्रित विधान ओळखा.", "q_english": "Concept 1 (formation) + Concept 2 (significance): Identify the correct combined statement on Vasai Creek.", "options": ["उल्हास नदीच्या मुखाशी तयार झालेली वसई खाडी साष्टी बेटाला वसई-विरार मुख्य भूमीपासून वेगळे करते; किनारी खारफुटी-मिठागरे असून पोर्तुगीज वसई किल्ला उत्तर किनारी आहे", "वैतरणा नदीच्या मुखाशी तयार झालेली वसई खाडी साष्टी बेटाला अलिबागपासून वेगळे करते; किनारी खारफुटी-मिठागरे असून वसई किल्ला दक्षिण किनारी आहे", "उल्हास मुखाशी तयार झालेल्या वसई खाडीला 2022 मध्ये रामसर दर्जा मिळाला; वसई किल्ला दक्षिण किनारी असून खारफुटी नाहीत", "वसई खाडी हा ठाणे खाडीचा उत्तर विस्तार असून घोडबंदरजवळ वैतरणेला मिळतो; तेथे खारफुटी व किल्ला नाहीत"], "correct_index": 0, "explanation_marathi": "वसई खाडी उल्हासच्या मुखाची, साष्टी-वसई विभाजक, खारफुटी-मिठागरे व उत्तर किनारी पोर्तुगीज किल्ला हेच बरोबर. पर्याय 2 मध्ये नदी (वैतरणा) व विभागणी (अलिबाग) चूक, पर्याय 3 मध्ये 2022 चा रामसर दर्जा ठाणे खाडीचा वसईला जोडला व किल्ल्याची बाजू चूक, पर्याय 4 मध्ये ठाणे-वसई गल्लत.", "evidence": "Maharashtra Coastal Zone Management Authority Report (2023); Ramsar Sites Information Service – Thane Creek No.2498 (2022); Mumbai Gazetteer (2023)"}, {"section": 5, "subtopic": "सातपुडा धूपगड", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (अ) धूपगड, (ब) चिखलदरा, (क) तोरणमाळ, (ड) पचमढी; (i) 1350 मी, पचमढी (मध्य प्रदेश), सातपुड्यातील सर्वोच्च शिखर, (ii) अमरावती, सातपुडा, थंड हवेचे ठिकाण, (iii) नंदुरबार, सातपुडा, थंड हवेचे ठिकाण, (iv) मध्य प्रदेश, 'सातपुड्याची राणी'.", "q_english": "Match: (A) Dhupgarh, (B) Chikhaldara, (C) Toranmal, (D) Pachmarhi; (i) 1350 m, Pachmarhi (MP), highest peak of Satpura, (ii) Amravati, Satpura, hill station, (iii) Nandurbar, Satpura, hill station, (iv) Madhya Pradesh, 'Queen of Satpura'.", "options": ["अ-i, ब-ii, क-iii, ड-iv", "अ-i, ब-iii, क-ii, ड-iv", "अ-iv, ब-ii, क-iii, ड-i", "अ-i, ब-ii, क-iv, ड-iii"], "correct_index": 0, "explanation_marathi": "धूपगड हेच 1350 मी शिखर पचमढीजवळ आहे (पचमढी हे गाव/पठार, शिखर नव्हे); चिखलदरा अमरावतीत, तोरणमाळ नंदुरबारात, 'राणी' पचमढीची उपाधी. पर्याय 2 मध्ये चिखलदरा-तोरणमाळ जिल्हे अदलाबदल, पर्याय 3 मध्ये धूपगड-पचमढी अदलाबदल, पर्याय 4 मध्ये तोरणमाळला 'राणी' म्हटले.", "evidence": "Geological Survey of India – Satpura Range Report (2022); Madhya Pradesh District Gazetteer: Narmadapuram/Pachmarhi (2023)"}, {"section": 5, "subtopic": "हापूस रत्नागिरी", "qtype": "कालक्रम लावा", "q_marathi": "हापूस आंब्याशी संबंधित घटनांचा योग्य कालक्रम लावा: अ) पोर्तुगीजांकडून गोव्यात कलम तंत्रज्ञानाचा परिचय, ब) व्हाइसरॉय अफोन्सो डी अल्बुकर्कच्या नावावरून 'अल्फोन्सो' नामकरण, क) रत्नागिरी-सिंधुदुर्ग पट्ट्यात व्यापारी लागवड विस्तार, ड) रत्नागिरी हापूसला GI टॅग प्राप्त", "q_english": "Arrange in chronological order events related to Hapus mango: a) Portuguese introduction of grafting in Goa, b) Naming 'Alphonso' after Viceroy Afonso de Albuquerque, c) Commercial expansion in Ratnagiri-Sindhudurg belt, d) GI tag to Ratnagiri Hapus", "options": ["अ-ब-क-ड", "ब-अ-क-ड", "अ-ब-ड-क", "ब-अ-ड-क"], "correct_index": 0, "explanation_marathi": "योग्य क्रम अ-ब-क-ड (16वे शतक परिचय → नामकरण → 20व्या शतकात व्यापारी विस्तार → 2018 GI). पर्याय 2 मध्ये परिचयाआधी नामकरण अशक्य; पर्याय 3-4 मध्ये GI (2018) विस्ताराआधी दाखवणे चूक आहे.", "evidence": "GI Registry Chennai – Ratnagiri Hapus GI Certificate 18 Sept 2018; Portuguese horticultural records 16th century"}, {"section": 6, "subtopic": "73वी दुरुस्ती 1992", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): अनुच्छेद 243N नुसार 73वी दुरुस्ती (24 एप्रिल 1993) लागू होताना अस्तित्वात असलेले पंचायतविषयक राज्य कायदे रद्द/सुधारित होईपर्यंत जास्तीत जास्त एक वर्षापर्यंत लागू राहिले. परिणाम (B): त्यामुळे राज्यांना 11व्या अनुसूचीतील 29 विषय पंचायतींकडे 24 एप्रिल 1994 पूर्वी सोपवणे बंधनकारक झाले, अन्यथा संबंधित पंचायती आपोआप बरखास्त झाल्या.", "q_english": "Cause (A): Under Article 243N, State panchayat laws existing at commencement of the 73rd Amendment (24 April 1993) continued for a maximum of one year until repealed/amended. Effect (B): Therefore States were compulsorily required to transfer the 29 Eleventh Schedule subjects to Panchayats before 24 April 1994, failing which the Panchayats stood automatically dissolved.", "options": ["A सत्य, B सत्य आणि B हा A चा योग्य परिणाम आहे", "A सत्य, B असत्य", "A असत्य, B सत्य", "A आणि B दोन्ही सत्य, पण B हा A चा योग्य परिणाम नाही"], "correct_index": 1, "explanation_marathi": "A सत्य आहे — 243N एक वर्षाची संक्रमण तरतूद देते. परंतु B असत्य आहे — 243G मध्ये 'may endow' अशी ऐच्छिक भाषा आहे, 29 विषय सोपवणे बंधनकारक नाही आणि मुदत चुकल्यास आपोआप बरखास्तीची तरतूद 243N मध्ये नाही.", "evidence": "भारतीय संविधान अनुच्छेद 243G, 243N; 73वी घटनादुरुस्ती अधिनियम, 1992"}, {"section": 6, "subtopic": "CAG 148-151", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): CAG ची नियुक्ती राष्ट्रपती करतात आणि सिद्ध गैरवर्तन/असमर्थतेवरून सर्वोच्च न्यायालयाच्या न्यायाधीशाप्रमाणेच संसदेच्या विशेष बहुमताच्या ठरावाने त्यांना दूर केले जाते.\nकारण (R): कलम 148(3) नुसार CAG चे वेतन सर्वोच्च न्यायालयाच्या न्यायाधीशाएवढे असते आणि कलम 151(1) नुसार केंद्राचे लेखा अहवाल राष्ट्रपती संसदेसमोर ठेवतात.\n\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): The CAG is appointed by the President and can be removed like a Supreme Court Judge by Parliament's special majority on proved misbehaviour/incapacity.\nReason (R): Under Art 148(3) CAG's salary equals that of a Supreme Court Judge and under Art 151(1) Union accounts reports are laid by the President before Parliament.\n\nChoose correct option:", "options": ["A व R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 1, "explanation_marathi": "A (148(1) नियुक्ती व पदच्युती संरक्षण) व R (148(3) वेतन, 151 अहवाल) दोन्ही तथ्यतः बरोबर आहेत, पण R मधील वेतन/अहवाल हे A मधील पदाच्या स्वातंत्र्याच्या/दूर करण्याच्या कार्यपद्धतीचे स्पष्टीकरण देत नाही.", "evidence": "Constitution of India, Arts. 148(1), 148(3), 151(1)"}, {"section": 6, "subtopic": "PESA 1996", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "PESA, 1996 बाबत खालील विधाने विचारात घ्या: I. PESA केवळ पाचव्या अनुसूचीतील अनुसूचित क्षेत्रांना लागू होतो आणि राज्याचा पंचायत कायदा त्याच्याशी सुसंगत असावा लागतो. II. PESA अंतर्गत पंचायतींतील एकूण जागांपैकी किमान एक-तृतीयांश जागा अनुसूचित जमातींसाठी राखीव ठेवणे बंधनकारक आहे. III. अनुसूचित क्षेत्रात गौण खनिजांच्या उत्खनन परवान्यापूर्वी ग्रामसभेची शिफारस घेणे बंधनकारक आहे.", "q_english": "Consider statements on PESA, 1996: I. PESA applies only to Scheduled Areas under the Fifth Schedule and State panchayat law must be made consonant with it. II. Under PESA at least one-third of total Panchayat seats must be reserved for STs. III. Prior recommendation of Gram Sabha is mandatory before grant of prospecting licence for minor minerals in Scheduled Areas.", "options": ["I आणि III बरोबर, II चूक", "I आणि II बरोबर, III चूक", "II आणि III बरोबर, I चूक", "I, II, III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I सत्य — PESA पाचव्या अनुसूचीपुरताच व सुसंगतता बंधनकारक. III सत्य — कलम 4(k) नुसार खनिज परवानग्यापूर्वी ग्रामसभेची शिफारस आवश्यक. II चूक — PESA मध्ये ST साठी किमान एक-द्वितीयांश (1/2) आरक्षण आहे; एक-तृतीयांश हे 73व्या दुरुस्तीतील महिला आरक्षणाशी गल्लत आहे.", "evidence": "PESA अधिनियम, 1996 कलम 4(c), 4(g), 4(k); पाचवी अनुसूची"}, {"section": 6, "subtopic": "उच्च न्यायालय 214-231", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा:\nअ) कलम 214 — प्रत्येक राज्यासाठी उच्च न्यायालय असेल\nब) कलम 217 — उच्च न्यायालयाच्या न्यायाधीशांची नियुक्ती, पात्रता व पदावधी\nक) कलम 226 — उच्च न्यायालयाचा पुनर्विलोकनाचा (Review) अधिकार\nड) कलम 231 — दोन किंवा अधिक राज्यांसाठी सामाईक उच्च न्यायालयाची स्थापना\n\nतक्त्यातील चुकीची जोडी ओळखा:", "q_english": "See the table:\nA) Art 214 — There shall be a High Court for each State\nB) Art 217 — Appointment, qualifications and tenure of High Court Judges\nC) Art 226 — High Court's power of Review\nD) Art 231 — Establishment of a common High Court for two or more States\n\nIdentify the wrong pair in the table:", "options": ["फक्त क चूक — कलम 226 हे मूलभूत हक्क व इतर कायदेशीर हक्कांसाठी रिट/आदेश काढण्याचा अधिकार देते", "फक्त ब चूक — कलम 217 हे केवळ हंगामी न्यायाधीशांच्या नियुक्तीबद्दल आहे", "फक्त ड चूक — कलम 231 हे दुय्यम न्यायालयांवरील नियंत्रणाबद्दल आहे", "अ, ब, क, ड सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "कलम 226 हा रिट अधिकार आहे, पुनर्विलोकन नाही. कलम 214, 217, 231 यांच्या जोड्या बरोबर आहेत. पर्याय 2 चूक कारण 217 ही मुख्य नियुक्ती तरतूद आहे (222 बदली, 224 हंगामी), पर्याय 3 चूक कारण 231 सामाईक उच्च न्यायालयाबद्दलच आहे.", "evidence": "Constitution of India, Arts. 214, 217, 226 (writ jurisdiction), 227 (superintendence), 231"}, {"section": 6, "subtopic": "उपराष्ट्रपती 63-71", "qtype": "कालक्रम लावा", "q_marathi": "उपराष्ट्रपती संदर्भातील खालील संविधानिक तरतुदी संविधानातील कलम-क्रमानुसार योग्य क्रमात लावा:\nA. कलम 64 — उपराष्ट्रपती राज्यसभेचे पदसिद्ध सभापती\nB. कलम 65 — राष्ट्रपती पद रिक्त असताना उपराष्ट्रपती कार्य करील\nC. कलम 66 — उपराष्ट्रपतीची निवडणूक (दोन्ही सभागृहांचे सदस्य, प्रमाणशीर प्रतिनिधित्व, गुप्त मतदान)\nD. कलम 68 — उपराष्ट्रपती पदाची रिक्तता भरण्यासाठी निवडणूक घेण्याची मुदत\nयोग्य क्रम निवडा:", "q_english": "Arrange the following Vice-President provisions in constitutional article order:\nA. Art 64 — VP as ex-officio Chairman of Rajya Sabha\nB. Art 65 — VP to act as President during vacancy\nC. Art 66 — Election of VP (members of both Houses, PR, secret ballot)\nD. Art 68 — Time for election to fill VP vacancy\nChoose correct sequence:", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "संविधानिक क्रम 64 → 65 → 66 → 68 हाच आहे. B-C अदलाबदल केल्यास निवडणूक आधी व कार्य नंतर असा चुकीचा क्रम होतो; D-C अदलाबदलही चुकीची. त्यामुळे A-B-C-D हेच बरोबर.", "evidence": "Constitution Part V order: Art 63 (VP office), Art 64 (ex-officio Chairman), Art 65 (act as President), Art 66 (election by both Houses, PR by single transferable vote, secret ballot), Art 68 (election to fill vacancy)."}, {"section": 6, "subtopic": "कलम 32 vs 226 उपचार", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "कलम 32 आणि कलम 226 मधील उपचारात्मक अधिकारक्षेत्राबाबत खालील विधाने विचारात घ्या:\nI. कलम 32 हा स्वतः एक मूलभूत हक्क आहे (भाग-3), तर कलम 226 हा मूलभूत हक्क नाही.\nII. सर्वोच्च न्यायालय कलम 32 खाली केवळ मूलभूत हक्कांच्या अंमलबजावणीसाठी रिट जारी करू शकते; उच्च न्यायालय कलम 226 खाली मूलभूत हक्कांसह 'इतर कोणत्याही प्रयोजनासाठी' देखील रिट जारी करू शकते.\nIII. कलम 32 खालील उपचार हक्क म्हणून बंधनकारक आहे — सर्वोच्च न्यायालय विवेकाधिकाराने नाकारू शकत नाही; तर कलम 226 खालील अधिकारक्षेत्र विवेकाधीन आहे.\nयोग्य पर्याय निवडा:", "q_english": "Consider statements on remedial jurisdiction under Articles 32 vs 226:\nI. Article 32 is itself a Fundamental Right (Part-III), while Article 226 is not.\nII. SC under Art 32 can issue writs only for enforcement of Fundamental Rights; HCs under Art 226 can issue writs for FRs and 'for any other purpose' too.\nIII. Remedy under Art 32 is mandatory as a right — SC cannot refuse on discretion; jurisdiction under Art 226 is discretionary.\nChoose correct option:", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर", "I, II आणि III सर्व बरोबर"], "correct_index": 3, "explanation_marathi": "कलम 32 हा भाग-3 मधील मूलभूत हक्क आहे ('संविधानाचे हृदय व आत्मा'), 226 नाही. 32 ची व्याप्ती केवळ मूलभूत हक्कांपुरती मर्यादित, तर 226 मधील 'any other purpose' मुळे कायदेशीर हक्कांसाठीही विस्तृत. 32 बंधनकारक, 226 विवेकाधीन — त्यामुळे तिन्ही बरोबर; इतर पर्याय अपूर्ण आहेत.", "evidence": "Art 32 is itself a FR; SC issues writs only for FR enforcement, HCs under Art 226 for FRs 'and for any other purpose' — wider scope; remedy under 32 mandatory, under 226 discretionary."}, {"section": 6, "subtopic": "कलम 368 दुरुस्ती प्रक्रिया", "qtype": "जोड्या लावा", "q_marathi": "कलम 368 संदर्भातील प्रक्रिया व उदाहरणांच्या योग्य जोड्या लावा:\n1. विशेष बहुमत [368(2) मुख्य भाग]  2. विशेष बहुमत + राज्यांची मान्यता (परंतुक)  3. साधे बहुमत (368 बाहेर)  4. 24वी दुरुस्ती, 1971\na. दोन्ही सभागृहांत एकूण सदस्यसंख्येचे बहुमत + उपस्थित व मतदान करणाऱ्यांचे 2/3 बहुमत\nb. वरील बहुमत + किमान निम्म्या राज्य विधिमंडळांचे ठराव — उदा. कलम 54, 55, 7वी अनुसूची\nc. 50%+1 उपस्थित सदस्य — उदा. कलम 3 (नवीन राज्य), पहिली/चौथी अनुसूची\nd. 368 चे शीर्षक 'प्रक्रिया' वरून 'दुरुस्तीचा अधिकार व प्रक्रिया' केले; मूलभूत हक्कांत दुरुस्ती शक्य हे स्पष्ट", "q_english": "Match the amendment procedures under Art 368:\n1. Special majority [368(2) main]  2. Special majority + state ratification (proviso)  3. Simple majority (outside 368)  4. 24th Amendment, 1971\na. Majority of total membership + 2/3 of present and voting in both Houses\nb. Above + resolution of not less than half state legislatures — e.g. Arts 54, 55, Seventh Schedule\nc. 50%+1 of members present — e.g. Art 3 (new states), First/Fourth Schedule\nd. Title of 368 changed from 'procedure' to 'power and procedure'; Parliament can amend FRs clarified", "options": ["1-a, 2-b, 3-c, 4-d", "1-a, 2-b, 3-d, 4-c", "1-b, 2-a, 3-c, 4-d", "1-a, 2-c, 3-b, 4-d"], "correct_index": 0, "explanation_marathi": "1-a हे 368(2) चे मूळ सूत्र, 2-b हे संघराज्यीय तरतुदींसाठी निम्म्या राज्यांची मान्यता, 3-c हे 368 बाहेरील साधे बहुमत, 4-d ही 24वी दुरुस्ती — हेच बरोबर. इतर पर्यायांत फक्त एक जोडी अदलाबदल करून जवळचे पर्याय बनवले आहेत.", "evidence": "Art 368(2): passed by majority of total membership and 2/3 of present and voting; proviso requires ratification by not less than one-half of States for Arts 54,55,73,162,241, Seventh Schedule etc.; simple majority changes (Art 3) outside 368; 24th Amendment 1971 retitled Art 368."}, {"section": 6, "subtopic": "नगरपालिका 243P-243ZG", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्रितपणे विचारात घ्या — संकल्पना X: 'तीन लाख किंवा त्याहून अधिक लोकसंख्या असलेल्या प्रत्येक नगरपालिकेत प्रभाग समित्या', संकल्पना Y: 'नगरपालिकांमधील जागा व अध्यक्षपदांचे अनुसूचित जाती-जमाती व महिलांसाठी आरक्षण'. दोन्ही संकल्पनांची अनुच्छेदासह योग्य जोडी कोणती?", "q_english": "Consider two concepts together — Concept X: 'Wards Committees in every Municipality with population of three lakhs or more', Concept Y: 'Reservation of seats and offices of Chairpersons in Municipalities for SC/ST and women'. Which option correctly pairs both with their Articles?", "options": ["X-243S, Y-243T", "X-243S, Y-243U", "X-243R, Y-243T", "X-243Q, Y-243T"], "correct_index": 0, "explanation_marathi": "243S प्रभाग समित्यांची (3 लाखांवरील नगरपालिकेत बंधनकारक) तरतूद करते, तर 243T जागा व अध्यक्षपदांच्या आरक्षणाची तरतूद करते. 243Q घटना, 243R रचना व 243U कालावधीशी संबंधित असल्याने इतर पर्याय चूक.", "evidence": "भारतीय संविधान अनुच्छेद 243Q, 243R, 243S, 243T, 243U"}, {"section": 6, "subtopic": "पंचायत 243A-243O", "qtype": "कालक्रम लावा", "q_marathi": "भारतीय संविधानातील पंचायतींसंबंधी तरतुदींचा अनुच्छेद-क्रमानुसार (243A ते 243O) योग्य कालक्रम लावा: (a) जागांचे आरक्षण, (b) पंचायतींच्या हिशेबांची लेखापरीक्षा, (c) पंचायतींचे अधिकार, प्राधिकार आणि जबाबदाऱ्या, (d) न्यायालयांच्या हस्तक्षेपास प्रतिबंध", "q_english": "Arrange the following Panchayat provisions in constitutional article order (243A to 243O): (a) Reservation of seats, (b) Audit of accounts of Panchayats, (c) Powers, authority and responsibilities of Panchayats, (d) Bar to interference by courts", "options": ["(a) - (c) - (b) - (d)", "(a) - (b) - (c) - (d)", "(c) - (a) - (b) - (d)", "(a) - (c) - (d) - (b)"], "correct_index": 0, "explanation_marathi": "योग्य क्रम 243D (आरक्षण) → 243G (अधिकार/जबाबदाऱ्या) → 243J (लेखापरीक्षा) → 243O (न्यायालयीन हस्तक्षेपास प्रतिबंध) आहे. 243G हा 243J च्या आधी येतो, त्यामुळे (b)-(c) अदलाबदल असलेले पर्याय चूक; 243O सर्वात शेवटी येतो.", "evidence": "भारतीय संविधान अनुच्छेद 243D, 243G, 243J, 243O"}, {"section": 6, "subtopic": "पंतप्रधान 74-75", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "कलम 74(1) परंतुक (44वी दुरुस्ती) व कलम 75(3) एकत्र विचारात घ्या. मंत्रिमंडळाने दिलेला सल्ला राष्ट्रपतींनी एकदा पुनर्विचारासाठी परत पाठवला आणि मंत्रिमंडळाने फेरविचारानंतर तोच सल्ला कायम ठेवला, तर घटनात्मक स्थिती काय?", "q_english": "Read Art 74(1) proviso (44th Amendment) with Art 75(3) together. President returns ministerial advice once for reconsideration and the Council re-tenders the same advice after reconsideration — what is the constitutional position?", "options": ["राष्ट्रपती दुसऱ्यांदा पुनर्विचारासाठी पाठवू शकतात; मंत्रिमंडळ लोकसभेला जबाबदार असल्याने राष्ट्रपती स्वविवेकाने निर्णय घेऊ शकतात", "राष्ट्रपतींना पुनर्विचारानंतरच्या सल्ल्यानुसारच वागावे लागते; तरीही मंत्रिमंडळ लोकसभेला सामूहिकपणे जबाबदार राहते — विश्वास गमावल्यास राजीनामा द्यावा लागतो", "राष्ट्रपती पुनर्विचारानंतरचा सल्ला नाकारू शकतात कारण कलम 74(2) न्यायालयीन चौकशीला मनाई करते", "राष्ट्रपतींना पहिल्यांदाच सल्ला मानणे बंधनकारक असते; पुनर्विचाराचा अधिकार केवळ आणीबाणीच्या काळात असतो"], "correct_index": 1, "explanation_marathi": "44वी दुरुस्तीनुसार राष्ट्रपती फक्त एकदाच पुनर्विचार मागू शकतात; फेरसल्ल्यानुसार वागणे बंधनकारक. कलम 74(2) ही केवळ सल्ल्याच्या चौकशीबंदीची तरतूद, नकाराचा अधिकार नाही. कलम 75(3) नुसार सामूहिक जबाबदारी लोकसभेला कायम राहते.", "evidence": "Art 74(1) proviso: President may require reconsideration once and shall act per advice after reconsideration (44th Amendment); Art 74(2) bars court inquiry into advice tendered; Art 75(3): Council collectively responsible to Lok Sabha."}, {"section": 6, "subtopic": "महाराष्ट्र ग्रामपंचायत 1959", "qtype": "नकाशा आधारित", "q_marathi": "महाराष्ट्राच्या नकाशावर चार ग्रामपंचायतींची लोकसंख्या दर्शवली आहे: P – 1400, Q – 3200, R – 5800, S – 8000. महाराष्ट्र ग्रामपंचायत अधिनियम, 1959 (मुंबई ग्रामपंचायत अधिनियम, 1958) च्या कलम 10 नुसार निवडावयाच्या सदस्य संख्येबाबत योग्य पर्याय ओळखा.", "q_english": "On a Maharashtra map four Gram Panchayats are shown with populations: P – 1400, Q – 3200, R – 5800, S – 8000. Under Section 10 of the Maharashtra Village Panchayats Act, 1959 (Bombay Village Panchayats Act, 1958), identify the correct number of members to be elected.", "options": ["P-7, Q-11, R-13, S-17", "P-7, Q-9, R-13, S-17", "P-7, Q-11, R-15, S-17", "P-9, Q-11, R-13, S-15"], "correct_index": 0, "explanation_marathi": "कलम 10 नुसार 1500 पर्यंत-7, 3001-4500 पर्यंत-11, 4501-6000 पर्यंत-13, 7500 वरील-17 सदस्य असतात. त्यामुळे P(1400)=7, Q(3200)=11, R(5800)=13, S(8000)=17 हाच क्रम बरोबर; Q ला 9 वा R ला 15 देणारे पर्याय slab चुकवतात.", "evidence": "महाराष्ट्र ग्रामपंचायत अधिनियम, 1959 (मुंबई ग्रामपंचायत अधिनियम, 1958) कलम 10"}, {"section": 6, "subtopic": "राज्यसभा 80 विशेष", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): कलम 80(2) नुसार राज्यसभेचे 238 निवडून आलेले सदस्य राज्य विधानसभांच्या निवडून आलेल्या सदस्यांकडून एकल संक्रमणीय मताने प्रमाणशीर प्रतिनिधित्व पद्धतीने निवडले जातात.\nपरिणाम (E): कलम 80(4) व चौथ्या अनुसूचीमुळे उत्तर प्रदेशला (31) सिक्कीमपेक्षा (1) जास्त राज्यसभा जागा मिळतात.\n\nC व E यांतील संबंध ओळखा:", "q_english": "Cause (C): Under Art 80(2), the 238 elected members of Rajya Sabha are elected by the elected members of State Legislative Assemblies by proportional representation by single transferable vote.\nEffect (E): Under Art 80(4) and the Fourth Schedule, UP (31) gets more Rajya Sabha seats than Sikkim (1).\n\nIdentify the C-E relationship:", "options": ["C व E दोन्ही बरोबर, E हे C चा तार्किक परिणाम आहे", "C व E दोन्ही बरोबर, पण E हा C चा परिणाम नाही", "C बरोबर, E चूक", "C चूक, E बरोबर"], "correct_index": 0, "explanation_marathi": "C मध्ये निवड पद्धती बरोबर आहे आणि E मध्ये जागावाटप बरोबर आहे. प्रमाणशीर प्रतिनिधित्व + चौथ्या अनुसूचीतील लोकसंख्याधारित वाटपामुळेच मोठ्या राज्याला जास्त जागा मिळतात, म्हणून E हा C चा परिणाम आहे. E स्वतंत्र नाही.", "evidence": "Constitution of India, Art. 80(1)(2)(4), Fourth Schedule - allocation of Rajya Sabha seats"}, {"section": 6, "subtopic": "राष्ट्रपती 52-62 निवडणूक", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): राष्ट्रपतींची निवडणूक प्रमाणशीर प्रतिनिधित्व पद्धतीने एकल संक्रमणीय मताद्वारे गुप्त मतदानाने होते [कलम 55(3)].\nकारण (R): राष्ट्रपतींच्या निर्वाचक गणात लोकसभेचे व राज्यसभेचे निर्वाचित व नामनिर्देशित सदस्य तसेच राज्य विधानसभांचे निर्वाचित सदस्य समाविष्ट असतात.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): The President is elected by proportional representation by single transferable vote through secret ballot [Art 55(3)].\nReason (R): The electoral college for President comprises elected and nominated members of Lok Sabha and Rajya Sabha plus elected members of State Legislative Assemblies.\nChoose correct option:", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे, R असत्य आहे", "A असत्य आहे, R सत्य आहे"], "correct_index": 2, "explanation_marathi": "A सत्य — कलम 55(3) नुसार एकल संक्रमणीय मत व गुप्त मतदान. R असत्य — कलम 54 नुसार फक्त निर्वाचित सदस्य (संसद + राज्य विधानसभा + दिल्ली/पुदुच्चेरी), नामनिर्देशित सदस्य वगळले जातात. नामनिर्देशित सदस्य उपराष्ट्रपतीच्या (कलम 66) गणात चालतात, राष्ट्रपतीच्या नाहीत.", "evidence": "Art 55(3): election by proportional representation by single transferable vote, secret ballot; Art 54: electoral college = elected members of both Houses of Parliament + elected members of State Assemblies (nominated members excluded)."}, {"section": 6, "subtopic": "लोकसभा 81-88 रचना", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nअ) कलम 81 — i) लोकसभेची रचना (राज्यांतून 530 + केंद्रशासित प्रदेशांतून 20 पेक्षा जास्त नाही)\nब) कलम 82 — ii) प्रत्येक जनगणनेनंतर मतदारसंघांचे पुनःसमायोजन\nक) कलम 83 — iii) लोकसभेचा कार्यकाळ (सामान्यतः 5 वर्षे)\nड) कलम 85 — iv) अधिवेशन, सत्रावसान व विसर्जन\n\nयोग्य पर्याय निवडा:", "q_english": "Match the pairs:\nA) Art 81 — i) Composition of Lok Sabha (not more than 530 from States + 20 from UTs)\nB) Art 82 — ii) Readjustment of constituencies after each Census\nC) Art 83 — iii) Duration of Lok Sabha (normally 5 years)\nD) Art 85 — iv) Sessions, prorogation and dissolution\n\nChoose the correct option:", "options": ["अ-i, ब-ii, क-iii, ड-iv", "अ-i, ब-ii, क-iv, ड-iii", "अ-ii, ब-i, क-iii, ड-iv", "अ-i, ब-iii, क-ii, ड-iv"], "correct_index": 0, "explanation_marathi": "कलम 81=रचना, 82=पुनर्रचना, 83=कालावधी, 85=अधिवेशन/विसर्जन हे बरोबर आहे. पर्याय 2 मध्ये 83 व 85 ची अदलाबदल केली आहे, पर्याय 3 मध्ये 81 व 82 ची अदलाबदल आहे, पर्याय 4 मध्ये 82 व 83 ची अदलाबदल आहे, म्हणून ते चूक.", "evidence": "Constitution of India, Arts. 81, 82, 83, 85"}, {"section": 6, "subtopic": "विधानसभा 170-177", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने विचारात घ्या:\nI. कलम 170 नुसार प्रत्येक राज्याच्या विधानसभेत 60 पेक्षा कमी व 500 पेक्षा जास्त सदस्य असू शकत नाहीत — याला कोणताही अपवाद नाही.\nII. कलम 172(1) नुसार विधानसभेचा सामान्य कार्यकाळ 5 वर्षे आहे; आणीबाणीच्या काळात संसद एका वेळी 1 वर्षाने वाढवू शकते, पण घोषणा संपल्यानंतर 6 महिन्यांपेक्षा जास्त मुदतवाढ टिकत नाही.\nIII. कलम 177 नुसार प्रत्येक मंत्री व राज्याच्या महाधिवक्त्याला विधानमंडळाच्या सभागृहांत भाषणाचा व कामकाजात भाग घेण्याचा अधिकार आहे, पण सदस्य नसल्यास मतदानाचा अधिकार नाही.\n\nयोग्य पर्याय निवडा:", "q_english": "Consider statements:\nI. Under Art 170, every State Legislative Assembly shall have not less than 60 and not more than 500 members — with no exception.\nII. Under Art 172(1), normal term is 5 years; during Emergency Parliament may extend by 1 year at a time, but not beyond 6 months after proclamation ends.\nIII. Under Art 177, every Minister and Advocate-General has right to speak and take part in proceedings, but no right to vote unless a member.\n\nChoose correct option:", "options": ["फक्त I बरोबर", "फक्त II व III बरोबर", "I, II, III सर्व बरोबर", "फक्त I व II बरोबर"], "correct_index": 1, "explanation_marathi": "I चूक आहे कारण 60 ची किमान मर्यादा असली तरी सिक्कीम (32), गोवा (40), मिझोरम (40) यांना संसदेने कायद्याने अपवाद दिला आहे. II व III पूर्णतः बरोबर आहेत, म्हणून फक्त II व III हाच पर्याय बरोबर.", "evidence": "Constitution of India, Arts. 170(1) proviso, 172(1) proviso, 177; Exceptions via Art. 371F and Parliamentary Acts for Sikkim/Goa/Mizoram"}, {"section": 7, "subtopic": "CAG ऑडिट", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने तपासा: (I) CAG ची नेमणूक राष्ट्रपती करतात; कार्यकाळ 6 वर्षे किंवा वय 65 वर्षे (जे आधी घडेल). (II) CAG ला पदच्युत करण्यासाठी सर्वोच्च न्यायालयाच्या न्यायाधीशांप्रमाणे संसदेच्या दोन्ही सभागृहांच्या विशेष बहुमताच्या ठरावाची आवश्यकता असते. (III) CAG भारताचा एकत्रित निधी, आकस्मिकता निधी व लोकलेखा यांचे लेखापरीक्षण करतो आणि अहवाल थेट संसदेला सादर करतो.", "q_english": "Examine statements: (I) CAG is appointed by President; tenure 6 years or age 65 (whichever earlier). (II) Removal of CAG requires special majority resolution of both Houses like an SC judge. (III) CAG audits Consolidated Fund, Contingency Fund and Public Account of India and submits report directly to Parliament.", "options": ["केवळ I आणि II सत्य", "केवळ I आणि III सत्य", "I, II आणि III सर्व सत्य", "केवळ II आणि III सत्य"], "correct_index": 0, "explanation_marathi": "I (अनु. 148 कार्यकाळ) व II (अनु. 148(1) पदच्युती प्रक्रिया) सत्य आहेत. III अंशतः असत्य — CAG अहवाल राष्ट्रपतींना (अनु. 151) सादर करतो, राष्ट्रपती तो संसदेपुढे ठेवतात; थेट संसदेला नाही. त्यामुळे III असलेले पर्याय चुकतात.", "evidence": "Constitution Arts 148 (appointment, 6 years/65 years, removal like SC judge), 149-151 (duties; report to President who lays before Parliament)"}, {"section": 7, "subtopic": "CRR vs SLR", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nA. CRR — 1. NDTL च्या % RBI कडे रोख स्वरूपात, व्याज मिळत नाही\nB. SLR — 2. NDTL च्या % बँकेकडेच रोख/सोने/मंजूर रोख्यांत, परतावा शक्य\nC. CRR कसूर — 3. RBI कायदा, 1934 अंतर्गत बँक दरापेक्षा अधिक दंडात्मक व्याज\nD. SLR कसूर — 4. बँकिंग विनियमन कायदा, 1949 कलम 24 अंतर्गत दंडात्मक कारवाई\nयोग्य जोडी निवडा:", "q_english": "Match the pairs:\nA. CRR — 1. % of NDTL as cash with RBI, no interest\nB. SLR — 2. % of NDTL with bank itself as cash/gold/approved securities, return possible\nC. CRR default — 3. Penal interest above Bank Rate under RBI Act, 1934\nD. SLR default — 4. Penal action under Section 24, Banking Regulation Act, 1949\nChoose the correct match:", "options": ["A-2, B-1, C-3, D-4", "A-1, B-2, C-4, D-3", "A-1, B-2, C-3, D-4", "A-1, B-3, C-2, D-4"], "correct_index": 2, "explanation_marathi": "CRR ही RBI कडील बिनव्याजी रोख ठेव, SLR ही बँकेकडील व्याजपात्र ठेव हे मूलभूत फरक आहेत. CRR कसुरीवर RBI कायद्याने तर SLR कसुरीवर BR कायद्याने दंड होतो. A-B किंवा C-D अदलाबदल केलेले पर्याय म्हणून चूक.", "evidence": "RBI Master Directions on CRR/SLR; RBI Act 1934 Sec 42(3); Banking Regulation Act 1949 Sec 24"}, {"section": 7, "subtopic": "FRBM 2003", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "FRBM चौकटीतील दोन संकल्पना एकत्र तपासा — (X) कर्ज-GDP लक्ष्य (एन. के. सिंग समिती, 2017) आणि (Y) एस्केप क्लॉज अंतर्गत अनुमत विचलन. योग्य संयोजन निवडा.", "q_english": "Examine two FRBM concepts together — (X) Debt-GDP target (N.K. Singh Committee, 2017) and (Y) permissible deviation under escape clause. Choose the correct combination.", "options": ["X: केंद्र 40% + राज्य 20% = एकूण 60% (2024-25 पर्यंत); Y: 0.5% विचलनास परवानगी", "X: केंद्र 40% + राज्य 20% = एकूण 60% (2024-25 पर्यंत); Y: 0.25% विचलनास परवानगी", "X: केंद्र 35% + राज्य 25% = एकूण 60% (2024-25 पर्यंत); Y: 0.5% विचलनास परवानगी", "X: केंद्र 40% + राज्य 20% = एकूण 60% (2020-21 पर्यंत); Y: 0.5% विचलनास परवानगी"], "correct_index": 0, "explanation_marathi": "सिंग समितीने एकूण 60% (केंद्र 40% + राज्य 20%) 2024-25 पर्यंत व एस्केप क्लॉजमध्ये (युद्ध, राष्ट्रीय सुरक्षा इ.) 0.5% GDP विचलन शिफारस केली, जी FRBM सुधारणा 2018 मध्ये स्वीकारली. इतर पर्यायांत टक्केवारी, वाटप वा कालमर्यादा सूक्ष्मपणे चुकवली आहे.", "evidence": "FRBM Review Committee (N.K. Singh) 2017; FRBM (Amendment) 2018 – debt 60% (Centre 40%, States 20%), escape clause 0.5% of GDP"}, {"section": 7, "subtopic": "GST परिषद 279A", "qtype": "कालक्रम लावा", "q_marathi": "कालक्रम लावा: (A) 101 व्या घटनादुरुस्तीस राष्ट्रपतींची संमती (8 सप्ट
