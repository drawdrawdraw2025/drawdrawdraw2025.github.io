ेंबर 2016), (B) अनुच्छेद 279A अंतर्गत GST परिषदेची स्थापना (15 सप्टेंबर 2016), (C) GST परिषदेची पहिली बैठक (22-23 सप्टेंबर 2016), (D) देशभरात GST लागू (1 जुलै 2017)", "q_english": "Arrange chronologically: (A) Presidential assent to 101st Amendment (8 Sep 2016), (B) Constitution of GST Council under Art 279A (15 Sep 2016), (C) First GST Council meeting (22-23 Sep 2016), (D) GST launch nationwide (1 July 2017)", "options": ["A-B-C-D", "B-A-C-D", "A-C-B-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "101 वी दुरुस्ती (A) ने 279A समाविष्ट केला, त्यानंतरच परिषदेची अधिसूचना (B) व पहिली बैठक (C) शक्य झाली, आणि शेवटी GST लागू (D) झाला. B-A क्रम घटनात्मकदृष्ट्या अशक्य, तर C-B व D-C अदलाबदली ऐतिहासिक क्रम चुकवतात.", "evidence": "101st Constitutional Amendment Act 2016; Art 279A; CBIC – GST Council notified 15.09.2016, 1st meeting 22-23 Sep 2016; GST launched 1 July 2017"}, {"section": 7, "subtopic": "LAF vs MSF", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): MSF दर हा नेहमी रेपो दरापेक्षा जास्त असतो.\nकारण (R): MSF ही रात्रभराची (overnight) दंडात्मक सुविधा असून त्यात बँका त्यांच्या SLR कोट्यातील पात्र रोखे गहाण ठेवून RBI कडून कर्ज घेऊ शकतात.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): The MSF rate is always higher than the repo rate.\nReason (R): MSF is an overnight penal facility under which banks can borrow from the RBI by dipping into their SLR quota of eligible securities.\nChoose the correct option:", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे, R असत्य आहे", "A असत्य आहे, R सत्य आहे"], "correct_index": 0, "explanation_marathi": "MSF हा LAF वरील penal corridor (रेपो + 25 bps) आहे, म्हणून A सत्य. SLR मधून रोखे वापरून overnight कर्ज हे R सत्य. दंडात्मक स्वरूपामुळेच दर जास्त ठेवला जातो, म्हणून R हेच A चे स्पष्टीकरण; केवळ दोन्ही सत्य म्हणणारा पर्याय अपुरा.", "evidence": "RBI - Marginal Standing Facility guidelines: MSF rate = Policy Repo Rate + 25 bps; LAF vs MSF corridor"}, {"section": 7, "subtopic": "NEFT vs RTGS vs IMPS", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): IMPS द्वारे सुट्टीच्या दिवशीही 24x7x365 काही सेकंदांत लाभार्थीच्या खात्यात पैसे जमा होतात.\nपरिणाम (E): प्रणालीगतदृष्ट्या महत्त्वाच्या मोठ्या मूल्याच्या व्यवहारांसाठी RTGS मध्ये किमान ₹2 लाख मर्यादा ठेवली आहे, कमाल मर्यादा नाही.\nयोग्य पर्याय निवडा:", "q_english": "Cause (C): Through IMPS funds are credited to the beneficiary within seconds on a 24x7x365 basis including holidays.\nEffect (E): For systemically important high-value transactions, RTGS stipulates a minimum threshold of Rs 2 lakh with no maximum ceiling.\nChoose the correct option:", "options": ["C आणि E दोन्ही सत्य, आणि C हे E चे योग्य कारण आहे", "C सत्य, E असत्य", "C असत्य, E सत्य", "C आणि E दोन्ही सत्य, परंतु C हे E चे योग्य कारण नाही"], "correct_index": 3, "explanation_marathi": "C सत्य: IMPS ही NPCI ची तात्काळ किरकोळ प्रणाली आहे. E सत्य: RTGS हे large-value gross settlement आहे, ₹2 लाख किमान. पण E ची मर्यादा C मुळे नाही, तर net settlement (NEFT/IMPS) पासून gross settlement वेगळे ठेवण्यासाठी आहे, म्हणून कारण-परिणाम संबंध नाही.", "evidence": "RBI Payment Systems FAQs - NEFT/RTGS/IMPS; NPCI IMPS 24x7 instant; RBI RTGS minimum Rs 2 lakh"}, {"section": 7, "subtopic": "NSE vs BSE", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): BSE (स्थापना 1875) हा आशियातील सर्वात जुना शेअर बाजार असून SENSEX हा 30 ब्लू-चिप कंपन्यांचा निर्देशांक आहे. विधान (R): NSE (स्थापना 1992, व्यवहार 1994) ने स्क्रीन-आधारित व्यापार सुरू केल्यामुळेच भारतात T+1 सेटलमेंट प्रणाली लागू झाली. कारण-परिणाम संदर्भात योग्य पर्याय निवडा.", "q_english": "Statement (A): BSE (est. 1875) is Asia's oldest stock exchange and SENSEX is an index of 30 blue-chip companies. Statement (R): Only because NSE (est. 1992, operations 1994) introduced screen-based trading, the T+1 settlement system was implemented in India. Choose the correct cause-effect option.", "options": ["A कारण आहे, R त्याचा परिणाम आहे; दोन्ही सत्य व कारण-परिणाम अचूक आहे.", "A आणि R दोन्ही सत्य आहेत, पण R हा A चा परिणाम नाही; T+1 हे SEBI ने जाने. 2023 पासून सर्व एक्स्चेंजेसवर टप्प्याटप्प्याने लागू केले.", "A सत्य आहे, R असत्य आहे; NSE ने स्क्रीन-आधारित व्यापार सुरू केला नाही.", "A असत्य आहे, R सत्य आहे; SENSEX मध्ये 50 कंपन्या असतात."], "correct_index": 1, "explanation_marathi": "A सत्य (BSE 1875, SENSEX-30) व R मधील तथ्य (NSE 1994 स्क्रीन ट्रेडिंग) सत्य असले तरी 'मुळेच' हा कार्यकारण दावा चुकीचा आहे. T+1 हे SEBI च्या 2021 परिपत्रकानुसार 2023 मध्ये सर्व एक्स्चेंजेसवर लागू झाले, केवळ NSE मुळे नाही. त्यामुळे पर्याय 0, 2, 3 रद्द होतात.", "evidence": "BSE India – History (est. 1875), SENSEX methodology (30 stocks); NSE India – History (incorporated 1992, trading 1994); SEBI circular on T+1 settlement, 08 Sep 2021 (phased implementation completed Jan 2023)"}, {"section": 7, "subtopic": "OMO vs MSS", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्ता विचारात घ्या:\n| साधन | (a) रोखे व्यवहार | (b) खर्च/व्याजभार | (c) मुख्य उद्देश |\n| OMO | RBI स्वतःच्या ताळेबंदातून खरेदी/विक्री | RBI सहन करते | तरलता समायोजन (इंजेक्शन/शोषण दोन्ही) |\n| MSS | केंद्र सरकारकडून जारी (RBI मार्फत लिलाव), पैसा RBI कडील MSS खात्यात | केंद्र सरकार (अर्थसंकल्पातून) | भांडवली आवकीतून निर्माण झालेल्या दीर्घकालीन अतिरिक्त तरलतेचे निर्जंतुकीकरण |\nतक्त्याबाबत योग्य निष्कर्ष निवडा:", "q_english": "Consider the table:\n| Instrument | (a) Securities transaction | (b) Cost borne by | (c) Main objective |\n| OMO | RBI buys/sells on its own balance sheet | Borne by RBI | Liquidity adjustment (both injection/absorption) |\n| MSS | Issued by Central Govt (auction via RBI), proceeds in MSS account with RBI | Central Govt (Budget) | Sterilisation of durable surplus liquidity from capital inflows |\nChoose the correct conclusion based on the table:", "options": ["फक्त (a) आणि (c) बरोबर - MSS चा खर्च RBI सहन करते", "(a), (b), (c) तिन्ही बरोबर - OMO RBI च्या ताळेबंदातून, MSS सरकारच्या खर्चाने निर्जंतुकीकरणासाठी", "फक्त (b) आणि (c) बरोबर - OMO अंतर्गत सरकार रोखे जारी करते", "फक्त (a) आणि (b) बरोबर - MSS चा उद्देश दैनंदिन तरलता समायोजन आहे"], "correct_index": 1, "explanation_marathi": "(a)(b)(c) तिन्ही सत्य: OMO हा RBI चा स्वतःचा व्यवहार, MSS रोखे सरकार जारी करते व व्याज सरकार देते. MSS उद्देश दैनंदिन LAF नव्हे तर भांडवल आवक जनित तरलतेचे sterilization आहे. खर्च किंवा जारीकर्ता अदलाबदल करणारे पर्याय चूक.", "evidence": "RBI: Market Stabilisation Scheme (2004) MoU with GoI; RBI Annual Report - Open Market Operations"}, {"section": 7, "subtopic": "अर्थसंकल्प 112-117", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) अनुच्छेद 112, (b) अनुच्छेद 114, (c) अनुच्छेद 115, (d) अनुच्छेद 116 : (i) विनियोजन विधेयक, (ii) लेखानुदान, प्रत्ययानुदान व अपवादात्मक अनुदाने, (iii) वार्षिक वित्तीय विवरणपत्र, (iv) पूरक, अतिरिक्त किंवा जादाची अनुदाने", "q_english": "Match the pairs: (a) Article 112, (b) Article 114, (c) Article 115, (d) Article 116 : (i) Appropriation Bill, (ii) Votes on account, votes of credit and exceptional grants, (iii) Annual Financial Statement, (iv) Supplementary, additional or excess grants", "options": ["a-iii, b-i, c-iv, d-ii", "a-iii, b-i, c-ii, d-iv", "a-i, b-iii, c-iv, d-ii", "a-iii, b-iv, c-i, d-ii"], "correct_index": 0, "explanation_marathi": "अनु. 112 = वार्षिक वित्तीय विवरणपत्र (अर्थसंकल्प), 114 = विनियोजन विधेयक, 115 = पूरक/जादाची अनुदाने, 116 = लेखानुदान/प्रत्ययानुदान. पर्याय 2 मध्ये c-d ची अदलाबदल चुकीची, पर्याय 3 मध्ये a-b ची अदलाबदल चुकीची, पर्याय 4 मध्ये b-c ची अदलाबदल चुकीची आहे.", "evidence": "Constitution of India: Art 112 Annual Financial Statement, Art 114 Appropriation Bills, Art 115 Supplementary grants, Art 116 Votes on account/credit"}, {"section": 7, "subtopic": "पेन्शन PFRDA", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा: | योजना | नियामक | प्रवेश वय | पेन्शन स्वरूप | | (i) NPS | PFRDA | 18-70 | बाजार-आधारित, हमी नाही | | (ii) APY | PFRDA | 18-40 | रु.1000-5000 हमी (सरकारी हमी) | | (iii) PM-SYM | कामगार मंत्रालय | 18-40 | रु.3000 हमी | 35 वर्षीय असंघटित कामगाराला बाजार-जोखीम नको असून PFRDA-नियमित हमी पेन्शन हवी आहे. तक्त्यानुसार योग्य निवड कोणती?", "q_english": "See table: | Scheme | Regulator | Entry age | Pension nature | | (i) NPS | PFRDA | 18-70 | Market-linked, no guarantee | | (ii) APY | PFRDA | 18-40 | Rs.1000-5000 guaranteed | | (iii) PM-SYM | Ministry of Labour | 18-40 | Rs.3000 guaranteed | A 35-year-old unorganised worker wants guaranteed pension without market risk under PFRDA regulation. Which is correct per table?", "options": ["(ii) APY — वय 35 पात्र, PFRDA-नियमित, रु.1000-5000 हमी", "(iii) PM-SYM — वय 35 पात्र, रु.3000 हमी, PFRDA-नियमित", "(i) NPS — वय 35 पात्र, PFRDA-नियमित, हमी पेन्शन", "(ii) व (iii) दोन्ही — दोन्ही PFRDA-नियमित हमी योजना"], "correct_index": 0, "explanation_marathi": "35 वर्षे हे तिन्हीसाठी पात्र असले तरी अटी दोन आहेत: (1) PFRDA नियमन, (2) हमी. PM-SYM ला हमी असली तरी नियामक कामगार मंत्रालय आहे; NPS PFRDA असली तरी हमी नाही. त्यामुळे फक्त APY दोन्ही अटी पूर्ण करते, इतर पर्याय एका अटीवर चुकतात.", "evidence": "PFRDA Act, 2013 – NPS (18-70) and APY (18-40) regulated by PFRDA; Ministry of Labour & Employment – PM-SYM guidelines (Labour Ministry administered, not PFRDA)"}, {"section": 7, "subtopic": "बॉंड G-Sec", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): G-Sec चा यील्ड वाढल्यास त्याची बाजार-किंमत घटते. कारण (R): RBI ने खुल्या बाजार व्यवहारात (OMO) G-Sec विकल्यास प्रणालीतील तरलता कमी होऊन यील्ड वाढतो. योग्य पर्याय निवडा.", "q_english": "Assertion (A): When G-Sec yield rises, its market price falls. Reason (R): When RBI sells G-Secs in Open Market Operations (OMO), system liquidity falls and yield rises. Choose correct option.", "options": ["A आणि R दोन्ही सत्य, आणि R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य, R असत्य आहे.", "A असत्य, R सत्य आहे."], "correct_index": 1, "explanation_marathi": "A सत्य आहे कारण बॉंड किंमत-यील्ड व्यस्त संबंध असतो; R सत्य आहे कारण OMO विक्रीने तरलता शोषली जाऊन यील्ड वाढतो. पण R हे A च्या व्यस्त संबंधाचे स्पष्टीकरण नसून मौद्रिक धोरणाचा परिणाम आहे. त्यामुळे 'योग्य स्पष्टीकरण' असलेला पर्याय 0 चूक, तसेच 2 व 3 तथ्यदृष्ट्या चूक.", "evidence": "RBI – Government Securities market primer (inverse price-yield relationship); RBI – Open Market Operations guidelines"}, {"section": 7, "subtopic": "म्युच्युअल फंड NAV", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "म्युच्युअल फंड NAV बाबत खालील विधाने विचारात घ्या: (I) इक्विटी योजनेचा NAV = (एकूण मालमत्ता - देयता) ÷ थकबाकी युनिट्स असून तो प्रत्येक व्यावसायिक दिवशी बाजार बंदनंतर जाहीर होतो. (II) 1 फेब्रु. 2021 पासून SEBI नियमानुसार खरेदीवर लागू होणारा NAV अर्जाच्या वेळेवर नव्हे, तर फंड हाऊसला निधी उपलब्ध होण्याच्या वेळेवर ठरतो. (III) सर्व योजनांसाठी कट-ऑफ वेळ दुपारी 3:00 असून त्यानंतरच्या खरेदी अर्जाला निधी उपलब्धतेचा विचार न करता पुढील दिवसाचा NAV मिळतो. योग्य पर्याय निवडा.", "q_english": "Consider statements on Mutual Fund NAV: (I) Equity scheme NAV = (Total Assets - Liabilities) ÷ Outstanding Units, declared daily after market close. (II) From 1 Feb 2021, per SEBI, purchase NAV depends on time of fund realization with fund house, not application time. (III) For all schemes cut-off is 3:00 PM and purchase after cut-off gets next day's NAV irrespective of fund availability. Choose correct option.", "options": ["I आणि II फक्त बरोबर", "I, II आणि III बरोबर", "II आणि III फक्त बरोबर", "I आणि III फक्त बरोबर"], "correct_index": 0, "explanation_marathi": "I व II SEBI मास्टर सर्क्युलर व AMFI नुसार सत्य आहेत. III असत्य आहे कारण 1 फेब्रु. 2021 नंतर खरेदी NAV कट-ऑफसह निधी उपलब्धतेवर (3 PM पूर्वी realization) अवलंबून असतो; 'उपलब्धतेचा विचार न करता' हे विधान चुकीचे आहे. त्यामुळे III असलेले पर्याय रद्द होतात.", "evidence": "SEBI Master Circular for Mutual Funds; SEBI circular SEBI/HO/IMD/DF2/CIR/P/2020/175 dated 17 Sep 2020 (NAV applicability from 1 Feb 2021); AMFI – NAV calculation methodology"}, {"section": 7, "subtopic": "रेपो vs रिव्हर्स रेपो", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या:\nI. रेपो सुविधेत बँका पात्र रोखे RBI कडे विकून (पुनर्खरेदी करारासह) अल्पकालीन तरलता मिळवतात, त्यामुळे प्रणालीतील राखीव पैशात वाढ होते.\nII. रिव्हर्स रेपो सुविधेत RBI बँकांकडील अतिरिक्त तरलता शोषून घेते आणि त्यावर बँकांना व्याज देते.\nIII. LAF कॉरिडॉरमध्ये रिव्हर्स रेपो दर रेपो दरापेक्षा जास्त ठेवला जातो, जेणेकरून बँकांना RBI कडे निधी ठेवण्यास प्रोत्साहन मिळेल.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements:\nI. Under repo, banks obtain short-term liquidity by selling eligible securities to the RBI (with repurchase agreement), thereby increasing reserve money.\nII. Under reverse repo, the RBI absorbs surplus liquidity from banks and pays interest to banks on it.\nIII. In the LAF corridor, the reverse repo rate is kept higher than the repo rate to incentivise banks to park funds with the RBI.\nChoose the correct option:", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर", "I, II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I बरोबर: रेपो = RBI कडून बँकांना कर्ज, तरलता इंजेक्शन. II बरोबर: रिव्हर्स रेपो = तरलता शोषण. III चूक: LAF कॉरिडॉरमध्ये रेपो दर > रिव्हर्स रेपो दर असतो; उलट झाल्यास कॉरिडॉर व्यस्त होईल. म्हणून III असलेले पर्याय चूक.", "evidence": "RBI Glossary - Repo/Reverse Repo; RBI LAF framework: Repo rate is policy rate, Reverse repo rate < Repo rate"}, {"section": 7, "subtopic": "वित्त आयोग 280", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): अनुच्छेद 280 अंतर्गत राष्ट्रपतींमार्फत स्थापन होणारा वित्त आयोग केंद्र-राज्यांमधील कर महसूल वाटप व सहाय्यक अनुदानांच्या तत्त्वांवर शिफारस करणारी घटनात्मक संस्था आहे. कारण (R): 15 व्या वित्त आयोगाने (अध्यक्ष एन. के. सिंग) 2021-26 साठी उभ्या विचलनात (vertical devolution) 41% शिफारस केली, जी जम्मू-काश्मीर पुनर्रचनेमुळे 14 व्या आयोगाच्या 42% पेक्षा 1% ने कमी आहे.", "q_english": "Assertion (A): The Finance Commission set up by the President under Article 280 is a constitutional body recommending tax devolution and grants-in-aid principles between Centre and States. Reason (R): The 15th Finance Commission (Chair N.K. Singh) recommended 41% vertical devolution for 2021-26, 1% lower than the 14th Commission's 42% due to J&K reorganisation.", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे पण R असत्य आहे", "A असत्य आहे पण R सत्य आहे"], "correct_index": 1, "explanation_marathi": "A आणि R दोन्ही तथ्यतः सत्य आहेत, पण R हे केवळ 15 व्या आयोगाचे एक विशिष्ट उदाहरण देते; ते A मधील घटनात्मक दर्जा व कार्यक्षेत्राचे कारण स्पष्ट करत नाही. म्हणून पर्याय 1 योग्य; पर्याय 1, 3, 4 स्पष्टीकरणाच्या नात्याबाबत चुकतात.", "evidence": "Constitution Art 280; 15th Finance Commission Report (N.K. Singh) – 41% vertical devolution 2021-26 vs 42% of 14th FC; PIB, Ministry of Finance"}, {"section": 7, "subtopic": "विमा IRDAI", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा — गट-अ: (A) विमा क्षेत्रातील FDI मर्यादा (2021 दुरुस्तीनंतर), (B) विमा कंपन्यांसाठी किमान सॉल्व्हन्सी रेशो, (C) IRDAI स्थापनेचा कायदा, (D) LIC स्थापनेचा कायदा; गट-ब: (1) 74%, (2) 1.5, (3) IRDA कायदा, 1999, (4) LIC कायदा, 1956.", "q_english": "Match the following — Group-A: (A) FDI limit in insurance (after 2021 amendment), (B) Minimum solvency ratio for insurers, (C) Act establishing IRDAI, (D) Act establishing LIC; Group-B: (1) 74%, (2) 1.5, (3) IRDA Act, 1999, (4) LIC Act, 1956.", "options": ["A-1, B-2, C-3, D-4", "A-1, B-2, C-4, D-3", "A-2, B-1, C-3, D-4", "A-1, B-2, C-3, D-3"], "correct_index": 0, "explanation_marathi": "2021 मध्ये Insurance Act 1938 दुरुस्तीने FDI 49% वरून 74% झाली; IRDAI (Solvency Margin) नियमांनुसार किमान सॉल्व्हन्सी 1.5 अनिवार्य आहे; IRDAI ची स्थापना IRDA Act 1999 व LIC ची LIC Act 1956 अन्वये झाली. अदलाबदल किंवा चुकीच्या कायद्याचा उल्लेख असलेले इतर पर्याय त्यामुळे चूक ठरतात.", "evidence": "IRDAI – Insurance (Amendment) Act, 2021 (FDI 74%); IRDAI (Assets, Liabilities and Solvency Margin of Insurers) Regulations, 2016 (solvency 1.5); IRDA Act, 1999; LIC Act, 1956"}, {"section": 8, "subtopic": "अणु विखंडन vs संलयन", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या: (I) विखंडनात जड केंद्रकाचे (U-235) विभाजन होऊन प्रति विखंडन सुमारे 200 MeV ऊर्जा मुक्त होते, तर D-T संलयनात प्रति अभिक्रिया सुमारे 17.6 MeV ऊर्जा मुक्त होते, परंतु प्रति न्यूक्लिऑन ऊर्जा संलयनात अधिक असते. (II) विखंडन साखळी अभिक्रिया मंदक (Heavy Water) व नियंत्रण दंड (Cd/B) यांनी नियंत्रित करतात, तर नियंत्रित संलयनासाठी ~10^7 K तापमान आवश्यक असल्याने टोकामॅकमध्ये चुंबकीय परिसीमन वापरतात. (III) विखंडनाची उत्पादने दीर्घायुषी किरणोत्सारी तुकडे असतात, तर D-T संलयनाचे मुख्य उत्पादन He-4 + न्यूट्रॉन असून दीर्घायुषी अणुकचरा नगण्य असतो. कोणती विधाने बरोबर आहेत?", "q_english": "Consider statements: (I) Fission of heavy nucleus (U-235) releases ~200 MeV per fission, while D-T fusion releases ~17.6 MeV per reaction, but energy per nucleon is higher in fusion. (II) Fission chain reaction is controlled by moderator and control rods (Cd/B), while controlled fusion needs ~10^7 K so magnetic confinement in tokamak is used. (III) Fission yields long-lived radioactive fragments, while D-T fusion yields He-4 + neutron with negligible long-lived waste. Which are correct?", "options": ["केवळ I आणि II बरोबर", "केवळ II आणि III बरोबर", "I, II आणि III सर्व बरोबर", "केवळ I आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "तिन्ही विधाने तथ्यात्मकदृष्ट्या बरोबर आहेत: ऊर्जा प्रति न्यूक्लिऑन संलयनात अधिक, नियंत्रणाची साधने वेगळी, व कचऱ्याचे स्वरूप वेगळे. पर्याय 1, 2, 4 एक विधान वगळतात म्हणून चूक; केवळ सर्व समावेशक पर्याय बरोबर.", "evidence": "NCERT Class 12 Physics Ch-13 Nuclei: fission ~200 MeV/fragment; D-T fusion 17.6 MeV; tokamak magnetic confinement; fission fragments radioactive."}, {"section": 8, "subtopic": "आदर्श वायू नियम", "qtype": "तक्ता आधारित", "q_marathi": "n=2 mol साठी तक्ता: (X) P=4 atm, V=10 L, T=200 K; (Y) P=2 atm, V=20 L, T=243.6 K; (Z) P=5 atm, V=8 L, T=243.6 K. PV=nRT (R=0.0821 L·atm/mol·K) नुसार कोणता नमुना आदर्श वर्तनापासून विचलित होतो?", "q_english": "For n=2 mol: (X) P=4 atm, V=10 L, T=200 K; (Y) P=2 atm, V=20 L, T=243.6 K; (Z) P=5 atm, V=8 L, T=243.6 K. Using PV=nRT (R=0.0821 L·atm/mol·K), which sample deviates from ideal behaviour?", "options": ["केवळ X विचलित", "केवळ Y विचलित", "केवळ Z विचलित", "Y आणि Z दोन्ही विचलित"], "correct_index": 0, "explanation_marathi": "R=PV/nT काढल्यास: X=40/400=0.10 ≠0.0821 (विचलन), Y=40/487.2=0.0821, Z=40/487.2=0.0821 (आदर्श). त्यामुळे केवळ X विचलित; Y/Z ला दोष देणारे पर्याय गणनेत चूक.", "evidence": "NCERT Class 11 Chemistry Ch-5 States of Matter: PV=nRT, R=0.0821 L atm mol-1 K-1; deviation at high P/low T."}, {"section": 8, "subtopic": "आम्ल pH 0-14", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): pH=0 असलेल्या द्रावणातील [H+] ही pH=2 असलेल्या द्रावणाच्या 100 पट असते. कारण (R): pH = -log10[H+] असल्याने pH मध्ये 1 एकक घट म्हणजे [H+] 10 पट वाढ, आणि 25°C ला pH मापक्रम Kw=1×10^-14 वर 0-14 असतो.", "q_english": "Assertion (A): A solution with pH=0 has 100 times the [H+] of a solution with pH=2. Reason (R): pH = -log10[H+] so 1 unit decrease means 10-fold increase in [H+], and at 25°C the 0-14 scale is based on Kw=1×10^-14.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "ΔpH=2 म्हणजे [H+] गुणोत्तर 10^2=100, त्यामुळे A बरोबर; R मध्ये log व्याख्या व Kw आधार बरोबर व तोच गणितीय आधार A स्पष्ट करतो. इतर पर्याय स्पष्टीकरण संबंध नाकारतात म्हणून चूक.", "evidence": "NCERT Class 11 Chemistry Ch-7 Equilibrium: pH=-log[H+], Kw=1.0×10^-14 at 298K, pH scale 0-14."}, {"section": 8, "subtopic": "ऊती अभिस्तर", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र करा - (i) स्तररचनेनुसार वर्गीकरण, (ii) यांत्रिक ताणाची अनुकूलता. श्वासनलिकेतील आभासी स्तरित स्तंभीय पक्ष्मल अभिस्तर व मूत्राशयातील संक्रमणकालीन अभिस्तर याबाबत योग्य विधान ओळखा.", "q_english": "Combine two concepts - (i) classification by layering, (ii) adaptation to mechanical stress. Identify the correct statement about pseudostratified ciliated columnar epithelium of trachea and transitional epithelium of urinary bladder.", "options": ["दोन्ही स्तरित अभिस्तर आहेत; पक्ष्मे श्लेष्मा ढकलतात, संक्रमणकालीन पेशी ताणल्यावर चपट्या होतात; दोन्हींना तळपटल नसते", "आभासी स्तरित अभिस्तर एकस्तरीय असून सर्व पेशी तळपटलाला जोडलेल्या असतात; संक्रमणकालीन अभिस्तर खरे स्तरित असून ताणानुसार पेशी चपट्या होतात; दोन्हींना तळपटल असते", "आभासी स्तरित अभिस्तर बहुस्तरीय असून ताण सहन करत नाही; संक्रमणकालीन अभिस्तर एकस्तरीय असून फक्त प्रसरण करते", "दोन्ही एकस्तरीय घनाकृती अभिस्तराचे उपप्रकार आहेत; फरक फक्त पक्ष्मांच्या उपस्थितीत आहे"], "correct_index": 1, "explanation_marathi": "आभासी स्तरित दिसायला बहुस्तरीय वाटले तरी एकस्तरीय असते - सर्व पेशी तळपटलावर असतात, केंद्रकांच्या उंचीमुळे भास होतो. संक्रमणकालीन हे खरे स्तरित असून ताणल्यावर छत्री-पेशी चपट्या होतात. दोन्हींना तळपटल असते, त्यामुळे 'तळपटल नसते' व एकस्तरीय/घनाकृती दावे चूक.", "evidence": "NCERT Class 11 Biology Ch.7 Structural Organisation in Animals - epithelial tissue types; pseudostratified vs transitional epithelium"}, {"section": 8, "subtopic": "कार्य ऊर्जा", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): पृथ्वीभोवती वर्तुळाकार कक्षेत फिरणाऱ्या उपग्रहावर गुरुत्व बल नेहमी वेगाला लंब दिशेने (केंद्राकडे) लागते.\nपरिणाम (R): उपग्रहाची गतिज ऊर्जा स्थिर राहते, कारण एका पूर्ण फेरीत गुरुत्व बलाने केलेले कार्य शून्य असते.\nयोग्य पर्याय निवडा.", "q_english": "Assertion (A): On a satellite in circular orbit, Earth's gravity always acts perpendicular to velocity (towards centre).\nReason (R): The satellite's kinetic energy remains constant because work done by gravity over one full orbit is zero.\nChoose the correct option.", "options": ["A आणि R दोन्ही सत्य, आणि R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "W = Fs cosθ, येथे θ=90° म्हणून W=0; कार्य-ऊर्जा प्रमेयाने ΔKE=0, म्हणून R हे A चे थेट स्पष्टीकरण आहे. पर्याय 2/3 मध्ये R चे सत्यत्व नाकारले आहे, पर्याय 1 मध्ये स्पष्टीकरण संबंध तोडला आहे.", "evidence": "NCERT Class 11 Physics Chapter 5 Work, Energy and Power: W=F·s, Work-Energy Theorem; Class 9 Chapter 10 Gravitation - circular orbit"}, {"section": 8, "subtopic": "क्षारधातू", "qtype": "कालक्रम लावा", "q_marathi": "क्षारधातूंच्या शोध/विलगीकरणाचा योग्य कालक्रम लावा: (अ) पोटॅशियम (ब) लिथियम (क) रुबिडियम (ड) फ्रान्सियम", "q_english": "Arrange the discovery/isolation of alkali metals in chronological order: (a) Potassium (b) Lithium (c) Rubidium (d) Francium", "options": ["अ → ब → क → ड", "ब → अ → क → ड", "अ → क → ब → ड", "अ → ब → ड → क"], "correct_index": 0, "explanation_marathi": "K (डेव्ही, 1807) → Li (आर्फवेडसन, 1817) → Rb (बुनसेन-किरचॉफ, 1861) → Fr (पेरे, 1939) हा योग्य क्रम आहे. Li ला आधी ठेवणारे किंवा Rb-Fr अदलाबदल करणारे पर्याय चूक.", "evidence": "IUPAC discovery records: K 1807 Davy, Li 1817 Arfvedson, Rb 1861 Bunsen-Kirchhoff, Fr 1939 Perey; NCERT Class 11 s-block."}, {"section": 8, "subtopic": "दाब पास्कल", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "दाबाबाबत विधाने पहा:\nI. 1 पास्कल = 1 न्यूटन/मी²; दाब ही अदिश राशी आहे.\nII. स्थिर द्रवात एकाच आडव्या पातळीवर दाब समान असतो; दाब खोलीबरोबर hρg ने वाढतो.\nIII. पास्कलच्या नियमानुसार बंदिस्त द्रवावरील दाब सर्व दिशांना समान प्रसारित होतो, त्यामुळे हायड्रॉलिक लिफ्टमध्ये लहान बलाने मोठे बल मिळते.", "q_english": "Statements on pressure:\nI. 1 pascal = 1 N/m²; pressure is a scalar quantity.\nII. In static fluid pressure is same at same horizontal level; increases with depth as hρg.\nIII. Per Pascal's law, pressure on enclosed fluid is transmitted equally in all directions, so hydraulic lift multiplies force.", "options": ["I, II आणि III तिन्ही बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "तिन्ही विधाने सत्य: एकक-व्याख्या व अदिशत्व, hρg सूत्र, आणि पास्कल नियमाचे हायड्रॉलिक उपयोजन. दाबाला सदिश मानून I वगळणारे पर्याय 2 चुकीचा आहे.", "evidence": "NCERT Class 11 Physics Chapter 9 Mechanical Properties of Fluids: pressure unit, hρg, Pascal's law and hydraulic lift"}, {"section": 8, "subtopic": "न्यूटन 3 नियम", "qtype": "कालक्रम लावा", "q_marathi": "बंदुकीतून गोळी सुटताना न्यूटनच्या तिसऱ्या नियमाची साखळी घडते. घटनांचा योग्य कालक्रम लावा:\nA. प्रणोदक वायूंचा प्रसार होऊन गोळीवर पुढे बल लागते\nB. गोळी नळीतून बाहेर पडते\nC. गोळीवरील बलाच्या प्रतिक्रियेत बंदुकीवर मागे बल लागते (recoil)\nD. नेमबाजाच्या खांद्यावर मागे ढकलणारे बल जाणवते", "q_english": "When a gun fires, Newton's third law chain occurs. Arrange in correct chronological sequence:\nA. Propellant gases expand exerting forward force on bullet\nB. Bullet exits the muzzle\nC. In reaction, backward force acts on gun (recoil)\nD. Shooter's shoulder feels backward push", "options": ["A → C → B → D", "A → B → C → D", "C → A → B → D", "A → C → D → B"], "correct_index": 0, "explanation_marathi": "A व C ही क्रिया-प्रतिक्रिया एकाच क्षणी घडतात (तिसरा नियम), त्यानंतर प्रवेग पावलेली गोळी B मध्ये बाहेर पडते आणि शेवटी बंदूक मागे सरकून D मध्ये खांद्यावर बल देते. B नंतर C मानणारे पर्याय क्रम चुकवतात.", "evidence": "NCERT Class 9 Science Chapter 8 Force and Laws of Motion: Newton's Third Law, gun recoil example; action-reaction act simultaneously on different bodies"}, {"section": 8, "subtopic": "पचन संस्था", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: A) टायलिन B) पेप्सिन C) ट्रिप्सिन D) लॅक्टेज; i) स्टार्च→माल्टोज, तोंड (pH 6.8) ii) प्रथिने→पेप्टोन्स, जठर (pH 1.8) iii) प्रथिने/पेप्टोन्स→लहान पेप्टाइड्स, लहान आतडे (pH 7.8) iv) लॅक्टोज→ग्लुकोज+गॅलॅक्टोज, लहान आतडे (pH 7.8). अचूक मेळ निवडा.", "q_english": "Match: A) Ptyalin B) Pepsin C) Trypsin D) Lactase; i) Starch→maltose, mouth (pH 6.8) ii) Proteins→peptones, stomach (pH 1.8) iii) Proteins/peptones→small peptides, small intestine (pH 7.8) iv) Lactose→glucose+galactose, small intestine (pH 7.8). Choose correct match.", "options": ["A-i, B-ii, C-iii, D-iv", "A-i, B-iii, C-ii, D-iv", "A-ii, B-i, C-iii, D-iv", "A-i, B-ii, C-iv, D-iii"], "correct_index": 0, "explanation_marathi": "टायलिन लाळेत तटस्थ pH ला स्टार्च पचवते, पेप्सिन अम्ल pH ला प्रथिने पचवते, ट्रिप्सिन क्षारधर्मी pH ला प्रथिने पुढे पचवते, लॅक्टेज लॅक्टोज पचवते. पर्याय 2 मध्ये पेप्सिन/ट्रिप्सिनचे pH अदलाबदल चूक, पर्याय 3 मध्ये टायलिन/पेप्सिन अदलाबदल चूक, पर्याय 4 मध्ये ट्रिप्सिन/लॅक्टेजचे भक्ष्य अदलाबदल चूक.", "evidence": "NCERT Class 11 Biology Ch.16 Digestion and Absorption - digestive enzymes, substrate and pH specificity"}, {"section": 8, "subtopic": "पेशी केंद्रक vs तंतुकणिका", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): पेशीतून केंद्रक काढून टाकल्यास विभाजन आणि नवीन mRNA संश्लेषण त्वरित थांबते. परिणाम (E): त्याच पेशीतील तंतुकणिका काही काळ ATP निर्मिती चालू ठेवतात, त्यामुळे आधीपासून असलेल्या विकरांवरील चयापचय तात्पुरते सुरू राहते. योग्य पर्याय निवडा.", "q_english": "Cause (C): Removing the nucleus from a cell immediately stops cell division and new mRNA synthesis. Effect (E): Mitochondria in the same cell continue ATP production for some time, so metabolism driven by pre-existing enzymes continues temporarily. Choose the correct option.", "options": ["C आणि E दोन्ही सत्य; E हा C चा परिणाम नसून केंद्रक व तंतुकणिकेची स्वतंत्र कार्ये दर्शवतो", "C सत्य, E असत्य; केंद्रकाविना तंतुकणिका त्वरित निष्क्रिय होतात", "C असत्य, E सत्य; केंद्रकाविना mRNA संश्लेषण पेशीद्रव्यात चालू राहते", "C आणि E दोन्ही सत्य; E हे C चे तार्किक स्पष्टीकरण आहे"], "correct_index": 0, "explanation_marathi": "केंद्रक आनुवंशिक नियंत्रण व mRNA पुरवते, म्हणून ते काढल्यास विभाजन/नवीन संश्लेषण थांबते (C सत्य). तंतुकणिका अर्ध-स्वायत्त (स्वतःचे DNA) असल्याने ATP तात्पुरते चालू ठेवते (E सत्य). पण E हा C पासून निर्माण झालेला परिणाम नाही; दोन्ही स्वतंत्र कार्ये आहेत, म्हणून पर्याय 4 चा 'स्पष्टीकरण' दावा चूक, व 2-3 मधील असत्य विधाने अमान्य.", "evidence": "NCERT Class 9 Science Ch.5 The Fundamental Unit of Life - nucleus controls cell, mitochondria ATP; enucleation experiments"}, {"section": 8, "subtopic": "रासायनिक बंध आयनिक vs सहसंयोजक", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: यादी-I (अ) NaCl, (ब) CH4, (क) MgO, (ड) HCl; यादी-II (1) वितळलेल्या अवस्थेत विद्युत वाहक, आयनिक जालक (2) अध्रुवीय चतुःफलकीय सहसंयोजक, बंध ऊर्जा ~413 kJ/mol (3) उच्च जालक ऊर्जा ~3795 kJ/mol, ठिसूळ आयनिक घन (4) ध्रुवीय सहसंयोजक, जलीय द्रावणात प्रबळ आम्ल. योग्य मेळ निवडा.", "q_english": "Match: List-I (a) NaCl, (b) CH4, (c) MgO, (d) HCl; List-II (1) conducts in molten state, ionic lattice (2) non-polar tetrahedral covalent, bond energy ~413 kJ/mol (3) high lattice energy ~3795 kJ/mol, brittle ionic solid (4) polar covalent, strong acid in aqueous solution. Choose correct match.", "options": ["अ-1, ब-2, क-3, ड-4", "अ-1, ब-4, क-3, ड-2", "अ-3, ब-2, क-1, ड-4", "अ-1, ब-2, क-4, ड-3"], "correct_index": 0, "explanation_marathi": "NaCl वितळल्यावर आयन मुक्त होऊन वाहक (1), CH4 अध्रुवीय सहसंयोजक (2), MgO ची जालक ऊर्जा अत्युच्च व ठिसूळ (3), HCl ध्रुवीय सहसंयोजक पण पाण्यात H+ देतो (4). इतर पर्यायांत 1-3-4 ची अदलाबदल केली आहे म्हणून चूक.", "evidence": "NCERT Class 11 Chemistry Ch-4 Chemical Bonding: NaCl ionic conducts molten not solid; CH4 tetrahedral covalent; MgO lattice energy 3795 kJ/mol; HCl polar covalent."}, {"section": 8, "subtopic": "लस रोगप्रतिकार", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): निष्क्रिय लसीकरणात तयार प्रतिपिंडे दिल्याने त्वरित संरक्षण मिळते, परंतु स्मृती पेशी तयार होत नाहीत. कारण (R): सक्रिय रोगप्रतिकारशक्तीत प्रतिजन संपर्कानंतर B-लसिकापेशींपासून स्मृती पेशी तयार होतात, त्यामुळे दुय्यम प्रतिसाद तीव्र व जलद असतो.", "q_english": "Assertion (A): In passive immunization, readymade antibodies give immediate protection but no memory cells are formed. Reason (R): In active immunity, antigen exposure generates memory cells from B-lymphocytes, so secondary response is stronger and faster.", "options": ["A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A सत्य - तयार Ig (उदा. टिटॅनस Ig, मातृ IgA) त्वरित निष्क्रिय संरक्षण देते, प्रतिजन नसल्याने स्मृती नाही. R सत्य - सक्रिय प्रतिकारात स्मृती B-पेशी दुय्यम प्रतिसाद तीव्र करतात. पण R हे A च्या 'त्वरित'पणाचे कारण स्पष्ट करत नाही (ते तयार प्रतिपिंडांमुळे आहे), म्हणून स्पष्टीकरणाचा दावा चूक.", "evidence": "NCERT Class 12 Biology Ch.8 Human Health and Disease - active vs passive immunity, memory cells"}, {"section": 8, "subtopic": "वेग vs त्वरण", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्त्यात एका वस्तूच्या गतीची नोंद दिली आहे:\n| वेळ (s) | 0 | 2 | 4 | 6 |\n| वेग (velocity) (m/s) | 10 पूर्वेकडे | 10 पूर्वेकडे | 18 पूर्वेकडे | 26 पूर्वेकडे |\nया आधारे 0–2 s आणि 2–6 s या टप्प्यांतील वेग व त्वरणाबाबत योग्य निष्कर्ष कोणता?", "q_english": "Consider the table:\n| Time (s) | 0 | 2 | 4 | 6 |\n| Velocity (m/s) | 10 east | 10 east | 18 east | 26 east |\nWhich conclusion about velocity and acceleration in intervals 0–2 s and 2–6 s is correct?", "options": ["0–2 s: वेग स्थिर, त्वरण शून्य; 2–6 s: सरासरी त्वरण 4 m/s² पूर्वेकडे, वेग बदलत आहे", "0–2 s: वेग स्थिर, त्वरण शून्य; 2–6 s: सरासरी त्वरण 4 m/s² पश्चिमेकडे, वेग स्थिर आहे", "0–2 s: वेग स्थिर, त्वरण 5 m/s² पूर्वेकडे; 2–6 s: सरासरी त्वरण 8 m/s² पूर्वेकडे", "0–2 s: चाल स्थिर म्हणून त्वरण 4 m/s²; 2–6 s: वेग वाढत असून त्वरण शून्य"], "correct_index": 0, "explanation_marathi": "0–2 s मध्ये Δv=0 म्हणून a=0; 2–6 s मध्ये Δv=16 m/s, Δt=4 s म्हणून a=4 m/s² पूर्वेकडे. वेग सदिश असल्याने परिमाण/दिशा बदल म्हणजे त्वरण. इतर पर्यायांत दिशा चुकली आहे किंवा Δt ने भाग न देता 8 m/s² घेतले आहे.", "evidence": "NCERT Class 9 Science Chapter 7 Motion: a = (v-u)/t; velocity is vector, acceleration requires change in velocity"}, {"section": 8, "subtopic": "शक्ती वॅट", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "यंत्र P: 500 W शक्तीने 20 s कार्य करते. यंत्र Q: 250 W शक्तीने 50 s कार्य करते. (कार्य = शक्ती × वेळ, 1 W = 1 J/s) दोन्हींच्या कार्य आणि ऊर्जेबाबत योग्य निष्कर्ष कोणता?", "q_english": "Machine P works at 500 W for 20 s. Machine Q works at 250 W for 50 s. (Work = Power × time, 1 W = 1 J/s) Which conclusion about their work and energy is correct?", "options": ["P ने 10,000 J, Q ने 12,500 J कार्य केले; कमी शक्ती असूनही Q ने अधिक ऊर्जा खर्च केली", "P ने 10,000 J, Q ने 12,500 J कार्य केले; अधिक शक्तीमुळे P ने अधिक ऊर्जा खर्च केली", "P ने 25,000 J, Q ने 5,000 J कार्य केले; P ने अधिक कार्य केले", "दोघांनी समान 10,000 J कार्य केले; शक्तीतील फरक वेळेने भरून निघाला"], "correct_index": 0, "explanation_marathi": "W=P×t ने P=500×20=10,000 J, Q=250×50=12,500 J; म्हणून Q>P. पर्याय 1 मध्ये आकडे बरोबर पण निष्कर्ष उलटा आहे, पर्याय 2/3 मध्ये गुणाकार चुकला आहे.", "evidence": "NCERT Class 9 Science Chapter 10 Work and Energy: P = W/t, 1 watt = 1 joule/second"}, {"section": 8, "subtopic": "हृदय", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने विचारात घ्या: I) त्रिदली (tricuspid) उजव्या अलिंद-निलय झडपेच्या बंद होण्यामुळे प्रथम हृदयध्वनी (LUB) निर्माण होतो. II) SA नोडची क्रिया महाधमनीतील सर्वाधिक रक्तदाबाच्या वेळी (निलयी प्रकुंचनाच्या शिखरावर) घडते. III) दैहिक परिसंचरणाचा प्रतिरोध फुफ्फुसीय परिसंचरणापेक्षा जास्त असल्याने डाव्या निलयाची भित्तिका उजव्यापेक्षा जाड असते. योग्य पर्याय निवडा.", "q_english": "Consider statements: I) Closure of tricuspid right AV valve produces first heart sound (LUB). II) SA node activity occurs at peak aortic pressure (peak ventricular systole). III) Left ventricular wall is thicker than right because systemic resistance exceeds pulmonary resistance. Choose correct option.", "options": ["I, II आणि III सर्व बरोबर", "फक्त I आणि III बरोबर, II चूक", "फक्त II आणि III बरोबर, I चूक", "फक्त I आणि II बरोबर, III चूक"], "correct_index": 1, "explanation_marathi": "I सत्य - LUB हा AV झडपा (tricuspid+bicuspid) बंद होण्याने निलयी प्रकुंचनाच्या सुरुवातीला होतो. II असत्य - SA नोड अलिंद प्रकुंचन सुरू करतो, महाधमनीतील शिखर दाब त्यानंतर निलयी प्रकुंचनात होतो. III सत्य - जास्त दाबाविरुद्ध पंप करण्यासाठी डावा निलय जाड असतो. त्यामुळे फक्त I, III बरोबर.", "evidence": "NCERT Class 11 Biology Ch.18 Body Fluids and Circulation - heart sounds, SA node, ventricular wall thickness"}];
let currentFilter='all';
const sectionNames={3:"3. चालू घडामोडी",4:"4. इतिहास",5:"5. भूगोल",6:"6. राज्यशास्त्र",7:"7. अर्थशास्त्र",8:"8. सामान्य विज्ञान"};
const filtersEl=document.getElementById('filters');const quizEl=document.getElementById('quiz');const progressEl=document.getElementById('progress');
function renderFilters(){
 filtersEl.innerHTML='';
 const allBtn=document.createElement('button');allBtn.className='filter-btn'+(currentFilter==='all'?' active':'');allBtn.textContent='सर्व (90)';
 allBtn.onclick=()=>{currentFilter='all';renderFilters();renderQuiz();};filtersEl.appendChild(allBtn);
 [3,4,5,6,7,8].forEach(s=>{const b=document.createElement('button');b.className='filter-btn'+(currentFilter===s?' active':'');b.textContent=sectionNames[s]+' (15)';b.onclick=()=>{currentFilter=s;renderFilters();renderQuiz();};filtersEl.appendChild(b);});
}
function renderQuiz(){
 const qs=QUESTIONS.filter(q=>currentFilter==='all'||q.section===currentFilter);
 progressEl.textContent='संच G • दाखवलेले प्रश्न: '+qs.length;
 quizEl.innerHTML='';
 qs.forEach((q,idx)=>{
  const card=document.createElement('div');card.className='qcard';
  const letters=['A','B','C','D'];
  let optsHtml=q.options.map((op,i)=>'<div class="opt"><span class="opt-letter">'+letters[i]+'.</span><span>'+op.replace(/\n/g,'<br>')+'</span></div>').join('');
  card.innerHTML='<div class="qmeta"><span class="badge">'+sectionNames[q.section]+'</span><span class="badge type">'+(q.qtype||'')+'</span><span class="badge diff">कठीणता 5/5</span><span class="badge" style="background:#f3e5f5;color:#6a1b9a">'+(q.subtopic||'')+'</span></div><div class="qtext"><b>प्रश्न '+(idx+1)+'.</b> '+q.q_marathi.replace(/\n/g,'<br>')+'<span class="en">'+q.q_english.replace(/\n/g,'<br>')+'</span></div><div class="opts">'+optsHtml+'</div><button class="show-ans">उत्तर पहा</button><div class="ansbox"><div class="correct">✅ योग्य उत्तर: '+letters[q.correct_index]+' – '+q.options[q.correct_index]+'</div><div class="expl"><b>स्पष्टीकरण:</b> '+q.explanation_marathi.replace(/\n/g,'<br>')+'</div><div class="evi">पुरावा: '+(q.evidence||'')+'</div></div>';
  quizEl.appendChild(card);
  const btn=card.querySelector('.show-ans');const box=card.querySelector('.ansbox');
  btn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा';};
  card.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected');};});
 });
}
renderFilters();renderQuiz();
</script></body></html>
