xplanation_marathi": "A व R दोन्ही सत्य आणि pH=-log[H⁺] नुसार उच्च H⁺ हेच कमी pH चे कारण, त्यामुळे R हे A चे अचूक स्पष्टीकरण.", "evidence": "NCERT Class 7 Science Ch-4 Acids, Bases and Salts; Class 11 Chemistry Ch-7 Equilibrium"}, {"section": 8, "subtopic": "Blood groups Rh factor", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना 1: Rh-नकारात्मक मातेला पहिल्या Rh-धनात्मक प्रसूतीनंतर Anti-D (RhoGAM) दिल्यास दुसऱ्या Rh+ गर्भातील Erythroblastosis Fetalis टळते. संकल्पना 2: O Rh- लालपेशी सर्वांना देता येतात; AB Rh+ लालपेशी ग्राही सर्वांकडून लालपेशी घेऊ शकतो. दोन्हींवरून योग्य निष्कर्ष कोणता?", "q_english": "Concept 1: Anti-D (RhoGAM) after first Rh-positive delivery to an Rh-negative mother prevents erythroblastosis fetalis in second Rh+ fetus. Concept 2: O Rh-negative red cells can be given to all; AB Rh-positive red-cell recipient can receive from all. What is the correct conclusion combining both?", "options": ["Anti-D मातृ anti-Rh प्रतिपिंडे नष्ट करते व O Rh- सार्वत्रिक दाता फक्त लालपेशींसाठी; प्लाझ्मासाठी AB सार्वत्रिक दाता", "Anti-D गर्भाचे Rh प्रतिजन बदलते व O Rh+ सार्वत्रिक लालपेशी दाता; AB Rh- सार्वत्रिक ग्राही", "Anti-D पहिल्याच गर्भपातात द्यावे लागते व AB Rh+ प्लाझ्मा सार्वत्रिक दाता म्हणून O Rh- एवढाच", "Anti-D नैसर्गिक Rh+ रक्त तयार करते व O Rh- फक्त Rh- ग्राहींनाच देऊ शकतो"], "correct_index": 0, "explanation_marathi": "योग्य: Anti-D मातृ संवेदनशीलता रोखते (गर्भाचे प्रतिजन बदलत नाही); O Rh- फक्त RBC साठी सार्वत्रिक दाता, प्लाझ्मासाठी AB दाता.", "evidence": "NCERT Class 11 Biology Ch.18 Body Fluids and Circulation; AABB Transfusion Guidelines"}, {"section": 8, "subtopic": "Digestive enzymes", "qtype": "बहु-विधान", "q_marathi": "विधान I: लाळेतील टायलिन (अमायलेज) pH 6.7-7.0 मध्ये स्टार्चचे माल्टोजमध्ये रूपांतर करते व जठराच्या आम्ल pH मध्ये निष्क्रिय होते. विधान II: पेप्सिनोजन HCl द्वारे pH 1.5-2.0 मध्ये पेप्सिनमध्ये बदलून प्रथिनांचे पेप्टोन्समध्ये विघटन करते. विधान III: स्वादुपिंडाचा ट्रिप्सिन एंटेरोकायनेजने सक्रिय होऊन क्षारीय pH मध्ये स्टार्च व प्रथिने दोन्ही पचवतो. योग्य पर्याय निवडा.", "q_english": "Statement I: Salivary tyalin (amylase) at pH 6.7-7.0 converts starch to maltose and is inactivated in gastric acid pH. Statement II: Pepsinogen is converted by HCl at pH 1.5-2.0 to pepsin which digests proteins to peptones. Statement III: Pancreatic trypsin activated by enterokinase digests both starch and proteins in alkaline pH. Choose correct option.", "options": ["I व II बरोबर, III चूक (ट्रिप्सिन फक्त प्रथिने पचवतो, स्टार्च नव्हे)", "II व III बरोबर, I चूक (टायलिन आम्ल pH मध्ये सक्रिय)", "I व III बरोबर, II चूक (पेप्सिन pH 8 मध्ये सक्रिय)", "I, II, III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "योग्य: I-II अचूक pH व कार्य दर्शवतात; III चूक—ट्रिप्सिन प्रोटिएज आहे, स्टार्चचे पचन अमायलेज करते.", "evidence": "NCERT Class 11 Biology Ch.16 Digestive enzymes pH specificity"}, {"section": 8, "subtopic": "Ecosystem food chain", "qtype": "बहु-विधान", "q_marathi": "विधाने: (I) लिंडेमानच्या 10% नियमानुसार पुढील पोषण पातळीत ~10% ऊर्जा हस्तांतरित होते. (II) DDT चे जैविक सांद्रीकरण (biomagnification) सर्वोच्च मांसाहारी पातळीवर सर्वाधिक असते. (III) चराऊ अन्नसाखळी उत्पादकापासून तर मृतोपजीवी अन्नसाखळी मृत सेंद्रिय पदार्थांपासून सुरू होते.", "q_english": "Statements: (I) Lindeman's 10% law – ~10% energy transferred to next trophic level. (II) Biomagnification of DDT is highest at top carnivore level. (III) Grazing food chain starts from producers while detritus food chain starts from dead organic matter.", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III सर्व बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "तिन्ही सत्य: 10% हस्तांतरण, वरच्या पातळीत DDT वाढ, दोन्ही अन्नसाखळ्यांचा प्रारंभबिंदू भिन्न.", "evidence": "NCERT Class 12 Biology Ch-12 Ecosystem: Lindeman 10% law; biomagnification of DDT"}, {"section": 8, "subtopic": "Hormones insulin", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) इन्सुलिन – (b) ग्लुकागॉन – (c) टाइप-1 मधुमेह – (d) टाइप-2 मधुमेह यांच्या योग्य जोड्या: (i) β-पेशी, ग्लुकोज→ग्लायकोजन (ii) α-पेशी, ग्लायकोजनोलिसिस (iii) ऑटोइम्यून β-नाश, पूर्ण इन्सुलिन अभाव (iv) इन्सुलिन प्रतिरोध, सापेक्ष अभाव", "q_english": "Match: (a) Insulin – (b) Glucagon – (c) Type-1 diabetes – (d) Type-2 diabetes with: (i) β-cells, glucose→glycogen (ii) α-cells, glycogenolysis (iii) autoimmune β-destruction, absolute insulin deficiency (iv) insulin resistance, relative deficiency", "options": ["a-i, b-ii, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iv, d-iii"], "correct_index": 0, "explanation_marathi": "योग्य: इन्सुलिन-β/ग्लायकोजेनेसिस, ग्लुकागॉन-α/ग्लायकोजेनोलिसिस, टाइप-1 पूर्ण अभाव, टाइप-2 प्रतिरोध.", "evidence": "NCERT Class 11 Biology Ch.22 Chemical Coordination and Integration; ADA Standards of Care 2024"}, {"section": 8, "subtopic": "Immunity vaccines", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): गोवर लस ही जिवंत क्षीण (live attenuated) लस असल्याने पेशीय व प्रतीय दोन्ही प्रतिकारशक्ती दीर्घकाळ देते. कारण (R): जिवंत क्षीण लसींना बूस्टरची कधीच गरज नसते व त्या रोगप्रतिकारउणिव असलेल्यांसाठी पूर्ण सुरक्षित असतात.", "q_english": "Assertion (A): Measles vaccine being live attenuated gives both cell-mediated and humoral immunity for long duration. Reason (R): Live attenuated vaccines never need boosters and are fully safe in immunocompromised persons.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 2, "explanation_marathi": "योग्य: A सत्य—जिवंत क्षीण लस दीर्घ सक्रिय प्रतिकार देते; R असत्य—काहींना बूस्टर लागतो व immunocompromised मध्ये निषिद्ध.", "evidence": "NCERT Class 12 Biology Ch.7 Human Health and Disease; WHO Vaccine Safety Guidelines"}, {"section": 8, "subtopic": "Light refraction lens", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): पाण्यात बुडवलेल्या काचेच्या बहिर्वक्र भिंगाचे नाभीय अंतर हवेतील तुलनेत वाढते. कारण (R): भिंगाची क्षमता (1/f) ही (μ_भिंग/μ_माध्यम - 1) या सापेक्ष अपवर्तनांकावर अवलंबून असते.", "q_english": "Assertion (A): Focal length of a glass convex lens immersed in water increases compared to air. Reason (R): Lens power (1/f) depends on (μ_lens/μ_medium - 1), the relative refractive index.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "लेन्समेकर सूत्रानुसार पाण्यात μ_rel कमी झाल्याने (1/f) कमी होऊन f वाढते, म्हणून A व R सत्य व R हे योग्य स्पष्टीकरण.", "evidence": "NCERT Class 12 Physics Chapter 9 Ray Optics - lensmaker formula"}, {"section": 8, "subtopic": "Magnetism electromagnet", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: X: N=500, I=2A, गाभा-मऊ लोखंड; Y: N=250, I=4A, गाभा-पोलाद (NI समान=1000). दोन्हीतून समान विद्युतधारा वाहते तेव्हा कोणते विधान योग्य?", "q_english": "Table: X: N=500, I=2A, core-soft iron; Y: N=250, I=4A, core-steel (NI same=1000). When energized, which statement is correct?", "options": ["X चे विद्युतचुंबकत्व अधिक, मऊ लोखंडाची पारगम्यता जास्त", "Y चे विद्युतचुंबकत्व अधिक, आटके कमी म्हणून", "दोन्ही समान, कारण NI समान आहे", "Y चे अधिक, पोलादाची धारणक्षमता जास्त म्हणून"], "correct_index": 0, "explanation_marathi": "B ∝ NI·μ; NI समान असली तरी मऊ लोखंडाची μ व तात्पुरते चुंबकत्व पोलादापेक्षा जास्त.", "evidence": "NCERT Class 10 Science Chapter 13 Magnetic Effects"}, {"section": 8, "subtopic": "Metals reactivity series", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "श्रेणी (K>Na>Ca>Mg>Al>C>Zn>Fe>Cu>Ag) पहा: (i) Fe, CuSO₄ मधून Cu विस्थापित करते; (ii) कार्बन ZnO चे Zn मध्ये अपचयन करते पण Al₂O₃ चे Al मध्ये नाही. योग्य निष्कर्ष निवडा:", "q_english": "Given series (K>Na>Ca>Mg>Al>C>Zn>Fe>Cu>Ag): (i) Fe displaces Cu from CuSO4; (ii) Carbon reduces ZnO to Zn but not Al2O3 to Al. Choose correct inference:", "options": ["(i) Cu अधिक क्रियाशील म्हणून Fe ला विस्थापित करते; (ii) Zn, C पेक्षा अधिक क्रियाशील म्हणून अपचयन होते", "(i) Fe, Cu पेक्षा अधिक क्रियाशील म्हणून विस्थापन शक्य; (ii) C, Zn पेक्षा अधिक क्रियाशील पण Al पेक्षा कमी म्हणून फक्त ZnO चे अपचयन शक्य", "(i) Fe, Cu पेक्षा कमी क्रियाशील तरी विस्थापन करते; (ii) Al, C पेक्षा कमी क्रियाशील म्हणून अपचयन होत नाही", "(i) विस्थापन विद्राव्यतेमुळे होते, श्रेणीशी संबंध नाही; (ii) दोन्ही ऑक्साइडांचे कार्बन अपचयन करते"], "correct_index": 1, "explanation_marathi": "बरोबर: अधिक क्रियाशील धातू कमी क्रियाशीलला विस्थापित करतो; C हा Zn वर पण Al खाली असल्याने फक्त ZnO अपचित होतो.", "evidence": "NCERT Class 10 Science Ch-3 Metals and Non-metals"}, {"section": 8, "subtopic": "Mitosis vs meiosis", "qtype": "कालक्रम लावा", "q_marathi": "अर्धसूत्री विभाजनातील घटना कालक्रमानुसार लावा: (अ) पॅकिटीनमध्ये क्रॉसिंग ओव्हर, (ब) ॲनाफेज-I मध्ये होमोलॉगस गुणसूत्रांचे विलगीकरण, (क) ॲनाफेज-II मध्ये सिस्टर क्रोमॅटिड्सचे विलगीकरण, (ड) S-टप्प्यात DNA प्रतिकृती", "q_english": "Arrange meiosis events chronologically: (a) crossing over in pachytene, (b) homologous chromosome separation in anaphase-I, (c) sister chromatid separation in anaphase-II, (d) DNA replication in S-phase", "options": ["अ→ड→ब→क", "ड→ब→अ→क", "ड→अ→क→ब", "ड→अ→ब→क"], "correct_index": 3, "explanation_marathi": "बरोबर क्रम: DNA प्रतिकृती (ड) → क्रॉसिंग ओव्हर (अ/प्रोफेज-I) → होमोलॉगस विलगीकरण (ब) → सिस्टर क्रोमॅटिड विलगीकरण (क).", "evidence": "NCERT Class 11 Biology Ch-10 Cell Cycle and Cell Division"}, {"section": 8, "subtopic": "Newton laws friction", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: (I) स्थिर घर्षण स्व-समायोजक असून प्रयुक्त बाह्य बलाइतकेच वाढते, कमाल मर्यादा μsN पर्यंत. (II) घर्षण बल नेहमी वस्तूच्या गतीच्या विरुद्ध दिशेने कार्य करते. (III) न्यूटनच्या तिसऱ्या नियमानुसार क्रिया-प्रतिक्रिया बले एकाच वस्तूवर कार्य करून एकमेकांना रद्द करतात. योग्य पर्याय निवडा.", "q_english": "Consider: (I) Static friction is self-adjusting, equal to applied force up to μsN. (II) Friction always acts opposite to the motion of the body. (III) Action-reaction pair acts on the same body and cancels each other. Choose correct option.", "options": ["फक्त I बरोबर", "I आणि II बरोबर", "II आणि III बरोबर", "I, II आणि III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I सत्य: स्थिर घर्षण μsN पर्यंत बाह्य बलाची बरोबरी करते. II असत्य: घर्षण सापेक्ष गती/स्थिती-प्रवणतेला विरोध करते, गतीला नव्हे. III असत्य: क्रिया-प्रतिक्रिया भिन्न वस्तूंवर असतात.", "evidence": "NCERT Class 11 Physics Chapter 5 Laws of Motion"}, {"section": 8, "subtopic": "Ohm law circuits", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (घटक - V-I वैशिष्ट्य): a) तांब्याची तार (स्थिर ताप) b) टंगस्टन फिलामेंट c) p-n डायोड d) NTC थर्मिस्टर; i) मूळातून सरळरेषा ii) वक्र, V वाढता R वाढतो iii) अरेषीय, threshold नंतर तीव्र वाढ iv) अरेषीय, ताप वाढता R घटतो.", "q_english": "Match (device - V-I characteristic): a) copper wire (const. temp) b) tungsten filament c) p-n diode d) NTC thermistor; i) straight line through origin ii) curved, R rises with V iii) non-linear, sharp rise after threshold iv) non-linear, R falls with temp.", "options": ["a-i, b-ii, c-iii, d-iv", "a-i, b-iv, c-iii, d-ii", "a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iv, d-iii"], "correct_index": 0, "explanation_marathi": "a ओहमिक म्हणून सरळरेषा; b मध्ये तापाने R वाढतो म्हणून वक्र; c एकदिशीय अरेषीय; d मध्ये NTC मुळे R घटतो.", "evidence": "NCERT Class 12 Physics Chapter 3 Current Electricity"}, {"section": 8, "subtopic": "Photosynthesis Calvin cycle", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा: (अ) कार्बोक्सिलेशन – RuBP+CO₂→3-PGA (RuBisCO), (ब) रिडक्शन – 3-PGA→G3P, (क) रिजनरेशन – G3P→RuBP. प्रति 1 CO₂ स्थिरीकरणासाठी ATP/NADPH गरजेनुसार योग्य जुळणी निवडा:", "q_english": "See table: (a) Carboxylation – RuBP+CO2→3-PGA (RuBisCO), (b) Reduction – 3-PGA→G3P, (c) Regeneration – G3P→RuBP. Choose correct ATP/NADPH requirement per 1 CO2 fixed:", "options": ["अ–1 ATP; ब–2 ATP+2 NADPH; क–1 ATP", "अ–0 ATP; ब–1 ATP+2 NADPH; क–2 ATP", "अ–0 ATP (फक्त RuBisCO); ब–2 ATP+2 NADPH; क–1 ATP", "अ–0 ATP; ब–2 ATP+1 NADPH; क–1 ATP"], "correct_index": 2, "explanation_marathi": "बरोबर: 1 CO₂ साठी एकूण 3 ATP+2 NADPH लागतात (ब मध्ये 2+2, क मध्ये 1 ATP).", "evidence": "NCERT Class 11 Biology Ch-11 Photosynthesis in Higher Plants: Calvin cycle 3 stages"}, {"section": 8, "subtopic": "Sound Doppler effect", "qtype": "कालक्रम लावा", "q_marathi": "n0 वारंवारतेच्या स्रोतासाठी आभासी वारंवारता n' चा चढता क्रम लावा (V=ध्वनी वेग): a) स्रोत व निरीक्षक स्थिर b) स्रोत vs वेगाने निरीक्षकाकडे c) स्रोत vs वेगाने दूर d) निरीक्षक vo(=vs) वेगाने स्रोताकडे. योग्य क्रम निवडा.", "q_english": "Arrange observed frequency n' in increasing order (V=sound speed): a) source & observer at rest b) source approaching with vs c) source receding with vs d) observer approaching source with vo(=vs). Choose correct sequence.", "options": ["c < a < d < b", "c < a < b < d", "a < c < d < b", "c < d < a < b"], "correct_index": 0, "explanation_marathi": "सूत्रे: c=n0V/(V+vs), a=n0, d=n0(V+vo)/V, b=n0V/(V-vs). vs=vo असता c<a<d<b मिळते.", "evidence": "NCERT Class 11 Physics Chapter 15 Waves - Doppler effect formulas"}, {"section": 8, "subtopic": "Vitamins B12 vs C", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): जीवनसत्त्व B12 च्या आतड्यातील शोषणासाठी जठराच्या Parietal पेशींतून स्रवणारा Intrinsic Factor आवश्यक असतो. परिणाम (E): B12 अभावामुळे DNA संश्लेषण बिघडून मेगालोब्लास्टिक ॲनिमिया व न्यूरोपॅथी होते; तर C अभावामुळे कोलेजन संश्लेषण बिघडून स्कर्व्ही होतो. C-E संबंध ओळखा.", "q_english": "Cause (C): Intrinsic Factor from gastric parietal cells is essential for intestinal absorption of vitamin B12. Effect (E): B12 deficiency impairs DNA synthesis causing megaloblastic anemia and neuropathy; while vitamin C deficiency impairs collagen synthesis causing scurvy. Identify the C-E relation.", "options": ["C व E दोन्ही सत्य; C मधील शोषण-यंत्रणा E मधील B12-C मधील जैवरासायनिक फरक स्पष्ट करते", "C व E दोन्ही सत्य; परंतु C ही शोषणाची यंत्रणा आहे, E मधील DNA विरुद्ध कोलेजन या कार्यभेदाचे स्पष्टीकरण C देत नाही", "C असत्य (B12 शोषणासाठी पित्तरस आवश्यक); E सत्य", "C सत्य; E असत्य (स्कर्व्ही DNA संश्लेषण बिघाडाने होतो)"], "correct_index": 1, "explanation_marathi": "योग्य: C व E दोन्ही सत्य पण भिन्न टप्पे—C शोषणाबद्दल, E पेशीय कार्याबद्दल; त्यामुळे कार्यकारण स्पष्टीकरण नाही.", "evidence": "NCERT Class 11 Biology Ch.16 Digestion & Absorption; ICMR-NIN Nutrient Requirements 2020"}];
let currentFilter='all';
const sectionNames={3:"3. चालू घडामोडी",4:"4. इतिहास",5:"5. भूगोल",6:"6. राज्यशास्त्र",7:"7. अर्थशास्त्र",8:"8. सामान्य विज्ञान"};
const filtersEl=document.getElementById('filters');const quizEl=document.getElementById('quiz');const progressEl=document.getElementById('progress');
function getQuestions(){return QUESTIONS_C;}
function renderFilters(){
 filtersEl.innerHTML='';
 const allBtn=document.createElement('button');allBtn.className='filter-btn'+(currentFilter==='all'?' active':'');allBtn.textContent='सर्व (90)';
 allBtn.onclick=()=>{currentFilter='all';renderFilters();renderQuiz();};filtersEl.appendChild(allBtn);
 [3,4,5,6,7,8].forEach(s=>{const b=document.createElement('button');b.className='filter-btn'+(currentFilter===s?' active':'');b.textContent=sectionNames[s]+' (15)';b.onclick=()=>{currentFilter=s;renderFilters();renderQuiz();};filtersEl.appendChild(b);});
}
function renderQuiz(){
 const qs=getQuestions().filter(q=>currentFilter==='all'||q.section===currentFilter);
 progressEl.textContent='संच F • दाखवलेले प्रश्न: '+qs.length;
 quizEl.innerHTML='';
 qs.forEach((q,idx)=>{
  const card=document.createElement('div');card.className='qcard';
  const letters=['A','B','C','D'];
  let optsHtml=q.options.map((op,i)=>'<div class="opt"><span class="opt-letter">'+letters[i]+'.</span><span>'+op.replace(/\n/g,'<br>')+'</span></div>').join('');
  card.innerHTML='<div class="qmeta"><span class="badge">'+sectionNames[q.section]+'</span><span class="badge type">'+(q.qtype||'')+'</span><span class="badge diff">कठीणता 5/5</span><span class="badge" style="background:#f3e5f5;color:#6a1b9a">'+(q.subtopic||'')+'</span></div><div class="qtext"><b>प्रश्न '+(idx+1)+'.</b> '+q.q_marathi.replace(/\n/g,'<br>')+'<span class="en">'+q.q_english.replace(/\n/g,'<br>')+'</span></div><div class="opts">'+optsHtml+'</div><button class="show-ans">उत्तर पहा</button><div class="ansbox"><div class="correct">✅ योग्य उत्तर: '+letters[q.correct_index]+' – '+q.options[q.correct_index]+'</div><div class="expl"><b>स्पष्टीकरण:</b> '+q.explanation_marathi.replace(/\n/g,'<br>')+'</div><div class="evi">पुरावा: '+(q.evidence||'')+'</div></div>';
  quizEl.appendChild(card);
  const btn=card.querySelector('.show-ans');const box=card.querySelector('.ansbox');
  btn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा';};
  card.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected');};});
 });
}
renderFilters();renderQuiz();
</script>
