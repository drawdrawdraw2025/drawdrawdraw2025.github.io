<header><h1>📝 तलाठी MPSC पूर्व परीक्षा 2026 – संच F इंटरॅक्टिव्ह क्विज (6th)</h1><p>विभाग 3 ते 8 • प्रत्येकी 15 प्रश्न • एकूण 90 प्रश्न • कठीणता 5/5 • उत्तर डीफॉल्ट लपलेले • 100% नवीन</p></header><div class='filters' id='filters'></div><div class='container'><div class='progress' id='progress'></div><div id='quiz'></div></div><script>const QUESTIONS_C = [{"section": 3, "subtopic": "Ayushman 70+ 2026", "qtype": "बहु-विधान", "q_marathi": "आयुष्मान भारत 70+ (2026 स्थिती) बाबत विधाने पहा: (I) 70+ वयोगटाला उत्पन्ननिरपेक्ष ₹5 लाख वार्षिक कवच; कुटुंब आधीच लाभार्थी असल्यास हे अतिरिक्त top-up म्हणून मिळते. (II) ‘आयुष्मान वय वंदना’ कार्ड आधार e-KYC ने वितरीत व देशभर पोर्टेबल आहे. (III) 2026 पासून सर्व राज्यांसाठी केंद्र:राज्य निधी वाटप 90:10 झाले आहे.", "q_english": "Consider statements on Ayushman Bharat 70+ (2026 status): (I) All 70+ get Rs 5 lakh annual cover irrespective of income; as top-up if family already covered. (II) 'Ayushman Vay Vandana' card via Aadhaar e-KYC and portable nationwide. (III) From 2026 Centre-State funding is 90:10 for all states.", "options": ["केवळ I व II सत्य", "केवळ II व III सत्य", "I, II व III सर्व सत्य", "केवळ I सत्य"], "correct_index": 0, "explanation_marathi": "I व II सत्य आहेत; top-up तरतूद व पोर्टेबिलिटी NHA मार्गदर्शकानुसार बरोबर आहे. III असत्य, कारण 90:10 फक्त पूर्वोत्तर/डोंगरी राज्ये व UT साठी; इतरांसाठी 60:40 कायम आहे, त्यामुळे B, C बाद.", "evidence": "NHA guidelines 29 Oct 2024; Press Information Bureau 2024; Union Budget 2026-27"}, {"section": 3, "subtopic": "COP30 Belem outcomes", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): COP30 (बेलेम) परिषदेत 'ट्रॉपिकल फॉरेस्ट्स फॉरएव्हर फॅसिलिटी' या निधीची घोषणा करण्यात आली. परिणाम (R): यामुळे उष्णकटिबंधीय वनसंवर्धनासाठी कामगिरी-आधारित (रिझल्ट्स-बेस्ड) वित्तपुरवठा वाढण्याची अपेक्षा आहे.", "q_english": "Cause (A): The 'Tropical Forests Forever Facility' fund was announced at the COP30 (Belem) conference. Effect (R): This is expected to increase results-based financing for tropical forest conservation.", "options": ["A आणि R दोन्ही बरोबर; R हा A चा तार्किक परिणाम आहे", "A आणि R दोन्ही बरोबर; परंतु R हा A चा परिणाम नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "बेलेम येथे वनसंवर्धन निधीची घोषणा झाली असून अशा सुविधेचा हेतूच कामगिरी-आधारित मोबदला देणे हा असल्याने R हा A चा थेट परिणाम आहे.", "evidence": "UNFCCC COP30 अहवाल, बेलेम (ब्राझील), नोव्हेंबर 2025"}, {"section": 3, "subtopic": "Digital Census 2027 notification", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना (A): 16 जून 2025 च्या राजपत्र अधिसूचनेनुसार जनगणना-2027 दोन टप्प्यांत डिजिटल पद्धतीने होणार; संकल्पना (B): स्वातंत्र्यानंतर प्रथमच जात-गणनेचा समावेश (CCPA निर्णय 30 एप्रिल 2025). दोहोंच्या एकत्रित आधारे कोणते विधान बरोबर ठरते?", "q_english": "Consider (A): Census-2027 notified on 16 June 2025 to be conducted digitally in two phases; (B): first post-independence inclusion of caste enumeration (CCPA decision 30 April 2025). Which combined statement is correct?", "options": ["संदर्भ दिनांक 1 मार्च 2027 (हिमाच्छादित क्षेत्रांत 1 ऑक्टोबर 2026); स्व-गणना ॲपसह डिजिटल दोन टप्पे; जात-समावेशासह", "संदर्भ दिनांक 1 एप्रिल 2027 (हिमाच्छादित क्षेत्रांत 1 नोव्हेंबर 2026); स्व-गणना ॲपसह डिजिटल दोन टप्पे; जात-समावेशासह", "संदर्भ दिनांक 1 मार्च 2027 (हिमाच्छादित क्षेत्रांत 1 ऑक्टोबर 2026); केवळ कागदी गणना; जात-समावेश वगळून", "संदर्भ दिनांक 1 मार्च 2026 (हिमाच्छादित क्षेत्रांत 1 ऑक्टोबर 2025); स्व-गणना ॲपसह डिजिटल दोन टप्पे; जात-समावेशासह"], "correct_index": 0, "explanation_marathi": "बरोबर: राजपत्र 16 जून 2025 नुसार संदर्भ 1 मार्च 2027 (हिमक्षेत्र 1 ऑक्टो 2026), गृहसूची + लोकसंख्या गणना हे दोन डिजिटल टप्पे व स्व-गणना, CCPA नुसार जात-समावेश.", "evidence": "Registrar General Gazette Notification 16 June 2025; CCPA decision 30 April 2025"}, {"section": 3, "subtopic": "G20 South Africa 2025 declaration", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (G20 दक्षिण आफ्रिका 2025): A. शिखर तारीख – I. 22-23 नोव्हेंबर 2025; B. बोधवाक्य – II. Solidarity, Equality, Sustainability; C. ऐतिहासिक वैशिष्ट्य – III. आफ्रिकेतील पहिले G20; D. जाहीरनामा – IV. जोहान्सबर्ग नेत्यांचा जाहीरनामा.", "q_english": "Match (G20 South Africa 2025): A. Summit date – I. 22-23 Nov 2025; B. Motto – II. Solidarity, Equality, Sustainability; C. Historic feature – III. First G20 in Africa; D. Declaration – IV. Johannesburg Leaders' Declaration.", "options": ["A-I, B-II, C-III, D-IV", "A-I, B-III, C-II, D-IV", "A-II, B-I, C-III, D-IV", "A-I, B-II, C-IV, D-III"], "correct_index": 0, "explanation_marathi": "बरोबर: जोहान्सबर्ग 22-23 नोव्हें 2025, पहिले आफ्रिकन अध्यक्षतेची सांगड जोहान्सबर्ग जाहीरनाम्याशी जुळते.", "evidence": "G20 Johannesburg Leaders' Declaration Nov 2025"}, {"section": 3, "subtopic": "ISRO Vyommitra 2026", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): इस्रोची 'व्योममित्रा' ही अर्ध-मानवसदृश रोबोट गगनयान G1 या मानवरहित मोहिमेतून अंतराळात पाठवली जाणार आहे. कारण (R): व्योममित्रा यानातील पर्यावरणीय मापदंडांचे निरीक्षण करून पुढील मानवी मोहिमांच्या सुरक्षिततेसाठी आवश्यक माहिती पुरवणार आहे.", "q_english": "Assertion (A): ISRO's half-humanoid robot 'Vyommitra' will be sent to space on the Gaganyaan G1 uncrewed mission. Reason (R): Vyommitra will monitor environmental parameters inside the crew module and provide data essential for the safety of subsequent human missions.", "options": ["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर; परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 0, "explanation_marathi": "व्योममित्रा G1 मानवरहित उड्डाणात जाणार असून तिचे कार्य पर्यावरणीय व प्रणाली मापदंड नोंदवणे हेच आहे, त्यामुळे R हे A चे थेट स्पष्टीकरण ठरते.", "evidence": "ISRO गगनयान कार्यक्रम स्थिती अहवाल 2026"}, {"section": 3, "subtopic": "India AI Mission 2026", "qtype": "जोड्या लावा", "q_marathi": "इंडिया AI मिशन (2026 स्थिती) संदर्भात योग्य जोड्या लावा — (a) इंडियाAI कॉम्प्युट क्षमता (b) AIKosh (c) इंडियाAI फ्युचरस्किल्स (d) सेफ अँड ट्रस्टेड AI; (i) 18,000+ GPU ची पॅनेल्ड सुविधा (ii) राष्ट्रीय डेटासेट्स प्लॅटफॉर्म (iii) AI संशोधन फेलोशिप व कौशल्य विकास (iv) जबाबदार AI साठी मार्गदर्शक चौकट.", "q_english": "Match the correct pairs regarding the India AI Mission (status 2026) — (a) IndiaAI Compute Capacity (b) AIKosh (c) IndiaAI FutureSkills (d) Safe & Trusted AI; (i) 18,000+ empanelled GPUs facility (ii) National datasets platform (iii) AI research fellowships and skilling (iv) Guiding framework for responsible AI.", "options": ["a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-i, b-ii, c-iv, d-iii"], "correct_index": 0, "explanation_marathi": "AIKosh हा डेटासेट्स प्लॅटफॉर्म असून कॉम्प्युट म्हणजे GPU पॅनेलिंग; फ्युचरस्किल्स कौशल्य/फेलोशिपशी तर सेफ AI जबाबदार AI चौकटीशी संबंधित.", "evidence": "इंडियाAI मिशन, MeitY, 2024; AIKosh लोकार्पण, मार्च 2025"}, {"section": 3, "subtopic": "India-UK CETA 2026 implementation", "qtype": "बहु-विधान", "q_marathi": "भारत-UK CETA (स्वाक्षरी 24 जुलै 2025, अंमलबजावणी 2026) बाबत: (I) भारत 90% टॅरिफ लाइन्सवर कपात, UK 99% लाइन्सवर शून्य शुल्क; (II) स्कॉच व्हिस्की शुल्क 150%→75% तात्काळ, 10 वर्षांत 40% पर्यंत; (III) DCC अंतर्गत 3 वर्षे सामाजिक सुरक्षा सूट. कोणते बरोबर?", "q_english": "On India-UK CETA (signed 24 July 2025, implementation 2026): (I) India cuts tariffs on 90% lines, UK gives zero duty on 99% lines; (II) Scotch whisky duty 150% to 75% immediately, to 40% in 10 years; (III) 3-year social security exemption under DCC. Which are correct?", "options": ["I आणि II फक्त", "I, II आणि III", "II आणि III फक्त", "I आणि III फक्त"], "correct_index": 1, "explanation_marathi": "बरोबर: तिन्ही वाणिज्य मंत्रालयाच्या 2025 सारांशनुसार अचूक.", "evidence": "Ministry of Commerce press release 24 July 2025"}, {"section": 3, "subtopic": "Maharashtra EV policy 2026", "qtype": "कारण-परिणाम", "q_marathi": "कारण (R): महाराष्ट्र EV धोरण 2025 (2030 पर्यंत वैध) अंतर्गत मुंबई-पुणे द्रुतगती मार्ग, अटल सेतू व समृद्धी महामार्गावर EV साठी पूर्ण टोलमाफी 2026 पासून लागू झाली. परिणाम (E): 2026 नंतर लांब पल्ल्याच्या EV प्रवासाचा प्रति-किमी परिचालन खर्च घटून आंतरशहरी EV स्वीकार वाढेल.", "q_english": "Reason (R): Under Maharashtra EV Policy 2025 (valid till 2030), full toll waiver for EVs on Mumbai-Pune Expressway, Atal Setu and Samruddhi Mahamarg applies from 2026. Effect (E): Per-km operating cost of long-distance EV travel falls after 2026, boosting intercity EV adoption.", "options": ["R व E दोन्ही सत्य; E हे R चे योग्य स्पष्टीकरण आहे", "R व E दोन्ही सत्य; E हे R चे योग्य स्पष्टीकरण नाही", "R सत्य, E असत्य", "R असत्य, E सत्य"], "correct_index": 0, "explanation_marathi": "R मध्ये नमूद तिन्ही मार्गावरील टोलमाफी व धोरणकालावधी सत्य आहे आणि परिचालन खर्च घटणे हेच E चे थेट कारण आहे.", "evidence": "Maharashtra Cabinet decision 27 May 2025; EV Policy 2025 GR"}, {"section": 3, "subtopic": "Maharashtra Ladki Bahin eKYC 2026", "qtype": "कालक्रम लावा", "q_marathi": "'मुख्यमंत्री माझी लाडकी बहीण' योजनेतील eKYC प्रक्रियेसंदर्भातील घटनांचा योग्य कालक्रम लावा — (a) योजनेची घोषणा (b) पहिल्या हप्त्याचे वितरण (c) लाभार्थ्यांसाठी आधार-आधारित eKYC बंधनकारक करण्याचा निर्णय (d) eKYC पूर्ण करण्यासाठी अंतिम मुदतवाढ जाहीर.", "q_english": "Arrange the correct chronological order of events regarding the eKYC process in the 'Mukhyamantri Majhi Ladki Bahin' scheme — (a) announcement of the scheme (b) disbursal of the first instalment (c) decision making Aadhaar-based eKYC mandatory for beneficiaries (d) final deadline extension announced for completing eKYC.", "options": ["a-b-c-d", "a-c-b-d", "b-a-c-d", "a-b-d-c"], "correct_index": 0, "explanation_marathi": "योजना जून 2024 मध्ये जाहीर होऊन ऑगस्ट 2024 मध्ये पहिला हप्ता मिळाला; त्यानंतरच eKYC बंधनकारक झाली व शेवटी मुदतवाढ देण्यात आली.", "evidence": "महिला व बालविकास विभाग, महाराष्ट्र शासन — लाडकी बहीण योजना शासन निर्णय व eKYC परिपत्रके, 2024-2026"}, {"section": 3, "subtopic": "NEP 2020 6 years review", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 29 जुलै 2026 पर्यंत NEP 2020 मधील 5+3+3+4 रचना सर्व राज्यांत पूर्णपणे अंमलात आली. कारण (R): PARAKH, NCF-SE 2023 व DIKSHA विस्तारामुळे मूल्यांकन-अभ्यासक्रम सुधारणा संस्थात्मक झाल्या.", "q_english": "Assertion (A): By 29 July 2026 the NEP 2020 5+3+3+4 structure was fully implemented in all states. Reason (R): PARAKH, NCF-SE 2023 and DIKSHA expansion institutionalised assessment-curriculum reforms.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A असत्य, R सत्य", "A सत्य, R असत्य"], "correct_index": 2, "explanation_marathi": "2026 आढाव्यानुसार 5+3+3+4 अंमलबजावणी असमान/अपूर्णच राहिली, त्यामुळे A असत्य; PARAKH/NCF-SE/DIKSHA मात्र कार्यान्वित, त्यामुळे R सत्य.", "evidence": "NEP 2020 (29 July 2020); NCF-SE 2023; Ministry of Education NEP 6-year review 2026"}, {"section": 3, "subtopic": "PM Vishwakarma 2026", "qtype": "तक्ता आधारित", "q_marathi": "PM विश्वकर्मा (MSME मंत्रालय, 2026 स्थिती) तक्ता पहा: (i) कर्ज – ₹1 लाख + ₹2 लाख @5% सवलत दर; (ii) टूलकिट – ₹15,000; (iii) प्रशिक्षण भत्ता – ₹500/दिन; (iv) डिजिटल प्रोत्साहन – ₹1/व्यवहार (कमाल 100). कोणता पर्याय पूर्णतः बरोबर?", "q_english": "See table on PM Vishwakarma (MSME Ministry, as in 2026): (i) loan – Rs 1 lakh + Rs 2 lakh @5% concessional; (ii) toolkit – Rs 15,000; (iii) training stipend – Rs 500/day; (iv) digital incentive – Re 1/transaction (max 100). Which option is fully correct?", "options": ["(i), (ii) आणि (iii) फक्त", "(i), (ii), (iii) आणि (iv) सर्व", "(ii), (iii) आणि (iv) फक्त", "(i) आणि (iv) फक्त"], "correct_index": 1, "explanation_marathi": "बरोबर: चारही तरतुदी मार्गदर्शक तत्त्वांनुसार अचूक – ₹13,000 कोटी परिव्यय (2023-28), 18 व्यवसायांसाठी हेच लाभ.", "evidence": "PM Vishwakarma Scheme Guidelines, Ministry of MSME 2023; PIB update 2026"}, {"section": 3, "subtopic": "Paris Paralympics 2024 India", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र पहा: (X) पॅरिस पॅरालिंपिक 2024 (28 ऑग.–8 सप्टें) मध्ये भारताने 7 सुवर्णांसह एकूण 29 पदके जिंकून 18वे स्थान मिळवले; टोकियो 2020 च्या 19 पदकांचा विक्रम मोडला. (Y) अवनी लेखराने R2-10 मी एअर रायफल स्टँडिंग SH1 मध्ये सुवर्ण राखले. योग्य पर्याय निवडा.", "q_english": "Consider two concepts together: (X) At Paris Paralympics 2024 (28 Aug–8 Sep) India won 29 medals including 7 golds, ranked 18th, breaking Tokyo 2020's 19-medal record. (Y) Avani Lekhara defended gold in R2-10m air rifle standing SH1. Choose correct option.", "options": ["X व Y दोन्ही सत्य; Y हे X मधील विक्रमी कामगिरीचे प्रातिनिधिक उदाहरण आहे", "X व Y दोन्ही सत्य; पण Y चा X शी संबंध नाही", "X असत्य (25 पदके), Y सत्य", "X सत्य, Y असत्य (SH2 मध्ये सुवर्ण)"], "correct_index": 0, "explanation_marathi": "X व Y दोन्ही सत्य; 29 पदके-18वे स्थान व SH1 सुवर्णाची नोंद IPC निकालपुस्तिकेनुसार बरोबर आहे.", "evidence": "IPC Paris 2024 Results Book; PIB 9 Sep 2024"}, {"section": 3, "subtopic": "RBI repo rate Dec 2025", "qtype": "कालक्रम लावा", "q_marathi": "डिसेंबर 2025 RBI पतधोरणाच्या पार्श्वभूमीवर घटनांचा योग्य कालक्रम लावा: (A) जून 2025 मध्ये 100 bps CRR कपातीची 4 टप्प्यांत घोषणा, (B) ऑगस्ट 2025 मध्ये रेपो दर 5.50% वर यथास्थिती, (C) 29 नोव्हेंबर 2025 पासून CRR कपातीचा अंतिम टप्पा लागू, (D) 5 डिसेंबर 2025 रोजी सर्वानुमते रेपो दर 5.50% वर कायम.", "q_english": "Arrange chronologically events leading to RBI's Dec 2025 policy: (A) Jun 2025 announcement of 100 bps CRR cut in 4 tranches, (B) Aug 2025 status quo at 5.50%, (C) final CRR tranche effective 29 Nov 2025, (D) 5 Dec 2025 unanimous hold at 5.50%.", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "A-B-C-D हाच क्रम बरोबर; जून घोषणेनंतर ऑगस्ट होल्ड, नोव्हेंअखेर CRR अंमलबजावणी पूर्ण झाल्यावरच डिसेंबरमध्ये सर्वानुमते होल्ड झाला.", "evidence": "RBI MPC Statement 5 Dec 2025"}, {"section": 3, "subtopic": "UNFPA 2026 population", "qtype": "नकाशा आधारित", "q_marathi": "UNFPA ‘State of World Population 2026’ च्या भारत नकाशात 60+ वयोगटाचा वाटा गडद छटेने दाखवला आहे. कमी प्रजननदरामुळे वृद्धत्वात अग्रेसर असलेला राज्यगट ओळखा:", "q_english": "In UNFPA State of World Population 2026 India map, share of 60+ population is shaded dark. Identify the state group leading in ageing due to low fertility:", "options": ["केरळ, तमिळनाडू, हिमाचल प्रदेश – सर्वाधिक 60+ वाटा", "केरळ, बिहार, उत्तर प्रदेश – सर्वाधिक 60+ वाटा", "तामिळनाडू, महाराष्ट्र, गुजरात – सर्वाधिक 60+ वाटा", "केरळ, तमिळनाडू, पंजाब – सर्वात कमी 60+ वाटा"], "correct_index": 0, "explanation_marathi": "केरळ, तमिळनाडू, हिमाचल प्रदेशात TFR प्रतिस्थापन पातळीखाली गेल्याने 60+ वाटा 12%+ आहे.", "evidence": "UNFPA State of World Population 2026"}, {"section": 3, "subtopic": "Union Budget 2026-27 highlights", "qtype": "बहु-विधान", "q_marathi": "केंद्रीय अर्थसंकल्प 2026-27 मधील कर प्रस्तावांबाबत खालील विधाने विचारात घ्या — I. नवीन प्राप्तिकर कायदा, 2025 हा 1 एप्रिल 2026 पासून लागू झाला आहे. II. नवीन करप्रणालीत ₹12 लाखांपर्यंतच्या उत्पन्नावर करदायित्व नाही ही सवलत 2026-27 मध्येही कायम ठेवण्यात आली आहे. III. ज्येष्ठ नागरिकांच्या व्याज उत्पन्नावरील TDS मर्यादा 2026-27 मध्ये ₹50,000 वरून ₹1 लाख करण्यात आली आहे. योग्य पर्याय निवडा.", "q_english": "Consider the following statements regarding the tax proposals in the Union Budget 2026-27 — I. The new Income-tax Act, 2025 has come into force from 1 April 2026. II. The nil tax liability on income up to Rs 12 lakh under the new tax regime has been retained in 2026-27. III. In 2026-27, the TDS threshold on interest income for senior citizens was raised from Rs 50,000 to Rs 1 lakh. Choose the correct option.", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III सर्व बरोबर", "फक्त I बरोबर"], "correct_index": 0, "explanation_marathi": "विधान III चूक आहे, कारण ज्येष्ठ नागरिकांसाठी ₹1 लाख TDS मर्यादा ही वाढ 2025-26 च्या अर्थसंकल्पातच झाली होती.", "evidence": "केंद्रीय अर्थसंकल्प भाषण 2026-27"}, {"section": 4, "subtopic": "Bahamani Mahmud Gawan", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "महमूद गावानबाबत दोन संकल्पना एकत्र विचारात घ्या — P: त्याने 1472 मध्ये बिदर येथे मदरसा स्थापला, ज्यात विशाल ग्रंथालय होते व ते तत्कालीन भारतातील प्रमुख विद्याकेंद्र ठरले. Q: त्याने 4 तरफांचे 8 तरफांत विभाजन करून तरफदारांचे अधिकार मर्यादित केले; दक्षनी-अफाकी गटबाजीतील कटामुळे 1481 मध्ये त्याला मृत्युदंड झाला. योग्य पर्याय निवडा.", "q_english": "Consider two concepts together about Mahmud Gawan — P: In 1472 he founded a madrasa at Bidar with a vast library, which became a leading centre of learning in India. Q: He divided the 4 tarafs into 8, curtailing the tarafdars' powers; a conspiracy in the Deccani–Afaqi factional rivalry led to his execution in 1481. Choose the correct option.", "options": ["P सत्य, Q असत्य", "P सत्य, Q सत्य", "P असत्य (मदरसा गुलबर्गा येथे होता), Q सत्य", "P सत्य, Q अंशतः सत्य (मृत्यू 1482 मध्ये झाला)"], "correct_index": 1, "explanation_marathi": "दोन्ही संकल्पना सत्य: बिदर मदरसा (1472) व ग्रंथालय ही वस्तुस्थिती; तरफ-सुधारणा व 1481 मधील मृत्युदंड हीही.", "evidence": "Haroon Khan Sherwani, The Bahmanis of the Deccan (1985)"}, {"section": 4, "subtopic": "Chalukya Aihole inscription", "qtype": "जोड्या लावा", "q_marathi": "ऐहोळे प्रशस्तीबाबत जोड्या लावा — स्तंभ X: 1. रविकीर्ती 2. पुलकेशी II 3. शके 556 (कलि 3735) 4. मेगुटी मंदिर; स्तंभ Y: a. प्रशस्तीचा रचयिता b. प्रशस्तीचा नायक (हर्षवर्धनावर विजय) c. उत्कीर्णनाचे स्थान d. प्रशस्तीची तिथी. योग्य जोडी-संच निवडा.", "q_english": "Match the following regarding the Aihole prashasti — Column X: 1. Ravikirti 2. Pulakeshin II 3. Saka 556 (Kali 3735) 4. Meguti temple; Column Y: a. Composer of the prashasti b. Hero of the prashasti (victory over Harshavardhana) c. Place of engraving d. Date of the prashasti. Choose the correct set of pairs.", "options": ["1-a, 2-b, 3-c, 4-d", "1-a, 2-b, 3-d, 4-c", "1-b, 2-a, 3-d, 4-c", "1-a, 2-c, 3-d, 4-b"], "correct_index": 1, "explanation_marathi": "रविकीर्ती हा दरबारी कवी-रचयिता, पुलकेशी II नायक, शके 556 तिथी, मेगुटी जैन मंदिर (ऐहोळे) हे स्थान.", "evidence": "Aihole Meguti inscription, Saka 556 = 634 CE"}, {"section": 4, "subtopic": "Delhi Sultanate Devgiri", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: (I) 1296 मध्ये कराचा सुभेदार असलेल्या अलाउद्दीन खिलजीने देवगिरीवर छापा टाकून रामचंद्र यादवाकडून प्रचंड खंडणी घेतली. (II) 1308 मध्ये मलिक काफूरने देवगिरीवर ताबा मिळवून यादव सत्तेचा अस्त केला; शंकरदेव-हरपालदेव बंडानंतर थेट सुलतानी अंमल बसला. (III) 1327 मध्ये मुहम्मद बिन तुघलकाने राजधानी दिल्लीहून देवगिरी (दौलताबाद) हलवली, पण प्रशासकीय अडचणींमुळे ती परत न्यावी लागली.", "q_english": "Statements: (I) In 1296, Alauddin Khalji as governor of Kara raided Devgiri and exacted huge tribute from Ramachandra Yadava. (II) In 1308 Malik Kafur captured Devgiri ending Yadava rule; after Shankaradeva-Harapaldeva revolts direct Sultanate rule followed. (III) In 1327 Muhammad bin Tughlaq shifted the capital from Delhi to Devgiri (Daulatabad) but reversed it due to administrative difficulties.", "options": ["I, II आणि III सर्व बरोबर", "फक्त I आणि II बरोबर; III चूक", "फक्त II आणि III बरोबर; I चूक", "फक्त I आणि III बरोबर; II चूक"], "correct_index": 0, "explanation_marathi": "तीन्ही विधाने कालक्रम व घटनांनुसार सत्य आहेत.", "evidence": "Ziauddin Barani, Tarikh-i-Firuz Shahi (c.1357)"}, {"section": 4, "subtopic": "Gupta-Vakataka alliance", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): चंद्रगुप्त द्वितीयाने वाकाटकांशी केलेली वैवाहिक युती ही पश्चिम क्षत्रपांविरुद्ध दक्षिण आघाडी सुरक्षित करण्याचा व्यूह होता. कारण (R): रुद्रसेन द्वितीयच्या मृत्यूनंतर प्रभावती गुप्ताने अल्पवयीन पुत्रांसाठी सुमारे 20 वर्षे प्रतिनिधी-शासन केले; तिच्या पूना ताम्रपटात (13वे वर्ष) गुप्त प्रभाव दिसतो.", "q_english": "Assertion (A): Chandragupta II's matrimonial alliance with the Vakatakas was a strategy to secure the southern front against the Western Kshatrapas. Reason (R): After Rudrasena II's death, Prabhavatigupta ruled as regent for ~20 years for her minor sons; her Poona copper plate (13th year) shows Gupta influence.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "प्रभावती-रुद्रसेन विवाह व प्रतिनिधी-शासनामुळे गुप्तांना दख्खनमध्ये अप्रत्यक्ष दबावगट मिळाला, जे क्षत्रप मोहिमेस पूरक होते.", "evidence": "Poona Copper Plate of Prabhavatigupta, Regnal Year 13 (c.405 CE)"}, {"section": 4, "subtopic": "Indus Valley Maharashtra sites", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): दैमाबाद (अहिल्यानगर, प्रवरा-गोदावरी खोरे) येथे उत्तर-हडप्पा टप्प्यातील कांस्य रथ, बैल, हत्ती यांसारखी शिल्पे मिळाली; तर इनामगाव हे जोर्वे संस्कृतीचे (इ.स.पू. 1400-700) ग्रामीण स्थळ आहे. परिणाम (R): महाराष्ट्रात धोलावीरासारखे परिपक्व हडप्पा नागरी नियोजन नाही; येथील वसाहती ताम्रपाषाण ग्रामीण संक्रमण दर्शवतात. संबंध ओळखा.", "q_english": "Cause (A): Daimabad (Ahilyanagar, Pravara-Godavari basin) yielded Late Harappan bronze chariot and animal figurines; Inamgaon is a Jorwe-culture (c.1400-700 BCE) rural site. Effect (R): Maharashtra lacks Mature Harappan urban planning like Dholavira; its settlements show Chalcolithic rural transition. Identify the cause-effect relation.", "options": ["A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य, R असत्य – महाराष्ट्रात परिपक्व हडप्पा नगररचना आढळते", "A असत्य, R सत्य – दैमाबाद परिपक्व हडप्पा नागरी वसाहत आहे"], "correct_index": 0, "explanation_marathi": "दैमाबाद उत्तर-हडप्पा (इ.स.पू. 1900-1700) व इनामगाव जोर्वे संस्कृतीचे आहे, त्यामुळे R हे A चे तार्किक परिणामी स्पष्टीकरण आहे.", "evidence": "ASI Excavation Reports: S.A. Sali, Daimabad 1976-79; M.K. Dhavalikar, Inamgaon 1968-83"}, {"section": 4, "subtopic": "Maratha navy Khanderi", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: (A) खांदेरी – 1679 – शिवाजी महाराजांनी जंजिरेकर सिद्धी व इंग्रजांना रोखण्यासाठी बांधकाम सुरू केले. (B) उंदेरी – 1680 – सिद्धींनी खांदेरीला शह देण्यासाठी बांधला. (C) खांदेरी संघर्ष 1679-80 – इंग्रज-सिद्धी नाकेबंदी फोडून मराठ्यांनी बेटावर रसद पोहोचवली. योग्य जोड्या ओळखा.", "q_english": "Table: (A) Khanderi – 1679 – Shivaji Maharaj began the fort to check Janjira Siddis and the English. (B) Underi – 1680 – built by Siddis to counter Khanderi. (C) Khanderi conflict 1679-80 – Marathas broke the English-Siddi blockade and supplied the island. Identify the correct pairs.", "options": ["फक्त A बरोबर", "A आणि B बरोबर, C चूक", "A, B आणि C सर्व बरोबर", "B आणि C बरोबर, A चूक"], "correct_index": 2, "explanation_marathi": "तिन्ही नोंदी वर्ष व कर्त्यांसह सत्य; खांदेरी-उंदेरी द्वंद्व व 1679-80 मधील मराठा यश सिद्ध होते.", "evidence": "Jadunath Sarkar, Shivaji and His Times (1920)"}, {"section": 4, "subtopic": "Maurya Sopara port", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना (I): सोपारा (नालासोपारा, पालघर) मौर्य काळातील पश्चिम किनाऱ्यावरील प्रमुख बंदर होते; येथे अशोक शिलालेखाचे तुकडे व स्तूप अवशेष मिळाले. संकल्पना (II): टॉलेमीने 'सौपारा' व्यापारी केंद्र म्हणून नोंदवले; पेरिप्लसनुसार ते लाल समुद्र-इजिप्त सागरी जाळ्याशी जोडले होते. योग्य पर्याय निवडा.", "q_english": "Concept (I): Sopara (Nalasopara, Palghar) was a major western port in Mauryan times; Ashokan edict fragments and stupa relics were found here. Concept (II): Ptolemy recorded 'Soupara' as a trade centre; per Periplus it linked to the Red Sea-Egypt maritime network. Choose the correct option.", "options": ["I व II दोन्ही सत्य; एकत्रितपणे सोपाऱ्याचे मौर्य ते सातवाहन व्यापारी सातत्य सिद्ध होते", "I व II दोन्ही सत्य; पण दोन्हींचा परस्परसंबंध नाही", "I सत्य, II असत्य; टॉलेमीने सोपाऱ्याचा उल्लेख केलेला नाही", "I असत्य, II सत्य; सोपारा येथे अशोककालीन अवशेष नाहीत"], "correct_index": 0, "explanation_marathi": "सोपारा शिलालेख (1882) व टॉलेमीची Geographia दोन्ही पुराव्यांमुळे I-II सत्य व परस्परपूरक आहेत.", "evidence": "Bhagwanlal Indraji, Sopara Ashokan Edict Report (1882)"}, {"section": 4, "subtopic": "Peshwa Bajirao I campaigns", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): बाजीराव प्रथमाने फेब्रुवारी 1728 मध्ये पालखेडच्या लढाईत निजाम-उल-मुल्कचा पराभव केला. कारण (R): मार्च 1728 च्या मुंगी-शिवगाव तहान्वये निजामाने शाहू महाराजांना छत्रपती म्हणून मान्यता दिली व मराठ्यांचा दख्खनवरील चौथ-सरदेशमुखीचा हक्क कबूल केला.", "q_english": "Assertion (A): Bajirao I defeated Nizam-ul-Mulk at the Battle of Palkhed in February 1728. Reason (R): By the Treaty of Mungi-Shevgaon (March 1728), the Nizam recognised Shahu as Chhatrapati and conceded the Maratha right to chauth-sardeshmukhi of the Deccan.", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे, परंतु R असत्य आहे", "A असत्य आहे, परंतु R सत्य आहे"], "correct_index": 0, "explanation_marathi": "A आणि R दोन्ही सत्य: पालखेडच्या विजयानंतरच निजाम तहास भाग पाडला गेला, त्यामुळे R हे A चे थेट परिणाम व योग्य स्पष्टीकरण आहे.", "evidence": "Grant Duff, History of the Mahrattas (1826); मुंगी-शिवगाव तह, मार्च 1728"}, {"section": 4, "subtopic": "Phule Satyashodhak 1873", "qtype": "कारण-परिणाम", "q_marathi": "सत्यशोधक समाज (1873) संदर्भात योग्य कारण-परिणाम जोडी निवडा — जिथे परिणाम हा कारणाचा तार्किक व कालक्रमानुसार योग्य परिपाक असेल.", "q_english": "Choose the correct cause-effect pair regarding the Satyashodhak Samaj (1873) — where the effect is the logical and chronologically correct outcome of the cause.", "options": ["कारण: 24 सप्टेंबर 1873 रोजी पुणे येथे सत्यशोधक समाज स्थापन झाला; सर्व जाती-धर्मांना सभासदत्व खुले. परिणाम: पुरोहितांशिवाय विवाह, जातिभेद निषेध व बहुजन शिक्षणाचा चळवळीमार्फत प्रसार झाला.", "कारण: फुलेंनी 1875 मध्ये 'सार्वजनिक सत्यधर्म' ग्रंथ लिहिला. परिणाम: 1873 मध्ये सत्यशोधक समाजाची स्थापना झाली.", "कारण: सत्यशोधक समाजाने वेदप्रामाण्य व जातिभेद स्वीकारला. परिणाम: सनातनी वर्गाने चळवळीचे स्वागत केले.", "कारण: फुलेंनी 1881 मध्ये 'शेतकऱ्यांचा आसूड' लिहिला. परिणाम: 1873 मध्ये सत्यशोधक समाज स्थापन झाला."], "correct_index": 0, "explanation_marathi": "पहिली जोडी योग्य: 1873 च्या स्थापनेनंतरच सत्यशोधकी विवाह व शिक्षणप्रसार हे परिणाम घडले.", "evidence": "Jotirao Phule records; सत्यशोधक समाज स्थापना 24-9-1873"}, {"section": 4, "subtopic": "Quit India 1942 Maharashtra", "qtype": "बहु-विधान", "q_marathi": "1942 च्या चले जाव चळवळीतील महाराष्ट्रासंदर्भातील विधाने पहा: (I) 16 ऑगस्ट 1942 रोजी चिमूर येथील पोलिस गोळीबारात अनेक आंदोलक ठार; आष्टीतील आंदोलनही दडपले. (II) 9 ऑगस्ट 1942 रोजी पहाटे काँग्रेस नेत्यांना अटक झाल्याने चळवळ भूमिगत झाली. (III) 1942 मध्ये उषा मेहतांनी मुंबईतून गुप्त काँग्रेस रेडिओ चालवला. (IV) चिमूर-आष्टी गोळीबार 1943 मध्ये झाला व शेतकरी अलिप्त राहिले.", "q_english": "Consider the statements on Maharashtra in the 1942 Quit India Movement: (I) Police firing at Chimur on 16 Aug 1942 killed many protesters; the Ashti agitation was also crushed. (II) After Congress leaders' arrest on the morning of 9 Aug 1942, the movement went underground. (III) Usha Mehta ran the secret Congress Radio from Bombay in 1942. (IV) The Chimur-Ashti firing occurred in 1943 with no peasant participation.", "options": ["फक्त I, II आणि III बरोबर", "फक्त I, III आणि IV बरोबर", "फक्त II, III आणि IV बरोबर", "फक्त I, II आणि IV बरोबर"], "correct_index": 0, "explanation_marathi": "I, II, III सत्य: चिमूर गोळीबार 16-8-1942, नेत्यांना 9-8-1942 रोजी अटक, उषा मेहतांचा गुप्त रेडिओ 1942.", "evidence": "Maharashtra State Gazetteer, Chandrapur District; Quit India Movement official records (1942)"}, {"section": 4, "subtopic": "Satvahana trade routes", "qtype": "बहु-विधान", "q_marathi": "सातवाहनकालीन व्यापारी मार्गांबाबत खालील विधाने विचारात घ्या: I. नाणेघाट खिंडीतून जुन्नर (जिर्णनगर) ते कोकण किनारपट्टी व्यापारी मार्ग जात असे; नागनिकेच्या नाणेघाट शिलालेखात मार्ग व देणग्यांचा उल्लेख आहे. II. भरुकच्छ (भडोच) हे सातवाहनांच्या थेट व कायम नियंत्रणाखालील बंदर होते. III. तगर (टेर) हे दख्खनमधील अंतर्गत बाजारकेंद्र होते; पेरिप्लसनुसार तेथून माल बैलगाड्यांतून भरुकच्छाकडे रवाना होत असे. सत्य विधाने कोणती?", "q_english": "Consider the following statements about Satavahana-era trade routes: I. The Naneghat pass carried the Junnar (Jirnanagara) to Konkan coast trade route; Naganika's Naneghat inscription mentions the route and donations. II. Bharukachchha (Bharoch) was a port under direct and permanent Satavahana control. III. Tagara (Ter) was an inland market centre of the Deccan; according to the Periplus, goods were sent from there in wagons to Bharukachchha. Which statements are true?", "options": ["केवळ I", "I व III", "II व III", "I, II व III"], "correct_index": 1, "explanation_marathi": "बरोबर उत्तर I व III: नाणेघाट-जुन्नर-सोपारा मार्ग व पेरिप्लस (परिच्छेद 51) मधील तगर उल्लेख सत्य आहेत. II चूक: भरुकच्छ पश्चिम क्षत्रपांच्या ताब्यात होते.", "evidence": "Periplus of the Erythraean Sea, §49–51 (1st century CE); Naneghat inscription"}, {"section": 4, "subtopic": "Shivaji coronation 1674", "qtype": "जोड्या लावा", "q_marathi": "शिवाजी महाराजांच्या 1674 च्या राज्याभिषेकासंदर्भात योग्य जोड्या लावा: (a) गागाभट्ट (b) निश्चलपुरी गोसावी (c) हेन्री ऑक्झेंडन (d) पहिला राज्याभिषेक तिथी — (i) काशीचे पंडित; वेदोक्त विधीने राज्याभिषेक (ii) तांत्रिक पद्धतीने दुसरा राज्याभिषेक (24 सप्टेंबर 1674) (iii) इंग्रज ईस्ट इंडिया कंपनीचा वकील; रायगडावर उपस्थित (iv) 6 जून 1674 (ज्येष्ठ शुद्ध त्रयोदशी)", "q_english": "Match the pairs regarding Shivaji Maharaj's 1674 coronation: (a) Gagabhatt (b) Nischalpuri Gosavi (c) Henry Oxenden (d) date of first coronation — (i) Pandit from Kashi; Vedic coronation ritual (ii) second coronation by Tantric method (24 Sept 1674) (iii) English East India Company envoy present at Raigad (iv) 6 June 1674.", "options": ["a-i, b-ii, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iv, d-iii"], "correct_index": 0, "explanation_marathi": "पर्याय 1 योग्य: गागाभट्टांनी 6 जून 1674 रोजी वेदोक्त राज्याभिषेक केला; त्यानंतर निश्चलपुरींनी 24 सप्टेंबर 1674 रोजी तांत्रिक राज्याभिषेक केला.", "evidence": "Sabhasad Bakhar; Maharashtra State Gazetteer, Raigad District (1962)"}, {"section": 4, "subtopic": "Third Anglo-Maratha war 1818", "qtype": "कालक्रम लावा", "q_marathi": "तिसऱ्या इंग्रज-मराठा युद्धातील (1817-18) लढायांचा योग्य कालक्रम लावा: (a) खडकीची लढाई (b) सीताबर्डीची लढाई (c) कोरेगाव-भीमाची लढाई (d) अष्टीची लढाई", "q_english": "Arrange the battles of the Third Anglo-Maratha War (1817-18) in correct chronological order: (a) Battle of Khadki (b) Battle of Sitabuldi (c) Battle of Koregaon-Bhima (d) Battle of Ashti.", "options": ["a → b → c → d", "a → c → b → d", "b → a → c → d", "a → b → d → c"], "correct_index": 0, "explanation_marathi": "योग्य क्रम: खडकी (5 नोव्हेंबर 1817) → सीताबर्डी (26 नोव्हेंबर 1817) → कोरेगाव-भीमा (1 जानेवारी 1818) → अष्टी (20 फेब्रुवारी 1818).", "evidence": "Grant Duff, History of the Mahrattas (1826)"}, {"section": 4, "subtopic": "Vakataka Pravarasena II", "qtype": "कालक्रम लावा", "q_marathi": "वाकाटक प्रवरसेन II शी संबंधित घटनांचा योग्य कालक्रम निवडा: A. रुद्रसेन II व गुप्त राजकन्या प्रभावतीगुप्ता यांचा विवाह; B. प्रवरसेन II ची चमक ताम्रपटे (18वे राज्यवर्ष); C. प्रवरपुराची स्थापना (राजधानी); D. सेतुबंध (रावणवहो) महाकाव्याची निर्मिती (प्रवरसेन II ला श्रेय).", "q_english": "Choose the correct chronological order of events related to the Vakataka king Pravarasena II: A. Marriage of Rudrasena II and the Gupta princess Prabhavatigupta; B. Chamak copper plates of Pravarasena II (18th regnal year); C. Foundation of Pravarapura (capital); D. Composition of the Setubandha (Ravanavaho) epic (attributed to Pravarasena II).", "options": ["A-C-B-D", "A-C-D-B", "C-A-D-B", "A-D-C-B"], "correct_index": 1, "explanation_marathi": "A (प्रवरसेन II च्या आई-वडिलांची पिढी) → C (राज्यारंभी स्वनामांकित राजधानी) → D (राज्यकाळातील काव्यनिर्मिती) → B (18व्या वर्षीची ताम्रपटे) हा क्रम बरोबर.", "evidence": "Chamak copper plates of Pravarasena II, regnal year 18"}, {"section": 4, "subtopic": "Yadava Hemadpanti architecture", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): हेमाडपंथी मंदिरे चुनखडी किंवा गारा न वापरता, दगड एकमेकांत अडकवण्याच्या (dry masonry) पद्धतीने बांधलेली आहेत. कारण (R): हेमाड्री हा यादव नरेश रामचंद्राचा प्रधान होता आणि त्याने 'चतुर्वर्गचिंतामणी' हा ग्रंथ लिहिला. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Hemadpanti temples are built by the dry-masonry technique of interlocking stones, without lime or mortar. Reason (R): Hemadri was the prime minister of the Yadava king Ramachandra and authored the 'Chaturvarga Chintamani'. Choose the correct option.", "options": ["A व R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A सत्य (विना-गारा दगडी बांधकाम हे हेमाडपंथी शैलीचे वैशिष्ट्य) व R सत्य (हेमाड्री-रामचंद्र-चतुर्वर्गचिंतामणी), पण मंत्रिपद/ग्रंथलेखन हे वास्तुतंत्राचे स्पष्टीकरण नाही.", "evidence": "M.S. Mate, studies on Hemadpanti dry-masonry temples"}, {"section": 5, "subtopic": "Bhatsa dam Mumbai water", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (मुंबई पाणीपुरवठा स्रोत – संबंधित नदी/खोरे):\na. भातसा  1. भातसा नदी (शहापूर, ठाणे)\nb. तानसा  2. तानसा नदी\nc. मोडक सागर  3. वैतरणा नदी (लोअर वैतरणा)\nd. तुळशी  4. तुळशी प्रवाह (संजय गांधी राष्ट्रीय उद्यान)\nयोग्य जोडी-क्रम निवडा:", "q_english": "Match (Mumbai water source – river/basin): a. Bhatsa – 1. Bhatsa river, b. Tansa – 2. Tansa river, c. Modak Sagar – 3. Vaitarna river (Lower Vaitarna), d. Tulshi – 4. Tulshi stream (SGNP). Choose correct sequence:", "options": ["a-1, b-2, c-3, d-4", "a-1, b-3, c-2, d-4", "a-2, b-1, c-3, d-4", "a-1, b-2, c-4, d-3"], "correct_index": 0, "explanation_marathi": "भातसा-भातसा नदी, तानसा-तानसा नदी, मोडक सागर-वैतरणा (लोअर), तुळशी-SGNP प्रवाह ही BMC प्रमाण जोडी आहे.", "evidence": "BMC Water Supply Department – Mumbai Water Sources Report, 2024"}, {"section": 5, "subtopic": "Deccan trap basalt", "qtype": "कालक्रम लावा", "q_marathi": "दख्खन ट्रॅप बेसाल्टपासून काळी मृदा तयार होण्याच्या प्रक्रियेचा योग्य कालक्रम लावा:\na. भ्रंशी उद्रेकातून लाव्हा प्रवाह व थरांची रचना\nb. थंडीकरणातून स्तंभाकार संधी व पायऱ्यांसारखा भूरूप\nc. बेसाल्ट अपक्षयातून मॉन्टमोरिलोनाइट खनिज निर्मिती\nd. रेगूर (काळी) मृदेची जडणघडण\nयोग्य क्रम निवडा:", "q_english": "Arrange the process from Deccan Trap basalt to black soil in chronological order: a. Fissure eruption lava flows, b. Cooling into columnar joints/step topography, c. Weathering to montmorillonite, d. Regur soil formation. Choose correct sequence:", "options": ["a-b-c-d", "a-c-b-d", "b-a-c-d", "a-b-d-c"], "correct_index": 0, "explanation_marathi": "योग्य क्रम: उद्रेक→थर (a), थंडीकरण→स्तंभाकार संधी/पायऱ्या (b), अपक्षय→मॉन्टमोरिलोनाइट (c), नंतर रेगूर मृदा (d).", "evidence": "Geological Survey of India – Deccan Trap Memoir"}, {"section": 5, "subtopic": "Godavari basin Maharashtra", "qtype": "तक्ता आधारित", "q_marathi": "गोदावरीच्या उपनद्यांचा तक्ता पहा — (प) प्रवरा : उजवी उपनदी, उगम अकोळे (अ.नगर); (म) मांजरा : उजवी उपनदी, उगम बीड; (पै) पैनगंगा : डावी उपनदी, उगम अजिंठा डोंगररांग (बुलढाणा); (व) वर्धा : डावी उपनदी, उगम मोर्श (अमरावती). या तक्त्यावरून कोणता निष्कर्ष पूर्णपणे बरोबर आहे?", "q_english": "Consider the table of Godavari's tributaries — (P) Pravara: right-bank tributary, origin Akole (A. Nagar); (M) Manjra: right-bank tributary, origin Beed; (Pa) Penganga: left-bank tributary, origin Ajanta range (Buldhana); (W) Wardha: left-bank tributary, origin Morshi (Amravati). Which conclusion from this table is fully correct?", "options": ["चारही नोंदी बरोबर; प्रवरा व मांजरा उजव्या तर पैनगंगा व वर्धा डाव्या उपनद्या आहेत", "प्रवरा व पैनगंगा डाव्या तर मांजरा व वर्धा उजव्या; उगमस्थाने मात्र बरोबर", "मांजरा डावी उपनदी असून बीड उगम चुकीचा; इतर तीन नोंदी बरोबर", "वर्धा उजवी उपनदी असून मोर्श उगम चुकीचा; इतर तीन नोंदी बरोबर"], "correct_index": 0, "explanation_marathi": "प्रवरा (अकोळे–नेवासे) व मांजरा (बीड–तेलंगण सीमा) दक्षिणेकडून मिळतात म्हणून उजव्या; पैनगंगा (अजिंठा) व वर्धा (मोर्श) उत्तरेकडून म्हणून डाव्या.", "evidence": "Central Water Commission – Godavari Basin Report (2022)"}, {"section": 5, "subtopic": "Jayakwadi dam Godavari", "qtype": "बहु-विधान", "q_marathi": "जायकवाडी धरणाबाबत खालील विधाने विचारात घ्या:\nI. हे गोदावरी नदीवर छ. संभाजीनगर जिल्ह्यातील पैठण येथील मातीचे धरण असून जलाशयास नाथसागर म्हणतात.\nII. हे प्रामुख्याने मराठवाड्याला सिंचन, पिण्याचे व औद्योगिक पाणी पुरवते; डाव्या/उजव्या कालव्यांतून जालना-परभणीपर्यंत लाभ मिळतो.\nIII. हे तापी खोऱ्यात असून कोकणाला सिंचन पुरवते.\nयोग्य पर्याय निवडा:", "q_english": "Consider statements on Jayakwadi dam: I. Earthen dam on Godavari at Paithan, Chh. Sambhajinagar, reservoir Nath Sagar. II. Mainly serves Marathwada irrigation/drinking/industrial water via left/right canals to Jalna-Parbhani. III. Lies in Tapi basin and irrigates Konkan. Choose correct option:", "options": ["फक्त I बरोबर", "I आणि II बरोबर", "II आणि III बरोबर", "I, II आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "I व II सत्य: जायकवाडी-पैठण (नाथसागर) हे गोदावरीवरील माती धरण मराठवाड्याच्या सिंचन/पिण्याच्या पाण्याचा मुख्य आधार आहे.", "evidence": "Maharashtra Water Resources Department – Jayakwadi Stage-I Project Report, 2023"}, {"section": 5, "subtopic": "Kaas plateau flowers", "qtype": "बहु-विधान", "q_marathi": "विधाने तपासा: (I) कास पठार हे सातारा जिल्ह्यातील जांभा (लॅटेराइट) खडकाचे पठार आहे. (II) 2012 मध्ये पश्चिम घाट मालिकेचा भाग म्हणून युनेस्को जागतिक नैसर्गिक वारसा स्थळ झाले. (III) येथे ऑगस्ट-सप्टेंबरमध्ये फुलोरा होतो; फ्लेमिंगो येथे प्रजनन करतात. योग्य पर्याय निवडा.", "q_english": "Examine statements: (I) Kaas is a lateritic (jambha) plateau in Satara district. (II) In 2012 it became UNESCO World Natural Heritage as part of Western Ghats series. (III) Flowering occurs in Aug-Sep; flamingos breed here. Choose correct option.", "options": ["I आणि II बरोबर, III चूक", "I आणि III बरोबर, II चूक", "II आणि III बरोबर, I चूक", "I, II आणि III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I (जांभा पठार) व II (युनेस्को 2012 पश्चिम घाट) सत्य; III मधील फुलोरा काळ सत्य पण फ्लेमिंगो प्रजनन असत्य.", "evidence": "UNESCO WHC 2012 Western Ghats inscription; Botanical Survey of India Kaas report 2019"}, {"section": 5, "subtopic": "Konkan laterite plateau", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): कोकणातील जांभा (लॅटराइट) 'सडे' पठारे सपाट माथ्याची, कमी सुपीक असूनही काजू-आंबा बागायतीसाठी वापरली जातात.\nकारण (R): अतिवृष्टीमुळे बेसाल्टमधील सिलिका-अल्कलींचे निक्षालन होऊन लोह-अ‍ॅल्युमिनियम ऑक्साइड शिल्लक राहतात, त्यातून जांभा खडक तयार होतो.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): Konkan laterite 'sada' plateaus are flat-topped, less fertile yet used for cashew-mango orchards. Reason (R): Heavy rainfall leaches silica-alkalis from basalt leaving iron-aluminium oxides, forming laterite. Choose correct option:", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य: सडे सपाट, निक्षालित तरी काजू-आंब्यास योग्य. R सत्य व योग्य स्पष्टीकरण: अतिवृष्टीतील निक्षालनातूनच Fe/Al ऑक्साइडचा लॅटराइट तयार होतो.", "evidence": "Geological Survey of India – District Resource Map Ratnagiri/Sindhudurg, 2021"}, {"section": 5, "subtopic": "Krishna-Bhima confluence", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A) : भीमा ही कृष्णेची सर्वात लांब उपनदी असून ती नरसोबावाडी (शिरोळ, कोल्हापूर) येथे कृष्णेस मिळते. कारण (R) : भीमेचे खोरे मुख्यत्वे पावसाच्या छायेच्या प्रदेशात (पुणे–अ.नगर–सोलापूर) पसरलेले असल्याने तिचा प्रवाह प्रामुख्याने हंगामी राहतो. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Bhima is the longest tributary of the Krishna and joins it at Narsobawadi (Shirol, Kolhapur). Reason (R): Bhima's basin lies mostly in the rain-shadow region (Pune–A. Nagar–Solapur), so its flow is mainly seasonal. Choose the correct option.", "options": ["A व R दोन्ही बरोबर असून R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही बरोबर आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक आहे", "A चूक, R बरोबर आहे"], "correct_index": 1, "explanation_marathi": "भीमा (~861 किमी) सर्वात लांब व संगम नरसोबावाडी सत्य; छायाप्रदेशामुळे हंगामी प्रवाहही सत्य. परंतु R मुळे A मधील लांबी व संगमस्थान स्पष्ट होत नाही.", "evidence": "Central Water Commission – Krishna Basin Report (2021)"}, {"section": 5, "subtopic": "Lonar crater lake", "qtype": "कारण-परिणाम", "q_marathi": "कारण: लोणार विवर सुमारे 35-50 हजार वर्षांपूर्वी दख्खन ट्रॅप बेसाल्टमधील अतिवेगी उल्कापाताने निर्माण झाले. या कारणाचा योग्य परिणाम ओळखा.", "q_english": "Cause: Lonar crater formed ~35,000-50,000 years ago by hypervelocity impact in Deccan Trap basalt. Identify its correct effect.", "options": ["बंद खोरे + बेसाल्ट अपक्षयामुळे पाणी खारट-अल्कधर्मी (pH~10); नोव्हेंबर 2020 मध्ये रामसर स्थळ दर्जा.", "बंद खोरे + बेसाल्ट अपक्षयामुळे पाणी खारट-अल्कधर्मी (pH~10); नोव्हेंबर 2019 मध्ये रामसर स्थळ दर्जा.", "खुले खोरे + ग्रॅनाइट अपक्षयामुळे पाणी गोड-तटस्थ (pH~7); नोव्हेंबर 2020 मध्ये रामसर स्थळ दर्जा.", "बंद खोरे + बेसाल्ट अपक्षयामुळे पाणी आम्लधर्मी (pH~5.5); ऑक्टोबर 2022 मध्ये रामसर स्थळ दर्जा."], "correct_index": 0, "explanation_marathi": "बेसाल्टमधील एकमेव अतिवेगी विवर असल्याने बाष्पीभवन व निःसारण अभावी pH~10 खारट-अल्कधर्मी झाले; रामसर दर्जा नोव्हेंबर 2020.", "evidence": "Geological Survey of India 2021; Ramsar Sites Information Service - Lonar Lake listed 13 Nov 2020"}, {"section": 5, "subtopic": "Marathwada drought zone", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा — मराठवाड्यातील जिल्हा व मुख्य नदी खोरे : (1) बीड (2) हिंगोली (3) परभणी (4) नांदेड; (i) पैनगंगा खोरे (ii) पूर्णा–दुधना खोरे (iii) गोदावरी–मांजरा संगमक्षेत्र (iv) मांजरा–सिंदफणा खोरे. योग्य संयोजन निवडा.", "q_english": "Match — Marathwada district with main river basin: (1) Beed (2) Hingoli (3) Parbhani (4) Nanded; (i) Penganga basin (ii) Purna–Dudhna basin (iii) Godavari–Manjra confluence zone (iv) Manjra–Sindphana basin. Choose the correct combination.", "options": ["1-iv, 2-i, 3-ii, 4-iii", "1-ii, 2-iii, 3-iv, 4-i", "1-iv, 2-ii, 3-i, 4-iii", "1-i, 2-iv, 3-ii, 4-iii"], "correct_index": 0, "explanation_marathi": "बीड मांजरा–सिंदफणावर, हिंगोली पैनगंगेत, परभणी पूर्णा–दुधनेत, नांदेड गोदावरी–मांजरा संगमक्षेत्रात.", "evidence": "India-WRIS, Govt. of India – Godavari Basin; Maharashtra Water Resources Dept. (2024)"}, {"section": 5, "subtopic": "Melghat biosphere", "qtype": "कालक्रम लावा", "q_marathi": "मेळघाट परिसरातील अधिसूचनांचा योग्य कालक्रम लावा: (A) मेळघाट वन्यजीव अभयारण्य (1967), (B) मेळघाट व्याघ्र प्रकल्प-प्रोजेक्ट टायगर (1973-74), (C) गुगामल राष्ट्रीय उद्यान (1975), (D) अंबाबर्वा वन्यजीव अभयारण्य (1985). योग्य क्रम निवडा.", "q_english": "Arrange in chronological order: (A) Melghat Wildlife Sanctuary (1967), (B) Melghat Tiger Reserve under Project Tiger (1973-74), (C) Gugamal National Park (1975), (D) Ambabarva Wildlife Sanctuary (1985). Choose correct sequence.", "options": ["A-B-C-D", "A-B-D-C", "B-A-C-D", "A-C-B-D"], "correct_index": 0, "explanation_marathi": "1967 मध्ये अभयारण्य, नंतर 1973-74 मध्ये पहिल्या नऊ TR पैकी मेळघाट, मग 1975 मध्ये गुगामल NP, शेवटी 1985 मध्ये बफर विस्तार (अंबाबर्वा).", "evidence": "Maharashtra Forest Dept notifications; WII Melghat TR profile 2023"}, {"section": 5, "subtopic": "Mumbai-Pune Expressway ghats", "qtype": "नकाशा आधारित", "q_marathi": "महाराष्ट्राच्या नकाशात मुंबई-पुणे द्रुतगती महामार्ग ज्या सह्याद्री घाटातून जातो तो ● ने दाखवला आहे; खंडाळा-लोणावळा बोगदा-पूल प्रणाली याच घाटात आहे. हा घाट ओळखा:", "q_english": "On a Maharashtra map, the Sahyadri ghat crossed by the Mumbai-Pune Expressway is marked ●; the Khandala-Lonavala tunnel-bridge system lies in the same ghat. Identify the ghat:", "options": ["थळ घाट", "बोर घाट", "ताम्हिणी घाट", "कुंभार्ली घाट"], "correct_index": 1, "explanation_marathi": "द्रुतगती महामार्ग खंडाळा-लोणावळा येथील बोर घाटातून जातो (बोगदा-पूल प्रणाली).", "evidence": "MSRDC – Mumbai-Pune Expressway Project Report, 2022"}, {"section": 5, "subtopic": "Sahyadri passes Bhor", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र करा — (X) भोर घाट (खंडाळा) : खोपोली–खंडाळा दरम्यान, मुंबई–पुणे रेल्वे व NH-48 मार्गावरील घाट; (Y) वरंधा घाट : भोर (पुणे)–महाड (रायगड) दरम्यान, पुणे–कोकण जोडणारा अरुंद घाट. या दोन्हींवरून योग्य समन्वित निष्कर्ष कोणता?", "q_english": "Combine two concepts — (X) Bhor ghat (Khandala): between Khopoli–Khandala on the Mumbai–Pune railway and NH-48; (Y) Varandha ghat: between Bhor (Pune)–Mahad (Raigad), a narrow pass linking Pune to Konkan. Which combined conclusion is correct?", "options": ["X मुंबई–पुणे महानगरीय अक्षावरील तर Y भोर–महाडद्वारे पुणे–कोकण जोडणारा; दोन्ही पुणे जिल्ह्यातील सह्याद्री ओलांडणारे घाट आहेत", "Y मुंबई–पुणे रेल्वेमार्गावरील असून X महाडमार्गे कोकणात उतरतो", "दोन्ही थळ घाटाच्या पठारीय भागात असून कसारा–इगतपुरी पट्ट्यात येतात", "X थळ घाटाच्या उत्तरेस व Y सह्याद्रीच्या पूर्वेस असून दोन्ही मराठवाड्यास जोडतात"], "correct_index": 0, "explanation_marathi": "भोर घाट खरोखर मुंबई–पुणे (NH-48/रेल्वे) आणि वरंधा भोर–महाड (पुणे–रायगड) जोडतो — दोघेही सह्याद्री पार करतात.", "evidence": "Maharashtra State Gazetteer – Pune/Raigad (घाटमार्ग)"}, {"section": 5, "subtopic": "Tadoba tiger reserve", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): ताडोबा राष्ट्रीय उद्यान 1955 मध्ये स्थापन झाले असले तरी ताडोबा-अंधारी व्याघ्र प्रकल्प म्हणून अधिसूचना 1993 मध्येच झाली. कारण (R): व्याघ्र प्रकल्प दर्जासाठी कोअर-बफर अधिसूचना व प्रोजेक्ट टायगरमध्ये समावेश आवश्यक असतो; केवळ राष्ट्रीय उद्यानाचा दर्जा पुरेसा नाही.", "q_english": "Assertion (A): Though Tadoba National Park was established in 1955, it was notified as Tadoba-Andhari Tiger Reserve only in 1993. Reason (R): Tiger Reserve status requires core-buffer notification and inclusion in Project Tiger; National Park status alone is insufficient.", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य आहेत परंतु R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य आहे परंतु R असत्य आहे.", "A असत्य आहे परंतु R सत्य आहे."], "correct_index": 0, "explanation_marathi": "ताडोबा 1955 चे NP हे राज्यातील सर्वांत जुने असले तरी TR अधिसूचना 1993 ची आहे; TR साठी NTCA कोअर-बफर व प्रोजेक्ट टायगर समावेश लागतो म्हणून R हे A चे योग्य स्पष्टीकरण आहे.", "evidence": "NTCA Tiger Reserve list 2024; Maharashtra Forest Dept Tadoba-Andhari TR notification 1993"}, {"section": 5, "subtopic": "Tapi-Purna plain", "qtype": "बहु-विधान", "q_marathi": "तापी-पूर्णा मैदानाबाबत विधाने पहा : (I) हे मैदान जळगाव–अमरावती–अकोला–बुलढाणा जिल्ह्यांत पसरलेले काळ्या रेगूर मृदेचे सुपीक गाळ मैदान आहे. (II) पूर्णा नदी भैंसदेही (बैतूल, म.प्र.) येथे उगमून चांगदेव (जळगाव) येथे तापीस मिळते. (III) या मैदानात वालुकामय–खडकाळ मृदा प्रधान असल्याने कापूस व केळी पिके घेतली जात नाहीत. योग्य पर्याय निवडा.", "q_english": "Statements on the Tapi-Purna plain: (I) It is a fertile alluvial plain of black regur soil spread across Jalgaon–Amravati–Akola–Buldhana. (II) The Purna rises at Bhainsdehi (Betul, M.P.) and joins the Tapi at Changdev (Jalgaon). (III) Sandy–rocky soil dominates here, so cotton and banana are not grown. Choose the correct option.", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III तिन्ही बरोबर", "फक्त III बरोबर"], "correct_index": 0, "explanation_marathi": "I व II सत्य — रेगूर मृदेचा कापूस/केळी पट्टा आणि पूर्णेचा उगम भैंसदेही–संगम चांगदेव.", "evidence": "Maharashtra Economic Survey 2024-25; District Gazetteers – Amravati/Jalgaon"}, {"section": 5, "subtopic": "Thane creek flamingo", "qtype": "नकाशा आधारित", "q_marathi": "नकाशानुसार ठाणे खाडीचे स्थान ओळखा: उल्हास नदी मुखाजवळील मुंबई-ठाणे दरम्यानची खाडी; अभयारण्य अधिसूचना व रामसर वर्षासह योग्य विधान निवडा.", "q_english": "Based on Maharashtra map, identify correct statement about Thane Creek Flamingo Sanctuary: location near Ulhas river mouth between Mumbai-Thane, with notification and Ramsar years.", "options": ["उल्हास मुखाजवळ ठाणे-मुंबई दरम्यान; अभयारण्य 2015, रामसर ऑक्टोबर 2022; लेसर-ग्रेटर फ्लेमिंगो कच्छच्या रणातून स्थलांतर.", "उल्हास मुखाजवळ ठाणे-मुंबई दरम्यान; अभयारण्य 2015, रामसर नोव्हेंबर 2020; लेसर-ग्रेटर फ्लेमिंगो कच्छच्या रणातून स्थलांतर.", "गोदावरी मुखाजवळ नाशिकजवळ; अभयारण्य 2015, रामसर ऑक्टोबर 2022; लेसर-ग्रेटर फ्लेमिंगो कच्छच्या रणातून स्थलांतर.", "उल्हास मुखाजवळ ठाणे-मुंबई दरम्यान; अभयारण्य 2018, रामसर ऑक्टोबर 2022; सायबेरियन क्रेनचे प्रजनन क्षेत्र."], "correct_index": 0, "explanation_marathi": "ठाणे खाडी उल्हास मुखाशी, 2015 अभयारण्य, 2022 रामसर; फ्लेमिंगो स्थलांतर कच्छहून.", "evidence": "Maharashtra Forest Dept notification 2015; Ramsar SIS Thane Creek 12 Oct 2022"}, {"section": 6, "subtopic": "Article 21 privacy Puttaswamy", "qtype": "बहु-विधान", "q_marathi": "खालील विधाने विचारात घ्या: I. के.एस. पुट्टस्वामी (2017) मध्ये 9 न्यायाधीशांच्या खंडपीठाने गोपनीयतेचा हक्क कलम 21 अंतर्गत मूलभूत हक्क ठरवला. II. निर्बंधांसाठी (i) कायद्याची मान्यता, (ii) वैध राज्य हेतू, (iii) प्रमाणबद्धता ही त्रिसूत्री कसोटी विहित केली. III. M.P. शर्मा (1954) व खरक सिंग (1962) यांतील विरुद्ध भूमिका या निर्णयाने रद्दबातल ठरवली. योग्य पर्याय निवडा:", "q_english": "Consider the statements: I. In K.S. Puttaswamy (2017) a 9-judge bench held the right to privacy a fundamental right under Article 21. II. It prescribed the triple test of (i) legality, (ii) legitimate state aim, (iii) proportionality for restrictions. III. It overruled the contrary view in M.P. Sharma (1954) and Kharak Singh (1962). Choose the correct option:", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III सर्व बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "तिन्ही बरोबर: पुट्टस्वामीने गोपनीयतेला कलम 21 चा अविभाज्य भाग मानले व त्रिसूत्री कसोटी दिली; M.P. शर्मा/खरक सिंगची विरुद्ध मते रद्द केली.", "evidence": "K.S. Puttaswamy v. Union of India (2017) 10 SCC 1"}, {"section": 6, "subtopic": "Article 32 vs 226", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा — स्तंभ-I: (a) कलम 32 चे क्षेत्र, (b) कलम 226 चे क्षेत्र, (c) कलम 32 चे निलंबन, (d) कलम 226 चे स्वरूप. स्तंभ-II: (i) केवळ मूलभूत हक्क, (ii) मूलभूत हक्क + इतर कोणतेही प्रयोजन, (iii) कलम 359 अंतर्गत निलंबनीय (कलम 20-21 वगळता), (iv) विवेकाधीन; विलंब/पर्यायी दाद या कारणाने फेटाळता येते.", "q_english": "Match — Column-I: (a) Scope of Article 32, (b) Scope of Article 226, (c) Suspension of Article 32, (d) Nature of Article 226. Column-II: (i) Fundamental rights only, (ii) FRs + 'for any other purpose', (iii) Suspendable under Art 359 (except Arts 20-21), (iv) Discretionary; can be refused on delay/alternative remedy.", "options": ["(a)-i, (b)-ii, (c)-iii, (d)-iv", "(a)-ii, (b)-i, (c)-iii, (d)-iv", "(a)-i, (b)-ii, (c)-iv, (d)-iii", "(a)-ii, (b)-i, (c)-iv, (d)-iii"], "correct_index": 0, "explanation_marathi": "कलम 32 केवळ मूलभूत हक्कांसाठी व हक्कच आहे (359 अंतर्गत निलंबनीय); कलम 226 व्यापक (इतर प्रयोजने) पण विवेकाधीन.", "evidence": "Constitution Arts 32, 226, 359 as amended by 44th Amendment"}, {"section": 6, "subtopic": "Citizenship CAA rules 2024", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना I: CAA, 2019 अंतर्गत नागरिकत्वासाठी पात्रतेची कट-ऑफ तारीख. संकल्पना II: CAA नियम, 2024 अंतर्गत अर्ज प्रक्रिया. या दोन्हींचे योग्य एकत्रीकरण कोणते?", "q_english": "Concept I: Cut-off date for eligibility under CAA, 2019. Concept II: Application process under CAA Rules, 2024. Which combination is correct?", "options": ["I: 31 डिसें. 2014 पूर्वी भारतात प्रवेश; II: indiancitizenshiponline.nic.in वर ऑनलाइन अर्ज व जिल्हास्तरीय समितीकडून छाननी", "I: 11 मार्च 2024 पूर्वी भारतात प्रवेश; II: जिल्हाधिकाऱ्यांकडे ऑफलाइन अर्ज व राज्य मंत्रिमंडळाकडून छाननी", "I: 31 डिसें. 2014 पूर्वी भारतात प्रवेश; II: केवळ कागदी अर्ज व परराष्ट्र मंत्रालयाकडून थेट मंजुरी", "I: 26 जाने. 1950 पूर्वी भारतात प्रवेश; II: indiancitizenshiponline.nic.in वर अर्ज व ग्रामपंचायतीकडून छाननी"], "correct_index": 0, "explanation_marathi": "I सत्य: 31 डिसें. 2014 पूर्वी आलेल्या अफगाणिस्तान, बांगलादेश, पाकिस्तानातील 6 अल्पसंख्याक समुदायांना पात्रता; II सत्य: 11 मार्च 2024 च्या नियमांनुसार ऑनलाइन पोर्टल + जिल्हास्तरीय समिती छाननी.", "evidence": "Citizenship (Amendment) Act, 2019, s.2; Citizenship (Amendment) Rules, 2024 notified 11-3-2024"}, {"section": 6, "subtopic": "Election Commission appointment 2023", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र करा — (1) मुख्य निवडणूक आयुक्त व इतर निवडणूक आयुक्त (नियुक्ती, सेवाशर्ती व पदावधी) कायदा, 2023 मधील निवड समिती; (2) कलम 324(5) नुसार पदच्युती. या दोन्हींशी सुसंगत असलेले विधान ओळखा:", "q_english": "Combine — (1) the Selection Committee under the CEC and Other ECs (Appointment, Conditions of Service and Term of Office) Act, 2023; (2) removal under Art 324(5). Identify the statement consistent with both:", "options": ["निवड समिती: पंतप्रधान (अध्यक्ष), लोकसभेतील विरोधी पक्षनेते, पंतप्रधानांनी नामनिर्देशित केंद्रीय कॅबिनेट मंत्री; CEC ला SC न्यायाधीशाप्रमाणे (महाभियोगाने) हटवले जाते, इतर EC ला CEC च्या शिफारशीशिवाय हटवता येत नाही", "निवड समिती: पंतप्रधान, लोकसभेतील विरोधी पक्षनेते, सरन्यायाधीश; तिन्ही आयुक्तांना SC न्यायाधीशाप्रमाणे हटवले जाते", "निवड समिती: पंतप्रधान, सरन्यायाधीश, कायदामंत्री; CEC व इतर EC दोघांनाही राष्ट्रपती स्वेच्छेने हटवू शकतात", "निवड समिती: पंतप्रधान (अध्यक्ष), राज्यसभेतील विरोधी पक्षनेते, पंतप्रधानांनी नामनिर्देशित मंत्री; CEC ला राष्ट्रपती साध्या आदेशाने हटवू शकतात, इतर EC ला CEC च्या शिफारशीवरूनच हटवले जाते"], "correct_index": 0, "explanation_marathi": "2023 कायद्यातील समितीत CJI नाही — PM, LoP (लोकसभा), PM-नामनिर्देशित मंत्री; कलम 324(5): CEC ला न्यायाधीशाप्रमाणे, इतर EC ला CEC च्या शिफारशीशिवाय हटवता येत नाही.", "evidence": "CEC and Other ECs (Appointment, Conditions of Service and Term of Office) Act, 2023, s.7"}, {"section": 6, "subtopic": "Finance Commission 16th", "qtype": "कालक्रम लावा", "q_marathi": "16व्या वित्त आयोगाच्या संदर्भातील घटनांचा योग्य कालक्रम लावा: (a) अरविंद पनगढिया यांच्या अध्यक्षतेखाली 16व्या वित्त आयोगाची स्थापना, (b) आयोगाचा अहवाल सादर करण्याची नियत तारीख (31 ऑक्टोबर 2025), (c) 15व्या आयोगाच्या शिफारशींचा कालावधी समाप्त (31 मार्च 2026), (d) 16व्या आयोगाच्या शिफारशींचा अंमल प्रारंभ (1 एप्रिल 2026).", "q_english": "Arrange chronologically with reference to the 16th Finance Commission: (a) Constitution of the 16th FC under Arvind Panagariya, (b) Due date of its report (31 Oct 2025), (c) End of 15th FC award period (31 Mar 2026), (d) Commencement of 16th FC award period (1 Apr 2026).", "options": ["a-b-c-d", "a-c-b-d", "b-a-c-d", "a-b-d-c"], "correct_index": 0, "explanation_marathi": "क्रम: स्थापना (डिसें. 2023) → अहवाल (31 ऑक्टो. 2025) → 15व्याचा कालावधी समाप्त (31 मार्च 2026) → 16व्याचा अंमल (1 एप्रिल 2026).", "evidence": "Art 280; 16th FC constituted 31 Dec 2023"}, {"section": 6, "subtopic": "Fundamental duties 51A", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: (I) 42व्या दुरुस्तीने (1976) सुवर्णसिंह समितीच्या शिफारशीवरून मूलभूत कर्तव्ये समाविष्ट झाली. (II) सुरुवातीला 10 कर्तव्ये; 86व्या दुरुस्तीने (2002) 11वे कर्तव्य-6 ते 14 वयोगटातील पाल्यास शिक्षणाची संधी जोडले. (III) कलम 51A(i) नुसार सार्वजनिक मालमत्तेचे रक्षण व हिंसाचाराचा त्याग हे कर्तव्य आहे.", "q_english": "Statements: (I) Fundamental duties added by 42nd Amendment (1976) on Swaran Singh Committee. (II) Initially 10 duties; 86th Amendment (2002) added 11th duty-opportunity of education to child aged 6-14. (III) Art 51A(i) duty to safeguard public property and abjure violence.", "options": ["I, II, III बरोबर", "I, II बरोबर; III चूक", "II, III बरोबर; I चूक", "I, III बरोबर; II चूक"], "correct_index": 0, "explanation_marathi": "तीन्ही विधाने बरोबर: 42वी दुरुस्ती-सुवर्णसिंह समिती, 86वी दुरुस्तीने 51A(k) जोडले, 51A(i) मध्ये मालमत्ता रक्षण+अहिंसा.", "evidence": "Constitution Art.51A(a)-(k); 42nd Amendment Act 1976; 86th Amendment Act 2002"}, {"section": 6, "subtopic": "Governor discretionary powers", "qtype": "कारण-परिणाम", "q_marathi": "कारण (R): कलम 163(1) विवेकाधीन कार्यांची मुभा देते; 163(2) नुसार ते विवेकाधीन आहे की नाही यावर राज्यपालांचा निर्णय अंतिम असतो.\nपरिणाम (A): त्रिशंकू विधानसभेत मुख्यमंत्री नियुक्ती व बहुमत चाचणीची मुदत ठरवण्यात राज्यपाल स्वविवेक वापरतात.", "q_english": "Cause (R): Art 163(1) allows discretionary functions; under 163(2) Governor's decision on whether matter is discretionary is final. Effect (A): In hung assembly, Governor uses discretion in appointing CM and fixing floor-test time.", "options": ["R व A दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण आहे", "R व A दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही", "R बरोबर; A चूक", "R चूक; A बरोबर"], "correct_index": 0, "explanation_marathi": "163(1)+(2) मधून विवेकाधिकाराचा स्रोत मिळतो; त्रिशंकू परिस्थितीत सरकार स्थापनेतील विवेक हाच त्याचा वापर आहे.", "evidence": "Constitution Art.163(1), 163(2); Sarkaria Commission Report"}, {"section": 6, "subtopic": "Lok Sabha Speaker powers", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): धन विधेयक (कलम 110) आहे की नाही याचा अंतिम निर्णय लोकसभा अध्यक्ष देतात. परिणाम (R): अध्यक्षांचा हा निर्णय कोणत्याही न्यायालयात आव्हान देता येत नाही.", "q_english": "Assertion (A): The Speaker of Lok Sabha gives the final decision whether a Bill is a Money Bill (Art.110). Reason (R): This decision of the Speaker cannot be challenged in any court.", "options": ["A सत्य, R असत्य – अध्यक्ष निर्णय देतात पण न्यायिक पुनर्विलोकन मर्यादित स्वरूपात शक्य", "A सत्य, R सत्य – निर्णय अंतिम व पुनर्विलोकनापासून पूर्ण संरक्षित", "A असत्य, R सत्य – धन विधेयकाचा निर्णय राष्ट्रपती घेतात", "A असत्य, R असत्य – दोन्ही विधाने चुकीची"], "correct_index": 0, "explanation_marathi": "A सत्य (कलम 110(3) नुसार अध्यक्षांचा निर्णय अंतिम). R असत्य – रॉजर मॅथ्यू व आधार निकालांनुसार प्रमाणपत्राचे मर्यादित न्यायिक पुनर्विलोकन शक्य.", "evidence": "Constitution Art.110(3); Rojer Mathew v. South Indian Bank (2019)"}, {"section": 6, "subtopic": "Maharashtra Zilla Parishad", "qtype": "नकाशा आधारित", "q_marathi": "महाराष्ट्राच्या नकाशाचे निरीक्षण करा: (A) मुंबई शहर (B) ठाणे (C) पुणे (D) नागपूर. महाराष्ट्र जिल्हा परिषद व पंचायत समिती अधिनियम, 1961 नुसार कोणत्या ठिकाणी जिल्हा परिषद स्थापन झालेली नाही?", "q_english": "Observe Maharashtra's map: (A) Mumbai City (B) Thane (C) Pune (D) Nagpur. Under the Maharashtra Zilla Parishad and Panchayat Samiti Act, 1961, at which place is no Zilla Parishad constituted?", "options": ["केवळ A – मुंबई शहर (व मुंबई उपनगर) येथे महानगरपालिका असल्याने ZP नाही", "केवळ B – ठाणे येथे ZP नाही", "B व C – ठाणे व पुणे येथे ZP नाही", "A व D – मुंबई शहर व नागपूर येथे ZP नाही"], "correct_index": 0, "explanation_marathi": "महाराष्ट्रात 34 ZP आहेत; मुंबई शहर व मुंबई उपनगर या पूर्ण नागरी जिल्ह्यांत महानगरपालिका असल्याने ZP नाही.", "evidence": "Maharashtra Zilla Parishad and Panchayat Samitis Act, 1961"}, {"section": 6, "subtopic": "Panchayat 73rd amendment", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 73व्या घटना दुरुस्तीने पंचायतींना घटनात्मक दर्जा देऊन 5 वर्षांचा निश्चित कार्यकाळ व मुदतपूर्व विसर्जनानंतर 6 महिन्यांत निवडणुका बंधनकारक केल्या. कारण (R): 11व्या अनुसूचीतील 29 विषय पंचायतींकडे हस्तांतरित करणे ही 73व्या दुरुस्तीतील अनिवार्य तरतूद आहे.", "q_english": "Assertion (A): The 73rd Amendment gave panchayats constitutional status, fixing a 5-year term and mandatory elections within 6 months of premature dissolution. Reason (R): Transfer of the 29 subjects of the 11th Schedule to panchayats is a mandatory provision of the 73rd Amendment.", "options": ["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 2, "explanation_marathi": "A बरोबर (कलम 243E: 5 वर्षे कार्यकाळ, 6 महिन्यांत निवडणूक). R चूक: 11व्या अनुसूचीतील विषय सोपवणे (कलम 243G) ऐच्छिक/विवेकाधीन तरतूद आहे.", "evidence": "73rd Amendment 1992; Art 243E; Art 243G with 11th Schedule"}, {"section": 6, "subtopic": "Parliamentary committees PAC", "qtype": "तक्ता आधारित", "q_marathi": "लोकलेखा समितीबाबत तक्ता पहा: (I) एकूण सदस्य-22, (II) राज्यसभा सदस्य-7, (III) कार्यकाळ-2 वर्षे, (IV) अध्यक्ष-1967 पासून प्रथेने विरोधी पक्षाचा. योग्य पर्याय निवडा.", "q_english": "Consider table on Public Accounts Committee: (I) Total members-22, (II) Rajya Sabha members-7, (III) Term-2 years, (IV) Chairman-from opposition by convention since 1967. Choose correct option.", "options": ["I, II, IV बरोबर; III चूक", "I, II, III बरोबर; IV चूक", "II, III, IV बरोबर; I चूक", "I, III, IV बरोबर; II चूक"], "correct_index": 0, "explanation_marathi": "PAC मध्ये 15 लोकसभा+7 राज्यसभा=22 सदस्य, कार्यकाळ 1 वर्ष (2 नव्हे), मंत्री सदस्य होऊ शकत नाही, 1967 पासून विरोधी पक्षाचा अध्यक्ष ही प्रथा आहे.", "evidence": "Lok Sabha Rules of Procedure; PAC established 1921"}, {"section": 6, "subtopic": "Preamble 42nd amendment", "qtype": "कालक्रम लावा", "q_marathi": "42व्या घटना दुरुस्तीद्वारे उद्देशिकेत झालेल्या बदलासंबंधी पुढील घटनांचा योग्य कालक्रम लावा: (A) स्वर्णसिंह समितीची स्थापना (B) 42वी दुरुस्ती विधेयक लोकसभेत पारित (C) राष्ट्रपतींची संमती (D) उद्देशिकेत 'समाजवादी, धर्मनिरपेक्ष, एकात्मता' शब्दांचा अंमल", "q_english": "Arrange in chronological order the events of the Preamble change by the 42nd Amendment: (A) Setting up of Swaran Singh Committee (B) Passage of 42nd Amendment Bill in Lok Sabha (C) Presidential assent (D) Enforcement of 'Socialist, Secular, Integrity' in the Preamble", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A-B-C-D: स्वर्णसिंह समिती (मे 1976) → विधेयक पारित (2 नोव्हें. 1976) → संमती (18 डिसें. 1976) → उद्देशिका अंमल (3 जाने. 1977).", "evidence": "42nd Constitution Amendment Act, 1976, Sec.2 enforced w.e.f. 3-1-1977"}, {"section": 6, "subtopic": "President rule 356", "qtype": "जोड्या लावा", "q_marathi": "कलम 356 बाबत स्तंभ I व II च्या योग्य जोड्या लावा.\nस्तंभ I: अ) 356(3) नुसार संसद मान्यतेची मुदत, ब) 356(4) नुसार प्रत्येक वेळी वाढ, क) 44वी दुरुस्तीनंतर एकूण कमाल मर्यादा, ड) 68वी दुरुस्तीने पंजाबसाठी वाढवलेली मर्यादा.\nस्तंभ II: i) 3 वर्षे, ii) 2 महिने, iii) 6 महिने, iv) 5 वर्षे.", "q_english": "Match Column I and II regarding Article 356. Column I: A) Parliament approval period under 356(3), B) Each extension under 356(4), C) Total maximum limit after 44th Amendment, D) Extended limit for Punjab by 68th Amendment. Column II: i) 3 years, ii) 2 months, iii) 6 months, iv) 5 years.", "options": ["अ-ii, ब-iii, क-i, ड-iv", "अ-ii, ब-i, क-iii, ड-iv", "अ-iii, ब-ii, क-i, ड-iv", "अ-ii, ब-iii, क-iv, ड-i"], "correct_index": 0, "explanation_marathi": "356(3) नुसार 2 महिन्यांत संसद मान्यता, 356(4) नुसार दरवेळी 6 महिने वाढ, 44वी दुरुस्तीने कमाल 3 वर्षे मर्यादा पुनर्स्थापित, 68वी दुरुस्तीने पंजाबसाठी 5 वर्षे केली.", "evidence": "Constitution Art.356(3), 356(4); 44th Amendment Act 1978; 68th Amendment Act 1991"}, {"section": 6, "subtopic": "Rajya Sabha Deputy Chairman", "qtype": "बहु-विधान", "q_marathi": "राज्यसभेच्या उपसभापतींबाबत विधाने पहा: (I) ते राज्यसभा सदस्यांमधूनच निवडले जातात. (II) सभापती अनुपस्थित असता ते सभागृहाचे कामकाज चालवतात. (III) त्यांना हटवण्यासाठी 14 दिवसांची पूर्वसूचना व 'तत्कालीन सर्व सदस्यांच्या बहुमता'ने ठराव आवश्यक.", "q_english": "Consider statements on the Rajya Sabha Deputy Chairman: (I) Elected from among Rajya Sabha members. (II) Presides when the Chairman is absent. (III) Removal needs 14 days' notice and a resolution by majority of all then members.", "options": ["I, II आणि III तिन्ही सत्य", "I, II सत्य; III असत्य – साध्या बहुमताने हटवता येते", "केवळ I सत्य; II, III असत्य", "I, II, III तिन्ही असत्य"], "correct_index": 0, "explanation_marathi": "I सत्य (कलम 89(2)); II सत्य (कलम 91); III सत्य – कलम 90 नुसार 14 दिवस सूचना + तत्कालीन सर्व सदस्यांचे बहुमत लागते.", "evidence": "Constitution Arts. 89(2), 90, 91; Rajya Sabha Rules of Procedure"}, {"section": 6, "subtopic": "Supreme Court collegium", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): कॉलेजियम व्यवस्था मूळ संविधानात नमूद नव्हती; ती न्यायालयीन निर्णयांतून विकसित झाली.\nकारण (R): 99वी दुरुस्तीने स्थापन केलेला NJAC सर्वोच्च न्यायालयाने मूलभूत संरचनेचे उल्लंघन म्हणून रद्द केला.", "q_english": "Assertion (A): Collegium system was not in original Constitution; it evolved through judicial decisions. Reason (R): NJAC established by 99th Amendment was struck down by Supreme Court as violating basic structure.", "options": ["A व R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर; R चूक", "A चूक; R बरोबर"], "correct_index": 1, "explanation_marathi": "A बरोबर: दुसऱ्या (1993) व तिसऱ्या (1998) न्यायाधीश खटल्यांतून कॉलेजियम आले. R बरोबर: 2015 च्या चौथ्या न्यायाधीश खटल्यात NJAC रद्द झाला. पण R हे A च्या उगमाचे स्पष्टीकरण नाही.", "evidence": "Supreme Court Advocates-on-Record Assn. v. UOI (1993) Second Judges Case; In re Presidential Reference (1998) Third Judges Case; SCAORA v. UOI (2015) NJAC judgment; 99th Amendment Act 2014"}, {"section": 7, "subtopic": "Agriculture MSP 2026", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): रब्बी 2026-27 साठी गव्हाचा MSP उत्पादन खर्चाच्या (A2+FL) दीडपटापेक्षा जास्त राखला जातो. कारण (R): सरकार CACP शिफारशीनुसार C2 खर्चावर 50% नफा देऊन MSP ठरवते.", "q_english": "Assertion (A): Wheat MSP for Rabi 2026-27 is kept at more than 1.5 times A2+FL cost. Reason (R): Government fixes MSP giving 50% profit over C2 cost as per CACP.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 2, "explanation_marathi": "A सत्य: 2018 पासून MSP हे A2+FL च्या दीडपट किमान तत्त्व आहे. R असत्य: स्वामिनाथन आयोगाने C2+50% सुचवले, पण सरकार A2+FL+50% वापरते, C2 वर नाही.", "evidence": "CACP Price Policy Reports Rabi 2026-27; Union Budget 2018-19 – MSP at 1.5x A2+FL principle vs Swaminathan C2+50%"}, {"section": 7, "subtopic": "Digital economy DPI", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा (DPI): अ) आधार - 1) संमती-आधारित डेटा शेअरिंग, ब) UPI - 2) विकेंद्रित व्यापार नेटवर्क, क) ONDC - 3) ओळख पडताळणी, ड) अकाउंट अ‍ॅग्रीगेटर - 4) त्वरित पेमेंट. योग्य मेळ निवडा.", "q_english": "Match (DPI): A) Aadhaar - 1) consent-based data sharing, B) UPI - 2) decentralised trade network, C) ONDC - 3) identity verification, D) Account Aggregator - 4) instant payment. Choose correct match.", "options": ["अ-3, ब-4, क-2, ड-1", "अ-3, ब-2, क-4, ड-1", "अ-1, ब-4, क-2, ड-3", "अ-3, ब-4, क-1, ड-2"], "correct_index": 0, "explanation_marathi": "योग्य मेळ अ-3, ब-4, क-2, ड-1 आहे. आधार हा ओळख स्तर, UPI पेमेंट स्तर, ONDC व्यापार नेटवर्क, AA डेटा संमती स्तर आहे.", "evidence": "MeitY India Stack DPI framework; UIDAI, NPCI, ONDC Strategy Paper"}, {"section": 7, "subtopic": "Fiscal deficit 2026-27", "qtype": "बहु-विधान", "q_marathi": "2026-27 च्या केंद्रीय अर्थसंकल्पातील वित्तीय शिस्तीबाबत खालील विधाने विचारात घ्या: I. BE 2026-27 मध्ये वित्तीय तूट GDP च्या 4.3% ठेवण्याचे लक्ष्य आहे (RE 2025-26: 4.4%). II. 2026-27 मध्ये केंद्राचे कर्ज-GDP गुणोत्तर 55.6% राहील; 2030-31 पर्यंत 50±1% हे मध्यम-मुदतीचे लक्ष्य आहे. III. 2025-26 पासून कर्ज-GDP गुणोत्तर हेच प्रमुख वित्तीय मापदंड झाले आहे. योग्य पर्याय निवडा:", "q_english": "Consider the following statements on fiscal discipline in Union Budget 2026-27: I. The fiscal deficit target for BE 2026-27 is 4.3% of GDP (RE 2025-26: 4.4%). II. The Centre's debt-to-GDP ratio is estimated at 55.6% in 2026-27, with a medium-term aim of 50±1% by 2030-31. III. Since 2025-26, the debt-to-GDP ratio has become the key fiscal anchor. Choose the correct option:", "options": ["फक्त I आणि II बरोबर", "I, II आणि III बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "बरोबर उत्तर (b): PIB नुसार तिन्ही विधाने सत्य — 4.3% तूट, 55.6% कर्ज-GDP व 2030-31 पर्यंत 50±1% लक्ष्य, आणि कर्ज हेच नवे वित्तीय मापदंड.", "evidence": "PIB Budget 2026-27 release: fiscal deficit 4.3% of GDP (RE 2025-26: 4.4%), Centre debt-to-GDP 55.6%"}, {"section": 7, "subtopic": "GDP base year 2026", "qtype": "बहु-विधान", "q_marathi": "GDP आधार वर्षाबाबत विधाने पाहा: (I) 2011-12 ऐवजी 2022-23 हे नवीन आधार वर्ष फेब्रु. 2026 पासूनच्या मालिकेत वापरले जाणार आहे. (II) नवीन मालिकेत MCA-21, GSTN व PLFS सारखे अद्ययावत स्रोत वापरले जातील. (III) आधार वर्ष बदलल्याने आधीच्या वर्षांचा वास्तविक वाढदर आपोआप वाढतो. योग्य पर्याय निवडा.", "q_english": "Consider statements on GDP base year revision: (I) New series from Feb 2026 will use 2022-23 as base instead of 2011-12. (II) New series will use updated sources like MCA-21, GSTN and PLFS. (III) Changing base year automatically raises past real growth rates. Choose correct option.", "options": ["फक्त I व II बरोबर, III चूक", "फक्त I व III बरोबर, II चूक", "फक्त II व III बरोबर, I चूक", "I, II, III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I, II बरोबर: MoSPI ने 2022-23 आधार वर्ष व नवीन स्रोत जाहीर केले आहेत. III चूक: पुनर्आधारणी ही सांख्यिकीय पुनर्रचना आहे, वाढदर आपोआप वाढत नाही.", "evidence": "MoSPI press note on base year revision to 2022-23 (new GDP series due 27 Feb 2026)"}, {"section": 7, "subtopic": "GST Council 2025", "qtype": "कालक्रम लावा", "q_marathi": "GST सुधारणांतील खालील घटनांचा योग्य कालक्रम लावा: A. 101 व्या घटना दुरुस्तीने GST लागू, B. दर सुसूत्रीकरण मंत्रीगटाची (GoM) शिफारस, C. 56 व्या GST परिषद बैठकीत 2-स्लॅब निर्णय (3-4 सप्टेंबर 2025), D. सुधारित दर लागू (22 सप्टेंबर 2025).", "q_english": "Arrange the following GST reform events chronologically: A. GST rollout via the 101st Constitutional Amendment, B. GoM recommendation on rate rationalisation, C. 56th GST Council decision on the 2-slab structure (3-4 Sept 2025), D. Revised rates brought into effect (22 Sept 2025).", "options": ["A → B → C → D", "A → C → B → D", "B → A → D → C", "A → B → D → C"], "correct_index": 0, "explanation_marathi": "बरोबर (a): GST 2017 मध्ये लागू, नंतर GoM शिफारस, मग 56 वी बैठक (3-4 सप्टेंबर) व 22 सप्टेंबरपासून अंमलबजावणी.", "evidence": "PIB: 56th GST Council meeting (3-4 Sept 2025) reduced 4 slabs to 5% and 18% plus 40% special rate"}, {"section": 7, "subtopic": "Industrial Policy 1991", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा (1991 औद्योगिक धोरण): अ) पूर्वी सार्वजनिक क्षेत्रासाठी 17 क्षेत्रे राखीव → नंतर थेट 3 पर्यंत मर्यादित; ब) MRTP कायद्यातील 100 कोटी मालमत्ता मर्यादा → पूर्णपणे रद्द; क) FERA अंतर्गत FDI ला 40% मर्यादा → 34 उद्योगांत 51% स्वयंचलित मान्यता. 1991 च्या मूळ घोषणेनुसार कोणती ओळ अचूक नाही?", "q_english": "See table (Industrial Policy 1991): A) 17 areas reserved for public sector → cut to 3 directly; B) MRTP asset limit Rs 100 cr → fully abolished; C) FDI cap 40% under FERA → 51% automatic in 34 industries. Which row is NOT correct as per original 1991 announcement?", "options": ["फक्त अ", "फक्त ब", "फक्त क", "अ आणि क दोन्ही"], "correct_index": 0, "explanation_marathi": "अ चुकीची: 1991 च्या मूळ धोरणात राखीव क्षेत्रे 17 वरून 8 केली, 3 नव्हे (3 ची घट 1993 नंतर).", "evidence": "Industrial Policy Statement 24 July 1991"}, {"section": 7, "subtopic": "Inflation CPI vs WPI", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पाहा: CPI (आधार 2012, अन्न-पेय भार 45.86%, वस्तू+सेवा) vs WPI (आधार 2011-12, अन्न भार ~24%, फक्त वस्तू). 2026 मध्ये भाजीपाला दरात तीव्र वाढ झाल्यास तार्किक निष्कर्ष कोणता?", "q_english": "See table: CPI (base 2012, food-beverage weight 45.86%, goods+services) vs WPI (base 2011-12, food weight ~24%, goods only). If vegetable prices spike sharply in 2026, what is the logical inference?", "options": ["CPI, WPI पेक्षा जास्त वाढेल; CPI मध्ये अन्नाचे वजन जास्त व किरकोळ मार्जिन समाविष्ट असते", "WPI, CPI पेक्षा जास्त वाढेल; WPI मध्ये प्राथमिक वस्तूंचे वजन जास्त असते", "दोन्ही समान वाढतील; दोन्हींचे आधार वर्ष समान आहे", "CPI स्थिर राहील; भाजीपाला फक्त WPI मध्येच मोजला जातो"], "correct_index": 0, "explanation_marathi": "बरोबर: जास्त अन्न-वजन + किरकोळ किंमतीमुळे CPI संवेदनशीलता जास्त.", "evidence": "MoSPI CPI weights 2012 series (food & beverages 45.86%); DPIIT WPI 2011-12 weights"}, {"section": 7, "subtopic": "MSME definition 2025", "qtype": "कारण-परिणाम", "q_marathi": "कारण: केंद्रीय अर्थसंकल्प 2025-26 मध्ये MSME गुंतवणूक/उलाढाल मर्यादा वाढवली (सूक्ष्म: ₹2.5 कोटी/₹10 कोटी; लघु: ₹25 कोटी/₹100 कोटी; मध्यम: ₹125 कोटी/₹500 कोटी). याचा तार्किक परिणाम कोणता?", "q_english": "Cause: Union Budget 2025-26 raised MSME investment/turnover limits (Micro: Rs 2.5 cr/Rs 10 cr; Small: Rs 25 cr/Rs 100 cr; Medium: Rs 125 cr/Rs 500 cr). What is the logical effect?", "options": ["अधिक वाढलेले उद्योग MSME कक्षेत राहून प्राधान्य कर्ज व निविदा सवलतींना पात्र राहतील", "अधिक मध्यम उद्योग सूक्ष्म वर्गात घसरून लाभ गमावतील", "निकष कडक झाल्याने MSME संख्या घटेल", "सूक्ष्म उद्योगांची उलाढाल मर्यादा ₹5 कोटीच राहील"], "correct_index": 0, "explanation_marathi": "बरोबर: मर्यादा वाढल्याने मोठे होणारे उद्योग MSME लाभांत टिकतात.", "evidence": "MSME Ministry notification 21.03.2025 / Budget 2025-26 speech"}, {"section": 7, "subtopic": "Maharashtra cooperative banks", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 31 मार्च 2025 रोजी RBI च्या सर्वसमावेशक निर्देशांखाली (AID) असलेल्या 23 नागरी सहकारी बँकांपैकी 9 महाराष्ट्रातील होत्या. कारण (R): कर्ज केंद्रीकरण जोखीम व प्रशासन त्रुटींमुळे ठेवीदारांचे हित धोक्यात आल्याने RBI ने UCBs वर कडक निर्बंध व दंडात्मक कारवाई केली.", "q_english": "Assertion (A): Of the 23 Urban Cooperative Banks under RBI's All-Inclusive Directions (AID) as of 31 March 2025, nine were from Maharashtra. Reason (R): Credit-concentration risk and governance lapses endangering depositors' interests led RBI to impose strict restrictions and penal action on UCBs.", "options": ["A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "बरोबर (a): दोन्ही विधाने सत्य — महाराष्ट्र 9 बँकांसह आघाडीवर, आणि PMC धड्यानंतर कर्ज केंद्रीकरणावरील कडक निर्बंध हेच AID कारवाईमागचे कारण.", "evidence": "Indian Cooperative/RBI FY2024-25 data: 23 UCBs under AID as of 31 Mar 2025 — Maharashtra 9, Karnataka 5, UP 4"}, {"section": 7, "subtopic": "NABARD rural credit", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "NABARD च्या ग्रामीण पतपुरवठ्यातील दोन संकल्पनांची योग्य जोडी ओळखा: संकल्पना X – DAY-NRLM अंतर्गत महिला बचत गटांना RRB व राज्य सहकारी बँकांमार्फत 7% दराने सवलतीचे पुनर्वित्त; संकल्पना Y – 250 निवडक जिल्ह्यांत ₹3 लाखांपर्यंतच्या महिला SHG कर्जावर व्याज अनुदान योजना.", "q_english": "Identify the correct pair of NABARD rural-credit concepts: Concept X – concessional refinance at 7% to RRBs and State Cooperative Banks for loans to women SHGs under DAY-NRLM; Concept Y – interest subvention scheme on women SHG loans up to Rs 3 lakh in 250 identified districts.", "options": ["X: 7% पुनर्वित्त – RRB/राज्य सहकारी बँका; Y: 250 जिल्हे – ₹3 लाखांपर्यंत व्याज अनुदान", "X: 6% पुनर्वित्त – व्यापारी बँका; Y: 250 जिल्हे – ₹3 लाखांपर्यंत व्याज अनुदान", "X: 7% पुनर्वित्त – RRB/राज्य सहकारी बँका; Y: 500 जिल्हे – ₹5 लाखांपर्यंत व्याज अनुदान", "X: 9% पुनर्वित्त – लघु वित्त बँका; Y: 250 जिल्हे – ₹2 लाखांपर्यंत व्याज अनुदान"], "correct_index": 0, "explanation_marathi": "बरोबर (a): NABARD परिपत्रकानुसार RRB/राज्य सहकारी बँकांना महिला SHG कर्जावर 7% सवलतीचे पुनर्वित्त आणि 250 जिल्ह्यांत ₹3 लाखांपर्यंत व्याज अनुदान.", "evidence": "NABARD circular No. 167/DMFI-07/2025 (10 July 2025)"}, {"section": 7, "subtopic": "Poverty MPI 2026", "qtype": "बहु-विधान", "q_marathi": "राष्ट्रीय बहुआयामी दारिद्र्य निर्देशांकाबाबत विधाने पहा: I. 'बँक खाते' सह आरोग्य, शिक्षण, राहणीमान या 3 परिमाणांत 12 निर्देशक वापरतात. II. ≥20% भारित वंचितता असलेली व्यक्ती बहुआयामी गरीब मानली जाते. III. UNDP-OPHI जागतिक MPI मधील 10 निर्देशकांहून राष्ट्रीय MPI वेगळा आहे. योग्य पर्याय निवडा.", "q_english": "Consider statements on National MPI: I. 12 indicators across Health, Education, Living Standards including 'bank account'. II. Person with ≥20% weighted deprivation is multidimensionally poor. III. National MPI differs from UNDP-OPHI Global MPI with 10 indicators. Choose correct option.", "options": ["फक्त I आणि II बरोबर", "फक्त I आणि III बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "I व III सत्य: राष्ट्रीय MPI मध्ये 12 निर्देशक (बँक खाते सह) व जागतिक MPI मध्ये 10 निर्देशक आहेत. II असत्य: गरीब कट-ऑफ 33.33% आहे.", "evidence": "NITI Aayog National MPI Discussion Paper 2023 – 12 indicators"}, {"section": 7, "subtopic": "RBI MPC 2026", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (a) MPC रचना (b) 2026 मध्ये RBI गव्हर्नर (c) जून 2025 नंतर रेपो दर स्थिती (d) RBI महागाई लक्ष्य : (1) 5.5% वर यथास्थिती (2) 3 RBI + 3 बाह्य सदस्य (3) CPI 4% ±2% (4) संजय मल्होत्रा", "q_english": "Match: (a) MPC composition (b) RBI Governor in 2026 (c) Repo rate status after June 2025 (d) RBI inflation target : (1) On hold at 5.5% (2) 3 RBI + 3 external members (3) CPI 4% ±2% (4) Sanjay Malhotra", "options": ["a-2, b-4, c-1, d-3", "a-2, b-4, c-3, d-1", "a-3, b-4, c-1, d-2", "a-2, b-1, c-4, d-3"], "correct_index": 0, "explanation_marathi": "बरोबर: MPC 6 सदस्यीय, गव्हर्नर मल्होत्रा (डिसें.2024 पासून), रेपो 5.5% वर स्थिर, लक्ष्य CPI 4% ±2%.", "evidence": "RBI MPC resolutions Dec 2025/Feb 2026 (repo held at 5.5% since June 2025 cut)"}, {"section": 7, "subtopic": "SEBI 2025 reforms", "qtype": "जोड्या लावा", "q_marathi": "SEBI च्या 2025 सुधारणांच्या जोड्या लावा: A. पर्यायी T+0 सेटलमेंट, B. पात्र समभाग दलाल (QSB) अंमलबजावणी मुदत, C. F&O साप्ताहिक एक्स्पायरी, D. शून्य-दिवस समाप्ती (0DTE) करार — I. 1 नोव्हेंबर 2025 पर्यंत मुदतवाढ, II. अतिरिक्त मार्जिन, III. 25 वरून टॉप-500 समभागांपर्यंत विस्तार, IV. करारसंख्येत कपात.", "q_english": "Match SEBI's 2025 reforms: A. Optional T+0 settlement, B. QSB implementation deadline, C. F&O weekly expiries, D. Zero-days-to-expiry (0DTE) contracts — I. Extension to 1 Nov 2025, II. Additional margin, III. Expansion from 25 to top-500 scrips, IV. Reduction in number of contracts.", "options": ["A-III, B-I, C-IV, D-II", "A-III, B-II, C-I, D-IV", "A-I, B-III, C-IV, D-II", "A-III, B-I, C-II, D-IV"], "correct_index": 0, "explanation_marathi": "बरोबर (a): T+0 चा टप्प्याटप्प्याने टॉप-500 पर्यंत विस्तार, QSB मुदत 1 नोव्हेंबर 2025 पर्यंत, साप्ताहिक एक्स्पायरीत कपात व 0DTE वर अतिरिक्त मार्जिन.", "evidence": "SEBI circular 10 Dec 2024: optional T+0 expanded from 25 to top-500 scrips"}, {"section": 7, "subtopic": "UPI 2026 growth", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 2026 च्या सुरुवातीस UPI मासिक व्यवहार 16 अब्ज व मूल्य सुमारे ₹24 लाख कोटींच्या पुढे गेले. कारण (R): NPCI संचलित UPI ला स्मार्टफोन प्रसार, RuPay क्रेडिट कार्ड लिंकेज व आंतरराष्ट्रीय विस्ताराने गती मिळाली.", "q_english": "Assertion (A): In early 2026 UPI monthly transactions crossed 16 billion with value around Rs 24 lakh crore. Reason (R): NPCI-operated UPI was boosted by smartphone penetration, RuPay credit card linkage and international expansion.", "options": ["A व R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "बरोबर: NPCI आकडेवारीनुसार A सत्य, R मधील घटक वाढीची कारणे आहेत व थेट स्पष्टीकरण देतात.", "evidence": "NPCI UPI monthly statistics Jan-Feb 2026"}, {"section": 7, "subtopic": "Unemployment PLFS 2025", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): जानेवारी 2025 पासून PLFS अंतर्गत ग्रामीण व शहरी भागासाठी दरमहा बेरोजगारी दर (CWS) प्रसिद्ध केला जातो. परिणाम (R): त्यामुळे खरीप हंगामातील शेतीतील प्रच्छन्न बेरोजगारीतील अल्पकालीन चढ-उताराचे मापन वार्षिक Usual Status (ps+ss) पेक्षा अधिक अचूक होते.", "q_english": "Cause (A): Since January 2025 PLFS publishes monthly unemployment rate (CWS) for rural and urban areas. Effect (R): This measures short-term fluctuations in disguised unemployment in kharif agriculture more accurately than annual Usual Status (ps+ss).", "options": ["A आणि R दोन्ही सत्य, R हा A चा योग्य तार्किक परिणाम आहे", "A आणि R दोन्ही सत्य, परंतु R हा A चा योग्य तार्किक परिणाम नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य: MoSPI ने जाने. 2025 पासून मासिक PLFS बुलेटिन सुरू केले. R सत्य: CWS हा 7 दिवसांचा संदर्भ घेतो, त्यामुळे हंगामी प्रच्छन्न बेरोजगारी Usual Status (365 दिवस) पेक्षा अचूक टिपतो.", "evidence": "MoSPI PLFS Monthly Bulletin revamp Jan 2025; PLFS Annual Report 2024-25"}, {"section": 8, "subtopic": "Acids pH scale", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): जठररसाचा pH 1.2–3.0 असून तो तीव्र आम्लीय असतो. कारण (R): जठरातील HCl चे पूर्ण आयनीकरण H⁺ सान्द्रता ~10⁻¹ M पर्यंत वाढवते, जी पेप्सिन सक्रियतेसाठी आवश्यक असते.", "q_english": "Assertion (A): Gastric juice has pH 1.2–3.0 and is strongly acidic. Reason (R): Complete ionization of HCl in stomach raises H+ concentration to ~10^-1 M, essential for pepsin activation.", "options": ["A आणि R दोन्ही सत्य, पण R हे A चे अचूक स्पष्टीकरण नाही", "A आणि R दोन्ही सत्य आणि R हे A चे अचूक स्पष्टीकरण आहे", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "e
