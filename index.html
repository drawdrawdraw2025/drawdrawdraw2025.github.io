250 mm rainfall because laterite soil does not retain water", "हा थारसारखा शुष्क वाळवंटी पट्टा असून वार्षिक पर्जन्य 300 मि.मी. पेक्षा कमी आहे / This is a Thar-like arid desert belt with <300 mm annual rainfall"], "correct_index": 0, "explanation_marathi": "सह्याद्री ओलांडताना नैऋत्य वारे आर्द्रता गमावतात व पूर्वेकडे उतरती कोरडी हवा येते – हेच पर्जन्यछायेचे खरे कारण, त्यातून 500-750 मि.मी. अनियमित पाऊस व दुष्काळप्रवणता निर्माण होते. पर्याय 1 कारण चुकवतो (मुख्य कारण बंगालचे अंतर नव्हे); पर्याय 2 पर्जन्य-आकडा व मृदा-कारण दोन्ही चुकवतो (जांभी कोकणात, येथे काळी मृदा); पर्याय 3 पर्जन्याला वाळवंटी पातळीवर नेतो जे IMD नोंदींनुसार असत्य.", "evidence": "IMD Pune – District rainfall normals (Solapur ~545 mm, Beed/Dharashiv ~650-750 mm); Maharashtra State Disaster Management Plan – Drought-prone rain-shadow zone east of Western Ghats; GSDA/YASHADA reports"}, {"section": 6, "subtopic": "371(2) महाराष्ट्र-गुजरात विशेष तरतूद व विकास मंडळे", "qtype": "जोड्या लावा", "q_marathi": "स्तंभ-I (कलम 371(2) संदर्भातील घटक) व स्तंभ-II (तपशील) यांच्या जोड्या लावा:\nस्तंभ-I: (i) महाराष्ट्रासाठी विशेष तरतुदीतील प्रदेश, (ii) गुजरातसाठी विशेष तरतुदीतील प्रदेश, (iii) कलम 371(2) समाविष्ट करणारी घटना दुरुस्ती, (iv) राज्यपालांच्या विशेष जबाबदारीचे एक अंग\nस्तंभ-II: (a) सौराष्ट्र व कच्छ, (b) 7वी घटना दुरुस्ती, 1956, (c) निधीचे समन्यायी वाटप व तांत्रिक शिक्षणाच्या सुविधा, (d) विदर्भ, मराठवाडा व उर्वरित महाराष्ट्र\nयोग्य जोडी-समूह निवडा:", "q_english": "Match Column-I (elements of Article 371(2)) with Column-II (details):\nColumn-I: (i) Regions under special provision for Maharashtra, (ii) Regions under special provision for Gujarat, (iii) Amendment inserting Article 371(2), (iv) One component of Governor's special responsibility\nColumn-II: (a) Saurashtra and Kutch, (b) 7th Amendment, 1956, (c) Equitable allocation of funds and facilities for technical education, (d) Vidarbha, Marathwada and Rest of Maharashtra\nChoose the correct set:", "options": ["(i)-d, (ii)-a, (iii)-b, (iv)-c", "(i)-a, (ii)-d, (iii)-b, (iv)-c", "(i)-d, (ii)-a, (iii)-c, (iv)-b", "(i)-d, (ii)-c, (iii)-b, (iv)-a"], "correct_index": 0, "explanation_marathi": "योग्य जोड्या (i)-d, (ii)-a, (iii)-b, (iv)-c अशा आहेत; 371(2) हे 1956 च्या 7व्या दुरुस्तीने आले व त्यात महाराष्ट्रासाठी विदर्भ-मराठवाडा-उर्वरित महाराष्ट्र तर गुजरातसाठी सौराष्ट्र-कच्छ नमूद आहेत. पर्याय 2 मध्ये महाराष्ट्र-गुजरातचे प्रदेश अदलाबदल केले आहेत; पर्याय 3 मध्ये दुरुस्ती व जबाबदारीचे अंग अदलाबदल केले आहे; पर्याय 4 मध्ये (ii) व (iv) च्या जोड्या चूक आहेत.", "evidence": "कलम 371(2); 7वी घटना दुरुस्ती अधिनियम, 1956"}, {"section": 6, "subtopic": "73वी-74वी घटना दुरुस्ती: पंचायत vs नगरपालिका", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 73व्या दुरुस्तीने पंचायतींना तर 74व्या दुरुस्तीने नगरपालिकांना घटनात्मक दर्जा मिळाला; दोन्हींमध्ये अनुसूचित जाती-जमातींसाठी प्रमाणशीर आणि महिलांसाठी किमान एक तृतीयांश आरक्षण हे समान तत्त्वावर आहे.\nकारण (R): 73वी दुरुस्ती भाग IX (कलम 243 ते 243O) व 74वी दुरुस्ती भाग IX-A (कलम 243P ते 243ZG) समाविष्ट करते; दोन्ही 1992 मध्ये संमत होऊन 1993 मध्ये अंमलात आल्या.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): The 73rd Amendment gave constitutional status to Panchayats and the 74th Amendment to Municipalities; both provide reservation for SCs/STs on proportional basis and minimum one-third reservation for women on the same principle.\nReason (R): The 73rd Amendment added Part IX (Articles 243 to 243O) and the 74th Amendment added Part IX-A (Articles 243P to 243ZG); both were passed in 1992 and came into force in 1993.\nChoose the correct option:", "options": ["A आणि R दोन्ही बरोबर, आणि R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, परंतु R हे A चे अचूक स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 1, "explanation_marathi": "A आणि R दोन्ही सत्य आहेत: आरक्षणाचे तत्त्व दोन्हींत समान आहे आणि भाग/कलम व 1992-93 चा तपशीलही बरोबर आहे. परंतु R हे A चे स्पष्टीकरण नाही; R केवळ घटनात्मक स्थान व कालावधी सांगते, आरक्षणाचे तत्त्व का समान आहे हे स्पष्ट करत नाही. त्यामुळे 'स्पष्टीकरण आहे' सांगणारा पर्याय 1 चूक; एक विधान चूक ठरवणारे पर्याय 3 व 4 ही चूक.", "evidence": "73वी घटना दुरुस्ती अधिनियम 1992 (24 एप्रिल 1993 पासून लागू); 74वी घटना दुरुस्ती अधिनियम 1992 (1 जून 1993 पासून लागू); कलम 243D व 243T"}, {"section": 6, "subtopic": "CAG कलम 148-151 कार्ये", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): भारताचे नियंत्रक व महालेखापरीक्षक (CAG) केंद्र व राज्यांच्या संचित निधीतून होणाऱ्या सर्व खर्चाचे लेखापरीक्षण करतात, परंतु पंचायत व नगरपालिकांच्या लेख्यांवर त्यांना थेट घटनात्मक लेखापरीक्षणाचा अधिकार नाही, केवळ तांत्रिक मार्गदर्शन व पर्यवेक्षण असते. कारण (R): CAG ची नियुक्ती, कार्यकाळ व कर्तव्ये कलम 148-151 मध्ये विहित असून, कलम 149 नुसार संसद कायद्याने कर्तव्ये ठरवते; CAG ला केवळ राष्ट्रपतींच्या आदेशाने पदावरून दूर करता येते.", "q_english": "Assertion (A): The CAG of India audits all expenditure from the Consolidated Funds of the Union and States, but has no direct constitutional audit authority over Panchayat and Municipal accounts, only Technical Guidance and Supervision. Reason (R): Appointment, tenure and duties of CAG are in Articles 148-151, duties as prescribed by Parliament under Article 149; the CAG can be removed by mere order of the President.", "options": ["A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 2, "explanation_marathi": "A सत्य आहे कारण 148-151 व CAG कर्तव्य कायदा 1971 नुसार CAG केंद्र-राज्य संचित निधी, आकस्मिकता व लोकलेखा तपासतो; स्थानिक स्वराज्य संस्थांवर थेट घटनात्मक आदेश नाही. R असत्य आहे कारण 148(1) नुसार CAG ला सर्वोच्च न्यायालयाच्या न्यायाधीशाप्रमाणे सिद्ध गैरवर्तनावर संसदेच्या संबोधनाशिवाय केवळ राष्ट्रपतींच्या आदेशाने दूर करता येत नाही. त्यामुळे दोन्ही सत्य मानणारे दोन पर्याय व A असत्य मानणारा पर्याय चुकतो.", "evidence": "भारतीय संविधान कलम 148(1), 149, 151; CAG (कर्तव्ये, अधिकार व सेवा अटी) कायदा 1971; 73वी/74वी दुरुस्ती - TGS व्यवस्था"}, {"section": 6, "subtopic": "DPSP: 36-51 व 42वी दुरुस्ती", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "मार्गदर्शक तत्त्वे (कलम 36-51) व 42वी घटनादुरुस्ती संदर्भात विधाने विचारात घ्या: (I) 42व्या घटनादुरुस्तीने (1976) कलम 39A – मोफत कायदेशीर सहाय्य आणि कलम 43A – उद्योग व्यवस्थापनात कामगारांचा सहभाग समाविष्ट केले. (II) कलम 48A – पर्यावरण संरक्षण व वन्यजीव संवर्धन हे 42व्या दुरुस्तीनेच समाविष्ट झाले असून ते कलम 51A(g) या मूलभूत कर्तव्याशी पूरक आहे. (III) 42व्या दुरुस्तीने कलम 31C चा विस्तार करून सर्व मार्गदर्शक तत्त्वांना कलम 14 व 19 वर श्रेष्ठत्व दिले, जे मिनर्व्हा मिल्स खटल्यात (1980) रद्द झाले.", "q_english": "Consider statements on DPSPs (Articles 36-51) and the 42nd Amendment: (I) The 42nd Amendment (1976) inserted Article 39A – free legal aid and Article 43A – workers' participation in management. (II) Article 48A – protection of environment and wildlife was inserted by the 42nd Amendment itself and is complementary to the Fundamental Duty in Article 51A(g). (III) The 42nd Amendment expanded Article 31C to give primacy to all DPSPs over Articles 14 and 19, which was struck down in Minerva Mills (1980).", "options": ["I, II आणि III बरोबर", "फक्त I आणि II बरोबर, III चूक", "फक्त II आणि III बरोबर, I चूक", "फक्त I आणि III बरोबर, II चूक"], "correct_index": 0, "explanation_marathi": "42व्या दुरुस्तीने (1976) 39A, 43A, 48A तिन्ही समाविष्ट झाले व 48A हे 51A(g) शी पूरक आहे; 31C चा विस्तार मिनर्व्हा मिल्स (1980) मध्ये रद्द झाला, त्यामुळे I, II, III तिन्ही बरोबर. इतर पर्यायांपैकी प्रत्येक एक विधान चूक ठरवतो (44वी दुरुस्तीशी गल्लत किंवा 31C विस्तार वैध मानणे) म्हणून बाद.", "evidence": "42nd Amendment Act, 1976 – inserted Articles 39A, 43A, 48A, 51A(g); Article 31C expansion struck down in Minerva Mills v. Union of India (1980)"}, {"section": 6, "subtopic": "कलम 14-18 समता: अपवाद व न्यायालयीन अर्थ", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "कलम 14 ते 18 (समतेचा हक्क) संदर्भात खालील विधाने विचारात घ्या:\nI. कलम 14 'कायद्यापुढे समता' व 'कायद्याचे समान संरक्षण' या दोन्ही संकल्पना समाविष्ट करते; 'वाजवी वर्गीकरण' अनुज्ञेय आहे, पण वर्गीकरणाचा आधार व कायद्याच्या उद्देशात तर्कसंगत संबंध (rational nexus) असावा लागतो.\nII. कलम 15(1) राज्याकडून होणाऱ्या भेदभावास प्रतिबंध करते, तर कलम 15(2) दुकाने, सार्वजनिक उपहारगृहे, विहिरी, रस्ते इत्यादी ठिकाणी खाजगी व्यक्तींकडून नागरिकांविरुद्ध होणाऱ्या भेदभावासही प्रतिबंध करते.\nIII. ई.पी. रॉयप्पा विरुद्ध तामिळनाडू राज्य (1974) या खटल्यात सर्वोच्च न्यायालयाने 'उघड मनमानीपणा' (manifest arbitrariness) हा कलम 14 भंगाचा निकष म्हणून प्रस्थापित केला.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements regarding Articles 14 to 18 (Right to Equality):\nI. Article 14 includes both 'equality before law' and 'equal protection of laws'; 'reasonable classification' is permitted, but there must be a rational nexus between the basis of classification and the object of the law.\nII. Article 15(1) prohibits discrimination by the State, while Article 15(2) also prohibits discrimination by private persons against citizens regarding access to shops, public restaurants, wells, roads, etc.\nIII. In E.P. Royappa v. State of Tamil Nadu (1974), the Supreme Court established 'manifest arbitrariness' as a test for violation of Article 14.\nChoose the correct option:", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III सर्व बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "तिन्ही विधाने बरोबर आहेत: I हे अन्वर अली सरकार खटल्यातील वर्गीकरण निकष स्पष्ट करते; II हे 15(1) केवळ राज्यावर तर 15(2) खाजगी भेदभावावरही लागू होते हे दर्शवते; III मध्ये रॉयप्पा (1974) खटल्यातील मनमानी-निकष अचूक आहे. त्यामुळे फक्त दोन विधाने स्वीकारणारे पर्याय 1, 2 व 4 अपूर्ण असल्याने चूक ठरतात.", "evidence": "कलम 14, 15(1), 15(2); State of West Bengal v. Anwar Ali Sarkar (1952) वर्गीकरण निकष; E.P. Royappa v. State of Tamil Nadu (1974)"}, {"section": 6, "subtopic": "निवडणूक आयोग: 324 व EVM-VVPAT", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने पहा: (I) कलम 324(1) नुसार संसद, राज्य विधिमंडळ, राष्ट्रपती व उपराष्ट्रपती निवडणुकांचे अधीक्षण, निर्देशन व नियंत्रण निवडणूक आयोगाकडे असते, यात मतदारयाद्या तयार करणे समाविष्ट आहे. (II) VVPAT चा प्रथम प्रायोगिक वापर 2013 मध्ये नागालँडच्या नोक्सेन विधानसभा पोटनिवडणुकीत झाला आणि 2019 लोकसभा निवडणुकीत 100% EVM सोबत VVPAT वापरण्यात आले. (III) मुख्य निवडणूक आयुक्त व इतर आयुक्तांचा कार्यकाळ 6 वर्षे किंवा 65 वर्षे वय (जे आधी येईल ते) असून इतर आयुक्तांना राष्ट्रपती मुख्य निवडणूक आयुक्तांच्या शिफारशीशिवाय दूर करू शकतात.", "q_english": "Consider statements: (I) Under Article 324(1) superintendence, direction and control of elections to Parliament, State legislatures, President and Vice-President vest in the Election Commission, including preparation of electoral rolls. (II) VVPAT was first used on pilot basis in 2013 in Noksen Assembly by-election in Nagaland and in 2019 Lok Sabha elections 100% EVMs were deployed with VVPAT. (III) CEC and other ECs hold office for 6 years or till age 65 (whichever is earlier) and other ECs can be removed by the President without recommendation of the CEC.", "options": ["I आणि II सत्य, III असत्य", "I आणि III सत्य, II असत्य", "II आणि III सत्य, I असत्य", "I, II आणि III सर्व सत्य"], "correct_index": 0, "explanation_marathi": "I सत्य आहे कारण 324 मध्ये चारही निवडणुकांचे नियंत्रण व मतदारयाद्या समाविष्ट आहेत; II सत्य आहे कारण नोक्सेन (2013) ही पहिली VVPAT चाचणी व 2019 मध्ये 100% VVPAT तैनाती ही ECI ची नोंद आहे. III असत्य आहे कारण 324(5) परंतुकानुसार इतर आयुक्तांना मुख्य आयुक्तांच्या शिफारशीशिवाय दूर करता येत नाही. त्यामुळे II असत्य मानणारा, I असत्य मानणारा व सर्व सत्य मानणारा पर्याय चुकतो.", "evidence": "भारतीय संविधान कलम 324(1)(5); ECI अहवाल - VVPAT प्रथम वापर नोक्सेन 2013, 100% VVPAT लोकसभा 2019; निवडणूक आयोग सेवा अटी कायदा 1991/2023 - 6 वर्षे/65 वर्षे"}, {"section": 6, "subtopic": "न्यायालयीन पुनर्विलोकन व मूलभूत संरचना", "qtype": "कारण-परिणाम", "q_marathi": "कारण (R): केशवानंद भारती खटल्यात (1973) सर्वोच्च न्यायालयाने संसदेच्या घटनादुरुस्ती अधिकारावर मूलभूत संरचनेची मर्यादा घातली, न्यायालयीन पुनर्विलोकन हा त्याचा भाग मानला. परिणाम (E): 42 व्या घटनादुरुस्तीने कलम 368 मध्ये समाविष्ट केलेले 'घटनादुरुस्ती न्यायालयीन पुनर्विलोकनापासून मुक्त असेल' हे खंड (4) व (5) मिनर्व्हा मिल्स खटल्यात (1980) अवैध ठरवण्यात आले.", "q_english": "Reason (R): In Kesavananda Bharati case (1973) the Supreme Court imposed the basic structure limitation on Parliament's amending power under Article 368, holding judicial review as part of it. Effect (E): Clauses (4) and (5) inserted in Article 368 by the 42nd Amendment ousting judicial review of constitutional amendments were struck down in Minerva Mills case (1980).", "options": ["R आणि E दोन्ही सत्य आहेत आणि E हा R चा तार्किक परिणाम आहे", "R आणि E दोन्ही सत्य आहेत, परंतु E हा R चा तार्किक परिणाम नाही", "R सत्य आहे, E असत्य आहे", "R असत्य आहे, E सत्य आहे"], "correct_index": 0, "explanation_marathi": "R सत्य आहे कारण केशवानंद भारती (1973) मध्ये 13 न्यायाधीशांच्या खंडपीठाने मूलभूत संरचना सिद्धांत मांडून 368 वरील मर्यादा घातली; E सत्य आहे कारण 42 व्या दुरुस्तीने समाविष्ट केलेली 368(4)(5) मधील न्यायालयीन पुनर्विलोकनास मनाई मिनर्व्हा मिल्स (1980) मध्ये मूलभूत संरचनेचा भाग असलेल्या न्यायालयीन पुनर्विलोकनावर आघात म्हणून रद्द झाली. म्हणून E हा R चाच तार्किक परिणाम आहे, इतर पर्याय कारण-परिणाम संबंध किंवा सत्यता चुकवतात.", "evidence": "केशवानंद भारती वि. केरळ राज्य (1973), कलम 368, 42 वी घटनादुरुस्ती 1976, मिनर्व्हा मिल्स वि. भारत सरकार (1980)"}, {"section": 6, "subtopic": "पंचायत समिती: बलवंतराय मेहता ते अशोक मेहता", "qtype": "कालक्रम लावा", "q_marathi": "पंचायत समितीबाबत बलवंतराय मेहता यांनी त्रिस्तरीय रचनेत पंचायत समितीला मध्यवर्ती कार्यकारी स्थान दिले, तर अशोक मेहता यांनी द्विस्तरीय रचनेची शिफारस करून मंडल पंचायतीचा पर्याय दिला. या पार्श्वभूमीवर खालील घटनांचा योग्य कालक्रम लावा: (P) बलवंतराय मेहता समितीची नेमणूक, (Q) बलवंतराय मेहता समितीचा अहवाल, (R) अशोक मेहता समितीची नेमणूक, (S) अशोक मेहता समितीचा अहवाल.", "q_english": "Balwantrai Mehta gave Panchayat Samiti a pivotal executive position in a three-tier structure, while Ashok Mehta recommended a two-tier structure with Mandal Panchayat. In this background, arrange the following in correct chronological order: (P) Appointment of Balwantrai Mehta Committee, (Q) Report of Balwantrai Mehta Committee, (R) Appointment of Ashok Mehta Committee, (S) Report of Ashok Mehta Committee.", "options": ["P – Q – R – S", "Q – P – R – S", "P – Q – S – R", "Q – P – S – R"], "correct_index": 0, "explanation_marathi": "योग्य क्रम P-Q-R-S आहे कारण बलवंतराय समिती नेमणूक जाने. 1957 → अहवाल नोव्हें. 1957 आणि अशोक मेहता नेमणूक डिसें. 1977 → अहवाल ऑगस्ट 1978. पर्याय 1 व 3 मध्ये Q-P क्रम चूक आहे (अहवाल नेमणुकीपूर्वी अशक्य), तर पर्याय 2 व 3 मध्ये S-R क्रम चूक आहे (अहवाल नेमणुकीपूर्वी अशक्य).", "evidence": "Balwantrai Mehta Committee – appointed Jan 1957, report 24 Nov 1957; Ashok Mehta Committee – appointed 12 Dec 1977, report 21 Aug 1978"}, {"section": 6, "subtopic": "महाराष्ट्र ZP: 1961 अधिनियम त्रिस्तरीय रचना", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्रितपणे विचारात घ्या — (अ) महाराष्ट्र जिल्हा परिषद व पंचायत समिती अधिनियम, 1961 नुसार त्रिस्तरीय रचनेत पंचायत समिती हा तालुका/गट स्तरावरील कार्यकारी दुवा आहे, (ब) या अधिनियमानुसार जिल्हा परिषद अध्यक्ष व पंचायत समिती सभापती यांची निवड संबंधित संस्थेच्या निर्वाचित सदस्यांमधून अप्रत्यक्षपणे होते. योग्य एकत्रित पर्याय निवडा:", "q_english": "Consider two concepts together — (A) Under the Maharashtra Zilla Parishad and Panchayat Samitis Act, 1961, Panchayat Samiti is the executive link at the taluka/block level in the three-tier structure, (B) Under this Act, the ZP President and Panchayat Samiti Chairman are elected indirectly from among the elected members of the respective body. Choose the correct combined option:", "options": ["(अ) बरोबर – पंचायत समिती तालुका स्तरावर ग्रामपंचायत व जिल्हा परिषद यांना जोडणारा कार्यकारी घटक आहे; (ब) बरोबर – अध्यक्ष व सभापती दोघेही अप्रत्यक्षपणे निवडले जातात", "(अ) बरोबर – पंचायत समिती तालुका स्तरावर कार्यकारी दुवा आहे; (ब) चूक – अध्यक्ष व सभापती दोघेही थेट जनतेतून निवडले जातात", "(अ) चूक – पंचायत समिती जिल्हा स्तरावरील सल्लागार घटक आहे; (ब) बरोबर – अध्यक्ष व सभापती अप्रत्यक्षपणे निवडले जातात", "(अ) बरोबर – पंचायत समिती तालुका स्तरावर कार्यकारी दुवा आहे; (ब) चूक – अध्यक्ष अप्रत्यक्षपणे तर सभापती थेट निवडला जातो"], "correct_index": 0, "explanation_marathi": "1961 अधिनियमानुसार रचना ग्रामपंचायत (ग्राम) – पंचायत समिती (तालुका/गट, कार्यकारी दुवा) – जिल्हा परिषद (जिल्हा) अशी असून अध्यक्ष व सभापती अप्रत्यक्षपणे निवडले जातात म्हणून पर्याय 0 बरोबर. पर्याय 1 मधील थेट निवड ही सरपंचाशी गल्लत आहे, पर्याय 2 मध्ये पंचायत समितीला जिल्हा स्तर/सल्लागार म्हणणे चूक, पर्याय 3 मध्ये सभापती थेट म्हणणे चूक.", "evidence": "Maharashtra Zilla Parishad and Panchayat Samitis Act, 1961 – three-tier: Gram Panchayat – Panchayat Samiti (block) – Zilla Parishad; President/Chairman indirectly elected by elected members"}, {"section": 6, "subtopic": "मूलभूत कर्तव्ये 51A व सुवर्णसिंह समिती", "qtype": "कालक्रम लावा", "q_marathi": "मूलभूत कर्तव्ये (51A) व सुवर्णसिंह समिती संदर्भातील घटनांचा योग्य कालक्रम लावा:\nA. सुवर्णसिंह समितीची नियुक्ती\nB. सुवर्णसिंह समितीच्या शिफारशी सादर\nC. 42व्या घटना दुरुस्तीने भाग IV-A मध्ये 10 कर्तव्ये समाविष्ट\nD. 86व्या घटना दुरुस्तीने 11वे कर्तव्य [51A(k)] समाविष्ट — 6 ते 14 वयोगटातील पाल्यास शिक्षणाची संधी\nयोग्य क्रम निवडा:", "q_english": "Arrange the following events relating to Fundamental Duties (51A) and the Swaran Singh Committee in correct chronological order:\nA. Appointment of the Swaran Singh Committee\nB. Submission of Swaran Singh Committee recommendations\nC. Insertion of 10 duties in Part IV-A by the 42nd Amendment\nD. Insertion of 11th duty [51A(k)] by the 86th Amendment — opportunity of education to children aged 6 to 14\nChoose the correct sequence:", "options": ["A – B – C – D", "A – C – B – D", "B – A – C – D", "A – B – D – C"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A-B-C-D आहे: 1976 मध्ये समिती नियुक्त, त्याच वर्षी शिफारशी, त्यानंतर 42व्या दुरुस्तीने (1976) 10 कर्तव्ये, व 2002 मध्ये 86व्या दुरुस्तीने 11वे कर्तव्य. पर्याय 2 मध्ये दुरुस्ती शिफारशीपूर्वी दाखवली आहे, पर्याय 3 मध्ये नियुक्तीपूर्वी अहवाल दाखवला आहे, पर्याय 4 मध्ये 86वी दुरुस्ती 42वीपूर्वी दाखवली आहे — म्हणून तिन्ही चूक.", "evidence": "सुवर्णसिंह समिती 1976 (अहवाल 1976); 42वी घटना दुरुस्ती अधिनियम 1976; 86वी घटना दुरुस्ती अधिनियम 2002; कलम 51A(k)"}, {"section": 6, "subtopic": "मूलभूत हक्क: 32 vs 226", "qtype": "कारण-परिणाम", "q_marathi": "कारण (R): कलम 32 अंतर्गत सर्वोच्च न्यायालय केवळ मूलभूत हक्कांच्या अंमलबजावणीसाठीच रिट जारी करू शकते आणि कलम 32 हा स्वतः मूलभूत हक्क आहे. परिणाम (E): कलम 226 अंतर्गत उच्च न्यायालयाला मूलभूत हक्कांव्यतिरिक्त इतर कायदेशीर हक्कांसाठीही रिट जारी करता येतात, त्यामुळे कलम 226 ची व्याप्ती कलम 32 पेक्षा व्यापक आहे. योग्य कारण-परिणाम संबंध निवडा:", "q_english": "Reason (R): Under Article 32 the Supreme Court can issue writs only for enforcement of Fundamental Rights and Article 32 is itself a Fundamental Right. Effect (E): Under Article 226 the High Court can issue writs for Fundamental Rights as well as other legal rights, hence the scope of Article 226 is wider than Article 32. Choose the correct cause-effect relation:", "options": ["R बरोबर, E बरोबर, आणि E हा R चा तार्किक परिणाम आहे", "R बरोबर, E बरोबर, परंतु E हा R चा तार्किक परिणाम नाही", "R चूक, E बरोबर", "R बरोबर, E चूक – दोन्हींची व्याप्ती समान आहे"], "correct_index": 0, "explanation_marathi": "कलम 32 फक्त मूलभूत हक्कांसाठी व तो स्वतः मूलभूत हक्क असल्याने सर्वोच्च न्यायालय नकार देऊ शकत नाही; कलम 226 मूलभूत + इतर कायदेशीर हक्कांसाठी व विवेकाधीन असल्याने व्यापक आहे, म्हणून E हा R चा तार्किक परिणाम आहे. पर्याय 1 संबंध नाकारतो म्हणून चूक, पर्याय 2 R चूक ठरवतो, पर्याय 3 व्याप्ती समान म्हणतो म्हणून चूक.", "evidence": "Constitution Articles 32, 226; Dr. B.R. Ambedkar – Article 32 as 'heart and soul' of the Constitution"}, {"section": 6, "subtopic": "राज्यपाल: 154-161 विवेकाधिकार", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्ता पहा: (A) कलम 154 - राज्याची कार्यकारी सत्ता राज्यपालांत निहित; (B) कलम 156(1) - राज्यपाल राष्ट्रपतींच्या मर्जीपर्यंत पद धारण करतात; (C) कलम 161 - राज्यपालांना मृत्युदंडासह सर्व शिक्षांत पूर्ण क्षमादानाचा (Pardon) अधिकार आहे; (D) कलम 163(1) - विवेकाधिकार वगळता राज्यपाल मंत्रिपरिषदेच्या सहाय्य व सल्ल्याने कार्य करतात. कोणती विधाने बरोबर आहेत?", "q_english": "See the table: (A) Article 154 - Executive power of State vests in Governor; (B) Article 156(1) - Governor holds office during pleasure of President; (C) Article 161 - Governor has full power of pardon including death sentence; (D) Article 163(1) - Except in discretionary functions Governor acts on aid and advice of Council of Ministers. Which are correct?", "options": ["A, B, D बरोबर; C चूक", "A, C, D बरोबर; B चूक", "B, C बरोबर; A, D चूक", "A, B, C बरोबर; D चूक"], "correct_index": 0, "explanation_marathi": "A, B, D बरोबर आहेत कारण 154 नुसार कार्यकारी सत्ता निहित, 156(1) नुसार मर्जीपर्यंत पद (5 वर्षे संकेत असूनही), 163(1) नुसार विवेकाधिकार वगळता सल्ल्यानुसार कार्य. C चूक आहे कारण 161 नुसार राज्यपाल मृत्युदंडात पूर्ण क्षमादान (Pardon) देऊ शकत नाहीत, तो अधिकार केवळ राष्ट्रपतींना 72 नुसार आहे. त्यामुळे C ला बरोबर मानणारे व B किंवा D ला चूक मानणारे पर्याय चुकतात.", "evidence": "भारतीय संविधान कलम 154, 156(1), 161, 163(1) आणि कलम 72 (राष्ट्रपतींचा क्षमादान अधिकार)"}, {"section": 6, "subtopic": "राष्ट्रपती राजवट 356 व SR बोम्मई निर्णय", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "कलम 356 (राष्ट्रपती राजवट) व एस.आर. बोम्मई विरुद्ध भारत सरकार (1994) या निर्णयाचे एकत्रित आकलन केल्यास खालीलपैकी कोणते विधान सर्वात अचूक ठरते?", "q_english": "On a combined reading of Article 356 (President's Rule) and the S.R. Bommai v. Union of India (1994) decision, which of the following statements is most accurate?", "options": ["कलम 356 अंतर्गत उद्घोषणा न्यायिक पुनर्विलोकनास पात्र आहे; बहुमताची चाचणी राज्यपालांच्या समाधानावर नव्हे तर सभागृहाच्या पटलावर (floor test) झाली पाहिजे आणि 44व्या दुरुस्तीनंतर एक वर्षावरील वाढ केवळ राष्ट्रीय आणीबाणी किंवा निवडणूक आयोगाचे 'निवडणुका घेणे शक्य नाही' असे प्रमाणपत्र असेल तरच शक्य.", "कलम 356 अंतर्गत राज्यपालांचे समाधान अंतिम व अनिर्बंध आहे; त्याची न्यायिक चिकित्सा होऊ शकत नाही आणि बहुमताचा निर्णय राजभवनातच होतो.", "बोम्मई निर्णयानुसार राष्ट्रपती राजवट संसदेच्या मान्यतेशिवाय अमर्याद काळ चालू ठेवता येते; धर्मनिरपेक्षता हा मूलभूत चौकटीचा भाग नाही.", "कलम 356 ची उद्घोषणा केवळ राज्यपालांच्या अहवालावरच होऊ शकते ('अन्यथा' शक्य नाही) आणि एक वर्षानंतरच्या वाढीसाठी 44व्या दुरुस्तीने कोणतीही अतिरिक्त अट घातलेली नाही."], "correct_index": 0, "explanation_marathi": "पर्याय 1 बरोबर आहे: बोम्मई (1994) मध्ये 356 न्यायिक पुनर्विलोकनास पात्र, बहुमत सभागृहातच तपासावे व धर्मनिरपेक्षता मूलभूत चौकट ठरवले; तसेच 44व्या दुरुस्तीने एक वर्षापुढील वाढीस कठोर अटी घातल्या. पर्याय 2 बोम्मईपूर्व 'अनिर्बंध समाधान' ही रद्द झालेली भूमिका मांडतो; पर्याय 3 संसदीय मान्यता व धर्मनिरपेक्षतेबाबत उलट विधान करतो; पर्याय 4 'राज्यपालांचा अहवाल किंवा अन्यथा' हा शब्द व 44व्या दुरुस्तीच्या अटी नाकारतो.", "evidence": "कलम 356; 44वी घटना दुरुस्ती अधिनियम 1978; S.R. Bommai v. Union of India (1994)"}, {"section": 6, "subtopic": "संसद: धनविधेयक 110 vs वित्तविधेयक", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा : 'अ' गट - (A) धनविधेयक, (B) वित्त विधेयक-I, (C) वित्त विधेयक-II, (D) धनविधेयक आणि संयुक्त बैठक; 'ब' गट - (1) कलम 117(3) - दोन्ही सभागृहांत मांडता येते, राज्यसभा दुरुस्ती/फेटाळू शकते, (2) कलम 110 - लोकसभा अध्यक्ष प्रमाणित करतात, निर्णय अंतिम, (3) कलम 117(1) - राष्ट्रपतींच्या पूर्वशिफारशीशिवाय मांडता येत नाही, (4) कलम 108(1) परंतुकानुसार संयुक्त बैठक निषिद्ध.", "q_english": "Match the pairs: Group 'A' - (A) Money Bill, (B) Finance Bill-I, (C) Finance Bill-II, (D) Money Bill and Joint Sitting; Group 'B' - (1) Article 117(3) - can be introduced in either House, Rajya Sabha can amend/reject, (2) Article 110 - certified by Lok Sabha Speaker, decision final, (3) Article 117(1) - cannot be introduced without President's prior recommendation, (4) Joint sitting barred under proviso to Article 108(1).", "options": ["A-2, B-3, C-1, D-4", "A-2, B-1, C-3, D-4", "A-3, B-2, C-1, D-4", "A-2, B-3, C-4, D-1"], "correct_index": 0, "explanation_marathi": "बरोबर जोडी A-2, B-3, C-1, D-4 आहे कारण धनविधेयकाची व्याख्या 110 व अध्यक्षांचे प्रमाणपत्र 110(3) नुसार अंतिम असते, वित्त विधेयक-I हे 117(1) नुसार पूर्वशिफारस मागते तर वित्त विधेयक-II हे 117(3) नुसार दोन्ही सभागृहांत मांडता येते. पर्याय 2 मध्ये B ला चुकून 110 जोडले आहे, पर्याय 3 मध्ये A-B ची अदलाबदल केली आहे, पर्याय 4 मध्ये C-D अदलाबदल करून 117(3) ला संयुक्त बैठक निषिद्ध म्हटले आहे जे चुकीचे आहे.", "evidence": "भारतीय संविधान कलम 110(3), 109, 117(1), 117(3), 108(1) परंतुक"}, {"section": 6, "subtopic": "स्थानिक स्वराज्य: PESA 1996", "qtype": "नकाशा आधारित", "q_marathi": "भारताच्या नकाशात पाचव्या अनुसूचीतील अनुसूचित क्षेत्रे (उदा. महाराष्ट्रातील गडचिरोली, झारखंड, छत्तीसगड, ओडिशा) छायांकित दाखवली असून ईशान्येतील सहाव्या अनुसूचीतील क्षेत्रे वेगळ्या चिन्हाने दाखवली आहेत. या वितरणाच्या आधारे PESA अधिनियम, 1996 बद्दल योग्य विधान निवडा:", "q_english": "On an India map, Fifth Schedule Scheduled Areas (e.g. Gadchiroli in Maharashtra, Jharkhand, Chhattisgarh, Odisha) are shaded, while Sixth Schedule areas in the Northeast are marked differently. Based on this distribution, choose the correct statement about the PESA Act, 1996:", "options": ["PESA हा दिलीपसिंह भुरिया समितीच्या (1995) शिफारशींवर 1996 मध्ये संमत झाला; तो पाचव्या अनुसूचीतील अनुसूचित क्षेत्रांना लागू होतो, सहाव्या अनुसूचीला नाही; ग्रामसभेला लघु वनोपजावर मालकी हक्क देतो", "PESA हा 1996 मध्ये संमत झाला; तो पाचव्या व सहाव्या दोन्ही अनुसूचींतील क्षेत्रांना लागू होतो; ग्रामसभेला केवळ सल्लागार दर्जा देतो", "PESA हा एल.एम. सिंघवी समितीच्या शिफारशींवर 1993 मध्ये संमत झाला; तो फक्त पाचव्या अनुसूचीला लागू होतो; भूसंपादनापूर्वी ग्रामसभेचा सल्ला आवश्यक नाही", "PESA हा भुरिया समितीच्या शिफारशींवर 1996 मध्ये संमत झाला; तो पाचव्या अनुसूचीला लागू होतो; परंतु लघु वनोपजावरील मालकी जिल्हा परिषदेकडे ठेवतो"], "correct_index": 0, "explanation_marathi": "PESA भुरिया समिती (1995) → कायदा 24 डिसें. 1996, फक्त पाचव्या अनुसूचीतील (10 राज्ये) क्षेत्रांना लागू, सहाव्या अनुसूचीला नाही; कलम 4 नुसार ग्रामसभेला लघु वनोपजावर मालकी व भूसंपादनापूर्वी अनिवार्य सल्लामसलत आहे. पर्याय 1 सहाव्या अनुसूचीचा समावेश व केवळ सल्लागार म्हणणे चूक, पर्याय 2 समिती/वर्ष व सल्ला अनावश्यक म्हणणे चूक, पर्याय 3 मालकी ZP कडे म्हणणे चूक.", "evidence": "PESA Act, 1996 (24 Dec 1996); Dilip Singh Bhuria Committee Report 1995; Fifth Schedule Art 244(1) – 10 States; excludes Sixth Schedule areas"}, {"section": 7, "subtopic": "GDP मापन: GVA vs GDP व आधार वर्ष 2011-12", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या:\nI. बाजार किमतींवरील GDP = मूलभूत किमतींवरील GVA + उत्पादन कर (Product taxes) – उत्पादन अनुदाने (Product subsidies).\nII. राष्ट्रीय सांख्यिकी कार्यालय (NSO) सध्या 2011-12 या आधार वर्षावर GDP मालिका प्रसिद्ध करते.\nIII. GVA हे बाजार किमतींवर मोजले जाते आणि त्यात निव्वळ उत्पादन करांचा समावेश असतो.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements:\nI. GDP at market prices = GVA at basic prices + Product taxes – Product subsidies.\nII. The National Statistical Office (NSO) currently releases the GDP series with base year 2011-12.\nIII. GVA is measured at market prices and includes net product taxes.\nChoose the correct option:", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I बरोबर आहे कारण GDP(mp) = GVA(bp) + उत्पादन कर – उत्पादन अनुदान हेच NSO चे प्रमाणित समीकरण आहे; II बरोबर आहे कारण 2015 पासूनची नवीन मालिका 2011-12 आधार वर्षावर आहे (2004-05 जुने). III चूक आहे कारण GVA मूलभूत किमतींवर मोजतात, बाजारभावावर नाही. त्यामुळे III असलेले B, C, D पर्याय बाद होतात आणि II वगळणारा D देखील चूक ठरतो.", "evidence": "NSO National Accounts methodology – new series introduced Jan 2015 with base year 2011-12; SNA 2008: GDP at market prices = GVA at basic prices + product taxes – product subsidies"}, {"section": 7, "subtopic": "GST: 101वी दुरुस्ती व परिषद रचना", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): GST परिषदेचा कोणताही निर्णय उपस्थित व मतदान करणाऱ्या सदस्यांच्या भारित मतांच्या किमान तीन-चतुर्थांश बहुमताने घेतला जातो.\nकारण (R): GST परिषदेत केंद्राचा मतभार एक-तृतीयांश आणि राज्यांचा एकत्रित मतभार दोन-तृतीयांश असतो.", "q_english": "Assertion (A): Any decision of the GST Council requires a majority of at least three-fourths of the weighted votes of the members present and voting.\nReason (R): In the GST Council, the Centre has a weightage of one-third and the States collectively have a weightage of two-thirds.", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य आहे, R असत्य आहे.", "A असत्य आहे, R सत्य आहे."], "correct_index": 0, "explanation_marathi": "A सत्य आहे (कलम 279A(9) नुसार 3/4 भारित बहुमत) आणि R सत्य आहे (केंद्र 1/3, राज्ये 2/3). R हेच भारित मतदानाचे सूत्र स्पष्ट करते ज्यावर 3/4 चा नियम आधारित आहे, म्हणून R हे A चे योग्य स्पष्टीकरण आहे. त्यामुळे केवळ स्पष्टीकरण नाकारणारा B, तसेच एक विधान चूक ठरवणारे C व D बाद होतात.", "evidence": "101st Constitutional Amendment Act 2016; Article 279A(9) – GST Council voting: Centre 1/3 weight, States 2/3 weight, decision by 3/4 majority of weighted votes present and voting"}, {"section": 7, "subtopic": "NITI आयोग vs नियोजन आयोग", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): NITI आयोगाकडे नियोजन आयोगाप्रमाणे केंद्रीय योजनानिधी राज्यांना वाटप करण्याचे अधिकार नाहीत.\nकारण (R): NITI आयोगाची स्थापना 1 जानेवारी 2015 रोजी केंद्रीय मंत्रिमंडळ ठरावाने (15 मार्च 1950 चा ठराव रद्द करून) करण्यात आली असून ते सहकारी संघराज्यवादावर आधारित धोरणात्मक विचारमंच (थिंक-टँक) म्हणून काम करते.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): NITI Aayog does not have the power to allocate Central plan funds to states as the Planning Commission did.\nReason (R): NITI Aayog was established on 1 January 2015 by a Cabinet Resolution (superseding the Resolution dated 15 March 1950) and functions as a policy think-tank based on cooperative federalism.\nChoose the correct option:", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य आहे, परंतु R असत्य आहे.", "A असत्य आहे, परंतु R सत्य आहे."], "correct_index": 0, "explanation_marathi": "A सत्य: निधी वाटपाचे अधिकार आता अर्थ मंत्रालयाकडे आहेत, NITI कडे नाहीत. R सत्य: 1 जाने. 2015 चा ठराव (1950 चा ठराव रद्द) आणि सहकारी संघराज्यवाद-आधारित थिंक-टँक हे स्वरूप अचूक आहे. R मधील 'सल्लागार विचारमंच' हेच निधी वाटप नसण्याचे कारण स्पष्ट करते, म्हणून R हे A चे योग्य स्पष्टीकरण आहे; पर्याय 1 स्पष्टीकरण नाकारतो म्हणून चूक, 2-3 तथ्यांविरुद्ध.", "evidence": "Cabinet Secretariat Resolution 1 Jan 2015 (superseding Res. No.1-P(C)/50 dated 15 March 1950); NITI Aayog mandate: policy think-tank, no fund-allocation powers (vs Planning Commission top-down allocator)"}, {"section": 7, "subtopic": "RBI कार्ये: CRR-SLR-OMO", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nअ. CRR (रोख राखीव प्रमाण)\nब. SLR (वैधानिक तरलता प्रमाण)\nक. OMO (खुल्या बाजारातील व्यवहार)\nड. बँक दर (Bank Rate)\n\n1. NDTL च्या ठराविक टक्केवारीइतकी रक्कम RBI कडे रोख स्वरूपात ठेवणे; यावर व्याज दिले जात नाही\n2. NDTL च्या ठराविक टक्केवारीइतकी रक्कम बँकेनेच स्वतःकडे रोख, सोने व मान्यताप्राप्त शासकीय रोख्यांच्या स्वरूपात ठेवणे\n3. शासकीय रोख्यांची खुल्या बाजारात खरेदी-विक्री करून अर्थव्यवस्थेतील तरलता व चलनपुरवठ्याचे समायोजन\n4. तारण न ठेवता RBI कडून घेतल्या जाणाऱ्या दीर्घकालीन कर्जावरील दर; यात रोख्यांची पुनर्खरेदी होत नाही", "q_english": "Match the pairs:\nA. CRR (Cash Reserve Ratio)\nB. SLR (Statutory Liquidity Ratio)\nC. OMO (Open Market Operations)\nD. Bank Rate\n\n1. Certain percentage of NDTL to be kept in cash with RBI; no interest is paid on it\n2. Certain percentage of NDTL to be maintained by the bank itself in cash, gold and approved government securities\n3. Purchase and sale of government securities in the open market to adjust liquidity and money supply\n4. Rate charged by RBI on long-term loans without collateral; involves no repurchase of securities", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-2, क-4, ड-3", "अ-1, ब-3, क-2, ड-4"], "correct_index": 0, "explanation_marathi": "अ-1, ब-2, क-3, ड-4 हेच बरोबर आहे. CRR मध्ये रक्कम RBI कडे रोख ठेवली जाते तर SLR मध्ये बँक स्वतःकडे द्रवरूप मालमत्ता ठेवते — हा फरक न ओळखल्याने पर्याय 2 चूकतो. OMO म्हणजे रोख्यांची खरेदी-विक्री तर बँक दर म्हणजे दीर्घकालीन कर्जदर — त्यांची अदलाबदल केल्याने पर्याय 3 चूकतो. पर्याय 4 मध्ये SLR ला OMO समजण्याची चूक आहे.", "evidence": "RBI Act, 1934 - कलम 42(1) (CRR); Banking Regulation Act, 1949 - कलम 24 (SLR); RBI Monetary Policy Framework - OMO व Bank Rate व्याख्या"}, {"section": 7, "subtopic": "अर्थसंकल्प प्रक्रिया: हॅलवा ते डिजिटल", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nअ. हॅलवा समारंभ\nब. रेल्वे अर्थसंकल्पाचे विलीनीकरण\nक. 1 फेब्रुवारीला अर्थसंकल्प सादरीकरण\nड. पेपरलेस डिजिटल अर्थसंकल्प\n\n1. 2021-22 पासून पहिला पूर्णतः कागदविरहित अर्थसंकल्प (Union Budget Mobile App)\n2. 2017-18 पासून सामान्य अर्थसंकल्पात विलीनीकरण (बिबेक देबरॉय समिती शिफारस, 92 वर्षांची परंपरा समाप्त)\n3. नॉर्थ ब्लॉक तळघरातील छपाई/तयारीच्या गोपनीय 'लॉक-इन' टप्प्याच्या प्रारंभाची परंपरा\n4. 2017-18 पासून 28 फेब्रुवारीऐवजी लवकर सादरीकरण (योजनाबद्ध खर्चास वेळ मिळावा)\nयोग्य कोड निवडा:", "q_english": "Match the pairs:\nA. Halwa ceremony\nB. Merger of Railway Budget\nC. Budget presentation on 1st February\nD. Paperless Digital Budget\n\n1. First fully paperless Budget from 2021-22 (Union Budget Mobile App)\n2. Merger into General Budget from 2017-18 (Bibek Debroy Committee, end of 92-year tradition)\n3. Tradition marking beginning of confidential 'lock-in' phase of printing/preparation in North Block basement\n4. Early presentation from 2017-18 instead of 28th February (to allow time for planned spending)\nChoose the correct code:", "options": ["अ-3, ब-2, क-4, ड-1", "अ-3, ब-2, क-1, ड-4", "अ-4, ब-3, क-2, ड-1", "अ-3, ब-4, क-2, ड-1"], "correct_index": 0, "explanation_marathi": "अ-3 (हॅलवा = लॉक-इन प्रारंभाची परंपरा), ब-2 (रेल्वे विलीनीकरण 2017-18, देबरॉय समिती), क-4 (1 फेब्रुवारी सादरीकरण 2017-18 पासून), ड-1 (पेपरलेस 2021-22) हेच बरोबर आहे. पर्याय 1 मध्ये क-ड ची वर्षे अदलाबदल केली आहेत, पर्याय 2 व 3 मध्ये ब-क च्या जोड्या आणि वर्षांचा गोंधळ आहे.", "evidence": "PIB: हॅलवा समारंभ - लॉक-इन; केंद्रीय मंत्रिमंडळ निर्णय 2016: रेल्वे विलीनीकरण + 1 फेब्रुवारी सादरीकरण 2017-18 पासून; बिबेक देबरॉय समिती (NITI आयोग); अर्थसंकल्प 2021-22 पहिला पेपरलेस"}, {"section": 7, "subtopic": "उद्योग: MSME व्याख्या 2020 सुधारित", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "1 जुलै 2020 पासून लागू झालेल्या MSME च्या सुधारित व्याख्येतील दोन संकल्पना — (i) गुंतवणूक मर्यादा व (ii) उलाढाल मर्यादा — एकत्रितपणे विचारात घ्या. उत्पादन व सेवा क्षेत्रासाठी एकत्रित संमिश्र निकषानुसार खालीलपैकी कोणता पर्याय सूक्ष्म, लघु व मध्यम उद्योगांची अचूक मर्यादा दर्शवतो?", "q_english": "Consider together the two concepts of the revised MSME definition effective from 1 July 2020 — (i) investment limit and (ii) turnover limit. Under the composite criteria merging manufacturing and services, which option correctly shows the limits for Micro, Small and Medium enterprises (Investment / Turnover)?", "options": ["सूक्ष्म: 1 कोटी / 5 कोटी; लघु: 10 कोटी / 50 कोटी; मध्यम: 50 कोटी / 250 कोटी", "सूक्ष्म: 1 कोटी / 5 कोटी; लघु: 5 कोटी / 50 कोटी; मध्यम: 10 कोटी / 100 कोटी", "सूक्ष्म: 2 कोटी / 10 कोटी; लघु: 10 कोटी / 50 कोटी; मध्यम: 50 कोटी / 250 कोटी", "सूक्ष्म: 1 कोटी / 10 कोटी; लघु: 10 कोटी / 100 कोटी; मध्यम: 50 कोटी / 250 कोटी"], "correct_index": 0, "explanation_marathi": "2020 सुधारणेनुसार अचूक मर्यादा — सूक्ष्म: 1/5 कोटी, लघु: 10/50 कोटी, मध्यम: 50/250 कोटी — हीच पर्याय 1 मध्ये आहे. पर्याय 2 मध्ये 2006 च्या जुन्या गुंतवणूक मर्यादा (5, 10 कोटी) दिल्या आहेत. पर्याय 3 मध्ये सूक्ष्मची मर्यादा वाढवून जवळचा गोंधळ निर्माण केला आहे. पर्याय 4 मध्ये उलाढाल मर्यादा चुकीने वाढवल्या आहेत; तसेच 2020 पासून उत्पादन-सेवा भेद रद्द होऊन संमिश्र निकष लागतो.", "evidence": "MSME मंत्रालय अधिसूचना दि. 1 जून 2020, अंमलबजावणी 1 जुलै 2020; आत्मनिर्भर भारत पॅकेज (13 मे 2020) - संमिश्र निकष"}, {"section": 7, "subtopic": "दारिद्र्य: तेंडुलकर vs रंगराजन रेषा", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): रंगराजन समितीने (अहवाल 2014) 2011-12 साठी तेंडुलकर समितीची दारिद्र्य रेषा वाढवून ग्रामीण भागासाठी दरडोई दरमहा रु. 816 वरून रु. 972 आणि शहरी भागासाठी रु. 1000 वरून रु. 1407 केली.\nपरिणाम (R): त्यामुळे 2011-12 मधील दारिद्र्याचे प्रमाण तेंडुलकर मापनातील 21.9% वरून रंगराजन मापनात सुमारे 29.5% पर्यंत वाढले.\nA आणि R यांतील कारण-परिणाम संबंध ओळखा.", "q_english": "Cause (A): The Rangarajan Committee (Report 2014) raised the Tendulkar Committee's poverty line for 2011-12 from Rs. 816 to Rs. 972 per capita per month for rural areas and from Rs. 1000 to Rs. 1407 for urban areas.\nEffect (R): Consequently, the poverty ratio for 2011-12 rose from 21.9% under Tendulkar measurement to about 29.5% under Rangarajan measurement.\nIdentify the cause-effect relationship between A and R.", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चा तार्किक परिणाम / योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण / परिणाम नाही.", "A सत्य आहे, परंतु R असत्य आहे.", "A असत्य आहे, परंतु R सत्य आहे."], "correct_index": 0, "explanation_marathi": "A सत्य आहे कारण रंगराजन अहवालाने तेंडुलकर रेषेपेक्षा सुमारे 19% जास्त रेषा सुचवली (ग्रामीण 972, शहरी 1407). R सत्य आहे कारण उंच रेषेमुळे हेडकाउंट वाढून दारिद्र्य 21.9% वरून 29.5% झाले, म्हणजे R हा A चा थेट परिणाम आहे. म्हणून पर्याय 1 स्पष्टीकरण नाकारल्याने चूक, पर्याय 2 व 3 तथ्यांविरुद्ध आहेत.", "evidence": "तेंडुलकर समिती अहवाल 2009; रंगराजन समिती अहवाल जुलै 2014; 2011-12: ग्रामीण रु.816 ते रु.972, शहरी रु.1000 ते रु.1407; दारिद्र्य प्रमाण 21.9% vs 29.5% (नियोजन आयोग/NITI)"}, {"section": 7, "subtopic": "परकीय व्यापार: CAD व 2025 निर्यात", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "परकीय व्यापाराच्या संदर्भात खालील विधाने विचारात घ्या:\nI. चालू खात्यातील तूट (CAD) = वस्तू व सेवा व्यापारातील निव्वळ शिल्लक + प्राथमिक उत्पन्नाचा निव्वळ प्रवाह + दुय्यम उत्पन्नाचा निव्वळ प्रवाह.\nII. CAD मधील तूट नेहमीच अर्थव्यवस्थेसाठी हानिकारक असते, कारण ती पूर्णपणे परकीय कर्जाद्वारेच भरून काढली जाते.\nIII. 2024-25 मध्ये भारताची एकूण वस्तू व सेवा निर्यात सुमारे 825 अब्ज डॉलरच्या विक्रमी पातळीवर पोहोचली.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements on foreign trade:\nI. Current Account Deficit (CAD) = Net balance of goods and services trade + Net primary income + Net secondary income.\nII. A CAD is always harmful for the economy because it is financed entirely through external debt.\nIII. In 2024-25, India's total merchandise and services exports reached a record level of about USD 825 billion.\nChoose the correct option:", "options": ["फक्त I बरोबर", "I आणि III बरोबर", "II आणि III बरोबर", "I, II आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "I बरोबर आहे — हेच चालू खात्याचे प्रमाणित घटक आहेत. III बरोबर आहे — वाणिज्य मंत्रालयानुसार 2024-25 मध्ये एकूण निर्यात ~824.9 अब्ज डॉलर झाली. II चूक आहे — CAD थेट परकीय गुंतवणूक (FDI), पोर्टफोलिओ गुंतवणूक आदी भांडवली प्रवाहांनीही भरतो आणि मर्यादित CAD गुंतवणूक-वृद्धी दर्शवू शकतो. त्यामुळे फक्त I मानणारा, II समाविष्ट करणारे पर्याय चुकतात.", "evidence": "RBI Balance of Payments Manual (CAD घटक); वाणिज्य व उद्योग मंत्रालय पत्रक - मे 2025 (2024-25 एकूण निर्यात $824.9 अब्ज); RBI Annual Report 2024-25 (CAD 0.6% of GDP)"}, {"section": 7, "subtopic": "बँक राष्ट्रीयीकरण 1969 vs 1980", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 19 जुलै 1969 रोजी 14 प्रमुख व्यापारी बँकांचे राष्ट्रीयीकरण करण्यात आले.\nकारण (R): एप्रिल 1980 मध्ये ज्या 6 बँकांचे राष्ट्रीयीकरण करण्यात आले, त्यांच्यासाठी ठेवींची किमान मर्यादा 1969 प्रमाणेच 50 कोटी रुपये होती.", "q_english": "Assertion (A): On 19 July 1969, 14 major commercial banks were nationalised.\nReason (R): For the 6 banks nationalised in April 1980, the minimum deposit threshold was the same as in 1969, i.e., Rs. 50 crore.", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे, परंतु R असत्य आहे", "A असत्य आहे, परंतु R सत्य आहे"], "correct_index": 2, "explanation_marathi": "A सत्य आहे — 1969 मध्ये 50 कोटी रुपयांपेक्षा जास्त ठेवी असलेल्या 14 बँकांचे राष्ट्रीयीकरण झाले. परंतु R असत्य आहे — 1980 मध्ये मर्यादा 50 कोटी नव्हे तर 200 कोटी रुपये होती, एकूण 20 बँका झाल्या. त्यामुळे पर्याय 1 व 2 (दोन्ही सत्य मानणारे) आणि पर्याय 4 (A असत्य मानणारा) चुकतात.", "evidence": "Banking Companies (Acquisition and Transfer of Undertakings) Act, 1970 (14 banks, >Rs.50 crore) व 1980 Act (6 banks, >Rs.200 crore); तारीख: 19 जुलै 1969 व 15 एप्रिल 1980"}, {"section": 7, "subtopic": "बेरोजगारी: PLFS व ओकुन नियम", "qtype": "कारण-परिणाम", "q_marathi": "खालील दोन विधाने विचारात घ्या:\nकारण (C): NSO ने 2017-18 पासून सुरू केलेले नियतकालिक कामगार दल सर्वेक्षण (PLFS) बेरोजगारी मोजण्यासाठी नेहमीची स्थिती (Usual Status) व चालू साप्ताहिक स्थिती (CWS) या दोन्ही दृष्टिकोनांचा वापर करते.\nपरिणाम (E): ओकुनच्या नियमानुसार बेरोजगारी दरात 1 टक्का बिंदू वाढ झाल्यास संभाव्य उत्पादनाच्या तुलनेत वास्तविक GDP मध्ये सुमारे 2 टक्के घट होते.", "q_english": "Consider the following two statements:\nCause (C): The Periodic Labour Force Survey (PLFS) launched by NSO since 2017-18 uses both Usual Status and Current Weekly Status (CWS) approaches to measure unemployment.\nEffect (E): According to Okun's law, a 1 percentage-point rise in the unemployment rate is associated with about a 2% fall in real GDP relative to potential output.", "options": ["C आणि E दोन्ही बरोबर, आणि C हे E चे योग्य स्पष्टीकरण आहे.", "C आणि E दोन्ही बरोबर, परंतु C हे E चे योग्य स्पष्टीकरण नाही.", "C बरोबर, E चूक.", "C चूक, E बरोबर."], "correct_index": 1, "explanation_marathi": "C सत्य आहे (PLFS 2017-18 पासून NSO कडून, US व CWS दोन्ही वापरते) आणि E सत्य आहे (ओकुन 1962 नुसार सुमारे 2% नाते). परंतु C हा E चा कार्यकारण खुलासा नाही; दोन्ही स्वतंत्र संकल्पना आहेत. म्हणून स्पष्टीकरण दावा करणारा A चूक, आणि एक विधान चूक ठरवणारे C व D चूक ठरतात.", "evidence": "NSO Periodic Labour Force Survey (PLFS) launched 2017-18 – Usual Status (ps+ss) and Current Weekly Status; Okun's Law (1962) – 1 pp rise in unemployment ≈ 2% fall in output gap"}, {"section": 7, "subtopic": "महागाई: CPI vs WPI व RBI लक्ष्य 4%", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्ता अभ्यासा आणि अचूक विधान ओळखा:\n| निर्देशांक | आधार वर्ष | प्रकाशित करणारी संस्था | RBI चे चलनधोरण लक्ष्य |\n|---|---|---|---|\n| CPI (संयुक्त) | 2012 | NSO | होय (4% ± 2%) |\n| WPI | 2011-12 | DPIIT (आर्थिक सल्लागार कार्यालय) | नाही |", "q_english": "Study the following table and identify the correct statement:\n| Index | Base year | Compiling agency | RBI monetary policy target |\n|---|---|---|---|\n| CPI (Combined) | 2012 | NSO | Yes (4% ± 2%) |\n| WPI | 2011-12 | DPIIT (Office of Economic Adviser) | No |", "options": ["CPI चे आधार वर्ष 2012 असून NSO प्रसिद्ध करते व तेच RBI चे लक्ष्य आहे (4% ± 2%); WPI चे आधार वर्ष 2011-12 असून DPIIT प्रसिद्ध करते.", "CPI चे आधार वर्ष 2011-12 असून DPIIT प्रसिद्ध करते व तेच RBI चे लक्ष्य आहे; WPI चे आधार वर्ष 2012 असून NSO प्रसिद्ध करते.", "CPI व WPI दोन्हींचे आधार वर्ष 2011-12 असून दोन्ही NSO प्रसिद्ध करते; RBI चे लक्ष्य WPI वर आधारित आहे.", "CPI चे आधार वर्ष 2012 असून DPIIT प्रसिद्ध करते; WPI चे आधार वर्ष 2012 असून NSO प्रसिद्ध करते व RBI चे लक्ष्य WPI आहे."], "correct_index": 0, "explanation_marathi": "तक्त्यानुसार CPI-2012/NSO/RBI लक्ष्य आणि WPI-2011-12/DPIIT हे एकमेव अचूक संयोजन आहे. पर्याय B मध्ये आधार वर्षे व संस्था परस्पर बदलल्या आहेत, पर्याय C मध्ये दोन्ही NSO कडे दिले व RBI लक्ष्य WPI ला जोडले हे चूक आहे, पर्याय D मध्ये संस्था उलट्या केल्या व लक्ष्य WPI ला दिले म्हणून चूक.", "evidence": "RBI Monetary Policy Framework Agreement 2015 / RBI Act amendment 2016 – CPI inflation target 4% with ±2% band; NSO CPI base 2012; DPIIT (Office of Economic Adviser) WPI base 2011-12"}, {"section": 7, "subtopic": "महाराष्ट्र कृषी: साखर vs कापूस अर्थशास्त्र", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्ता विचारात घ्या:\n| बाब | (अ) ऊस / साखर | (ब) कापूस |\n| पाण्याची गरज | ~2000-2500 मिमी (अति-जलसघन) | ~600-800 मिमी (प्रामुख्याने कोरडवाहू) |\n| किंमत धोरण | केंद्राचा FRP (उचित व लाभकारी किंमत) | केंद्राचा MSP (A2+FL च्या 1.5 पट निकष) |\n| महाराष्ट्रातील प्रमुख पट्टा | पश्चिम महाराष्ट्र (सहकारी साखर साखळी) | विदर्भ-मराठवाडा |\n| महाराष्ट्राचे स्थान | साखर उत्पादनात UP सोबत प्रथम/द्वितीय स्पर्धा | कापूस क्षेत्रात देशात प्रथम, उत्पादकता गुजरातपेक्षा कमी |\nतक्त्यावरून कोणता निष्कर्ष तार्किकदृष्ट्या सर्वात योग्य आहे?", "q_english": "Consider the following table:\n| Parameter | (A) Sugarcane / Sugar | (B) Cotton |\n| Water requirement | ~2000-2500 mm (highly water-intensive) | ~600-800 mm (mainly rainfed) |\n| Price policy | Centre's FRP (Fair and Remunerative Price) | Centre's MSP (1.5 times A2+FL norm) |\n| Major belt in Maharashtra | Western Maharashtra (cooperative sugar chain) | Vidarbha-Marathwada |\n| Maharashtra's position | Competes with UP for 1st/2nd in sugar output | 1st in cotton area in India, productivity lower than Gujarat |\nWhich inference from the table is logically most correct?", "options": ["ऊस कमी पाण्यात येणारा रोख पीक असल्याने मराठवाड्यातील दुष्काळी भागात साखर पट्ट्याचा विस्तार करणे जलशास्त्रदृष्ट्या योग्य आहे.", "कापसाचे अर्थशास्त्र पूर्णपणे सिंचनावर अवलंबून असल्याने विदर्भातील कोरडवाहू शेतीत कापूस आर्थिकदृष्ट्या परवडत नाही.", "ऊसाला FRP-आधारित निश्चित उत्पन्न व सहकारी साखर साखळीचा आधार असल्याने पश्चिम महाराष्ट्रात प्राधान्य मिळते, तर MSP-आधारित पण हवामान-जोखमीचे कापूस अर्थशास्त्र विदर्भ-मराठवाड्यातील कोरडवाहू शेतीशी जुळते.", "दोन्ही पिकांना समान MSP हमी असल्याने शेतकरी केवळ पाण्याच्या उपलब्धतेनुसार पीक निवडतात; किंमत धोरणाचा प्रदेश-निवडीवर परिणाम होत नाही."], "correct_index": 2, "explanation_marathi": "पर्याय 2 बरोबर: तक्त्यातील पाणी + किंमत + प्रदेश यांची सांगड घालतो - जलसघन ऊस + FRP + सहकार = प. महाराष्ट्र; कोरडवाहू कापूस + MSP + जोखीम = विदर्भ/मराठवाडा. पर्याय 0 चूक (ऊस कमी पाण्यात येतो हे उलट आहे), पर्याय 1 चूक (कापूस प्रामुख्याने कोरडवाहू, पूर्ण सिंचनावलंबी नाही), पर्याय 3 चूक (ऊसाला MSP नाही, FRP आहे).", "evidence": "CACP / कृषी मंत्रालय: ऊस-FR P, कापूस-MSP (2018 पासून A2+FL च्या 1.5 पट); कृषी विभाग: ऊस ~2000 मिमी पाणी; Cotton Corporation: महाराष्ट्र कापूस क्षेत्रात प्रथम, उत्पादकता गुजरातपेक्षा कमी"}, {"section": 7, "subtopic": "लोकसंख्या लाभांश व अवलंबित्व गुणोत्तर", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या:\nविधान I: अवलंबित्व गुणोत्तर = [0-14 वयोगट + 60 वर्षांवरील (UN मानकात 65+)] / [15-59 (UN मानकात 15-64)] x 100; या गुणोत्तरात घट होणे हे लोकसंख्या लाभांशाच्या प्रारंभाचे लक्षण आहे.\nविधान II: भारत सध्या लाभांश टप्प्यात आहे - 15-64 वयोगटाचा हिस्सा सुमारे 67-68%, मध्यम वय सुमारे 28 वर्षे, आणि ही खिडकी सुमारे 2005-2055 पर्यंत खुली राहील असा अंदाज आहे.\nविधान III: अवलंबित्व गुणोत्तर वाढणे नेहमीच विकासासाठी हानिकारक असते, कारण वृद्ध-अवलंबित्व वाढल्यास बचत दर आपोआप वाढतो.\nकोणती विधाने बरोबर आहेत?", "q_english": "Consider the following statements:\nStatement I: Dependency ratio = [0-14 age group + 60+ (65+ in UN standard)] / [15-59 (15-64 in UN standard)] x 100; a decline in this ratio marks the onset of demographic dividend.\nStatement II: India is currently in the dividend phase - share of 15-64 age group about 67-68%, median age about 28 years, and this window is estimated to remain open roughly from 2005 to 2055.\nStatement III: A rise in dependency ratio is always harmful for growth, because a rise in old-age dependency automatically raises the savings rate.\nWhich statements are correct?", "options": ["I, II आणि III सर्व बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "I बरोबर: व्याख्या अचूक असून गुणोत्तर घटणे म्हणजे कार्यशील लोकसंख्येचा हिस्सा वाढणे. II बरोबर: वयोरचना व 2005-2055 खिडकीचा अंदाज तथ्यांशी जुळतो. III चूक: 'नेहमीच हानिकारक' हे अति-सामान्यीकरण असून वृद्धावलंबित्व वाढल्यास जीवन-चक्र गृहीतकानुसार बचत दर घटतो, वाढत नाही. म्हणून III समाविष्ट असलेले पर्याय 0, 2, 3 चूक.", "evidence": "UN World Population Prospects: dependency = (0-14 + 65+)/15-64 x 100; Economic Survey / Census: median age ~28, working-age ~68%; UNFPA: dividend window ~2005-2055"}, {"section": 7, "subtopic": "वित्तीय तूट: FRBM लक्ष्य व 2026 स्थिती", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nस्तंभ-I: (a) FRBM कायदा संमत वर्ष, (b) एन. के. सिंग समितीची वित्तीय तूट शिफारस, (c) केंद्रीय अर्थसंकल्प 2025-26 मधील वित्तीय तूट लक्ष्य, (d) FRBM पुनरावलोकनातील एकूण कर्ज लक्ष्य (केंद्र + राज्य)\nस्तंभ-II: (i) GDP च्या 4.4%, (ii) 2003, (iii) GDP च्या 60%, (iv) GDP च्या 2.5% पर्यंत घट (2022-23 पर्यंत)", "q_english": "Match the pairs:\nColumn-I: (a) Year of enactment of FRBM Act, (b) N. K. Singh Committee recommendation on fiscal deficit, (c) Fiscal deficit target in Union Budget 2025-26, (d) Total debt target (Centre + States) in FRBM review\nColumn-II: (i) 4.4% of GDP, (ii) 2003, (iii) 60% of GDP, (iv) Reduction to 2.5% of GDP (by 2022-23)", "options": ["(a)-ii, (b)-iv, (c)-i, (d)-iii", "(a)-ii, (b)-iv, (c)-iii, (d)-i", "(a)-ii, (b)-i, (c)-iv, (d)-iii", "(a)-ii, (b)-iii, (c)-i, (d)-iv"], "correct_index": 0, "explanation_marathi": "(a)-ii बरोबर (2003 कायदा, 2004 पासून लागू), (b)-iv बरोबर (सिंग समितीने 2.5% शिफारस), (c)-i बरोबर (2025-26 अर्थसंकल्पात 4.4%), (d)-iii बरोबर (एकूण कर्ज 60%: केंद्र 40% + राज्य 20%). B मध्ये (c)-(d) अदलाबदल केली, C मध्ये (b)-(c) अदलाबदल केली, D मध्ये (b)-(d) अदलाबदल केली म्हणून तिन्ही चूक.", "evidence": "FRBM Act 2003 (effective 2004); N. K. Singh FRBM Review Committee Report 2017; Union Budget 2025-26 – fiscal deficit target 4.4% of GDP for FY2025-26"}, {"section": 7, "subtopic": "शेती पत: KCC व MSP 23 पिके", "qtype": "कालक्रम लावा", "q_marathi": "शेती पत व मूल्य धोरणातील खालील घटनांचा योग्य कालक्रम लावा:\nअ. कृषी मूल्य आयोगाची (APC) स्थापना\nब. नाबार्डची (NABARD) स्थापना\nक. APC चे कृषी खर्च व मूल्य आयोग (CACP) मध्ये नामांतर\nड. किसान क्रेडिट कार्ड (KCC) योजनेचा प्रारंभ", "q_english": "Arrange the following events in agricultural credit and price policy in correct chronological order:\nA. Establishment of Agricultural Prices Commission (APC)\nB. Establishment of NABARD\nC. Renaming of APC as Commission for Agricultural Costs and Prices (CACP)\nD. Launch of Kisan Credit Card (KCC) scheme", "options": ["अ → ब → क → ड", "अ → क → ब → ड", "अ → ब → ड → क", "ब → अ → क → ड"], "correct_index": 0, "explanation_marathi": "योग्य क्रम अ(1965) → ब(1982) → क(1985) → ड(1998) आहे. नाबार्ड (1982) व CACP नामांतर (1985) यांची वर्षे जवळ असल्याने पर्याय 2 मध्ये गोंधळ होतो. KCC 1998 मध्ये आले, त्यामुळे तो क नंतरच येतो — पर्याय 3 चूकतो. APC ही सर्वांत जुनी (1965) घटना असल्याने ब पासून सुरू होणारा पर्याय 4 चूकतो.", "evidence": "APC स्थापना - जानेवारी 1965; NABARD स्थापना - 12 जुलै 1982 (शिवरामन समिती); APC ते CACP नामांतर - 1985; KCC योजना - केंद्रीय अर्थसंकल्प 1998-99"}, {"section": 8, "subtopic": "आम्ल-अल्क: pH स्केल व बफर", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना (1): pH = -log10[H+]; त्यामुळे pH स्केल लॉगरिदमिक आहे — pH मध्ये 1 एककाचा बदल म्हणजे [H+] मध्ये 10 पट बदल. संकल्पना (2): रक्ताचा pH 7.4 हा H2CO3 (pKa ≈ 6.1)/HCO3- बफर (Henderson-Hasselbalch समीकरण) द्वारे राखला जातो; CO2 वाढल्यास H2CO3 वाढून pH घटतो. एका रुग्णात अल्व्होलर हायपोव्हेंटिलेशनमुळे रक्त pH 7.4 वरून 7.1 झाला. या दोन्ही संकल्पना एकत्र वापरून योग्य निष्कर्ष ओळखा.", "q_english": "Concept (1): pH = -log10[H+]; hence pH scale is logarithmic — 1 unit change in pH means 10-fold change in [H+]. Concept (2): Blood pH 7.4 is maintained by H2CO3 (pKa ≈ 6.1)/HCO3- buffer (Henderson-Hasselbalch equation); rise in CO2 raises H2CO3 and lowers pH. In a patient, alveolar hypoventilation drops blood pH from 7.4 to 7.1. Using both concepts together, identify the correct conclusion.", "options": ["[H+] जवळजवळ दुप्पट (10^0.3 ≈ 2 पट) वाढली; ही श्वसन आम्लता (respiratory acidosis) आहे आणि मूत्रपिंड HCO3- चे पुनर्शोषण/निर्मिती वाढवून भरपाई करते.", "[H+] दहापट वाढली; ही श्वसन आम्लता आहे आणि फुफ्फुसे HCO3- चे उत्सर्जन वाढवून भरपाई करतात.", "[H+] निम्म्याने घटली; ही चयापचय अल्कलता (metabolic alkalosis) आहे आणि बफर कार्य थांबते.", "[H+] 3 पट (0.3 × 10) वाढली; ही श्वसन आम्लता आहे परंतु हिमोग्लोबिन बफरचे योगदान नसते."], "correct_index": 0, "explanation_marathi": "ΔpH = 0.3 म्हणजे [H+] गुणोत्तर = 10^0.3 ≈ 2, म्हणून पर्याय 1 (दहापट) व 3 (3 पट) यांची गणना चूक; pH घटला म्हणजे [H+] वाढली म्हणून पर्याय 2 ची दिशा चूक. CO2 धारणा = श्वसन आम्लता असून भरपाई मूत्रपिंडाद्वारे (HCO3- धारणा) होते, फुफ्फुसाद्वारे HCO3- उत्सर्जन होत नाही म्हणून पर्याय 1 चूक; हिमोग्लोबिन महत्त्वाचा बफर असल्याने पर्याय 3 चूक.", "evidence": "Henderson (1908) – Hasselbalch (1916) समीकरण; Sorensen (1909) pH स्केल; NCERT इयत्ता 11 वी रसायनशास्त्र धडा-7 साम्य; Guyton Textbook of Medical Physiology (acid-base balance)."}, {"section": 8, "subtopic": "ऊर्जा: अणु vs सौर", "qtype": "कालक्रम लावा", "q_marathi": "ऊर्जा क्षेत्रातील खालील घटनांचा कालक्रम लावा:\nA) बेल लॅब्समध्ये पहिली व्यावहारिक सिलिकॉन सौर सेल जाहीर (25 एप्रिल 1954)\nB) ओबनिन्स्क (USSR) येथे जगातील पहिला अणुविद्युत प्रकल्प ग्रीडला जोडला (27 जून 1954)\nC) तारापूर – भारतातील पहिला अणुविद्युत प्रकल्प व्यावसायिकरीत्या कार्यान्वित (1969)\nD) जवाहरलाल नेहरू राष्ट्रीय सौर अभियान सुरू (11 जानेवारी 2010)\nयोग्य क्रम निवडा:", "q_english": "Arrange the following energy-sector events in chronological order:\nA) First practical silicon solar cell announced at Bell Labs (25 April 1954)\nB) World's first nuclear power plant connected to grid at Obninsk, USSR (27 June 1954)\nC) Tarapur – India's first nuclear power plant commissioned commercially (1969)\nD) Jawaharlal Nehru National Solar Mission launched (11 Jan 2010)\nChoose the correct sequence:", "options": ["A – B – C – D", "B – A – C – D", "A – B – D – C", "B – A – D – C"], "correct_index": 0, "explanation_marathi": "बेल लॅब्सची घोषणा (एप्रिल 1954) ही ओबनिन्स्क (जून 1954) पूर्वीची आहे, त्यामुळे B ने सुरू होणारे पर्याय 1 व 3 चूक ठरतात. तारापूर (1969) हे सौर अभियान (2010) पूर्वीचे आहे, त्यामुळे D ला C आधी ठेवणारे पर्याय 2 व 3 चूक ठरतात. म्हणून फक्त A-B-C-D हा क्रम बरोबर आहे.", "evidence": "US DOE History of Nuclear Energy – Obninsk 27 June 1954; Bell Labs Announcement 25 April 1954; DAE – Tarapur Commercial Operation 1969; MNRE – JNNSM Launch Document 11 Jan 2010"}, {"section": 8, "subtopic": "गती: न्यूटन नियम व घर्षण", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या: विधान (I): 5 kg वस्तुमानाच्या स्थिर वस्तूवर 20 N एवढे स्थिर निव्वळ बल 4 सेकंद लावल्यास वस्तूच्या संवेगात 80 kg·m/s वाढ होते व अंतिम वेग 16 m/s होतो (आवेग-संवेग सिद्धांत). विधान (II): क्षितिज पृष्ठभागावर ठेवलेल्या ठोकळ्यासाठी मर्यादित स्थितिक घर्षण fs(max) = μsN असते व ते दिसणाऱ्या संपर्क क्षेत्रफळावर अवलंबून नसते; प्रयुक्त क्षितिज बल < fs(max) असल्यास ठोकळा स्थिर राहतो व घर्षण बल प्रयुक्त बलाएवढेच असते, तर गतिज घर्षण सामान्यपणे मर्यादित स्थितिक घर्षणापेक्षा कमी असते. विधान (III): घोडा गाडी ओढतो तेव्हा घोड्याने गाडीवर लावलेली क्रिया व गाडीने घोड्यावर लावलेली प्रतिक्रिया एकाच वस्तूवर कार्य करतात, त्यामुळे त्या एकमेकांना निष्प्रभ करतात व न्यूटनच्या तिसऱ्या नियमामुळे गाडी गतिमान होऊ शकत नाही. वरीलपैकी योग्य पर्याय निवडा.", "q_english": "Consider the statements: Statement (I): A constant net force of 20 N acting for 4 s on a 5 kg stationary object increases its momentum by 80 kg·m/s and final velocity becomes 16 m/s (impulse-momentum theorem). Statement (II): For a block on horizontal surface, limiting static friction fs(max)=μsN is independent of apparent contact area; if applied horizontal force < fs(max), block remains static and friction equals applied force, while kinetic friction is generally less than limiting static friction. Statement (III): When horse pulls cart, action by horse on cart and reaction by cart on horse act on same body, so they cancel each other and by Newton's third law cart cannot move. Choose correct option.", "options": ["I, II आणि III सर्व सत्य आहेत.", "I आणि II सत्य आहेत, III असत्य आहे.", "II आणि III सत्य आहेत, I असत्य आहे.", "I आणि III सत्य आहेत, II असत्य आहे."], "correct_index": 1, "explanation_marathi": "I सत्य आहे कारण आवेग J=F·Δt=80 N·s=Δp, v=Δp/m=16 m/s. II सत्य आहे कारण Amontons-Coulomb नियमानुसार fs(max)=μsN क्षेत्रफळनिरपेक्ष असते व μk<μs सामान्यतः. III असत्य आहे कारण क्रिया-प्रतिक्रिया वेगवेगळ्या वस्तूंवर (घोडा-गाडी, घोडा-जमीन) कार्य करतात, एकाच वस्तूवर नाही, त्यामुळे निष्प्रभ होत नाहीत; म्हणून 0, 2, 3 पर्याय चूक.", "evidence": "Newton – Philosophiae Naturalis Principia Mathematica (1687); Amontons-Coulomb घर्षण नियम; NCERT इयत्ता 11 वी भौतिकशास्त्र धडा-4 गतीचे नियम."}, {"section": 8, "subtopic": "चुंबकत्व: विद्युतचुंबक vs स्थायी", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): विद्युतप्रवाह खंडित करताच मऊ लोखंडाचा गाभा असलेल्या विद्युतचुंबकाचे चुंबकत्व जवळजवळ पूर्णपणे नष्ट होते.\nकारण (R): मऊ लोखंडाची धारणशीलता (retentivity) व निग्रहिता (coercivity) कमी असते, तर पोलादाची धारणशीलता जास्त असते; म्हणून पोलाद स्थायी चुंबकासाठी तर मऊ लोखंड विद्युतचुंबकासाठी वापरतात.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): As soon as electric current is switched off, an electromagnet with a soft-iron core loses its magnetism almost completely.\nReason (R): Soft iron has low retentivity and low coercivity, whereas steel has high retentivity; hence steel is used for permanent magnets and soft iron for electromagnets.\nChoose the correct option:", "options": ["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर; R चूक", "A चूक; R बरोबर"], "correct_index": 0, "explanation_marathi": "A बरोबर आहे कारण कमी धारणशीलतेमुळे प्रवाह बंद होताच गाभा चुंबकत्व टिकवू शकत नाही आणि R देखील बरोबर आहे कारण मऊ लोखंड vs पोलाद यांचा धारणशीलता/निग्रहितेतील फरक हेच स्पष्ट करतो. R हेच A चे कारण असल्याने स्पष्टीकरण नाकारणारा पर्याय 1, R चूक म्हणणारा पर्याय 2 आणि A चूक म्हणणारा पर्याय 3 तिन्ही चूक ठरतात.", "evidence": "NCERT Class 12 Physics Chapter 5 – Magnetism and Matter (2023-24) – retentivity and coercivity, soft iron vs steel"}, {"section": 8, "subtopic": "धातू: गंज vs मिश्रधातू", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: (1) कोरडी हवा (निर्जल CaCl2) + लोखंडी खिळा → 7 दिवसांनंतर गंज नाही (2) उकळलेले ऊर्ध्वपातित पाणी + तेलाचा थर (हवा नाही) + लोखंडी खिळा → गंज नाही (3) सामान्य पाणी + हवा + लोखंडी खिळा → तपकिरी गंज (Fe2O3·xH2O) (4) सामान्य पाणी + हवा + स्टेनलेस स्टील खिळा → गंज नाही. या तक्त्यावरून गंज व मिश्रधातूबाबत कोणता निष्कर्ष योग्य आहे?", "q_english": "Table: (1) Dry air (anhydrous CaCl2) + iron nail → no rust after 7 days (2) Boiled distilled water + oil layer (no air) + iron nail → no rust (3) Ordinary water + air + iron nail → brown rust (Fe2O3·xH2O) (4) Ordinary water + air + stainless steel nail → no rust. Which conclusion about rust vs alloy is correct based on this table?", "options": ["गंज ही रासायनिक अभिक्रिया असून हवा व पाणी दोन्ही आवश्यक असतात; स्टेनलेस स्टीलमधील क्रोमियम पृष्ठभागावर Cr2O3 चा अदृश्य थर तयार करून गंज रोखतो", "गंजण्यासाठी फक्त पाणी पुरेसे असते, हवा आवश्यक नसते; स्टेनलेस स्टीलमधील जस्ताचा थर वितळून गंज रोखतो", "गंज हा भौतिक बदल असून फक्त हवाच पुरेशी असते; स्टेनलेस स्टीलमध्ये निकेलमुळे लोखंडाचे वस्तुमान कमी होते म्हणून गंजत नाही", "गंजण्यासाठी फक्त ऑक्सिजन पुरेसा असतो; स्टेनलेस स्टीलमध्ये कार्बनचे प्रमाण जास्त असल्याने गंज रोखला जातो"], "correct_index": 0, "explanation_marathi": "तक्ता दाखवतो की नळी 1 (पाणी नाही) व नळी 2 (हवा नाही) मध्ये गंज नाही, म्हणजे दोन्ही आवश्यक आहेत व गंज हा रासायनिक ऑक्सिडीकरण बदल आहे. स्टेनलेस स्टीलमधील क्रोमियम निष्क्रिय ऑक्साइड थर देतो. इतर पर्याय चुकतात कारण एकटे पाणी/हवा पुरेसे नाही, जस्ताचा थर हे गॅल्वनायझेशन आहे स्टेनलेस स्टील नव्हे, व गंज भौतिक बदल नाही.", "evidence": "NCERT Class 10 Science Chapter 3 Metals and Non-metals (2023), Activity 3.14 Rusting experiment"}, {"section": 8, "subtopic": "पर्यावरण: ओझोन vs हरितगृह", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): समतापांबरातील (Stratospheric) ओझोन अतिनील-B/C किरणे शोषून पृथ्वीवरील जीवांचे संरक्षण करतो, तर क्षोभांबरातील (Tropospheric) ओझोन हा हरितगृह वायू व प्रकाश-रासायनिक धुराचा (photochemical smog) घटक म्हणून प्रदूषक आहे. कारण (R): मॉन्ट्रियल प्रोटोकॉल (1987) मुळे CFC उत्सर्जन घटून अंटार्क्टिक ओझोन छिद्र भरून येत आहे, तर क्योटो प्रोटोकॉल (1997) व पॅरिस करार (2015) हे CO2, CH4, N2O यांसारख्या हरितगृह वायूंना लक्ष्य करतात; विशेष म्हणजे CFC हे स्वतः प्रबळ हरितगृह वायू देखील आहेत. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Stratospheric ozone protects life by absorbing UV-B/C rays, while tropospheric ozone acts as a greenhouse gas and pollutant as a component of photochemical smog. Reason (R): Montreal Protocol (1987) reduced CFC emissions leading to recovery of Antarctic ozone hole, while Kyoto Protocol (1997) and Paris Agreement (2015) target greenhouse gases like CO2, CH4, N2O; notably CFCs themselves are also potent greenhouse gases. Choose correct option.", "options": ["A आणि R दोन्ही सत्य आहेत, आणि R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य आहे, R असत्य आहे.", "A असत्य आहे, R सत्य आहे."], "correct_index": 1, "explanation_marathi": "A सत्य आहे कारण उंचीनुसार ओझोनची भूमिका बदलते (UV शोषण vs हरितगृह परिणाम). R सत्य आहे कारण प्रोटोकॉल/करारांची वर्षे व CFC चा दुहेरी परिणाम अचूक आहे. परंतु R हे A चे स्पष्टीकरण नाही — A चे कारण प्रकाशरसायनशास्त्र व उंची आहे, तर R हा धोरणात्मक इतिहास आहे; म्हणून पर्याय 0 चूक, 2 व 3 चूक कारण दोन्ही विधाने सत्य आहेत.", "evidence": "Vienna Convention (1985), Montreal Protocol (1987); Kyoto Protocol (1997), Paris Agreement (2015); WMO/UNEP Scientific Assessment of Ozone Depletion 2022; IPCC AR6 Report."}, {"section": 8, "subtopic": "पाणी: कठीण vs मृदू व RO", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने विचारात घ्या:\nI) तात्पुरती कठीणता Ca(HCO₃)₂ व Mg(HCO₃)₂ मुळे असते व उकळल्याने दूर होते; कायमस्वरूपी कठीणता क्लोराइड/सल्फेट क्षारांमुळे असते व उकळल्याने दूर होत नाही.\nII) कठीण पाणी साबणाबरोबर सहज फेस देत नाही, कारण Ca²⁺/Mg²⁺ साबणाशी अभिक्रिया करून अविलेय स्कम (calcium/magnesium stearate) तयार करतात.\nIII) RO सर्व विरघळलेले क्षार काढते; BIS IS 10500 नुसार TDS ची स्वीकारार्ह मर्यादा 500 mg/L आहे, त्यामुळे अतिकमी TDS चे RO पाणी दीर्घकाळ पिणे खनिजांच्या दृष्टीने इष्ट नाही.\nयोग्य पर्याय निवडा:", "q_english": "Consider the statements:\nI) Temporary hardness is due to Ca(HCO₃)₂ and Mg(HCO₃)₂ and is removed by boiling; permanent hardness is due to chloride/sulphate salts and is not removed by boiling.\nII) Hard water does not lather easily with soap because Ca²⁺/Mg²⁺ react with soap to form insoluble scum (calcium/magnesium stearate).\nIII) RO removes all dissolved salts; as per BIS IS 10500 acceptable TDS limit is 500 mg/L, so long-term drinking of very low-TDS RO water is not desirable from mineral point of view.\nChoose the correct option:", "options": ["I, II आणि III बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I बरोबर आहे (बायकार्बोनेट vs क्लोराइड/सल्फेटमुळे तात्पुरती vs कायमस्वरूपी कठीणता), II बरोबर आहे (स्कम निर्मितीमुळे फेस न येणे), III बरोबर आहे (RO निर्लवणीकरण + BIS 500 mg/L मर्यादा). त्यामुळे एक सत्य विधान वगळणारे पर्याय 1, 2, 3 तिन्ही चूक ठरतात कारण त्यांनी एक बरोबर विधान चूक ठरवले आहे.", "evidence": "NCERT Class 11 Chemistry Chapter 9 – Hydrogen/Water hardness; BIS IS 10500:2012 Drinking Water Specification – TDS 500 mg/L; WHO Guidelines for Drinking-water Quality 2022 – demineralized water"}, {"section": 8, "subtopic": "पेशी: मायटोकॉन्ड्रिया vs हरितलवक", "qtype": "जोड्या लावा", "q_marathi": "स्तंभ (अ) मधील संरचनांची स्तंभ (ब) मधील अचूक वर्णन/स्थानाशी जोडी लावा: (अ) A. क्रिस्टी, B. स्ट्रोमा, C. मॅट्रिक्स, D. ग्रॅनम; (ब) 1. मायटोकॉन्ड्रियाच्या आंतरपटलाचे वळण — इलेक्ट्रॉन वाहतूक शृंखला व ATP सिंथेसचे स्थान (ऑक्सिडेटिव्ह फॉस्फोरिलेशन), 2. हरितलवकातील द्रवरूप भाग — कॅल्व्हिन चक्राचे (अंधकार अभिक्रिया) स्थान, 3. मायटोकॉन्ड्रियातील आतील द्रवरूप भाग — क्रेब्स चक्राचे स्थान, 4. थायलॅकॉइडच्या चपट्या पिशव्यांचा संच — प्रकाश अभिक्रियेचे स्थान. योग्य जोडी निवडा.", "q_english": "Match structures in Column (A) with correct description/location in Column (B): (A) A. Cristae, B. Stroma, C. Matrix, D. Granum; (B) 1. Fold of inner mitochondrial membrane — site of electron transport chain and ATP synthase (oxidative phosphorylation), 2. Fluid part of chloroplast — site of Calvin cycle (dark reaction), 3. Inner fluid part of mitochondria — site of Krebs cycle, 4. Stack of flat thylakoid sacs — site of light reaction. Choose correct match.", "options": ["A-1, B-2, C-3, D-4", "A-1, B-3, C-2, D-4", "A-4, B-2, C-3, D-1", "A-1, B-2, C-4, D-3"], "correct_index": 0, "explanation_marathi": "A-1, B-2, C-3, D-4 ही जोडी अचूक आहे. पर्याय 1 चूक कारण स्ट्रोमा (हरितलवक) व मॅट्रिक्स (मायटोकॉन्ड्रिया) यांची अदलाबदल ही सामान्य गल्लत आहे; पर्याय 2 चूक कारण क्रिस्टी (मायटोकॉन्ड्रिया) व ग्रॅनम (हरितलवक) यांची अदलाबदल केली आहे; पर्याय 3 चूक कारण C-मॅट्रिक्स हे क्रेब्स चक्राचे स्थान असून थायलॅकॉइडशी संबंधित नाही.", "evidence": "Lynn Margulis अंतःसहजीवन सिद्धांत (1967); NCERT इयत्ता 11 वी जीवशास्त्र धडा-8 पेशी — संरचना व कार्ये."}, {"section": 8, "subtopic": "प्रकाश: अपवर्तन vs पूर्ण आंतरिक परावर्तन", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या: (I) प्रकाश किरण विरल माध्यमातून घन माध्यमात जाताना स्तंभिकेकडे वाकतो व n1 sin i = n2 sin r या स्नेलच्या नियमाचे पालन करतो. (II) पूर्ण आंतरिक परावर्तनासाठी प्रकाशाने घन माध्यमातून विरल माध्यमात जावे लागते व आपतन कोन क्रांतिक कोनापेक्षा मोठा असावा लागतो; काच-हवा युग्मासाठी क्रांतिक कोन सुमारे 42° असतो. (III) वाळवंटातील मृगजळ आणि ऑप्टिकल फायबरमधील संदेशवहन ही दोन्ही प्रामुख्याने केवळ अपवर्तनाची उदाहरणे आहेत, पूर्ण आंतरिक परावर्तनाची नाहीत. योग्य पर्याय निवडा:", "q_english": "Consider the statements: (I) When light goes from rarer to denser medium it bends towards the normal and obeys Snell's law n1 sin i = n2 sin r. (II) For total internal reflection light must go from denser to rarer medium and angle of incidence must exceed the critical angle; for glass-air it is about 42°. (III) Desert mirage and signal transmission in optical fibre are both mainly examples of mere refraction, not total internal reflection. Choose the correct option:", "options": ["I आणि II फक्त बरोबर", "II आणि III फक्त बरोबर", "I, II आणि III बरोबर", "I आणि III फक्त बरोबर"], "correct_index": 0, "explanation_marathi": "I बरोबर आहे कारण विरल ते घन माध्यमात प्रकाश स्तंभिकेकडे वाकतो व स्नेलचा नियम पाळतो. II बरोबर आहे कारण TIR फक्त घन ते विरल माध्यमात ic पेक्षा मोठ्या कोनात होतो (काचेसाठी ~41.8°). III चूक आहे कारण मृगजळ व ऑप्टिकल फायबर ही TIR चीच उत्कृष्ट उदाहरणे आहेत. त्यामुळे B, C, D पर्याय एका चुकीच्या विधानाला बरोबर धरल्याने चुकतात.", "evidence": "NCERT Class 12 Physics Chapter 9 Ray Optics and Optical Instruments (2023); NCERT Class 10 Science Chapter 10 Light"}, {"section": 8, "subtopic": "मानवी पचन: एंझाइम vs संप्रेरक", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): स्वादुपिंडाचा ट्रिप्सिन हा एंझाइम असून तो प्रथिनांचे पचन करतो, तर सिक्रेटिन हे संप्रेरक असून ते स्वादुपिंडाच्या स्रवणाचे नियमन करते. कारण (R): एंझाइमे रक्तामार्फत लक्ष्य अवयवापर्यंत पोहोचून अभिक्रिया घडवतात, तर संप्रेरके नलिकांमार्फत स्रवून त्याच ठिकाणी उत्प्रेरक म्हणून कार्य करतात.", "q_english": "Assertion (A): Pancreatic trypsin is an enzyme that digests proteins, while secretin is a hormone that regulates pancreatic secretion. Reason (R): Enzymes reach target organs via blood to carry out reactions, while hormones are secreted via ducts and act locally as catalysts.", "options": ["A आणि R दोन्ही बरोबर, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, R चूक", "A चूक, R बरोबर"], "correct_index": 2, "explanation_marathi": "A बरोबर आहे कारण ट्रिप्सिन प्रथिने पचवणारे एंझाइम आहे व सिक्रेटिन हे GI संप्रेरक स्वादुपिंड स्रवणाचे नियमन करते. R पूर्णपणे उलट व चूक आहे कारण एंझाइमे नलिकेद्वारे/त्याच ठिकाणी उत्प्रेरक म्हणून कार्य करतात, तर संप्रेरके रक्तामार्फत वाहून नेली जातात व उत्प्रेरक नसतात. त्यामुळे A-B पर्याय R ला बरोबर धरल्याने चुकतात व D पर्याय A ला चूक धरल्याने चुकतो.", "evidence": "NCERT Class 11 Biology Chapter 16 Digestion and Absorption (2023)"}, {"section": 8, "subtopic": "मानवी हाडे: अस्थिसंधिवात vs कॅल्शियम", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन वैद्यकीय स्थिती पहा: (P) 60 वर्षीय रुग्णाच्या गुडघ्यातील सांध्यातील कूर्चा (articular cartilage) झिजून हाडे एकमेकांवर घासत आहेत; (Q) कॅल्शियम व व्हिटॅमिन-D च्या दीर्घकालीन कमतरतेमुळे अस्थिखनिज घनता (BMD) कमी होऊन हाडे ठिसूळ झाली आहेत. कॅल्शियमच्या भूमिकेसह योग्य एकत्रित निष्कर्ष कोणता?", "q_english": "Consider two clinical conditions: (P) In a 60-year-old, knee articular cartilage has worn out causing bone-on-bone friction; (Q) Chronic calcium and vitamin-D deficiency has reduced bone mineral density (BMD) making bones brittle. Which integrated conclusion along with the role of calcium is correct?", "options": ["P = अस्थिसंधिवात (Osteoarthritis – कूर्चा ऱ्हास); Q = अस्थिसुषिरता (Osteoporosis – BMD घट); कॅल्शियम/व्हिटॅमिन-D पूरकता Q चा धोका कमी करते, P पूर्णपणे बरा करत नाही", "P = अस्थिसुषिरता; Q = अस्थिसंधिवात; कॅल्शियम पूरकता P पूर्ण बरा करते आणि Q वर परिणाम करत नाही", "P = संधिवात (Rheumatoid arthritis – स्वप्रतिकार); Q = अस्थिसुषिरता; कॅल्शियम कमतरता हेच P चे थेट कारण आहे", "P = अस्थिसंधिवात; Q = संधिवात; दोन्ही थेट कॅल्शियम कमतरतेमुळे होतात व कॅल्शियमने पूर्ण बरे होतात"], "correct_index": 0, "explanation_marathi": "P मधील कूर्चा-झीज म्हणजे अस्थिसंधिवात (degenerative joint disease) आणि Q मधील BMD घट म्हणजे अस्थिसुषिरता; कॅल्शियम/व्हिटॅमिन-D मुळे Q ला प्रतिबंध होतो पण झिजलेली कूर्चा पुन्हा तयार होत नाही. त्यामुळे P-Q अदलाबदल करणारा पर्याय 1, P ला स्वप्रतिकार संधिवात म्हणणारा पर्याय 2 आणि दोन्ही कॅल्शियमने पूर्ण बरे होतात म्हणणारा पर्याय 3 चूक ठरतात.", "evidence": "NIH – Osteoarthritis vs Osteoporosis Fact Sheets (2023); ICMR Nutrient Requirements for Indians 2020 – Calcium/Vitamin-D; NCERT Class 11 Biology Chapter 20 – Locomotion and Movement"}, {"section": 8, "subtopic": "रक्त: गट vs Rh घटक", "qtype": "कारण-परिणाम", "q_marathi": "कारण (R): O-नकारात्मक (O-) रक्तगटाला 'सर्वसामान्य दाता (Universal Donor)' म्हणतात, कारण त्याच्या लाल रक्तपेशींवर A, B आणि Rh-D प्रतिजनांपैकी कोणतेही प्रतिजन नसते. परिणाम (C): Rh-नकारात्मक व्यक्तीला पहिल्यांदा Rh-सकारात्मक रक्त दिल्यास तीव्र अभिश्लेषण (Agglutination) होत नाही, परंतु शरीरात Anti-D प्रतिपिंडे तयार होतात; त्यामुळे दुसऱ्यांदा Rh+ रक्त दिल्यास किंवा Rh- मातेच्या दुसऱ्या Rh+ गर्भधारणेत घातक अभिक्रिया (Erythroblastosis fetalis) होते. R आणि C यांच्या सत्यतेसह त्यांच्यातील कार्यकारण संबंधाबाबत योग्य पर्याय निवडा.", "q_english": "Reason (R): O-negative (O-) blood group is called the 'Universal Donor' because its red blood cells lack A, B and Rh-D antigens. Consequence (C): When Rh-negative person receives Rh-positive blood for the first time, acute agglutination does not occur, but anti-D antibodies are formed; hence second transfusion of Rh+ blood or second Rh+ pregnancy in Rh- mother causes severe reaction (erythroblastosis fetalis). Choose the correct option regarding truth of R and C and causal relation between them.", "options": ["R आणि C दोन्ही सत्य आहेत, आणि R हे C चे योग्य कारण/स्पष्टीकरण आहे.", "R आणि C दोन्ही सत्य आहेत, परंतु R हे C चे कारण/स्पष्टीकरण नाही; दोन्ही स्वतंत्र सत्ये आहेत.", "R सत्य आहे, C असत्य आहे, कारण Rh- व्यक्तीत Anti-D प्रतिपिंडे नैसर्गिकरित्या आधीपासूनच असतात.", "R असत्य आहे, कारण O गटात Rh-D विचारात न घेता सर्व O दाते सर्वसामान्य दाते असतात; C सत्य आहे."], "correct_index": 1, "explanation_marathi": "R सत्य आहे कारण A, B, Rh-D प्रतिजनांच्या अनुपस्थितीमुळे O- च्या RBC वर ग्राहीच्या प्रतिपिंडांशी अभिक्रिया होत नाही. C सत्य आहे कारण Anti-D ही नैसर्गिक प्रतिपिंडे नसून immune प्रतिपिंडे आहेत, ती प्रथम संसर्गानंतर तयार होतात व IgG स्वरूपात अपऱ्यामधून जातात. पर्याय 0 चूक कारण R हे C चे कारण नाही; पर्याय 2 चूक कारण Anti-D नैसर्गिक नसते (Anti-A, Anti-B नैसर्गिक असतात); पर्याय 3 चूक कारण O+ मध्ये Rh-D असते म्हणून तो Rh- ग्राह्याला देऊ शकत नाही.", "evidence": "Landsteiner (1901) ABO शोध; Levine व Stetson (1940) Rh घटक शोध; NCERT इयत्ता 12 वी जीवशास्त्र धडा-18 शरीर द्रव व परिसंचरण; ICMR/RhoGAM मार्गदर्शक तत्त्वे."}, {"section": 8, "subtopic": "रोग: विषाणू vs जीवाणू लस", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्ता पहा:\nअ) क्षयरोग — रोगकारक: जीवाणू (Mycobacterium tuberculosis) — लस: BCG (जिवंत क्षीण केलेली जीवाणूजन्य लस)\nब) पोलिओ — रोगकारक: विषाणू — लस: OPV/IPV (जिवंत क्षीण / निष्क्रिय विषाणूजन्य लस)\nक) धनुर्वात — रोगकारक: जीवाणूजन्य विष (Clostridium tetani चे टॉक्सिन) — लस: टॉक्सॉइड (DPT मधील T)\nड) गोवर — रोगकारक: जीवाणू — लस: निष्क्रिय जीवाणूजन्य लस\nवरीलपैकी कोणत्या जोड्या बरोबर आहेत?", "q_english": "Consider the following table:\nA) Tuberculosis — Pathogen: Bacterium (Mycobacterium tuberculosis) — Vaccine: BCG (live attenuated bacterial)\nB) Polio — Pathogen: Virus — Vaccine: OPV/IPV (live attenuated / inactivated viral)\nC) Tetanus — Pathogen: Bacterial toxin (Clostridium tetani toxin) — Vaccine: Toxoid (T in DPT)\nD) Measles — Pathogen: Bacterium — Vaccine: Inactivated bacterial vaccine\nWhich pairs are correct?", "options": ["अ, ब, क बरोबर; ड चूक", "अ, ब, ड बरोबर; क चूक", "ब, क, ड बरोबर; अ चूक", "अ, क, ड बरोबर; ब चूक"], "correct_index": 0, "explanation_marathi": "अ, ब, क बरोबर आहेत कारण BCG ही जिवंत जीवाणूजन्य लस, पोलिओ लस विषाणूजन्य (OPV जिवंत क्षीण/IPV निष्क्रिय) आणि धनुर्वात लस टॉक्सॉइड आहे. ड चूक आहे कारण गोवर हा विषाणूजन्य (Paramyxovirus) रोग असून MMR ही जिवंत क्षीण विषाणूजन्य लस आहे. त्यामुळे ड समाविष्ट असलेले पर्याय 1, 2, 3 चूक ठरतात आणि क वगळणारा पर्याय 1 देखील चूक आहे.", "evidence": "WHO Vaccine Position Papers; भारताचा सार्वत्रिक लसीकरण कार्यक्रम (UIP); NCERT Class 12 Biology Chapter 8 – Human Health and Disease"}, {"section": 8, "subtopic": "वनस्पती: प्रकाशसंश्लेषण C3 vs C4", "qtype": "कालक्रम लावा", "q_marathi": "C4 (हॅच-स्लॅक) मार्गातील घटनांचा योग्य कालक्रम लावा: (A) पर्णमध्य पेशीत PEP कार्बोक्सिलेझद्वारे CO2 चे ऑक्झालोअ‍ॅसिटेटमध्ये स्थिरीकरण (B) बंडल शीथ पेशीत डीकार्बोक्सिलेशनातून CO2 मुक्त होणे (C) मॅलेट/अ‍ॅस्पार्टेट स्वरूपात बंडल शीथ पेशीकडे वाहतूक (D) बंडल शीथ हरितलवकात कॅल्विन चक्राद्वारे शर्करा निर्मिती. योग्य क्रम निवडा:", "q_english": "Arrange the events of the C4 (Hatch-Slack) pathway in correct chronological order: (A) Fixation of CO2 into oxaloacetate by PEP carboxylase in mesophyll cell (B) Release of CO2 by decarboxylation in bundle-sheath cell (C) Transport as malate/aspartate to bundle-sheath cell (D) Sugar formation via Calvin cycle in bundle-sheath chloroplast. Choose the correct sequence:", "options": ["A-C-B-D", "A-B-C-D", "C-A-B-D", "A-C-D-B"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A-C-B-D आहे: प्रथम पर्णमध्यात CO2 स्थिरीकरण, नंतर C4 आम्लाची बंडल शीथकडे वाहतूक, तेथे CO2 मुक्तता व शेवटी कॅल्विन चक्र. B पर्याय डीकार्बोक्सिलेशन वाहतुकीआधी दाखवतो, C पर्याय वाहतूक स्थिरीकरणाआधी दाखवतो, D पर्याय कॅल्विन चक्र CO2 मुक्तीआधी दाखवतो, म्हणून तिन्ही चुकतात.", "evidence": "NCERT Class 11 Biology Chapter 13 Photosynthesis in Higher Plants (2023); Hatch & Slack 1966 C4 pathway report"}, {"section": 8, "subtopic": "वीज: ओहम नियम व घरगुती वायरिंग", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: (अ) ओहम नियमाची अट — (ब) घरातील उपकरणांची जोडणी — (क) फ्यूज वायरचे कार्य — (ड) 3-पिन प्लगमधील अर्थिंग पिन; (1) समांतर जोडणी : प्रत्येक उपकरणाला पूर्ण 220V, एक बंद झाले तरी इतर चालू राहतात (2) अतिप्रवाहात वितळून परिपथ खंडित करणे; नेहमी विद्युन्मय (live) तारेत जोडतात (3) स्थिर तापमान व भौतिक स्थितीत V∝I (V=IR) (4) गळती प्रवाह जमिनीत वळवून धक्क्यापासून संरक्षण; सर्वात लांब व जाड पिन.", "q_english": "Match the pairs: (a) Condition of Ohm's law — (b) Connection of home appliances — (c) Function of fuse wire — (d) Earthing pin in 3-pin plug; (1) Parallel connection: each appliance gets full 220V, others work even if one is off (2) Melts on overcurrent to break circuit; always connected in live wire (3) At constant temperature V∝I (V=IR) (4) Diverts leakage current to earth for shock protection; longest and thickest pin.", "options": ["अ-3, ब-1, क-2, ड-4", "अ-3, ब-2, क-1, ड-4", "अ-1, ब-3, क-2, ड-4", "अ-3, ब-1, क-4, ड-2"], "correct_index": 0, "explanation_marathi": "अ-3 बरोबर कारण ओहम नियम स्थिर तापमानाला V∝I सांगतो; ब-1 बरोबर कारण समांतर जोडणीत प्रत्येक उपकरणाला पूर्ण 220V मिळते; क-2 बरोबर कारण फ्यूज अतिप्रवाहात वितळून live वायरमध्ये संरक्षण देतो; ड-4 बरोबर कारण अर्थिंग पिन सर्वात लांब-जाड असून गळती प्रवाह जमिनीत वळवतो. इतर पर्यायांत फ्यूजचे कार्य समांतर जोडणीशी किंवा अर्थिंगचे कार्य फ्यूजशी अदलाबदल केल्याने ते चुकतात.", "evidence": "NCERT Class 10 Science Chapter 12 Electricity (2023); BIS IS 732:2019 Code of Practice for Electrical Wiring"}];
const QUESTIONS_B = [{"section": 3, "subtopic": "G20 शिखर 2025 दक्षिण आफ्रिका", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "2025 च्या G20 शिखराबाबत खालील विधाने विचारात घ्या:\nI. नोव्हेंबर 2025 मध्ये जोहान्सबर्ग येथे पार पडलेले हे 20 वे G20 शिखर आफ्रिका खंडात आयोजित पहिले G20 शिखर होते.\nII. या शिखराची संकल्पना (Theme) 'Solidarity, Equality, Sustainability' ही होती व 1 डिसेंबर 2024 ते 30 नोव्हेंबर 2025 या कालावधीत दक्षिण आफ्रिकेकडे G20 चे अध्यक्षपद होते.\nIII. आफ्रिकन युनियनला 2023 मध्ये स्थायी सदस्यत्व मिळाल्यानंतरचे हे पहिलेच G20 शिखर होते.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements regarding the G20 Summit 2025:\nI. Held in Johannesburg in November 2025, this was the 20th G20 Summit and the first ever G20 Summit on African soil.\nII. Its theme was 'Solidarity, Equality, Sustainability' and South Africa held the G20 presidency from 1 December 2024 to 30 November 2025.\nIII. This was the first G20 Summit after the African Union got permanent membership in 2023.\nChoose the correct option:", "options": ["फक्त I आणि II बरोबर", "फक्त I आणि III बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I बरोबर आहे कारण 22-23 नोव्हेंबर 2025 रोजी जोहान्सबर्ग (नासरेक एक्स्पो सेंटर) येथे 20 वे शिखर झाले व ते आफ्रिकेतील पहिले होते. II बरोबर आहे कारण थीम व अध्यक्षपदाचा कालावधी अधिकृतपणे जाहीर केलेला आहे. III चूक आहे कारण आफ्रिकन युनियनला 2023 (दिल्ली) मध्ये स्थायी सदस्यत्व मिळाले, त्यामुळे 2024 ब्राझील (19 वे) हे पहिले तर 2025 हे दुसरे शिखर होते; त्यामुळे III समाविष्ट असलेले पर्याय 2, 3, 4 चूक ठरतात.", "evidence": "G20 South Africa Presidency official page; PIB release 23 Nov 2025 - 20th G20 Leaders' Summit, Johannesburg, Theme: Solidarity, Equality, Sustainability, Presidency 1 Dec 2024-30 Nov 2025"}, {"section": 3, "subtopic": "ISRO SPADEX डॉकिंग 2025", "qtype": "तक्ता आधारित", "q_marathi": "ISRO च्या SPADEX (Space Docking Experiment) मोहिमेबाबत खालील तक्ता विचारात घ्या:\n| क्र. | घटक | तपशील |\n| 1 |
