onstitution (61st Amendment) Act 1988, Art.326; India Code legislative history"}, {"section": 6, "subtopic": "लोकसभा अध्यक्ष vs राज्यसभा सभापती", "qtype": "जोड्या लावा", "q_marathi": "स्तंभ-I आणि स्तंभ-II मधील जोड्या लावा:\\nस्तंभ-I: (I) लोकसभा अध्यक्षाला पदावरून दूर करणे, (II) राज्यसभा सभापतीला (उपराष्ट्रपती) पदावरून दूर करणे, (III) संसदेच्या संयुक्त बैठकीचे (कलम 118) अध्यक्षपद, (IV) सभागृहाचा सदस्य नसताना पीठासीन अधिकारी\\nस्तंभ-II: (A) 14 दिवसांची पूर्वसूचना; राज्यसभेच्या तत्कालीन सदस्यांच्या बहुमताने ठराव + लोकसभेची सहमती, (B) 14 दिवसांची पूर्वसूचना; लोकसभेच्या तत्कालीन सदस्यांच्या बहुमताने (effective majority) ठराव, (C) प्रथम प्राधान्याने लोकसभा अध्यक्ष; अनुपस्थितीत उपाध्यक्ष क्रमाने, (D) केवळ उपराष्ट्रपती (पदसिद्ध सभापती) – राज्यसभेचे सदस्य नसतात", "q_english": "Match Column-I with Column-II:\\nColumn-I: (I) Removal of Lok Sabha Speaker, (II) Removal of Rajya Sabha Chairman (Vice-President), (III) Presiding over joint sitting (Art.118), (IV) Presiding officer without being House member\\nColumn-II: (A) 14 days notice; resolution by effective majority of Rajya Sabha + concurrence of Lok Sabha, (B) 14 days notice; resolution by effective majority of Lok Sabha, (C) Speaker first; then Deputy Speaker in order, (D) Only Vice-President (ex-officio Chairman) – not a member of Rajya Sabha", "options": ["I-B, II-A, III-C, IV-D", "I-A, II-B, III-C, IV-D", "I-B, II-A, III-D, IV-C", "I-C, II-A, III-B, IV-D"], "correct_index": 0, "explanation_marathi": "I-B बरोबर (कलम 94), II-A बरोबर (कलम 67(b)), III-C बरोबर (कलम 118(4) नुसार अध्यक्षांना प्राधान्य), IV-D बरोबर (कलम 64). पर्याय 2 मध्ये A-B अदलाबदल केल्याने हटवण्याची प्रक्रिया चुकते; पर्याय 3 मध्ये C-D अदलाबदल केल्याने संयुक्त बैठक व सदस्यत्व चुकते.", "evidence": "Article 94, 67(b), 118(4), 64; M. Laxmikanth Indian Polity"}, {"section": 6, "subtopic": "विधानपरिषद", "qtype": "नकाशा आधारित", "q_marathi": "नकाशात उत्तरेकडून दक्षिणेकडे विधानपरिषद असलेल्या राज्यांचा क्रम लावा: बिहार, कर्नाटक, महाराष्ट्र, उत्तर प्रदेश. योग्य क्रम कोणता?", "q_english": "On India map, arrange north to south the states having Legislative Council: Bihar, Karnataka, Maharashtra, Uttar Pradesh. Correct order?", "options": ["उत्तर प्रदेश - बिहार - महाराष्ट्र - कर्नाटक", "बिहार - उत्तर प्रदेश - महाराष्ट्र - कर्नाटक", "उत्तर प्रदेश - बिहार - कर्नाटक - महाराष्ट्र", "बिहार - उत्तर प्रदेश - कर्नाटक - महाराष्ट्र"], "correct_index": 0, "explanation_marathi": "बरोबर क्रम: UP (~27°N), बिहार (~25°N), महाराष्ट्र (~19°N), कर्नाटक (~15°N).\nइतर पर्याय बिहारला UP च्या उत्तरेस किंवा कर्नाटकला महाराष्ट्राच्या उत्तरेस चुकून ठेवतात.", "evidence": "Constitution Arts.168-171; Legislative Councils exist in UP, Bihar, Maharashtra, Karnataka, AP, Telangana - ECI data"}, {"section": 6, "subtopic": "शिक्षण हक्क 21A व RTE 2009", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): शिक्षण हक्क कायदा, 2009 च्या कलम 12(1)(c) नुसार खासगी विनाअनुदानित शाळांना इयत्ता 1 ली मधील किमान 25% जागा वंचित व आर्थिक दुर्बल घटकांतील बालकांसाठी राखीव ठेवणे बंधनकारक आहे.\nकारण (R): 86व्या घटनादुरुस्तीने (2002) कलम 45 पुनर्लिखित करून 6 वर्षांखालील बालकांसाठी प्रारंभिक बालसंगोपन व शिक्षणाची तरतूद मार्गदर्शक तत्त्वांमध्ये समाविष्ट केली.", "q_english": "Assertion (A): Under Section 12(1)(c) of the Right of Children to Free and Compulsory Education Act, 2009, private unaided schools must reserve at least 25% of seats in Class I for children from disadvantaged and economically weaker sections.\nReason (R): The 86th Amendment (2002) rewrote Article 45 to provide for early childhood care and education for children below six years under the Directive Principles of State Policy.", "options": ["A आणि R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे / Both A and R are true; R is the correct explanation of A", "A आणि R दोन्ही सत्य; परंतु R हे A चे योग्य स्पष्टीकरण नाही / Both A and R are true; but R is NOT the correct explanation of A", "A सत्य; R असत्य / A is true; R is false", "A असत्य; R सत्य / A is false; R is true"], "correct_index": 1, "explanation_marathi": "A सत्य आहे (कलम 12(1)(c) ची 25% राखीव तरतूद) आणि R देखील सत्य आहे (86व्या दुरुस्तीने कलम 45 खरोखरच बदलले). परंतु A चा घटनात्मक आधार कलम 21A (6-14 वयोगटास मोफत-सक्तीचे शिक्षण) आहे; R मधील कलम 45 ची तरतूद A चे स्पष्टीकरण देत नाही. त्यामुळे 'योग्य स्पष्टीकरण' म्हणणारा पर्याय (a) बाद, आणि एक विधान चूक ठरवणारे (c)-(d) बाद होतात.", "evidence": "RTE Act, 2009, Sec. 12(1)(c) (अंमलबजावणी 1 एप्रिल 2010); Constitution (86th Amendment) Act, 2002 — Art. 21A समाविष्ट, Art. 45 पुनर्लिखित."}, {"section": 6, "subtopic": "सर्वोच्च न्यायालय: 124-147 रचना", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या:\\nI. कलम 124(3) नुसार उच्च न्यायालयात सलग 5 वर्षे न्यायाधीश किंवा 10 वर्षे अधिवक्ता असलेली व्यक्ती सर्वोच्च न्यायालयाचे न्यायाधीश होण्यास पात्र आहे.\\nII. कलम 124(2) नुसार ज्येष्ठतेच्या आधारावरच सरन्यायाधीशांची नियुक्ती करणे घटनेने बंधनकारक केले आहे.\\nIII. कलम 126 नुसार सरन्यायाधीशांचे पद रिक्त असताना राष्ट्रपती कार्यवाहक सरन्यायाधीश नेमतात; कलम 128 नुसार निवृत्त न्यायाधीशांना पीठावर बसवण्यास राष्ट्रपतींची पूर्वसंमती आवश्यक आहे.\\nयोग्य पर्याय निवडा.", "q_english": "Consider statements:\\nI. Under Art.124(3) a person who has been a High Court Judge for 5 years or an advocate for 10 years is qualified as SC judge.\\nII. Under Art.124(2) appointment of CJI strictly by seniority is constitutionally mandatory.\\nIII. Under Art.126 the President appoints an Acting CJI when office is vacant; under Art.128 recalled retired judges need prior Presidential consent.\\nChoose correct option.", "options": ["I आणि III सत्य, II असत्य", "I आणि II सत्य, III असत्य", "II आणि III सत्य, I असत्य", "I, II आणि III सर्व सत्य"], "correct_index": 0, "explanation_marathi": "I सत्य (5 वर्षे न्यायाधीश/10 वर्षे वकील), III सत्य (कलम 126, 128). II असत्य; ज्येष्ठता ही संकेतपरंपरा आहे, घटनात्मक बंधन नाही. त्यामुळे II समाविष्ट असलेले पर्याय 2, 3, 4 बाद होतात.", "evidence": "Articles 124(2), 124(3), 126, 128; Supreme Court Advocates-on-Record Association (Collegium) judgments"}, {"section": 7, "subtopic": "RBI: 1935 स्थापना", "qtype": "कालक्रम लावा", "q_marathi": "RBI च्या स्थापनेशी संबंधित घटनांचा योग्य कालक्रम लावा:\nA. हिल्टन-यंग आयोगाचा अहवाल\nB. भारतीय मध्यवर्ती बँकिंग चौकशी समितीचा अहवाल\nC. रिझर्व्ह बँक ऑफ इंडिया कायदा संमत\nD. रिझर्व्ह बँकेची स्थापना (1 एप्रिल)", "q_english": "Arrange the events related to RBI establishment in correct chronological order:\nA. Hilton-Young Commission Report\nB. Indian Central Banking Enquiry Committee Report\nC. Enactment of Reserve Bank of India Act\nD. Establishment of Reserve Bank (1st April)", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "हिल्टन-यंग आयोगाने (1926) मध्यवर्ती बँकेची शिफारस केली, 1931 च्या मध्यवर्ती बँकिंग चौकशी समितीने त्यास दुजोरा दिला, 1934 मध्ये RBI कायदा संमत झाला आणि 1 एप्रिल 1935 रोजी RBI कार्यान्वित झाली. B आधी C किंवा C आधी D ठेवणारे पर्याय ऐतिहासिक क्रमाविरुद्ध आहेत म्हणून चूक.", "evidence": "RBI Official History – rbi.org.in; Hilton-Young Commission Report 1926; Indian Central Banking Enquiry Committee 1931; RBI Act 1934"}, {"section": 7, "subtopic": "SEZ: 2005 कायदा", "qtype": "जोड्या लावा", "q_marathi": "विशेष आर्थिक क्षेत्र (SEZ) कायदा, 2005 बाबत जोड्या लावा: अ) SEZ कायद्याची अंमलबजावणी - i) 10 फेब्रुवारी 2006; ब) एकल खिडकी मंजुरी (Single Window Clearance) संबंधी मार्गदर्शक तरतूद - ii) कलम 5; क) SEZ विकासकाला प्राप्तिकर सवलत - iii) प्राप्तिकर कायदा कलम 80-IAB; ड) मान्यता मंडळाचे (Board of Approval) अध्यक्ष - iv) वाणिज्य सचिव. योग्य जोडी-संयोजन निवडा:", "q_english": "Match the pairs on Special Economic Zone (SEZ) Act, 2005: A) Enforcement of SEZ Act - i) 10 February 2006; B) Guiding provision for Single Window Clearance - ii) Section 5; C) Income-tax exemption to SEZ developer - iii) Income Tax Act Section 80-IAB; D) Chairperson of Board of Approval - iv) Commerce Secretary. Choose the correct combination:", "options": ["अ-i, ब-ii, क-iii, ड-iv", "अ-i, ब-iii, क-ii, ड-iv", "अ-ii, ब-i, क-iii, ड-iv", "अ-i, ब-ii, क-iv, ड-iii"], "correct_index": 0, "explanation_marathi": "SEZ कायदा जून 2005 मध्ये संमत होऊन 10 फेब्रुवारी 2006 पासून अंमलात आला (अ-i), कलम 5 एकल खिडकीसाठी मार्गदर्शक तत्त्वे देते (ब-ii), विकासकाला 80-IAB अंतर्गत सवलत मिळते (क-iii), तर मान्यता मंडळाचे अध्यक्ष वाणिज्य सचिव असतात (ड-iv). त्यामुळे एकही अदलाबदल असलेले इतर तीन पर्याय बाद होतात.", "evidence": "SEZ Act, 2005 – Ministry of Commerce & Industry: Act passed June 2005, effective 10.02.2006; Section 5 – guidelines/single window; Income Tax Sec 80-IAB/10AA for developers/units; Board of Approval chaired by Commerce Secretary."}, {"section": 7, "subtopic": "अर्थसंकल्प तूट: महसुली vs वित्तीय", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): महसुली तूट शून्य असली तरी वित्तीय तूट अस्तित्वात राहू शकते.\nकारण (R): वित्तीय तूट = महसुली तूट + (भांडवली खर्च – कर्जेतर भांडवली जमा); त्यामुळे भांडवली खर्चासाठी कर्ज घ्यावे लागल्यास वित्तीय तूट निर्माण होते.", "q_english": "Assertion (A): Even if revenue deficit is zero, fiscal deficit can still exist.\nReason (R): Fiscal Deficit = Revenue Deficit + (Capital Expenditure – non-debt capital receipts); hence borrowing for capital expenditure creates fiscal deficit.", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य आहेत परंतु R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य आहे परंतु R असत्य आहे", "A असत्य आहे परंतु R सत्य आहे"], "correct_index": 0, "explanation_marathi": "महसुली तूट म्हणजे महसुली खर्च वजा महसुली जमा, तर वित्तीय तूट म्हणजे एकूण खर्च वजा कर्जेतर जमा. R मधील सूत्र अचूक असून त्यावरून महसुली तूट शून्य असतानाही भांडवली खर्चासाठी कर्ज घेतल्यास वित्तीय तूट टिकते हे स्पष्ट होते, म्हणून A व R दोन्ही सत्य व R हेच A चे स्पष्टीकरण आहे. स्पष्टीकरण संबंध नाकारणारे इतर पर्याय चूक.", "evidence": "Union Budget Documents – Concepts of Deficits, Ministry of Finance, Govt. of India; NCERT Class XII Introductory Macroeconomics Chapter 5 – Government Budget and the Economy"}, {"section": 7, "subtopic": "औद्योगिक धोरण 1991", "qtype": "तक्ता आधारित", "q_marathi": "औद्योगिक धोरण, 1991 वरील तक्ता पहा: क्र. 1 - तरतूद: औद्योगिक परवाना, तपशील: 18 उद्योग वगळता इतर सर्वांसाठी परवाना रद्द; क्र. 2 - तरतूद: सार्वजनिक क्षेत्राचे आरक्षण, तपशील: 17 उद्योगांवरून 8 उद्योगांपुरते मर्यादित; क्र. 3 - तरतूद: MRTP मर्यादा, तपशील: MRTP कंपन्यांची मालमत्ता मर्यादा 100 कोटींवरून 200 कोटींपर्यंत वाढवली; क्र. 4 - तरतूद: थेट विदेशी गुंतवणूक (FDI), तपशील: 34 उच्च-प्राधान्य उद्योगांत 51% पर्यंत स्वयंचलित मंजुरी. वरील तक्त्याच्या आधारे अयोग्य विधान कोणते?", "q_english": "Observe the table on Industrial Policy, 1991: No.1 - Provision: Industrial licensing, Detail: Abolished for all except 18 industries; No.2 - Provision: Public sector reservation, Detail: Reduced from 17 to 8 industries; No.3 - Provision: MRTP limit, Detail: Asset limit for MRTP companies raised from Rs.100 cr to Rs.200 cr; No.4 - Provision: FDI, Detail: Automatic approval up to 51% in 34 high-priority industries. Which statement is incorrect based on the table?", "options": ["फक्त क्र. 3 चे तपशील चूक आहेत, इतर बरोबर आहेत", "फक्त क्र. 2 चे तपशील चूक आहेत, इतर बरोबर आहेत", "क्र. 1 व क्र. 4 चे तपशील चूक आहेत, इतर बरोबर आहेत", "क्र. 2 व क्र. 3 चे तपशील चूक आहेत, इतर बरोबर आहेत"], "correct_index": 0, "explanation_marathi": "क्र. 1, 2, 4 चे तपशील 1991 धोरणाशी सुसंगत आहेत. क्र. 3 चूक आहे कारण 1991 मध्ये MRTP कायद्यातील मालमत्ता मर्यादा वाढवली नाही तर पूर्णपणे रद्द केली होती. त्यामुळे क्र. 2 ला चूक ठरवणारे पर्याय आणि क्र. 1, 4 ला चूक ठरवणारा पर्याय बाद होतात.", "evidence": "Industrial Policy Statement 1991, Govt. of India: delicensing except 18 industries; public sector reserved to 8; MRTP asset limit scrapped; 51% automatic FDI in 34 high-priority industries."}, {"section": 7, "subtopic": "कर: प्रत्यक्ष vs अप्रत्यक्ष", "qtype": "जोड्या लावा", "q_marathi": "यादी-I (कर) ची यादी-II (स्वरूप/स्थिती) शी योग्य जोडी लावा:\nयादी-I: A. संपत्ती कर, B. सेवा कर, C. किमान पर्यायी कर (MAT), D. केंद्रीय उत्पादन शुल्क\nयादी-II: 1. प्रत्यक्ष कर – 2015 पासून रद्द, 2. अप्रत्यक्ष कर – GST मध्ये विलीन, 3. प्रत्यक्ष कर – कंपन्यांच्या पुस्तकी नफ्यावर, 4. अप्रत्यक्ष कर – उत्पादनावर, GST-पूर्व काळातील", "q_english": "Match List-I (Tax) with List-II (Nature/Status):\nList-I: A. Wealth Tax, B. Service Tax, C. Minimum Alternate Tax (MAT), D. Central Excise Duty\nList-II: 1. Direct tax – abolished since 2015, 2. Indirect tax – merged into GST, 3. Direct tax – on book profits of companies, 4. Indirect tax – on manufacture, pre-GST era", "options": ["A-1, B-2, C-3, D-4", "A-1, B-2, C-4, D-3", "A-3, B-2, C-1, D-4", "A-1, B-4, C-3, D-2"], "correct_index": 0, "explanation_marathi": "संपत्ती कर हा प्रत्यक्ष कर होता व 2015-16 च्या अर्थसंकल्पात रद्द झाला (A-1). सेवा कर व केंद्रीय उत्पादन शुल्क हे अप्रत्यक्ष कर होते व 1 जुलै 2017 पासून GST मध्ये विलीन झाले (B-2, D-4). MAT हा आयकर कायद्याच्या 115JB नुसार पुस्तकी नफ्यावर लावला जाणारा प्रत्यक्ष कर आहे (C-3). C-4 किंवा B-4 जोड्या करभार हस्तांतरणाच्या तत्त्वाविरुद्ध आहेत म्हणून इतर पर्याय चूक.", "evidence": "Finance Act 2015 (Wealth Tax abolition); Income Tax Act 1961 Sec 115JB for MAT – CBDT; Service Tax and Central Excise subsumed into GST from 1 July 2017 – CBIC; NCERT Class XII Economics"}, {"section": 7, "subtopic": "कृषी: हरित क्रांती vs श्वेत क्रांती", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): हरित क्रांती ही HYV बियाणे, रासायनिक खते व सिंचनावर आधारित होती आणि मुख्यतः गहू-तांदूळ व वायव्य भारतापुरती (पंजाब, हरियाणा, प. उत्तर प्रदेश) मर्यादित राहिली.\nपरिणाम (E): श्वेत क्रांती (ऑपरेशन फ्लड) ने सहकारी दुग्ध संकलनाच्या (अमूल मॉडेल) माध्यमातून भारताला जगातील सर्वात मोठा दूध उत्पादक बनवले, याचे श्रेय डॉ. वर्गीस कुरियन यांना जाते.\nC व E यांमधील योग्य संबंध ओळखा:", "q_english": "Cause (C): Green Revolution was based on HYV seeds, chemical fertilizers and irrigation, and remained largely confined to wheat-rice and North-West India (Punjab, Haryana, W. UP).\nEffect (E): White Revolution (Operation Flood) made India the world's largest milk producer through cooperative dairy collection (Amul model), credited to Dr. Verghese Kurien.\nIdentify the correct relation between C and E:", "options": ["C आणि E दोन्ही सत्य आहेत आणि E हा C चा परिणाम आहे", "C आणि E दोन्ही सत्य आहेत परंतु E हा C चा परिणाम नाही", "C सत्य आहे परंतु E असत्य आहे", "C असत्य आहे परंतु E सत्य आहे"], "correct_index": 1, "explanation_marathi": "C सत्य (M.S. स्वामीनाथन, 1966-67, गहू-केंद्रित) आणि E सत्य (1970-96 ऑपरेशन फ्लड, कुरियन). पण श्वेत क्रांती हा हरित क्रांतीचा परिणाम नसून स्वतंत्र दुग्ध-सहकारी चळवळ आहे; त्यामुळे परिणाम-संबंध सांगणारा पर्याय 1 चुकीचा आणि एक विधान असत्य मानणारे पर्यायही चुकीचे.", "evidence": "NCERT Class XI Indian Economic Development Ch.3; NDDB - Operation Flood 1970-1996, Dr. Verghese Kurien; Ministry of Fisheries, Animal Husbandry & Dairying - India largest milk producer since 1998"}, {"section": 7, "subtopic": "चलनवाढ: मागणी-खेच vs खर्च-ढकल", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्ता विचारात घ्या:\n| संकेत | परिस्थिती |\n| A | कच्च्या तेलाच्या किंमतवाढीमुळे वाहतूक खर्च वाढून वस्तू महाग झाल्या |\n| B | रेपो दर कपातीनंतर स्वस्त कर्जामुळे गृहनिर्माण मागणी वाढून किमती वाढल्या |\n| C | दुष्काळामुळे कांदा उत्पादन घटून पुरवठा तुटवड्याने किमती वाढल्या |\n| D | 7व्या वेतन आयोगाच्या थकबाकीमुळे कर्मचाऱ्यांकडे अधिक क्रयशक्ती येऊन मागणी वाढली |\nमागणी-खेच (Demand-Pull) व खर्च-ढकल (Cost-Push) या वर्गीकरणानुसार योग्य जोडी कोणती?", "q_english": "Consider the following table:\n| Code | Situation |\n| A | Transport cost rose due to crude oil price hike, making goods costlier |\n| B | After repo rate cut, cheap credit raised housing demand and prices |\n| C | Onion output fell due to drought, prices rose due to supply shortage |\n| D | 7th Pay Commission arrears raised purchasing power and demand |\nWhich is the correct classification into Demand-Pull vs Cost-Push inflation?", "options": ["A-खर्च-ढकल, B-मागणी-खेच, C-खर्च-ढकल, D-मागणी-खेच", "A-मागणी-खेच, B-खर्च-ढकल, C-खर्च-ढकल, D-मागणी-खेच", "A-खर्च-ढकल, B-मागणी-खेच, C-मागणी-खेच, D-खर्च-ढकल", "A-खर्च-ढकल, B-खर्च-ढकल, C-मागणी-खेच, D-मागणी-खेच"], "correct_index": 0, "explanation_marathi": "A व C मध्ये पुरवठा बाजूचा धक्का (खर्च वाढ/उत्पादन घट) आहे म्हणून खर्च-ढकल; B व D मध्ये पत स्वस्त होणे व उत्पन्न वाढीमुळे एकूण मागणी वाढली म्हणून मागणी-खेच. C ला मागणी-खेच मानणारे पर्याय 3 व 4 आणि A-B अदलाबदल करणारा पर्याय 2 त्यामुळे चुकीचा.", "evidence": "RBI Bulletin on Inflation Dynamics; NCERT Class XII Economics Ch.8 - Cost-push due to supply shock, Demand-pull due to excess aggregate demand"}, {"section": 7, "subtopic": "जागतिक बँक vs IMF", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "जागतिक बँक आणि IMF यांबाबत खालीलपैकी योग्य विधान-जोडी निवडा:", "q_english": "Select the correct statement-pair regarding World Bank and IMF:", "options": ["जागतिक बँक – 1944 ब्रेटन वूड्स परिषदेत संकल्पना, IBRD/IDA मार्फत दीर्घकालीन विकास व पुनर्रचना कर्ज; IMF – कोट्यानुसार मतदान अधिकार, ताळेबंद (BoP) तूट दुरुस्तीसाठी अल्प-मध्यम मुदतीचे अर्थसहाय्य", "जागतिक बँक – कोट्यानुसार मतदान अधिकार, BoP तूट दुरुस्तीसाठी अल्पमुदतीचे अर्थसहाय्य; IMF – IBRD मार्फत दीर्घकालीन पायाभूत सुविधा कर्ज", "जागतिक बँक – 1945 पासून केवळ अनुदान वाटप, भाग-भांडवलावर मतदान नाही; IMF – विकास प्रकल्पांसाठी 25-30 वर्षांचे दीर्घकालीन कर्ज", "जागतिक बँक – विनिमय दर स्थैर्यासाठी कर्ज, एक देश-एक मत पद्धत; IMF – 1971 मध्ये स्थापना, ग्रामीण पायाभूत सुविधांसाठी दीर्घकालीन कर्ज"], "correct_index": 0, "explanation_marathi": "जागतिक बँक (IBRD/IDA) दीर्घकालीन विकास-पुनर्रचना कर्ज देते व तिचे मतदान भाग-भांडवलावर आधारित; IMF कोट्यानुसार मतदानाने BoP संकटात अल्प-मध्यम मुदतीचे सहाय्य देते व दोन्हींची संकल्पना 1944 ब्रेटन वूड्समध्ये मांडली गेली. भूमिका अदलाबदल करणारा पर्याय 2, अनुदान-केवळ सांगणारा पर्याय 3 व विनिमय-दर/1971 चूक सांगणारा पर्याय 4 यामुळे बाद होतात.", "evidence": "Bretton Woods Conference 1944; World Bank – IBRD/IDA Articles of Agreement; IMF Articles of Agreement – Quota-based voting; NCERT Class XII Economics – Open Economy"}, {"section": 7, "subtopic": "डिजिटल अर्थव्यवस्था: UPI", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): UPI व्यवहारांचे प्रमाण व मूल्य विक्रमी वाढूनही चलनातील रोख रकमेचे (Currency in Circulation - CIC) GDP शी असलेले गुणोत्तर लक्षणीयरीत्या घटलेले नाही. कारण (R): UPI ने प्रामुख्याने कमी-मूल्याच्या किरकोळ व्यवहारांचे डिजिटायझेशन केले आहे, तर बचत, मोठी देणी-घेणी व अनौपचारिक क्षेत्रातील खबरदारीची मागणी (precautionary demand) रोखीवरच अवलंबून राहते.", "q_english": "Assertion (A): Despite record growth in UPI volume and value, the Currency in Circulation (CIC) to GDP ratio has not declined significantly. Reason (R): UPI has mainly digitised low-value retail transactions, while savings, high-value payments and precautionary demand in the informal sector remain cash-dependent.", "options": ["A आणि R दोन्ही सत्य आहेत, आणि R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे, परंतु R असत्य आहे", "A असत्य आहे, परंतु R सत्य आहे"], "correct_index": 0, "explanation_marathi": "A सत्य आहे – RBI आकडेवारीनुसार UPI वाढीनंतरही CIC/GDP उच्चच राहिले आहे. R देखील सत्य असून रोखीची संरचनात्मक मागणी (कमी-मूल्य विरुद्ध मोठी/अनौपचारिक मागणीतील फरक) स्पष्ट करते, म्हणून ती A चे योग्य स्पष्टीकरण ठरते. त्यामुळे स्पष्टीकरण नाकारणारा व एक विधान चूक ठरवणारे पर्याय बाद होतात.", "evidence": "RBI Annual Report / Bulletin: CIC to GDP ratio remained elevated post-UPI expansion; RBI notes digital payments largely substitute small-value retail cash, precautionary/informal cash demand persists."}, {"section": 7, "subtopic": "बँकिंग: NPA व IBC 2016", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nस्तंभ-I: (a) सब-स्टँडर्ड मालमत्ता, (b) डाउटफुल मालमत्ता, (c) लॉस अॅसेट, (d) IBC 2016 चे कलम 7\nस्तंभ-II: (1) 90 दिवसांपेक्षा जास्त थकीत परंतु 12 महिन्यांपर्यंत NPA राहिलेली मालमत्ता, (2) 12 महिन्यांपेक्षा अधिक काळ सब-स्टँडर्ड राहिलेली मालमत्ता, (3) वसुली अशक्य म्हणून बँकेने ओळखलेली परंतु पूर्णपणे निर्लेखित (write-off) न केलेली मालमत्ता, (4) वित्तीय धनकोकडून (Financial Creditor) CIRP सुरू करण्याची तरतूद\nयोग्य जोडी निवडा:", "q_english": "Match the pairs:\nColumn-I: (a) Sub-standard Asset, (b) Doubtful Asset, (c) Loss Asset, (d) Section 7 of IBC 2016\nColumn-II: (1) NPA for >90 days but up to 12 months, (2) Asset remaining sub-standard for >12 months, (3) Asset identified as uncollectible but not fully written off, (4) Provision for initiation of CIRP by Financial Creditor\nChoose the correct match:", "options": ["a-1, b-2, c-3, d-4", "a-2, b-1, c-3, d-4", "a-1, b-2, c-4, d-3", "a-1, b-3, c-2, d-4"], "correct_index": 0, "explanation_marathi": "RBI नियमानुसार सब-स्टँडर्ड = 12 महिन्यांपर्यंत NPA (a-1), त्यानंतर डाउटफुल (b-2); वसुली अशक्य पण खात्यात असलेली = लॉस अॅसेट (c-3); कलम 7 वित्तीय धनकोला CIRP चा अधिकार देते (d-4). कालावधी अदलाबदल करणारे व कलम 7 ला लॉस अॅसेटशी जोडणारे पर्याय चुकीचे.", "evidence": "RBI Master Circular on Prudential Norms on Income Recognition & Asset Classification; IBC 2016 Section 7, 9, 10 - IBBI"}, {"section": 7, "subtopic": "बेरोजगारी प्रकार: घर्षणात्मक", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "घर्षणात्मक बेरोजगारीबाबत खालील विधाने विचारात घ्या: (I) ही नोकरी शोधणे, बदलणे किंवा स्थलांतर करताना माहितीची अपूर्णता व वेळेच्या अंतरामुळे निर्माण होणारी ऐच्छिक व अल्पकालीन बेरोजगारी आहे. (II) पूर्ण रोजगाराच्या स्थितीतही ती शून्य होत नाही; त्यामुळे तिचा समावेश बेरोजगारीच्या नैसर्गिक दरात (NRU) केला जातो. (III) तिचे निर्मूलन करण्यासाठी प्रामुख्याने विस्तारवादी राजकोषीय-मौद्रिक धोरण (एकूण मागणी वाढवणे) आवश्यक असते. योग्य पर्याय निवडा:", "q_english": "Consider the following statements on frictional unemployment: (I) It is voluntary, short-term unemployment arising from imperfect information and time lags while searching, switching or migrating between jobs. (II) It does not become zero even at full employment; hence it is included in the natural rate of unemployment (NRU). (III) Its elimination primarily requires expansionary fiscal-monetary policy (raising aggregate demand). Choose the correct option:", "options": ["फक्त I आणि II बरोबर, III चूक", "फक्त I आणि III बरोबर, II चूक", "फक्त II आणि III बरोबर, I चूक", "I, II आणि III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I व II सत्य आहेत – घर्षणात्मक बेरोजगारी माहिती-असममितीमुळे ऐच्छिक व अल्पकालीन असते आणि पूर्ण रोजगारातही टिकते म्हणून NRU चा भाग आहे. III चूक आहे कारण मागणी-वाढवणारी धोरणे चक्रीय बेरोजगारीवर परिणाम करतात, घर्षणात्मकवर नव्हे; तिच्यासाठी रोजगार विनिमय केंद्रे, कौशल्य-माहिती यंत्रणा लागते. त्यामुळे III समाविष्ट असलेले पर्याय बाद होतात.", "evidence": "Mankiw – Principles of Economics; Economic Survey concepts: frictional = job search/transition, part of natural rate; expansionary policy addresses cyclical, not frictional unemployment."}, {"section": 7, "subtopic": "महाराष्ट्र: सहकार चळवळ", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या:\nI. विठ्ठलराव विखे पाटील यांच्या नेतृत्वाखाली 1950 मध्ये प्रवरानगर येथे आशियातील पहिला सहकारी साखर कारखाना स्थापन झाला.\nII. 97 व्या घटनादुरुस्तीने (2011) अनुच्छेद 43B समाविष्ट करून सहकारी संस्था चालवणे हा मूलभूत हक्क बनवला.\nIII. महाराष्ट्रातील सहकारी पत रचना त्रिस्तरीय आहे – प्राथमिक कृषी पत संस्था (PACS), जिल्हा मध्यवर्ती सहकारी बँक (DCC), राज्य सहकारी बँक (Apex).\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements:\nI. Under Vitthalrao Vikhe Patil's leadership, Asia's first cooperative sugar factory was established at Pravaranagar in 1950.\nII. The 97th Amendment (2011) inserted Article 43B making the running of a cooperative society a Fundamental Right.\nIII. Maharashtra's cooperative credit structure is three-tier – PACS, District Central Cooperative Bank (DCC), State Cooperative Bank (Apex).\nChoose the correct option:", "options": ["फक्त I आणि III बरोबर", "I, II आणि III बरोबर", "फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I सत्य आहे – प्रवरानगर (1950) हा आशियातील पहिला सहकारी साखर कारखाना; III सत्य आहे – PACS-DCC-Apex ही त्रिस्तरीय पत रचना. II असत्य आहे कारण मूलभूत हक्क अनुच्छेद 19(1)(c) ने दिला, तर 43B हा मार्गदर्शक तत्त्वांचा (DPSP) भाग आहे. त्यामुळे II समाविष्ट असलेले पर्याय चूक.", "evidence": "Pravaranagar Sahakari Sakhar Karkhana history 1950 – Vitthalrao Vikhe Patil; Constitution 97th Amendment 2011 – Article 19(1)(c), Article 43B, Part IX-B; Maharashtra Cooperative Societies Act 1960; NABARD – Short Term Cooperative Credit Structure"}, {"section": 7, "subtopic": "मानव विकास: HDI vs MPI", "qtype": "कारण-परिणाम", "q_marathi": "कारण (A): बहुआयामी दारिद्र्य निर्देशांक (MPI) हा आरोग्य, शिक्षण आणि राहणीमान या तीन आयामांतील 10 निर्देशकांवर एकाच कुटुंबात एकाच वेळी असणाऱ्या वंचिततेचे (overlapping deprivations) मापन करतो. परिणाम (R): मानव विकास निर्देशांक (HDI) हा केवळ दरडोई उत्पन्नावर आधारित असल्याने, ज्या देशाचा HDI कमी असतो त्या देशाचा MPI नेहमीच जास्त असतो.", "q_english": "Cause (A): The Multidimensional Poverty Index (MPI) measures overlapping deprivations in a household across 10 indicators in three dimensions – health, education and living standards. Effect (R): Since the Human Development Index (HDI) is based only on per capita income, a country with low HDI always has a high MPI.", "options": ["A आणि R दोन्ही सत्य आहेत, आणि R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य आहे, परंतु R असत्य आहे.", "A असत्य आहे, परंतु R सत्य आहे."], "correct_index": 2, "explanation_marathi": "A सत्य आहे कारण MPI हा OPHI-UNDP च्या 10 निर्देशकांवरील एकाच वेळच्या वंचिततेचे मापन करतो. R असत्य आहे कारण HDI हा आरोग्य, शिक्षण व दरडोई GNI या तिघांवर आधारित आहे, केवळ उत्पन्नावर नाही; तसेच HDI व MPI यांचा सहसंबंध असला तरी तो अनिवार्य नसतो. त्यामुळे R ला सत्य मानणारे A, B, D पर्याय बाद होतात.", "evidence": "UNDP Human Development Reports; OPHI Methodology: HDI = health (life expectancy), education (mean/expected years), GNI per capita; MPI = 10 indicators across health, education, living standards measuring joint deprivations."}, {"section": 7, "subtopic": "राष्ट्रीय उत्पन्न: CSO vs NSSO", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "राष्ट्रीय उत्पन्न मापनासंदर्भात खालील विधाने विचारात घ्या:\nI. केंद्रीय सांख्यिकी कार्यालय (CSO) आता राष्ट्रीय सांख्यिकी कार्यालय (NSO) चा भाग असून, ते GDP ची गणना 2011-12 या आधारभूत वर्षावर बाजार किमतीनुसार व स्थूल मूल्यवर्धन (GVA) पद्धतीने करते.\nII. राष्ट्रीय नमुना सर्वेक्षण कार्यालय (NSSO) थेट राष्ट्रीय उत्पन्नाचे आकलन करत नाही; ते रोजगार, बेरोजगारी व उपभोग खर्चाच्या सर्वेक्षणाद्वारे CSO च्या अंदाजासाठी पूरक आकडेवारी पुरवते.\nIII. 2015 च्या नवीन मालिकेत CSO ने कॉर्पोरेट क्षेत्राचे उत्पन्न मोजण्यासाठी MCA-21 डेटाबेस व 'प्रभावी कामगार इनपुट' पद्धतीचा अवलंब केला.\nवरीलपैकी कोणती विधाने बरोबर आहेत?", "q_english": "Consider the following statements regarding national income measurement:\nI. The Central Statistics Office (CSO), now part of the National Statistical Office (NSO), estimates GDP at market prices using the Gross Value Added (GVA) method with base year 2011-12.\nII. The National Sample Survey Office (NSSO) does not directly estimate national income; it provides supplementary data on employment, unemployment and consumption expenditure used by CSO for its estimates.\nIII. In the 2015 new series, CSO adopted the MCA-21 database and 'effective labour input' method to measure corporate sector income.\nWhich of the above statements are correct?", "options": ["फक्त I आणि II बरोबर", "फक्त II आणि III बरोबर", "I, II आणि III सर्व बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "तिन्ही विधाने बरोबर आहेत: 2019 मध्ये CSO+NSSO विलीनीकरण होऊन NSO बनले, GDP बाजारभाव+GVA पद्धतीने 2011-12 आधारावर मोजला जातो (I); NSSO हे सर्वेक्षण संस्था असून प्रत्यक्ष राष्ट्रीय उत्पन्न मोजत नाही (II); 2015 मालिकेत MCA-21 व प्रभावी कामगार इनपुट पद्धत वापरण्यात आली (III). त्यामुळे 'फक्त दोन' असलेले पर्याय चुकीचे ठरतात.", "evidence": "MOSPI: Changes in Methodology of National Accounts, New Series 2015; NSO Order 2019 (Merger of CSO & NSSO); Economic Survey 2022-23 Statistical Appendix"}, {"section": 7, "subtopic": "शेअर बाजार: SEBI व Sensex", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): भारतीय प्रतिभूती व विनिमय मंडळास (SEBI) सेबी कायदा, 1992 अन्वये वैधानिक दर्जा प्राप्त झाला असून ते भांडवली बाजाराचे नियमन व गुंतवणूकदारांच्या हिताचे संरक्षण करते.\nकारण (R): सेन्सेक्स हा BSE वरील 30 आघाडीच्या, विविध क्षेत्रांतील, सर्वाधिक तरल व मोठ्या बाजार भांडवलाच्या कंपन्यांचा मुक्त-प्रवाह बाजार भांडवल-भारित (free-float market-cap weighted) निर्देशांक आहे.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): SEBI received statutory status under the SEBI Act, 1992 and regulates the capital market and protects investors' interests.\nReason (R): Sensex is a free-float market-cap weighted index of 30 leading, cross-sectoral, highly liquid large-cap companies on BSE.\nChoose the correct option:", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य आहेत परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे परंतु R असत्य आहे", "A असत्य आहे परंतु R सत्य आहे"], "correct_index": 1, "explanation_marathi": "A सत्य (SEBI 1988 स्थापना, 1992 वैधानिक) आणि R सत्य (30 समभाग, free-float पद्धत, 1986/1978-79 आधार). मात्र R हे सेन्सेक्सची रचना सांगते, SEBI च्या वैधानिक कार्याचे कारण स्पष्ट करत नाही; त्यामुळे 'योग्य स्पष्टीकरण आहे' असलेला पर्याय 1 चुकीचा.", "evidence": "SEBI Act 1992 Preamble; BSE Sensex Methodology Factsheet - 30 stocks, free-float market capitalization, base year 1978-79 = 100"}, {"section": 8, "subtopic": "उत्सर्जन: मूत्रपिंड नेफ्रॉन", "qtype": "कारण-परिणाम", "q_marathi": "मूत्रपिंडाच्या नेफ्रॉन कार्यासंदर्भात योग्य कारण-परिणाम जोडी निवडा:", "q_english": "With reference to nephron functioning in kidney, select the correct cause-effect pair:", "options": ["कारण: ADH (व्हॅसोप्रेसिन) ची कमतरता → परिणाम: कमी प्रमाणात अत्यंत सांद्र मूत्र तयार होते / Cause: Deficiency of ADH (vasopressin) → Effect: Small volume of highly concentrated urine is formed", "कारण: हेनलेच्या पाशाची लांबी वाढणे (जक्स्टामेड्युलरी नेफ्रॉन) → परिणाम: प्रतिप्रवाह गुणक यंत्रणा तीव्र होऊन अधिक सांद्र मूत्र तयार होते / Cause: Increased length of Henle's loop (juxtamedullary nephron) → Effect: Counter-current multiplier intensifies forming more concentrated urine", "कारण: ग्लोमेरुलर केशिकांमधील रक्तदाब वाढणे → परिणाम: ग्लोमेरुलर निस्यंदन दर (GFR) कमी होतो / Cause: Increased glomerular capillary blood pressure → Effect: Glomerular filtration rate (GFR) decreases", "कारण: अल्डोस्टेरॉन स्राव वाढणे → परिणाम: दूरस्थ नलिकेत Na+ उत्सर्जन वाढते व K+ पुनर्शोषण वाढते / Cause: Increased aldosterone secretion → Effect: Na+ excretion increases and K+ reabsorption increases in distal tubule"], "correct_index": 1, "explanation_marathi": "योग्य जोडी B आहे: लांब हेनले पाशामुळे मेड्युलरी प्रवणता वाढून प्रतिप्रवाह यंत्रणा प्रभावी होते व सांद्र मूत्र बनते. A चूक कारण ADH कमतरतेने (डायबेटिस इन्सिपिडस) मोठ्या प्रमाणात विरल मूत्र बनते; C चूक कारण रक्तदाब वाढल्यास GFR वाढतो; D चूक कारण अल्डोस्टेरॉनमुळे Na+ पुनर्शोषण व K+ स्रवण/उत्सर्जन वाढते, उलट नाही.", "evidence": "NCERT Class 11 Biology, Chapter 19 Excretory Products and their Elimination: Counter-current mechanism by Henle's loop and vasa recta, ADH/diabetes insipidus, GFR regulation, aldosterone action on DCT/collecting duct for Na+/K+."}, {"section": 8, "subtopic": "उष्णता: वहन vs अभिसरण", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा:\nअ. गरम तव्यावर ठेवलेला धातूचा चमचा दुसऱ्या टोकाला गरम होणे\nब. उकळत्या पाण्यात दिसणारे वर-खाली जाणारे प्रवाह\nक. दिवसा किनाऱ्यावर समुद्राकडून जमिनीकडे वाहणारे वारे\nड. थर्मासच्या दुहेरी भिंतींमधील निर्वात पोकळी\n1. वहन - रेणूंचे स्थूल स्थानांतर न होता टकरीद्वारे उष्णता हस्तांतरण\n2. अभिसरण - घनता/तापमान फरकाने माध्यमाच्या स्थूल प्रवाहाद्वारे हस्तांतरण\n3. प्रारण - माध्यमाशिवाय विद्युतचुंबकीय लहरींद्वारे हस्तांतरण\n4. उष्णता हस्तांतरणास प्रतिबंध (रोधन)\nयोग्य जोडी निवडा:", "q_english": "Match the pairs:\na. Metal spoon heated at the other end when kept on hot pan\nb. Up-down currents seen in boiling water\nc. Daytime sea breeze blowing from sea to land on coast\nd. Vacuum gap between double walls of thermos\n1. Conduction - heat transfer by collision without bulk movement of molecules\n2. Convection - transfer by bulk flow of medium due to density/temperature difference\n3. Radiation - transfer by EM waves without medium\n4. Prevention of heat transfer (insulation)\nChoose the correct match:", "options": ["अ-1, ब-2, क-2, ड-4", "अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-2, ड-3", "अ-1, ब-3, क-2, ड-4"], "correct_index": 0, "explanation_marathi": "अ हे घन माध्यमातील वहन (1) आहे, ब मधील पाण्याचे व क मधील हवेचे घनता-प्रवाह दोन्ही अभिसरण (2) आहेत, ड मधील निर्वात वहन-अभिसरण रोखतो (4). क ला प्रारण मानणे किंवा ब ला प्रारण मानणे यामुळे इतर पर्याय चुकतात.", "evidence": "NCERT Class 7 Science Chapter 4 Heat - conduction in solids, convection in water/air, sea breeze as convection example; thermos vacuum prevents conduction/convection."}, {"section": 8, "subtopic": "कार्बोहायड्रेट: ग्लुकोज", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: स्तंभ-I (प्रक्रिया) - a) ग्लायकोलिसिस, b) ग्लुकोनिओजेनेसिस, c) ग्लायकोजेनेसिस, d) पेंटोज फॉस्फेट मार्ग; स्तंभ-II (वैशिष्ट्य) - i) यकृतात लॅक्टेट, ग्लिसरॉल व अमिनो आम्लांपासून ग्लुकोजची नवनिर्मिती, ii) पेशीद्रव्यात ग्लुकोजचे पायरुव्हेटमध्ये विघटन; निव्वळ 2 ATP प्राप्ती, iii) NADPH व रायबोज-5-फॉस्फेटची निर्मिती, iv) यकृत व स्नायूंमध्ये UDP-ग्लुकोजपासून ग्लायकोजेन साठवण.", "q_english": "Match the pairs: Column-I (Process) - a) Glycolysis, b) Gluconeogenesis, c) Glycogenesis, d) Pentose phosphate pathway; Column-II (Feature) - i) De novo glucose synthesis in liver from lactate, glycerol and amino acids, ii) Breakdown of glucose to pyruvate in cytoplasm; net 2 ATP yield, iii) Production of NADPH and ribose-5-phosphate, iv) Glycogen storage from UDP-glucose in liver and muscles.", "options": ["a-ii, b-iv, c-i, d-iii", "a-i, b-ii, c-iv, d-iii", "a-ii, b-i, c-iv, d-iii", "a-ii, b-i, c-iii, d-iv"], "correct_index": 2, "explanation_marathi": "ग्लायकोलिसिस पेशीद्रव्यात (a-ii), ग्लुकोनिओजेनेसिस यकृतात नॉन-कार्बोहायड्रेटपासून (b-i), ग्लायकोजेनेसिस साठवण (c-iv) व पेंटोज फॉस्फेट मार्ग NADPH निर्मिती (d-iii) ही प्रमाणित स्थाने व उत्पादने आहेत. इतर पर्यायांत b-c किंवा c-d ची अदलाबदल केली आहे, जी ग्लायकोजेन साठवण व NADPH निर्मिती यांतील मूलभूत फरक ओळखल्यास बाद होते.", "evidence": "NCERT Class 11 Biology, Chapter 14 Respiration in Plants / Chapter 9 Biomolecules; Harper's Illustrated Biochemistry / Lehninger Biochemistry - glycolysis in cytoplasm, gluconeogenesis and glycogenesis in liver, pentose phosphate pathway for NADPH"}, {"section": 8, "subtopic": "खनिजे: लोह vs आयोडीन", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "लोह (Fe) हे हीमोग्लोबिन व सायटोक्रोमचा घटक आहे, तर आयोडीन (I) हे थायरॉक्सिन (T3/T4) संप्रेरकाचा घटक आहे. ऊर्जा चयापचयाच्या संदर्भात या दोन्ही खनिजांच्या एकत्रित भूमिकेचे अचूक वर्णन कोणते?", "q_english": "Iron (Fe) is a component of hemoglobin and cytochromes, while iodine (I) is a component of thyroxine (T3/T4). Which statement accurately describes their combined role in energy metabolism?", "options": ["लोह T3/T4 संप्रेरकांच्या संश्लेषणासाठी तर आयोडीन हीमोग्लोबिनच्या हीम गटासाठी आवश्यक आहे; दोन्हींच्या कमतरतेने सूक्ष्मपेशी रक्तक्षय (microcytic anemia) होतो", "लोह थायरॉइड ग्रंथीची अतिवृद्धी रोखते तर आयोडीन अस्थिमज्जेतील लाल रक्तपेशी निर्मिती वाढवते; दोन्हींच्या आधिक्याने गॉयटर होतो", "लोह सायटोक्रोम संकुलांद्वारे इलेक्ट्रॉन वाहतूक साखळीत कार्य करते तर आयोडीनयुक्त T3/T4 मूलभूत चयापचय दर (BMR) नियंत्रित करते; दोन्हींच्या कमतरतेमुळे ऑक्सिडेटिव्ह फॉस्फोरिलेशन व ATP निर्मिती मंदावते", "लोह कॅल्सिटोनिन स्राव वाढवून तर आयोडीन मायोग्लोबिनमध्ये ऑक्सिजन साठवून हाडांचे खनिजीकरण घडवते; दोन्हींच्या कमतरतेने अस्थिमृदुता येते"], "correct_index": 2, "explanation_marathi": "लोह हे ETC मधील सायटोक्रोम व हीमोग्लोबिनद्वारे ऑक्सिजन/इलेक्ट्रॉन वहन करते, तर आयोडीनयुक्त T3/T4 हा BMR व मायटोकॉंड्रियल श्वसनाचा दर ठरवतो; त्यामुळे दोन्हींच्या कमतरतेने ATP निर्मिती घटते हे 2-चरणीय तर्काने सिद्ध होते. पर्याय 1 मध्ये कार्ये अदलाबदल केली आहेत, पर्याय 2 व 4 मध्ये थायरॉइड-रक्तक्षय व कॅल्सिटोनिन-मायोग्लोबिनचे चुकीचे संबंध जोडले आहेत.", "evidence": "NCERT Class 11 Biology, Chapters 18 (Body Fluids and Circulation - Hemoglobin) and 22 (Chemical Coordination - Thyroid hormones); Lehninger Principles of Biochemistry - Cytochromes in electron transport chain and thyroid regulation of BMR"}, {"section": 8, "subtopic": "गुरुत्व: g vs G", "qtype": "कालक्रम लावा", "q_marathi": "g च्या मूल्यानुसार चढत्या क्रमाने (कमी ते जास्त) लावा:\nअ. पृथ्वीच्या केंद्रावर g\nब. चंद्राच्या पृष्ठभागावर g\nक. विषुववृत्तावर समुद्रसपाटीवर g\nड. ध्रुवावर समुद्रसपाटीवर g\nयोग्य क्रम निवडा:", "q_english": "Arrange in increasing order of g (low to high):\na. g at Earth's centre\nb. g on Moon's surface\nc. g at sea level on equator\nd. g at sea level on pole\nChoose the correct sequence:", "options": ["अ < ब < क < ड", "अ < ब < ड < क", "ब < अ < क < ड", "अ < क < ब < ड"], "correct_index": 0, "explanation_marathi": "केंद्रावर g=0, चंद्रावर ~1.62 m/s² (पृथ्वीच्या ~1/6), विषुववृत्तावर 9.78 तर ध्रुवावर 9.83 m/s²; G मात्र सर्वत्र 6.674×10⁻¹¹ Nm²/kg² स्थिर आहे. ड>क हा सूक्ष्म फरक किंवा अ=0 दुर्लक्षित केल्यास इतर क्रम चुकतात.", "evidence": "NCERT Class 9 Science Chapter 10 Gravitation - g=GM/R², g=0 at centre, variation with latitude due to rotation/shape; G universal constant 6.674×10⁻¹¹ N m² kg⁻² (CODATA)."}, {"section": 8, "subtopic": "चरबी: संतृप्त vs असंतृप्त", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): संतृप्त फॅटी आम्लांपेक्षा सिस-असंतृप्त फॅटी आम्लांचा द्रवणांक (melting point) कमी असतो. कारण (R): सिस-दुहेरी बंधामुळे हायड्रोकार्बन साखळीत वाक (kink) निर्माण होतो, ज्यामुळे रेणूंमधील घट्ट संकुलन व व्हॅन डर वाल्स आकर्षण कमी होते.", "q_english": "Assertion (A): Cis-unsaturated fatty acids have a lower melting point than saturated fatty acids. Reason (R): A cis-double bond introduces a kink in the hydrocarbon chain, which reduces close packing and van der Waals attraction between molecules.", "options": ["A आणि R दोन्ही बरोबर असून R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर आहे, परंतु R चूक आहे", "A चूक आहे, परंतु R बरोबर आहे"], "correct_index": 0, "explanation_marathi": "सिस-वाकामुळे असंतृप्त साखळ्या सरळ संतृप्त साखळ्यांप्रमाणे घट्ट बसत नाहीत, त्यामुळे द्रवणांक कमी होतो हे दोन्ही सत्य असून R हे A चे थेट आण्विक स्पष्टीकरण आहे. B पर्याय स्पष्टीकरण नाकारतो म्हणून चूक, तर C/D मध्ये एक विधान चूक ठरवले आहे जे तथ्यांशी विसंगत आहे.", "evidence": "NCERT Class 11 Biology, Chapter 9 Biomolecules - lipids; Lehninger Principles of Biochemistry - effect of cis-double bonds, kinks and van der Waals packing on melting point of fatty acids"}, {"section": 8, "subtopic": "जीवनसत्त्वे: A vs D", "qtype": "कारण-परिणाम", "q_marathi": "जीवनसत्त्व A च्या कमतरतेने रातांधळेपणा येतो, तर जीवनसत्त्व D च्या कमतरतेने लहान मुलांमध्ये मुडदूस (रिकेट्स) होतो. या दोन परिणामांमागील कारण-परिणाम साखळीतील मूलभूत फरक कोणता?", "q_english": "Vitamin A deficiency causes night blindness, while vitamin D deficiency causes rickets in children. What is the fundamental cause-effect difference underlying these two outcomes?", "options": ["अ जीवनसत्त्वापासून तयार होणारे रेटिनल हे रॉड पेशींतील रोडॉप्सिनच्या पुनर्निर्मितीसाठी आवश्यक असते; ड जीवनसत्त्वापासून तयार होणारे कॅल्सिट्रिऑल आतड्यातील कॅल्शियम व फॉस्फेटचे शोषण वाढवते", "अ जीवनसत्त्वापासून तयार होणारे कॅल्सिट्रिऑल आतड्यातील कॅल्शियम शोषण वाढवते; ड जीवनसत्त्वापासून तयार होणारे रेटिनल रोडॉप्सिनच्या पुनर्निर्मितीसाठी आवश्यक असते", "अ आणि ड ही दोन्ही जीवनसत्त्वे पॅराथायरॉइड संप्रेरकाला उत्तेजित करून हाडांतील कॅल्शियम मुक्त करतात; फरक फक्त मात्रेत असतो", "अ जीवनसत्त्व आतड्यातील कॅल्शियम शोषण वाढवते, तर ड जीवनसत्त्व शंकू पेशींतील आयोडॉप्सिनच्या संश्लेषणात भाग घेते"], "correct_index": 0, "explanation_marathi": "अ जीवनसत्त्वाचे रेटिनल हे मंद प्रकाशातील दृष्टीसाठी आवश्यक असलेल्या रोडॉप्सिनचे घटक आहे, त्यामुळे कमतरतेने रातांधळेपणा येतो; तर ड जीवनसत्त्वाचे कॅल्सिट्रिऑल आतड्यात Ca-P शोषण वाढवून हाडांचे खनिजीकरण करते, त्यामुळे कमतरतेने रिकेट्स होतो. पर्याय B मध्ये कार्ये अदलाबदल केली आहेत, C मध्ये दोन्हींचा PTH मार्ग चुकीचा आहे आणि D मध्ये आयोडॉप्सिन व कॅल्शियमचे संदर्भ चुकले आहेत.", "evidence": "NCERT Class 11 Biology, Chapter Biomolecules - fat soluble vitamins; Harper's Illustrated Biochemistry, Chapters on Retinol/Rhodopsin visual cycle and Calcitriol-mediated intestinal calcium-phosphate absorption"}, {"section": 8, "subtopic": "दाब: वातावरणीय vs रक्तदाब", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता अभ्यासा:\n| घटक | मूल्य/तथ्य |\n| P. समुद्रसपाटीवर वातावरणीय दाब | 1. सुमारे 1.013×10⁵ Pa (760 mm Hg) |\n| Q. निरोगी प्रौढाचा सामान्य रक्तदाब | 2. सुमारे 120/80 mm Hg |\n| R. उंच ठिकाणी जाणे | 3. वातावरणीय दाब कमी होतो, हायपोक्सियामुळे तात्पुरता रक्तदाब वाढू शकतो |\nयोग्य निष्कर्ष निवडा:", "q_english": "Study the table:\n| Component | Value/Fact |\n| P. Atmospheric pressure at sea level | 1. ~1.013×10⁵ Pa (760 mm Hg) |\n| Q. Normal blood pressure of healthy adult | 2. ~120/80 mm Hg |\n| R. Going to high altitude | 3. Atmospheric pressure decreases, BP may temporarily rise due to hypoxia |\nChoose the correct inference:", "options": ["P-1 बरोबर, Q-2 बरोबर, R-3 बरोबर; वातावरणीय दाब बॅरोमीटरने तर रक्तदाब स्फिग्मोमॅनोमीटरने मोजतात", "P-1 बरोबर, Q-2 बरोबर, R-3 चूक; उंचीवर वातावरणीय दाब वाढतो म्हणून रक्तदाब कमी होतो", "P-1 चूक (1.013×10³ Pa), Q-2 बरोबर, R-3 बरोबर; दोन्ही दाब एकाच उपकरणाने मोजतात", "P-1 बरोबर, Q-2 चूक (200/120 mm Hg सामान्य), R-3 बरोबर; वातावरणीय दाबाचा रक्तदाबावर कोणताही परिणाम नाही"], "correct_index": 0, "explanation_marathi": "P चे 101.3 kPa = 760 mm Hg हे प्रमाणित मूल्य बरोबर, Q चे 120/80 हे वैद्यकीय प्रमाण बरोबर. R मध्ये उंचीवर दाब घटतो हे बरोबर आहे; पर्याय 2 दाब वाढतो म्हणतो, पर्याय 3 एककात 10² ची चूक करतो व उपकरण एकच म्हणतो, पर्याय 4 रक्तदाबाचे मूल्य चुकवतो.", "evidence": "NCERT Class 8 Science Chapter 11 Force and Pressure - 1 atm =1.013×10⁵ Pa measured by barometer; NCERT Biology - normal BP 120/80 mm Hg measured by sphygmomanometer; altitude effect on pressure and physiological response."}, {"section": 8, "subtopic": "ध्वनी: वारंवारता vs तीव्रता", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या:\nI. ध्वनीची तीव्रता ही आयामाच्या वर्गाच्या समप्रमाणात असते (I ∝ A²) व ती डेसिबल (dB) मध्ये मोजतात, तर वारंवारता ही प्रति सेकंद कंपनसंख्या असून हर्ट्झ (Hz) मध्ये मोजतात.\nII. 20 Hz पेक्षा कमी वारंवारतेच्या अवश्राव्य (infrasonic) ध्वनीची तीव्रता 0 dB पेक्षा कमी असतेच असे नाही; तीव्रता व वारंवारता या स्वतंत्र राशी आहेत.\nIII. स्त्रीचा आवाज पुरुषापेक्षा कर्णकटू (shrill) वाटण्याचे मुख्य कारण तिच्या आवाजाची तीव्रता जास्त असणे हे आहे, वारंवारता जास्त असणे हे नाही.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements:\nI. Intensity of sound is proportional to square of amplitude (I ∝ A²) and measured in decibel (dB), while frequency is number of vibrations per second measured in hertz (Hz).\nII. Infrasonic sound (<20 Hz) need not have intensity below 0 dB; intensity and frequency are independent quantities.\nIII. A woman's voice sounds shriller than a man's mainly due to greater intensity, not greater frequency.\nChoose the correct option:", "options": ["I आणि II बरोबर, III चूक", "I आणि III बरोबर, II चूक", "II आणि III बरोबर, I चूक", "I, II आणि III सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "I बरोबर आहे: I ∝ A², dB विरुद्ध Hz हा एकक-भेद मूलभूत आहे. II बरोबर आहे: अवश्राव्य ही वारंवारतेची वर्गवारी आहे, तीव्रतेची नाही; मोठ्या आयामाचा अवश्राव्य ध्वनीही जास्त dB चा असू शकतो. III चूक आहे: कर्णकटूपणा (pitch) वारंवारतेवर तर मोठेपणा (loudness) तीव्रतेवर अवलंबून असतो.", "evidence": "NCERT Class 9 Science Chapter 12 Sound - loudness ∝ amplitude², pitch determined by frequency, dB vs Hz; infrasonic <20 Hz definition; 0 dB threshold of hearing at 1 kHz."}, {"section": 8, "subtopic": "पुनरुत्पादन: परागण", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "परागणासंदर्भात खालील विधाने पहा:\n(I) वायु-परागित (ॲनिमोफिली) फुलांत परागकण हलके, कोरडे, मोठ्या संख्येने तयार होतात; परागकणकेशर (stigma) पिसासारखे व फुलाबाहेर प्रलंबित असते.\n(II) कीटक-परागित (एंटोमोफिली) फुलांत परागकण चिकट/काटेरी, मकरंद-ग्रंथी व आकर्षक दलपुंज असतात; तसेच डायकोगॅमी आणि हर्कोगॅमी या युक्त्या स्व-परागण टाळून पर-परागणास प्रोत्साहन देतात.\n(III) दुहेरी फलन ही फक्त पर-परागणानंतरच घडणारी प्रक्रिया आहे; स्व-परागणानंतर दुहेरी फलन होत नाही.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements regarding pollination:\n(I) In anemophilous flowers, pollen grains are light, dry, produced in large numbers; stigma is feathery and exserted outside the flower.\n(II) In entomophilous flowers, pollen grains are sticky/spiny, with nectaries and attractive corolla; dichogamy and herkogamy prevent self-pollination and promote cross-pollination.\n(III) Double fertilization occurs only after cross-pollination; it does not occur after self-pollination.\nChoose the correct option:", "options": ["(I), (II) बरोबर, (III) चूक / (I), (II) correct, (III) incorrect", "फक्त (I) बरोबर / Only (I) correct", "(I), (III) बरोबर, (II) चूक / (I), (III) correct, (II) incorrect", "(II), (III) बरोबर, (I) चूक / (II), (III) correct, (I) incorrect"], "correct_index": 0, "explanation_marathi": "विधाने I व II बरोबर आहेत: वायु-परागणाची व कीटक-परागणाची (डायकोगॅमी/हर्कोगॅमीसह) लक्षणे अचूक वर्णन केली आहेत. विधान III चूक आहे कारण स्व-परागणानंतरही अंकुरण व दुहेरी फलन (syngamy + triple fusion) घडते; परागणाचा प्रकार फलनाची क्षमता ठरवत नाही. त्यामुळे फक्त I असलेला पर्याय अपूर्ण आहे.", "evidence": "NCERT Class 12 Biology, Chapter 2 Sexual Reproduction in Flowering Plants: Anemophily vs entomophily adaptations, dichogamy/herkogamy as outbreeding devices, double fertilization (syngamy and triple fusion) independent of self/cross-pollination."}, {"section": 8, "subtopic": "प्रकाश: वर्णपट VIBGYOR", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): प्राथमिक इंद्रधनुष्यात बाहेरील कडा लाल आणि आतील कडा जांभळी (Violet) दिसते.\nकारण (R): पाण्याच्या थेंबासाठी जांभळ्या रंगाचा अपवर्तनांक लालपेक्षा जास्त असल्याने जांभळ्याचे विचलन जास्त होते आणि प्राथमिक इंद्रधनुष्यात सूर्यप्रकाशाचे एकदा पूर्ण आंतरिक परावर्तन व दोनदा अपवर्तन होते.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): In a primary rainbow the outer edge is red and the inner edge is violet.\nReason (R): Refractive index of water droplet is greater for violet than for red, so violet deviates more, and primary rainbow involves one total internal reflection and two refractions of sunlight.\nChoose the correct option:", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य आहेत पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य आहे, R असत्य आहे", "A असत्य आहे, R सत्य आहे"], "correct_index": 0, "explanation_marathi": "प्राथमिकमध्ये लाल ~42.8° तर जांभळा ~40.8° कोनात दिसतो म्हणून लाल बाहेर, जांभळा आत; हे μ_violet > μ_red या फरकामुळेच व एका आंतरिक परावर्तनामुळेच घडते. त्यामुळे R हे A चे कार्यकारण स्पष्टीकरण आहे, इतर पर्याय स्पष्टीकरण नाकारल्याने चुकतात.", "evidence": "NCERT Class 10 Science Chapter 11 Human Eye and Colourful World - rainbow formation, refractive index varies with wavelength, primary rainbow one internal reflection; secondary rainbow two reflections with reversed colours."}, {"section": 8, "subtopic": "प्रथिने: अमिनो आम्ल", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "अमिनो आम्लांबाबत खालील विधाने विचारात घ्या: I: निसर्गातील सर्व प्रथिनोजेनिक अमिनो आम्ले L-प्रकारची असून ग्लायसीन हे एकमेव अकिरल (achiral) अमिनो आम्ल आहे. II: पेप्टाइड बंध निर्मिती ही संघनन (निर्जलीकरण) अभिक्रिया असून त्यात एका अमिनो आम्लाचा α-कार्बोक्सिल गट व दुसऱ्याचा α-अमिनो गट यांच्यातून पाण्याचा रेणू मुक्त होतो. III: आयसोइलेक्ट्रिक pH ला अमिनो आम्ल निव्वळ उदासीन झ्विटरआयन स्वरूपात असते, तर आम्लारी (acidic) pH मध्ये ते ऋणप्रभारीत (anionic) होते. योग्य पर्याय निवडा.", "q_english": "Consider the following statements about amino acids: I: All proteinogenic amino acids in nature are of L-type and glycine is the only achiral amino acid. II: Peptide bond formation is a condensation (dehydration) reaction in which a water molecule is released between the alpha-carboxyl group of one amino acid and the alpha-amino group of another. III: At isoelectric pH an amino acid exists as a net-neutral zwitterion, while at acidic pH it becomes anionic. Choose the correct option.", "options": ["फक्त II आणि III बरोबर", "फक्त I आणि II बरोबर", "I, II आणि III सर्व बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 1, "explanation_marathi": "विधान I व II सत्य आहेत: ग्लायसीनमध्ये α-कार्बनला दोन H असल्याने ते अकिरल आहे आणि पेप्टाइड बंध हा -CO-NH- सहसंयोजक बंध पाणी मुक्त करून तयार होतो. विधान III चूक आहे कारण आम्लारी pH ला -NH3+ व -COOH मुळे अमिनो आम्ल धनप्रभारीत (cationic) होते, ऋणप्रभारीत नाही; त्यामुळे III असलेले पर्याय बाद होतात.", "evidence": "NCERT Class 11 Biology, Chapter 9 Biomolecules - amino acid structure, zwitterion and peptide bond; Lehninger Principles of Biochemistry - chirality of amino acids and isoelectric pH behavior"}, {"section": 8, "subtopic": "प्राणी ऊती: स्नायू प्रकार", "qtype": "कालक्रम लावा", "q_marathi": "कंकालीय स्नायू आकुंचनाच्या (sliding filament theory) घटनांचा योग्य कालक्रम लावा:\n(A) मोटर एंड-प्लेटवर ॲसिटिलकोलीन मुक्त होऊन स्नायूतंतु पटलाचे विध्रुवीकरण,\n(B) सार्कोप्लाझ्मिक रेटिक्युलममधून Ca2+ चे पेशीद्रव्यात मुक्तता,\n(C) Ca2+ चे ट्रोपोनिन-C शी बंधन → ट्रोपोमायोसिनचे ॲक्टिनवरील सक्रिय स्थळावरून विस्थापन,\n(D) मायोसिन शीर्षाचे ॲक्टिनशी क्रॉस-ब्रिज बंधन, ATP जलविच्छेदनातून पॉवर स्ट्रोक,\n(E) Z-रेषा परस्परांजवळ येऊन सार्कोमियर लहान होणे.", "q_english": "Arrange the events of skeletal muscle contraction (sliding filament theory) in correct chronological order:\n(A) Acetylcholine release at motor end-plate causing depolarization of muscle fibre membrane,\n(B) Release of Ca2+ from sarcoplasmic reticulum into sarcoplasm,\n(C) Ca2+ binding to troponin-C → displacement of tropomyosin from active sites on actin,\n(D) Myosin head cross-bridge formation with actin, power stroke via ATP hydrolysis,\n(E) Z-lines move closer causing sarcomere shortening.", "options": ["(A) → (B) → (C) → (D) → (E)", "(A) → (C) → (B) → (D) → (E)", "(A) → (B) → (D) → (C) → (E)", "(B) → (A) → (C) → (D) → (E)"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A→B→C→D→E आहे: आधी चेता-आवेग व विध्रुवीकरण, नंतर Ca2+ मुक्तता, नंतर ट्रोपोनिन-ट्रोपोमायोसिन बदल, नंतर क्रॉस-ब्रिज व पॉवर स्ट्रोक, शेवटी सार्कोमियर आकुंचन. पर्याय 2 मध्ये B आधी C चुकीचा, पर्याय 3 मध्ये D आधी C चुकीचा, पर्याय 4 मध्ये B आधी A चुकीचा आहे.", "evidence": "NCERT Class 11 Biology, Chapter 20 Locomotion and Movement: Mechanism of muscle contraction - acetylcholine, Ca2+ release from sarcoplasmic reticulum, troponin-tropomyosin complex, cross-bridge cycle and sarcomere shortening."}, {"section": 8, "subtopic": "वनस्पती संप्रेरक: ऑक्सिन", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्त्यात ऑक्सिनशी संबंधित शारीरिक परिणाम (स्तंभ-A) आणि त्यामागील अट/यंत्रणा (स्तंभ-B) दिली आहे:\nस्तंभ-A: (1) खोडाचे प्रकाशानुवर्तन, (2) शेंडा प्रबलता, (3) छाट-कलमात अपस्थानिक मुळांची निर्मिती, (4) 2,4-D चा तणनाशक म्हणून वापर\nस्तंभ-B: (a) एकतर्फी प्रकाशामुळे छायांकित बाजूस ऑक्सिनचे अधिक संचयन → त्या बाजूची अधिक पेशीवाढ, (b) शेंड्यातील उच्च IAA → पार्श्व कळ्यांत वाढ रोध (इथिलीन/ABA मार्ग), (c) कमी-ऑप्टिमम सांद्रतेत IBA/NAA → कॅम्बियमपासून मुळे प्रारंभ, (d) अति-उच्च सांद्रता (2,4-D) → द्विदल तणांत अनियंत्रित चयापचय बिघाड व मृत्यू\nयोग्य A-B जोड्यांचा संच निवडा:", "q_english": "In the table below, physiological effects related to auxin (Column-A) and their condition/mechanism (Column-B) are given:\nColumn-A: (1) Phototropic curvature of shoot, (2) Apical dominance, (3) Adventitious root formation in cuttings, (4) Use of 2,4-D as herbicide\nColumn-B: (a) Unilateral light causes greater auxin accumulation on shaded side → greater cell elongation there, (b) High IAA in apex → growth inhibition of lateral buds (via ethylene/ABA pathway), (c) Low-optimum IBA/NAA → root initiation from cambium, (d) Supra-optimal (2,4-D) → uncontrolled metabolic disruption and death in dicot weeds\nChoose the correct set of A-B pairs:", "options": ["(1)-(a), (2)-(b), (3)-(d), (4)-(c)", "(1)-(b), (2)-(a), (3)-(c), (4)-(d)", "(1)-(a), (2)-(b), (3)-(c), (4)-(d)", "(1)-(a), (2)-(c), (3)-(b), (4)-(d)"], "correct_index": 2, "explanation_marathi": "योग्य जोडी (1-a, 2-b, 3-c, 4-d) आहे कारण प्रकाशानुवर्तनात ऑक्सिनचे पार्श्विक असमान वितरण, शेंडा प्रबलतेत उच्च ऑक्सिनकडून पार्श्व रोध, कमी सांद्रतेत मुळे-प्रारंभ आणि अति-उच्च सांद्रतेत तणनाशक क्रिया होते. पर्याय 1 मध्ये (3-d, 4-c) अदलाबदल चुकीची आहे, पर्याय 2 मध्ये (1-b, 2-a) अदलाबदल चुकीची आहे, पर्याय 4 मध्ये (2-c, 3-b) अदलाबदल चुकीची आहे.", "evidence": "NCERT Class 11 Biology, Chapter 15 Plant Growth and Development: Auxin - phototropism via asymmetric distribution, apical dominance, root initiation in cuttings with IBA/NAA, 2,4-D as synthetic auxin herbicide at high concentration."}, {"section": 8, "subtopic": "श्वसन: फुफ्फुस अल्व्होली", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "फुफ्फुस अल्व्होलाईची संरचना (सर्फॅक्टंट) आणि वायू विनिमयाचा भौतिक नियम (डाल्टनचा आंशिक दाब नियम) यांचा एकत्रित विचार करा. खालीलपैकी योग्य संयुक्त निष्कर्ष कोणता?", "q_english": "Consider together the structure of pulmonary alveoli (surfactant) and the physical law of gas exchange (Dalton's law of partial pressures). Which combined conclusion is correct?", "options": ["सर्फॅक्टंट (टाइप-II न्यूमोसाइट्स) पृष्ठताण वाढवते, त्यामुळे अल्व्होली फुगण्यास जास्त दाब लागतो आणि डाल्टन नियमानुसार O2 चा प्रसरण दाब-प्रवणतेविरुद्ध होतो / Surfactant (type-II pneumocytes) increases surface tension, requiring higher pressure to inflate alveoli and O2 diffuses against its pressure gradient per Dalton's law", "सर्फॅक्टंट पृष्ठताण कमी करून अल्व्होलर अनुपालन वाढवते व अतिसूक्ष्म अल्व्होली कोसळण्यापासून रोखते; डाल्टन नियमानुसार O2 अल्व्होली (pO2 ~104 mmHg) कडून रक्त केशिकेत (pO2 ~40 mmHg) दाब-प्रवणतेनुसार पसरतो / Surfactant reduces surface tension increasing alveolar compliance and prevents collapse of tiny alveoli; per Dalton's law O2 diffuses down its pressure gradient from alveoli (pO2 ~104 mmHg) to capillary blood (pO2 ~40 mmHg)", "सर्फॅक्टंटअभावी अल्व्होलर पृष्ठताण कमी होतो व श्वसन सुलभ होते; CO2 रक्तातून (pCO2 ~45 mmHg) अल्व्होलीत (pCO2 ~40 mmHg) उच्च दाबाकडे पसरतो / In surfactant deficiency alveolar surface tension decreases easing breathing; CO2 diffuses from blood (pCO2 ~45 mmHg) to alveoli (pCO2 ~40 mmHg) towards higher pressure", "टाइप-I न्यूमोसाइट्स सर्फॅक्टंट स्रवतात ज्यामुळे अल्व्होली आकुंचन पावतात; O2 व CO2 दोन्ही आंशिक दाब समान झाल्यावरच विनिमय थांबतो हे डाल्टन नियमाचे उल्लंघन आहे / Type-I pneumocytes secrete surfactant causing alveolar collapse; exchange of O2 and CO2 stops only when partial pressures equalize which violates Dalton's law"], "correct_index": 1, "explanation_marathi": "योग्य निष्कर्ष B आहे: सर्फॅक्टंट पृष्ठताण कमी करते व अनुपालन वाढवते, आणि O2 उच्च pO2 कडून निम्न pO2 कडे पसरतो हे डाल्टन नियमानुसार बरोबर आहे. A चूक कारण सर्फॅक्टंट पृष्ठताण कमी करते व प्रसरण प्रवणतेनुसारच होते; C चूक कारण अभावी पृष्ठताण वाढते व CO2 निम्न दाबाकडे पसरतो; D चूक कारण सर्फॅक्टंट टाइप-II पेशी स्रवतात व वर्णन परस्परविरोधी आहे.", "evidence": "NCERT Class 11 Biology, Chapter 17 Breathing and Exchange of Gases: Alveolar surfactant by type-II pneumocytes reduces surface tension/prevents collapse; Dalton's law - diffusion of O2 (104 to 40 mmHg) and CO2 (45 to 40 mmHg) down partial pressure gradients."}];
let currentSet='A';let currentFilter='all';
const sectionNames={3:"3. चालू घडामोडी",4:"4. इतिहास",5:"5. भूगोल",6:"6. राज्यशास्त्र",7:"7. अर्थशास्त्र",8:"8. सामान्य विज्ञान"};
const filtersEl=document.getElementById('filters');const quizEl=document.getElementById('quiz');const progressEl=document.getElementById('progress');
function getQuestions(){return currentSet==='A'?QUESTIONS_A:QUESTIONS_B;}
function renderFilters(){
 filtersEl.innerHTML='';
 const allBtn=document.createElement('button');allBtn.className='filter-btn'+(currentFilter==='all'?' active':'');allBtn.textContent='सर्व (90)';
 allBtn.onclick=()=>{currentFilter='all';renderFilters();renderQuiz();};filtersEl.appendChild(allBtn);
 [3,4,5,6,7,8].forEach(s=>{const b=document.createElement('button');b.className='filter-btn'+(currentFilter===s?' active':'');b.textContent=sectionNames[s]+' (15)';b.onclick=()=>{currentFilter=s;renderFilters();renderQuiz();};filtersEl.appendChild(b);});
}
function renderQuiz(){
 const qs=getQuestions().filter(q=>currentFilter==='all'||q.section===currentFilter);
 progressEl.textContent='संच '+currentSet+' • दाखवलेले प्रश्न: '+qs.length;
 quizEl.innerHTML='';
 qs.forEach((q,idx)=>{
  const card=document.createElement('div');card.className='qcard';
  const letters=['A','B','C','D'];
  let optsHtml=q.options.map((op,i)=>'<div class="opt"><span class="opt-letter">'+letters[i]+'.</span><span>'+op.replace(/\n/g,'<br>')+'</span></div>').join('');
  card.innerHTML='<div class="qmeta"><span class="badge">'+sectionNames[q.section]+'</span><span class="badge type">'+(q.qtype||'')+'</span><span class="badge diff">कठीणता 5/5</span><span class="badge" style="background:#f3e5f5;color:#6a1b9a">'+(q.subtopic||'')+'</span></div><div class="qtext"><b>प्रश्न '+(idx+1)+'.</b> '+q.q_marathi.replace(/\n/g,'<br>')+'<span class="en">'+q.q_english.replace(/\n/g,'<br>')+'</span></div><div class="opts">'+optsHtml+'</div><button class="show-ans">उत्तर पहा</button><div class="ansbox"><div class="correct">✅ योग्य उत्तर: '+letters[q.correct_index]+' – '+q.options[q.correct_index]+'</div><div class="expl"><b>स्पष्टीकरण:</b> '+q.explanation_marathi.replace(/\n/g,'<br>')+'</div><div class="evi">पुरावा: '+(q.evidence||'')+'</div></div>';
  quizEl.appendChild(card);
  const btn=card.querySelector('.show-ans');const box=card.querySelector('.ansbox');
  btn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा';};
  card.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected');};});
 });
}
document.querySelectorAll('.set-tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.set-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentSet=t.dataset.set;renderQuiz();};});
renderFilters();renderQuiz();
