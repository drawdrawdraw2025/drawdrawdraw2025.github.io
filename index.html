 प्रक्षेपक | PSLV-C60 |\n| 2 | उपग्रह | SDX01 (Chaser) व SDX02 (Target) |\n| 3 | यशस्वी डॉकिंग | 12 जानेवारी 2025 |\n| 4 | भारताचा क्रम | अवकाश डॉकिंग साधणारा 4 था देश |\nवरीलपैकी कोणते क्रमांक अचूक आहेत?", "q_english": "Consider the following table on ISRO's SPADEX (Space Docking Experiment) mission: | No. | Component | Detail | | 1 | Launcher | PSLV-C60 | | 2 | Satellites | SDX01 (Chaser) and SDX02 (Target) | | 3 | Successful docking | 12 January 2025 | | 4 | India's rank | 4th country to achieve space docking | Which numbers are correct?", "options": ["केवळ 1, 2 व 4 अचूक; 3 चूक (प्रत्यक्ष डॉकिंग 16 जानेवारी 2025 रोजी)", "केवळ 1, 2 व 3 अचूक; 4 चूक (भारत 5 वा देश ठरला)", "सर्व 1, 2, 3, 4 अचूक", "केवळ 2, 3 व 4 अचूक; 1 चूक (प्रत्यक्ष प्रक्षेपक GSLV-F15 होता)"], "correct_index": 0, "explanation_marathi": "पर्याय 1 बरोबर कारण PSLV-C60, SDX01/SDX02 आणि भारत 4 था देश (अमेरिका, रशिया, चीन नंतर) हे बरोबर आहे, परंतु डॉकिंग 16 जानेवारी 2025 रोजी झाले, 12 जानेवारीला नाही. पर्याय 2 भारताचा क्रम चुकवतो, पर्याय 3 चुकीची तारीख स्वीकारतो, पर्याय 4 प्रक्षेपक चुकवतो (GSLV नव्हे).", "evidence": "ISRO press releases: PSLV-C60 launch 30-Dec-2024 from Sriharikota carrying SDX01/SDX02; successful docking announced 16-Jan-2025; India became 4th country after USA, Russia, China to achieve space docking; undocking 13-Mar-2025"}, {"section": 3, "subtopic": "NEP 2020 पाच वर्षे आढावा", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 29 जुलै 2025 रोजी राष्ट्रीय शैक्षणिक धोरण (NEP) 2020 ने पाच वर्षे पूर्ण केली; या धोरणातील 5+3+3+4 रचनेतील पायाभूत टप्प्यातील 5 वर्षांत 3 वर्षांचा पूर्वप्राथमिक शिक्षण + इयत्ता 1 ली व 2 री यांचा समावेश होतो.\nकारण (R): NEP 2020 ने ECCE ला औपचारिक शिक्षणाचा भाग मानले असून NIPUN भारत व NCF-SE 2023 / NCF-School 2023 द्वारे पायाभूत साक्षरता व संख्याज्ञानावर भर दिला आहे.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): On 29 July 2025 the National Education Policy (NEP) 2020 completed five years; in its 5+3+3+4 structure the foundational 5 years comprise 3 years of pre-primary education plus Grades 1 and 2. Reason (R): NEP 2020 treated ECCE as part of formal education and emphasised foundational literacy and numeracy through NIPUN Bharat and NCF-SE 2023 / NCF-School 2023. Choose the correct option:", "options": ["(A) आणि (R) दोन्ही सत्य आहेत आणि (R) हे (A) चे योग्य स्पष्टीकरण आहे", "(A) आणि (R) दोन्ही सत्य आहेत, परंतु (R) हे (A) चे योग्य स्पष्टीकरण नाही", "(A) सत्य आहे, (R) असत्य आहे", "(A) असत्य आहे, (R) सत्य आहे"], "correct_index": 0, "explanation_marathi": "पर्याय 1 बरोबर कारण NEP 29 जुलै 2020 रोजी जाहीर झाले (2025 मध्ये 5 वर्षे) आणि पायाभूत टप्प्याची 3+2 विभागणी सत्य आहे; (R) मधील ECCE, NIPUN भारत, NCF यांचा भर हेच या रचनेचे शैक्षणिक तर्क स्पष्ट करते. पर्याय 2 स्पष्टीकरण नाकारल्याने चूक, पर्याय 3 व 4 एक विधान चुकवतात.", "evidence": "Ministry of Education: NEP 2020 announced 29-July-2020 (5 years on 29-July-2025); NEP para 4.1 - 5+3+3+4 design, Foundational Stage (3 years pre-primary + Grades 1-2); NIPUN Bharat launched July 2021, NCF-SE 2023 and NCF-School 2023 for foundational literacy and numeracy"}, {"section": 3, "subtopic": "PM विश्वकर्मा 2025 प्रगती", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): PM विश्वकर्मा योजनेंतर्गत पात्र विश्वकर्मांना 5% सवलतीच्या व्याजदराने दोन टप्प्यांत (1 लाख + 2 लाख) एकूण 3 लाख रुपयांपर्यंत तारणमुक्त उद्यम कर्ज दिले जाते.\nकारण (R): PM विश्वकर्मा ही केंद्र पुरस्कृत (Centrally Sponsored) योजना असून तिचा खर्च केंद्र आणि राज्ये 60:40 प्रमाणात विभागतात.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): Under PM Vishwakarma scheme, eligible Vishwakarmas get collateral-free enterprise loans up to Rs 3 lakh in two tranches (Rs 1 lakh + Rs 2 lakh) at concessional interest rate of 5%.\nReason (R): PM Vishwakarma is a Centrally Sponsored Scheme with expenditure shared between Centre and States in 60:40 ratio.\nChoose the correct option:", "options": ["A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे अचूक स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 2, "explanation_marathi": "A सत्य आहे - 5% दराने 1+2 लाख असे 3 लाखांपर्यंत तारणमुक्त कर्ज, तसेच 15,000 टूलकिट प्रोत्साहन व कौशल्य भत्ता ही तरतूद खरी आहे. R असत्य आहे - ही Central Sector योजना आहे (100% केंद्र निधी, 13,000 कोटी तरतूद 2023-28), Centrally Sponsored (60:40) नाही. त्यामुळे दोन्ही सत्य सांगणारे पर्याय 1, 2 आणि A असत्य सांगणारा पर्याय 4 चूक.", "evidence": "PM Vishwakarma Guidelines, Ministry of MSME; PIB 17 Sep 2023 - Central Sector Scheme with Rs 13,000 cr outlay; progress review 2025 - collateral-free loan 5% interest in tranches"}, {"section": 3, "subtopic": "UNDP HDI 2025 भारत 130वा", "qtype": "जोड्या लावा", "q_marathi": "UNDP मानव विकास अहवाल 2025 बाबत जोड्या लावा:\nस्तंभ-अ: अ. भारताचे HDI मूल्य (2023 डेटावर आधारित), ब. भारताचा HDI क्रमांक, क. अहवालातील एकूण देश संख्या, ड. भारताचा विकास गट\nस्तंभ-ब: 1. 0.685, 2. 130 वा, 3. 193, 4. मध्यम मानव विकास (Medium), 5. 0.644, 6. 133 वा, 8. उच्च मानव विकास (High)\nयोग्य जोडी निवडा:", "q_english": "Match the following regarding UNDP Human Development Report 2025:\nColumn-A: a. India's HDI value (based on 2023 data), b. India's HDI rank, c. Total countries in report, d. India's development group\nColumn-B: 1. 0.685, 2. 130th, 3. 193, 4. Medium Human Development, 5. 0.644, 6. 133rd, 8. High Human Development\nChoose the correct match:", "options": ["अ-1, ब-2, क-3, ड-4", "अ-1, ब-6, क-3, ड-4", "अ-5, ब-2, क-3, ड-4", "अ-1, ब-2, क-3, ड-8"], "correct_index": 0, "explanation_marathi": "2025 अहवाल (2023 डेटा) नुसार भारताचे HDI मूल्य 0.685, क्रमांक 130/193 व मध्यम गट हे बरोबर आहे. पर्याय 2 चूक कारण 133 वा क्रमांक 2022 डेटाचा आहे; पर्याय 3 चूक कारण 0.644 हे 2022 चे मूल्य आहे; पर्याय 4 चूक कारण 0.700 पेक्षा जास्त मूल्य उच्च गटासाठी लागते, भारत (0.685) मध्यम गटातच आहे.", "evidence": "UNDP Human Development Report 2025 released 6 May 2025 (2023 data): India HDI 0.685, rank 130/193, Medium category; previous 2022 data: HDI 0.644, rank 133"}, {"section": 3, "subtopic": "WTO 2025 भारत भूमिका", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A) [कारण]: सप्टेंबर 2025 मध्ये भारताने WTO मत्स्यपालन अनुदान कराराचे स्वीकृतीपत्र जमा केले (123 वा सदस्य), ज्यामुळे हा करार 15 सप्टेंबर 2025 पासून अंमलात आला. विधान (R) [परिणाम]: भारत आता WTO मत्स्यपालन अनुदान समिती व विवाद निवारण यंत्रणेद्वारे परदेशी जहाजांना/ऑपरेटरना दिलेल्या बेकायदेशीर (IUU) किंवा अतिमत्स्यसाठ्यातील अनुदानांना आव्हान देऊ शकतो, तसेच कारागीर मच्छीमारांसाठी विशेष व भिन्न वागणूक (S&DT) कायम ठेवू शकतो.", "q_english": "Statement (A) [Cause]: In September 2025 India deposited its Instrument of Acceptance of the WTO Agreement on Fisheries Subsidies (123rd member), bringing it into force on 15 September 2025. Statement (R) [Effect]: India can now challenge subsidies given to foreign vessels/operators (IUU or overfished stocks) via the WTO Committee on Fisheries Subsidies and dispute settlement, while retaining special & differential treatment (S&DT) for artisanal fishers.", "options": ["(A) व (R) दोन्ही सत्य आहेत आणि (R) हे (A) चे योग्य परिणाम/स्पष्टीकरण आहे", "(A) व (R) दोन्ही सत्य आहेत, परंतु (R) हे (A) चे योग्य स्पष्टीकरण नाही", "(A) सत्य आहे, परंतु (R) असत्य आहे", "(A) असत्य आहे, परंतु (R) सत्य आहे"], "correct_index": 0, "explanation_marathi": "PIB नुसार करार दोन-तृतीयांश सदस्यांच्या स्वीकृतीनंतर 15 सप्टेंबर 2025 रोजी अंमलात आला आणि भारत 123 वा स्वीकृतीकर्ता सदस्य ठरला – त्यामुळे (A) सत्य. करारामुळे IUU मासेमारीवरील अनुदानांवर कारवाईची व विवाद निवारणात आव्हान देण्याची क्षमता भारताला मिळते, आणि भारताने 'प्रदूषक भरपाई' तत्त्व व S&DT ची मागणी कायम ठेवली – त्यामुळे (R) सत्य व तेच (A) चे परिणाम आहे. पर्याय 2 चुकीचा कारण संबंध थेट आहे; पर्याय 3–4 चुकीचे कारण दोन्ही विधाने तथ्यात्मकदृष्ट्या बरोबर आहेत.", "evidence": "PIB – 'The Agreement entered into force on 15 September 2025 after acceptance by two-thirds of WTO Members... India is the 123rd Member to deposit its Instrument of Acceptance'; Sansad/Commerce Ministry – 'India will be in a position to take action against subsidies provided to foreign vessels... at the WTO Committee on Fisheries Subsidies and the dispute settlement system'; PIB – India invoked 'polluter pay principle' and 'common but differentiated responsibilities'."}, {"section": 3, "subtopic": "आयुष्मान भारत 70+ विस्तार", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "आयुष्मान भारत PM-JAY च्या 70+ विस्तारासंदर्भात खालील दोन संकल्पना विचारात घ्या : संकल्पना (अ) – पात्रता निकष ; संकल्पना (ब) – आधीपासून PM-JAY लाभार्थी असलेल्या कुटुंबातील 70+ सदस्याला मिळणारे कवच. योग्य पर्याय निवडा :", "q_english": "Consider two concepts regarding Ayushman Bharat PM-JAY 70+ expansion: Concept (A) – eligibility criteria; Concept (B) – cover available to a 70+ member in a family already covered under PM-JAY. Choose the correct option:", "options": ["(अ) 70+ वयाची सर्व ज्येष्ठ नागरिक उत्पन्न, जात, SECC निकषाशिवाय पात्र — (ब) कुटुंबाच्या ₹5 लाख कवचाव्यतिरिक्त 70+ सदस्यास स्वतःसाठी स्वतंत्र अतिरिक्त ₹5 लाख टॉप-अप मिळते", "(अ) 70+ वयाची सर्व ज्येष्ठ नागरिक उत्पन्न, जात, SECC निकषाशिवाय पात्र — (ब) 70+ सदस्याला कुटुंबाच्या विद्यमान ₹5 लाख कवचातूनच उपचार घ्यावा लागतो, कोणताही अतिरिक्त टॉप-अप नाही", "(अ) केवळ SECC-2011 मध्ये पात्र ठरलेले 70+ ज्येष्ठ नागरिक पात्र — (ब) कुटुंबाच्या ₹5 लाख कवचाव्यतिरिक्त 70+ सदस्यास स्वतःसाठी स्वतंत्र अतिरिक्त ₹5 लाख टॉप-अप मिळते", "(अ) केवळ वार्षिक उत्पन्न ₹2.5 लाखांपेक्षा कमी असलेले 70+ ज्येष्ठ पात्र — (ब) 70+ सदस्यासह संपूर्ण कुटुंबाला एकत्रित ₹10 लाख वार्षिक कवच मिळते, स्वतंत्र टॉप-अप नाही"], "correct_index": 0, "explanation_marathi": "पर्याय 1 बरोबर आहे कारण सप्टेंबर 2024 च्या मंत्रिमंडळ निर्णयाने 70+ साठी PM-JAY सार्वत्रिक केले (उत्पन्न/SECC अट नाही) व आधीच लाभार्थी कुटुंबातील 70+ सदस्याला कुटुंब कवचाव्यतिरिक्त स्वतःसाठी ₹5 लाख टॉप-अप (आयुष्मान वय वंदना कार्ड) मिळते. पर्याय 2 चूक कारण टॉप-अप नाकारतो, पर्याय 3 चूक कारण SECC अट 70+ ला लागू नाही, पर्याय 4 चूक कारण उत्पन्न मर्यादा व एकत्रित ₹10 लाख कवच ही कल्पना चुकीची आहे.", "evidence": "PIB Press Release 11-Sep-2024: Cabinet approves expansion of AB PM-JAY to all senior citizens aged 70+ irrespective of income; PM launch 29-Oct-2024 Ayushman Vaya Vandana Card; clarifies additional top-up of Rs 5 lakh per year for 70+ members in families already covered under PM-JAY"}, {"section": 3, "subtopic": "ऑपरेशन सिंदूर 2025", "qtype": "कालक्रम लावा", "q_marathi": "खालील घटनांचा योग्य कालक्रम लावा: (A) पहलगाम (बैसरण) दहशतवादी हल्ला, (B) मंत्रिमंडळ सुरक्षा समितीचा (CCS) निर्णय – सिंधू जल करार स्थगिती, (C) ऑपरेशन सिंदूर – 9 दहशतवादी तळांवर त्रिदलीय हल्ला, (D) सैन्य कारवायांच्या महासंचालकांमधील (DGMO) चर्चेनंतर शस्त्रसंधीची घोषणा.", "q_english": "Arrange the following events in correct chronological order: (A) Pahalgam (Baisaran) terror attack, (B) CCS decision – suspension of Indus Waters Treaty, (C) Operation Sindoor – tri-services strike on 9 terror camps, (D) Ceasefire announcement after DGMO-level talks.", "options": ["A – C – B – D", "A – B – C – D", "B – A – C – D", "A – B – D – C"], "correct_index": 1, "explanation_marathi": "22 एप्रिल 2025 रोजी पहलगाम हल्ल्यात 26 नागरिक ठार झाले; त्यानंतर 23 एप्रिल रोजी CCS ने सिंधू जल करार स्थगित केला; 7 मे रोजी पहाटे 1:05–1:30 दरम्यान ऑपरेशन सिंदूर राबवले गेले; पाकिस्तानी प्रत्युत्तरानंतर 10 मे रोजी DGMO चर्चेतून शस्त्रसंधी जाहीर झाली. पर्याय 1 चुकीचा कारण करार स्थगिती हल्ल्यापूर्वी नव्हती; पर्याय 3 चुकीचा कारण B हा A नंतरचा निर्णय आहे; पर्याय 4 चुकीचा कारण शस्त्रसंधी ऑपरेशननंतर, आधी नव्हे.", "evidence": "The Hindu – 'Operation Sindoor, conducted from May 7 to 10, 2025, was launched in retaliation to the April 22 Pahalgam terror attack... killed 26 people'; NDTV/PIB – strikes between 1:05 AM and 1:30 AM on May 7 on nine terror camps; FreePressJournal/Times of India – April 22 attack → May 7 Operation Sindoor → May 10 ceasefire timeline."}, {"section": 3, "subtopic": "ग्लोबल इनोव्हेशन इंडेक्स 2025", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा — यादी-अ (घटक) आणि यादी-ब (तपशील):\nअ. प्रकाशित करणारी संस्था\nब. GII 2025 मध्ये भारताचा क्रमांक\nक. समाविष्ट अर्थव्यवस्थांची संख्या\nड. प्रथम क्रमांकाचा देश\nयोग्य जोडी-समूह निवडा:", "q_english": "Match the following — List-A (component) with List-B (detail): A. Publishing organisation B. India's rank in GII 2025 C. Number of economies covered D. Top-ranked country. Choose the correct set:", "options": ["अ-WIPO, ब-38 वा, क-133, ड-स्वित्झर्लंड", "अ-WIPO, ब-39 वा, क-133, ड-स्वित्झर्लंड", "अ-जागतिक बँक, ब-38 वा, क-133, ड-स्वीडन", "अ-WIPO, ब-38 वा, क-132, ड-स्वीडन"], "correct_index": 0, "explanation_marathi": "पर्याय 1 बरोबर कारण GII WIPO प्रकाशित करते, 2025 मध्ये भारत 38 वा (2024 मधील 39 वरून सुधारणा), 133 अर्थव्यवस्था समाविष्ट, स्वित्झर्लंड प्रथम आहे. पर्याय 2 मधील 39 वा क्रम 2024 चा आहे, पर्याय 3 प्रकाशक (जागतिक बँक नव्हे) व प्रथम देश चुकवतो, पर्याय 4 अर्थव्यवस्था संख्या व प्रथम देश चुकवतो.", "evidence": "WIPO Global Innovation Index 2025 report (released September 2025): published by WIPO, covers 133 economies, Switzerland ranked 1st, India ranked 38th (up from 39th in GII 2024)"}, {"section": 3, "subtopic": "जागतिक लोकसंख्या अहवाल 2025", "qtype": "नकाशा आधारित", "q_marathi": "UN लोकसंख्या निधीच्या (UNFPA) 'जागतिक लोकसंख्या स्थिती 2025' अहवालावर आधारित जागतिक लोकसंख्या नकाशाचे निरीक्षण करा: सर्वात गडद छटेने दर्शवलेला देश X (अंदाजे 146.39 कोटी लोकसंख्या), त्यापाठोपाठ दुसऱ्या क्रमांकाचा देश Y, आणि तिसऱ्या क्रमांकाचा देश Z ओळखा. (आधार: UN World Population Prospects 2024 अंदाज)", "q_english": "Observe the world population map based on UNFPA's 'State of World Population 2025' report: identify the darkest-shaded country X (approx. 1.4639 billion population), followed by second-ranked country Y and third-ranked country Z. (Basis: UN World Population Prospects 2024 estimates)", "options": ["X – भारत, Y – चीन, Z – अमेरिका", "X – चीन, Y – भारत, Z – इंडोनेशिया", "X – भारत, Y – अमेरिका, Z – चीन", "X – भारत, Y – चीन, Z – इंडोनेशिया"], "correct_index": 0, "explanation_marathi": "UN WPP 2024 नुसार भारत (~145.09 कोटी, 2024) चीनला मागे टाकून जगातील सर्वाधिक लोकसंख्येचा देश बनला असून 2025 मध्ये ~146.39 कोटींसह तो शतकअखेरपर्यंत प्रथम क्रमांकावर राहील; चीन दुसऱ्या तर अमेरिका (~34 कोटी) तिसऱ्या क्रमांकावर आहे. पर्याय 2 चुकीचा कारण चीन आता दुसऱ्या क्रमांकावर आहे; पर्याय 3 चुकीचा कारण अमेरिकेपेक्षा चीनची लोकसंख्या जास्त आहे; पर्याय 4 चुकीचा कारण इंडोनेशिया चौथ्या क्रमांकावर आहे, तिसऱ्या नव्हे.", "evidence": "UN DESA World Population Prospects 2024 – India projected at 1.450936 billion (2024), overtaking China as world's most populous; Statbase/UN WPP 2024 – India 1,463,865,525 in 2025; UNFPA State of World Population 2025 – India's population 146.39 crore; Wikipedia/UN WPP 2024 – world share: India 17.8%, China 17.4%, United States 4.23%."}, {"section": 3, "subtopic": "डिजिटल जनगणना 2027 तयारी", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): केंद्रीय मंत्रिमंडळाच्या राजकीय व्यवहार समितीने (CCPA) 30 एप्रिल 2025 रोजी आगामी जनगणनेत जातगणना (caste enumeration) समाविष्ट करण्यास मान्यता दिली.\nपरिणाम (E): जनगणना 2027 ही भारताची पहिली डिजिटल जनगणना म्हणून दोन टप्प्यांत घेतली जाणार असून, बहुतांश भागांसाठी संदर्भ दिनांक 1 मार्च 2027 (हिमाच्छादित क्षेत्रांसाठी 1 ऑक्टोबर 2026) निश्चित करण्यात आला आहे.\nकारण-परिणाम संबंधाबाबत योग्य पर्याय निवडा:", "q_english": "Cause (C): The Cabinet Committee on Political Affairs (CCPA) on 30 April 2025 approved inclusion of caste enumeration in the forthcoming Census.\nEffect (E): Census 2027 will be India's first digital Census conducted in two phases, with reference date 1 March 2027 for most areas (1 Oct 2026 for snow-bound areas).\nChoose correct option regarding cause-effect relationship:", "options": ["C आणि E दोन्ही बरोबर, E हा C चा थेट परिणाम आहे", "C आणि E दोन्ही बरोबर, E हा C चा थेट परिणाम नाही", "C बरोबर, E चूक", "C चूक, E बरोबर"], "correct_index": 1, "explanation_marathi": "C सत्य आहे - 30 एप्रिल 2025 रोजी CCPA ने जातगणनेस मान्यता दिली. E सत्य आहे - डिजिटल जनगणना दोन टप्प्यांत (घरयादी व लोकसंख्या गणना) व संदर्भ दिनांक 1 मार्च 2027 / 1 ऑक्टोबर 2026 खरे आहेत. परंतु E हा C चा परिणाम नाही - दोन टप्पे व संदर्भ दिनांक ही जनगणना कायद्यातील स्थायी प्रक्रिया आहे, जातगणनेच्या निर्णयामुळे निर्माण झालेली नाही. म्हणून थेट परिणाम सांगणारा पर्याय 1 चूक, तर एक विधान चूक सांगणारे 3, 4 चूक.", "evidence": "PIB 30 Apr 2025 - CCPA approves caste enumeration; MHA notification June 2025 - Census 2027 two phases, reference dates 1 Mar 2027 and 1 Oct 2026; RGI statement on first digital census with self-enumeration portal/app"}, {"section": 3, "subtopic": "पॅरिस ऑलिंपिक 2024 भारत पदके", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "खालील दोन संकल्पना एकत्र विचारात घ्या – (संकल्पना 1: एकाच ऑलिंपिक आवृत्तीतील दुहेरी पदकविजेती) आणि (संकल्पना 2: पॅरिस 2024 मधील भारताची एकूण पदकसंख्या व क्रमवारी). खालीलपैकी कोणता पर्याय दोन्ही संकल्पनांबाबत पूर्णतः अचूक माहिती देतो?", "q_english": "Consider two concepts together – (Concept 1: double medallist in a single Olympic edition) and (Concept 2: India's total medal tally and rank at Paris 2024). Which option gives fully accurate information on both concepts?", "options": ["मनू भाकर – दोन कांस्यपदके (वैयक्तिक 10 मी. एअर पिस्तूल + सरबज्योत सिंगसह मिश्र सांघिक) व स्वातंत्र्यानंतर एकाच आवृत्तीत दोन पदके जिंकणारी पहिली भारतीय; नीरज चोप्रा – भालाफेक सुवर्णपदक", "मनू भाकर – दोन कांस्यपदके (वैयक्तिक 10 मी. एअर पिस्तूल + सरबज्योत सिंगसह मिश्र सांघिक) व स्वातंत्र्यानंतर एकाच आवृत्तीत दोन पदके जिंकणारी पहिली भारतीय; अमन सेहरावत – 57 किलो फ्रीस्टाइल कुस्ती कांस्य, पॅरिसमधील भारताचे एकमेव कुस्ती पदक", "स्वप्नील कुसाळे – 10 मी. एअर पिस्तूल कांस्य; भारतीय पुरुष हॉकी संघ – सलग दुसरे सुवर्णपदक (टोकियो व पॅरिस)", "नीरज चोप्रा – भालाफेक कांस्य; सरबज्योत सिंग – 50 मी. रायफल थ्री पोझिशन कांस्य; भारत – 71 वा क्रमांक"], "correct_index": 1, "explanation_marathi": "पॅरिस 2024 मध्ये भारताने 1 रौप्य + 5 कांस्य = 6 पदके जिंकून 71 वा क्रमांक पटकावला; मनू भाकरने दोन कांस्य जिंकून स्वातंत्र्यानंतर एकाच आवृत्तीत दोन पदके जिंकणारी पहिली भारतीय होण्याचा विक्रम केला आणि अमन सेहरावतचे 57 किलो कुस्ती कांस्य हे भारताचे एकमेव कुस्ती पदक ठरले – त्यामुळे पर्याय 2 पूर्णतः बरोबर. पर्याय 1 चुकीचा कारण नीरजला रौप्य (सुवर्ण नव्हे) मिळाले; पर्याय 3 चुकीचा कारण कुसाळेचे पदक 50 मी. रायफल थ्री पोझिशनमधील असून हॉकी संघाला कांस्य (सुवर्ण नव्हे) मिळाले; पर्याय 4 चुकीचा कारण नीरजला रौप्य व सरबज्योतला 10 मी. एअर पिस्तूल मिश्र सांघिक कांस्य मिळाले.", "evidence": "Akashvani/News18 – 'India's campaign at Paris Olympics concluded with a total of six medals – one silver and five bronze... finished 71st'; ESPN/PTI – 'Neeraj Chopra won silver in javelin'; News18 – 'Manu Bhaker... bronze in women's 10m air pistol and mixed team with Sarabjot Singh'; Sportstar – 'Manu Bhaker became the first Indian after independence to win multiple medals in the same edition'; Akashvani – 'Aman Sehrawat's bronze in men's 57 kg... India's only wrestling medal'."}, {"section": 3, "subtopic": "भारत-UK FTA 2025", "qtype": "कालक्रम लावा", "q_marathi": "भारत-UK व्यापारी कराराशी संबंधित घटनांचा योग्य कालक्रम लावा:\nA. भारत-UK रोडमॅप 2030 ची घोषणा\nB. मुक्त व्यापार कराराच्या (FTA) वाटाघाटींचा औपचारिक प्रारंभ\nC. वाटाघाटी पूर्ण झाल्याची संयुक्त घोषणा (6 मे 2025)\nD. लंडन येथे कॉम्प्रिहेन्सिव्ह इकॉनॉमिक अँड ट्रेड अग्रीमेंट (CETA) वर स्वाक्षरी (24 जुलै 2025)\nयोग्य क्रम निवडा:", "q_english": "Arrange the following events related to India-UK trade deal in chronological order:\nA. Announcement of India-UK Roadmap 2030\nB. Formal launch of FTA negotiations\nC. Joint announcement of conclusion of negotiations (6 May 2025)\nD. Signing of Comprehensive Economic and Trade Agreement (CETA) in London (24 July 2025)\nChoose the correct sequence:", "options": ["A-B-C-D", "A-B-D-C", "B-A-C-D", "A-C-B-D"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A (मे 2021 रोडमॅप 2030) → B (13 जानेवारी 2022 वाटाघाटी प्रारंभ) → C (6 मे 2025 पूर्णत्वाची घोषणा) → D (24 जुलै 2025 मोदी-स्टार्मर उपस्थितीत CETA स्वाक्षरी) हा आहे. A-B-D-C चूक कारण घोषणा स्वाक्षरीपूर्वी झाली; B-A-C-D चूक कारण रोडमॅप वाटाघाटीपूर्वीचा आहे; A-C-B-D चूक कारण वाटाघाटी सुरू होण्यापूर्वी पूर्णत्व अशक्य.", "evidence": "PIB 6 May 2025 - conclusion of India-UK FTA negotiations; PIB 24 July 2025 - signing of CETA during PM Modi's UK visit; India-UK Roadmap 2030 (May 2021), FTA negotiations launched 13 Jan 2022"}, {"section": 3, "subtopic": "महाराष्ट्र EV धोरण 2025", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "महाराष्ट्र इलेक्ट्रिक वाहन (EV) धोरण 2025 बाबत खालील विधाने विचारात घ्या:\n(I) हे धोरण 2025-2030 या कालावधीसाठी वैध असून 2030 पर्यंत नवीन वाहन नोंदणीपैकी 30% EV चे उद्दिष्ट आहे.\n(II) मुंबई-पुणे द्रुतगती मार्ग, अटल सेतू आणि हिंदुहृदयसम्राट बाळासाहेब ठाकरे समृद्धी महामार्गावर EV ना पूर्ण टोलमाफी देण्यात आली आहे.\n(III) या धोरणासाठी ₹5,000 कोटींची तरतूद असून 2030 पर्यंत 10 लाख सार्वजनिक EV चार्जिंग स्टेशन्स उभारण्याचे उद्दिष्ट आहे.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following statements on Maharashtra Electric Vehicle (EV) Policy 2025: (I) The policy is valid for 2025-2030 with a target of 30% EV share in new vehicle registrations by 2030. (II) Full toll waiver is given to EVs on Mumbai-Pune Expressway, Atal Setu and Hinduhridaysamrat Balasaheb Thackeray Samruddhi Mahamarg. (III) The policy has an outlay of Rs 5,000 crore with a target of 10 lakh public EV charging stations by 2030. Choose the correct option:", "options": ["केवळ (I) व (II) बरोबर, (III) चूक", "केवळ (I) व (III) बरोबर, (II) चूक", "केवळ (II) व (III) बरोबर, (I) चूक", "(I), (II), (III) सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "पर्याय 1 बरोबर कारण (I) मधील 2025-2030 वैधता व 30% उद्दिष्ट आणि (II) मधील तीनही मार्गांवरील टोलमाफी सत्य आहे. (III) चूक आहे कारण प्रत्यक्ष तरतूद सुमारे ₹1,993 कोटी आहे (₹5,000 कोटी नव्हे) आणि 10 लाख चार्जिंग स्टेशन्सचे उद्दिष्ट नाही. त्यामुळे (III) समाविष्ट असलेले पर्याय 2, 3, 4 बाद होतात.", "evidence": "Maharashtra Cabinet decision April 2025 - Maharashtra EV Policy 2025 (valid 2025-2030); Govt Resolution: outlay Rs 1,993 crore, 30% EV registration target by 2030, toll exemption for EVs on Mumbai-Pune Expressway, Atal Setu, Samruddhi Mahamarg"}, {"section": 3, "subtopic": "महाराष्ट्र जलयुक्त शिवार 2.0", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या: (I) मार्च 2023 च्या अर्थसंकल्पीय भाषणात तत्कालीन अर्थमंत्री देवेंद्र फडणवीस यांनी 5,000 गावांमध्ये 'जलयुक्त शिवार 2.0' राबवण्याची घोषणा केली. (II) जलयुक्त शिवार 2.0 ही केंद्र सरकारची योजना असून तिचे 100% निधीकरण केंद्राकडून होते. (III) या योजनेंतर्गत कामांचे MRSAC मार्फत जिओ-टॅगिंग/नकाशांकन केले जाते आणि निवडक भागांत 'द आर्ट ऑफ लिव्हिंग' सोबत भागीदारीतून (86 तालुके, 24 जिल्हे) पाणलोट विकास कामे राबवली जातात. वरीलपैकी कोणती विधाने बरोबर आहेत?", "q_english": "Consider the statements: (I) In the March 2023 budget speech, then Finance Minister Devendra Fadnavis announced 'Jalyukt Shivar 2.0' in 5,000 villages. (II) Jalyukt Shivar 2.0 is a Central Government scheme with 100% central funding. (III) Works under the scheme are geo-tagged/mapped via MRSAC, and watershed works are implemented in partnership with the Art of Living (86 tehsils, 24 districts) in select areas. Which statements are correct?", "options": ["फक्त (I)", "फक्त (I) व (II)", "फक्त (I) व (III)", "(I), (II) व (III) सर्व"], "correct_index": 2, "explanation_marathi": "(I) सत्य – मार्च 2023 च्या अर्थसंकल्पीय भाषणात फडणवीस यांनी 5,000 गावांत दुसरा टप्पा जाहीर केला (पुढे ₹650 कोटी तरतूद). (III) सत्य – MRSAC ही जलसंधारण विभागासाठी जिओ-टॅगिंग/डेटा प्रमाणन करते आणि नोव्हेंबर 2023 पासून आर्ट ऑफ लिव्हिंग सोबत 86 तालुके/24 जिल्ह्यांत कामे झाली. (II) असत्य – ही महाराष्ट्र शासनाची (राज्य) योजना आहे, केंद्राची 100% निधीकरणाची नाही; त्यामुळे (II) असलेले पर्याय 2 व 4 बाद होतात.", "evidence": "Business Standard, 12 Mar 2023 – 'Govt to launch Jalyukta Shivar 2.0 in 5,000 villages: Dy CM Fadnavis'; The Hindu – 'promised to launch Jalyukt Shivar 2.0 in March 2023... ₹650 crore was allotted'; MRSAC Maharashtra – geo-tagging/data validation for Water Conservation Department; IndianNewsNetwork – 'Launched on 26th November 2023... collaboration between Government of Maharashtra and The Art of Living... 86 tehsils in 24 districts'."}, {"section": 4, "subtopic": "1857 नाना साहेब vs तात्या टोपे", "qtype": "कालक्रम लावा", "q_marathi": "1857 च्या उठावातील नाना साहेब व तात्या टोपे यांच्याशी संबंधित घटनांचा योग्य कालक्रम लावा :\nA. नाना साहेबांकडून कानपूर येथे बंडाची सूत्रे स्वीकारणे व स्वतःस पेशवा घोषित करणे (जून 1857)\nB. बीबीघर हत्याकांड (15 जुलै 1857)\nC. तात्या टोपे यांच्याकडून कानपूरची दुसरी लढाई - जनरल विंडहमचा पराभव (27-28 नोव्हेंबर 1857)\nD. तात्या टोपे यांना शिवपुरी येथे फाशी (18 एप्रिल 1859)", "q_english": "Arrange in correct chronological order events related to Nana Saheb vs Tatya Tope in the 1857 revolt: A. Nana Saheb assumes leadership at Kanpur and declares himself Peshwa (June 1857), B. Bibighar massacre (15 July 1857), C. Tatya Tope's Second Battle of Kanpur - defeat of Gen. Windham (27-28 Nov 1857), D. Execution of Tatya Tope at Shivpuri (18 April 1859)", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "योग्य क्रम A-B-C-D आहे: जून 1857 मध्ये नाना साहेबांनी नेतृत्व घेतले, त्यानंतर 15 जुलैला बीबीघर घडले, नोव्हेंबर 1857 मध्ये तात्या टोपेंनी विंडहमला हरवले व शेवटी 1859 मध्ये फाशी झाली. पर्याय 2 मध्ये बीबीघर नंतरची दुसरी लढाई आधी नेऊन गल्लत केली आहे, पर्याय 3 मध्ये नानांच्या नेतृत्वाआधी बीबीघर नेऊन कारण-परिणाम उलटवला आहे, पर्याय 4 मध्ये फाशी 1857 मध्येच दाखवली आहे.", "evidence": "S.N. Sen - Eighteen Fifty-Seven; R.C. Majumdar - Sepoy Mutiny and Revolt of 1857; Maharashtra State Board इयत्ता 8 वी - 1857 चा उठाव"}, {"section": 4, "subtopic": "अशोक शिलालेख महाराष्ट्र", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): सोपारा येथील अशोक शिलालेख महाराष्ट्रात मौर्य सत्तेचा पुरावा आहे. कारण (R): सोपारा हे अपरान्तातील प्राचीन बंदर व बौद्ध केंद्र होते. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Sopara Ashokan edict proves Maurya authority in Maharashtra. Reason (R): Sopara was ancient port and Buddhist centre in Aparanta. Choose correct option.", "options": ["A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण", "A व R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "बरोबर: सोपारा शिलालेख मौर्य सत्ता सिद्ध करतो; बंदर-बौद्ध केंद्र म्हणून निवड स्पष्ट होते.\nचूक: 1 स्पष्टीकरण नाकारते, 2-3 एक विधान चुकवतात.", "evidence": "ASI: Sopara fragments of Ashoka's rock edicts (Nalasopara); S. Nagaraju on Aparanta-Sopara as ancient port."}, {"section": 4, "subtopic": "आंबेडकर महाड सत्याग्रह 1927", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने विचारात घ्या :\nI. 20 मार्च 1927 रोजी डॉ. बाबासाहेब आंबेडकरांच्या नेतृत्वाखाली महाडच्या चवदार तळ्याचा सत्याग्रह झाला; त्यास 1923 च्या बोले ठरावाची व महाड नगरपालिकेच्या 1924 च्या ठरावाची पार्श्वभूमी होती.\nII. मनुस्मृतीचे दहन 20 मार्च 1927 रोजीच चवदार तळ्याच्या काठी करण्यात आले.\nIII. पहिल्या सत्याग्रहानंतर महाड नगरपालिकेने तळे खुला करण्याचा ठराव रद्द केल्याने 25 डिसेंबर 1927 रोजी दुसरा महाड सत्याग्रह करावा लागला.", "q_english": "Consider statements: I. On 20 March 1927 the Mahad Chavdar Tale Satyagraha was led by Dr. B.R. Ambedkar, with background of the 1923 Bole Resolution and Mahad Municipality's 1924 resolution. II. Manusmriti was burnt on 20 March 1927 itself at Chavdar Tale. III. As Mahad Municipality revoked its resolution opening the tank after the first satyagraha, a second Mahad Satyagraha had to be held on 25 December 1927.", "options": ["I, II आणि III सर्व सत्य", "केवळ I आणि II सत्य", "केवळ I आणि III सत्य", "केवळ II आणि III सत्य"], "correct_index": 2, "explanation_marathi": "I सत्य (बोले ठराव 1923, 20 मार्च 1927 नेतृत्व आंबेडकर) व III सत्य (ठराव रद्द झाल्याने 25 डिसेंबर 1927 रोजी दुसरा सत्याग्रह). II असत्य कारण मनुस्मृती दहन 25 डिसेंबर 1927 रोजी दुसऱ्या सत्याग्रहात झाले, पहिल्यात नाही. त्यामुळे II समाविष्ट करणारे पर्याय 1, 2, 4 बाद होतात.", "evidence": "Dhananjay Keer - Dr. Ambedkar: Life and Mission, Ch. Mahad; Babasaheb Ambedkar Writings & Speeches Vol 5; Maharashtra State Board इयत्ता 9 वी - महाड सत्याग्रह प्रकरण"}, {"section": 4, "subtopic": "गुप्त-वाकाटक संबंध", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "विधाने: I. चंद्रगुप्त II ची कन्या प्रभावती गुप्ता हिचा विवाह रुद्रसेन II शी झाला. II. या विवाहाने वाकाटक गुप्तांचे मांडलिक बनले. III. प्रभावतीने पुत्रांसाठी संरक्षिका म्हणून कारभार पाहिला. योग्य गट ओळखा.", "q_english": "Statements: I. Chandragupta II's daughter Prabhavati Gupta married Rudrasena II. II. This made Vakatakas Gupta feudatories. III. Prabhavati acted as regent for her sons. Identify correct group.", "options": ["केवळ I व III सत्य", "केवळ I व II सत्य", "I, II, III सर्व सत्य", "केवळ II व III सत्य"], "correct_index": 0, "explanation_marathi": "बरोबर: I व III सत्य; पूना ताम्रपटात प्रभावती संरक्षिका म्हणून दिसते.\nचूक: II चूक – विवाह मैत्रीकरार, मांडलिकत्व नव्हे; त्यामुळे 1,2,3 चूक.", "evidence": "Poona plates of Prabhavati Gupta; V.V. Mirashi, Vakataka inscriptions; Gupta-Vakataka alliance studies."}, {"section": 4, "subtopic": "चालुक्य बदामी vs कल्याणी", "qtype": "कालक्रम लावा", "q_marathi": "खालील घटनांचा योग्य कालक्रम लावा:\nA. पुलकेशी I कडून वातापी (बदामी) दुर्गाची स्थापना व राजधानी निर्मिती\nB. पुलकेशी II कडून नर्मदा तीरावर हर्षवर्धनाचा पराभव\nC. विक्रमादित्य I कडून पल्लव राजधानी कांचीपुरमवर विजय\nD. तैलप II कडून राष्ट्रकूटांचा पाडाव करून कल्याणी चालुक्य (पश्चिम चालुक्य) सत्तेची स्थापना\nयोग्य क्रम निवडा:", "q_english": "Arrange the following events in correct chronological order:\nA. Foundation of Vatapi (Badami) fort and capital by Pulakeshi I\nB. Defeat of Harshavardhana on the banks of Narmada by Pulakeshi II\nC. Victory over Pallava capital Kanchipuram by Vikramaditya I\nD. Overthrow of Rashtrakutas and foundation of Kalyani Chalukya (Western Chalukya) power by Tailapa II\nSelect the correct order:", "options": ["A-B-C-D", "A-C-B-D", "B-A-C-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "A (इ.स. 543 च्या सुमारास) सर्वात आधी, नंतर B (इ.स. 618-19), नंतर C (इ.स. 674 च्या सुमारास), आणि D (इ.स. 973) सर्वात शेवटी. त्यामुळे A-C-B-D मध्ये B-C चा क्रम चुकतो, B-A-C-D मध्ये बदामी स्थापना नंतर दाखवली आहे जी चूक आहे, आणि A-B-D-C मध्ये कल्याणी स्थापना कांची विजयाआधी दाखवली आहे जी अशक्य आहे.", "evidence": "Aihole prashasti of Pulakeshi II (634 CE) by Ravikirti; Mahakuta pillar inscription of Pulakeshi I (543 CE); K.A. Nilakanta Sastri - A History of South India; Epigraphia Indica Vol. VI for Tailapa II (973 CE)"}, {"section": 4, "subtopic": "टिळक केसरी-मराठा वृत्तपत्रे", "qtype": "कारण-परिणाम", "q_marathi": "कारण (C): 1881 मध्ये टिळक, आगरकर व चिपळूणकर यांनी आर्यभूषण छापखान्यातून 'केसरी' (मराठी) व 'मराठा/Mahratta' (इंग्रजी) सुरू करून शिवजयंती (1895) व गणेशोत्सव (1893) यांचे सार्वजनिक उत्सवांत रूपांतर करून जहाल राष्ट्रवादाचा प्रसार केला.\nपरिणाम (E): 1897 मध्ये 'केसरी'तील प्लेग-धोरणांवरील टीकात्मक लेखांवरून टिळकांवर IPC 124-A अंतर्गत राजद्रोहाचा खटला चालवून 18 महिन्यांची सक्तमजुरीची शिक्षा ठोठावण्यात आली.\nयोग्य कारण-परिणाम संबंध ओळखा.", "q_english": "Cause (C): In 1881 Tilak, Agarkar and Chiplunkar started 'Kesari' (Marathi) and 'Mahratta' (English) from Aryabhushan Press and converted Shiv Jayanti (1895) and Ganesh Utsav (1893) into public festivals spreading militant nationalism. Effect (E): In 1897 Tilak was tried for sedition under IPC 124-A for Kesari articles criticising plague measures and sentenced to 18 months rigorous imprisonment. Identify the correct cause-effect relation.", "options": ["C व E दोन्ही सत्य असून, E हा C चा तार्किक/ऐतिहासिक परिणाम आहे.", "C व E दोन्ही सत्य असून, E हा C चा परिणाम नाही (दोन्ही स्वतंत्र घटना).", "C सत्य आहे, E असत्य आहे.", "C असत्य आहे, E सत्य आहे."], "correct_index": 0, "explanation_marathi": "C सत्य आहे (1881 हे वर्ष, त्रिवर्ग संस्थापक, केसरी-मराठी/मराठा-इंग्रजी ही विभागणी अचूक) आणि E सत्य आहे (1897 चा पहिला राजद्रोह खटला व 18 महिने शिक्षा). E हा C चाच परिणाम आहे कारण केसरी हेच टीकेचे व्यासपीठ होते. त्यामुळे संबंध नाकारणारा पर्याय 2, शिक्षा 1908 ची 6 वर्षे समजून E चूक ठरवणारा पर्याय 3, आणि 1880/एकटे टिळक मानून C चूक ठरवणारा पर्याय 4 बाद होतात.", "evidence": "Bipan Chandra - India's Struggle for Independence, Ch. on Tilak; N.C. Kelkar - Life of Lokmanya Tilak; केसरी शताब्दी ग्रंथ - 1881 स्थापना नोंद"}, {"section": 4, "subtopic": "निजामशाही अहमदनगर", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता: A. मलिक अहमद – अहमदनगर स्थापना (1490); B. बुऱ्हान I – दुसऱ्या राजधानीवरून पुनरागमन; C. हुसेन I – तालीकोट (1565) आघाडीत सहभाग. योग्य पर्याय ओळखा.", "q_english": "Table: A. Malik Ahmad – founded Ahmadnagar (1490); B. Burhan I – return from second capital; C. Husain I – joined anti-Vijayanagara alliance at Talikota (1565). Identify correct option.", "options": ["A, B, C तिन्ही जोड्या सत्य", "A व C सत्य, B असत्य", "A व B सत्य, C असत्य", "B व C सत्य, A असत्य"], "correct_index": 0, "explanation_marathi": "बरोबर: तिन्ही जोड्या सत्य – स्थापना 1490, बुऱ्हानचे पुनरागमन, हुसेनचा तालीकोट सहभाग.\nचूक: 1,2,3 एका सत्य जोडीला असत्य ठरवतात.", "evidence": "Radhey Shyam, Kingdom of Ahmadnagar; Ferishta; Talikota 1565 alliance lists Husain Nizam Shah I."}, {"section": 4, "subtopic": "पानिपत तिसरे 1761 कारणे", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): 14 जानेवारी 1761 च्या तिसऱ्या पानिपत युद्धात मराठ्यांच्या पराभवाचे प्रमुख व एकमेव कारण अहमदशाह अब्दालीकडील संख्याबळाचे प्रचंड अधिक्य हे होते.\nकारण (R): सदाशिवराव भाऊ यांना राजपूत, जाट, शीख यांचा पाठिंबा मिळवता आला नाही, नजीब-उद्दौलाने अब्दालीला रसद-मार्ग खुले ठेवले तर मराठ्यांचा रसद पुरवठा खंडित झाला आणि कुटुंबकबिल्यासह प्रचंड तळामुळे मराठ्यांची गतिशीलता हरवली.", "q_english": "Assertion (A): The chief and sole cause of Maratha defeat in the Third Battle of Panipat (14 Jan 1761) was the overwhelming numerical superiority of Ahmad Shah Abdali. Reason (R): Sadashivrao Bhau failed to secure Rajput, Jat and Sikh support, Najib-ud-daulah kept Abdali's supply lines open while Maratha supplies were cut off, and the huge camp with families destroyed Maratha mobility.", "options": ["A आणि R दोन्ही सत्य असून, R हे A चे अचूक स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य असून, R हे A चे अचूक स्पष्टीकरण नाही.", "A असत्य आहे, परंतु R सत्य आहे.", "A सत्य आहे, परंतु R असत्य आहे."], "correct_index": 2, "explanation_marathi": "A असत्य आहे कारण दोन्ही सैन्ये संख्येने जवळपास समसमान (सुमारे 60-70 हजार) होती; अब्दालीचा विजय संख्याबळापेक्षा नजीबचा पाठिंबा, रोहिला-अफगाण समन्वय व मराठ्यांची रसद-कोंडी यामुळे झाला. R सत्य आहे व पराभवाची बहुकारणमीमांसा देते. त्यामुळे दोन्ही सत्य मानणारे पर्याय 1-2 आणि R नाकारणारा पर्याय 4 चूक ठरतात.", "evidence": "Jadunath Sarkar - Fall of the Mughal Empire Vol II, Ch. Panipat; Shejwalkar - Panipat 1761 (मराठी); UPSC/MPSC State Board इयत्ता 8 वी - पानिपत प्रकरण"}, {"section": 4, "subtopic": "बहामनी गुलबर्गा ते बिदर", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): बहामनी सुलतान अहमदशाह वली याने इ.स. 1429 मध्ये राजधानी गुलबर्गाहून बिदर येथे हलवली.\nकारण (R): बिदरचे मध्य-दख्खनमधील स्थान उत्तरेकडील मालवा-गुजरात आघाडी आणि दक्षिणेकडील विजयनगर आघाडी या दोन्हींवर नियंत्रणासाठी अधिक सोयीचे होते आणि बिदरचा किल्ला भौगोलिकदृष्ट्या अधिक बळकट होता.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): Bahmani Sultan Ahmad Shah Wali shifted the capital from Gulbarga to Bidar in 1429 CE.\nReason (R): Bidar's location in central Deccan was more convenient for controlling both the northern Malwa-Gujarat front and the southern Vijayanagara front, and Bidar fort was geographically stronger.\nSelect the correct option:", "options": ["A आणि R दोन्ही बरोबर असून R हे A चे योग्य स्पष्टीकरण आहे / Both A and R are correct and R is the correct explanation of A", "A आणि R दोन्ही बरोबर, पण R हे A चे योग्य स्पष्टीकरण नाही / Both A and R are correct but R is not the correct explanation of A", "A बरोबर, R चूक / A is correct, R is incorrect", "A चूक, R बरोबर / A is incorrect, R is correct"], "correct_index": 0, "explanation_marathi": "A बरोबर आहे कारण राजधानी बदलणारा अहमदशाह वलीच (1429), अलाउद्दीन बहमनशाह (1347 मध्ये गुलबर्गा स्थापना) नव्हे. R देखील बरोबर आहे कारण मध्यवर्ती स्थान व किल्ल्याची बळकटी हेच अधिकृत कारण होते. त्यामुळे A चूक मानणारा व R चूक मानणारा पर्याय बाद होतो, आणि स्पष्टीकरण नाकारणारा पर्यायही बाद होतो.", "evidence": "Haroon Khan Sherwani - The Bahmanis of the Deccan; ASI Bidar Fort report; Burhan-i-Maasir on Ahmad Shah Wali's 1429 transfer"}, {"section": 4, "subtopic": "मराठा नौदल कान्होजी आंग्रे", "qtype": "जोड्या लावा", "q_marathi": "स्तंभ-I (घटना) व स्तंभ-II (वर्ष) यांच्या योग्य जोड्या लावा :\nस्तंभ-I : A. राजाराम महाराजांकडून कान्होजी आंग्रे यांची 'सरखेल' म्हणून प्रथम नियुक्ती, B. बाळाजी विश्वनाथ यांच्या मध्यस्थीने शाहू महाराज- कान्होजी तह, C. कुलाबा येथील इंग्रज-पोर्तुगीज संयुक्त हल्ल्याचा पराभव, D. कान्होजींचा इंग्रजांशी मैत्रीचा तह\nस्तंभ-II : 1. 1699, 2. 1714, 3. 1721, 4. 1724", "q_english": "Match Column-I (Event) with Column-II (Year): Column-I: A. First appointment of Kanhoji Angre as 'Sarkhel' by Rajaram Maharaj, B. Shahu-Kanhoji treaty mediated by Balaji Vishwanath, C. Defeat of Anglo-Portuguese joint attack on Kolaba, D. Kanhoji's treaty of friendship with the English. Column-II: 1. 1699, 2. 1714, 3. 1721, 4. 1724", "options": ["A-1, B-2, C-3, D-4", "A-1, B-2, C-4, D-3", "A-1, B-3, C-2, D-4", "A-2, B-1, C-3, D-4"], "correct_index": 0, "explanation_marathi": "बरोबर उत्तर A-1, B-2, C-3, D-4 आहे कारण 1699 मध्ये राजारामांनी नियुक्ती केली, 1714 चा तह बाळाजी विश्वनाथांनी घडवला, 1721 मध्ये कुलाब्याचा संयुक्त हल्ला परतवला व 1724 मध्ये इंग्रजांशी तह झाला. पर्याय 2 मध्ये 1721/1724 ची अदलाबदल ही सामान्य चूक आहे, पर्याय 3 मध्ये 1714/1721 ची गल्लत आहे, तर पर्याय 4 मध्ये नियुक्ती 1714 ला नेऊन शाहूंच्या शिक्कामोर्तबाशी गोंधळ केला आहे.", "evidence": "Grant Duff - History of the Mahrattas Vol I, Ch. on Kanhoji; Maharashtra State Gazetteer - Kolaba District; इयत्ता 7 वी इतिहास पाठ्यपुस्तक - मराठा आरमार प्रकरण"}, {"section": 4, "subtopic": "यादव देवगिरी वंश", "qtype": "जोड्या लावा", "q_marathi": "जोड्या जुळवा:\nअ. भिल्लम V\nब. सिंघण II\nक. महादेव\nड. रामचंद्र\n1. इ.स. 1187 च्या सुमारास देवगिरीला बळकट करून राजधानी बनवले व स्वतंत्र यादव सत्तेची स्थापना\n2. होयसाळ बल्लाळ II चा पराभव; दरबारात शार्ङ्गदेव (संगीत-रत्नाकरचा कर्ता) याला आश्रय\n3. प्रधान हेमाद्री (हेमाडपंत) याच्याकडून चतुर्वर्गचिंतामणी ग्रंथाचे लेखन\n4. इ.स. 1296 मध्ये अलाउद्दीन खिलजीची पहिली स्वारी व नंतर खंडणीचा तह\nयोग्य जुळणी निवडा:", "q_english": "Match the pairs:\nA. Bhillama V\nB. Singhana II\nC. Mahadeva\nD. Ramachandra\n1. Fortified Devagiri and made it capital c. 1187 CE, founding independent Yadava power\n2. Defeat of Hoysala Ballala II; patronage to Sharangadeva (author of Sangita-Ratnakara) in court\n3. Composition of Chaturvarga-Chintamani by prime minister Hemadri (Hemadpant)\n4. First invasion of Alauddin Khalji in 1296 CE and subsequent tribute treaty\nSelect the correct matching:", "options": ["अ-1, ब-2, क-3, ड-4 / A-1, B-2, C-3, D-4", "अ-1, ब-3, क-2, ड-4 / A-1, B-3, C-2, D-4", "अ-2, ब-1, क-3, ड-4 / A-2, B-1, C-3, D-4", "अ-1, ब-2, क-4, ड-3 / A-1, B-2, C-4, D-3"], "correct_index": 0, "explanation_marathi": "भिल्लम V हाच देवगिरीचा संस्थापक (1187), सिंघण II हाच होयसाळांवर विजय मिळवून शार्ङ्गदेवला आश्रय देणारा, महादेवाच्या काळातच हेमाद्रीने चतुर्वर्गचिंतामणी लिहिला, आणि रामचंद्राच्याच काळात 1296 ची खिलजी स्वारी झाली. त्यामुळे ब-3, क-2 ची अदलाबदल चूक, अ-2, ब-1 ची अदलाबदल संस्थापकाबाबतचा गोंधळ आहे, आणि क-4, ड-3 ची अदलाबदल हेमाद्रीच्या काळाबाबत चूक आहे.", "evidence": "Yadava history (Nangpurkar-Tulpule); Sangita-Ratnakara colophon linking Sharangadeva to Singhana II court; Hemadri's Chaturvarga-Chintamani introduction; Barani/Ferishta on Alauddin's 1296 Devagiri expedition"}, {"section": 4, "subtopic": "राष्ट्रकूट एलोरा कैलास", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "दोन संकल्पना एकत्र करा: (i) एलोरा कैलास मंदिराचा निर्माता राष्ट्रकूट राजा, (ii) त्याचे स्थापत्य वैशिष्ट्य. योग्य जोडी ओळखा.", "q_english": "Combine: (i) Rashtrakuta king who built Ellora Kailasa temple, (ii) its architectural feature. Identify correct pair.", "options": ["कृष्ण I – एकाश्म द्रविड शैली, वरून खाली कोरणी, शिवालय", "दंतिदुर्ग – एकाश्म द्रविड शैली, वरून खाली कोरणी, शिवालय", "कृष्ण I – खालून वर बांधलेले नागर शैली विष्णुमंदिर", "अमोघवर्ष I – एकाश्म वेसर शैली जैन मंदिर"], "correct_index": 0, "explanation_marathi": "बरोबर: कृष्ण I ने एकाश्म कैलास शिवमंदिर वरून खाली कोरले, द्रविड शैली.\nचूक: दंतिदुर्ग संस्थापक मात्र निर्माता नव्हे; 2-3 मध्ये दिशा/शैली/देवता/राजा चूक.", "evidence": "Ellora Cave 16 inscription; ASI Ellora guide: Kailasa temple attributed to Krishna I, monolithic Dravida, vertical excavation top-down."}, {"section": 4, "subtopic": "वाकाटक: प्रवरपूर-नंदिवर्धन राजधानी", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "वाकाटकांच्या प्रवरपूर-नंदिवर्धन शाखेबाबत खालील विधाने विचारात घ्या:\nI. प्रवरपूर (सध्याच्या वर्धा जिल्ह्यातील पौनार) या नवीन राजधानीची स्थापना प्रवरसेन I याने केली.\nII. नंदिवर्धन (नागपूरजवळील नगरधन/नंदपूर) ही या शाखेची प्रारंभिक राजधानी होती.\nIII. प्रवरसेन II याचा चम्मक ताम्रपट प्रवरपूर येथून निर्गमित झाला असून त्यात प्रवरपूरचाच राजधानी म्हणून उल्लेख आहे.\nवरीलपैकी कोणती विधाने बरोबर आहेत?", "q_english": "Consider the following statements regarding the Pravarapura-Nandivardhana branch of the Vakatakas:\nI. The new capital Pravarapura (modern Paunar in Wardha district) was founded by Pravarasena I.\nII. Nandivardhana (Nagardhan/Nandpur near Nagpur) was the early capital of this branch.\nIII. The Chammak copper plate of Pravarasena II was issued from Pravarapura and mentions Pravarapura itself as the capital.\nWhich of the statements given above is/are correct?", "options": ["फक्त I आणि II बरोबर / Only I and II are correct", "फक्त II आणि III बरोबर / Only II and III are correct", "फक्त I आणि III बरोबर / Only I and III are correct", "I, II आणि III तिन्ही बरोबर / All I, II and III are correct"], "correct_index": 1, "explanation_marathi": "विधान I चूक आहे कारण प्रवरपूरची स्थापना प्रवरसेन II याने केली, प्रवरसेन I याने नव्हे (हा सर्वात सामान्य गोंधळ आहे). विधान II बरोबर आहे कारण नंदिवर्धन ही मूळ राजधानी होती, तर वत्सगुल्म (वाशिम) ही दुसऱ्या शाखेची राजधानी होती. विधान III बरोबर आहे कारण चम्मक ताम्रपट प्रवरपूरहूनच निर्गमित झाला. त्यामुळे फक्त II आणि III बरोबर असलेला पर्याय योग्य; I समाविष्ट असलेले इतर पर्याय बाद होतात.", "evidence": "V.V. Mirashi, Corpus Inscriptionum Indicarum Vol. V (Vakataka inscriptions); Chammak copper plates of Pravarasena II issued from Pravarapura; ASI identification of Nandivardhana with Nagardhan near Nagpur"}, {"section": 4, "subtopic": "विजयनगर हरिहर-बुक्क स्थापना", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "खालील दोन संकल्पना विचारात घ्या:\nसंकल्पना X: विजयनगर साम्राज्याची स्थापना इ.स. 1336 मध्ये तुंगभद्रा नदीकाठी अनेगोंदीजवळ हरिहर आणि बुक्क यांनी केली; प्रारंभिक केंद्र अनेगोंदी-विजयनगर (हम्पी) हेच होते.\nसंकल्पना Y: हरिहर-बुक्क हे मूळतः वारंगलच्या काकतीय दरबारातील अधिकारी होते, नंतर होयसाळ वीर बल्लाळ III च्या सेवेत गेले; दिल्ली सुलतानाच्या कैदेतून सुटल्यानंतर विद्यारण्यांच्या प्रेरणेने हिंदू धर्मात पुनर्दीक्षा घेऊन त्यांनी राज्य स्थापन केले.\nयोग्य पर्याय निवडा:", "q_english": "Consider the following two concepts:\nConcept X: Vijayanagara empire was founded in 1336 CE by Harihara and Bukka near Anegondi on the Tungabhadra river; the early centre was Anegondi-Vijayanagara (Hampi).\nConcept Y: Harihara-Bukka were originally officers in the Kakatiya court of Warangal, later served Hoysala Vira Ballala III; after release from Delhi Sultan's captivity, inspired by Vidyaranya, they reconverted to Hinduism and founded the kingdom.\nSelect the correct option:", "options": ["X आणि Y दोन्ही बरोबर आणि मिळून स्थापनेचे सर्वमान्य स्पष्टीकरण बनते / Both X and Y are correct and together form the accepted explanation", "X बरोबर, Y चूक (ते मूळतः फक्त होयसाळ अधिकारी होते, काकतीय संबंध नव्हता) / X correct, Y incorrect", "X चूक (स्थापना 1346 मध्ये झाली), Y बरोबर / X incorrect (founded in 1346), Y correct", "X आणि Y दोन्ही बरोबर पण Y चा X शी कार्यकारण संबंध नाही / Both correct but Y has no causal relation with X"], "correct_index": 0, "explanation_marathi": "X बरोबर आहे (1336, तुंगभद्रा-अनेगोंदी ही सर्वमान्य तिथी-जागा; 1346 ही नंतरच्या विस्ताराची तारीख समजणे हा गोंधळ आहे). Y बरोबर आहे (काकतीय→होयसाळ→कैद→विद्यारण्य प्रेरणा हा सर्वमान्य प्रवास; फक्त होयसाळ अधिकारी मानणे अपूर्ण आहे). त्यामुळे Y चूक मानणारे व 1346 मानणारे पर्याय बाद होतात, आणि कार्यकारण नाकारणाराही बाद होतो कारण Y हीच स्थापनेची पार्श्वभूमी आहे.", "evidence": "Robert Sewell - A Forgotten Empire; Epigraphia Carnatica; Rajakalanirnaya on Vidyaranya tradition; K.A. Nilakanta Sastri on 1336 foundation and Kakatiya-Hoysala service"}, {"section": 4, "subtopic": "सातवाहनोत्तर अभिर-त्रैकूटक", "qtype": "कारण-परिणाम", "q_marathi": "(A): सातवाहनांनंतर ईश्वरसेनाने नाशिक-खानदेशात अभिर सत्ता स्थापली. (R): त्रैकूटकांनी अपरान्त-कोंकणात सत्ता स्थापून त्रैकूटक संवत (इ.स. 249) सुरू केला. A व R मधील योग्य कारण-परिणाम संबंध ओळखा.", "q_english": "Given (A): Ishvarasena founded Abhira power in Nashik-Khandesh after Satavahanas. (R): Traikutakas established power in Aparanta-Konkan starting Traikutaka era (249 CE). Identify correct cause-effect relation between A and R.", "options": ["A व R दोन्ही सत्य, R हा A चा थेट परिणाम आहे", "A व R दोन्ही सत्य, पण R हा A चा थेट परिणाम नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "बरोबर: दोन्ही सत्य पण समकालीन स्वतंत्र उदय; त्रैकूटक संवत 249 अभिरांच्या पतनाचा परिणाम नाही.\nचूक: पर्याय 0 कार्यकारण जोडतो, 2-3 एक विधान चुकवतात.", "evidence": "Mirashi, Studies in Indology; Nasik Cave Inscription of Ishvarasena, Kanheri Traikutaka inscriptions dated in Traikutaka era 249 CE."}, {"section": 5, "subtopic": "अमरावती संत्रा पट्टा", "qtype": "कालक्रम लावा", "q_marathi": "अमरावती संत्रा पट्ट्यातील पुढील बहार (flowering) कालक्रमानुसार (वर्षाच्या सुरुवातीपासून) लावा: (1) मृग बहार (2) हस्त बहार (3) आंबिया बहार", "q_english": "Arrange the following citrus bahars (flowering seasons) of the Amravati orange belt in chronological order (from the start of the year): (1) Mrig bahar (2) Hasta bahar (3) Ambia bahar", "options": ["3 → 1 → 2", "1 → 3 → 2", "2 → 1 → 3", "3 → 2 → 1"], "correct_index": 0, "explanation_marathi": "बरोबर क्रम: आंबिया (जाने.-फेब्रु.) → मृग (जून-जुलै, पावसाळा) → हस्त (सप्टें.-ऑक्टो.). उरलेल्या पर्यायांत बहारांचा ऋतुक्रम बदललेला आहे, म्हणून ते चूक.", "evidence": "Citrus blooms three times a year: Ambia bahar Jan–Feb, Mrig bahar June–July (monsoon onset), Hasta bahar Sep–Oct (ecoursesonline.iasri.res.in; NAU journal)."}, {"section": 5, "subtopic": "उजनी धरण", "qtype": "जोड्या लावा", "q_marathi": "योग्य जोड्या लावा — धरण व संबंधित नदी: (1) उजनी (2) कोयना (3) जायकवाडी (4) तोतलाडोह; (a) पेंच (b) भीमा (c) गोदावरी (d) कोयना", "q_english": "Match the pairs – dam and associated river: (1) Ujjani (2) Koyna (3) Jayakwadi (4) Totladoh; (a) Pench (b) Bhima (c) Godavari (d) Koyna", "options": ["1-b, 2-d, 3-c, 4-a", "1-b, 2-c, 3-d, 4-a", "1-c, 2-d, 3-b, 4-a", "1-b, 2-d, 3-a, 4-c"], "correct_index": 0, "explanation_marathi": "बरोबर: उजनी-भीमा (सोलापूर), कोयना-कोयना (सातारा), जायकवाडी-गोदावरी (छ. संभाजीनगर), तोतलाडोह-पेंच (नागपूर). इतर पर्यायांत नद्यांची अदलाबदल केली आहे, म्हणून ते चूक.", "evidence": "Ujjani Dam (Bhima Dam): earthfill-cum-masonry gravity dam on Bhima River near Ujjani village, Madha Taluk, Solapur (Wikipedia); Jayakwadi on Godavari at Paithan; Totladoh on Pench river, Nagpur."}, {"section": 5, "subtopic": "कोयना धरण", "qtype": "बहु-विधान", "q_marathi": "कोयना धरणाबाबत पुढील विधाने विचारात घ्या: (A) हे धरण सातारा जिल्ह्यात कोयना नदीवर बांधले आहे. (B) या धरणाच्या जलाशयाला शिवसागर तलाव म्हणतात. (C) कोयना जलविद्युत प्रकल्प (१९६० मे.वॅ.) हा महाराष्ट्रातील सर्वात मोठा पूर्ण झालेला जलविद्युत प्रकल्प आहे. (D) हे धरण मातीच्या भरावाचे (earthen dam) आहे. वरीलपैकी कोणती विधाने बरोबर आहेत?", "q_english": "Consider the following statements about Koyna Dam: (A) The dam is built on the Koyna River in Satara district. (B) Its reservoir is called Shivsagar Lake. (C) The Koyna Hydroelectric Project (1960 MW) is the largest completed hydroelectric project in Maharashtra. (D) It is an earthen fill dam. Which of the above statements are correct?", "options": ["A, B आणि C फक्त", "A, B आणि D फक्त", "B, C आणि D फक्त", "A, C आणि D फक्त"], "correct_index": 0, "explanation_marathi": "A, B, C बरोबर: धरण साताऱ्यात कोयना नदीवर, जलाशय शिवसागर, १९६० मे.वॅ. क्षमतेसह राज्यातील सर्वात मोठा जलविद्युत प्रकल्प. D चूक, कारण हे रबल-काँक्रीट गुरुत्व धरण आहे, मातीच्या भरावाचे नव्हे.", "evidence": "Koyna Dam: rubble-concrete gravity dam, 103.02 m high, Satara district on Koyna River; reservoir Shivsagar; 1960 MW across four stages – largest completed hydroelectric project in Maharashtra (MPCB report; thecivilindia.com; testbook)."}, {"section": 5, "subtopic": "कोल्हापूर ऊस पट्टा", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): कोल्हापूर जिल्हा प्रतिहेक्टरी उसाच्या उच्च उत्पादनासाठी महाराष्ट्रात आघाडीवर आहे. कारण (R): या पट्ट्यातील ऊस लागवड पूर्णपणे पावसाच्या पाण्यावर अवलंबून आहे.", "q_english": "Assertion (A): Kolhapur district leads in Maharashtra in per-hectare sugarcane yield. Reason (R): Sugarcane cultivation in this belt depends entirely on rainwater.", "options": ["A आणि R दोन्ही बरोबर; R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही बरोबर; पण R हे A चे योग्य स्पष्टीकरण नाही", "A बरोबर, पण R चूक", "A चूक, पण R बरोबर"], "correct_index": 2, "explanation_marathi": "A बरोबर: सिंचन, सुपीक माती व आडसाली पद्धतीमुळे कोल्हापूरचे प्रतिहेक्टरी उत्पादन जास्त. R चूक: ऊस हे जास्त पाणी लागणारे नगदी पीक असून येथे विहीर/कालवा सिंचनावर घेतले जाते, केवळ पावसावर नाही.", "evidence": "Kolhapur sugarcane productivity ~80–90 MT/ha with Kolhapur region crushing highest cane (indiasugar.com); adsali (long-duration irrigated) sugarcane production studies at Kolhapur (krishikosh.egranth.ac.in)."}, {"section": 5, "subtopic": "छ संभाजीनगर", "qtype": "बहु-विधान", "q_marathi": "विधाने पहा: अ) छ. संभाजीनगर दख्खन पठारावर, गोदावरी खोऱ्याच्या काठावर वसले आहे. ब) वेरूळ ~30 किमी वायव्येस, अजिंठा ~100 किमी ईशान्येस आहे. क) वाळूज-चिकलठाणा MIDC ऑटो व फार्मा पट्टा आहे. ड) जायकवाडी (पैठण) धरणातून पाणीपुरवठा होतो. योग्य गट निवडा.", "q_english": "Statements: a) Chh. Sambhajinagar on Deccan plateau, Godavari basin edge. b) Verul ~30 km NW, Ajanta ~100 km NE. c) Waluj-Chikalthana MIDC auto-pharma belt. d) Water supply from Jayakwadi (Paithan) dam. Choose correct group.", "options": ["अ, ब, क, ड सर्व बरोबर", "अ, क, ड बरोबर; ब चूक (अजिंठा वायव्येस)", "अ, ब, क बरोबर; ड चूक (पुरवठा इसापूरमधून)", "ब, क, ड बरोबर; अ चूक (शहर कोकणात आहे)"], "correct_index": 0, "explanation_marathi": "चारही विधाने तथ्यांशी जुळतात: पठारीय स्थान, लेण्यांचे अंतर-दिशा, MIDC वैशिष्ट्य, जायकवाडी पाणीपुरवठा. म्हणून 0 बरोबर; 1-3 मध्ये एका बरोबर विधानाला चूक ठरवले आहे.", "evidence": "Maharashtra Gazetteer Aurangabad district; ASI Ellora-Ajanta distances; MIDC Waluj/Chikalthana profile; Jayakwadi dam Paithan reports"}, {"section": 5, "subtopic": "नागपूर स्थान", "qtype": "कारण-परिणाम", "q_marathi": "विधान (A): नागपूर 'झिरो मैल' परिसरात असून भारताच्या भौगोलिक केंद्रबिंदूजवळ आहे. विधान (R): नागपूर राष्ट्रीय महामार्ग, रेल्वे जाळे व MIHAN मल्टीमोडल लॉजिस्टिक हब म्हणून विकसित झाले आहे. A-R संबंध ओळखा.", "q_english": "Statement (A): Nagpur at 'Zero Mile' lies near India's geographical centre. Statement (R): Nagpur developed as national highway, railway network and MIHAN multimodal logistics hub. Identify A-R relation.", "options": ["A व R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण आहे", "A व R दोन्ही सत्य; R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A (झिरो मैल-केंद्रबिंदू) व R (महामार्ग/रेल्वे/MIHAN हब) दोन्ही सत्य; मध्यवर्ती स्थानामुळेच दळणवळण हब बनणे हा कार्यकारण संबंध आहे. म्हणून 0 बरोबर; 1 मध्ये स्पष्टीकरण नाकारले, 2/3 मध्ये एक विधान चूक ठरवले जे तथ्याविरुद्ध.", "evidence": "Zero Mile Stone Nagpur; Survey of India; NHAI North-South/East-West corridors; MIHAN-MADC project reports"}, {"section": 5, "subtopic": "नाशिक कुंभमेळा", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "संकल्पना 1 (खगोल): सिंहस्थ कुंभ तेव्हा होतो जेव्हा गुरु सिंह राशीत व सूर्य मेष राशीत असतो. संकल्पना 2 (भूगोल): नाशिक गोदावरी काठावर त्र्यंबकेश्वरजवळ आहे; समुद्रमंथनातील अमृतथेंब येथे पडला. दोन्ही एकत्र करून योग्य निष्कर्ष निवडा.", "q_english": "Concept 1 (astro): Simhastha Kumbh when Jupiter in Leo and Sun in Aries. Concept 2 (geo): Nashik on Godavari near Trimbakeshwar; Amrit drop fell here in Samudra Manthan. Combine to choose correct conclusion.", "options": ["सिंहस्थ योग (गुरु-सिंह) जुळताच गोदावरी काठावरील नाशिक-त्र्यंबकेश्वर येथे दर ~12 वर्षांनी कुंभ भरतो", "कुंभ दर 12 वर्षांनी प्रयागराजप्रमाणे मकर संक्रांतीला नाशिकमध्ये भरतो", "गुरु मेष राशीत असताना गोदावरी उगमावर नाशिकात अर्धकुंभ भरतो", "सूर्य सिंह राशीत असताना नर्मदा काठावर नाशिक सिंहस्थ भरतो"], "correct_index": 0, "explanation_marathi": "गुरुचा ~12 वर्षीय परिभ्रमण काळ व सिंह राशीतील स्थिती + गोदावरी-त्र्यंबकेश्वर स्थान हेच नाशिक सिंहस्थाचे आधार आहेत, म्हणून 0 बरोबर. 1/2/3 मध्ये ग्रहयोग, नदी किंवा कालावधी चुकवला आहे.", "evidence": "Nashik Gazetteer; Simhastha Kumbh – Jupiter in Leo, Sun in Aries (~12 years); Godavari-Trimbakeshwar; Samudra Manthan legend"}, {"section": 5, "subtopic": "नाशिक द्राक्ष पट्टा", "qtype": "नकाशा आधारित", "q_marathi": "महाराष्ट्राच्या नकाशात 'X' अक्षराने चिन्हांकित केलेला प्रदेश (नाशिक जिल्ह्याचा परिसर) प्रामुख्याने कोणत्या व्यापारी पिकाच्या पट्ट्यासाठी प्रसिद्ध आहे?", "q_english": "The region marked 'X' on the Maharashtra map (Nashik district area) is mainly famous as the belt of which commercial crop?", "options": ["द्राक्ष", "संत्रा", "ऊस", "कापूस"], "correct_index": 0, "explanation_marathi": "X हा नाशिक परिसर – 'भारताची द्राक्ष/वाइन राजधानी', थॉम्पसन सीडलेस जात. संत्रा-विदर्भ (नागपूर/अमरावती), ऊस-कोल्हापूर पट्टा, कापूस-विदर्भ/मराठवाडा, म्हणून उरलेले पर्याय चूक.", "evidence": "Nashik called 'Wine Capital of India' / 'Grape Capital of India' (Wikipedia; NDTV); Thompson Seedless grown in/around Nashik, one-third of India's grape exports sourced from Nashik (NABARD study); NHB Nashik variety list."}, {"section": 5, "subtopic": "पश्चिम घाट जैवविविधता हॉटस्पॉट", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): पश्चिम घाट हा जगातील आठ 'hottest hotspots' पैकी एक आहे, कारण त्याचा उगम गोंडवनखंडाच्या विभाजनातून झाला असून तो हिमालयापेक्षा प्राचीन आहे.\nतर्क (R): पश्चिम घाटातील सुमारे 77% उभयचर आणि 62% सरपटणारे प्राणी स्थानिक (endemic) असून येथे 325 हून अधिक जागतिक स्तरावर धोक्यात असलेल्या प्रजाती आढळतात.", "q_english": "Assertion (A): The Western Ghats is one of the world's eight 'hottest hotspots' because it originated from the breakup of Gondwanaland and is older than the Himalayas.\nReason (R): About 77% of amphibians and 62% of reptiles in the Western Ghats are endemic, with more than 325 globally threatened species found here.", "options": ["A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे.", "A आणि R दोन्ही सत्य आहेत, परंतु R हे A चे योग्य स्पष्टीकरण नाही.", "A सत्य आहे, परंतु R असत्य आहे.", "A असत्य आहे, परंतु R सत्य आहे."], "correct_index": 1, "explanation_marathi": "A आणि R दोन्ही तथ्यतः सत्य आहेत – पश्चिम घाट गोंडवन-उत्पत्तीचा, हिमालयापेक्षा प्राचीन आहे आणि Myers et al. (2000) नुसार 8 hottest hotspots पैकी एक आहे; R मधील स्थानिकतेचे प्रमाण व 325+ धोक्यातील प्रजाती UNESCO/CEPF नुसार सत्य आहेत. परंतु R हा A मधील 'प्राचीनत्व/गोंडवन उत्पत्ती' चे स्पष्टीकरण देत नाही, तो फक्त हॉटस्पॉट दर्जाच्या निकषाचे (endemism + threat) समर्थन करतो. म्हणून पर्याय 1 बरोबर; पर्याय 0 मधील 'योग्य स्पष्टीकरण' चूक, तर पर्याय 2 व 3 मधील एक विधान असत्य ठरवणे तथ्यांशी विसंगत आहे.", "evidence": "UNESCO World Heritage Centre – Western Ghats (39 serial sites, 2012); CEPF – Western Ghats & Sri Lanka Biodiversity Hotspot profile; Myers et al. 2000 Nature – 'Biodiversity hotspots for conservation priorities' (8 hottest hotspots)"}, {"section": 5, "subtopic": "पुणे IT", "qtype": "जोड्या लावा", "q_marathi": "जोड्या लावा: अ) हिंजवडी – 1) राजीव गांधी इन्फोटेक पार्क ब) खराडी – 2) EON IT पार्क क) मगरपट्टा – 3) सायबरसिटी ड) तळवडे – 4) MIDC IT/मॅन्युफॅक्चरिंग हब. योग्य मेळ निवडा.", "q_english": "Match: a) Hinjewadi – 1) Rajiv Gandhi Infotech Park b) Kharadi – 2) EON IT Park c) Magarpatta – 3) Cybercity d) Talawade – 4) MIDC IT/manufacturing hub. Choose correct match.", "options": ["अ-1, ब-2, क-3, ड-4", "अ-1, ब-3, क-2, ड-4", "अ-2, ब-1, क-3, ड-4", "अ-1, ब-2, क-4, ड-3"], "correct_index": 0, "explanation_marathi": "हिंजवडी=राजीव गांधी पार्क, खराडी=EON, मगरपट्टा=सायबरसिटी, तळवडे=MIDC हब हा अधिकृत मेळ आहे, म्हणून 0 बरोबर. 1-3 मध्ये ब/क/ड च्या जोड्या अदलाबदल केल्याने चूक.", "evidence": "MIDC Pune profile; Rajiv Gandhi Infotech Park Hinjewadi; EON IT Park Kharadi; Magarpatta Cybercity official directories"}, {"section": 5, "subtopic": "भिगवण फ्लेमिंगो पक्षी", "qtype": "कारण-परिणाम", "q_marathi": "खालील कारण (C) आणि परिणाम (E) विचारात घ्या:\nकारण (C): उजनी जलाशयातील (भिगवण) उथळ, खाऱ्या पाणथळ भागात निळे-हिरवे शैवाल, डायटॉम आणि ब्राइन श्रिम्प (Artemia) मुबलक आढळतात, जे फ्लेमिंगोचे मुख्य अन्न आहे.\nपरिणाम (E): दरवर्षी नोव्हेंबर ते मार्च दरम्यान ग्रेटर फ्लेमिंगो (Phoenicopterus roseus) आणि लेसर फ्लेमिंगो (Phoeniconaias minor) यांचे हजारोंचे थवे भिगवण येथे स्थलांतर करतात आणि भिगवण येथेच प्रजनन करतात.", "q_english": "Consider the following Cause (C) and Effect (E):\nCause (C): The shallow, brackish wetlands of Ujani reservoir (Bhigwan) abound in blue-green algae, diatoms and brine shrimp (Artemia), the main food of flamingos.\nEffect (E): Every year between November and March, thousands of Greater Flamingos (Phoenicopterus roseus) and Lesser Flamingos (Phoeniconaias minor) migrate to Bhigwan and breed at Bhigwan itself.", "options": ["C सत्य, E सत्य, आणि C हे E चे पूर्ण योग्य कारण आहे.", "C सत्य, E अंशतः सत्य (स्थलांतर सत्य, प्रजनन असत्य) – C हे हिवाळी स्थलांतराचे कारण आहे, परंतु प्रजननाचा दावा चुकीचा आहे.", "C असत्य, E सत्य आहे.", "C सत्य, E सत्य, परंतु C चा E शी कोणताही कार्यकारण संबंध नाही."], "correct_index": 1, "explanation_marathi": "C पूर्ण सत्य आहे – उथळ खाऱ्या पाण्यातील शैवाल/Artemia हेच फ्लेमिंगोचे अन्न असल्याने भिगवण महत्त्वाचे हिवाळी आश्रयस्थान ठरते. E अंशतः सत्य आहे – नोव्हेंबर-मार्च स्थलांतर सत्य असले तरी 'भिगवण येथेच प्रजनन' असत्य आहे; प्रजनन कच्छच्या रणात/आफ्रिकेतील खाऱ्या पानवठ्यांवर होते. म्हणून पर्याय 1 बरोबर; पर्याय 0 मधील 'पूर्ण सत्य व पूर्ण कारण' चूक, पर्याय 2 मधील C असत्य चूक, आणि पर्याय 3 मधील 'संबंध नाही' हे अन्न-आश्रय संबंधामुळे चूक.", "evidence": "BNHS – Bhigwan wetlands / Ujani reservoir bird monitoring reports; Maharashtra Forest Dept – Bhigwan as wintering ground for Greater & Lesser Flamingos; WWF-India – Flamingo breeding grounds in Rann of Kutch, not Bhigwan"}, {"section": 5, "subtopic": "मराठवाडा वाळवंटीकरण", "qtype": "नकाशा आधारित", "q_marathi": "महाराष्ट्राच्या नकाशात मराठवाड्यातील चार जिल्हे चिन्हांकित केले आहेत: (1) छत्रपती संभाजीनगर (उत्तर), (2) जालना (मध्य-उत्तर), (3) बीड (मध्य-दक्षिण), (4) लातूर (दक्षिण). इस्रोच्या वाळवंटीकरण/जमीन ऱ्हास स्थिती नकाशानुसार (2019-21) कमी पर्जन्य, उथळ बेसाल्ट मृदा आणि भूजल अतिउपसा या निकषांवर कोणता चिन्हांकित जिल्हा सर्वाधिक तीव्र वाळवंटीकरण/जमीन ऱ्हास संवेदनशील पट्ट्यात दर्शविला जाईल?", "q_english": "On a map of Maharashtra, four Marathwada districts are marked: (1) Chhatrapati Sambhajinagar (north), (2) Jalna (mid-north), (3) Beed (mid-south), (4) Latur (south). As per ISRO's Desertification/Land Degradation Status Map (2019-21), based on low rainfall, shallow basaltic soils and groundwater over-extraction, which marked district will fall in the most severe desertification/land-degradation vulnerability zone?", "options": ["(1) छत्रपती संभाजीनगर", "(2) जालना", "(3) बीड", "(4) लातूर"], "correct_index": 2, "explanation_marathi": "बीड हा सह्याद्रीच्या पर्जन्यछायेत (<700 मिमी पाऊस), उथळ बेसाल्ट मृदा, वारंवार दुष्काळ व भूजल अतिउपसा असलेला मध्य-दक्षिण पठारी जिल्हा आहे; ISRO (2019-21) व राज्य कृती आराखड्यानुसार मराठवाड्यात जमीन ऱ्हास तीव्रता बीडमध्ये सर्वाधिक आहे. जालना जवळचा प्रतिस्पर्धी असला तरी दुय्यम आहे, तर छत्रपती संभाजीनगर व लातूर तुलनेने कमी तीव्र पट्ट्यात येतात – त्यामुळे इतर तीन पर्याय चूक.", "evidence": "ISRO – Desertification Status Mapping of India 2019-21 (Maharashtra chapter); Maharashtra State Action Plan to Combat Desertification; IMD district rainfall normals – Beed <700 mm, rain-shadow zone"}, {"section": 5, "subtopic": "मुंबई उपनगरे", "qtype": "तक्ता आधारित", "q_marathi": "तक्ता पहा: 1) बोरिवली – संजय गांधी राष्ट्रीय उद्यानाचे प्रवेशद्वार 2) वांद्रे – वांद्रे-वरळी सी-लिंकचे उत्तर टोक 3) कुर्ला – मध्य, हार्बर, ट्रान्स-हार्बर रेल्वे जंक्शन 4) घाटकोपर – आरे दुग्ध वसाहत. योग्य-अयोग्य जोड्यांबाबत योग्य पर्याय निवडा.", "q_english": "See table: 1) Borivali – entry to Sanjay Gandhi National Park 2) Bandra – north end of Bandra-Worli Sea Link 3) Kurla – Central, Harbour, Trans-Harbour railway junction 4) Ghatkopar – Aarey Milk Colony. Choose correct option about right-wrong pairs.", "options": ["1, 2, 3 योग्य; 4 अयोग्य (आरे गोरेगावात आहे)", "1, 2, 4 योग्य; 3 अयोग्य (कुर्ला केवळ मध्य मार्गावर आहे)", "1, 3, 4 योग्य; 2 अयोग्य (सी-लिंकचे उत्तर टोक वरळी आहे)", "2, 3, 4 योग्य; 1 अयोग्य (उद्यानाचे प्रवेशद्वार गोरेगाव आहे)"], "correct_index": 0, "explanation_marathi": "1 ते 3 जोड्या तपासणीत बरोबर ठरतात; आरे वसाहत गोरेगावात असल्याने 4 चूक, म्हणून पर्याय 1 बरोबर. इतर पर्यायांत 1/2/3 पैकी एकाला चूक ठरवले आहे, जे तथ्यांशी विसंगत.", "evidence": "Sanjay Gandhi National Park Borivali entry; MMRDA Bandra-Worli Sea Link north end Bandra; Mumbai Suburban Railway Kurla junction; Aarey Milk Colony Goregaon – Maharashtra Gazetteer, MMRDA reports"}, {"section": 5, "subtopic": "सह्याद्री व्याघ्र प्रकल्प", "qtype": "कालक्रम लावा", "q_marathi": "सह्याद्री व्याघ्र प्रकल्पाशी संबंधित घटनांचा योग्य कालक्रम लावा:\nI. कोयना वन्यजीव अभयारण्याची स्थापना\nII. चांदोली राष्ट्रीय उद्यानाची अधिसूचना\nIII. चांदोली व कोयना विलीन करून सह्याद्री व्याघ्र प्रकल्पाची राज्य शासन अधिसूचना\nIV. महाराष्ट्रातील पहिल्या व्याघ्र प्रकल्पाची (मेळघाट) स्थापना", "q_english": "Arrange the events related to Sahyadri Tiger Reserve in chronological order:\nI. Establishment of Koyna Wildlife Sanctuary\nII. Notification of Chandoli National Park\nIII. State Government notification of Sahyadri Tiger Reserve merging Chandoli and Koyna\nIV. Establishment of Maharashtra's first Tiger Reserve (Melghat)", "options": ["IV → I → II → III", "I → IV → III → II", "IV → II → I → III", "I → II → IV → III"], "correct_index": 0, "explanation_marathi": "योग्य क्रम IV (मेळघाट, 1973-74) → I (कोयना अभयारण्य, 1985) → II (चांदोली राष्ट्रीय उद्यान, 2004) → III (सह्याद्री व्याघ्र प्रकल्प अधिसूचना, 5 जानेवारी 2010) हा आहे. पर्याय 1 मध्ये कोयना मेळघाटपूर्वी दाखवले आहे, पर्याय 2 मध्ये चांदोली कोयनापूर्वी दाखवले आहे, आणि पर्याय 3 मध्ये मेळघाट सर्वात शेवटी दाखवले आहे – हे तिन्ही NTCA व महाराष्ट्र वनविभागाच्या अधिसूचना तारखांशी विसंगत आहेत.", "evidence": "Maharashtra Forest Department – Sahyadri TR profile; NTCA notification – Sahyadri Tiger Reserve notified on 5 Jan 2010; Koyna WLS established 1985; Chandoli NP notified 2004; Melghat TR 1973-74 (Project Tiger)"}, {"section": 5, "subtopic": "सिंधुदुर्ग सागरी जीव", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "खालील विधाने विचारात घ्या:\nI. मालवण सागरी अभयारण्य (सुमारे 29.12 चौ.कि.मी.) हे महाराष्ट्रातील एकमेव सागरी अभयारण्य असून सिंधुदुर्ग किल्ल्याभोवती Montipora, Porites सारख्या प्रवाळ प्रजाती आढळतात.\nII. सिंधुदुर्ग किनाऱ्यालगतचा आंग्रिया बँक हा भारतातील सर्वात मोठा बुडालेला प्रवाळ बँक असून त्याला युनेस्को जागतिक वारसा दर्जा मिळाला आहे.\nIII. वेळास, आंजर्ले, शिरोडा यांसारख्या महाराष्ट्र किनाऱ्यांवर ऑलिव्ह रिडले कासव घरटी घालतात; त्यामुळे ऑलिव्ह रिडले फक्त ओडिशाच्या गहिरमाथापुरते मर्यादित नाहीत.", "q_english": "Consider the following statements:\nI. Malvan Marine Sanctuary (about 29.12 sq. km) is Maharashtra's only marine sanctuary and coral species like Montipora, Porites are found around Sindhudurg Fort.\nII. Angria Bank off the Sindhudurg coast is India's largest submerged coral bank and has been accorded UNESCO World Heritage status.\nIII. Olive Ridley turtles nest on Maharashtra coasts like Velas, Anjarle and Shiroda; hence they are not restricted only to Gahirmatha in Odisha.", "options": ["फक्त I बरोबर", "I आणि II बरोबर", "I आणि III बरोबर", "II आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "I सत्य आहे – मालवण (1987, 29.12 चौ.कि.मी.) हेच राज्यातील एकमेव सागरी अभयारण्य असून तेथे प्रवाळ नोंदवले आहेत. III सत्य आहे – वेळास/आंजर्ले/शिरोडा येथे ऑलिव्ह रिडले घरटी घालतात. II असत्य आहे – आंग्रिया बँक हा मोठा प्रवाळ बँक असला तरी त्याला युनेस्को दर्जा मिळालेला नाही. म्हणून I+III (पर्याय 2) बरोबर; पर्याय 0 अपूर्ण आहे, पर्याय 1 व 3 मधील II चे UNESCO दाव्यामुळे चूक आहेत.", "evidence": "Maharashtra Forest Department – Malvan Marine Sanctuary (29.12 sq km, 1987, only marine sanctuary); NIO – Angria Bank coral bank studies (no UNESCO status); BNHS/Forest Dept – Olive Ridley nesting at Velas, Anjarle, Shiroda; MoEFCC – Marine Protected Areas of India"}, {"section": 6, "subtopic": "NITI आयोग रचना", "qtype": "तक्ता आधारित", "q_marathi": "खालील तक्ता विचारात घ्या:\\n| I | अध्यक्ष | पंतप्रधान (पदसिद्ध) |\\n| II | उपाध्यक्ष | केंद्रीय नियोजन मंत्र्यांकडे पदसिद्ध अतिरिक्त प्रभार |\\n| III | पदसिद्ध सदस्य | पंतप्रधानांनी नामनिर्देशित केंद्रीय मंत्रिमंडळातील जास्तीत जास्त 4 मंत्री |\\n| IV | मुख्य कार्यकारी अधिकारी (CEO) | सचिव दर्जाचा अधिकारी, पंतप्रधानांकडून नियुक्त |\\nयोग्य संयोजन निवडा.", "q_english": "Consider the table:\\n| I | Chairperson | Prime Minister (ex-officio) |\\n| II | Vice-Chairperson | Ex-officio additional charge to Union Planning Minister |\\n| III | Ex-officio members | Maximum 4 Union Ministers nominated by PM |\\n| IV | CEO | Secretary-rank officer appointed by PM |\\nChoose correct combination.", "options": ["I, III आणि IV योग्य; II अयोग्य", "I, II आणि III योग्य; IV अयोग्य", "I, II आणि IV योग्य; III अयोग्य", "II, III आणि IV योग्य; I अयोग्य"], "correct_index": 0, "explanation_marathi": "I सत्य (अध्यक्ष पंतप्रधान), III सत्य (जास्तीत जास्त 4 पदसिद्ध मंत्री), IV सत्य (CEO सचिव दर्जा). II असत्य; उपाध्यक्ष हे तज्ज्ञ म्हणून पंतप्रधानांकडून नामनिर्देशित होतात, नियोजनमंत्र्यांकडे पदसिद्ध नाही. त्यामुळे II असलेले पर्याय बाद.", "evidence": "Cabinet Resolution dated 01.01.2015 constituting NITI Aayog; NITI Aayog official composition"}, {"section": 6, "subtopic": "अनुसूचित जाती-जमाती आयोग 338-338A", "qtype": "कालक्रम लावा", "q_marathi": "अनुसूचित जाती-जमाती आयोगांच्या उत्क्रांतीतील खालील घटनांचा योग्य कालक्रम लावा:\nA. मूळ संविधानातील कलम 338 — अनुसूचित जाती-जमातींसाठी विशेष अधिकारी (Commissioner) ची तरतूद\nB. 65वी घटनादुरुस्ती — संयुक्त राष्ट्रीय अनुसूचित जाती-जमाती आयोगाची स्थापना\nC. 89वी घटनादुरुस्ती — कलम 338 व 338A अंतर्गत स्वतंत्र राष्ट्रीय अनुसूचित जाती आयोग (NCSC) व राष्ट्रीय अनुसूचित जमाती आयोग (NCST)\nD. 102वी घटनादुरुस्ती — कलम 338B अंतर्गत राष्ट्रीय मागासवर्ग आयोगास घटनात्मक दर्जा", "q_english": "Arrange the following events in the evolution of the SC/ST Commissions in chronological order:\nA. Original Article 338 of the Constitution — provision for a Special Officer (Commissioner) for SCs/STs\nB. 65th Amendment — creation of the joint National Commission for SCs and STs\nC. 89th Amendment — bifurcation into the separate NCSC (Art. 338) and NCST (Art. 338A)\nD. 102nd Amendment — constitutional status to the National Commission for Backward Classes under Art. 338B", "options": ["A, C, B, D", "A, B, D, C", "B, A, C, D", "A, B, C, D"], "correct_index": 3, "explanation_marathi": "योग्य क्रम A → B → C → D आहे: 1950 (मूळ कलम 338, विशेष अधिकारी) → 1990 (65वी दुरुस्ती, संयुक्त आयोग) → 2003 (89वी दुरुस्ती, 338/338A विभाजन; दोन्ही आयोग 2004 पासून स्वतंत्रपणे कार्यरत) → 2018 (102वी दुरुस्ती, 338B). इतर पर्यायांत B-C किंवा C-D ची अदलाबदल असल्याने ते बाद होतात.", "evidence": "Constitution (65th Amendment) Act, 1990; Constitution (89th Amendment) Act, 2003 (NCSC/NCST कार्यारंभ फेब्रुवारी 2004); Constitution (102nd Amendment) Act, 2018 — Art. 338B."}, {"section": 6, "subtopic": "आणीबाणी: 352,356,360 तुलना", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): कलम 352 खाली सशस्त्र बंडाच्या कारणावर घोषित राष्ट्रीय आणीबाणीत कलम 358 नुसार कलम 19 आपोआप निलंबित होत नाही.\\nकारण (R): 44 व्या घटनादुरुस्तीनंतर कलम 358 केवळ युद्ध किंवा बाह्य आक्रमणातच लागू होते; कलम 359 खाली कलम 20 व 21 वगळता मूलभूत हक्कांची अंमलबजावणी राष्ट्रपती आदेशाने निलंबित करता येते.", "q_english": "Assertion (A): National Emergency under Art.352 on ground of armed rebellion does not automatically suspend Art.19 via Art.358.\\nReason (R): After the 44th Amendment Art.358 applies only to war or external aggression; under Art.359 enforcement of FRs except Arts.20 and 21 can be suspended by Presidential Order.", "options": ["A आणि R दोन्ही सत्य, आणि R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, पण R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R असत्य"], "correct_index": 0, "explanation_marathi": "A सत्य (44 व्या दुरुस्तीने 358 मर्यादित), R सत्य व तेच A चे कारण स्पष्ट करते (358 विरुद्ध 359 भेद). 359 मध्ये 20,21 ला संरक्षण असल्याने इतर पर्याय बाद होतात.", "evidence": "Articles 352, 358, 359; 44th Constitutional Amendment Act, 1978"}, {"section": 6, "subtopic": "उद्देशिका 42वी", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "42व्या घटनादुरुस्ती (1976) बद्दल: संकल्पना 1 - उद्देशिकेत 'समाजवादी, धर्मनिरपेक्ष, एकात्मता' जोडले; संकल्पना 2 - मिनर्व्हा मिल्स खटल्यामुळे उद्देशिकेतील हे शब्द रद्द झाले. योग्य निष्कर्ष कोणता?", "q_english": "On 42nd Amendment (1976): Concept 1 - 'Socialist, Secular, Integrity' added to Preamble; Concept 2 - Minerva Mills quashed these words. Correct conclusion?", "options": ["1 बरोबर, 2 चूक; फक्त कलम 4 व 55 रद्द झाले", "1 व 2 दोन्ही बरोबर", "1 चूक, 2 बरोबर", "1 व 2 दोन्ही चूक"], "correct_index": 0, "explanation_marathi": "1 बरोबर आहे; 42वीने तीन शब्द जोडले. 2 चूक; मिनर्व्हा मिल्स (1980) मध्ये फक्त कलम 4, 55 रद्द झाले, उद्देशिकेतील शब्द कायम आहेत.\nत्यामुळे दोन्ही बरोबर/दोन्ही चूक पर्याय चुकीचे ठरतात.", "evidence": "Constitution (42nd Amendment) Act 1976 Sec.2; Minerva Mills v Union of India AIR 1980 SC 1789"}, {"section": 6, "subtopic": "कलम 19 स्वातंत्र्ये व वाजवी निर्बंध", "qtype": "बहु-विधान (I,II,III)", "q_marathi": "कलम 19 मधील स्वातंत्र्यांवरील वाजवी निर्बंधांबाबत खालील विधाने विचारात घ्या:\nविधान I: 'परकीय राज्यांशी मैत्रीपूर्ण संबंध' या कारणावरून केवळ कलम 19(1)(a) (भाषण व अभिव्यक्ती) स्वातंत्र्यावर निर्बंध घालता येतात; कलम 19(1)(b) व 19(1)(c) साठी हे कारण उपलब्ध नाही.\nविधान II: 'राज्याची सुरक्षितता' या कारणावरून सभा घेण्याच्या (19(1)(b)) व संघटना स्थापण्याच्या (19(1)(c)) स्वातंत्र्यावर निर्बंध घालता येतात.\nविधान III: 'भारताचे सार्वभौमत्व आणि एकता' हे निर्बंध-कारण 16व्या घटनादुरुस्तीने (1963) कलम 19(2), 19(3) व 19(4) या तिन्हींमध्ये समाविष्ट करण्यात आले.\nवरीलपैकी कोणती विधाने बरोबर आहेत?", "q_english": "Consider the following statements regarding reasonable restrictions on the freedoms in Article 19:\nStatement I: The ground of 'friendly relations with foreign States' is available only to restrict the freedom under Article 19(1)(a) (speech and expression); it is not available for Articles 19(1)(b) and 19(1)(c).\nStatement II: The ground of 'security of the State' can be invoked to restrict the freedoms of assembly (19(1)(b)) and association (19(1)(c)).\nStatement III: The restriction-ground 'sovereignty and integrity of India' was inserted by the 16th Amendment (1963) in all three — Articles 19(2), 19(3) and 19(4).\nWhich of the statements given above are correct?", "options": ["फक्त I आणि II बरोबर / Only I and II are correct", "फक्त II आणि III बरोबर / Only II and III are correct", "फक्त I आणि III बरोबर / Only I and III are correct", "I, II आणि III सर्व बरोबर / All of I, II and III are correct"], "correct_index": 2, "explanation_marathi": "विधान I बरोबर आहे: 'परकीय राज्यांशी मैत्रीपूर्ण संबंध' हे केवळ 19(2) मधील निर्बंध-कारण आहे. विधान II चूक आहे: 'राज्याची सुरक्षितता' हे कारण 19(3) व 19(4) मध्ये उपलब्ध नाही (तेथे फक्त सार्वभौमत्व-एकता, सार्वजनिक सुव्यवस्था व नीतिमत्ता). विधान III बरोबर आहे: 16व्या दुरुस्तीने (1963) तिन्ही खंडांत 'सार्वभौमत्व आणि एकता' समाविष्ट केले. त्यामुळे II असलेले पर्याय (a), (b) व (d) बाद होतात.", "evidence": "भारतीय संविधान, कलम 19(2), 19(3), 19(4); 16वी घटनादुरुस्ती कायदा, 1963 (उद्देशपत्रिका — 'sovereignty and integrity of India' समाविष्ट)."}, {"section": 6, "subtopic": "कलम 21 जगण्याचा हक्क विस्तार", "qtype": "जोड्या लावा", "q_marathi": "कलम 21 च्या न्यायालयीन विस्तारासंदर्भात खालील जोड्या लावा:\nA. मेनका गांधी विरुद्ध भारत सरकार (1978)\nB. हुसेनआरा खातून विरुद्ध बिहार राज्य (1979)\nC. फ्रान्सिस कोराली मुल्लीन विरुद्ध दिल्ली प्रशासन (1981)\nD. ओल्गा टेलिस विरुद्ध मुंबई महानगरपालिका (1985)\n1. मानवी प्रतिष्ठेसह जगण्याचा हक्क\n2. उपजीविकेचा (livelihood) हक्क हा कलम 21 चाच भाग\n3. 'कायद्याने प्रस्थापित कार्यपद्धती' ही न्याय्य, रास्त व वाजवी असली पाहिजे\n4. जलद खटला व मोफत कायदेशीर सहाय्याचा हक्क", "q_english": "Match the following cases concerning the judicial expansion of Article 21:\nA. Maneka Gandhi v. Union of India (1978)\nB. Hussainara Khatoon v. State of Bihar (1979)\nC. Francis Coralie Mullin v. Administrator, Delhi (1981)\nD. Olga Tellis v. Bombay Municipal Corporation (1985)\n1. Right to live with human dignity\n2. Right to livelihood as part of Article 21\n3. 'Procedure established by law' must be just, fair and reasonable\n4. Right to speedy trial and free legal aid", "options": ["A-3, B-1, C-4, D-2", "A-3, B-4, C-1, D-2", "A-4, B-3, C-1, D-2", "A-3, B-4, C-2, D-1"], "correct_index": 1, "explanation_marathi": "मेनका गांधी (1978) ने कार्यपद्धती न्याय्य-रास्त-वाजवी असण्याची कसोटी दिली (A-3); हुसेनआरा खातूनमध्ये जलद खटला व मोफत कायदेशीर मदत मान्य झाली (B-4); फ्रान्सिस कोरालीत मानवी प्रतिष्ठेचा हक्क (C-1); तर ओल्गा टेलिसमध्ये उपजीविकेचा हक्क कलम 21 मध्ये सामाविष्ट झाला (D-2). इतर पर्यायांत B-C किंवा C-D च्या जोड्या अदलाबदल केल्या असल्याने ते बाद होतात.", "evidence": "Maneka Gandhi v. Union of India, AIR 1978 SC 597; Hussainara Khatoon v. State of Bihar, AIR 1979 SC 1369; Francis Coralie Mullin v. UT of Delhi, AIR 1981 SC 746; Olga Tellis v. BMC, AIR 1986 SC 180."}, {"section": 6, "subtopic": "कॅबिनेट मिशन 1946", "qtype": "कालक्रम लावा", "q_marathi": "योग्य कालक्रम लावा: A) कॅबिनेट मिशनचे भारतात आगमन (24 मार्च 1946), B) मिशन योजना जाहीर (16 मे 1946), C) संविधान सभा निवडणुका (जुलै 1946), D) अंतरिम सरकार स्थापना (2 सप्टेंबर 1946)", "q_english": "Arrange chronologically: A) Cabinet Mission arrival (24 Mar 1946), B) Mission Plan (16 May 1946), C) Constituent Assembly elections (July 1946), D) Interim Government (2 Sep 1946)", "options": ["A-B-C-D", "B-A-C-D", "A-C-B-D", "A-B-D-C"], "correct_index": 0, "explanation_marathi": "बरोबर A-B-C-D आहे; आधी आगमन, मग योजना, मग निवडणुका, मग सरकार स्थापन झाले.\nइतर पर्याय क्रम चुकवतात; B आधी येऊ शकत नाही आणि D सर्वात शेवटीच येतो.", "evidence": "Cabinet Mission Statement 16 May 1946; Constituent Assembly Debates Vol-I; Interim Govt notification 2 Sep 1946"}, {"section": 6, "subtopic": "नागरिकत्व CAA", "qtype": "कारण-परिणाम", "q_marathi": "कारण (R): पाकिस्तान, बांगलादेश, अफगाणिस्तानातील धार्मिक छळग्रस्त अल्पसंख्याक. परिणाम (E): CAA 2019 नुसार 31 डिसें. 2014 पूर्वी आलेल्या 6 समुदायांना (हिंदू, शीख, बौद्ध, जैन, पारशी, ख्रिश्चन) जलद नागरिकत्व. योग्य संबंध कोणता?", "q_english": "Reason (R): Religious persecution of minorities in Pakistan, Bangladesh, Afghanistan. Effect (E): CAA 2019 fast-track citizenship to 6 communities arrived before 31 Dec 2014. Correct R-E relation?", "options": ["R व E बरोबर, R हेच E चे कारण आहे", "R व E बरोबर, पण R हे E चे कारण नाही", "R बरोबर, E चूक; मुस्लिमांचाही समावेश आहे", "R चूक, E बरोबर; केवळ 2 देशांचा समावेश आहे"], "correct_index": 0, "explanation_marathi": "R व E दोन्ही बरोबर असून CAA चा हेतूच छळग्रस्त 6 समुदायांना सवलत देणे आहे.\nइतर पर्याय समुदायांची यादी, कट-ऑफ तारीख किंवा कारण-परिणाम संबंध चुकवतात.", "evidence": "Citizenship (Amendment) Act 2019, Gazette of India Sec.2; MHA notification 2019"}, {"section": 6, "subtopic": "पंतप्रधान vs मुख्यमंत्री अधिकार", "qtype": "कारण-परिणाम", "q_marathi": "कारण (R): कलम 75(2) नुसार पंतप्रधान राष्ट्रपतींच्या मर्जीपर्यंत आणि कलम 164(1) नुसार मुख्यमंत्री राज्यपालांच्या मर्जीपर्यंत पदावर राहतात.\\nपरिणाम (E): म्हणून राष्ट्रपती पंतप्रधानांना आणि राज्यपाल मुख्यमंत्र्यांना लोकसभेत/विधानसभेत बहुमत असतानाही स्वेच्छेने बडतर्फ करू शकतात.\\nकारण-परिणाम संबंध ओळखा.", "q_english": "Reason (R): Under Art.75(2) the PM holds office during the pleasure of the President and under Art.164(1) the CM during the pleasure of the Governor.\\nEffect (E): Therefore the President/Governor can dismiss the PM/CM at will even while they enjoy majority in Lok Sabha/Assembly.\\nIdentify the cause-effect relationship.", "options": ["R आणि E दोन्ही सत्य, आणि E हे R चे योग्य परिणाम आहे", "R आणि E दोन्ही सत्य, पण E हे R चे योग्य परिणाम नाही", "R सत्य, E असत्य; मर्जी ही सामूहिक जबाबदारी/बहुमताच्या अटीने मर्यादित आहे", "R असत्य, E सत्य"], "correct_index": 2, "explanation_marathi": "R पाठ्यतः सत्य आहे, पण E असत्य आहे; Samsher Singh निकालानुसार मर्जीचा वापर बहुमत/सामूहिक जबाबदारी (कलम 75(3), 164(2)) विरुद्ध करता येत नाही. त्यामुळे दोन्ही सत्य मानणारे पर्याय 1, 2 आणि R असत्य मानणारा पर्याय 4 बाद होतात.", "evidence": "Articles 75(2), 75(3), 164(1), 164(2); SC in Samsher Singh v. State of Punjab (1974)"}, {"section": 6, "subtopic": "भाषा: 343-351 तरतुदी", "qtype": "दोन संकल्पना एकत्र", "q_marathi": "कलम 343 (संघराज्याची अधिकृत भाषा) व कलम 348 (न्यायालये व कायद्यांची भाषा) या दोन संकल्पना एकत्रितपणे विचारात घ्या. खालीलपैकी कोणते विधान दोन्ही तरतुदी अचूकपणे मांडते?", "q_english": "Consider together the two concepts — Article 343 (official language of the Union) and Article 348 (language of courts and laws). Which of the following statements correctly states both provisions?", "options": ["कलम 348 नुसार संसदेने कायदा करेपर्यंत सर्वोच्च न्यायालय व उच्च न्यायालयांची भाषा इंग्रजीच राहील; कलम 343 नुसार देवनागरी लिपीतील हिंदी ही संघराज्याची अधिकृत भाषा असून अंकांसाठी आंतरराष्ट्रीय रूप वापरले जाईल. / Under Art. 348 the language of the Supreme Court and High Courts remains English until Parliament provides otherwise; under Art. 343 the Union's official language is Hindi in Devanagari script with the international form of numerals.", "कलम 343 नुसार हिंदी ही भारताची राष्ट्रभाषा म्हणून घोषित केली असून 15 वर्षांत इंग्रजीचा वापर पूर्णपणे बंद होईल; कलम 348 नुसार राज्य विधिमंडळांच्या कायद्यांची अधिकृत पाठ्ये हिंदीतच असतील. / Under Art. 343 Hindi is declared India's national language and English use ends completely after 15 years; under Art. 348 authoritative texts of State legislatures' laws must be in Hindi.", "कलम 343 नुसार देवनागरी लिपीतील हिंदी ही संघराज्याची अधिकृत भाषा आहे; कलम 348 नुसार मात्र राज्यपालांच्या अध्यादेशांची अधिकृत पाठ्ये संसदेने अन्यथा ठरवेपर्यंत हिंदीत असतील. / Under Art. 343 the Union's official language is Hindi in Devanagari script; under Art. 348 authoritative texts of Governors' ordinances remain in Hindi until Parliament provides otherwise.", "कलम 343 नुसार इंग्रजी ही संघराज्याची अधिकृत भाषा असून हिंदी ही केवळ सहायक भाषा आहे; कलम 348 नुसार सर्वोच्च न्यायालय संसदेच्या परवानगीशिवाय हिंदीत कामकाज करू शकते. / Under Art. 343 English is the Union's official language with Hindi as merely subsidiary; under Art. 348 the Supreme Court may function in Hindi without Parliament's sanction."], "correct_index": 0, "explanation_marathi": "पर्याय (a) दोन्ही तरतुदी बरोबर मांडतो: 343(1) मध्ये देवनागरी-हिंदी + आंतरराष्ट्रीय अंकरूप, आणि 348(1) नुसार संसदेने अन्यथा ठरवेपर्यंत न्यायालयांची भाषा व प्राधिकृत पाठ्ये इंग्रजीतच राहतात. (b) चूक: संविधानात 'राष्ट्रभाषा' असा उल्लेख नाही आणि इंग्रजी आपोआप बंद झाली नाही (राजभाषा कायदा, 1963). (c) चूक: 348(1)(b) नुसार अध्यादेशांची प्राधिकृत पाठ्ये इंग्रजीत असतात. (d) चूक: 343 व 348 ची परस्पर अदलाबदल केली आहे.", "evidence": "भारतीय संविधान, कलम 343(1) (देवनागरी लिपीतील हिंदी; आंतरराष्ट्रीय अंकरूप), कलम 348(1); Official Languages Act, 1963 (15 वर्षांनंतरही इंग्रजीचा वापर चालू)."}, {"section": 6, "subtopic": "मतदान 61वी", "qtype": "बहु-विधान", "q_marathi": "61वी घटनादुरुस्ती (1989) विधाने: 1) कलम 326 दुरुस्त करून वय 21 वरून 18 केले. 2) 1989 मध्ये अंमलात आली. 3) लोकसभा व विधानसभा निवडणुकांना लागू. 4) राष्ट्रपती निवडणुकीचे मतदान वय 18 केले. योग्य पर्याय?", "q_english": "61st Amendment (1989) statements: 1) Art 326 age 21 to 18. 2) Enforced 1989. 3) Applies to Lok Sabha & Assemblies. 4) Made voting age 18 for Presidential election. Correct option?", "options": ["1, 2, 3 बरोबर; 4 चूक", "1, 3, 4 बरोबर; 2 चूक", "1, 2, 4 बरोबर; 3 चूक", "सर्व बरोबर"], "correct_index": 0, "explanation_marathi": "1,2,3 बरोबर; 61वीने फक्त कलम 326 (लोकसभा-विधानसभा प्रत्यक्ष निवडणूक) बदलले.\n4 चूक; राष्ट्रपती अप्रत्यक्ष निवडणूक आहे, त्याला 18 वर्षे लागू नाही, त्यामुळे इतर पर्याय चूक.", "evidence": "C
