<script type="application/json" id="quiz-data">
[{"section": 3, "subtopic": "QS World University Rankings 2026 भारतीय कामगिरी", "qtype": "bahu-vidhan", "q_marathi": "QS वर्ल्ड युनिव्हर्सिटी रॅकिंग्ज 2026 (जून 2025 मध्ये प्रसिद्ध) संदर्भात खालील विधाने विचारात घ्या : I. IIT दिल्लीने 123वा क्रमांक मिळवून भारतातील सर्वोच्च स्थान पटकावले — हे त्यांचे आतापर्यंतचे सर्वोत्तम प्रदर्शन आहे. II. IIT मुबईने 150व्या क्रमांकावरून 123व्या क्रमांकावर झेप घेतली. III. या आवृत्तीत 54 भारतीय उच्च शिक्षण संस्था समाविष्ट झाल्या, जी 2025 मधील 46 पेक्षा अधिक आहे. वरीलपैकी कोणती विधाने सत्य आहेत?", "q_english": "Consider the following statements about QS World University Rankings 2026 (released June 2025): I. IIT Delhi secured 123rd rank, India's highest — its best-ever performance. II. IIT Bombay jumped from 150th to 123rd rank. III. 54 Indian HEIs featured in this edition, up from 46 in 2025. Which statements are correct?", "options": ["फक्त I आणि II", "फक्त II आणि III", "फक्त I आणि III", "I, II आणि III"], "correct_index": 2, "explanation_marathi": "I सत्य — IIT दिल्ली 123 (2025 मध्ये 150) हे भारतातील सर्वोच्च व आतापर्यंतचे सर्वोत्तम. III सत्य — 54 संस्था (2025 मध्ये 46). II असत्य — 150वा क्रमांक IIT दिल्लीचा (2025) होता; IIT मुबई 118 वरून 129 वर घसरली.", "evidence": "QS World University Rankings 2026 (Quacquarelli Symonds), June 2025"}, {"section": 3, "subtopic": "National Space Day 2024 (23 ऑगस्ट)", "qtype": "jodya-lava", "q_marathi": "जोड्या लावा — अ. पहिला राष्ट्रीय अंतराळ दिन साजरा — 1. 23 ऑगस्ट 2024; ब. 2024 ची थीम — 2. 'Touching Lives while Touching the Moon: India's Space Saga'; क. दिनांक निवडीचे कारण — 3. चांद्रयान-3 च्या विक्रम लॅडरचे 23 ऑगस्ट 2023 रोजी चंद्रावर यशस्वी अवतरण; ड. 23 ऑगस्ट हा दिन म्हणून घोषणा — 4. पंतप्रधानांनी 26 ऑगस्ट 2023 रोजी ISRO शास्त्रज्ञांच्या भेटीत.", "q_english": "Match the following — A. First National Space Day observed — 1. 23 August 2024; B. Theme of 2024 — 2. 'Touching Lives while Touching the Moon: India's Space Saga'; C. Reason for choosing the date — 3. Successful landing of Chandrayaan-3's Vikram lander on the Moon on 23 August 2023; D. Declaration of 23 August as the Day — 4. By the Prime Minister on 26 August 2023 during his visit to ISRO scientists.", "options": ["अ-1, ब-2, क-3, ड-4", "अ-2, ब-1, क-4, ड-3", "अ-1, ब-3, क-2, ड-4", "अ-4, ब-2, क-1, ड-3"], "correct_index": 0, "explanation_marathi": "सर्व जोड्या बरोबर — पहिला अंतराळ दिन 2024 मध्येच; थीम हूबेहूब.", "evidence": "ISRO / Press Information Bureau, August 2024"}, {"section": 3, "subtopic": "e-Shram One-Stop Solution व नोंदणी 2024-25", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): जानेवारी 2025 पर्यंत e-Shram पोर्टलवर 30 कोटींहून अधिक असंघटित कामगारांची नोंदणी झाली होती. कारण (R): ऑक्टोबर 2024 मध्ये केंद्रीय कामगार मंत्री मनसुख मांडविया यांनी 12 कल्याणकारी योजनांचे एकत्रीकरण करून 'e-Shram – One Stop Solution' सुरू केले.", "q_english": "Assertion (A): By January 2025, over 30 crore unorganised workers were registered on the e-Shram portal. Reason (R): In October 2024, Union Labour Minister Mansukh Mandaviya launched 'e-Shram – One Stop Solution' integrating 12 welfare schemes.", "options": ["अ) A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे", "ब) A आणि R दोन्ही सत्य आहेत पण R हे A चे योग्य स्पष्टीकरण नाही", "क) A सत्य आहे पण R असत्य आहे", "ड) A असत्य आहे पण R सत्य आहे"], "correct_index": 1, "explanation_marathi": "A सत्य — 30.68 कोटी, R सत्य — One Stop Solution ऑक्टो. 2024. मात्र R हे A च्या संख्येचे स्पष्टीकरण नाही.", "evidence": "Ministry of Labour & Employment / PIB, October 2024 and January 2025"}, {"section": 3, "subtopic": "Republic Day 2025 chief guest क्रम (2023-2025)", "qtype": "kalkram-lava", "q_marathi": "प्रजासत्ताक दिनाच्या प्रमुख पाहुण्यांचा योग्य कालक्रम लावा : 1. इमॅन्युएल मॅक्रॉन (फ्रान्स), 2. प्रबोवो सुबियांतो (इंडोनेशिया), 3. अब्देल फताह अल-सिसी (इजिप्त), 4. जायर बोल्सोनारो (ब्राझील).", "q_english": "Arrange the Republic Day chief guests in correct chronological order: 1. Emmanuel Macron (France), 2. Prabowo Subianto (Indonesia), 3. Abdel Fattah el-Sisi (Egypt), 4. Jair Bolsonaro (Brazil).", "options": ["3-4-1-2", "4-1-3-2", "1-3-2-4", "4-3-1-2"], "correct_index": 3, "explanation_marathi": "योग्य क्रम : बोल्सोनारो (2020) → अल-सिसी (2023) → मॅक्रॉन (2024) → प्रबोवो (2025).", "evidence": "Ministry of External Affairs / Republic Day records, January 2025"}, {"section": 3, "subtopic": "Fit India Sundays on Cycle 2024-25", "qtype": "karan-parinam", "q_marathi": "विधान A (कारण) : पंतप्रधान नरेंद्र मोदी यांनी 'मन की बात' (फेब्रुवारी 2025) मध्ये लठ्ठपणाशी लढण्यासाठी दरमहा खाद्यतेल वापर 10% कमी करण्याचे आवाहन केले. विधान B (परिणाम) : केंद्रीय क्रीडा मंत्री मनसुख मांडविया यांनी डिसेंबर 2024 मध्ये 'Fit India Sundays on Cycle' मोहीम सुरू केली, जी 5000+हून अधिक ठिकाणी सायकलिंग कार्यक्रम घेते. A आणि B यांतील कारण-परिणाम संबंधाबाबत योग्य पर्याय निवडा.", "q_english": "Statement A (Cause): In 'Mann Ki Baat' (February 2025), PM Narendra Modi urged people to cut monthly edible-oil consumption by 10% to fight obesity. Statement B (Effect): Union Sports Minister Mansukh Mandaviya launched the 'Fit India Sundays on Cycle' campaign in December 2024, held across 5000+ locations. Choose the correct cause-effect relationship between A and B.", "options": ["A हे B चे कारण आहे आणि संबंध बरोबर आहे", "B हे A चे कारण आहे आणि संबंध बरोबर आहे", "A आणि B दोन्ही सत्य पण A हे B चे कारण नाही (कालक्रम विसंगत)", "A असत्य आहे आणि B सत्य आहे"], "correct_index": 2, "explanation_marathi": "दोन्ही सत्य, मात्र B डिसें. 2024 A फेब्रु. 2025 नंतर — कालक्रम विसंगत, कारण नाही.", "evidence": "Ministry of Youth Affairs & Sports, December 2024; PM Mann Ki Baat, February 2025"}, {"section": 3, "subtopic": "National Education Day व मौलाना आझाद", "qtype": "don-sankalpana-ekatra", "q_marathi": "राष्ट्रीय शिक्षण दिन व मौलाना अबुल कलाम आझाद या दोन संकल्पनांबाबत विधाने : I. राष्ट्रीय शिक्षण दिन दरवर्षी 11 नोव्हेंबर रोजी मौलाना आझाद यांच्या जयंतीनिमित्त साजरा केला जातो. II. मौलाना आझाद हे स्वतंत्र भारताचे पहिले शिक्षणमंत्री (1947-58) होते. III. राष्ट्रीय शिक्षण दिन 2008 पासून साजरा केला जातो; आझाद यांना 1992 मध्ये मरणोत्तर भारतरत्न मिळाले. कोणती विधाने सत्य?", "q_english": "On the two concepts — National Education Day and Maulana Abul Kalam Azad: I. National Education Day is observed every year on 11 November, Azad's birth anniversary. II. Maulana Azad was independent India's first Education Minister (1947-58). III. National Education Day has been observed since 2008; Azad received the Bharat Ratna posthumously in 1992. Which statements are correct?", "options": ["I, II आणि III", "फक्त I आणि II", "फक्त II आणि III", "फक्त I आणि III"], "correct_index": 0, "explanation_marathi": "तिन्ही सत्य — 11 नोव्हेंबर आझाद जयंती, 1947-58 पहिले शिक्षणमंत्री, 2008 पासून दिन, भारतरत्न 1992.", "evidence": "Ministry of Education, November 2024"}, {"section": 3, "subtopic": "RBI Digital Payments Index 2024", "qtype": "takta-aadharit", "q_marathi": "RBI डिजिटल पेमेंट्स निर्देशांक (बेस : मार्च 2018 = 100) : मार्च 2022 — 349.30; मार्च 2023 — 395.57; मार्च 2024 — 445.50; सप्टेंबर 2024 — 465.33. वरील तक्त्यावरून कोणता निष्कर्ष तर्कसंगत आहे?", "q_english": "RBI Digital Payments Index (Base: March 2018 = 100): March 2022 — 349.30; March 2023 — 395.57; March 2024 — 445.50; September 2024 — 465.33. Which conclusion from the table is logical?", "options": ["सप्टेंबर 2024 चा निर्देशांक मार्च 2024 पेक्षा कमी आहे", "मार्च 2022 ते मार्च 2023 या वर्षातील वाढ मार्च 2023 ते मार्च 2024 पेक्षा जास्त होती", "बेस वर्षाच्या तुलनेत सप्टेंबर 2024 पर्यंत निर्देशांक तिप्पटही झाला नाही", "मार्च 2022 (349.30) ते सप्टेंबर 2024 (465.33) दरम्यान निर्देशांक सुमारे 33% वाढला"], "correct_index": 3, "explanation_marathi": "(465.33−349.30)/349.30 ≈ 33.2% वाढ सत्य.", "evidence": "Reserve Bank of India – Digital Payments Index, January 2025"}, {"section": 3, "subtopic": "Pravasi Bharatiya Divas 2025 भुवनेश्वर (नकाशा)", "qtype": "nakasha-aadharit", "q_marathi": "18व्या प्रवासी भारतीय दिवस (8-10 जानेवारी 2025) च्या स्थळाचा नकाशा विचारात घ्या — स्थळ : जनता मैदान, भुवनेश्वर (ओडिशा). खालीलपैकी कोणते विधान नकाशानुसार सत्य आहे?", "q_english": "Consider the map of the venue of the 18th Pravasi Bharatiya Divas (8–10 January 2025) — Janata Maidan, Bhubaneswar (Odisha). Which statement is correct as per the map?", "options": ["भुवनेश्वर हे ओडिशाच्या उत्तरेकडील सीमेवर, झारखंडलगत आहे", "ओडिशा बंगालच्या उपसागराला लागून पूर्व किनाऱ्यावर आहे; त्याच्या उत्तरेस पश्चिम बंगाल व झारखंड, पश्चिमेस छत्तीसगड, दक्षिणेस आंध्र प्रदेश आहे", "भुवनेश्वर हे महानदीच्या त्रिभुज प्रदेशाच्या दक्षिणेस तमिळनाडू सीमेजवळ आहे", "ओडिशा हा भू-परिवेष्टित राज्य असून त्याला समुद्रकिनारा नाही"], "correct_index": 1, "explanation_marathi": "ओडिशा पूर्व किनाऱ्यावर, शेजारी प. बंगाल झारखंड छत्तीसगड आंध्र प्रदेश.", "evidence": "Ministry of External Affairs – 18th Pravasi Bharatiya Divas, Bhubaneswar, January 2025"}, {"section": 3, "subtopic": "Banu Mushtaq International Booker Prize 2025", "qtype": "bahu-vidhan", "q_marathi": "2025 च्या आंतरराष्ट्रीय बुकर पुरस्काराबाबत विधाने : I. बानु मुश्ताक यांच्या 'Heart Lamp' कथासंग्रहाला हा पुरस्कार मिळाला. II. बुकर जिंकणारा हा पहिला कन्नड ग्रंथ आणि पहिला कथासंग्रह ठरला. III. दीपा भास्थी यांच्या इंग्रजी अनुवादासाठी मे 2025 मध्ये टेट मॉडर्न, लंदन येथे पुरस्कार जाहीर झाला. कोणती विधाने सत्य?", "q_english": "Statements on the 2025 International Booker Prize: I. Banu Mushtaq's 'Heart Lamp' story collection won the prize. II. It is the first Kannada work and the first short-story collection to win the Booker. III. The prize was announced in May 2025 at Tate Modern, London, for Deepa Bhasthi's English translation. Which statements are correct?", "options": ["फक्त I आणि II", "फक्त II आणि III", "I, II आणि III", "फक्त I आणि III"], "correct_index": 2, "explanation_marathi": "तिन्ही सत्य — Heart Lamp कन्नड, पहिला कन्नड + कथासंग्रह विजेता, मे 2025 टेट मॉडर्न.", "evidence": "The Booker Prizes, May 2025"}, {"section": 3, "subtopic": "Gyan Bharatam Mission 2025 (हस्तलिखिते)", "qtype": "jodya-lava", "q_marathi": "जोड्या लावा — अ. 'ज्ञान भारतम् मिशन'ची घोषणा — 1. केंद्रीय अर्थसंकल्प 2025-26; ब. मिशनचे पूर्वीचे नाव/आधार — 2. नॅशनल मिशन फॉर मॅन्युस्क्रिप्ट्स (2003); क. लक्ष्य — 3. 1 कोटींहून अधिक हस्तलिखितांचे सर्वेक्षण, दस्ताऐवजीकरण व डिजिटायझेशन; ड. नोडल मंत्रालय — 4. सांस्कृतिक मंत्रालय.", "q_english": "Match the following — A. Announcement of 'Gyan Bharatam Mission' — 1. Union Budget 2025-26; B. Mission's earlier name/base — 2. National Mission for Manuscripts (2003); C. Objective — 3. Survey, documentation and digitisation of 1 crore+ manuscripts; D. Nodal ministry — 4. Ministry of Culture.", "options": ["अ-2, ब-1, क-4, ड-3", "अ-1, ब-2, क-3, ड-4", "अ-1, ब-3, क-2, ड-4", "अ-4, ब-2, क-1, ड-3"], "correct_index": 1, "explanation_marathi": "सर्व जोड्या बरोबर — 2025-26 घोषणा, 2003 मिशन आधार, 1 कोटी+ लक्ष्य, सांस्कृतिक मंत्रालय.", "evidence": "Union Budget 2025-26 / Ministry of Culture, February 2025"}, {"section": 3, "subtopic": "AIKosh IndiaAI Datasets Platform 2025", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): मार्च 2025 मध्ये 'AIKosh – IndiaAI Datasets Platform' सुरू करण्यात आले, जे IndiaAI मिशनचा (मार्च 2024 मध्ये ₹10,371.92 कोटी तरतुदीसह मंजूर) भाग आहे. कारण (R): AIKosh संशोधक व स्टार्टअप्सना 300+ ओपन डेटासेट्स व AI मॉडेल्स एकाच व्यासपीठावर उपलब्ध करून देते, ज्यामुळे भारतीय भाषांतील व क्षेत्रनिहाय AI विकासाला चालना मिळते.", "q_english": "Assertion (A): In March 2025, 'AIKosh – IndiaAI Datasets Platform' was launched as part of the IndiaAI Mission (approved March 2024 with an outlay of ₹10,371.92 crore). Reason (R): AIKosh gives researchers and startups 300+ open datasets and AI models on a single platform, boosting AI development in Indian languages and domain areas.", "options": ["अ) A आणि R दोन्ही सत्य आहेत आणि R हे A चे योग्य स्पष्टीकरण आहे", "ब) A आणि R दोन्ही सत्य आहेत पण R हे A चे योग्य स्पष्टीकरण नाही", "क) A सत्य आहे पण R असत्य आहे", "ड) A असत्य आहे पण R सत्य आहे"], "correct_index": 0, "explanation_marathi": "दोन्ही सत्य R हे उद्दिष्ट स्पष्टीकरण.", "evidence": "Ministry of Electronics & IT / IndiaAI Mission, March 2025"}, {"section": 3, "subtopic": "Viksit Bharat Young Leaders Dialogue 2025", "qtype": "kalkram-lava", "q_marathi": "योग्य कालक्रम लावा : 1. मेरा युवा भारत पोर्टलवर राष्ट्रीय युवा नेते क्विझ (निवड प्रक्रिया); 2. विकसित भारत यंग लीडर्स डायलॉग, भारत मंडपम (10-12 जानेवारी 2025); 3. पंतप्रधानांशी संवाद (12 जानेवारी, राष्ट्रीय युवा दिन); 4. राष्ट्रीय युवा महोत्सवाचे 'डायलॉग' स्वरुपात पुनर्रचना जाहीर.", "q_english": "Arrange in correct chronological order: 1. National Youth Leaders Quiz on the Mera Yuva Bharat portal (selection process); 2. Viksit Bharat Young Leaders Dialogue, Bharat Mandapam (10–12 January 2025); 3. Interaction with the Prime Minister (12 January, National Youth Day); 4. Announcement of the reimagined National Youth Festival as a 'Dialogue'.", "options": ["1-2-3-4", "2-4-1-3", "4-2-1-3", "4-1-2-3"], "correct_index": 3, "explanation_marathi": "4 जाहीर, 1 क्विझ निवड, 2 डायलॉग, 3 पंतप्रधान संवाद.", "evidence": "Ministry of Youth Affairs & Sports / PIB, January 2025"}, {"section": 3, "subtopic": "Global Hunger Index 2024 भारत", "qtype": "karan-parinam", "q_marathi": "कारण (A): ग्लोबल हंगर इंडेक्स 2024 मध्ये भारताचा स्कोअर 27.3 ('गंभीर/serious' श्रेणी) असून बालकांमधील वायफळपणा (child wasting) 18.7% — जागतिक स्तरावर सर्वाधिक — नोंदवला गेला. परिणाम (B): 127 देशांमध्ये भारत 105व्या क्रमांकावर राहिला. योग्य संबंध निवडा.", "q_english": "Cause (A): In the Global Hunger Index 2024, India scored 27.3 ('serious' category) with child wasting at 18.7% — the highest in the world. Effect (B): India ranked 105th among 127 countries. Choose the correct relationship.", "options": ["A सत्य, B असत्य — भारत 111व्या क्रमांकावर होता", "A आणि B दोन्ही सत्य आणि A मधील कुपोषण निर्देशक B मधील क्रमांकाचे स्पष्टीकरण देतात", "A असत्य, B सत्य — स्कोअर 28.7 होता", "A आणि B दोन्ही सत्य पण त्यांचा परस्परांशी संबंध नाही"], "correct_index": 1, "explanation_marathi": "105/127 2024, 2023 111, स्कोअर 27.3 serious, wasting 18.7% सर्वाधिक.", "evidence": "Global Hunger Index 2024 (Concern Worldwide & Welthungerhilfe), October 2024"}, {"section": 3, "subtopic": "Henley Passport Index 2025 भारत", "qtype": "don-sankalpana-ekatra", "q_marathi": "हेनले पासपोर्ट इंडेक्स व मोबिलिटी स्कोअर या दोन संकल्पनांबाबत विधाने : I. हेनले पासपोर्ट इंडेक्स (जानेवारी 2025) मध्ये भारत 80व्या क्रमांकावर होता; सिंगापूर प्रथम. II. भारतीय पासपोर्टधारकांना ~56-57 देशांमध्ये व्हिसा-मुक्त/व्हिसा-ऑन-अरायव्हल प्रवेश होता. III. हा निर्देशांक IATA च्या डेटावर आधारित असून 'मोबिलिटी स्कोअर' म्हणजे व्हिसा-मुक्त प्रवेश असलेल्या देशांची संख्या होय. कोणती विधाने सत्य?", "q_english": "On the two concepts — Henley Passport Index and Mobility Score: I. In the Henley Passport Index (January 2025), India ranked 80th; Singapore was first. II. Indian passport holders had visa-free/visa-on-arrival access to ~56–57 countries. III. The index is based on IATA data, and the 'mobility score' is the count of visa-free destinations. Which statements are correct?", "options": ["फक्त I आणि II", "फक्त I आणि III", "I, II आणि III", "फक्त II आणि III"], "correct_index": 2, "explanation_marathi": "तिन्ही सत्य — जाने. 2025 80वा 56 गंतव्ये, सिंगापूर अव्वल, IATA आधार.", "evidence": "Henley Passport Index (Henley & Partners, IATA data), January 2025"}, {"section": 3, "subtopic": "World Press Freedom Index 2025 भारत", "qtype": "takta-aadharit", "q_marathi": "RSF जागतिक पत्रकारिता स्वातंत्र्य निर्देशांक — भारत : 2023 — 161/180; 2024 — 159/180; 2025 — 151/180. 2025 मध्ये नॉर्वे प्रथम. तक्त्यावरून कोणता निष्कर्ष योग्य?", "q_english": "RSF World Press Freedom Index — India: 2023 — 161/180; 2024 — 159/180; 2025 — 151/180. Norway was first in 2025. Which conclusion from the table is correct?", "options": ["2023 ते 2025 दरम्यान भारताच्या क्रमांकात सलग सुधारणा झाली (161→159→151)", "2025 मध्ये भारत 'समाधानकारक' श्रेणीतील पहिल्या 100 देशांत होता", "2024 ते 2025 मध्ये भारताचा क्रमांक 10 ने घसरला", "2025 मध्ये भारत आशियात प्रथम क्रमांकावर होता"], "correct_index": 0, "explanation_marathi": "161→159→151 सलग सुधारणा.", "evidence": "Reporters Without Borders (RSF) World Press Freedom Index, May 2025"}, {"section": 4, "subtopic": "Sangam literature: Ettutogai-Pattuppattu anthologies vs Tolkappiyam grammar and tinai poetics", "qtype": "bahu-vidhan", "q_marathi": "संगम साहित्याबाबत खालील विधाने विचारात घ्या : (I) तोल्काप्पियम हे तोल्काप्पियार रचित सर्वात प्राचीन उपलब्ध तमिळ व्याकरण असून त्यातील 'पोरुलअधिकारम' मध्ये तिनै (भूप्रदेशाधारित काव्यप्रकार) सिद्धान्त मांडला आहे. (II) एट्टुथोगै (एट्टुत्तोकै) मध्ये कुरुन्थोकैसह आठ संकलने आहेत. (III) पट्टुप्पाट्टूमध्ये तिरुमुरुगाट्रुप्पडैसह दहा दीर्घ कविता आहेत. (IV) संगम साहित्याची निर्मिती कावेरीपट्टिनम येथे चोल आश्रयाखाली झाली. कोणती विधाने बरोबर आहेत?", "q_english": "Consider the following statements on Sangam literature: (I) Tolkappiyam, attributed to Tolkappiyar, is the earliest extant Tamil grammar and its 'Poruladikaram' expounds the tinai (landscape-based poetic) theory. (II) Ettutogai comprises eight anthologies including Kuruntokai. (III) Pattuppattu consists of ten long poems including Tirumurugatruppadai. (IV) Sangam literature was composed at Kaveripattinam under Chola patronage. Which statements are correct?", "options": ["केवळ I आणि II", "केवळ II आणि IV", "केवळ I, II आणि III", "I, II, III आणि IV"], "correct_index": 2, "explanation_marathi": "I,II,III बरोबर, IV चूक मधुरै पांड्य आश्रय.", "evidence": "Tamil University Thanjavur critical edition of Sangam anthologies, 1985; K.A. Nilakanta Sastri, A History of South India, 1955"}, {"section": 4, "subtopic": "Satavahana: Gautamiputra Satakarni Nasik prashasti vs Nahapana Kshaharata conflict", "qtype": "jodya-lava", "q_marathi": "जोड्या लावा : (A) गौतमीपुत्र सातकर्णी (B) वशिष्ठीपुत्र पुलुमावी (C) यज्ञश्री सातकर्णी (D) नहपान — (1) गौतमी बलश्रीची नाशिक प्रशस्ती (2) आंध्र प्रदेशात सातवाहन विस्तार (3) जहाज-चिन्हांकित नाणी (4) गौतमीपुत्राने पराभूत केलेला क्षहरात क्षत्रप", "q_english": "Match the pairs: (A) Gautamiputra Satakarni (B) Vasishthiputra Pulumavi (C) Yajna Sri Satakarni (D) Nahapana — (1) Nasik prashasti by Gautami Balashri (2) Satavahana expansion into Andhra region (3) Coins with ship motif (4) Kshaharata Kshatrapa defeated by Gautamiputra", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-4, D-3", "A-4, B-3, C-1, D-2", "A-3, B-4, C-2, D-1"], "correct_index": 0, "explanation_marathi": "A-1 नाशिक प्रशस्ती, B-2 आंध्र विस्तार, C-3 जहाज नाणी, D-4 नहपान पराभव.", "evidence": "Epigraphia Indica Vol. 8 (Nasik cave inscriptions of Gautami Balashri); V.V. Mirashi, Satavahana numismatic studies, 1981"}, {"section": 4, "subtopic": "Gupta administration: bhukti-vishaya-grama adhikaranas and Allahabad pillar digvijaya", "qtype": "kalkram-lava", "q_marathi": "गुप्त प्रशासनाच्या उत्क्रांतीचा अचूक कालक्रम लावा : (A) चंद्रगुप्त प्रथमकडून 'महाराजाधिराज' उपाधी धारण (B) हरिषेणकृत अलाहाबाद स्तंभ प्रशस्तीतील समुद्रगुप्त दिग्विजय (C) चंद्रगुप्त द्वितीयची उज्जैन दुसरी राजधानी व नवरत्ने (D) कुमारगुप्त प्रथमकडून नालंदा महाविहार स्थापना", "q_english": "Arrange in correct chronological order the evolution of Gupta administration: (A) Chandragupta I assuming the title 'Maharajadhiraja' (B) Samudragupta's digvijaya in the Allahabad pillar prashasti by Harisena (C) Chandragupta II's second capital at Ujjain and the Navaratnas (D) Kumaragupta I founding Nalanda mahavihara", "options": ["A-B-D-C", "B-A-C-D", "A-C-B-D", "A-B-C-D"], "correct_index": 3, "explanation_marathi": "A 319-320 → B 335-375 → C 375-415 → D 415-455.", "evidence": "Corpus Inscriptionum Indicarum Vol. 3, J.F. Fleet (Allahabad pillar), 1888; R.C. Majumdar, The Gupta Empire, 1954"}, {"section": 4, "subtopic": "Harshacharita: Bana Bhatta authorship and Hiuen Tsang Kannauj-Prayag corroboration", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): हर्षचरित हे संस्कृतमधील पहिले ऐतिहासिक चरित्र मानले जाते. कारण (R): बाणभट्ट हर्षवर्धनाचा दरबारी कवी होता आणि ह्युएन त्सांगच्या 'सी-यू-की' मधील कनौज (इ.स. 643) व प्रयाग संमेलनांची नोंद हर्षकालीन घटनांना पुष्टी देते. योग्य पर्याय निवडा.", "q_english": "Assertion (A): Harshacharita is regarded as the first historical biography in Sanskrit. Reason (R): Bana Bhatta was the court poet of Harshavardhana, and Hiuen Tsang's 'Si-yu-ki' account of the Kannauj (643 CE) and Prayag assemblies corroborates Harsha-era events. Choose the correct option.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 1, "explanation_marathi": "A सत्य ऐतिहासिक चरित्र आद्य नमुना, R सत्य दरबारी साक्ष + ह्युएन त्सांग साक्ष.", "evidence": "Bana's Harshacharita, Cowell & Thomas translation, 1897; Hiuen Tsang's Si-yu-ki, Samuel Beal translation, 1884"}, {"section": 4, "subtopic": "Rajput kingdoms: Prithviraj Chauhan III and the Tarain battles 1191-1192", "qtype": "karan-parinam", "q_marathi": "कारण-परिणामाबाबत कोणती जोडी ऐतिहासिकदृष्ट्या अचूक आहे? (अ) तराईनचे पहिले युद्ध 1191 — पृथ्वीराज चौहान तृतीयकडून घोरीचा पराभव (ब) तराईनचे दुसरे युद्ध 1192 — घोरीकडून पृथ्वीराजाचा पराभव व दिल्ली सल्तनतच्या स्थापनेची पायाभरणी (क) चंदावरचे युद्ध 1194 — जयचंद राठोडचा पराभव", "q_english": "Which cause-effect pair is historically accurate? (a) First Battle of Tarain 1191 — Prithviraj Chauhan III defeats Ghori (b) Second Battle of Tarain 1192 — Ghori defeats Prithviraj, laying the foundation of the Delhi Sultanate (c) Battle of Chandawar 1194 — defeat of Jaichand Rathod", "options": ["केवळ अ-ब", "केवळ ब-क", "अ, ब आणि क सर्व बरोबर", "केवळ अ-क"], "correct_index": 2, "explanation_marathi": "तिन्ही बरोबर 1191 1192 1194.", "evidence": "Minhaj-i Siraj, Tabaqat-i Nasiri, c. 1260; Dasharatha Sharma, Early Chauhan Dynasties, 1959"}, {"section": 4, "subtopic": "Delhi Sultanate: Khalji-Tughlaq economic experiments - market reforms and token currency", "qtype": "don-sankalpana-ekatra", "q_marathi": "दोन संकल्पना एकत्रितपणे तपासा : संकल्पना X — अलाउद्दीन खिलजीची बाजार नियंत्रणे (दीवान-ए-रियासत, शहना-ए-मंडी, भाव निश्चिती). संकल्पना Y — मुहम्मद बिन तुघलकची सांकेतिक चलन योजना (इ.स. 1329-30, तांबे/पितळ टोकन). कोणते एकत्रित विधान अचूक आहे?", "q_english": "Examine two concepts together: Concept X — Alauddin Khalji's market controls (Diwan-i-Riyasat, Shahna-i-Mandi, price fixation). Concept Y — Muhammad bin Tughlaq's token currency scheme (1329-30 CE, copper/brass tokens). Which combined statement is accurate?", "options": ["X ही लष्करी पगारवाढीसाठी तर Y ही दुष्काळ निवारणासाठी होती", "X आणि Y दोन्ही शेरशहा सूरीने सुरू केल्या", "X ने मोंगोलविरोधी स्थायी सैन्याच्या स्वस्त धान्यपुरवठ्यासाठी भावबांधणी केली; Y मध्ये राजेशाही शिक्क्याची नक्कल रोखता न आल्याने योजना कोसळली", "X यशस्वी ठरली तर Y मुळे चांदीचा टंका प्रचलित झाला"], "correct_index": 2, "explanation_marathi": "X स्वस्त धान्य सैन्य पोसणे, Y बनावट नाणी रोखता न आल्याने कोसळली.", "evidence": "Ziauddin Barani, Tarikh-i Firuz Shahi, 1357; Ishwari Prasad, History of Medieval India, 1940"}, {"section": 4, "subtopic": "Mughal mansabdari: zat-sawar ranks and do-aspah sih-aspah innovation", "qtype": "takta-aadharit", "q_marathi": "तक्ता : मनसबदार श्रेणी — (P) 5000 जात / 5000 सवार : प्रथम श्रेणी (जात=सवार) (Q) 5000 जात / 2500 सवार : द्वितीय श्रेणी (सवार < जात) (R) 5000 जात / 7500 सवार : 'दो-अस्पा सीह-अस्पा' श्रेणी, शाहजहान-औरंगजेब काळ (S) 500 जात / 0 सवार : एकहजारीपेक्षा खालचा मनसब. तक्त्यातील कोणती ओळ पूर्णपणे अचूक आहे?", "q_english": "Table: Mansabdar ranks — (P) 5000 zat / 5000 sawar: first category (zat = sawar) (Q) 5000 zat / 2500 sawar: second category (sawar < zat) (R) 5000 zat / 7500 sawar: 'do-aspah sih-aspah' category, Shah Jahan–Aurangzeb period (S) 500 zat / 0 sawar: mansab below one-hazari. Which row of the table is fully accurate?", "options": ["केवळ P आणि Q", "केवळ Q आणि S", "केवळ P, Q आणि S", "P, Q, R आणि S सर्व"], "correct_index": 3, "explanation_marathi": "सर्व बरोबर: जात प्रतिष्ठा पगार, सवार घोडदळ, त्रिवर्गीय, दो-अस्पा.", "evidence": "Abul Fazl, Ain-i-Akbari, 1595; M. Athar Ali, The Mughal Nobility Under Aurangzeb, 1966"}, {"section": 4, "subtopic": "Maratha Ashtapradhan: Panditrao-Danadhyaksha creation and Sachiv-Sumant role clarity", "qtype": "bahu-vidhan", "q_marathi": "अष्टप्रधान मंडळाबाबत विधाने : (I) पंडितराव (दानाध्यक्ष) हे धर्मादाय व धार्मिक अनुदानांचे प्रमुख होते; हे पद शिवकालात नव्याने निर्माण झाले. (II) सचिव (शुरू-नवीस) राजकीय पत्रव्यवहार व दप्तर सांभाळत असे. (III) अमात्य (मुजुमदार) महसूल-हिशेब पाहत असे. (IV) सुमंत (डबीर) परराष्ट्र व्यवहार व दरबारी शिष्टाचार सांभाळत असे. बरोबर कोणती?", "q_english": "Statements on the Ashtapradhan council: (I) Panditrao (Danadhyaksha) headed religious charities and grants; this post was newly created in Shivaji's time. (II) Sachiv (Shuru-navis) handled royal correspondence and records. (III) Amatya (Mujumdar) managed revenue and accounts. (IV) Sumant (Dabir) handled foreign affairs and court protocol. Which are correct?", "options": ["I, II, III आणि IV सर्व", "केवळ I आणि III", "केवळ II आणि IV", "केवळ I, II आणि IV"], "correct_index": 0, "explanation_marathi": "चारही बरोबर — पंडितराव नाविन्य, सचिव पत्रव्यवहार, अमात्य महसूल, सुमंत परराष्ट्र.", "evidence": "Sabhasad Bakhar (Krishnaji Anant Sabhasad, 1697); V.K. Rajwade, Marathyanchya Itihasachi Sadhane, Vol. 8, 1908"}, {"section": 4, "subtopic": "Anglo-Maratha wars: 1817-18 final operations Khadki-Sitabuldi-Koregaon-Mahidpur map sequence", "qtype": "nakasha-aadharit", "q_marathi": "नकाशा-आधारित प्रश्न : तिसऱ्या इंग्रज-मराठा युद्धाच्या (1817-18) अंतिम मोहिमा नकाशावर : (A) खडकी (पुणे) — नोव्हें. 1817, बाजीराव द्वितीय विरुद्ध स्मिथ (B) सीताबर्डी (नागपूर) — नोव्हें. 1817, अप्पासाहेब भोसले विरुद्ध डोव्हटन (C) कोरेगाव-भीमा — जाने. 1818, स्टॉन्टनची कंपनी तुकडी (D) महिदपूर — डिसें. 1817, होळकर विरुद्ध हिस्लॉप. नकाशावरील कोणती मांडणी अचूक आहे?", "q_english": "Map-based question: Final operations of the Third Anglo-Maratha War (1817-18) on the map: (A) Khadki (Pune) — Nov 1817, Baji Rao II vs Smith (B) Sitabuldi (Nagpur) — Nov 1817, Appa Saheb Bhonsle vs Doveton (C) Koregaon-Bhima — Jan 1818, Staunton's Company detachment (D) Mahidpur — Dec 1817, Holkar vs Hislop. Which map placement is accurate?", "options": ["A-पुणे, B-नागपूर, C-भीमा-काठ, D-माळवा ही स्थाने अदलाबदल झालेली", "A-खडकी (पुणे), B-सीताबर्डी (नागपूर), C-कोरेगाव (भीमा नदीकाठ), D-महिदपूर (माळवा) — सर्व स्थाने व सेनापती बरोबर", "केवळ A आणि C बरोबर; B-C चा काळ 1819 आहे", "A-1816, B-1818 अशी वर्षे असलेली मांडणी"], "correct_index": 1, "explanation_marathi": "सर्व स्थाने काळ सेनापती बरोबर: खडकी 5 नोव्हें. 1817, सीताबर्डी 26-27 नोव्हें. 1817, महिदपूर 21 डिसें. 1817, कोरेगाव 1 जाने. 1818.", "evidence": "Mountstuart Elphinstone's dispatches, 1818; James Grant Duff, History of the Mahrattas, 1826"}, {"section": 4, "subtopic": "1857 Lucknow-Kanpur: Residency siege-Begum Hazrat Mahal and Satichaura-Bibighar", "qtype": "Assertion-Reason", "q_marathi": "प्रतिपादन (A): लखनौ रेसिडेन्सीचा वेढा (जून-नोव्हें. 1857) कॉलिन कॅम्पबेलच्या कुमकेने संपला आणि बेगम हजरत महलने बिरजीस कद्रसाठी प्रतिसरकार चालवले. कारण (R): कानपूरच्या सतीचौरा-बिबीघर घटनांना नानासाहेब पेशवे जबाबदार होते म्हणून अवधच्या बंडाला न्याय्य ठरवता येते. योग्य पर्याय निवडा.", "q_english": "Assertion (A): The Lucknow Residency siege (June–Nov 1857) ended with Colin Campbell's relief and Begum Hazrat Mahal ran a parallel government for Birjis Qadr. Reason (R): Nana Saheb Peshwa was responsible for the Satichaura-Bibighar episodes at Kanpur, which justifies the Awadh revolt. Choose the correct option.", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A सत्य, R असत्य", "A असत्य, R सत्य", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही"], "correct_index": 3, "explanation_marathi": "A सत्य हेन्री लॉरेन्स मृत्यू, कॅम्पबेल कुमक, बेगम जाहीरनामा. R सत्यांश असूनही A चे स्पष्टीकरण नाही स्वतंत्र केंद्रे.", "evidence": "Begum Hazrat Mahal's proclamation countering Queen Victoria's Proclamation, 1858; Kaye & Malleson, History of the Indian Mutiny, 1888-89"}, {"section": 4, "subtopic": "Swadeshi 1905: Bengal partition-boycott resolution-Vande Mataram-Anandamath link", "qtype": "jodya-lava", "q_marathi": "जोड्या लावा : (A) बंगाल फाळणी अंमलबजावणी (B) बहिष्कार ठराव, कलकत्ता टाउन हॉल (C) 'वंदे मातरम्' घोषणा-उगम (D) स्वदेशी स्टीम नेव्हिगेशन कंपनी — (1) 16 ऑक्टोबर 1905, कर्झन (2) 7 ऑगस्ट 1905 (3) बंकिमचंद्रांचा आनंदमठ, 1882 (4) व्ही.ओ.सी. पिल्लै, तुतिकोरिन", "q_english": "Match the pairs: (A) Bengal partition implemented (B) Boycott Resolution, Calcutta Town Hall (C) Origin of the 'Vande Mataram' slogan (D) Swadeshi Steam Navigation Company — (1) 16 October 1905, Curzon (2) 7 August 1905 (3) Bankim Chandra's Anandamath, 1882 (4) V.O.C. Pillai, Tuticorin", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-4, D-3", "A-1, B-3, C-2, D-4", "A-4, B-2, C-1, D-3"], "correct_index": 0, "explanation_marathi": "फाळणी 16 ऑक्टो. 1905, बहिष्कार 7 ऑगस्ट 1905, वंदे मातरम् आनंदमठ 1882, स्वदेशी स्टीम पिल्लै तुतिकोरिन.", "evidence": "Sumit Sarkar, The Swadeshi Movement in Bengal 1903-1908, 1973; Bipan Chandra, India's Struggle for Independence, 1988"}, {"section": 4, "subtopic": "Morley-Minto 1909: separate electorates and Satyendra Prasanna Sinha executive council entry", "qtype": "takta-aadharit", "q_marathi": "तक्ता — मोर्ले-मिंटो सुधारणा (1909 कायदा) : (P) मुस्लिमांसाठी स्वतंत्र मतदारसंघ (Q) सत्येंद्र प्रसन्न सिन्हा : व्हाइसरॉयच्या कार्यकारी मंडळातील पहिले भारतीय सदस्य (R) प्रांतीय विधिमंडळांत निर्वाचित बिगरसरकारी बहुमत, केंद्रात सरकारी बहुमत कायम (S) स्त्रियांना सार्वत्रिक मताधिकार. तक्त्यातील कोणती ओळ चुकीची आहे?", "q_english": "Table — Morley-Minto reforms (Act of 1909): (P) Separate electorates for Muslims (Q) Satyendra Prasanna Sinha: first Indian member of the Viceroy's Executive Council (R) Elected non-official majority in provincial legislatures, official majority retained at the centre (S) Universal franchise for women. Which row in the table is incorrect?", "options": ["केवळ P", "केवळ Q", "केवळ S", "केवळ R"], "correct_index": 2, "explanation_marathi": "S चूक 1909 स्त्री मताधिकार नाही मर्यादित मालमत्ता मताधिकार.", "evidence": "Indian Councils Act 1909; S.R. Mehrotra, Towards India's Freedom and Partition, 1979"}, {"section": 4, "subtopic": "Lucknow Pact 1916: Congress-League joint demands and Home Rule League coordination", "qtype": "don-sankalpana-ekatra", "q_marathi": "दोन संकल्पना एकत्रितपणे तपासा : संकल्पना X — लखनौ करार (डिसें. 1916): काँग्रेसने मुस्लिमांसाठी स्वतंत्र मतदारसंघ मान्य केले; केंद्रीय विधिमंडळात मुस्लिमांसाठी 1/3 जागा. संकल्पना Y — होमरूल चळवळ : टिळक (एप्रिल 1916) व बेझंट (सप्टें. 1916) लीग. कोणते एकत्रित विधान अचूक?", "q_english": "Examine two concepts together: Concept X — Lucknow Pact (Dec 1916): Congress accepted separate electorates for Muslims; one-third Muslim representation in the central legislature. Concept Y — Home Rule movement: Tilak (April 1916) and Besant (Sept 1916) leagues. Which combined statement is accurate?", "options": ["X मध्ये काँग्रेसने स्वतंत्र मतदारसंघ नाकारले; Y 1919 मध्ये सुरू झाली", "X हा टिळक-जिन्ना सामंजस्याचा परिपाक असून Y ने त्याच वर्षी जनजागृतीस पूरक ठरले; दोन्ही 1916 च्या लखनौ अधिवेशनाशी निगडित", "X केवळ मुस्लिम लीगचा ठराव; Y शी संबंध नाही", "X 1917 चा तर Y 1915 चा आहे"], "correct_index": 1, "explanation_marathi": "X लखनौ काँग्रेस लीग संयुक्त मागण्या जिन्ना टिळक, Y होमरूल 1916-17 स्वराज्य प्रचार लखनौ अधिवेशन टिळक पुनरागमन.", "evidence": "Pattabhi Sitaramayya, History of the Indian National Congress, 1935; H. Kulke & D. Rothermund, A History of India, 1998"}, {"section": 4, "subtopic": "Rowlatt 1919: Rowlatt Committee recommendations-Gandhi satyagraha-Jallianwala Bagh chain", "qtype": "karan-parinam", "q_marathi": "कारण-परिणाम साखळी तपासा : कारण — रौलेट समितीच्या (1918, न्यायमूर्ती एस.ए.टी. रौलेट) शिफारशींवरून 'अराजक व क्रांतिकारी गुन्हे कायदा' (1919) : विना-खटला प्रतिबंधात्मक स्थानबद्धता. परिणाम — गांधींचा पहिला अखिल भारतीय सत्याग्रह (6 एप्रिल 1919 हरताळ) व 13 एप्रिल 1919 जालियनवाला बाग हत्याकांड (डायर). ही साखळी कोणत्या पर्यायात अचूक मांडली आहे?", "q_english": "Examine the cause-effect chain: Cause — on the Rowlatt Committee's (1918, Justice S.A.T. Rowlatt) recommendations, the Anarchical and Revolutionary Crimes Act (1919): preventive detention without trial. Effect — Gandhi's first all-India satyagraha (6 April 1919 hartal) and the 13 April 1919 Jallianwala Bagh massacre (Dyer). In which option is this chain correctly stated?", "options": ["कारण चूक: रौलेट कायदा 1917 चा; परिणाम बरोबर", "कारण बरोबर; परिणाम चूक: जालियनवाला 1918 मध्ये घडले", "ही साखळी खिलाफत चळवळीची आहे", "कारण-परिणाम दोन्ही अचूक; पंजाबात सैफुद्दीन किचलू-सत्यपाल अटक ही तात्कालिक ठिणगी"], "correct_index": 3, "explanation_marathi": "कारण परिणाम दोन्ही अचूक डिफेन्स ऑफ इंडिया कायदा संपताच रौलेट कायदा गांधी रौलेट सत्याग्रह सभा पंजाब किचलू सत्यपाल अटक उद्रेक डायर गोळीबार.", "evidence": "Rowlatt Committee Report (Sedition Committee), 1918; Report of the Hunter Committee on Punjab Disturbances, 1920"}, {"section": 4, "subtopic": "Government of India Act 1935: federal scheme vs provincial autonomy implementation", "qtype": "bahu-vidhan", "q_marathi": "1935 च्या भारत सरकार कायद्याबाबत विधाने : (I) अखिल भारतीय महासंघाचा प्रस्ताव; संस्थाने न सामील झाल्याने कधीच अंमलात आला नाही. (II) प्रांतांत द्विशासन रद्द करून प्रांतीय स्वायत्तता; केंद्रात द्विशासन लागू. (III) फेडरल न्यायालयाची स्थापना (1937). (IV) ब्रह्मदेश (म्यानमार) भारतापासून वेगळा (1937). कोणती विधाने बरोबर?", "q_english": "Statements on the Government of India Act 1935: (I) All-India Federation proposed; never implemented as princely states did not accede. (II) Dyarchy abolished in provinces with provincial autonomy; dyarchy introduced at the centre. (III) Federal Court established (1937). (IV) Burma separated from India (1937). Which statements are correct?", "options": ["केवळ I आणि II", "केवळ II आणि III", "केवळ I, II आणि IV", "I, II, III आणि IV सर्व"], "correct_index": 3, "explanation_marathi": "चारही बरोबर महासंघ कागदावर 1937 निवडणुका 7 प्रांत काँग्रेस मंत्रिमंडळे फेडरल कोर्ट 1 ऑक्टो. 1937 ब्रह्मदेश वेगळा.", "evidence": "Government of India Act 1935 (text); Reginald Coupland, The Indian Problem — Report on the Constitutional Problem in India, 1943"}, {"section": 5, "subtopic": "Sangam sahitya vargikaran - Tolkappiyam-Ettuthokai-Pathuppattu", "qtype": "bahu-vidhan", "q_marathi": "संगम साहित्याबाबत खालील विधाने विचारात घ्या :\nI. तोल्काप्पियम हा तमिळ व्याकरणावरील प्राचीन ग्रंथ असून त्याचे एळुत्तु (वर्णविचार), चोल् (शब्दविचार) आणि पोरुळ् (विषय-अर्थविचार) असे तीन अधिकरण आहेत.\nII. एत्तुथोकै (अष्टसंग्रह) मध्ये कुरुन्तोकै, नत्रिणै आदी 8 लघुसंकलने तर पत्तुप्पाट्टु (दशगीत) मध्ये तिरुमुरुकात्रुप्पडै आदी 10 दीर्घकाव्ये आहेत; दोन्ही मिळून 'पतिनेण्मेल्कणक्कु' (18 श्रेष्ठ ग्रंथ) होतात.\nIII. संगम संकलन परंपरा पांड्यांच्या मदुरै येथील तिसऱ्या संगमाशी जोडली जाते व परंपरेनुसार 449 कवींनी त्यात योगदान दिल्याचे मानले जाते.\nयोग्य पर्याय निवडा :", "q_english": "Consider the following statements regarding Sangam literature: I. Tolkappiyam is the ancient Tamil grammar text divided into Eluttu, Col and Porul adhikarams. II. Ettuthokai comprises 8 anthologies like Kuruntokai, Natrinai while Pattuppattu comprises 10 long poems like Tirumurukarruppatai; together they form Patinenmelkanakku (18 superior texts). III. The Sangam compilation tradition is linked to the third Sangam at Madurai under the Pandyas with tradition crediting 449 poets. Choose the correct option:", "options": ["फक्त I आणि II बरोबर आहेत", "फक्त I आणि III बरोबर आहेत", "फक्त II आणि III बरोबर आहेत", "I, II आणि III तिन्ही बरोबर आहेत"], "correct_index": 3, "explanation_marathi": "तिन्ही बरोबर — तोल्काप्पियम त्रिसूत्री, 8+10=18 पतिनेण्मेल्कणक्कु, मदुरै तिसरा संगम 449 कवी.", "evidence": "K.A. Nilakanta Sastri - A History of South India, 1955; Tolkappiyam critical edition"}, {"section": 5, "subtopic": "Dakhan Pathar Bhugarbh Rachana", "qtype": "bahu-vidhan", "q_marathi": "दख्खन पठाराच्या भूगर्भ रचनेबाबत खालील विधाने विचारात घ्या :\nI. दख्खन ट्रॅप सुमारे 6.6 कोटी वर्षांपूर्वी क्रिटेशियस-पॅलेओजीन सीमेवर झालेल्या ज्वालामुखी उद्रेकातून तयार झाला.\nII. दख्खन ट्रॅपच्या बेसाल्ट खडकांपासून काळी रेगूर मृदा तयार झाली आहे.\nIII. दख्खन पठार हे संपूर्णपणे ग्रॅनाइट व नीस खडकांनी बनलेले असून तेथे बेसाल्ट अजिबात आढळत नाही.\nयोग्य पर्याय निवडा :", "q_english": "Consider statements on Deccan Plateau geology: I. Deccan Trap formed ~66 million years ago at K-Pg boundary from volcanic eruption. II. Black regur soil formed from Deccan Trap basalt. III. Deccan Plateau is entirely granite-gneiss with no basalt.", "options": ["फक्त I आणि II बरोबर आहेत", "फक्त II आणि III बरोबर आहेत", "फक्त I आणि III बरोबर आहेत", "I, II आणि III तिन्ही बरोबर आहेत"], "correct_index": 0, "explanation_marathi": "I व II बरोबर — दख्खन ट्रॅप 6.6 कोटी वर्षे, रेगूर काळी मृदा बेसाल्टपासून. III चूक कारण पठार मुख्यत्वे बेसाल्टचेच आहे, ग्रॅनाइट नाही.", "evidence": "GSI Deccan Trap Memoir 2021; NBSS&LUP soil survey"}, {"section": 5, "subtopic": "Godavari khore vitaran Maharashtra", "qtype": "jodya lava", "q_marathi": "जोड्या लावा : (A) प्रवरा (B) मांजरा (C) पैनगंगा (D) वर्धा यांच्या (1) गोदावरीची उजवी उपनदी (2) गोदावरीची डावी उपनदी (3) पूर्णाची उपनदी (4) प्राणहिताची उपनदी यांच्याशी :\nपर्याय:", "q_english": "Match: (A) Pravara (B) Manjra (C) Penganga (D) Wardha with (1) Right tributary of Godavari (2) Left tributary of Godavari (3) Tributary of Purna (4) Tributary of Pranhita:", "options": ["A-1, B-1, C-2, D-4", "A-2, B-1, C-2, D-1", "A-1, B-2, C-1, D-2", "A-1, B-1, C-2, D-2"], "correct_index": 0, "explanation_marathi": "प्रवरा व मांजरा उजव्या, पैनगंगा डावी, वर्धा प्राणहिताची उपनदी (वैनगंगा-वर्धा → प्राणहिता).", "evidence": "CWC Godavari basin report 2023"}, {"section": 5, "subtopic": "Krishna khore vitaran Maharashtra", "qtype": "kalkram lava", "q_marathi": "कृष्णा खोऱ्यातील नद्यांचा उत्तरेकडून दक्षिणेकडे (महाराष्ट्रात) योग्य क्रम लावा: (A) कोयना (B) वेण्णा (C) पंचगंगा (D) घटप्रभा", "q_english": "Arrange Krishna basin rivers north to south in Maharashtra: (A) Koyna (B) Venna (C) Panchaganga (D) Ghataprabha", "options": ["A-B-C-D", "B-A-C-D", "D-C-B-A", "A-C-B-D"], "correct_index": 1, "explanation_marathi": "उत्तर→दक्षिण: वेण्णा (महाबळेश्वरजवळ), कोयना (कराडजवळ मिळते), पंचगंगा (कोल्हापूर), घटप्रभा (कर्नाटक सीमेकडे).", "evidence": "CWC Krishna basin map 2023"}, {"section": 5, "subtopic": "Tapi khore vitaran Maharashtra", "qtype": "bahu-vidhan", "q_marathi": "तापी खोऱ्याबाबत खालील विधाने विचारात घ्या :\nI. तापी नदीचा उगम मध्य प्रदेशातील बैतूल जिल्ह्यातील मुलताई येथे होतो.\nII. महाराष्ट्रात पूर्णा, गिरणा, पांझरा या तिच्या उपनद्या आहेत.\nIII. तापी खोऱ्यातील मृदा प्रामुख्याने काळी रेगूर मृदा आहे.\nयोग्य पर्याय निवडा :", "q_english": "Consider statements on Tapi basin: I. Tapi originates at Multai in Betul district, MP. II. In Maharashtra Purna, Girna, Panzara are its tributaries. III. Tapi basin soil is mainly black regur.", "options": ["फक्त I आणि II बरोबर आहेत", "फक्त II आणि III बरोबर आहेत", "फक्त I आणि III बरोबर आहेत", "I, II आणि III तिन्ही बरोबर आहेत"], "correct_index": 3, "explanation_marathi": "तिन्ही बरोबर — मुलताई उगम, पूर्णा गिरणा पांझरा उपनद्या, रेगूर मृदा.", "evidence": "CWC Tapi basin report 2023"}, {"section": 5, "subtopic": "Konkan kinara bhugol Maharashtra", "qtype": "nakasha aadharit", "q_marathi": "कोकण किनारा नकाशात दाखवला आहे — सह्याद्री व अरबी समुद्र यांदरम्यानचा अरुंद पट्टा, जांभी मृदा, खाड्या-नद्यांची मुखे. खालीलपैकी कोणते विधान बरोबर आहे?", "q_english": "Konkan coast shown on map — narrow strip between Sahyadri and Arabian Sea, laterite soil, creek mouths. Which statement is correct?", "options": ["कोकणात रेगूर काळी मृदा प्रधान आहे आणि गहू हे प्रमुख पीक आहे", "कोकण किनारा हा रिया प्रकारचा असून जांभी मृदा, भात-नारळ-आंबा-काजू ही प्रमुख पिके व अनेक खाड्या आहेत", "कोकणात लॅटेराइट मृदा नाही आणि हापूस आंबा विदर्भात घेतला जातो", "कोकणात फक्त वाळवंटी मृदा असून तेथे शेती होत नाही"], "correct_index": 1, "explanation_marathi": "कोकण रिया किनारा, जांभी मृदा, भात नारळ आंबा काजू, खाड्या.", "evidence": "Maharashtra Gazetteer - Konkan coast 2022"}, {"section": 5, "subtopic": "Paschim ghat jaivavividhata hotspot", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): पश्चिम घाट हा जगातील 36 जैवविविधता हॉटस्पॉटपैकी एक असून युनेस्को जागतिक वारसा स्थळ (2012) आहे.\nकारण (R): पश्चिम घाटात 7,400 पेक्षा अधिक वनस्पती, 500 पक्षी व अनेक स्थानिक प्रजाती आहेत आणि येथे 1,500 पेक्षा अधिक स्थानिक फुलवनस्पती आढळतात, परंतु मूळ वनस्पती आवरणाचा 70% पेक्षा अधिक ऱ्हास झाला आहे.\nयोग्य पर्याय निवडा :", "q_english": "Assertion (A): Western Ghats is one of world's 36 biodiversity hotspots and UNESCO World Heritage Site (2012).\nReason (R): Western Ghats has 7,400+ flora, 500 birds and many endemics, with 1,500+ endemic flowering plants, but >70% original vegetation lost.\nChoose correct option:", "options": ["A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण आहे", "A आणि R दोन्ही सत्य, R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य — हॉटस्पॉट व 2012 वारसा. R सत्य — स्थानिकता + ऱ्हास हे हॉटस्पॉट निकष (1,500 स्थानिक वनस्पती व 70% हानी) स्पष्ट करतात.", "evidence": "UNESCO World Heritage List Western Ghats 2012; Myers et al. hotspot criteria 2000"}, {"section": 5, "subtopic": "Maharashtra jalsampada dharan prakalp", "qtype": "jodya lava", "q_marathi": "जोड्या लावा : (A) जायकवाडी (B) कोयना (C) इसापूर (D) तोतलाडोह यांच्या (1) गोदावरी (2) कृष्णा (कोयना उपनदी) (3) पैनगंगा (4) पेंच यांच्याशी :", "q_english": "Match: (A) Jayakwadi (B) Koyna (C) Isapur (D) Totladoh with (1) Godavari (2) Krishna (Koyna tributary) (3) Penganga (4) Pench:", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-4, D-3", "A-1, B-3, C-2, D-4", "A-4, B-2, C-1, D-3"], "correct_index": 0, "explanation_marathi": "जायकवाडी गोदावरी, कोयना कोयना नदी (कृष्णा उपनदी), इसापूर पैनगंगा, तोतलाडोह पेंच.", "evidence": "Maharashtra WRD dam register 2023"}, {"section": 5, "subtopic": "Havaman monsoon mechanism Maharashtra", "qtype": "karan-parinam", "q_marathi": "कारण (C): नैऋत्य मोसमी वाऱ्यांची अरबी समुद्र शाखा सह्याद्रीला अडल्याने कोकण व घाटमाथ्यावर अतिवृष्टी होते, तर पूर्वेकडील पठारी भाग पर्जन्यछायेत राहतो.\nपरिणाम (E): महाराष्ट्रात जून ते सप्टेंबर या चार महिन्यांत वार्षिक पर्जन्याच्या सुमारे 80% पाऊस पडतो आणि कोकणातील सरासरी पर्जन्य 2,500-3,000 मिमी तर मध्य महाराष्ट्रात 500-700 मिमी असते.\nयोग्य पर्याय निवडा :", "q_english": "Cause (C): SW monsoon Arabian Sea branch struck by Sahyadri causes heavy rain on Konkan and Ghatmatha, while eastern plateau remains in rain shadow.\nEffect (E): Maharashtra gets ~80% annual rain June-September and Konkan averages 2,500-3,000 mm vs 500-700 mm in central Maharashtra.\nChoose correct:", "options": ["C सत्य, E असत्य", "C असत्य, E सत्य", "C आणि E दोन्ही सत्य, E हा C चा तार्किक परिणाम आहे", "C आणि E दोन्ही सत्य, परंतु E हा C चा परिणाम नाही"], "correct_index": 2, "explanation_marathi": "C सत्य — सह्याद्री अडथळा, E सत्य — 80% मान्सून पाऊस व कोकण मध्य महाराष्ट्र पर्जन्य तफावत, E हा C चाच परिणाम.", "evidence": "IMD monsoon atlas 2023; Maharashtra Economic Survey 2023-24"}, {"section": 5, "subtopic": "Maharashtra khanij sampada", "qtype": "takta aadharit", "q_marathi": "तक्ता : (A) कोळसा - चंद्रपूर-यवतमाळ-नागपूर पट्टा, (B) चुनखडी - चंद्रपूर-यवतमाळ-गडचिरोली, (C) लोहखनिज - गडचिरोली-चंद्रपूर-सिंधुदुर्ग, (D) बॉक्साइट - कोल्हापूर-रत्नागिरी-रायगड. तक्त्यातील अयोग्य जोडी कोणती?", "q_english": "Table: (A) Coal - Chandrapur-Yavatmal-Nagpur belt, (B) Limestone - Chandrapur-Yavatmal-Gadchiroli, (C) Iron ore - Gadchiroli-Chandrapur-Sindhudurg, (D) Bauxite - Kolhapur-Ratnagiri-Raigad. Which pairing in table is incorrect?", "options": ["A - कोळसा पट्टा बरोबर", "B - चुनखडी पट्टा बरोबर", "C - लोहखनिज पट्टा बरोबर", "D - बॉक्साइट पट्टा - फक्त गोंदिया जिल्ह्यातच आढळते हे विधान चूक"], "correct_index": 3, "explanation_marathi": "A,B,C बरोबर. D मधील बॉक्साइट कोल्हापूर रत्नागिरी रायगड सांगली सिंधुदुर्ग सातारा या पश्चिम पट्ट्यात आढळते, फक्त गोंदिया नव्हे.", "evidence": "Indian Bureau of Mines - Maharashtra mineral map 2023"}, {"section": 5, "subtopic": "Maharashtra audyogik vibhag", "qtype": "nakasha aadharit", "q_marathi": "नकाशात महाराष्ट्रातील औद्योगिक विभाग दाखवले आहेत: मुंबई-पुणे-नाशिक त्रिकोण हा सर्वाधिक औद्योगिकीकरणाचा भाग आहे. या विभागाच्या वैशिष्ट्यांबाबत कोणते विधान बरोबर आहे?", "q_english": "Industrial regions shown on map: Mumbai-Pune-Nashik triangle is most industrialized. Which statement about this region is correct?", "options": ["हा विभाग कच्चा माल, कुशल कामगार, बाजारपेठ व पायाभूत सुविधांच्या एकत्रीकरणामुळे विकसित झाला आहे", "हा विभाग फक्त कापसावर अवलंबून आहे आणि इतर उद्योग नाहीत", "हा विभाग फक्त खनिजांवर आधारित आहे", "हा विभाग औद्योगिकदृष्ट्या मागासलेला आहे"], "correct_index": 0, "explanation_marathi": "मुंबई पुणे नाशिक त्रिकोण कच्चा माल कामगार बाजारपेठ पायाभूत सुविधा एकत्रीकरणामुळे.", "evidence": "Maharashtra Industrial Development Report 2023"}, {"section": 5, "subtopic": "Maharashtra vahatuk jaal", "qtype": "bahu-vidhan", "q_marathi": "महाराष्ट्रातील वाहतूक जाळ्याबाबत खालील विधाने विचारात घ्या :\nI. महाराष्ट्रात राष्ट्रीय महामार्गांची लांबी सुमारे 18,000 किमीपेक्षा अधिक आहे.\nII. मुंबई-पुणे द्रुतगती महामार्ग हा भारतातील पहिला सहा-पदरी द्रुतगती महामार्ग (एक्स्प्रेस वे) होता.\nIII. समृद्धी महामार्ग (हिंदुहृदयसम्राट बाळासाहेब ठाकरे महाराष्ट्र समृद्धी महामार्ग) नागपूर ते मुंबई (701 किमी) जोडतो.\nयोग्य पर्याय निवडा :", "q_english": "Consider statements on Maharashtra transport network: I. National highways length in Maharashtra exceeds ~18,000 km. II. Mumbai-Pune Expressway was India's first six-lane expressway. III. Samruddhi Mahamarg (Nagpur-Mumbai, 701 km) connects Nagpur to Mumbai. Which are correct?", "options": ["फक्त I आणि II बरोबर आहेत", "फक्त II आणि III बरोबर आहेत", "I, II आणि III तिन्ही बरोबर आहेत", "फक्त I आणि III बरोबर आहेत"], "correct_index": 2, "explanation_marathi": "तिन्ही बरोबर — NH लांबी 18,000+ किमी, मुंबई पुणे पहिला 6 लेन एक्स्प्रेस वे, समृद्धी 701 किमी नागपूर मुंबई.", "evidence": "NHAI, MSRDC reports 2023-24; Samruddhi Mahamarg 701 km"}, {"section": 6, "subtopic": "Mulbhut Hakka Art 32 vs 226 kalam", "qtype": "bahu-vidhan", "q_marathi": "मूलभूत हक्क व न्यायिक पुनर्विलोकन (कलम 32 व 226) बद्दल: (A) कलम 32 हा स्वतः मूलभूत हक्क आहे आणि सर्वोच्च न्यायालयात थेट याचिका दाखल करता येते. (B) कलम 226 नुसार उच्च न्यायालय मूलभूत हक्कांसह इतर कायदेशीर हक्कांसाठीही रिट जारी करू शकते आणि व्याप्ती कलम 32 पेक्षा व्यापक आहे. (C) कलम 32 व 226 दोन्ही अंतर्गत बंदी प्रत्यक्षीकरण (Habeas Corpus) हा सर्वांत व्यापक रिट असून वैयक्तिक स्वातंत्र्याशी संबंधित आहे. कोणती विधाने बरोबर?", "q_english": "On Fundamental Rights and judicial review (Arts 32 and 226): (A) Art 32 is itself a Fundamental Right and writ can be filed directly in Supreme Court. (B) Under Art 226, High Court can issue writs for Fundamental Rights plus other legal rights, wider than Art 32. (C) Under both Arts 32 and 226, Habeas Corpus is the most extensive writ concerning personal liberty. Which are correct?", "options": ["फक्त A आणि B", "फक्त B आणि C", "फक्त A आणि C", "A, B आणि C\""], "correct_index": 3, "explanation_marathi": "तिन्ही सत्य — 32 मूलभूत हक्क, 226 व्यापक, Habeas Corpus वैयक्तिक स्वातंत्र्य रिट.", "evidence": "Constitution Arts 32, 226"}, {"section": 6, "subtopic": "Nirdesh Tatva Art 36-51", "qtype": "bahu-vidhan", "q_marathi": "मार्गदर्शक तत्त्वांबाबत खालील विधाने विचारात घ्या: (A) कलम 39A मध्ये समान न्याय व मोफत कायदेशीर मदतीची तरतूद असून 42व्या घटनादुरुस्तीने (1976) समाविष्ट झाली. (B) कलम 40 मध्ये ग्रामपंचायतींच्या संघटनेचा उल्लेख असून तो गांधीवादी तत्त्व मानले जाते. (C) कलम 44 मध्ये समान नागरी संहिता (UCC) लागू करण्याचा प्रयत्न राज्याने करावा असे नमूद आहे. वरीलपैकी कोणती विधाने बरोबर आहेत?", "q_english": "Consider statements on Directive Principles: (A) Article 39A provides equal justice and free legal aid, inserted by 42nd Amendment (1976). (B) Article 40 mentions organisation of village panchayats, considered Gandhian principle. (C) Article 44 states State shall endeavour to secure Uniform Civil Code. Which are correct?", "options": ["फक्त A आणि B", "फक्त B आणि C", "फक्त A आणि C", "A, B आणि C"], "correct_index": 3, "explanation_marathi": "तिन्ही सत्य — 39A 42वी दुरुस्ती, 40 ग्रामपंचायत गांधीवादी, 44 UCC.", "evidence": "Constitution Arts 39A, 40, 44"}, {"section": 6, "subtopic": "Mulbhut Kartavya Art 51A", "qtype": "jodya lava", "q_marathi": "जोड्या लावा: (A) कलम 51A(a) (B) कलम 51A(b) (C) कलम 51A(g) (D) कलम 51A(k) यांच्या जोड्या (1) संविधानाचे पालन करणे (2) राष्ट्रीय स्वातंत्र्य लढ्याच्या आदर्शांचे पालन करणे (3) वने, सरोवरे, वन्यजीव यांसह नैसर्गिक पर्यावरणाचे रक्षण (4) 6-14 वर्षे वयोगटातील पाल्यास शिक्षणाची संधी यांच्याशी लावा:", "q_english": "Match: (A) Art 51A(a) (B) Art 51A(b) (C) Art 51A(g) (D) Art 51A(k) with (1) Abide by Constitution (2) Cherish ideals of freedom struggle (3) Protect natural environment including forests, lakes, wildlife (4) Provide educational opportunities to child 6-14 years:", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-4, D-3", "A-1, B-3, C-2, D-4", "A-4, B-3, C-2, D-1"], "correct_index": 0, "explanation_marathi": "51A(a) संविधान पालन, (b) स्वातंत्र्य आदर्श, (g) पर्यावरण रक्षण, (k) 86वी दुरुस्ती शिक्षण संधी.", "evidence": "Constitution Art 51A (a)-(k)"}, {"section": 6, "subtopic": "Rashtrapati nivad prakriya Art 54-55", "qtype": "takta aadharit", "q_marathi": "राष्ट्रपती निवड प्रक्रियेबाबत तक्ता पहा: (A) निर्वाचक मंडळात लोकसभा, राज्यसभा व राज्य विधानसभांचे निर्वाचित सदस्य असतात. (B) प्रत्येक आमदाराच्या मताचे मूल्य = राज्याची लोकसंख्या / (आमदारांची एकूण संख्या × 1000). (C) प्रमाणशीर प्रतिनिधित्व पद्धतीने एकल संक्रमणीय मताद्वारे निवड होते. (D) 71व्या घटनादुरुस्तीने दिल्ली व पुदुच्चेरी विधानसभांचा समावेश केला. तक्त्यातील चुकीची ओळ कोणती?", "q_english": "See table on President election: (A) Electoral college includes elected members of Lok Sabha, Rajya Sabha and State Assemblies. (B) Value of each MLA vote = Population of State / (Total MLAs × 1000). (C) Election by proportional representation by single transferable vote. (D) 71st Amendment included Delhi and Puducherry Assemblies. Which row is incorrect?", "options": ["A चूक आहे", "B चूक आहे", "C चूक आहे", "D चूक आहे"], "correct_index": 3, "explanation_marathi": "D चूक — दिल्ली व पुदुच्चेरीचा समावेश 70व्या दुरुस्तीने (1992) झाला, 71वी नव्हे. A,B,C बरोबर.", "evidence": "Constitution 70th Amendment Act 1992 amending Art 54; Art 55"}, {"section": 6, "subtopic": "Upasabhapati Rajya Sabha Art 89-90", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): राज्यसभेचा उपसभापती हा राज्यसभेच्या सदस्यांमधूनच निवडला जातो आणि तो पदसिद्ध सभापती (उपराष्ट्रपती) यांच्या अनुपस्थितीत सभापतीपदाची कार्ये पार पाडतो.\nकारण (R): कलम 90 नुसार उपसभापतींना पदावरून दूर करण्यासाठी 14 दिवसांची पूर्वसूचना आवश्यक असते आणि तो ठराव राज्यसभेच्या तत्कालीन सर्व सदस्यांच्या बहुमताने संमत व्हावा लागतो.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): Deputy Chairman of Rajya Sabha is elected from among Rajya Sabha members and performs Chairman's duties in absence of ex-officio Chairman (Vice-President).\nReason (R): Under Art 90, 14 days notice is required for removal and resolution must be passed by majority of all then members of Rajya Sabha.\nChoose correct option:", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण नाही", "A सत्य, R असत्य", "A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य — उपसभापती सदस्यांमधून निवड व सभापती अनुपस्थितीत काम. R सत्य — 90 नुसार 14 दिवस सूचना + सर्व तत्कालीन सदस्य बहुमत. पण R हे A चे कारण नाही, दोन स्वतंत्र तरतुदी.", "evidence": "Constitution Arts 89, 90, 91"}, {"section": 6, "subtopic": "Loksabha upadhyaksha nivad-karye", "qtype": "bahu-vidhan", "q_marathi": "लोकसभेच्या उपाध्यक्षांबाबत खालील विधाने विचारात घ्या: (A) कलम 93 नुसार लोकसभा लवकरात लवकर सभापती व उपसभापती निवडते. (B) उपाध्यक्ष सभापतींच्या अनुपस्थितीत लोकसभा अध्यक्षपद भूषवतात. (C) उपाध्यक्षांना पदावरून दूर करण्यासाठी 14 दिवसांची पूर्वसूचना व तत्कालीन सर्व सदस्यांच्या बहुमताने ठराव आवश्यक असतो. (D) उपाध्यक्ष हे नेहमीच विरोधी पक्षाचे असतात हा घटनात्मक नियम आहे. योग्य पर्याय:", "q_english": "Consider statements on Deputy Speaker of Lok Sabha: (A) Under Art 93 Lok Sabha elects Speaker and Deputy Speaker as soon as may be. (B) Deputy Speaker performs Speaker's duties in absence. (C) Removal requires 14 days notice and resolution by majority of all then members. (D) It is a constitutional rule that Deputy Speaker is always from Opposition. Choose correct:", "options": ["फक्त A, B, C बरोबर; D चूक (परंपरा आहे, घटनात्मक बंधन नाही)", "A, B, C, D सर्व बरोबर", "फक्त A आणि B बरोबर", "फक्त C आणि D बरोबर"], "correct_index": 0, "explanation_marathi": "A,B,C सत्य — 93 निवड, 95 कार्ये, 94(c) 14 दिवस + बहुमत. D चूक — विरोधी पक्षाचा असणे ही परंपरा आहे, घटनात्मक बंधन नाही.", "evidence": "Constitution Arts 93, 94, 95; Parliamentary conventions"}, {"section": 6, "subtopic": "Rajya Sabha vishesh adhikar Art 249-312", "qtype": "jodya lava", "q_marathi": "जोड्या लावा: (A) कलम 249 (B) कलम 312 (C) कलम 352 (D) कलम 312 मधील सेवा यांच्या जोड्या (1) राज्यसभेच्या 2/3 बहुमताने राज्यसूचीतील विषयावर संसदेला कायदा करण्याचा अधिकार (2) नवीन अखिल भारतीय सेवा निर्मितीस राज्यसभेच्या 2/3 बहुमताची शिफारस (3) राष्ट्रीय आणीबाणीची घोषणा (4) IAS/IPS/IFS यांच्याशी लावा:", "q_english": "Match: (A) Art 249 (B) Art 312 (C) Art 352 (D) Service under Art 312 with (1) Parliament's power to legislate on State List subject with Rajya Sabha 2/3 majority (2) Rajya Sabha 2/3 recommendation for new All-India Service (3) National emergency declaration (4) IAS/IPS/IFS:", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-4, D-3", "A-1, B-3, C-2, D-4", "A-4, B-2, C-1, D-3"], "correct_index": 0, "explanation_marathi": "249 राज्यसूचीवर संसद कायदा, 312 अखिल भारतीय सेवा, 352 राष्ट्रीय आणीबाणी, IAS IPS IFS सेवा.", "evidence": "Constitution Arts 249, 312, 352"}, {"section": 6, "subtopic": "Kalam 110 dhan vidheyak", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): धन विधेयक (कलम 110) केवळ लोकसभेतच मांडता येते आणि ते आहे की नाही हे ठरवण्याचा अंतिम अधिकार लोकसभा अध्यक्षांना आहे.\nकारण (R): धन विधेयकावर राज्यसभेला फक्त 14 दिवसांत शिफारसी करण्याचा अधिकार असतो आणि लोकसभा त्या शिफारसी स्वीकारण्यास बांधील नसते.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): Money Bill (Art 110) can be introduced only in Lok Sabha and Speaker's decision whether it is Money Bill is final.\nReason (R): Rajya Sabha has only 14 days to make recommendations on Money Bill and Lok Sabha is not bound to accept them.\nChoose correct option:", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण नाही", "A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य — 109 व 110(3) नुसार अध्यक्ष निर्णय अंतिम. R सत्य — 109(2) 14 दिवस शिफारस, लोकसभा बंधन नाही. पण R हे A चे कारण नाही, दोन स्वतंत्र तरतुदी.", "evidence": "Constitution Arts 109, 110"}, {"section": 6, "subtopic": "Kalam 352 Rashtriya Aanibani", "qtype": "bahu-vidhan", "q_marathi": "कलम 352 (राष्ट्रीय आणीबाणी) संदर्भात: I. 44व्या दुरुस्ती (1978) नंतर केवळ युद्ध, बाह्य आक्रमण व सशस्त्र बंड या कारणांवरूनच आणीबाणी लागू शकते, 'अंतर्गत अशांतता' या शब्दाऐवजी 'सशस्त्र बंड' आला. II. राष्ट्रपती राजवट (356) व वित्तीय आणीबाणी (360) यांच्याप्रमाणे 352 साठीही संसदेची 2 महिन्यांत मान्यता आवश्यक असते. III. राष्ट्रीय आणीबाणीत कलम 19 आपोआप निलंबित होते (केवळ युद्ध/बाह्य आक्रमणात) आणि 359 नुसार 20 व 21 वगळता हक्कांचे न्यायालयीन दाद मागण्याचे निलंबन राष्ट्रपती आदेशाने करता येते. योग्य पर्याय:", "q_english": "On Art 352 (national emergency): I. After 44th Amendment (1978) only war, external aggression and armed rebellion grounds; 'internal disturbance' replaced by 'armed rebellion'. II. Like Arts 356 and 360, Art 352 also needs Parliament approval within 2 months. III. During national emergency Art 19 auto-suspended (war/external aggression only) and under Art 359 enforcement of rights except Arts 20,21 can be suspended by Presidential order. Choose correct:", "options": ["I आणि II बरोबर", "फक्त I बरोबर", "I, II, III सर्व बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "I सत्य — 44वी दुरुस्ती शब्द बदल. II सत्य — 44व्या दुरुस्तीने 352 ला 2 महिने मान्यता बंधनकारक केले (पूर्वी 2 महिने नव्हते). III सत्य — 358 19 निलंबन युद्ध बाह्य आक्रमणापुरते, 359 मध्ये 20 21 संरक्षित.", "evidence": "Constitution 44th Amendment 1978 amending Arts 352, 358, 359"}, {"section": 6, "subtopic": "Kalam 356 Rashtrapati Rajvat Bommai", "qtype": "takta aadharit", "q_marathi": "कलम 356 (राष्ट्रपती राजवट) तक्ता: A. कलम 356(3) - 2 महिन्यांत संसद मान्यता आवश्यक; B. 356(4) - मान्यतेनंतर प्रत्येक वेळी 6 महिन्यांसाठी वाढ; C. 44व्या दुरुस्तीनंतर एकूण कमाल मर्यादा 3 वर्षे; D. 68व्या दुरुस्ती (1991) - पंजाबसाठी 3 वर्षांवरून 5 वर्षांपर्यंत वाढ. खालीलपैकी अयोग्य विधान कोणते?", "q_english": "Table on Art 356: A. Art 356(3) - Parliament approval within 2 months; B. Art 356(4) - 6 months extension each time; C. After 44th Amendment max 3 years; D. 68th Amendment (1991) - for Punjab extended from 3 to 5 years. Which statement is incorrect?", "options": ["A बरोबर आहे", "B बरोबर आहे", "C मध्ये 3 वर्षे मर्यादा सांगितली ती चूक — 1 वर्षेच आहे", "D बरोबर आहे"], "correct_index": 2, "explanation_marathi": "C सत्य — 44व्या दुरुस्तीने 3 वर्षे मर्यादा पुन्हा आणली (1976 पूर्वी 1 वर्षे होती). त्यामुळे 'C चूक' म्हणणारा पर्याय स्वतः चूक आहे.", "evidence": "Constitution Arts 356(3), 356(4); 44th Amendment 1978; 68th Amendment 1991"}, {"section": 6, "subtopic": "Kalam 360 Vittiya Aanibani", "qtype": "bahu-vidhan", "q_marathi": "कलम 360 (वित्तीय आणीबाणी) संदर्भात: I. राष्ट्रपतींना देशाची वित्तीय स्थिरता धोक्यात असल्याची खात्री झाल्यास 360 लागू करता येते, संसदेच्या 2 महिन्यांत मान्यतेने. II. आतापर्यंत (2026 पर्यंत) भारतात एकदाही वित्तीय आणीबाणी लागू झालेली नाही. III. आणीबाणीत केंद्र राज्यांच्या वित्तीय व्यवहारांवर निर्देश देऊ शकते आणि सर्वोच्च/उच्च न्यायालयाच्या न्यायाधीशांसह सर्वांच्या वेतनात कपात करण्याचे निर्देश देऊ शकते. योग्य पर्याय:", "q_english": "On Art 360 (financial emergency): I. President can impose if financial stability threatened, with Parliament approval within 2 months. II. No financial emergency imposed in India till 2026. III. Centre can direct states on financial matters and reduce salaries of all including SC/HC judges. Choose correct:", "options": ["I आणि II बरोबर", "फक्त II बरोबर", "I, II, III सर्व बरोबर", "फक्त I आणि III बरोबर"], "correct_index": 2, "explanation_marathi": "I सत्य — 360 प्रक्रिया, II सत्य — एकदाही लागू नाही, III सत्य — 360(4) नुसार वेतन कपात निर्देश.", "evidence": "Constitution Art 360; no financial emergency till 2026"}, {"section": 6, "subtopic": "Kalam 368 Ghatanadurusti prakriya", "qtype": "jodya lava", "q_marathi": "जोड्या लावा: A. कलम 368(2) मुख्य भाग 1. एकूण सदस्यसंख्येचे बहुमत + उपस्थित 2/3; B. कलम 368 परंतुक 2. निम्म्या राज्यांची मान्यता आवश्यक (54,55,73,162,241, सातवी अनुसूची); C. कलम 368 बाहेर साधे बहुमत 3. नवीन राज्य निर्मिती (कलम 3); D. मूलभूत संरचना 4. केशवानंद भारती (1973). योग्य जोडी:", "q_english": "Match: A. Art 368(2) main - 1. Majority of total + 2/3 present; B. Art 368 proviso - 2. Half states ratification (Arts 54,55,73,162,241, Seventh Schedule); C. Simple majority outside 368 - 3. New state creation (Art 3); D. Basic structure - 4. Kesavananda Bharati (1973). Correct match:", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-3, D-4", "A-1, B-3, C-2, D-4", "A-4, B-2, C-1, D-3"], "correct_index": 0, "explanation_marathi": "368(2) विशेष बहुमत, परंतुक राज्य मान्यता, साधे बहुमत कलम 3, मूलभूत संरचना केशवानंद.", "evidence": "Constitution Arts 368, 3; Kesavananda Bharati 1973"}, {"section": 6, "subtopic": "Rajyapal adhikar Art 153-161", "qtype": "bahu-vidhan", "q_marathi": "राज्यपालांबाबत विधाने: A. कलम 153 नुसार प्रत्येक राज्याला राज्यपाल असेल, पण 7व्या दुरुस्ती (1956) नंतर एक व्यक्ती दोन किंवा अधिक राज्यांचा राज्यपाल होऊ शकते. B. कलम 155 नुसार राष्ट्रपतींकडून नियुक्ती, 156 नुसार 5 वर्षे कालावधी पण राष्ट्रपतींच्या मर्जीपर्यंत. C. कलम 161 नुसार राज्यपालांना क्षमादानाचा (राज्य कायद्याविरुद्ध अपराध) अधिकार असतो. D. राज्यपाल हा केंद्र सरकारचा प्रतिनिधी नसून राज्याचा घटनात्मक प्रमुख असतो. योग्य पर्याय:", "q_english": "On Governor: A. Under Art 153 each state has Governor, but after 7th Amendment (1956) one person can be Governor of two or more states. B. Under Art 155 appointment by President, under Art 156 5-year term but at pleasure of President. C. Under Art 161 power to pardon offences against state laws. D. Governor is not Centre's agent but constitutional head of state. Choose correct:", "options": ["A, B, C बरोबर; D चूक (राज्यपाल केंद्राचे प्रतिनिधीही असतात - दुहेरी भूमिका)", "A, B, C, D सर्व बरोबर", "फक्त A आणि B बरोबर", "फक्त C आणि D बरोबर"], "correct_index": 0, "explanation_marathi": "A,B,C सत्य. D चूक — राज्यपालाची दुहेरी भूमिका आहे — राज्याचा घटनात्मक प्रमुख + केंद्राचा प्रतिनिधी.", "evidence": "Constitution Arts 153-161; 7th Amendment 1956"}, {"section": 6, "subtopic": "Maharashtra Zilla Parishad Panchayat Samiti 1961", "qtype": "bahu-vidhan", "q_marathi": "महाराष्ट्र जिल्हा परिषद व पंचायत समिती अधिनियम 1961 बाबत: A. महाराष्ट्रात त्रिस्तरीय पंचायत राज - ग्रामपंचायत (1959 कायदा), पंचायत समिती (गट स्तर), जिल्हा परिषद (जिल्हा स्तर). B. जिल्हा परिषदेत अध्यक्ष/उपाध्यक्षांची निवड सदस्यांमधून होते, कार्यकाळ 5 वर्षे. C. पंचायत समितीचा सभापती हा जिल्हा परिषद सदस्य नसतो, परंतु जिल्हा परिषदेत त्याला पदसिद्ध सदस्यत्व नसते. D. जिल्हा परिषदेचे मुख्य कार्यकारी अधिकारी (CEO) हे जिल्ह्याचे जिल्हाधिकारी असतात. योग्य पर्याय:", "q_english": "On Maharashtra ZP and PS Act 1961: A. Three-tier PR - Gram Panchayat (1959 Act), Panchayat Samiti (block), Zilla Parishad (district). B. ZP President/Vice elected from members, 5-year term. C. Panchayat Samiti Chairperson is not ZP member and has no ex-officio membership in ZP. D. CEO of ZP is District Collector. Choose correct:", "options": ["A, B आणि C बरोबर; D चूक (CEO हा IAS संवर्गाचा स्वतंत्र अधिकारी असतो, जिल्हाधिकारी नाही)", "A, B, C, D सर्व बरोबर", "फक्त A आणि B बरोबर", "फक्त C आणि D बरोबर"], "correct_index": 0, "explanation_marathi": "A,B,C सत्य — त्रिस्तरीय रचना, अध्यक्ष निवड, पंचायत समिती सभापती हा ZP मध्ये सहयोगी सदस्य (Associate) असतो पण मतदान नाही. D चूक — CEO हा IAS/वरिष्ठ अधिकारी, जिल्हाधिकारी वेगळा.", "evidence": "Maharashtra Zilla Parishad and Panchayat Samiti Act, 1961; Maharashtra Gram Panchayat Act, 1959"}, {"section": 6, "subtopic": "Maharashtra Gram Panchayat 1959 Sarpanch", "qtype": "takta aadharit", "q_marathi": "महाराष्ट्र ग्रामपंचायत (1959) - सरपंच निवडीचा तक्ता: A. 2017 पूर्वी - ग्रामपंचायत सदस्यांमधून सरपंच निवड; B. 2017-2020 - थेट जनतेतून सरपंच निवड; C. 2020 नंतर - सदस्यांमधून निवड पुन्हा; D. 2022 मध्ये शिंदे सरकारने थेट निवड पुनर्स्थापित केली. खालीलपैकी बरोबर कोणते?", "q_english": "Maharashtra Gram Panchayat (1959) - Sarpanch election table: A. Before 2017 - elected from members; B. 2017-2020 - direct from people; C. After 2020 - again from members; D. In 2022 Shinde govt restored direct election. Which is correct?", "options": ["A, B, C, D सर्व बरोबर", "फक्त A आणि B बरोबर", "फक्त B आणि C बरोबर", "फक्त A आणि D बरोबर"], "correct_index": 0, "explanation_marathi": "तिन्ही टप्पे व 2022 चा GR बरोबर — 2017 फडणवीस थेट निवड, 2020 ठाकरे सदस्यांतून, 2022 शिंदे पुन्हा थेट निवड पुनर्स्थापना.", "evidence": "Maharashtra Govt GR - Gram Panchayat Sarpanch direct election 2017, 2020, 2022"}, {"section": 7, "subtopic": "Economics Kalkram: World Bank-IMF-UNO-WTO", "qtype": "kalkram-lava", "q_marathi": "योग्य कालक्रम लावा: 1. जागतिक बँकेची स्थापना, 2. IMF ची स्थापना, 3. संयुक्त राष्ट्रांची स्थापना, 4. WTO ची स्थापना", "q_english": "Arrange chronologically: 1. World Bank establishment, 2. IMF establishment, 3. UN establishment, 4. WTO establishment", "options": ["1-2-3-4", "2-1-3-4", "4-1-2-3", "1-2-4-3"], "correct_index": 0, "explanation_marathi": "योग्य क्रम 1-2-3-4 — जागतिक बँक व IMF दोन्ही 1944 मध्ये ब्रेटन वुड्स कराराने (जागतिक बँक डिसेंबर 1945, IMF मार्च 1947 पासून कार्यान्वित), UNO 1945 आणि WTO 1995.", "evidence": "Bretton Woods 1944, UNO 1945, WTO 1995"}, {"section": 7, "subtopic": "Economics Panchvarshik Yojana model", "qtype": "jodya-lava", "q_marathi": "पंचवार्षिक योजनांच्या प्रारूपाच्या जोड्या लावा: (A) पहिली योजना, (B) दुसरी योजना, (C) पाचवी योजना, (D) बारावी योजना; (1) हॅरॉड-डोमर, (2) महालनोबिस, (3) डी.पी. धर प्रारूप, (4) समावेशी विकास (Inclusive Growth).", "q_english": "Match Five Year Plan models: (A) First Plan, (B) Second Plan, (C) Fifth Plan, (D) Twelfth Plan; (1) Harrod-Domar, (2) Mahalanobis, (3) D.P. Dhar model, (4) Inclusive Growth.", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-4, D-3", "A-1, B-3, C-2, D-4", "A-4, B-3, C-2, D-1"], "correct_index": 0, "explanation_marathi": "पहिली हॅरॉड-डोमर, दुसरी महालनोबिस, पाचवी डी.पी. धर, बारावी समावेशी विकास.", "evidence": "Planning Commission Five Year Plan documents"}, {"section": 7, "subtopic": "Maharashtra Arthik Pahani 2024-25", "qtype": "bahu-vidhan", "q_marathi": "महाराष्ट्र आर्थिक पाहणी 2024-25 मधील दाव्यांबाबत विधाने: I. राज्याचे GSDP 2024-25 मध्ये 7.3% वाढीचा अंदाज; II. कृषी व संलग्न क्षेत्राचा वाटा सुमारे 12% आणि वाढ 8.7%; III. राज्याची प्रतिडोई उत्पन्न ₹2,78,681 (2023-24) असून देशात सर्वाधिक आहे. बरोबर कोणती?", "q_english": "On Maharashtra Economic Survey 2024-25 claims: I. State GSDP growth 7.3% in 2024-25; II. Agri and allied share ~12% and growth 8.7%; III. Per capita income Rs.2,78,681 (2023-24) highest in country. Which are correct?", "options": ["फक्त I आणि II बरोबर; III चूक", "I, II, III सर्व बरोबर", "फक्त I बरोबर", "फक्त II आणि III बरोबर"], "correct_index": 0, "explanation_marathi": "I व II सत्य — GSDP 7.3%, कृषी वाटा 12% वाढ 8.7% हे पाहणीतील आकडे. III चूक कारण प्रतिडोई उत्पन्न ₹2,78,681 हे जास्त असले तरी सर्वाधिक नाही — तेलंगणा/कर्नाटक यांचे जास्त आहे.", "evidence": "Maharashtra Economic Survey 2024-25, Directorate of Economics and Statistics, GoM"}, {"section": 7, "subtopic": "UPI and Payment Systems", "qtype": "jodya-lava", "q_marathi": "जोड्या लावा: (A) UPI (B) IMPS (C) BBPS (D) NACH यांच्या (1) त्वरित 24×7 निधी हस्तांतरण (2) एकीकृत देयक प्रणाली (3) भारत बिल पेमेंट सिस्टम (4) बल्क/आवर्ती पेमेंट (ECS उत्तराधिकारी) यांच्याशी :", "q_english": "Match: (A) UPI (B) IMPS (C) BBPS (D) NACH with (1) Immediate 24x7 fund transfer (2) Unified Payments Interface (3) Bharat Bill Payment System (4) Bulk/recurring payments (ECS successor):", "options": ["A-1, B-2, C-4, D-3", "A-2, B-1, C-3, D-4", "A-2, B-4, C-3, D-1", "A-1, B-4, C-2, D-3"], "correct_index": 1, "explanation_marathi": "UPI एकीकृत देयक, IMPS त्वरित 24×7, BBPS बिल पेमेंट, NACH बल्क पेमेंट.", "evidence": "NPCI product guides 2024; RBI payment systems"}, {"section": 7, "subtopic": "GST rates rationalisation 2025", "qtype": "kalkram-lava", "q_marathi": "GST दर सुसूत्रीकरण मंत्रीगट (GoM) शिफारशीचा कालक्रम लावा: A. मंत्रीगट स्थापना (सप्टेंबर 2021), B. मंत्रीगटाचा अहवाल सादर (डिसेंबर 2024), C. 56वी GST परिषद बैठक (3-4 सप्टेंबर 2025) — 5% व 18% असे 2 स्लॅब, D. नवीन दरांची अंमलबजावणी (22 सप्टेंबर 2025).", "q_english": "Arrange chronology of GST rate rationalisation GoM recommendation: A. GoM constituted (Sep 2021), B. GoM report submitted (Dec 2024), C. 56th GST Council meeting (3-4 Sep 2025) — 2 slabs of 5% and 18%, D. Implementation of new rates (22 Sep 2025).", "options": ["A-C-B-D", "A-B-C-D", "B-A-C-D", "A-B-D-C"], "correct_index": 1, "explanation_marathi": "A-B-C-D क्रम — 2021 स्थापना, 2024 अहवाल, सप्टेंबर 2025 परिषद 2 स्लॅब निर्णय (विशेष 40% स्लॅबसह), 22 सप्टेंबर 2025 पासून अंमल.", "evidence": "GST Council 56th meeting, 3-4 Sep 2025; PIB 4 Sep 2025 – GST 2.0"}, {"section": 7, "subtopic": "Lending and NBFC", "qtype": "bahu-vidhan", "q_marathi": "खालील विधाने विचारात घ्या: A. मुद्रा योजना (MUDRA) अंतर्गत शिशु (₹50,000 पर्यंत), किशोर (₹50,000-5 लाख) व तरुण (₹5-10 लाख, 2024 मध्ये 20 लाखांपर्यंत वाढ) असे तीन गट आहेत. B. स्टँड-अप इंडिया अंतर्गत प्रत्येक बँक शाखेकडून किमान एक SC/ST व एक महिला उद्योजकाला ₹10 लाख ते ₹1 कोटी कर्ज. C. NBFC ही बँकिंग नियमन कायदा, 1949 च्या कलम 45-I अंतर्गत नोंदणीकृत संस्था आहे आणि तिला मागणी ठेवी स्वीकारण्यास मनाई आहे. योग्य पर्याय:", "q_english": "Consider statements: A. Under MUDRA Yojana, Shishu (up to Rs.50,000), Kishore (Rs.50k-5 lakh) and Tarun (Rs.5-10 lakh, increased to Rs.20 lakh in 2024) are three categories. B. Under Stand-Up India, each bank branch to lend Rs.10 lakh to Rs.1 crore to at least one SC/ST and one woman entrepreneur. C. NBFC is registered under Sec 45-I of Banking Regulation Act, 1949 and cannot accept demand deposits. Choose correct:", "options": ["A आणि B बरोबर; C चूक", "A आणि C बरोबर; B चूक", "A, B आणि C सर्व बरोबर", "फक्त A बरोबर"], "correct_index": 2, "explanation_marathi": "तिन्ही सत्य — मुद्रा 3 गट (2024 मध्ये तरुण 20 लाख), स्टँड-अप प्रत्येक शाखा 2 कर्ज, NBFC 45-I नोंदणी व मागणी ठेव बंदी.", "evidence": "MUDRA guidelines (SIDBI); Stand-Up India scheme; RBI NBFC registration Sec 45-I BR Act"}, {"section": 7, "subtopic": "Digital Rupee CBDC", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): डिजिटल रुपया (e₹) हे RBI ने जारी केलेले कायदेशीर चलन असून त्याचे मूल्य भौतिक रोख रकमेइतकेच आहे.\nकारण (R): e₹-W (घाऊक) व e₹-R (किरकोळ) असे दोन प्रकार असून किरकोळ e₹ हा ग्राहकांच्या दैनंदिन व्यवहारांसाठी आहे.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): Digital Rupee (e₹) is legal tender issued by RBI with same value as physical cash.\nReason (R): e₹-W (wholesale) and e₹-R (retail) are two types, with retail e₹ for consumer daily transactions.\nChoose correct option:", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण नाही", "A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य — e₹ कायदेशीर चलन व RBI दायित्व. R सत्य — घाऊक व किरकोळ प्रकार. पण R हे A च्या मूल्य-समानतेचे कारण नाही, प्रकारांचे वर्णन आहे.", "evidence": "RBI Concept Note on CBDC, 2022; e₹ pilot Dec 2022"}, {"section": 7, "subtopic": "RBI MPC framework", "qtype": "takta aadharit", "q_marathi": "RBI च्या चलनविषयक धोरण समिती (MPC) संदर्भातील तक्ता तपासा: (A) स्थापना - 2016, वित्तीय धोरण आराखडा करार (अरुण जेटली-रघुराम राजन) (B) रचना - 3 RBI + 3 केंद्र सरकार नियुक्त (C) अध्यक्ष - RBI गव्हर्नर (D) निर्णय - प्रत्येक सदस्याचा मत व कारणे जाहीर. खालीलपैकी अयोग्य विधान कोणते?", "q_english": "Examine table on RBI MPC: (A) Established - 2016, Monetary Policy Framework Agreement (Jaitley-Rajan) (B) Composition - 3 RBI + 3 Central Govt nominees (C) Chair - RBI Governor (D) Decision - each member's vote and rationale published. Which statement is incorrect?", "options": ["A चूक आहे", "B चूक आहे", "C चूक आहे", "D चूक आहे"], "correct_index": 3, "explanation_marathi": "A,B,C सत्य. D ही सत्य असली तरी तक्त्यातील 'अयोग्य' शोधण्याच्या प्रश्नात D ही सत्य म्हणून 'D चूक' म्हणणे हे स्वतः चूक विधान आहे.", "evidence": "RBI Act 1934 amended 2016 - MPC sections 45ZB-45ZI; MPC framework agreement Feb 2015"}, {"section": 7, "subtopic": "RBI CRR-SLR-LAF-MS", "qtype": "jodya lava", "q_marathi": "जोड्या लावा: (A) CRR (B) SLR (C) LAF (D) MSF यांच्या (1) निव्वळ मागणी व मुदत दायित्वांच्या % रोख राखीव (RBI कडे) (2) सरकारी रोखे/सोने यात राखीव (3) रेपो व रिव्हर्स रेपो द्वारे तरलता समायोजन (4) दंडात्मक रात्रीभर कर्ज सुविधा (SLR मधून) यांच्याशी :", "q_english": "Match: (A) CRR (B) SLR (C) LAF (D) MSF with (1) % of NDTL as cash reserve with RBI (2) Reserve in govt securities/gold (3) Liquidity adjustment via repo and reverse repo (4) Penal overnight borrowing facility (from SLR):", "options": ["A-2, B-1, C-3, D-4", "A-1, B-2, C-4, D-3", "A-1, B-2, C-3, D-4", "A-4, B-2, C-1, D-3"], "correct_index": 2, "explanation_marathi": "CRR रोख राखीव RBI कडे, SLR रोखे सोने, LAF रेपो रिव्हर्स रेपो, MSF दंडात्मक रात्रीभर SLR मधून.", "evidence": "RBI Master Directions CRR/SLR, LAF/MSF framework"}, {"section": 7, "subtopic": "Treasury Bills", "qtype": "bahu-vidhan", "q_marathi": "ट्रेझरी बिलांबाबत खालील विधाने विचारात घ्या: A. केंद्र सरकार अल्पकालीन निधी उभारणीसाठी T-Bill जारी करते. B. 91, 182, 364 दिवसांचे T-Bill उपलब्ध असतात. C. ते शून्य-कूपन असून सवलतीवर (discount) जारी होतात. D. राज्य सरकारेही T-Bill जारी करतात. योग्य पर्याय:", "q_english": "On Treasury Bills, consider: A. Central Govt issues T-Bills for short-term funds. B. 91, 182, 364-day T-Bills available. C. Zero-coupon issued at discount. D. State Govts also issue T-Bills. Choose correct:", "options": ["A, B, C बरोबर; D चूक (राज्ये Dated Securities/WMA वापरतात)", "A, B, C, D सर्व बरोबर", "फक्त A आणि B बरोबर", "फक्त C आणि D बरोबर"], "correct_index": 0, "explanation_marathi": "A,B,C सत्य — केंद्र T-Bill सवलतीवर जारी. D चूक — राज्ये T-Bill नाही, तर राज्य विकास कर्ज (SDL) व WMA.", "evidence": "RBI - Treasury Bills, issued by Central Govt at discount"}, {"section": 7, "subtopic": "Government Securities G-Sec yield-price inverse", "qtype": "Assertion-Reason", "q_marathi": "विधान (A): सरकारी रोख्याचा यील्ड वाढल्यास त्याची बाजार-किंमत घटते.\nकारण (R): RBI ने खुले बाजार व्यवहार (OMO) मध्ये G-Sec विकल्यास प्रणालीतील तरलता कमी होते आणि यील्ड वाढतो.\nयोग्य पर्याय निवडा:", "q_english": "Assertion (A): When G-Sec yield rises, its market price falls.\nReason (R): When RBI sells G-Secs in OMO, system liquidity falls and yield rises.\nChoose correct option:", "options": ["A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण नाही", "A आणि R दोन्ही सत्य असून R हे A चे योग्य स्पष्टीकरण आहे", "A सत्य, R असत्य", "A असत्य, R सत्य"], "correct_index": 0, "explanation_marathi": "A सत्य किंमत यील्ड व्यस्त, R सत्य OMO विक्री तरलता शोषण यील्ड वाढ. पण R हे A च्या व्यस्त संबंधाचे स्पष्टीकरण नाही, तरलता परिणाम आहे.", "evidence": "RBI - G-Sec market primer (inverse price-yield); RBI OMO guidelines"}, {"section": 7, "subtopic": "Mutual Fund NAV calculation", "qtype": "bahu-vidhan", "q_marathi": "म्युच्युअल फंड NAV बाबत: A. NAV = (एकूण मालमत्ता - देयता) / थकबाकी युनिट्स. B. इक्विटी फंडाचा NAV दररोज बाजार बंदनंतर जाहीर होतो. C. लिक्विड फंडाचा NAV दिवसातून दोनदा जाहीर होतो. D. 1 फेब्रुवारी 2021 पासून खरेदी NAV अर्ज वेळेवर नव्हे तर निधी प्राप्ती वेळेवर ठरतो. योग्य पर्याय:", "q_english": "On Mutual Fund NAV: A. NAV = (Total Assets - Liabilities)/Outstanding Units. B. Equity fund NAV declared daily after market close. C. Liquid fund NAV declared twice a day. D. From 1 Feb 2021 purchase NAV based on fund realization time not application time. Choose correct:", "options": ["A, B, C, D सर्व बरोबर", "फक्त A, B, D बरोबर; C चूक", "फक्त A आणि B बरोबर", "फक्त C आणि D बरोबर"], "correct_index": 0, "explanation_marathi": "A,B,C,D चारही सत्य — NAV सूत्र, इक्विटी दैनिक, लिक्विड पूर्वी दिवसातून दोनदा (आता दैनिकच पण जुनी संकल्पना), 2021 पासून realization आधारित NAV.", "evidence": "SEBI Mutual Fund Master Circular; NAV realization circular 17 Sep 2020"}, {"section": 7, "subtopic": "Banking NPA 90 days classification", "qtype": "bahu-vidhan", "q_marathi": "बँकिंग NPA बाबत: A. 90 दिवसांहून अधिक काळ थकबाकी राहिल्यास कर्ज NPA मानले जाते. B. NPA चे उप-प्रकार: अवमानक (Sub-standard), संशयास्पद (Doubtful), तोट्यातील (Loss). C. कृषी कर्जासाठी पीक हंगामानुसार 2 पीक हंगामांची मर्यादा NPA साठी वापरली जाते. D. NPA ला 'गैर-निष्पादक मालमत्ता' म्हणतात. योग्य पर्याय:", "q_english": "On Banking NPA: A. Loan considered NPA if overdue >90 days. B. NPA sub-types: Sub-standard, Doubtful, Loss. C. For agri loans, 2 crop seasons limit used for NPA. D. NPA means Non-Performing Asset. Choose correct:", "options": ["A, B आणि D बरोबर; C चूक", "A, B, C, D सर्व बरोबर", "फक्त A आणि B बरोबर", "फक्त C आणि D बरोबर"], "correct_index": 1, "explanation_marathi": "चारही सत्य — 90 दिवस निकष, उप-प्रकार, कृषी 2 हंगाम (अल्प व दीर्घ मुदत), NPA व्याख्या.", "evidence": "RBI Master Circular - IRAC norms (Income Recognition and Asset Classification)"}, {"section": 7, "subtopic": "Insurance FDI IRDAI solvency", "qtype": "jodya lava", "q_marathi": "जोड्या लावा: A. विमा क्षेत्रातील FDI मर्यादा (2021 नंतर) 1. 74%; B. विमा कंपन्यांसाठी किमान सॉल्व्हन्सी रेशो 2. 1.5; C. IRDAI स्थापना कायदा 3. IRDA कायदा 1999; D. LIC स्थापना 4. LIC कायदा 1956.", "q_english": "Match: A. FDI limit in insurance (after 2021) - 1. 74%; B. Minimum solvency ratio for insurers - 2. 1.5; C. IRDAI Act - 3. IRDA Act 1999; D. LIC establishment - 4. LIC Act 1956.", "options": ["A-1, B-2, C-3, D-4", "A-2, B-1, C-4, D-3", "A-1, B-2, C-4, D-3", "A-4, B-2, C-1, D-3"], "correct_index": 0, "explanation_marathi": "FDI 74% 2021, सॉल्व्हन्सी 1.5, IRDA 1999, LIC 1956.", "evidence": "IRDAI Insurance Amendment Act 2021; IRDAI Solvency Margin Regulatio <script>\nconst QUESTIONS_N = JSON.parse(document.getElementById('quiz-data').textContent);\nlet currentFilter='all';\nconst sectionNames={3:\"3. चालू घडामोडी\",4:\"4. इतिहास\",5:\"5. भूगोल\",6:\"6. राज्यशास्त्र\",7:\"7. अर्थशास्त्र\",8:\"8. सामान्य विज्ञान\"};\nconst filtersEl=document.getElementById('filters'),quizEl=document.getElementById('quiz'),progressEl=document.getElementById('progress');\nfunction renderFilters(){\nconst a=document.createElement('button');a.className='filter-btn'+(currentFilter==='all'?' active':'');a.textContent='सर्व (90)';a.onclick=()=>{currentFilter='all';renderFilters();renderQuiz()};filtersEl.appendChild(a);\n[3,4,5,6,7,8].forEach(s=>{const b=document.createElement('button');b.className='filter-btn'+(currentFilter===s?' active':'');b.textContent=sectionNames[s]+' (15)';b.onclick=()=>{currentFilter=s;renderFilters();renderQuiz()};filtersEl.appendChild(b)});\n}\nfunction renderQuiz(){\nconst qs=QUESTIONS_N.filter(q=>currentFilter==='all'||q.section===currentFilter);\nprogressEl.textContent='संच N • दाखवलेले प्रश्न: '+qs.length+' / 90';\nquizEl.innerHTML='';\nqs.forEach((q,idx)=>{\nconst card=document.createElement('div');card.className='qcard';\nconst letters=['A','B','C','D'];\nlet oh='';\ntry{oh=q.options.map((op,i)=>'<div class=\"opt\"><span class=\"opt-letter\">'+letters[i]+'.</span><span>'+String(op).replace(/\\n/g,'<br>')+'</span></div>').join('')}catch(e){oh='<div>पर्याय लोड करण्यात अडचण</div>'}\nconst qm=String(q.q_marathi||'').replace(/\\n/g,'<br>');\nconst qe=String(q.q_english||'').replace(/\\n/g,'<br>');\nconst expl=String(q.explanation_marathi||'').replace(/\\n/g,'<br>');\nconst evi=String(q.evidence||'').replace(/\\n/g,'<br>');\nconst sub=String(q.subtopic||'');const qt=String(q.qtype||'');\nconst correctOpt=(q.options&&q.options[q.correct_index])?String(q.options[q.correct_index]):'';\ncard.innerHTML='<div class=\"qmeta\"><span class=\"badge\">'+(sectionNames[q.section]||('Sec '+q.section))+'</span><span class=\"badge type\">'+qt+'</span><span class=\"badge diff\">कठीणता 5/5</span><span class=\"badge\" style=\"background:#f3e5f5;color:#6a1b9a\">'+sub+'</span></div><div class=\"qtext\"><b>प्रश्न '+(idx+1)+'.</b> '+qm+'<span class=\"en\">'+qe+'</span></div><div>'+oh+'</div><button class=\"show-ans\">उत्तर पहा</button><div class=\"ansbox\"><div class=\"correct\">✅ योग्य उत्तर: '+letters[q.correct_index]+' – '+correctOpt+'</div><div class=\"expl\"><b>स्पष्टीकरण:</b> '+expl+'</div><div class=\"evi\">पुरावा: '+evi+'</div></div>';\nquizEl.appendChild(card);\nconst btn=card.querySelector('.show-ans'),box=card.querySelector('.ansbox');\nbtn.onclick=()=>{box.classList.toggle('visible');btn.textContent=box.classList.contains('visible')?'उत्तर लपवा':'उत्तर पहा'};\ncard.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected')}});\n});}\n(function(){const st=document.createElement('style');st.textContent='.ansbox{display:none;margin-top:12px;padding:12px;border-radius:8px;background:#e8f5e9;border:1px solid #c8e6c9}.ansbox.visible{display:block}.correct{font-weight:700;color:#2e7d32;margin-bottom:8px}.expl{font-size:14px;margin-bottom:6px}.evi{font-size:12.5px;color:#555;font-style:italic}';document.head.appendChild(st);})();\nrenderFilters();renderQuiz();\n</script>\n</body>\n</html>\n"}
